# 脚手架模板 —— 复制这个目录来新增一门语言
#
#   1. cp -r content/languages/_template content/languages/<新语言 id>
#   2. 把下面的 id 改成新语言的 id（必须与目录名一致）
#   3. 按板块填内容：content/languages/<id>/<板块>/<章节>.yaml
#      （章节与 feature 清单见 content/catalog/<板块>.yaml，文件名即章节 id）
#   4. 在 content/registry.yaml 的 languages 段登记 + 设 enabled
#   5. npm run content:build && npm run verify:ext
#
# 基准固定为 JavaScript / Python / Java 三门，不再增减 —— 加一个基准等于让
# **每一门语言**各补一份差异说明，是 N 倍成本。因此新语言一律是**对比列**语言
# （下面 baseline 保持 false）：写全三份 vs，不必写 baseline。
#
# 以 `_` 开头的目录是「私有目录」：默认构建与校验都会跳过它，
# 所以这份模板不会被当成一门真语言渲染出来，也不会因残留而破坏校验。
id: _template
name: 语言名称
shortName: 短名
aliases: []
version: '1.0'
fileExtension: .xx
comment:
  line: '//'
  block: ['/*', '*/']
shikiLang: text
paradigm: []
typing: dynamic
memoryModel: gc
concurrency: []
# 基准候选资格。基准固定为三门，新语言一律留 false。
baseline: false
links:
  - label: 官方文档
    url: https://example.com/
