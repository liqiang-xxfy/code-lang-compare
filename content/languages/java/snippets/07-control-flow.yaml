- featureId: basics/switch-match
  equivalence: divergent
  code: |
    // 传统 switch：必须 break，否则会**穿透**到下一个 case
    switch (day) {
        case MON:
            System.out.println("周一");
            break;                 // @note! 忘了 break 就继续往下执行
        default:
            System.out.println("其他");
    }

    // Java 14+ 的 switch 表达式：箭头形式，不穿透，还能直接返回值
    String name = switch (day) {
        case MON, TUE -> "工作日";
        case SAT, SUN -> "周末";
        default -> "未知";
    };

    // @note! Java 的 switch 能匹配 String / enum，但**不能匹配任意对象结构**
    //        （Rust 的 match 可以解构，这是两者最大的差距）
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

