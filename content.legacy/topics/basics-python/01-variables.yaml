id: basics-python/01-variables
topicId: basics-python
title: 变量与声明
order: 1
summary: 赋值即绑定、函数级作用域、没有常量语法——从 Python 出发看其余语言的这一层

features:
  - id: basics-python/var-declaration
    title: 变量声明
    kind: syntax
    summary: Python 没有声明语句，赋值本身就是声明

  - id: basics-python/var-scope
    title: 作用域
    kind: behavior
    summary: 块不产生作用域，函数才是边界

  - id: basics-python/hoisting
    title: 变量提升
    kind: behavior
    summary: Python 没有编译期提升，只有运行时名字查找

  - id: basics-python/const-immutability
    title: 常量与不可变性
    kind: behavior
    summary: 没有常量语法，不可变靠类型而不是靠声明

  - id: basics-python/naming-convention
    title: 命名与大小写惯例
    kind: syntax
    summary: snake_case vs camelCase

  - id: basics-python/var-destructuring
    title: 解包赋值
    kind: syntax
    summary: Python 的可迭代解包比 JS 的数组解构更强，但没有按键解构

  - id: basics-python/var-multiple-assign
    title: 多重赋值与交换
    kind: syntax
    summary: a, b = b, a 靠「先构造元组再解包」

  - id: basics-python/var-global-declaration
    title: 全局变量与 global
    kind: behavior
    summary: 函数内赋值默认创建局部名字，要改外层必须显式声明

  - id: basics-python/var-shadowing
    title: 变量遮蔽
    kind: behavior
    summary: 遮蔽内置名是 Python 特有的高危操作
