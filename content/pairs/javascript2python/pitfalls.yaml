# 迁移陷阱 —— 带着 JavaScript 的习惯写 Python 会踩的坑
# 组织方式：按「症状」索引（症状 → 原因 → 解法），而不是按语法点
# severity: 1 = 一般 / 2 = 经常踩 / 3 = 必踩（对应界面上的 ⭐ 数量）
#
# 只讲本方向的两门语言（R5 会拦 glossary 里的第三门，陷阱靠人守）：
# 一条只在一个方向上成立的坑，提到屏幕外的语言会让读者以为那里也会踩到。

- id: pitfall-truthiness-empty-container
  title: 空数组 / 空字典的判断结果反了
  symptom: |
    JS 里习惯写 `if (arr)` 判非空，迁移到 Python 后 `if arr:` 看起来是同一个写法，
    语义却完全相反 —— 空列表在 Python 里是假值。
  cause: |
    JS 的假值只有 8 个原始值（`false` / `0` / `-0` / `0n` / `""` / `null` / `undefined` / `NaN`），
    对象与数组**永远是真值**；Python 的 `__bool__` 由容器长度决定，空容器为假。
  fix: |
    JS 里判数组非空必须写 `arr.length > 0`，`if (arr)` 一直是错的（只是它看起来能用）。
    迁到 Python 后可以直接写 `if arr:` —— 注意**这不是「照搬出错」，而是「JS 的坏习惯
    在 Python 里恰好变对了」**；真正踩坑的是反向迁移的人。
  severity: 3
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/logical
  tags: [真值, 集合, 运算符]

- id: pitfall-equality-coercion
  title: 相等比较的隐式转换让判断失效
  symptom: '`1 == "1"` 与 `"" == 0` 都返回 true；字符串和数字比较不报错，只是结果不符合预期。'
  cause: |
    JS 的 `==` 按规范做类型转换，这一层是隐式的；
    Python 的 `==` 只在数值类型之间兼容（`1 == 1.0` 为真），不会把字符串转成数字。
  fix: |
    JS 一律用 `===`，把 `==` 当笔误。
    Python 里反过来要小心误用 `is` —— 它判的是对象身份，不是值（见本方向另一条陷阱）。
  severity: 3
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/equality
  tags: [运算符, 类型]

- id: pitfall-is-identity
  title: 把 `===` 直译成 `is`，小数字碰巧对
  symptom: |
    `x is 1` 多数时候是 True，测试全绿；直到某个值来自计算或配置，
    同一个写法突然变成 False —— 而 `x == 1` 一直是对的。
  cause: |
    JS 的 `===` 是「值相同且类型相同」，直译到 Python 时最像的词看起来是 `is`，
    但 `is` 比的是**对象身份**（内存里是不是同一个对象）。CPython 会缓存
    -5 到 256 的整数与部分字符串，于是小值经常恰好是同一个对象、大值不是 ——
    表现就是「有时候对」。
  fix: |
    判值一律用 `==`，`is` 只留给单例：`None`、`True`、`False`。
    （`is None` 是特例：那里用 `==` 反而错，因为 `==` 可以被重载。）
  severity: 2
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/equality
  tags: [相等, 数值]

- id: pitfall-block-scope
  title: 出了 if 块，变量竟然还在
  symptom: |
    在 Python 里写 `if cond: x = 1`，然后在块外直接用 `x`，居然能拿到值；
    反过来在 JS 里同样的写法会 ReferenceError。
  cause: |
    JS 的 `let` / `const` 是块级作用域；
    Python 的块（`if` / `for` / `while`）**不产生新作用域** —— 只有函数、类、模块才产生。
  fix: |
    不要把 JS 的块级直觉带进 Python。迁移时把「变量的有效范围」这条判断
    从「看花括号」改成「看最近的函数边界」。
  severity: 3
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/scope
  tags: [作用域]

- id: pitfall-var-leak
  title: 循环变量的绑定被所有闭包共享
  symptom: |
    循环里给多个回调绑同一个循环变量，回调触发时全部拿到**最终值**，
    而写代码的人以为每个回调记住的是自己那一轮的值。
  cause: |
    JS 的 `var` 是函数级作用域且只有一份绑定，闭包捕获的是同一个变量；
    Python 的 `for` 变量同样是**函数作用域里的单个绑定**，于是闭包也共享。
  fix: |
    JS 侧用 `let` 替代 `var`（每次迭代新建绑定）。
    Python 侧没有对应的语法糖，要在循环体里显式造一个新绑定 ——
    最常见的是用默认参数把当前值「钉」进闭包：`lambda i=i: ...`，或用 `functools.partial`。
  severity: 2
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/closures
  tags: [闭包, 作用域]

- id: pitfall-division-by-zero
  title: 除以零在 JS 里静默产生 Infinity，在 Python 里直接崩
  symptom: |
    一段在 JS 里「跑得好好的」计算，移植到 Python 后抛 `ZeroDivisionError`，线上直接 500。
  cause: |
    JS 遵循 IEEE 754 的浮点语义，`1/0` 得 `Infinity`、`0/0` 得 `NaN`，都不是错误；
    Python 对整数除以零抛异常。
  fix: |
    两边都要改。JS 侧要把 `Infinity` 当错误显式处理（`Number.isFinite` 校验），
    别放任它流进下游；Python 侧要提前判零或用 try/except。
    **这是「看起来能跑」掩盖的定时炸弹** —— 在 JS 里它永远不会自己暴露。
  severity: 3
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/arithmetic
  tags: [数值, 异常]

- id: pitfall-integer-division
  title: 分页算出了小数页码
  symptom: |
    JS 里 `Math.floor(total / pageSize)` 直译成 Python 的 `total / pageSize`
    会得到浮点数，页码成了 `3.0`，拿它去索引或切片就报 TypeError。
    负数上更乱：`-7 / 2` 两边都是 `-3.5`，但取整方式不同 ——
    `Math.floor` 与 `//` 得 `-4`，`int()` 与 `Math.trunc` 得 `-3`。
  cause: |
    JS 只有一种数字类型，`/` 永远得浮点，取整是额外的一步。
    Python 的 `/` 是真除法，但**多了一个 `//`**（向下取整），
    而它与「先除再 `int()`」（向零取整）在负数上结果不同。
  fix: |
    要整除就写 `//`，不要写 `int(a / b)` —— 负数上语义不同。
    确实需要向零取整时显式写 `math.trunc(a / b)`，并把「它与 `//` 不同」
    写进注释，不然下一个人会以为这是同一件事。
  severity: 3
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/arithmetic
  tags: [数值, 运算符]

- id: pitfall-negative-modulo
  title: 负数取模的符号方向相反
  symptom: '`-7 % 2` 在 JS 是 `-1`，在 Python 是 `1`。分页、哈希、循环取余的逻辑会静默错位。'
  cause: |
    JS 的 `%` 是截断取余（结果符号跟被除数），
    Python 的 `%` 是向下取整取余（结果符号跟除数）。
  fix: |
    不要依赖语言的默认行为来保证非负。需要非负余数时显式写 `((a % b) + b) % b`，
    或在 Python 里用 `divmod` 把商与余数一次取出来、语义写在脸上。
  severity: 2
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/arithmetic
  tags: [运算符, 数值]

- id: pitfall-const-not-immutable
  title: const 声明的对象居然能被改
  symptom: |
    用 `const` 声明了一个配置对象，某个模块把它改了，其他地方全部受影响，全程没有任何报错。
  cause: |
    `const` 冻结的是**绑定**（不能重新赋值），不是对象内容。
    Python 干脆没有常量语法 —— 没有东西可冻结。
  fix: |
    JS 想真不可变要 `Object.freeze()`，且它只冻结第一层，深冻结得递归。
    Python 侧的不可变性来自**类型**而不是声明：`tuple` / `frozenset` / `str` 天生不可变，
    要固化一份配置就用它们，而不是指望某个关键字。
  severity: 2
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/mutability
  tags: [不可变, 声明]

- id: pitfall-string-join-order
  title: 拼接列表时主宾写反了
  symptom: |
    迁移后照 JS 习惯写 `["a","b"].join(",")`，在 Python 里报 `AttributeError`；
    反过来写 `",".join(list)` 在 JS 里也不成立。
  cause: |
    JS 把 join 定义在数组上（数组是主语）；
    Python 把 join 定义在分隔符字符串上（分隔符是主语）。
  fix: |
    记一句口诀：**JS 是「数组用分隔符连起来」，Python 是「分隔符把列表连起来」**。
    写反了会立刻报错，所以这条坑的代价只是别扭，不是静默出错。
  severity: 1
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/string-common-ops
  tags: [字符串]

- id: pitfall-string-contains
  title: 判断字符串包含，拿到了 -1
  symptom: |
    把 `"abc".includes("b")` 直译成 `"abc".find("b")`，再拿结果当布尔值用 ——
    `-1` 在 Python 里是真值，于是判断永远成立。
  cause: |
    JS 的 `includes` 返回布尔；
    Python 的 `find` 返回下标（找不到为 `-1`），两者名字像、返回值完全不同。
  fix: |
    Python 里判断包含用 `"b" in "abc"`；只有真的需要下标时才用 `find` / `index`。
  severity: 2
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/string-common-ops
  tags: [字符串, 真值]

- id: pitfall-optional-chaining-missing
  title: obj?.key 在 Python 里是语法错误
  symptom: |
    把带可选链的 JS 代码逐行翻译，Python 直接 SyntaxError；
    改用 `obj and obj.key` 绕过后，遇到合法的假值（`0`、`""`）又开始出错。
  cause: |
    Python 没有安全导航语法。而 `and` 短路返回的是**操作数本身**，
    会把 `0`、`""` 这类完全合法的值当成「没有」。
  fix: |
    取值用 `getattr(obj, "key", None)`，取字典项用 `(obj or {}).get("k")`；
    更推荐**把「可能缺失」显式建模成 `None` 并早返回**，让控制流一眼可见。
    判空一律用 `is None`，不要用假值短路。
  severity: 1
  languages: [javascript, python]
  fromBaseline: true
  featureId: express/null-and-undefined
  tags: [空值, 语法]
