# javascript —— basics/06-objects 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/object-create
    equivalence: identical
    code: |
      const literal = { name: 'Ada', age: 36 };
      const computed = { ['k' + 1]: 1 };        // 计算属性名
      const shorthand = { name };               // 简写：等价于 { name: name }

      // @note! 键只能是字符串或 Symbol。想用对象/数字当键必须上 Map
      const m = new Map();
      m.set(1, 'a');
      m.set({ id: 1 }, 'b');                    // 引用当键——取的时候必须是同一个对象

      // @note 整数样式的键会被提前排序：{ 2: 'a', 1: 'b' } 遍历顺序是 1, 2
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两者形状相似但约束不同：JS 的对象字面量**键只能是字符串或 Symbol**，
      想用对象做键必须上 `Map`；Python 的 `dict` 键可以是任意可哈希对象，数字、元组都能当键。
      另外 Python 的 `dict` 保证插入有序（3.7+），JS 对象也有序但存在「整数键被提前」的特殊规则。
  - featureId: basics-javascript/object-access
    equivalence: identical
    code: |
      const obj = { name: 'Ada' };

      obj.name;            // 'Ada'
      obj['name'];         // 'Ada'   —— @note 与点号完全等价
      obj.missing;         // undefined  —— @note! 缺失不报错，静默给 undefined

      obj?.name;           // 'Ada'   —— 可选链，obj 为 null/undefined 时整体是 undefined
      'name' in obj;       // true    —— @note 判断键是否存在，不能用 obj.name !== undefined
      Object.hasOwn(obj, 'name');   // true  —— 只查自身、不含原型链

      delete obj.name;     // 删除属性
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 访问不存在的属性返回 `undefined`（静默），Python 抛 `KeyError`。
      JS 用点号 `obj.key` / 方括号 `obj['key']` 都能访问，且两者等价；
      Python 的点号访问的是**对象的属性**（方法、字段），方括号访问的才是**字典的键**——
      `d.key` 和 `d['key']` 在 Python 里不是一回事，这是从 JS 过来最容易犯的错。
  - featureId: basics-javascript/object-iterate
    equivalence: identical
    code: |
      const obj = { a: 1, b: 2 };

      for (const [k, v] of Object.entries(obj)) console.log(k, v);   // @note 最可靠
      Object.keys(obj);       // ['a', 'b']
      Object.values(obj);     // [1, 2]

      for (const k in obj) console.log(k);   // @note! 会爬到原型链上的可枚举属性，一般不直接用

      // @note 对象没有内置的 .map/.filter，要先 entries 再 Object.fromEntries 转回来
      Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, v * 2]));
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `Object.entries(obj)` 拿到 `[key, value]` 数组再解构；
      Python 的 `d.items()` 直接给 `(key, value)` 元组，且是最常用的写法。
      注意 JS 的 `for...in` 会遍历到原型链上的可枚举属性——这是它不如 `Object.entries` 可靠的原因。
  - featureId: basics-javascript/object-default
    equivalence: identical
    code: |
      const conf = { retries: 0 };

      conf.retries ?? 3;         // 0    —— @note ?? 只对 null/undefined 兜底，0 会保留
      conf.retries || 3;         // 3    —— @note! || 把 0 当成空，这是最常见的配置项 bug
      conf.timeout ?? 30;        // 30

      const { retries = 5 } = conf;   // 解构默认值：仅当值为 undefined 时生效，null 不生效
      const { timeout = 10 } = conf;

      // @note 读取不会写入：conf 里仍然没有 timeout 这个键
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 用 `??` 或逻辑或；Python 用 `dict.get(key, default)`。
      **但两者有个关键区别**：Python 的 `d.get(k, default)` 只读不写；
      而 `defaultdict` 会在读取时**写入**默认值（顺带把字典撑大）。
      另外 JS 的 `||` 会把 `0`、`""` 这类合法值当成「空」，必须用 `??`——这一条在《运算符与真值判断》一章已验证过。
  - featureId: basics-javascript/object-merge
    equivalence: identical
    code: |
      const a = { x: 1, y: 2 };
      const b = { y: 9, z: 3 };

      const merged = { ...a, ...b };       // { x:1, y:9, z:3 } —— @note 后者覆盖前者，返回新对象
      const reversed = { ...b, ...a };     // y 变成 2

      Object.assign({}, a, b);             // 等价写法
      // @note! Object.assign(a, b) 是「原地改 a 并返回它」——漏掉第一个 {} 就会污染原对象

      // @note 浅合并：嵌套对象仍是共享引用
      { ...{ p: { q: 1 } } }.p.q = 2;      // 会改到原对象
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `{...a, ...b}` 返回新对象（后者的键覆盖前者）；Python 在 3.9+ 用 `a | b`，
      或 `{**a, **b}`。**注意 JS 的 `Object.assign(a, b)` 是原地修改 `a` 并返回它**，
      与展开写法语义不同，这个区别经常被忽略。
      Python 的 `a.update(b)` 同样是原地修改。
  - featureId: basics-javascript/object-nested
    equivalence: identical
    code: |
      const original = { user: { name: 'Ada' }, tags: ['a'] };

      const shallow = { ...original };
      shallow.user.name = 'Grace';
      original.user.name;        // 'Grace'  —— @note! 浅拷贝：内层还是同一个对象

      const deep = structuredClone(original);   // @note 真深拷贝，能处理 Date / Map / 循环引用
      deep.user.name = 'Hopper';
      original.user.name;        // 仍是 'Grace'

      // @note! JSON.parse(JSON.stringify(x)) 是常见但错误的深拷贝：会丢 Date、undefined、函数，遇循环引用直接抛错
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两门语言的「拷贝」默认都是**浅拷贝**：`{...obj}`、`Object.assign`、
      `dict(a)`、`a.copy()` 都只复制第一层，嵌套对象仍是共享引用。
      JS 要深拷贝用 `structuredClone()`（浏览器/Node 内置，比 `JSON.parse(JSON.stringify())` 正确，
      因为它能处理 `Date`、`Map`、循环引用）；Python 用 `copy.deepcopy()`。
      这一格是「看起来复制了，改新对象却动了旧对象」这类 bug 的根源。
  - featureId: basics-javascript/object-comprehension
    equivalence: identical
    code: |
      const langs = ['js', 'py'];

      // @note 数组 → 对象要两步：先 map 成 [k, v] 对，再 fromEntries
      Object.fromEntries(langs.map((l) => [l, l.length]));   // { js: 2, py: 2 }

      Object.fromEntries(
        Object.entries({ a: 1, b: 2 }).filter(([, v]) => v > 1),
      );                                                     // { b: 2 }

      // @note 没有「对象推导式」这种语法，批量构造都靠 fromEntries 组合
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 要「数组 → 对象」得走 `Object.fromEntries(arr.map(...))` 两步；
      Python 的字典推导式 `{k: v for ...}` 一步到位，并支持带条件的过滤。
      推导式是 Python 最具辨识度的语法之一，值得专门练到「不假思索就能写」。
  - featureId: basics-javascript/object-equality
    equivalence: identical
    code: |
      const a = { x: 1 };
      const b = { x: 1 };

      a === b;                 // false  —— @note! 比较的是引用，不是内容
      a === a;                 // true

      Object.is(a, b);         // false  —— 与 === 的唯一差别在 NaN 和 ±0

      // @note 想按内容比较只能自己写（或上库）：
      JSON.stringify(a) === JSON.stringify(b);   // 能用但不可靠——键顺序不同就误判

      // @note Map / Set 同理，都是引用比较
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `===` 对对象比的是**引用**，所以 `{} === {}` 是 `false`，
      要按内容比较得自己写或上 `JSON.stringify`（不可靠）。
      Python 的 `==` 对 dict/list 比的是**内容**，嵌套结构会递归比较。
      所以 Python 里「两个字典内容相同」这一判断是免费的，JS 里不是。
  - featureId: basics-javascript/object-json
    equivalence: identical
    code: |
      const obj = { name: '阿达', age: 36 };

      JSON.stringify(obj);          // {"name":"阿达","age":36}  —— @note 中文不转义，分隔符也无空格
      JSON.stringify(obj, null, 2); // 缩进 2 空格
      JSON.parse('{"a":1}');        // { a: 1 }

      // @note! 静默丢弃函数、undefined、Symbol
      JSON.stringify({ fn() {}, u: undefined, s: Symbol('x') });   // '{}'

      // @note! Date 变成字符串，解析回来不再是 Date
      JSON.stringify({ d: new Date() });   // '{"d":"2026-10-01T00:00:00.000Z"}'

      // @note! 循环引用直接抛 TypeError
      // @note! 超过 2^53 的整数被静默改值——JSON.parse 不报错，只是给你一个错的数
      JSON.parse('9007199254740993');      // 9007199254740992

      // @note Date 没有保真捷径：JSON 本身不带类型信息。
      //       正解是 replacer 里转 ISO 字符串、解析后显式 new Date(s)。
      //       structuredClone 是内存内深拷贝，不产出 JSON 文本，不能替代序列化
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
      notes: 修正两处：① "中文不转义"的注释挂在没有中文的例子后面（已加中文）；② 原写"用 structuredClone 保真 Date"不成立——它不产出 JSON 文本。另补 2^53 整数丢精度陷阱
    body: |
      同名不同写：JS 叫 `JSON.stringify` / `JSON.parse`，Python 叫 `json.dumps` / `json.loads`。
      差异在于对非 JSON 类型的处理：JS 会把函数、`undefined`、`Symbol` **静默丢掉**；
      Python 遇到 `datetime`、`set`、自定义对象会**直接抛 TypeError**（不静默）。
      另外 Python 的 `ensure_ascii` 默认为真，中文会被转义成 `\uXXXX`，想保留中文要显式关掉；
      Python 默认输出的分隔符还带空格（`{"a": 1}`，JS 是紧凑的 `{"a":1}`）。
      整数精度这两门语言恰好相反：JS 的 `JSON.parse` 超过 2^53 会静默改值，Python 的 int 是任意精度。
