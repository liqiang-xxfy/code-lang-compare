id: concepts-java/02-data
topicId: concepts-java
title: 数据与字符串
order: 2
summary: 装数据的容器、不可变的那一套、文本与时间的处理方式
features:
  - id: concepts-java/collections
    title: 常用集合
    kind: concept
    summary: 容器是泛型类、基本没有字面量；Map 的键可以是任意对象

  - id: concepts-java/immutable-data
    title: 不可变数据
    kind: concept
    summary: String、List.of、record、final 四重载体各管一段

  - id: concepts-java/string-format
    title: 字符串格式化
    kind: concept
    summary: String.format 一整套格式串，格式与值分开写

  - id: concepts-java/regex
    title: 正则表达式
    kind: concept
    summary: Pattern 要先编译；matches 是整串匹配，find 才找任意位置

  - id: concepts-java/serialization
    title: 序列化
    kind: concept
    summary: 标准库没有 JSON，要引 Jackson / Gson，序列化目标始终显式

  - id: concepts-java/date-time
    title: 日期时间
    kind: concept
    summary: java.time 全部不可变，月份从 1 起，时区是一等概念
