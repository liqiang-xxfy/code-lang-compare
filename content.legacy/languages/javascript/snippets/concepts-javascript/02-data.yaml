snippets:
  - featureId: concepts-javascript/collections
    equivalence: identical
    code: |
      const o = { 1: "a" };
      o[1] === o["1"]        // true —— 数字键被转成字符串
      const m = new Map();   // 键可以是任意值
    body: |
      JS 的主力容器是 `Array` 与「对象字面量」，另有 `Map` / `Set`。
      对象字面量**看起来像**字典，但它的键只能是字符串或 Symbol，
      数字键会被转成字符串（`{1: 'a'}[1]` 与 `{1: 'a'}['1']` 是同一格）。

      也没有**不可变的有序容器**：「这个列表不该被改」在 JS 里只能靠约定与文档。

  - featureId: concepts-javascript/immutable-data
    equivalence: identical
    code: |
      const o = Object.freeze({ inner: { n: 1 } });
      o.inner.n = 2          // 2 —— freeze 是浅的，嵌套照样能改
      o.n = 3                // 静默失败（严格模式下抛错）
    body: |
      JS 里让数据不可变要靠 `Object.freeze`，而它是**浅的**：嵌套对象照样能改。
      深冻结要递归，且冻结是运行时行为，不影响任何类型签名。
      复制用 `structuredClone`（或展开运算符，但那是浅拷贝）。

      没有内置的「不可变类型」，于是「不可变」在 JS 里只能是一种**纪律** ——
      靠人和评审维持，而不是靠语言拦住。

  - featureId: concepts-javascript/string-format
    equivalence: identical
    code: |
      const n = 3.14159;
      `${n}`                 // "3.14159"
      n.toFixed(2)           // "3.14" —— 格式化靠方法调用，不是格式串
    body: |
      JS 的主力是模板字符串 `` `${x}` ``，数字格式化要另外调 `toFixed`
      / `toLocaleString`，没有语言级的 printf 风格格式串 —— 「格式化」在这里
      就是拼字符串加几个方法调用。

      于是补零、对齐、千分位这些需求都得自己写，尤其在要拼表格或日志时。

  - featureId: concepts-javascript/regex
    equivalence: identical
    code: |
      "a1b".match(/\d/)      // ["1"] —— 匹配任意位置
      /(?<num>\d+)/.exec("a12")?.groups?.num   // "12"
    body: |
      JS 的正则用字面量写，入口函数一律**匹配任意位置**：`str.match(re)` 与
      `re.test(str)` 都不锚定开头。命名分组是 `(?<name>...)`。

  - featureId: concepts-javascript/serialization
    equivalence: identical
    code: |
      JSON.stringify({ f: () => 1, u: undefined, n: 1 })   // '{"n":1}' —— 静默丢弃
      JSON.stringify({ d: new Date() })                    // 日期变成字符串
    body: |
      JS 的 `JSON.stringify` 会**静默丢弃**函数、`undefined`、Symbol，
      循环引用直接抛错；`JSON.parse` 拿到什么就是什么。
      这类「丢了一点也不告诉你」的行为在调试时非常难查。

  - featureId: concepts-javascript/date-time
    equivalence: identical
    code: |
      const d = new Date(2026, 0, 5);   // 月份从 0 起 —— 这里其实是 1 月
      d.setMonth(1);                    // 就地修改，d 本身变了
    body: |
      JS 的 `Date` 是**可变的**（`setMonth` 会改自己），月份从 0 开始，
      时区处理长期靠 `Intl` 与第三方库补足。

      两个容易踩到自己的设计：月份从 0 起，以及 `setXxx` 会就地修改 ——
      别处还引用同一个 `Date` 时会跟着一起变。
