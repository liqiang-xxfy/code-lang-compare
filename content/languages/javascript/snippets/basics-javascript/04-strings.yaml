  - featureId: basics-javascript/fstring-format
    equivalence: identical
    code: |
      const n = 3.14159;

      n.toFixed(2);                    // '3.14'       —— 定点小数，返回字符串
      String(n).padEnd(8, ".");        // '3.14159.'   —— 宽度对齐只有 padStart / padEnd
      n.toPrecision(3);                // '3.14'       —— 有效数字

      // @note 没有 printf 风格的语言级占位符，但内建了 Intl 格式化器
      new Intl.NumberFormat('en-US', { style: 'percent' }).format(0.25);   // '25%'
      new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
        .format(1234.5);               // '$1,234.50'

      // @note! 只给 minimumFractionDigits 不会截断（默认上限是 3）
      const f2 = { minimumFractionDigits: 2 };
      new Intl.NumberFormat('en-US', f2).format(n);                        // '3.142' —— 不是 3.14
      new Intl.NumberFormat('en-US', { ...f2, maximumFractionDigits: 2 }).format(n);  // '3.14'

      console.log("%s = %d", "x", 1);  // @note! 这是 console 的调试能力，不是语言特性
    review:
      state: reviewed
      provenance:
        origin: llm
        model: claude-sonnet-4.5
        promptTemplateId: m1-snippet-v1
        generatedAt: '2026-10-01'
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
      notes: 校对实测：Intl 只给 minimumFractionDigits 时小数上限仍为 3，必须同时给 maximumFractionDigits
  - featureId: basics-javascript/string-index-slice
    equivalence: identical
    code: |
      const s = 'abc';

      s[0];            // 'a'
      s[-1];           // undefined  —— @note! 字符串下标不支持负数，静默拿到 undefined
      s.at(-1);        // 'c'        —— @note 负索引必须用 at()
      s[99];           // undefined  —— @note! 越界静默
      s.charAt(99);    // ''         —— @note! 另一个静默的越界行为
      s.charCodeAt(0); // 97

      s.length;        // 3
      'a😀'.length;    // 3  —— @note! 长度是 UTF-16 码元数，emoji 算 2，不是「字符数」

      s.slice(1);      // 'bc'
      s.slice(1, 2);   // 'b'  —— @note 只能靠方法，没有切片语法，也不支持步长
      s.substring(1, 2);  // 'b'  —— @note! 另一个几乎重复的方法，负参数行为还不同

      // @note slice 支持负数下标（从末尾算），substring 会把负数当成 0——两者语义不同
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
  - featureId: basics-javascript/string-regex
    equivalence: identical
    code: |
      /\d+/.test('a1');              // true
      'a1'.match(/(\d)/);            // ['1', '1', index: 1, input: 'a1']  找不到时是 null
      'a1b2'.replace(/\d/g, '#');    // 'a#b#'
      'a1b2'.split(/\d/);            // ['a', 'b', '']
      [...'a1b2'.matchAll(/(\w)(\d)/g)];   // @note 遍历所有匹配要用 matchAll

      const m = /(?<digit>\d)/.exec('a1');
      m.groups.digit;                // '1'  —— @note 命名分组用 (?<name>...)

      new RegExp('\\d+', 'g');       // @note 动态构造时反斜杠要写两遍

      // @note! 加了 g 标志的正则对象带 lastIndex 状态，复用同一个正则会得到跳着的结果
      // @note! 带 g 标志的正则对象有 lastIndex 状态，反复 test/exec 会得到交替的结果
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
  - featureId: basics-javascript/string-concat
    equivalence: identical
    code: |
      'a' + 1;              // 'a1'                  —— @note! 隐式转字符串，不报错
      'a' + null;           // 'anull'
      'a' + undefined;      // 'aundefined'
      'a' + {};             // 'a[object Object]'    —— @note! 静默给出无用结果
      'a' + true;           // 'atrue'

      [1, 2].join('-');     // '1-2'  —— @note 大量拼接用 join，比反复 + 更清楚
      `${a}${b}`;           // 模板字符串

      let out = '';
      for (let i = 0; i < 1000; i++) out += i;   // @note 引擎优化后可用，但更推荐收集到数组再 join

      // @note! + 只要有一侧是字符串就转拼接：'1' + 1 得 '11'，而 '1' - 1 得 0
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
  - featureId: basics-javascript/string-raw-escape
    equivalence: identical
    code: |
      'line1\nline2';        // 转义生效，真的换行
      '\\n';                 // 一个字面反斜杠 + n

      const winPath = 'C:\\Users\\lq';       // @note! Windows 路径必须双写反斜杠
      String.raw`C:\Users\lq`;               // @note String.raw 只对模板字符串生效

      const re = new RegExp('\\d+');         // @note 正则要写两遍反斜杠

      '\u{1F600}';           // '😀'  —— @note! Unicode 码点转义是 \u{...}
      '\uD83D\uDE00';        // 同一个字符的码元对写法
      '\x41';                // 'A'   —— 十六进制码元
      '\0';                  // NUL

      // @note String.raw`\d+` 免转义，但它是标签模板，普通字符串没有对应写法
      // @note ES6 起 \u{1F600} 用大括号直接写码点，超出 BMP 的字符不必再手工拆代理对
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
