id: concepts-java/02-data
topicId: concepts-java
title: 数据与字符串
order: 2
summary: 装数据的容器、不可变的那一套、文本与时间的处理方式
features:
  - id: concepts-java/collections
    title: 常用集合
    kind: concept
    summary: 泛型容器类没有字面量 vs 数组加对象字面量，键的类型还受限

  - id: concepts-java/immutable-data
    title: 不可变数据
    kind: concept
    summary: String、List.of、record、final 四重载体，到 JS 只剩一次浅冻结

  - id: concepts-java/string-format
    title: 字符串格式化
    kind: concept
    summary: String.format 整套格式串 vs 模板字符串加一堆方法

  - id: concepts-java/regex
    title: 正则表达式
    kind: concept
    summary: matches 是整串匹配、find 才找任意位置；JS 的 match 一律是任意位置

  - id: concepts-java/serialization
    title: 序列化
    kind: concept
    summary: 标准库没有 JSON、要引 Jackson / Gson vs JSON 内建但静默丢字段

  - id: concepts-java/date-time
    title: 日期时间
    kind: concept
    summary: java.time 不可变且时区是一等概念，JS 的 Date 更像被淘汰的旧 API
