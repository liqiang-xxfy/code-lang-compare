# php —— model / iteration
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: iteration` 的那批：
# generator-yield / comprehension / lazy-evaluation / destructuring。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 与 express/control-flow 的 `iteration-protocol` 分工：那里讲「怎么遍历一个已有对象」，
# 这里讲「**怎么造出**一个可遍历的东西」——也就是生成器与批量构造。
#
# 口径说明：这一组最值得写准的是**惰性那一格**。PHP 里绝大多数集合操作
# 都会**立刻造出整个数组**（`range`、`array_map`、`array_filter` 都是），
# 真正的惰性只有生成器一条路。本机实测：`range(1, 200000)` 占 6.3 MB，
# 同样长的生成器只要 512 字节。
#
# 本文件的事实全部在本机 PHP 8.5.11 上实跑确认过。

