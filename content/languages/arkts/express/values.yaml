# arkts —— express / values
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: values` 的那批：
# literals / type-inference / null-and-undefined / type-conversion。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被算作屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：ArkTS 与语法相近的那门静态方言高度同形，本文件只写**能核实**的差别
# （对象字面量必须声明类型、any / unknown 被禁用、推断不出来必须写出来），
# 拿不准的细节一律不编造 —— 写不出的差异如实标 identical / analogous，不灌水。

review:
  state: draft

boxes:
  literals:
    code: |
      const n: number = 42;                 // @note 数字只有双精度浮点一种
      const s: string = 'text';             // @note 单双引号等价
      const name = "Ada";
      const t: string = `你好，${name}`;     // @note 反引号可以插值

      const xs: number[] = [1, 2, 3];       // @note 数组字面量

      interface Point { x: number; y: number }
      const p: Point = { x: 1, y: 2 };      // @note 对象字面量要能对上已声明的类型
      // const loose = { x: 1 };            // @note! 编译错误：不允许无类型的对象字面量
    vs:
      javascript: |
        数字、字符串、数组的字面量写法与 JavaScript 完全一致 —— 语法本来就继承自
        同一套生态。实质差别在**对象字面量**：JavaScript 可以随手写 `{ x: 1 }`
        造一个没有名字的结构，ArkTS 要求它对应到一个已经声明的类或接口，否则编译不过。
        也就是说「临时造个形状出来用一下」在这里行不通，结构得先有个名字。
      python: |
        Python 的整型任意精度、浮点是双精度，两套数字是分开的；ArkTS 只有一种数字类型
        （双精度浮点），与 Python 的 float 接近、与它的 int 不同。复合字面量也少一大截 ——
        Python 有 list / tuple / dict / set 四种，ArkTS 主要就是数组与对象两种。
        另一处差别是对象字面量必须先有具名的类型，Python 的 dict 想放什么放什么。
      java: |
        Java 的数字按宽度分成 `int` / `long` / `double` 几种，字面量默认是 `int`；
        ArkTS 只有一种数字类型。复合值的写法差得更多：Java 的数组要 `new` 出来、
        对象要调构造器，ArkTS 用 `[1, 2, 3]` 与 `{ x: 1, y: 2 }` 这样的字面量直接写。
        代价是对象字面量必须对应到已声明的类型，不能像 Java 那样顺手 new 一个出来。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  type-inference:
    code: |
      let n = 42;                   // @note 局部变量可以由初值推断出类型
      let s: string = "hi";         // @note 也可以显式标注
      // let z;                     // @note! 编译错误：局部变量声明时就得有值

      function area(r: number): number {   // @note 参数类型必须有；返回类型可以推断
        return 3.14 * r * r;
      }

      class Circle {
        radius: number = 0;         // @note 字段要写类型，或由初值推断
      }
    vs:
      javascript: |
        JavaScript 没有类型标注这回事，参数与返回值都不写；ArkTS 把标注做进语法，
        推断不出来时必须写出来，不允许留空。另一条更强的约束是**没有 any 可用** ——
        JavaScript 里想放宽一段随时可以，ArkTS 里没有「先不检查」的逃生舱，
        每个值都得能在编译期推出一个类型，推不出来就报错。
      python: |
        两边都把类型写在名字后面（`r: number` / `r: float`），也都可以只标注一部分。
        差别在谁在看：Python 的标注运行时不生效，写错了代码照跑，要靠额外的类型检查器
        另跑一遍；ArkTS 的标注就是编译器的输入，写错或漏写都出不了包。
        另一处是兜底：Python 推断不出来时无非是少一层文档，ArkTS 直接拒绝编译。
      java: |
        位置相反：Java 写 `double r`（类型在前），ArkTS 写 `r: number`（类型在后）。
        能省的范围相反 —— ArkTS 的局部变量可以省（靠推断），Java 只有 `var` 能省。
        最大的差别是兜底手段：Java 推断不出来可以退回一个宽泛的引用类型，
        ArkTS 没有 any / unknown 这类口子，推断不出来只能把类型老实写出来。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  null-and-undefined:
    code: |
      let a: string = "hi";
      // a = null;                        // @note! 编译错误：string 类型不含 null

      let b: string | null = null;        // @note 可空必须显式写进类型
      // b.length;                        // @note! 编译错误：b 可能是 null
      b?.length;                          // @note 可选链：为 null 时整体得 undefined
      b ?? "默认";                        // @note 空值合并：只认 null / undefined

      function greet(who?: string): string {   // @note 可选参数相当于 string | undefined
        return "你好，" + (who ?? "访客");
      }
    vs:
      javascript: |
        JavaScript 里 null 与 undefined 能赋给任何变量，读属性就抛 TypeError；
        ArkTS 把空检查变成强制的：想让它可能是空就得写进类型，写了就必须在使用前处理掉。
        可选链与空值合并两边都有、语义一致，区别在于 JavaScript 里它们是可选的保险，
        ArkTS 里是编译器逼你写的必答题 —— 漏掉就出不了包。
      python: |
        Python 只有一种空值 None，能赋给任何变量，读属性到运行时才抛 AttributeError；
        ArkTS 把「可能为空」写进类型并在编译期强制处理。可选写法还差一层语义：
        Python 的 `x or "默认"` 对空字符串、0、空列表都会取右边，ArkTS 的 `??`
        只认 null / undefined —— `0 ?? 5` 得 0，`0 or 5` 得 5。
      java: |
        Java 的 null 能赋给任何引用类型，解引用就是 NPE，编译器不管；ArkTS 在编译期
        就要求把「可能为空」写进类型。差别在**强制性**：Java 的对策是库层面的 Optional，
        只覆盖返回值，字段、参数、局部变量都用不上；ArkTS 的可空性是类型系统里的一等公民，
        字段与参数一样能标、一样强制检查。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  type-conversion:
    code: |
      let a: number = 1;
      // a = "text";                   // @note! 编译错误：不做隐式类型变换

      const n: number = Number("12"); // @note 字符串转数字要显式调用 Number()
      Number("12px");                 // @note NaN —— 转换失败给 NaN，不抛错
      const s: string = String(42);   // @note "42" —— 反向同样要显式调用
      // const bad = "3" * 2;         // @note! 编译错误：算术运算符不接受字符串
      // const x: number = "1";       // @note! 编译错误：字符串不能赋给 number
    vs:
      javascript: |
        JavaScript 把隐式转换当默认行为，混用类型往往不报错、只是给你另一个值；
        ArkTS 的静态检查要求在类型之间显式转换，字符串与数字混算直接出不了包。
        失败的处理倒是同一种：显式转换失败给一个特殊值 NaN，而不是抛异常。
        所以差别在**入口**：JavaScript 到处能悄悄转，ArkTS 只留下显式调用这一条路。
      python: |
        两边都不把隐式转换当默认：Python 的 `1 + "a"` 抛 TypeError，ArkTS 的字符串
        算术编译不过。差别在时机 —— Python 要运行到那一行才知道，ArkTS 在编译期就拦下。
        转换的写法也不同：Python 用 int() / str() 这类构造函数，ArkTS 用 Number() / String()；
        失败时 Python 抛 ValueError，ArkTS 给 NaN 而不是抛异常。
      java: |
        两边都要求数字与字符串之间显式转换，也都靠编译期拦下混用。差别在数值一侧：
        Java 会隐式拓宽（int 自动变 double），还能自动装箱；ArkTS 只有一种数字类型，
        没有拓宽可言。转换的写法也不同：Java 写 Integer.parseInt / String.valueOf，
        ArkTS 写 Number() / String()，失败给 NaN 而不是抛异常。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
