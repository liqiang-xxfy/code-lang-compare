# python —— basics/02-types 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas

- featureId: basics/primitive-types
  equivalence: divergent
  code: |
    type(1)        # <class 'int'>      —— @note 整数独立成类，且是任意精度
    type(1.0)      # <class 'float'>
    type("a")      # <class 'str'>
    type(True)     # <class 'bool'>     —— @note! bool 是 int 的子类
    type(None)     # <class 'NoneType'>
    type([1])      # <class 'list'>     —— @note 容器类型是一等类型，不算「对象字面量」

    isinstance(True, int)   # True  —— @note! 所以 True + True == 2
    True == 1               # True
  output: |
    True
    True
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/type-inference
  equivalence: identical
  code: |
    n = 1                # @note 名字没有类型，类型属于运行时的对象
    n = "text"           # 完全合法

    x: int = 1           # @note! 类型标注只是给工具看的，解释器不强制
    x = "text"           # 合法，且运行时不报错

    from typing import get_type_hints
    get_type_hints(lambda: None)  # 标注只有被显式读取时才有意义
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/type-checking
  equivalence: divergent
  code: |
    isinstance(1, int)       # True   —— @note 推荐：能正确处理继承
    type(1) is int           # True

    isinstance(True, int)    # True   —— @note! bool 是 int 子类，会一起命中
    type(True) is int        # False  —— @note! is 是严格相等，子类不匹配

    callable(f)              # @note 判断可否调用（不只看类型）
    hasattr(obj, "name")     # @note 鸭子类型：问「有没有」而不是「是什么」
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/null-undefined
  equivalence: divergent
  code: |
    a = None                 # @note 只有一种空值，没有 undefined

    a is None                # True  —— @note! 判空必须用 is，不要用 ==
    a == None                # True，但会调用 __eq__，可能被重载成奇怪的行为

    # 未赋值的名字不是 None，而是直接 NameError
    # print(never_set)       # NameError

    # 函数默认参数用 None 做哨兵时，要显式区分「没传」和「传了 None」
    def f(x=None):
        return [] if x is None else x
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/number-precision
  equivalence: divergent
  code: |
    1 / 2            # 0.5
    0.1 + 0.2        # 0.30000000000000004 —— @note 浮点行为与 JS 完全一致
    1 / 0            # @note! ZeroDivisionError，不是 Infinity

    10 ** 100        # @note 整数任意精度，不会溢出
    import math
    math.isnan(float("nan"))   # @note 判 NaN 用 math.isnan，不是 ==

    from decimal import Decimal
    Decimal("0.1") + Decimal("0.2")   # @note 需要精确小数时改用 Decimal
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/type-casting
  equivalence: divergent
  code: |
    int('12')            # 12
    # int('12px')        # @note! ValueError —— 不做前缀解析，直接失败
    # int('3.7')         # @note! ValueError —— 想取整必须先 float 再 int
    int(float('3.7'))    # 3

    float('3.7')         # 3.7
    str(123)             # '123'
    bool(0)              # False
    list('abc')          # ['a', 'b', 'c']
    tuple([1, 2])        # (1, 2)

    # @note 转换靠类型构造函数，不用 Number()/String() 这类全局函数
    # @note 转换失败一律抛异常（ValueError / TypeError），不产生 NaN 之类的哨兵值
    # @note int('0x1f', 16) 可以显式指定进制
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/boolean-conversion
  equivalence: divergent
  code: |
    bool([])          # False  —— @note! 空列表是假值，JS 是 true
    bool({})          # False  —— @note! 空字典也是假值
    bool(set())       # False
    bool(())          # False
    bool('')          # False
    bool('0')         # True   —— 非空字符串恒为真，与 JS 一致
    bool(0.0)         # False

    # @note! 所以 Python 里 `if items:` 真的表示「列表非空」；
    #        而 JS 里同样的意图必须写 items.length > 0
    # @note 自定义类可以实现 __bool__ 或 __len__ 来定义真值
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/type-names
  equivalence: divergent
  code: |
    type(1)              # <class 'int'>   —— @note 返回的是「类对象本身」
    type(1).__name__     # 'int'           —— @note 要字符串名字得取 __name__
    type([])             # <class 'list'>
    type(None)           # <class 'NoneType'>

    class User: ...
    type(User()).__name__  # 'User'  —— @note 自定义类天然有名字，不像 JS 的 typeof 一律给 'object'

    isinstance(1, int)   # True
    issubclass(bool, int)  # True  —— @note! bool 是 int 的子类

    # @note Python 没有与 typeof 对应的「只给个粗分类」的内置操作
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/immutable-primitives
  equivalence: analogous
  code: |
    s = 'abc'
    s.upper()        # 'ABC'
    s                # 'abc'  —— @note 原值不变

    n = 1
    n + 1            # 2
    n                # 1

    t = (1, 2)
    # t[0] = 9       # @note! TypeError: 'tuple' object does not support item assignment

    # @note! 但列表是原地改的，行为与字符串完全不同：
    arr = [3, 1]
    arr.sort()       # 原地排序，返回 None
    arr              # [1, 3]

    # @note 元组 / 字符串 / 数字 / frozenset 是不可变类型，可作为字典键；
    #       列表 / 字典 / set 可变，不可哈希，不能当键
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'
