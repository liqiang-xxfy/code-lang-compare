# JavaScript 视角下的「工程实践」章节分组。
#
# 这是四个板块里分组差异最小的一个（工程概念本身不随语言变），
# 差异主要在标题措辞与个别取舍上。三份分组仍然各写一份，理由与别处一样：
# 左栏要说的是「以 JS 为参照系时，这套东西叫什么」。

section: practice
baseline: javascript

chapters:
  - id: packages
    title: 包管理与依赖
    summary: npm / pnpm，package.json 与锁文件
    features: [package-manager, dependency-declaration, version-constraint, lockfile, environment-isolation, publishing]

  - id: toolchain
    title: 构建与工具链
    summary: 转译、打包、检查与运行时版本
    features: [compile-run, bundler, linter-formatter, type-checker, runtime-version, repl]

  - id: testing
    title: 测试
    summary: 测试框架、断言与替身
    features: [test-framework, assertions, mocking, parameterized-tests, coverage]
