# JavaScript 视角下的「语言机制」章节分组。
#
# JS 的机制清单偏「运行时」：没有静态类型、没有所有权、GC 兜底，
# 所以「类型系统」「内存」两章讲的都是**没有**什么；真正吃力的是异步。
# Python / Java 视角的取舍见各自文件。

section: mechanism
baseline: javascript

chapters:
  - id: types
    title: 类型系统
    summary: 动态类型与 TypeScript 那层可选的静态检查
    features: [static-vs-dynamic, type-annotation, structural-nominal, type-narrowing, null-safety, type-assertion]

  - id: generics
    title: 泛型与参数化
    summary: TS 的泛型写在类型层，运行期不留痕
    features: [generic-declaration, generic-constraint, variance, type-erasure]

  - id: memory
    title: 内存与所有权
    summary: GC 兜底，没有所有权，但要防循环引用
    features: [value-vs-reference, garbage-collection, ownership-borrow, lifetime, weak-reference]

  - id: concurrency
    title: 并发
    summary: 单线程 + Worker，没有共享内存的默认路径
    features: [concurrency-unit, shared-state, lock-mutex, channel, atomicity]

  - id: async
    title: 异步
    summary: 事件循环、Promise 与 async / await
    features: [event-loop, callback, promise-future, async-await, cancellation]

  - id: meta
    title: 元编程
    summary: Proxy、Reflect 与动态求值
    features: [reflection, decorator-annotation, dynamic-eval, proxy-interception]
