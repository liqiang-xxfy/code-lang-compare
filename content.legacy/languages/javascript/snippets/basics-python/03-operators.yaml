  - featureId: basics-python/equality
    equivalence: divergent
    code: |
      1 == "1";              // @note! true —— 宽松相等会隐式转换
      1 === "1";             // false —— 工程规范一律用 ===
      [] == false;           // @note! true —— 空数组会被转成 ""
      NaN === NaN;           // @note! false —— 唯一不等于自己的值

      // Python 的 == 不做转换，也不存在两套相等；但那边没有 is 的等价物
      Object.is(NaN, NaN);   // true —— 精确相等，且把 -0 与 0 区分开
  - featureId: basics-python/arithmetic
    equivalence: divergent
    code: |
      7 / 2;                 // 3.5 —— 这条两边一致
      Math.trunc(7 / 2);     // 3 —— 没有整除运算符，要自己调用
      Math.floor(-7 / 2);    // -4 —— 想模拟"向下取整"得用 floor 而不是 trunc

      -7 % 3;                // @note! -1 —— 取余符号跟着被除数，Python 那边是 2
      (a / b) | 0;           // @note 常见的"取整"偏方，但只对 32 位内的数有效

      (7).toString(2);       // 进制转换只能走字符串，没有 divmod 这种返回两个值的写法
  - featureId: basics-python/logical-short-circuit
