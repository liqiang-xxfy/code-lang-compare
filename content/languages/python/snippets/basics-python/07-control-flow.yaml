  - featureId: basics-python/switch-match
    equivalence: identical
    code: |
      match command.split():
          case ["go", direction]:      # @note 解构 + 绑定变量，不是值比较
              move(direction)
          case ["look"]:
              look()
          case ["go", *rest]:          # 星号收集剩余项
              go_many(rest)
          case {"type": "quit"}:       # 映射模式
              quit_game()
          case Point(x=0, y=0):        # 类模式，按属性匹配
              at_origin()
          case [x] if x > 0:           # 守卫条件
              positive(x)
          case _:                      # @note! 兜底：没有它就可能一个分支都不匹配，
              unknown()                # 然后静默什么都不做

      # @note! case 里的名字是**捕获**不是比较：写 case x: 会匹配任何东西
      # 想比较常量要用点号形式（Color.RED）或字面量
