# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（java2arkts），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: java2arkts-1-runtime-guarantees
  order: 1
  title: 接受「很多 Java 的运行时保障没有了」
  durationHint: 2-3 小时
  todo:
    - 装 DevEco Studio，跑通一个空工程，确认能编译 .ets
    - 编译一段带 interface 与泛型的代码，打开产物看类型是不是全没了
    - 试着用反射 / 注解做点什么，感受这条路的封死程度
    - 对照本工具「语言机制」板块里 ArkTS 列的反射与泛型两格
  acceptance:
    - 能列出 ArkTS 相对 Java 少掉的三种运行时能力（Class 对象、真 private、反射）
    - 能解释空安全默认开启为什么是「更强」而不是「更严」
  resources:
    - label: HarmonyOS 开发者官网 · ArkTS
      url: https://developer.huawei.com/consumer/cn/arkts/
    - label: OpenHarmony 官方文档仓库
      url: https://github.com/openharmony/docs

- id: java2arkts-2-types-and-exceptions
  order: 2
  title: 类型与异常：把直觉调过来
  durationHint: 2-3 天
  todo:
    - 把 null 的用法全部改成可空类型加判空（`T | undefined` + ?. / ??）
    - 把自定义异常改成继承 Error；体会没有受检异常后错误处理要怎么设计
    - 把 number 相关代码检查一遍：整除、大整数、位运算都要重新写
    - 用 instanceof 代替 as 做强转，理解 as 静默失效的坑
  acceptance:
    - 能说清 Java 的 null 隐患与 ArkTS 的编译期空安全差别
    - 能在没有受检异常的情况下，设计出可靠的错误处理
  resources:
    - label: ArkTS 语言导览（官方）
      url: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkts-get-started

- id: java2arkts-3-objects-and-generics
  order: 3
  title: 对象、类与受限的泛型
  durationHint: 3-5 天
  todo:
    - 把一段 Java 类改写成 ArkTS，注意字段必须初始化、重载只有类型签名
    - 把泛型代码里用到的索引签名 / 映射类型，改成显式 interface
    - 用注册表或工厂函数代替「按类名反射创建对象」
    - 分清 ArkUI 的 @State 等框架语法与语言层的 @Sendable / @Concurrent
  acceptance:
    - 能说清名义类型与结构类型的差别，以及这对设计的影响
    - 能在泛型能力受限的前提下，把原来靠类型体操实现的逻辑改成显式声明
  resources:
    - label: OpenHarmony 官方文档仓库
      url: https://github.com/openharmony/docs

- id: java2arkts-4-concurrency
  order: 4
  title: 并发：从共享内存加锁到 actor
  durationHint: 3-5 天
  todo:
    - 用 TaskPool 跑一个耗时任务，体会执行体之间不共享内存
    - 试着跨执行体传对象，理解 Structured Clone 与 Transferable 两条路
    - 用 @Sendable 在共享堆传引用，想清楚谁负责数据竞争（答案是开发者）
    - 用 AsyncLock 做一次互斥，注意必须 await —— 它不是阻塞锁
  acceptance:
    - 能说清 Java 的 synchronized 模型与 ArkTS 的 actor 模型差别
    - 能把一个「共享状态加锁」的设计改写成消息传递式
  resources:
    - label: HarmonyOS 开发者官网 · ArkTS
      url: https://developer.huawei.com/consumer/cn/arkts/

- id: java2arkts-5-engineering
  order: 5
  title: 工程化收口：进入 HarmonyOS 应用开发
  durationHint: 1 周
  todo:
    - 用 ohpm 管依赖，理解它与 Maven / Gradle 的差别
    - 学 ArkUI 的声明式 UI（@State / @Prop / @Link）
    - 给一个页面接上真实数据，走通「取数 → 状态更新 → 重渲染」
    - 对照本工具「工程实践」板块里 ArkTS 列的工具链
  acceptance:
    - 能独立搭起一个能跑起来的 ArkTS 应用
    - 能分清语言层特性与 ArkUI 框架特性
  resources:
    - label: HarmonyOS 开发者文档
      url: https://developer.huawei.com/consumer/cn/doc/
