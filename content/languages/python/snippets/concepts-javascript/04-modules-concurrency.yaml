snippets:
  - featureId: concepts-javascript/module-system
    equivalence: divergent
    code: |
      import util                  # @note! import 是一句会执行的语句：模块顶层代码此刻跑一遍
      from util import helper      # @note 没有显式导出 —— 所有顶层名字都可被导入
    body: |
      **import / from ... import** —— 一个 `.py` 是 module，
      含 `__init__.py` 的目录是 package。顶层副作用会影响所有导入方。

  - featureId: concepts-javascript/memory
    equivalence: divergent
    code: |
      import sys
      x = [1, 2, 3]
      refs = sys.getrefcount(x)    # @note 引用计数：del 只是减一次引用
      del x                        # @note! 对象不一定立刻消失，别人还引用着就还在
    body: |
      **引用计数 + 循环 GC** —— `del` 只是减引用。
      好处是可以用 `with` 写出确定性的释放，不依赖 GC 时机。

  - featureId: concepts-javascript/concurrency-unit
    equivalence: divergent
    code: |
      import threading
      # @note! GIL：多线程无法并行跑 CPU 密集任务，加了可能更慢
      import multiprocessing
      # @note CPU 密集要真并行，只能用多进程（各自独立解释器与内存）
    body: |
      **线程 + 进程 + 协程** —— GIL 使线程只能并发不能并行；
      CPU 密集要 `multiprocessing`。

  - featureId: concepts-javascript/async-model
    equivalence: divergent
    code: |
      import asyncio
      async def load():
          return 1
      load()                  # @note! 返回协程对象，一行都不执行，且通常不报错
      asyncio.run(load())     # @note 必须显式启动事件循环才会跑
    body: |
      **asyncio / 协程** —— 需要显式进入事件循环。
      从 JS 过来最经典的静默失败：代码看着对，跑起来什么都不发生。
