# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（python2dart），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: python2dart-1-static-and-syntax
  order: 1
  title: 静态类型与基础语法
  durationHint: 2-3 小时
  todo:
    - 装 Dart SDK，跑一个 `dart create` 的工程
    - 写一段熟悉的 Python 逻辑用 Dart 重写，重点试除法（`//` 变 `~/`）与控制流
    - 体会空安全：可能为空的值要标 `?`，不判空编译不过
    - 对照本工具「语言机制」板块里 Dart 列的「静态 vs 动态」「空安全」两格
  acceptance:
    - 能说出 `-7 // 2` 与 `-7 ~/ 2` 各得几，以及为什么
    - 能用 final / const 表达 Python 里靠约定表达的常量
  resources:
    - label: Dart 官方文档（中文）
      url: https://dart.cn/
    - label: Dart 语言之旅
      url: https://dart.dev/language

- id: python2dart-2-collections
  order: 2
  title: 集合与函数
  durationHint: 1-2 天
  todo:
    - 把推导式改写成 where / map 链，注意它与 Python 推导式的求值差别
    - 写几个函数，体会没有 *args / **kwargs 后参数要怎么写
    - 用 `x is List<int>` 验证泛型是具体化的
    - 对照本工具「基础表达」板块里 Dart 列的集合与函数
  acceptance:
    - 能独立把一段 Python 集合处理代码改写成 Dart 风格
    - 能说清 Dart 的泛型具体化与 Python 的擦除差别
  resources:
    - label: Dart 官方文档 · 集合
      url: https://dart.dev/language/collections

- id: python2dart-3-async
  order: 3
  title: 异步：Future 与 Stream
  durationHint: 3-5 天
  todo:
    - 把一段 asyncio 代码改写成 async / await
    - 验证 Future.wait 默认等全部完成，对比 asyncio.gather 的失败时机
    - 接受 Future 不可取消，改用 Stream 加 Subscription 实现可取消任务
    - 用 Stream 处理一串事件，体会它默认单订阅
  acceptance:
    - 能说清 Future 与 asyncio 的任务在取消能力与失败时机上的差别
    - 能写出正确处理多播的 Stream 代码
  resources:
    - label: Dart 官方文档 · 异步
      url: https://dart.dev/libraries/async/async-await

- id: python2dart-4-isolates
  order: 4
  title: 并发：从 GIL 到 isolate
  durationHint: 2-3 天
  todo:
    - 用 `Isolate.run()` 跑一个计算密集任务，感受它绕开了 GIL 那种限制
    - 试着跨 isolate 传一个可变对象，理解它是拷贝而非共享
    - 接受「没有锁」：设计成消息传递而不是共享状态
    - 对照本工具「语言机制」板块里 Dart 列的并发模型
  acceptance:
    - 能说清 Dart 的 isolate 与 Python 的多进程 / 多线程差别
    - 能把一个共享状态的 Python 设计改写成消息传递式
  resources:
    - label: Dart 官方文档 · 并发
      url: https://dart.dev/language/concurrency

- id: python2dart-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 pub 管依赖，理解它与 pip / venv 的差别
    - 用 dart analyze 与 dart test，注意断言默认关的影响
    - 写一个 build_runner 的代码生成，理解为什么不用反射
    - 对照本工具「工程实践」板块里 Dart 列的工具链
  acceptance:
    - 能独立搭起一个带依赖管理、analyze、测试的 Dart 工程
    - 能说清 Dart 生态为什么偏好编译期代码生成
  resources:
    - label: Dart 官方文档 · 包与库
      url: https://dart.dev/tools/pub/packages
    - label: Dart 官方文档（中文）
      url: https://dart.cn/
