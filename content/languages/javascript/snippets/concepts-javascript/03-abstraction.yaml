snippets:
  - featureId: concepts-javascript/class-inheritance
    equivalence: identical
    code: |
      class Base { #secret = 1; }        // # 是真正的语言级私有
      class Sub extends Base {}          // 只能单继承，super 沿原型链向上
    body: |
      **class + 原型链** —— 单继承，多态靠原型；私有字段用 `#name`，
      是语言保证的私有（运行时外部拿不到）。

  - featureId: concepts-javascript/interface
    equivalence: identical
    code: |
      // 语言层面没有 interface —— 只要求「有这个方法」即可
      function render(x) { return x.toText(); }   // 传什么进来都行，跑起来才知道
    body: |
      **无语言级概念** —— 靠结构化类型隐式满足。
      `interface` 是 TypeScript 的编译期概念，运行时不留痕迹。

  - featureId: concepts-javascript/generics
    equivalence: identical
    code: |
      function first(list) { return list[0]; }    // 没有类型参数
      // 想在编译期约束只能靠 TS：function first<T>(list: T[]): T
    body: |
      **无（靠 TS）** —— 运行时不保留类型参数，编译期擦除。

  - featureId: concepts-javascript/error-handling
    equivalence: identical
    code: |
      throw "出错了";                    // 可以抛任意值
      try { risky(); } catch (e) {
        e.message                        // undefined —— 因为 e 不一定是 Error
      }
    body: |
      **try/catch + Error 子类** —— 可以 `throw` 任意值，
      所以 `catch` 到的东西不一定是 `Error`。
