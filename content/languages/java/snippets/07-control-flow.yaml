- featureId: basics/loop-control
  equivalence: identical
  code: |
    for (int i = 0; i < 3; i++) {
        if (i == 1) continue;
        if (i == 2) break;
    }

    outer:                                  // @note 标签 + 带标签的 break / continue
    for (int i = 0; i < 3; i++) {
        for (int j = 0; j < 3; j++) {
            if (j == 1) continue outer;
            if (i == 2) break outer;
        }
    }

    // @note Java 有标签跳转，与 JS 一致；Python 没有，那边只能靠函数 return 或 for-else
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

