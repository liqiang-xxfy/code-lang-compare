id: concepts-python/02-data
topicId: concepts-python
title: 数据与字符串
order: 2
summary: 装数据的容器、不可变的那一套、文本与时间的处理方式
features:
  - id: concepts-python/collections
    title: 常用集合
    kind: concept
    summary: list / dict / set 都有字面量，且 dict 的键必须可哈希

  - id: concepts-python/immutable-data
    title: 不可变数据
    kind: concept
    summary: tuple / frozenset / str 本身就是不可变类型，不是运行时的一次冻结

  - id: concepts-python/string-format
    title: 字符串格式化
    kind: concept
    summary: f-string 内嵌一门格式小语言，格式说明符跟在值的后面

  - id: concepts-python/regex
    title: 正则表达式
    kind: concept
    summary: 三个入口各锚定一种范围：search 找任意位置、match 只锚开头、fullmatch 整串

  - id: concepts-python/serialization
    title: 序列化
    kind: concept
    summary: json 在标准库里，但遇到不认识的类型直接抛错

  - id: concepts-python/date-time
    title: 日期时间
    kind: concept
    summary: datetime 不可变、月份从 1 起，时区靠 naive / aware 两种状态区分
