# javascript —— basics/02-types 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/primitive-types
    equivalence: identical
    code: |
      typeof 1;            // 'number'   —— 整数与浮点是同一个类型
      typeof 1n;           // 'bigint'
      typeof "a";          // 'string'
      typeof true;         // 'boolean'
      typeof undefined;    // 'undefined'
      typeof null;         // 'object'   —— @note! 历史遗留，无法修正
      typeof Symbol();     // 'symbol'

      // 原始类型共 7 种，除此之外都是对象
    output: |
      'number' 'bigint' 'string' 'boolean' 'undefined' 'object' 'symbol'
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 有 7 种原始类型（string / number / bigint / boolean / undefined / symbol / null）；
      Python 把整数与浮点分成两个类型，且**整数是任意精度**。
      最大的一处反直觉：Python 里 `bool` 是 `int` 的子类，所以 `True == 1` 成立。
  - featureId: basics-javascript/type-inference
    equivalence: identical
    code: |
      let n = 1;           // @note 变量本身没有类型，类型属于运行时的值
      n = "text";          // 完全合法

      // 想获得编译期约束要另用 TypeScript，JS 运行时不做任何检查
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两边都是**动态类型**：变量（名字）本身没有类型，类型属于运行时对象。
      所以「赋了整数就不能改赋字符串」这种约束在两边都不存在。
      （编译期类型标注语言里的类型推断是另一回事，不属于本工具的对照范围。）
  - featureId: basics-javascript/type-checking
    equivalence: identical
    code: |
      typeof 1 === "number";        // true
      typeof null === "object";     // @note! typeof 对 null 不可靠

      Array.isArray([]);            // true —— 判数组只能用它
      [] instanceof Array;          // true，但跨 iframe 会失效

      Number.isInteger(1);          // true
      Number.isNaN(NaN);            // @note 判 NaN 必须用它，NaN === NaN 是 false
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `typeof` 有两个著名缺陷：对 `null` 返回 `'object'`，对数组只返回 `'object'`。
      Python 推荐 `isinstance()`，因为它能正确处理继承关系；`type(x) is T` 在子类场景下会误判。
  - featureId: basics-javascript/null-undefined
    equivalence: identical
    code: |
      let a;                        // undefined —— 「还没赋值」
      const b = null;               // null      —— 「有意置空」

      a === undefined;              // true
      a == null;                    // true —— @note 唯一推荐用宽松 == 的场景，同时匹配 null 与 undefined
      b === null;                   // true

      Object.is(NaN, NaN);          // true —— 与 === 的唯一差别
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 有两个空值：`undefined`（未赋值 / 缺省）和 `null`（有意的空），这带来大量判空噪音。
      Python 只有 `None`。判等时注意：Python 用 `is None`，JS 只在这一处推荐用宽松的 `== null`（同时匹配 null 和 undefined）。
  - featureId: basics-javascript/number-precision
    equivalence: identical
    code: |
      1 / 2;                        // 0.5
      0.1 + 0.2;                    // 0.30000000000000004 —— @note! 所有 number 都是 float64
      1 / 0;                        // Infinity —— @note! 除以零不报错，会静默污染下游计算

      Number.MAX_SAFE_INTEGER;      // 9007199254740991
      9007199254740993;             // 9007199254740992 —— @note! 超出安全范围后静默丢精度
      9007199254740993n;            // 9007199254740993n —— BigInt 才安全
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两边都遵循 IEEE 754 双精度浮点，所以 `0.1 + 0.2 !== 0.3` 在两边**都成立**。
      真正的差异有两个：① JS 的整数也是浮点，超过安全整数范围后静默丢精度（要用 `BigInt`）；
      ② Python 整数是任意精度，且**除以零会抛异常而不是返回 `Infinity`**。
      第二条是线上事故级别的差异：JS 里 `1/0` 不报错，Python 里直接崩。
  - featureId: basics-javascript/type-casting
    equivalence: identical
    code: |
      Number('12');          // 12
      Number('12px');        // NaN    —— @note! 解析失败给 NaN，不报错，错误会一路传下去
      Number('');            // 0      —— @note! 空字符串变 0，很反直觉
      parseInt('12px', 10);  // 12     —— @note 前缀解析；永远显式传进制，否则 0x 开头会被当 16 进制
      parseFloat('3.7');     // 3.7

      String(123);           // '123'
      (123).toString(2);     // '1111011' —— @note 能带进制
      Boolean(0);            // false

      // @note! 隐式转换无处不在：'1' + 1 → '11'，但 '3' * 2 → 6（减乘除走数值）
      // @note! Number('') 与 Number('  ') 都是 0——空串被当成零，是常见的静默错误
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 靠几个**全局函数**做转换（`Number()`、`String()`、`Boolean()`），
      Python 靠**类型构造函数**（`int()`、`str()`、`float()`、`list()`）。
      形态相似，但不一致的地方很多：
      `Number('12px')` 给 `NaN`，而 `int('12px')` 直接抛 `ValueError`；
      Python 的 `int('3.7')` 会抛错（要先 `float` 再 `int`），JS 的 `parseInt('3.7')` 给 3。
  - featureId: basics-javascript/boolean-conversion
    equivalence: identical
    code: |
      Boolean([]);      // true   —— @note! 空数组是真值
      Boolean({});      // true   // @note! 空对象也是真值
      Boolean(new Map()); // true

      Boolean('');      // false
      Boolean('0');     // true   —— 非空字符串恒为真
      Boolean(0);       // false
      Boolean(NaN);     // false

      !!value;          // 惯用写法：双否定转布尔

      // @note! 假值只有 8 个：false / 0 / -0 / 0n / '' / null / undefined / NaN，其余全是真
      //        所以判数组非空必须写 arr.length > 0，不能靠真假值
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      两者都做「真值转换」，但**规则不同**，这是全套内容里最高频的陷阱之一：
      JS 的空数组 `[]`、空对象 `{}` 都是真值；Python 的空 `list`、空 `dict`、空 `set`、空 `str`
      全是假值。所以 Python 里 `if not items:` 是「列表为空」，
      而 JS 里同样意图必须写 `if (items.length === 0)`——`if (!items)` 在 JS 里永远不成立。
  - featureId: basics-javascript/type-names
    equivalence: identical
    code: |
      typeof [];                    // 'object'  —— @note! 数组也是 object
      typeof null;                  // 'object'  —— @note! 无法修正的历史遗留
      typeof new Map();             // 'object'

      [].constructor.name;          // 'Array'
      class User {}
      new User().constructor.name;  // 'User'
      [] instanceof Array;          // true

      // @note! typeof 对自定义类一律给 'object'，想拿名字只能 instanceof / constructor.name
      // @note typeof 返回的是「类型标签」不是类名：typeof [] 是 'object'，
      //       想拿构造器名字得用 x.constructor.name
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 的 `typeof` 返回一个小写字符串（`'number'`、`'object'`），
      Python 的 `type(x)` 返回**类对象本身**（打印出来是 `<class 'int'>`）。
      Python 的 `type(x).__name__` 才能拿到字符串名字。
      更重要的差别：Python 的类名是开放式的（自定义类会给出自己的名字），
      JS 的 `typeof` 对自定义类一律给 `'object'`，只能靠 `instanceof` 或 `constructor.name`。
      另外 JS 的 `typeof null === 'object'` 是个无法修正的历史遗留。
  - featureId: basics-javascript/immutable-primitives
    equivalence: identical
    code: |
      const s = 'abc';
      s.toUpperCase();     // 'ABC'
      s;                   // 'abc'  —— @note 原值不变，所有字符串方法都返回新值

      let n = 1;
      n + 1;               // 2
      n;                   // 1      —— @note 算术不改变原变量

      // @note! 对比容器：数组方法是「原地改」
      const arr = [3, 1];
      arr.sort();          // 原地排序，返回同一个数组引用
      arr;                 // [1, 3]

      // @note 口诀：容器改内容会传染，字符串/数字只能换绑
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两边的字符串、数字都是**不可变**的：所有「修改」方法其实返回新值，原值不动。
      这条一致，但因为 JS 有大量原地修改的**数组**方法（`push`、`sort`、`reverse`），
      而 Python 的**列表**同样原地修改——所以在容器上会养成「改内容」的习惯，
      一旦迁移到 `.toUpperCase()` 这类字符串操作时，很容易忘记要接住返回值。
      口诀仍然适用：**改内容会传染（容器），改绑定不会（字符串/数字）。**
