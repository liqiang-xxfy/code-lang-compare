      def min_max(xs):
          return min(xs), max(xs)           # @note! 返回的是元组，由逗号构造，不用先建容器

      lo, hi = min_max(xs)                  # @note 解包接收
      pair = min_max(xs)                    # @note (1, 9) —— 整体就是一个对象，可以整体传递
