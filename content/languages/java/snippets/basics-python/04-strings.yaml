  - featureId: basics-python/string-literal
    equivalence: divergent
    code: |
      String s = "he said \"hi\"";   // @note! 只有双引号是字符串，单引号是 char
      char c = 'a';                  // @note 有独立的字符类型，与长度为 1 的字符串不同
