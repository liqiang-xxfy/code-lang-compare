  - featureId: java2python/concurrency-exercise
    equivalence: analogous
    code: |
      import threading
      from concurrent.futures import ThreadPoolExecutor

      counter = 0
      cache = {}
      lock = threading.Lock()

      def bump(n):
          global counter
          for _ in range(n):
              counter += 1            # @note 这一处的 synchronized 可以删

      def get(key):
          with lock:                  # @note! 这一处必须保留：保护的是复合逻辑
              if key not in cache:
                  cache[key] = compute(key)
              return cache[key]

      with ThreadPoolExecutor(max_workers=4) as pool:
          for _ in range(4):
              pool.submit(bump, 1000)

      # @note! 两处结论不同的原因：GIL 保证单个字节码操作不撕裂，
      # 但"检查 key 在不在"与"写进去"之间照样可能被切走 —— 那是两个字节码
