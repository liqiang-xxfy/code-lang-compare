# cpp —— practice / toolchain
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: toolchain` 的那批：
# compile-run / bundler / linter-formatter / type-checker /
# runtime-version / repl。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组全部锚定**本机实际工具链**（g++ 14.2.0，MinGW-w64/UCRT），
# 每条都实跑过，因为有四条与「文档上说的」不一致：
# ① **不给 `-std` 时默认是 C++17**（实跑 `__cplusplus` = 201703），不是 C++23；
# ② `std::print` 在本机**需要额外链接 `-lstdc++exp`**（不加就 undefined reference）；
# ③ `import std;`（标准库模块）在 GCC 14.2 上**用不了**（要 GCC 15+），
#    而且模块开关在 14.2 上叫 `-fmodules-ts`（`-fmodules` 不被识别）；
# ④ `std::mdspan` / `std::flat_map` **没有**（前者 GCC 16、后者 GCC 15 才有）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-toolchain-v1
    generatedAt: '2026-10-04'

boxes:
  compile-run:
    code: |
      // @note 最基础的形态：编译加链接一条命令走完
      g++ hello.cpp -o hello
      ./hello

      // @note! **不给 -std 时默认是 C++17**（本机实跑：__cplusplus = 201703）
      // @note 想用新特性必须显式写：
      g++ -std=c++23 hello.cpp -o hello
      g++ -std=c++20 hello.cpp -o hello

      // 想在中间步骤停下（这是「四阶段」的口子）
      g++ -E hello.cpp > hello.i     # 只做预处理
      g++ -S hello.cpp               # 输出汇编 hello.s
      g++ -c hello.cpp               # 只编译成 hello.o，不链接

      // 多文件：一次给多个源文件，或者先各编成 .o 再链接
      g++ -c a.cpp -c b.cpp && g++ a.o b.o -o app
      g++ -I./include -L./lib -lmylib main.cpp -o app    # 头文件与库的搜索路径

      // @note 编译通过 ≠ 能跑 —— **链接错误**是单独一类：
      // @note 实跑「模板只声明不定义」得到的是
      // @note   `undefined reference to 'int add<int>(int, int)'`
      // @note 这在别的语言里没有对应阶段，是 C++ 特有的失败形态

      // @note 常用检查开关：-Wall -Wextra（警告）、-Werror（警告当错误）、
      // @note   -O2 / -O3（优化）、-g（调试信息）
    vs:
      javascript: |
        **两边的「跑起来」差了两个步骤**：JavaScript 改完文件直接 `node app.js`，
        没有编译这一层，也没有「编译过了但跑不起来」这种中间状态；
        C++ 要经过编译与链接两道，而且失败信息分属两套
        （编译错误说代码，链接错误说符号找不到）。
        另一处是标准版本：JavaScript 的引擎版本决定了你能用什么特性，
        语句直接生效；C++ 必须显式写 `-std=c++23`，**不写就是 C++17**
        （本机实测）—— 也就是说「文档里说有的特性」在你这儿可能默认用不了。
      python: |
        两边的反馈循环长度差得很远：Python 保存即运行，
        语法错误当场报；C++ 要编译（可能几十秒），
        而且模板代码的错误信息可以刷好几屏。
        另一处是「未定义的符号」这类问题在 Python 里是
        NameError / ImportError（说得清楚），
        C++ 里是链接期的 `undefined reference`，对新手来说
        常常看不出是「少了一个定义」还是「少链接了一个库」。
        共同点是两边都要管「编译开关」这件事，只是 C++ 的开关更多、更关键。
      java: |
        两边的编译模型**结构上最像**（都是编译加运行两步），
        连「编译产物 + 运行时」的形态都对应。差别在两处：
        ① C++ 的编译与链接是**分开的两个概念**（编译单元各自编译，
        链接器再拼），Java 的编译是一步到位产出 class 文件；
        ② C++ 有**标准版本开关**这件必须操心的事
        （不写 `-std` 就是 C++17），Java 的语言版本由 JDK 与
        `--release` 决定，默认值没那么容易踩坑。
        另一处是 C++ 的头文件包含路径要靠命令行传，Java 用 classpath。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  bundler:
    code: |
      // @note! C++ 的「打包」不是一条命令，而是**一整套构建系统**

      // 单文件项目：直接 g++ 就行（上面那一格）
      // 真实的项目几乎都用 CMake：
      cmake -B build -S .          # 配置（生成构建文件）
      cmake --build build          # 构建
      ctest --test-dir build       # 跑测试

      // 产物形态有好几种，各有各的用途：
      //   hello.o       目标文件（一个编译单元的产物）
      //   libfoo.a      静态库（链接时被复制进可执行文件）
      //   libfoo.so     共享库（运行时加载；Windows 上是 .dll）
      //   hello         可执行文件

      // @note! 与别的语言最大的不同：**链接方式是一个设计选择**
      // @note 静态链接 → 产物自包含、体积大、升级要重编
      // @note 动态链接 → 产物小、可共享、但部署时要带上 .so/.dll

      // @note 交叉编译靠换一整套工具链（不是加个 flag）——
      // @note 编译器、标准库、链接器都得是目标平台的那一份
    vs:
      javascript: |
        两边「打包」这个词指的是完全不同的东西：JavaScript 打包是为了
        **浏览器**（把模块合并、把新语法降级、把体积压小），
        产物仍然需要运行时；C++ 的构建是为了产出**机器码**，
        最终产物是可以直接运行的可执行文件或库。
        另一处是链接方式：JavaScript 没有这个概念（一切都在运行时加载），
        C++ 要选静态还是动态链接，而这个选择直接影响部署与升级方式。
        还有一处是 C++ 的构建配置本身是一门学问（CMake 语言），
        那边 `package.json` 里几行脚本就够。
      python: |
        两边的差距在**要不要编译**：Python 的「分发」是把源码与依赖打包
        （wheel / 可执行文件打包器），解释器负责执行；
        C++ 的构建是编译加链接，产出机器码，
        所以「交付什么」这件事两边完全不同（一个交付源码、一个交付二进制）。
        另一处是 Python 的打包生态碎但都基于同一套解释器，
        C++ 的构建系统要同时管编译器、标准库版本、依赖的编译方式 ——
        这是 C++ 项目构建配置动辄几百行的原因。
      java: |
        两边**结构上比较像**（都要编译、都产出可分发的产物），
        差别在链接的层次：Java 产出 class 文件与 JAR，
        「链接」发生在运行时（类加载器按需加载）；
        C++ 的链接在构建期完成，符号必须全部解析好，
        所以「缺一个实现」是构建失败而不是运行时异常。
        另一处是 C++ 要选静态/动态链接，Java 基本只有
        「打成一个 fat JAR」这一种主流做法。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  linter-formatter:
    code: |
      // @note! C++ **没有官方工具** —— ISO 标准不管代码风格，
      // @note! 最常被冠以「官方」名义的是 C++ 核心准则（Core Guidelines），
      // @note! 但它是社区文档，不是标准

      // 实际用的都是 LLVM 那一套：
      clang-format -i src/*.cpp        # 格式化（配置文件 .clang-format）
      clang-tidy src/*.cpp             # 静态检查（配置文件 .clang-tidy）

      // 编译器自己也给一堆警告，这是最基础的「检查」：
      g++ -Wall -Wextra -Wpedantic -Wshadow -Wconversion ...

      // @note 风格没有共识：Google / LLVM / Mozilla 各有一套 .clang-format，
      // @note 换项目就得重新适应 —— 这一点与有官方格式化器的语言差别很大

      // @note 而 clang-format / clang-tidy 都属于 **LLVM 工具链**，
      // @note 不是 ISO 的东西；本机装的是 g++，这两个不在里面
      // @note （要另外装 LLVM，或者用 g++ 自己的警告 + 别的工具）
    vs:
      javascript: |
        两边都是「检查器与格式化器分开、而且都是外挂工具」，
        这一层很像。差别在**有没有官方那一套**：JavaScript 生态里
        ESLint 加 Prettier 几乎是默认组合（配置一抄就行）；
        C++ 连风格都没有统一标准，`clang-format` 要选一套预设
        （Google / LLVM / Mozilla…），换项目就得换习惯。
        另一处是 C++ 的检查很大一部分只能靠**编译器的警告**
        （本机用 g++，就没有 clang-tidy），
        所以「装了哪套编译器」会影响你能拿到什么检查。
      python: |
        两边都有「格式化器 + 检查器」的组合（`black` + `ruff` 那一套），
        而且都主张少配置 —— 这一点两边越来越像。差别在**标准归属**：
        Python 的格式化器虽然也是第三方的，但生态已经收敛到一个默认
        （`black` / `ruff format`）；C++ 没有收敛，
        `clang-format` 内置了好几套风格预设，选哪套是个团队决定。
        另一处是 C++ 的格式化工具属于 LLVM 工具链，与编译器是两家人。
      java: |
        两边都有成熟的工具，而且**形态几乎对应**
        （`clang-format` ↔ `google-java-format`、
        `clang-tidy` ↔ Checkstyle / SpotBugs）。
        差别在「默认有多强」：Java 项目的检查规则集通常要自己裁一版，
        但风格格式化工具有明确事实标准；
        C++ 反过来 —— 检查工具（编译器警告）开箱就有，
        风格反而没有共识，每换一个项目就要适应一套 `.clang-format`。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  type-checker:
    code: |
      // @note! C++ 的类型检查**就是编译** —— 没有独立的「只检查」命令

      g++ -fsyntax-only hello.cpp     # 最接近「只检查」的口子：不产出任何东西

      // 类型错误在编译期就拦下：
      //   int x = "文本";              → 编译错误
      //   double d; int* p = &d;       → 编译错误
      //   std::string s = 1;           → 编译错误（没有隐式转换）

      // @note 但有一大类「类型看起来对」的问题编译器管不了 ——
      // @note 它们落到**未定义行为**那一桶：
      // @note   数组越界、空指针解引用、有符号溢出、悬垂引用、
      // @note   迭代器失效、数据竞争…… 这些编译期一句都不说

      // @note 所以 C++ 的工具链里，除了编译器还有别的角色补这块：
      // @note   静态分析器（clang-tidy）、运行时检查（sanitizer：-fsanitize=address）
      // @note   本机的 g++ 支持 -fsanitize=address,undefined，是查 UB 的主力

      // @note 还有一条与类型有关的检查是**编译期的**：
      // @note   static_assert 与 concept —— 类型不满足直接在编译期报
    vs:
      javascript: |
        **两边差别很大**：JavaScript 本身不做类型检查，
        要另装一个检查器、另跑一遍（而且可以无视它）；C++ 的类型检查
        **内建在编译里**，类型不对根本编不出东西。
        但有一处反直觉：C++ 的类型检查**只管类型**，
        管不了越界、空指针、悬垂这些 —— 那些是未定义行为，
        编译期静默通过、运行期可能什么都不发生。
        JavaScript 那边越界读至少给你一个确定的值（`undefined`）。
      python: |
        两边的姿态相反：Python 的类型检查是**额外的可选步骤**
        （装检查器、单独跑，结论不影响程序能不能跑）；
        C++ 的类型检查是编译的一部分，不过就编不出东西。
        另一处更值得注意：C++ 的类型正确**不代表程序正确** ——
        未定义行为（越界、悬垂、数据竞争）都发生在类型系统的盲区里，
        这也是 C++ 需要 sanitizer 这类工具的原因。
        Python 里同样的错误通常是一个明确的异常。
      java: |
        两边都内置类型检查，但**检查发生在哪一步不同**：
        Java 的类型检查就是编译（没有独立的「只检查」命令），
        C++ 也是（虽然有个 `-fsyntax-only` 的口子）。
        真正的差别在**运行时保障**：Java 的数组越界抛
        ArrayIndexOutOfBoundsException、空引用抛 NPE —— 错误是确定的；
        C++ 的越界与空指针解引用是未定义行为，可能崩溃、
        也可能静默继续跑。所以 C++ 的类型检查覆盖的安全面
        比 Java 小得多，缺的那块要靠工具补。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  runtime-version:
    code: |
      // @note! C++ 管两件版本：**编译器**的与**标准**的

      g++ --version                    # 编译器版本（本机：14.2.0）
      g++ -std=c++23 ...               # 用哪一版标准（不写就是 C++17）

      // @note 不同编译器支持的标准不一样，同一标准不同版本的支持面也不一样
      // @note 本机实跑确认（g++ 14.2）：
      // @note   有：std::print（**但要加 -lstdc++exp**）、std::expected、
      // @note       std::generator、std::stacktrace、多维下标
      // @note   没有：std::mdspan（要 GCC 16）、std::flat_map（要 GCC 15）、
      // @note       import std;（标准库模块，要 GCC 15）
      // @note 所以「C++23 有什么」这个问题必须落到**具体工具链**上回答

      // @note 另一件别的语言没有的事：**没有稳定的 ABI**
      // @note 标准里根本没有 ABI 这个概念，业界靠 Itanium C++ ABI
      // @note 这套事实标准（GCC 与 Clang 都用），换来的是
      // @note 「换个编译器版本，之前编好的库可能链接不上」

      // 多版本共存靠换整套工具链（或容器），没有「切版本」的命令
    vs:
      javascript: |
        两边都管版本，但**管的对象不同**：JavaScript 管的是**运行时**
        （Node 的版本，靠版本管理器切换，代码不用重编）；
        C++ 管的是**编译器版本与标准版本**两件，
        而且换版本意味着**重新编译全部代码**。
        另一处是 C++ 的标准版本要显式写（不写就是 C++17），
        而「这个编译器到底支持哪些特性」还得单独查 ——
        因为同一版本标准在不同编译器上支持面不一样。
      python: |
        两边都有「版本决定能用什么」这一层，但 Python 是**解释器版本**
        一个维度，C++ 是编译器版本加标准版本两个维度，而且可以自由组合
        （同一个 g++ 14.2 能编 C++17 或 C++23，行为不同）。
        另一处是 ABI：Python 的扩展模块跨小版本通常能用，
        C++ 换个编译器版本编出的库就可能链不上 ——
        这是 C++ 生态普遍从源码构建的直接原因。
      java: |
        两边都有「语言版本与运行时版本」这层关系，Java 用
        `--release` 指定目标版本、由 JDK 保证兼容；
        C++ 用 `-std=` 指定标准版本，但**没有任何兼容保证** ——
        换编译器、换标准库实现（libstdc++ / libc++）、
        换编译器版本，编出来的东西都可能不兼容。
        Java 的字节码是稳定的中间格式，C++ 直接产出平台机器码，
        这也是为什么 Java 能「编一次到处跑」而 C++ 不能。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  repl:
    code: |
      // @note! C++ **没有官方 REPL** —— 编译型语言没有「敲一行立刻求值」这条路

      g++ hello.cpp && ./hello      # 唯一可靠的办法：写文件、编译、运行

      // @note 社区里有一个常被提起的替代品：cling（CERN 做的 C++ 解释器，
      // @note 基于 LLVM）—— 它能做到「敲一行立刻求值」，
      // @note 但它不是标准的一部分，也不随编译器分发

      // @note 编译器给了几个「看中间产物」的口子，可以当半个探针用：
      g++ -E file.cpp               # 看预处理之后长什么样（宏展开、头文件内容）
      g++ -S file.cpp               # 看生成的汇编
      // @note 这些能帮你理解代码，但不是交互式执行

      // @note 实际开发里最接近「随手试一段」的是：
      // @note   编辑器里的静态分析（不执行但报类型错）
      // @note   单元测试（改一次跑一次，反馈也就是几秒）
      // @note   以及在线编译器（Compiler Explorer 这类，能看汇编）
    vs:
      javascript: |
        **这一格是直接的能力缺失**：JavaScript 的交互环境是运行时自带的
        （敲一下命令就进），而且有浏览器控制台这种随手可用的工具；
        C++ 的语言工具链里没有这个入口 —— 只有第三方解释器
        （cling）和在线编译器。
        所以那边「随手试一行」的习惯，在这边要改成写个临时文件再编译，
        一趟下来几秒到几十秒，反馈循环长了两个数量级。
      python: |
        两边的落差最大：Python 的交互解释器是语言的一部分
        （REPL 是官方文档里的教学工具，也是日常调试手段）；
        C++ 根本没有 —— 这不是「做得不好」，是编译模型决定的：
        源码要先变成机器码才能跑，没有可以立刻求值的解释器。
        部分替代是 `-E` 看预处理结果、`-S` 看汇编，
        那对理解机制很有用，但不能交互。
      java: |
        两边都是**编译型语言里没有自带交互环境**的例子，
        这一点处境相同（Java 要到较新版本才有 `jshell`）。
        差别在替代品的成熟度：Java 的 `jshell` 是正式工具、
        随 JDK 分发；C++ 这边只有第三方解释器（cling）
        和在线编译器 —— 开发机上没有官方入口。
        两边共同的替代办法都是「写个最小的文件再编译」，
        只是 C++ 的编译更慢一点。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
