  - featureId: basics-python/arg-passing
    equivalence: identical
    code: |
      function mutate(items) { items.push(4); }     // @note 原地改：调用方看得见
      function rebind(items) { items = [9]; }       // @note 重新绑定：调用方看不见

      const xs = [1, 2, 3];
      mutate(xs);                     // xs 变成 [1, 2, 3, 4]
      rebind(xs);                     // xs 不变

      // @note 完全一致：传的是对象引用的副本。改内容会传染，改绑定不会
