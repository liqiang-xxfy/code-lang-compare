id: concepts-python/03-abstraction
topicId: concepts-python
title: 抽象与错误
order: 3
summary: 怎么组织代码、怎么表达「必须具备的能力」、怎么处理出错
features:
  - id: concepts-python/class-inheritance
    title: 类与继承
    kind: concept
    summary: 你有 MRO 与多继承、没有真私有；JS 单继承但有语言级私有

  - id: concepts-python/interface
    title: 接口与协议
    kind: concept
    summary: 你有 Protocol 与 ABC 两种强制手段，JS 在语言层面一种都没有

  - id: concepts-python/generics
    title: 泛型
    kind: concept
    summary: TypeVar 是渐进的可选标注，JS 连标注语法都没有，泛型全靠 TS

  - id: concepts-python/error-handling
    title: 错误处理
    kind: concept
    summary: except 必须写类型，而 JS 能 throw 任何东西，catch 到的不一定是 Error
