snippets:
  - featureId: concepts-python/type-system
    equivalence: identical
    code: |
      1 == "1"      # False —— 类型不同就是不等，不做隐式转换
      1 + "1"       # 抛 TypeError，而不是拼成 "11"
    body: |
      Python 是**动态 + 强类型**：类型属于运行时的值，但类型不符就抛异常 ——
      `1 + "1"` 直接 `TypeError`，不做任何猜测。错误总以异常形式出现，
      调用栈直接指到出错那一行。

  - featureId: concepts-python/numeric-type
    equivalence: identical
    code: |
      9007199254740993      # 原样保留 —— int 是任意精度
      7 // 2                # 3 —— 向下取整；7 / 2 得 3.5
    body: |
      Python 的 `int` 是**任意精度**（不溢出、不丢精度），`float` 是双精度，
      需要精确小数时另有 `Decimal`。「溢出」这个概念在这里根本不存在，
      要精确小数也不必换类型体系，只是换一个类。

  - featureId: concepts-python/null-value
    equivalence: identical
    code: |
      x is None             # 只有一个空值，判断统一用 is
      0 or "默认"            # "默认" —— or 兜底会吃掉合法的 0 与空串
    body: |
      Python 只有一种「没有」：`None`，而且惯例用 `is None` 判断（`is` 比对象身份，
      `==` 可以被重载，所以不用它）。

      `value or default` 这条惯用兜底要当心：`0`、`""`、`[]` 都是假值，
      会被当成缺失吃掉 —— 兜底要显式写 `if value is None`。

  - featureId: concepts-python/value-semantics
    equivalence: identical
    code: |
      a = {"n": 1}
      b = a
      b["n"] = 2
      a["n"]                # 2 —— 可变对象赋值即共享
      s = "x"               # 不可变对象怎么传都安全
    body: |
      Python 里说「一切皆引用」，实际结论要看可变性：`list` / `dict` / `set` 可变，
      赋值、传参、放进容器都是共享；`int` / `str` / `tuple` 不可变，怎么传都安全。
      「传值还是传引用」这个问法容易带偏，真问题是「这个值能不能被改」。

      `tuple` / `frozenset` 这种「不可变又复合」的类型是关键：既能安全共享，
      又能当字典键 —— 这正是不可变作为**类型属性**才拿得到的好处。
