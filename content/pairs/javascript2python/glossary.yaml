# 速语词典 —— 从 JavaScript 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 是 error，写第三门会被拦下）
#
# 选词标准：**同名不同义**优先。含义相同的词（函数、循环、字符串）不必收 ——
# 读者不会误解的东西，收了只是稀释。

- term: 对象
  aliases: [object]
  perLanguage:
    javascript: '"对象" 默认指 Object 字面量，也可以泛指一切非原始值'
    python: '"对象" 指一切值（连整数都是对象）；没有专门对应 Object 字面量的说法'
  note: 「对象」是这个方向上同名异义最严重的一个词。

- term: 列表 / 数组
  aliases: [array, list]
  perLanguage:
    javascript: Array（可变、长度可变、元素类型可混）
    python: list（可变）；tuple（不可变，常被误当成「固定长度数组」）
  note: Python 的 list 不是链表，是动态数组，扩容策略与 JS 数组接近 —— 性能直觉可以直接迁移。

- term: 字典 / 哈希表
  aliases: [dict, map, hash]
  perLanguage:
    javascript: Object 字面量（键只能是字符串或符号）或 Map（任意键）
    python: dict（任意可哈希键，3.7 起保证插入有序）
  note: JS 那边 Object 与 Map 的语义不同（键类型、原型链、遍历顺序），Python 只有一个 dict —— 在选择上反而更省心。

- term: 接口
  aliases: [interface, protocol]
  perLanguage:
    javascript: 没有语言级概念，靠结构性隐式满足 —— 对象有对应的方法就算「是」它，没有 implements 可写
    python: Protocol（typing，结构化，3.8+）或 ABC（抽象基类，名义式，必须显式继承）
  note: |
    同一个词在两边的重量完全不同：Python 的 ABC 是**名义式**，不显式继承就不算实现；
    而 JS 那边根本没有可继承的东西。说「我实现了一个接口」时，两门语言指的不是一回事。

- term: 模块
  aliases: [module, package]
  perLanguage:
    javascript: 一个文件即一个模块（ESM）；package 指从 npm 装来的那个东西
    python: 一个 .py 文件是 module，含 __init__.py 的目录是 package
  note: 「module 装进 package」这层从属关系在 Python 里有明确语法，JS 那边没有对应的层级。

- term: 闭包
  aliases: [closure]
  perLanguage:
    javascript: 函数捕获定义时所在的词法环境
    python: 同一套机制，但循环变量是**单个绑定** —— 与 JS 早年的 var 是同一个坑
  note: 机制一致，坑也一致。差别只在于 JS 用 let 把它修掉了，Python 的 for 变量仍然共享。

- term: 装饰器
  aliases: [decorator]
  perLanguage:
    javascript: 提案语法 @decorator，写在类与方法上，生态里用得还不普遍
    python: 成熟的语法特性 @decorator，可作用于任意函数与类，本质是高阶函数
  note: |
    两边 @xxx 长得一模一样，含义却天差地别 —— 同名不同义的高危词。
    Python 的装饰器就是「把函数传进去、换一个函数出来」，看穿这一层就不会被语法糖骗到。

- term: 迭代器 / 可迭代
  aliases: [iterator, iterable, generator]
  perLanguage:
    javascript: 协议是 Symbol.iterator + next()；异步版本用 for await
    python: __iter__ / __next__；生成器函数用 yield，且是一次性消耗品
  note: 两边的生成器都只能遍历一次，重复遍历要显式转成列表 —— 这条直觉可以直接迁移。

- term: 类型转换
  aliases: [cast, coercion]
  perLanguage:
    javascript: 隐式转换大量存在（`+`、`==`、比较），显式转换用 Number() / String()
    python: 几乎不做隐式转换，一律显式 int() / str() / float()
  note: 「弱类型 vs 强类型」的实际差别就在这里，而不是在有没有类型标注上。

- term: 可变默认参数
  aliases: []
  perLanguage:
    javascript: 默认参数每次调用重新求值，不存在这个问题
    python: '`def f(x=[])` 里的 `[]` 只求值一次，会被所有调用共享'
  note: 只有 Python 这一侧有这个问题。它之所以反复出现在面试题里，是因为症状（跨调用串数据）离原因（默认值求值时机）很远。
