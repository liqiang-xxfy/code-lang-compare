- featureId: basics/var-global-declaration
  equivalence: divergent
  code: |
    class Counter {
      static int counter = 0;      // @note static 字段 ≈ 全局状态

      static void bump() {
        counter += 1;              // @note 直接改静态字段，不需要任何「声明意图」
      }

      static void shadow() {
        int counter = 99;          // @note 局部变量遮蔽静态字段，编译器不会警告
        System.out.println(counter);
      }
    }

    // @note! Java 没有 Python 那种「函数内赋值默认是局部」的陷阱，但代价是
    //        全局可变状态毫无保护 —— 想限制它只能靠把字段设为 private + 只暴露方法
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/var-shadowing
  equivalence: analogous
  code: |
    class Example {
      int value = 1;                    // 字段

      void method() {
        int value = 2;                  // @note 局部变量遮蔽同名字段（合法，且不会警告）
        System.out.println(value);       // 2
        System.out.println(this.value);  // @note 用 this. 取回被遮蔽的字段 -> 1
      }
    }

    // @note 遮蔽类型名也可以（比如定义 class String 会盖掉 java.lang.String），
    //       但 Java 有包与导入机制限制影响范围，危害远小于 Python 里覆盖内置函数
