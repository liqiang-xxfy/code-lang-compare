# JavaScript 视角下的「数据与抽象」章节分组 —— 按**运行时对象**组织。
#
# JS 的心智模型里，模块、错误、容器、对象都是「值」，边界清楚，
# 所以这里一章对一组，顺序是「拿进来 → 出错怎么办 → 装数据 → 走一遍 → 造对象 → 抽象」。
# 换成 Java 基准时顺序会变（接口在实现之前），见 java.yaml。

section: model
baseline: javascript

chapters:
  - id: imports
    title: 模块与导入
    summary: ESM 的导出导入、解析规则与循环依赖
    features: [module-unit, export-import, default-vs-named, namespace-alias, module-resolution]

  - id: errors
    title: 错误处理
    summary: throw / try / finally，以及错误对象的形态
    features: [throw-raise, try-catch, finally-cleanup, error-types, custom-error, error-propagation]

  - id: collections
    title: 集合与容器
    summary: Array / Map / Set 的形态与选择
    features: [list-array, map-dict, set, tuple-record, collection-mutability, slicing]

  - id: iteration
    title: 迭代与生成
    summary: 生成器、迭代器与惰性求值
    features: [generator-yield, comprehension, lazy-evaluation, destructuring]

  - id: objects
    title: 对象与类
    summary: 字面量、class 与原型链
    features: [class-declaration, constructor, fields-and-properties, methods-and-receiver, inheritance, access-control]

  - id: abstraction
    title: 抽象与多态
    summary: 接口在 JS 里是什么，以及鸭子类型
    features: [interface, abstract-class, mixin-trait, duck-typing]
