# dart —— model / iteration
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: iteration` 的那批：
# generator-yield / comprehension / lazy-evaluation / destructuring。
#
# 口径说明：这一组最要命的一条是**惰性**：`map` / `where` / `take` / `skip`
# 返回的都是**惰性的 `Iterable`**，不调 `toList()` 就什么都没算 ——
# 从一门「数组方法直接返回数组」的语言过来时，这是最容易误判的一处。
# 第二条生成器**分两种**，由返回类型决定（`sync*` 给 `Iterable`、`async*` 给 `Stream`），
# 三个基准都没有「用返回值类型区分同步与异步生成器」这种设计。

review:
  state: draft

boxes:
  generator-yield:
    code: |
      // 同步生成器：返回 Iterable
      Iterable<int> countdown(int from) sync* {
        for (var i = from; i > 0; i--) {
          yield i;                     // @note yield 一次产出一个值
        }
      }
      countdown(3).toList();           // @note [3, 2, 1]

      // 异步生成器：返回 Stream
      Stream<int> ticks(int n) async* {
        for (var i = 0; i < n; i++) {
          await Future.delayed(Duration(seconds: 1));
          yield i;
        }
      }

      // yield* 把一个可迭代对象整个交出去（不用自己写循环）
      Iterable<int> naturalsDownFrom(int n) sync* {
        if (n > 0) {
          yield n;
          yield* naturalsDownFrom(n - 1);   // @note 委托给另一个生成器
        }
      }

      // @note! 同步还是异步**由返回类型决定**：Iterable 配 sync*，Stream 配 async*
    vs:
      javascript: |
        两边都用 `yield`，但**生成器的种类与标记方式不同**：
        JavaScript 用 `function*` 加 `yield`，异步用 `async function*`，
        靠关键字前缀区分；Dart 用 `sync*` / `async*`，
        而且**返回类型必须写对** —— 写 `Iterable` 配 `sync*`、
        `Stream` 配 `async*`，配错了编译不过。
        委托这一层两边都有（`yield*` 对 `yield*`），
        差别在 Dart 用它之前必须先声明生成器的种类与返回类型。
      python: |
        两边的 `yield` 用法接近，但**函数怎么变成生成器**不同：
        Python 里只要函数体出现 `yield` 就自动变成生成器，返回类型不用写；
        Dart 必须显式标 `sync*` 并声明返回 `Iterable<T>` ——
        多写了两个地方，换来的是「读签名就知道它是生成器」。
        另一处是异步：Python 的异步生成器是 `async def` 加 `yield`，
        Dart 是 `async*` 加返回 `Stream`，概念对得上、写法不同。
        `yield*` 与 Python 的 `yield from` 作用相同。
      java: |
        Java 完全没有生成器语法 —— 要「按需产出一串值」只能实现 `Iterator`，
        或者用 `Stream.generate` / `Stream.iterate`（能表达无穷流，
        但写有状态的分支很别扭）。Dart 的 `sync*` 里能写普通的
        `for` 与 `if`，`yield` 想放哪放哪，这一层比 Java 明显好写。
        两边手写迭代器的形状则完全一样（都要给 `moveNext` / `hasNext` 那一对）。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  comprehension:
    code: |
      var xs = [1, 2, 3, 4];

      // @note Dart **没有**推导式语法（没有 [x for x in xs] 这种东西）
      // @note 官方给的替代是「集合字面量里直接写 if 与 for」
      var doubled = [for (var v in xs) v * 2];                  // @note [2, 4, 6, 8]
      var evens = [for (var v in xs) if (v.isEven) v];          // @note [2, 4]
      var pairs = [for (var v in xs) if (v.isEven) '$v!' else '-'];   // @note 还能带 else

      // @note 映射与集合字面量里同样能写
      var m = {for (var v in xs) v: v * v};
      var s = {for (var v in xs) v % 3};

      // @note 也可以退回方法链，两者可以混用
      xs.where((v) => v.isEven).map((v) => v * 2).toList();

      // @note! 方法链返回的是惰性 Iterable，字面量写法**立刻**得到集合
    vs:
      javascript: |
        JavaScript 没有集合字面量里的控制流，只能 `.filter().map()` 一条链 ——
        而那条链是**急切**的，每一步都产生一个中间数组；
        Dart 的 `[for (...) if (...) ...]` 只在最后产出一个集合，
        中间不落地。两者能表达的东西一样，Dart 的写法更紧凑。
        另一处是 Dart 那套方法链反而**是惰性的**（见下一格），
        所以同一个语言里两种写法连求值时机都不同。
      python: |
        **这是写法上分野最大的一处**：Python 的 `[x * 2 for x in xs if ...]`
        一行讲完「取哪些、每个怎么变」，是语法；
        Dart 要写 `[for (var v in xs) if (v.isEven) v * 2]` ——
        同样是一行，但把 `for` 与 `if` 显式写出来了，
        读起来更像「在字面量里跑一段循环」而不是一个推导公式。
        两边都能嵌多层、都能在字典里用，能力相当。
        差别在于 Dart 的这种写法**立即求值**，Python 的推导式也是；
        反而是 Dart 的方法链是惰性的。
      java: |
        Java 的流链（`stream().filter().map().collect()`）与 Dart 的
        方法链可以逐条对应，都要收尾才能拿回集合。
        差别在**多一种写法**：Dart 能在集合字面量里直接写 `for` 与 `if`，
        Java 里没有对应物 —— 这让「构造一个经过筛选的列表」
        在 Dart 里可以是一行字面量，在 Java 里必须写成流管道。
        另一处是惰性：Java 的流默认惰性、必须 collect；
        Dart 的字面量写法是急切的，方法链才是惰性的，同一个语言里两种时机。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  lazy-evaluation:
    code: |
      var xs = [1, 2, 3];

      // @note! map / where / take / skip / expand / getRange 返回的是
      // @note! **惰性的 Iterable** —— 不调终端方法就什么都没算
      var lazily = xs.map((v) { print('算 $v'); return v * 2; });
      print('到这里还没算过');        // @note 上面那行不会打印任何东西
      lazily.toList();                // @note 这时才逐个跑

      xs.where((v) => v > 1);         // @note 惰性；无匹配时给空 Iterable，不抛
      xs.firstWhere((v) => v > 9);    // @note! 这个无匹配会抛 StateError
      xs.singleWhere((v) => v > 1);   // @note! 多于一个也会抛

      // @note 急切的那些：toList / sublist / sort / add
      xs.toList();                    // @note 这时候才落地成一个 List

      // @note! 惰性链**可以反复遍历** —— 每次取迭代器都重新求值；
      // @note! 这一点与「流 / 迭代器只能消费一次」的语言相反，别搞混
      // @note Iterable 没有下标 —— 只能 elementAt()（线性查找）
    vs:
      javascript: |
        **这是最容易误判的一处**：JavaScript 的 `map` / `filter`
        **急切**，直接返回新数组，链上每一步都落地；
        Dart 的 `map` / `where` 是**惰性**的，返回的是 `Iterable`，
        不调 `toList()` 就什么都没算 —— 所以 Dart 的链更快，
        但也意味着「什么时候算」与那边不同，中间插副作用会看到不同的时机。
        另一处是类型：JavaScript 的数组方法返回数组，
        Dart 返回的 `Iterable` **没有下标**，要 `elementAt()` 或先落地。
      python: |
        两边在这一格上**立场一致**：Python 3 的 `map` / `filter`
        也是惰性的，返回迭代器；Dart 的 `map` / `where` 返回惰性 `Iterable` ——
        都不算到最后一刻。所以从 Python 过来在这件事上不会有意外。
        差别在**落地方式**：Python 用 `list(...)`，Dart 用 `.toList()`；
        以及 Dart 多一个「字面量写法是急切的」这个例外（见上一格）。
        但**「能不能反复遍历」这一点两边相反**：Python 的 `map` / `filter`
        返回迭代器，消费一次就耗尽；Dart 的 `Iterable` 每次取迭代器都重新求值，
        同一根惰性链可以反复 `toList()` —— 只有 `Stream` 才是一次性的。
      java: |
        两边的默认相反：Java 的流**默认就是惰性的**，必须 `collect`
        才拿回集合；Dart 的 `List` 是急切的，只有 `map` / `where`
        这些方法返回的 `Iterable` 才惰性 —— 也就是说
        **惰性在这边取决于你手上是 `List` 还是 `Iterable`**，
        同一个链上转一下类型，求值时机就变了。
        **「能不能反复遍历」这一条只有 Java 有坑**：流消费一次就废了；
        Dart 的 `Iterable` 每次取迭代器都重新求值，同一根链可以反复遍历
        （只有 `Stream` 才是一次性的）。所以那边「用过的流不能再用」这条纪律
        在这边不成立。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  destructuring:
    code: |
      // record 解构（位置）
      var point = (1, 2);
      var (x, y) = point;

      // record 解构（命名）
      var named = (name: 'Ada', age: 30);
      var (name: n, age: a) = named;

      // 列表模式：按下标匹配
      var list = [1, 2, 3];
      var [first, second, ...rest] = list;      // @note rest 是 [3]
      if (list case [int a, int b, int c]) print(a + b + c);

      // 对象模式：按 getter 名字取
      var u = User('Ada', 30);
      var User(:name, :age) = u;                // @note 冒号简写：按同名变量绑定
      var User(name: who, age: years) = u;      // @note 想换名字就在字段名下写变量名
      // @note! 两种语境的写法不同：声明处写 `:name`，
      // @note! 而 `case` 里要写 `name: var who`（那里没有现成的变量可绑）

      // 循环里解构
      var m = {'a': 1};
      for (var MapEntry(key: k, value: v) in m.entries) { }
      for (var (k2, v2) in m.entries.map((e) => (e.key, e.value))) { }

      // @note! 对象模式按**名字**匹配，所以字段名改了这里会编译不过 ——
      // @note! 与按位置解构相比，这既是保护也是约束
    vs:
      javascript: |
        两边都能解构，但**依据不同**：JavaScript 的对象解构按属性名
        （名字写错得到 undefined，不报错），数组解构按位置；
        Dart 的模式两者都有，而且**名字写错编译不过** ——
        同一件事在这边是编译期检查。
        另一处是能力：Dart 的模式能带类型（`[int a, int b]`）、
        能用在 `if-case` 与 `switch-case` 里做分支判断，
        JavaScript 的解构只能取值、不能当条件用。
      python: |
        两边的解构写法接近（`x, y = point` ↔ `var (x, y) = point`），
        也都能带星号收集剩余（`a, *rest = xs` ↔ `[a, ...rest] = list`）。
        差别在**对象解构**：Dart 的对象模式按 getter 名字匹配、
        还能带类型，Python 没有对应语法，只能逐个取属性；
        反过来 Python 的元组解包对任何可迭代对象都成立，
        Dart 的列表模式只对列表（或实现了对应协议的）成立。
      java: |
        Java 到较新的版本才有解构（record 模式已转正，
        但**只能用在模式匹配的场合**，不能像 Dart 那样随手写一句解构声明）。
        Dart 的 `var (x, y) = point`
        把两步取值收成一个动作，而且能嵌在 `if-case` / `switch-case` 里
        当条件用 —— 这是 Java 完全没有的一层。
        另一处是匹配依据：Java 的 record 模式按**类型 + 位置**匹配，
        Dart 的对象模式按**名字**匹配，所以字段改名时
        两边受影响的方式不同：一边是模式失效，一边是编译不过。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent
