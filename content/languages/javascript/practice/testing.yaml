# javascript —— practice / testing
#
# boxes 的 key 必须是 catalog/practice/features.yaml 里 `group: testing` 的那批：
# test-framework / assertions / mocking / parameterized-tests / coverage。

review:
  state: draft

boxes:
  test-framework:
    code: |
      // vitest（或 jest）：测试文件靠**命名约定**被发现
      //   foo.test.js / foo.spec.js / __tests__/foo.js
      import { describe, it, expect } from "vitest";

      describe("购物车", () => {
        it("空车总价为零", () => {       // @note it 是 test 的别名
          expect(total([])).toBe(0);
        });
        beforeEach(() => { /* 每个用例前的准备 */ });
      });

      // @note! 没有「测试类」这回事 —— 用例就是函数，靠闭包共享状态
      // @note 跑：npx vitest / npx vitest run（CI 里用后者，不进 watch）
    baseline: |
      测试文件靠**命名约定**被发现（`*.test.js` / `*.spec.js` / `__tests__/`），
      用例就是普通函数，用 `describe` 分组、`it` 声明单个用例。
      **没有测试类**，共享状态靠闭包与 `beforeEach` 这类钩子 ——
      所以每个用例之间的隔离要自己保证，顺序也不能依赖。
    vs:
      python: |
        两边都是「约定发现文件 + 函数即用例」，连 `describe` / `it` 与
        pytest 的 `class` / `def test_` 都能大致对上。差别在配置方式：
        JavaScript 要一堆配置（跑哪个环境、怎么转译），
        pytest 基本零配置。
      java: |
        Java 的测试必须写在**类**里（`@Test` 标注的方法），
        靠注解与构建工具集成发现；这里用例是自由函数。
        一边是「测试是一等类成员」，一边是「测试就是函数」。
    equivalence:
      python: analogous
      java: divergent

  assertions:
    code: |
      expect(x).toBe(1);              // @note! 严格相等 —— 对象比引用
      expect(obj).toEqual({ a: 1 });  // @note! 深比较 —— 对象用这个
      expect(x).toBeTruthy();
      expect(fn).toThrow(/无效/);      // @note 断言抛错，可匹配消息
      expect(p).rejects.toThrow();     // @note 异步断言的写法
      expect(x).not.toBe(2);           // @note 取反

      // @note! toBe 与 toEqual 混用是最常见的错：
      //        toBe 比引用，两个内容相同的对象也不相等
    baseline: |
      断言是 `expect(实际).匹配器(期望)` 的风格，匹配器很全（真值、抛错、
      异步、快照…）。最要记住的一对是 `toBe`（严格相等，对象比引用）
      与 `toEqual`（深比较）—— 混用会让「明明一样却不过」成为最常见的困惑。
      异步断言有专门的 `rejects` / `resolves`，不写它会静默通过。
    vs:
      python: |
        Python 直接用内建 `assert`（pytest 会重写它，失败时给出详细的
        两侧值对比），不需要记匹配器名字。代价是没有 `toEqual` 那种
        明确的深比较语义 —— 但 `==` 在 Python 里本来也比内容。
      java: |
        Java 用静态方法：`assertEquals(期望, 实际)`（**参数顺序是反的**）、
        `assertThrows`。类型系统能保证参数类型对，但可读性不如链式匹配器
        —— 「哪个是期望哪个是实际」写反了不会报错。
    equivalence:
      python: divergent
      java: divergent

  mocking:
    code: |
      import { vi } from "vitest";

      const fn = vi.fn();                    // @note 假函数，记录调用
      fn.mockReturnValue(42);
      fn.mockResolvedValue({ ok: true });    // @note 异步替身
      expect(fn).toHaveBeenCalledWith("a");

      vi.mock("./api");                      // @note 整个模块替换掉（会提升到顶部）
      vi.spyOn(obj, "save").mockReturnValue(true);   // @note 只替换一个方法

      // @note! 模块级 mock 是提升的 —— 写在哪都等价于写在文件最上面
      // @note 用完记得 restore（配置里开 restoreMocks 更省心）
    baseline: |
      用 `vi.fn()` 造假函数、`vi.mock()` 整个模块替换、`vi.spyOn()` 只替换一个
      方法。模块级 mock 会被**提升到文件顶部**，所以它管的是「这个模块被
      引入时是什么」，而不是运行到那一行才生效 —— 这一点初学时最容易误解。
      记得恢复原状（配置里开 `restoreMocks` 比逐个手动省心）。
    vs:
      python: |
        Python 用 `unittest.mock`：`MagicMock` 自动生成任意属性与方法，
        `patch` 既可以是装饰器也可以是上下文管理器，作用域写得比这里清楚。
        用法相近，但 Python 的替身默认更「万能」，JavaScript 的要显式配置返回值。
      java: |
        Java 靠 Mockito 这类库：`when(...).thenReturn(...)` / `verify(...)`，
        而且它**默认不能 mock 静态方法与 final 类**（要靠额外插件）。
        这里假函数随手就造，没有那些限制 —— 代价是没有类型约束。
    equivalence:
      python: analogous
      java: analogous

  parameterized-tests:
    code: |
      // vitest / jest：用 each 表格化
      it.each([
        [1, 1, 2],
        [2, 3, 5],
      ])("add(%i, %i) === %i", (a, b, expected) => {
        expect(add(a, b)).toBe(expected);
      });

      it.each`
        a    | b    | expected
        ${1} | ${1} | ${2}
      `("add($a, $b)", ({ a, b, expected }) => { ... });

      // @note! 一个用例失败会带上参数，不需要猜是哪组数据
      // @note 也可以用 for 循环生成用例 —— 但那样失败时的定位更差
    baseline: |
      用 `it.each`（或 `describe.each`）把「同一段逻辑、多组输入」写成表格，
      失败时输出会带上具体参数，一眼知道是哪组。用 `for` 循环动态生成用例
      也能跑，但失败信息里没有参数上下文，排查更费劲，所以优先用 `each`。
    vs:
      python: |
        Python 用 `@pytest.mark.parametrize` 装饰器，参数名与值分成两个
        参数写，一个用例函数能叠多个 parametrize（做笛卡尔积）。
        表达力相当，写法一个是装饰器、一个是链式方法。
      java: |
        Java 用 `@ParameterizedTest` 加数据源注解（`@ValueSource` /
        `@CsvSource` / `@MethodSource`），数据可以来自方法。
        两边都是「注解/方法声明一批数据」，Java 的类型更强、写法更啰嗦。
    equivalence:
      python: analogous
      java: analogous

  coverage:
    code: |
      npx vitest run --coverage       // @note 默认用 v8，也有 istanbul
      // 配置里设阈值，低于就失败：
      //   coverage: { thresholds: { lines: 80, branches: 70 } }

      // CI 里：跑测试 -> 出覆盖率 -> 上传（Codecov 之类）
      // @note! 覆盖率只说明"哪些行被执行过"，不说明断言是否有效
      //        追着数字写测试会得到一堆没断言的调用
    baseline: |
      覆盖率是测试运行器的一个开关（`--coverage`），能设阈值让 CI 在低于时失败、
      能上传到平台看历史。**它只说明哪些行被执行过，不说明断言有没有意义** ——
      追数字会写出一堆「调用了但没断言」的测试，那种测试只在代码崩溃时才有价值。
    vs:
      python: |
        Python 这边是独立插件（pytest-cov），配置写在 pyproject 或命令行。
        两边都把「低于阈值就失败」做成了开关，也都面临同一个误解
        （覆盖率不等于测试质量）。
      java: |
        Java 用 JaCoCo，集成进构建工具，能生成 HTML 报告并设阈值。
        能力一致，区别只在集成方式：这里是跑测试时加个开关，
        Java 是构建生命周期里的一个任务。
    equivalence:
      python: analogous
      java: analogous
