- featureId: js2java/param-passing
  equivalence: identical
  code: |
    // 与 JS 结论一致，而且 Java 的规则更硬：**只有值传递**，没有例外
    static void mutate(List<Integer> list) {
        list.add(4);                 // 调用方看得见
    }

    static void reassign(StringBuilder sb) {
        sb = new StringBuilder("新的");   // @note 只改了本地副本，调用方看不到
    }

    // @note 「传对象看起来像传引用」是因为**引用的副本**指向同一个对象，
    //       不是引用本身被传进去了。给参数重新赋值可以立刻验证这一点。
    //
    // @note 与 JS 唯一要重学的地方：Java 的基本类型（int/boolean/double）是真值，
    //       没有 Number/String 包装对象那一层。
