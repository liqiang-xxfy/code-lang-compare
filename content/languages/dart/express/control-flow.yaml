# dart —— express / control-flow
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: control-flow` 的那批：
# conditionals / loops / iteration-protocol / switch-and-match。
#
# 口径说明：这一组有三条与多数语言不同的硬事实 ——
# **三元运算符在**（Dart 的 `if` 是语句，所以保留了 `? :`）、
# **C 式三段 for 也在**（与 Kotlin 相反），
# 而**迭代器协议是 `moveNext()` + `current`**（不是 hasNext / next 那一对）。
# 后一条是三个基准都没有的形状，写的时候要正面讲清楚。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-control-flow-v1
    generatedAt: '2026-10-03'

boxes:
  conditionals:
    code: |
      var x = 7;
      var label = x > 0 ? "正" : "负";     // @note 三元运算符在（if 是语句，取不了值）

      if (x > 0) {                         // @note 当语句用，与别处一样
        print("正数");
      } else if (x == 0) {
        print("零");
      }

      // @note! 条件必须是 bool：Dart 没有真值判断
      var items = <int>[];
      // if (items) { }                     // @note! 编译错误：List 不是 bool
      if (items.isNotEmpty) { }

      // @note 空安全还能顺手做判空分支
      String? name = maybeName();
      if (name != null) {
        print(name.length);                // @note 这里 name 已经是 String
      }
    vs:
      javascript: |
        三元运算符、`if` 语句、条件必须是布尔值 —— 这一格两边几乎逐条相同。
        差别在**类型提升**：JavaScript 里 `if (name != null)` 只是这次分支的判断，
        之后 `name` 还是原来的类型；Dart 在判空之后会把 `name` 当成非空类型用，
        不需要再写感叹号。也就是说同样是判空分支，Dart 那边多做了一件事。
      python: |
        两边的「真值判断」立场相反：Python 里 `if items:` 是地道写法，
        靠空列表为假这套规则；Dart 要求条件必须是 `bool`，
        空列表得写 `items.isEmpty`。看起来更啰嗦，
        但 Python 里 `if x:` 究竟在判 None、判 0 还是判空，得回头看 x 的类型。
        表达式这一层相反：Dart 保留了三元运算符（因为 `if` 是语句），
        Python 用 `x if cond else y`，两边的写法不同但用途一样。
      java: |
        两边都有三元运算符、`if` 也都是语句、条件都必须布尔 —— 三条都一致。
        差别在**判空之后的收益**：Java 里 `if (name != null)` 判断完
        还是得靠人记住「这里它不为空」，编译器不知道；
        Dart 的判空会让编译器把 `name` 收窄成非空类型，
        之后连 `!` 都不用写。另一个差别是 Dart 没有 `switch`
        贯穿那种坑（见本组第四格），条件分支的读法更平。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  loops:
    code: |
      for (var i = 0; i < 5; i++) { }       // @note C 式三段循环：Dart 保留了
      for (final item in [1, 2, 3]) { }     // @note for-in 遍历可迭代对象

      var n = 0;
      while (n < 3) { n++; }                // @note while / do-while 都在
      do { n--; } while (n > 0);

      // @note 标签 + break / continue：跳出多层循环
      outer:
      for (var i = 0; i < 3; i++) {
        for (var j = 0; j < 3; j++) {
          if (j == 1) continue outer;
        }
      }

      // @note 集合也能直接遍历，还有 collection-for 这个字面量写法
      var doubled = [for (var v in [1, 2]) v * 2];   // @note [2, 4]

      // @note! for-in 的循环变量默认不可改（上面写 final 是显式的同义写法）
    vs:
      javascript: |
        三段循环、`for...of`、`while`、标签加 `break` —— 这些 JavaScript 都有，
        这一格两边几乎逐字对应。差别在**多一个集合字面量里的循环**：
        Dart 能在写列表字面量时直接嵌一个 `for`（`[for (var v in xs) v * 2]`），
        相当于把映射写成字面量；JavaScript 只能先 `.map()` 一下。
        另一处是循环变量：Dart 的 `for-in` 变量不能重新赋值，那边的可以。
      python: |
        Python 的 `for` 是「遍历可迭代对象」，没有三段式；
        Dart 两种都有，所以从 Python 过来时用 `for-in` 那套最接近，
        不必去碰三段式。差别在**循环变量的去向**：
        Python 的循环变量出了循环还在（函数级作用域），
        Dart 的只活在循环体内。另外 Dart 有标签加 `break` 跳出多层循环，
        Python 里那要靠标志变量或者把循环抽成函数。
      java: |
        三段循环、增强 `for`、`while`、`do-while`、标签加 `break` ——
        这一格与 Java 几乎逐条相同，连语法都像。差别在
        **字面量里的循环**（collection-for 是 Dart 特有的写法）
        与 `for-in` 变量的可改性：Java 里
        `for (String s : list) { s = "x"; }` 合法（只是改了局部副本），
        Dart 里直接编译不过，得在循环体内另起一个变量。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  iteration-protocol:
    code: |
      var nums = [1, 2, 3];
      for (final n in nums) { }             // @note for-in 只要求对象是 Iterable

      // 手工走一遍，与 for-in 做的事一模一样：
      Iterator<int> it = nums.iterator;
      while (it.moveNext()) {               // @note! moveNext() 既推进又返回「还走不走得动」
        print(it.current);                  // @note 之后再用 current 取值
      }

      // 自定义类型也能被 for-in 遍历：
      class Countdown extends IterableBase<int> {
        final int from;
        Countdown(this.from);
        @override
        Iterator<int> get iterator => _CountdownIterator(from);
      }

      // @note 也可以用 sync* 生成器，比手写迭代器省事得多
      Iterable<int> countdown(int from) sync* {
        for (var i = from; i > 0; i--) yield i;
      }
    vs:
      javascript: |
        **协议的形状不同**：JavaScript 的迭代器只有 `next()`，
        它每次返回一个 `{value, done}` 的对象，「结束」体现在 `done` 字段上；
        Dart 的迭代器是**两步**：`moveNext()` 推进并告诉你还有没有下一个，
        `current` 再取当前值。所以 Dart 的 `for-in` 每一步都要调两次方法，
        JavaScript 那边只调一次。写自定义迭代器时这个差别最明显。
      python: |
        两边都要求一个「给出迭代器」的入口，但**迭代器的形状相反**：
        Python 只有 `__next__()` 一个方法，结束靠抛 `StopIteration`；
        Dart 是 `moveNext()` 返回布尔值加 `current` 取值，不用异常。
        一个是「异常驱动结束」，一个是「布尔判断结束」。
        另一处是 Dart 有生成器语法（`sync*` / `yield`），
        与 Python 的 `yield` 用途相同，写起来很像。
      java: |
        Java 的迭代器是 `hasNext()` 加 `next()` 两个方法，
        Dart 把它合并成了一个 `moveNext()` 加一个 `current` 属性 ——
        功能一样，但**调用次数与副作用不同**：Java 要先问再取，
        Dart 是「推进了就顺便告诉你」。自定义类型上两边都要
        显式实现接口，Java 要 `implements Iterable<T>`，
        Dart 通常 `extends IterableBase<T>`（省掉一堆重复的转发方法）。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  switch-and-match:
    code: |
      var code = 2;
      switch (code) {                       // @note 传统 switch 语句
        case 1:
          print("一");
          break;                            // @note! 非空分支不写 break：编译期就报错
        case 2:
        case 3:                             // @note 空的 case 才允许「贯穿」下来
          print("二或三");
          break;
        default:
          print("其他");
      }

      // Dart 3：switch 表达式 + 模式匹配
      var name = switch (code) {
        1 => "一",
        2 || 3 => "二或三",                  // @note 逻辑或模式
        >= 4 && <= 9 => "个位数",            // @note 关系模式
        _ => "其他",                         // @note 通配
      };

      // @note 密封类上漏分支会**编译不过** —— 穷尽性检查
      sealed class Shape { }
      class Circle extends Shape { }
      class Square extends Shape { }

      String describe(Shape s) => switch (s) {
        Circle() => "圆",                    // @note 这里不写 default 也合法
        Square() => "方",
      };

      // @note if-case：在普通 if 里用模式
      if ([1, 2] case [int a, int b]) print(a + b);
    vs:
      javascript: |
        **贯穿的处理相反**：JavaScript 的 `switch` 会静默贯穿，
        忘了 `break` 就掉进下一个分支，是最经典的 bug 之一；
        Dart 的非空分支不写 `break` 直接编译不过，坑从语法上堵住了
        （只有空的 `case` 允许落下去）。另一处是能力：
        JavaScript 的 `case` 只能写常量，Dart 3 的模式能写类型、范围、
        解构、逻辑组合，还能把 `switch` 当表达式赋值。
      python: |
        Python 直到 3.10 才有 `match`，在那之前只能靠一长串 `if / elif`；
        Dart 的 switch 一直都在，Dart 3 又补上了模式与表达式形式。
        两边的模式语法与守卫条件思路接近。
        差别在**穷尽性**：Python 的 `match` 不检查你漏没漏，
        Dart 在密封类与枚举上会检查 —— 漏一种就编译不过，
        把「忘了处理新加的那种情况」变成了编译器能拦下的问题。
        贯穿则只有 Dart 有（Python 从来没有）。
      java: |
        Java 的经典 `switch` 与 Dart 的传统 `switch` 同为「常量分支 + `break`」，
        但**兜底方式相反**：Java 忘了 `break` 会静默贯穿到下一个分支，
        编译器不吭声；Dart 直接报错，只有空 case 才允许落下。
        Java 较新的版本也在补模式匹配与箭头 case，方向与 Dart 3 一致，
        但 Dart 这边还多一条：**密封类上的穷尽性检查**，
        漏分支编译不过，Java 的 `switch` 至今没有这一层。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
