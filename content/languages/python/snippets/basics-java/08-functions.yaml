  - featureId: basics-java/function-docstring
    equivalence: divergent
    code: |
      def greet(name):
          """打个招呼。"""
          return f"你好，{name}"

      greet.__doc__      # @note! '打个招呼。' —— 是字符串对象，运行时能直接读到
      help(greet)        # @note 交互式帮助能打印出来

      def bad():
          x = 1
          """这不再是 docstring"""      # @note! 必须是函数体的第一条语句
      # @note 因为它是"数据"，doctest 能直接执行文档里的示例并比对输出 —— Java 的 Javadoc 做不到
  - featureId: basics-java/arg-passing
    equivalence: identical
    code: |
      def mutate(xs):
          xs.append(4)          # @note 看得见
      def rebind(xs):
          xs = [9]              # @note 看不见

      def bump(n):
          n += 1                # @note 看不见

      xs = [1, 2, 3]
      mutate(xs)                # @note xs 变成 [1, 2, 3, 4]
      rebind(xs)                # @note xs 不变

      k = 1
      bump(k)                   # @note k 还是 1

      # @note! 结论与 Java 完全一致：改内容会传染，改绑定不会。
      # @note! 但"整数改不动"的原因不同：Java 是**值复制**，这里是**整数不可变**。
      # 结论相同，机制不同 —— 遇到自定义的不可变类型时要按这边的机制推
