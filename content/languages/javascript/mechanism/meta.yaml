# javascript —— mechanism / meta
#
# boxes 的 key 必须是 catalog/mechanism/features.yaml 里 `group: meta` 的那批：
# reflection / decorator-annotation / dynamic-eval / proxy-interception。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-meta-v1
    generatedAt: '2026-10-03'

boxes:
  reflection:
    code: |
      // @note 运行期随手就能问一个对象有什么
      Object.keys(obj);                  // @note 自己的可枚举属性
      Object.getOwnPropertyNames(obj);   // @note 含不可枚举的
      "x" in obj;                        // @note! 会顺原型链找
      obj.constructor.name;              // @note 类名字符串（压缩后会变）

      // Reflect：把语言内部操作变成函数
      Reflect.get(obj, "x");
      Reflect.has(obj, "x");
      Reflect.ownKeys(obj);
      Reflect.getPrototypeOf(obj);

      // @note! 反射拿不到私有字段（#x）—— 它是真私有
      // @note 类的字段/方法都能被列举、被替换、被删掉
    baseline: |
      **运行期反射很自然** —— 对象本来就是一张可枚举的属性表，`Object.keys` /
      `in` / `Reflect` 都能问。`Reflect` 把「取值、判断存在、拿原型」这些内部操作
      变成了普通函数，配合 `Proxy` 用。唯一的盲区是 `#` 私有字段：
      它是真私有，反射也拿不到。
    vs:
      python: |
        Python 的反射同样是日常工具（`getattr` / `dir` / `inspect`），
        而且连**类本身都是对象**、能动态创建与修改。两边的差别在
        Python 多一整套 `inspect`（签名、源码、调用栈）可以用。
      java: |
        Java 的反射要走 `java.lang.reflect`，而且从「普通代码」到「反射」是
        一次明显的跨越：能拿到字段与方法、但可能受模块系统限制，
        性能也不同。这里（JS）的反射就是普通的属性访问，没有那一层门槛。
    equivalence:
      python: analogous
      java: divergent

  decorator-annotation:
    code: |
      // @note! 语言里**没有装饰器语法** —— 标准还在推进中
      //   现在要用只能靠转译器（TypeScript 的 experimentalDecorators 等）
      //   @logged
      //   class Service { }

      // 不用语法也能达到同样效果：高阶函数 / 高阶类
      function logged(fn) {
        return (...args) => { console.log(fn.name, args); return fn(...args); };
      }
      const save = logged(doSave);

      const withTimestamp = (Base) => class extends Base {
        createdAt = Date.now();
      };
    baseline: |
      **没有装饰器语法**（还在标准化的路上，现在要靠转译器）。要做「给声明附加
      行为」这件事，惯用手法是**高阶函数与高阶类** —— 接收一个函数/类、
      返回增强后的版本。这套写法很灵活，代价是没有语法标记，
      读代码时要顺着包装层往里看。
    vs:
      python: |
        Python 的装饰器是**一等语法**（`@logged` 直接写在函数上面），
        而且能带参数、能堆叠。这里只能靠高阶函数包装，
        写起来形似但读起来差一层。
      java: |
        Java 的注解（`@Override`）只是**元数据**，本身不改变行为 ——
        要靠注解处理器或运行期反射去读它做事情。两边都不是
        「写在声明上就自动生效」的那种装饰器。
    equivalence:
      python: divergent
      java: divergent

  dynamic-eval:
    code: |
      eval("1 + 1");                     // @note! 能拿到当前作用域的变量
      new Function("a", "b", "return a + b");   // @note 只在全局作用域里跑
      JSON.parse(str);                   // @note 需要的是数据就别用 eval

      // @note! 三个真实代价：
      //   1. CSP 默认禁止 eval —— 很多生产环境直接报错
      //   2. 性能：无法被引擎优化
      //   3. 安全：字符串来自外部就是注入

      const f = new Function("return this")();  // @note 沙箱逃逸的经典一步
    baseline: |
      有 `eval` 与 `new Function`，但**生产代码基本不该用**：内容安全策略
      （CSP）默认就禁掉 `eval`，性能上引擎没法优化它，而字符串一旦来自外部
      就是代码注入。需要解析数据用 `JSON.parse`，需要动态行为
      优先考虑查表或函数映射。
    vs:
      python: |
        Python 有 `eval`（只算表达式）与 `exec`（执行语句），
        同样有安全与性能代价，但没有 CSP 那层平台级限制。
        两边的结论一致：解析数据不用它，动态行为优先用查表。
      java: |
        Java **没有动态求值** —— 源代码在编译期就固定了。
        想做到类似的事得引入脚本引擎或动态生成字节码，那是很重的做法；
        这里一行 `eval` 就能跑。
    equivalence:
      python: analogous
      java: divergent

  proxy-interception:
    code: |
      const p = new Proxy(target, {
        get(t, k) { return k in t ? t[k] : "默认值"; },   // @note 拦截读取
        set(t, k, v) { t[k] = v; return true; },          // @note 拦截写入
        has(t, k) { return true; },                       // @note 拦截 in
        apply(t, thisArg, args) { },                      // @note 拦截函数调用
      });

      p.anyKey;                   // @note "默认值" —— 读什么都有
      "whatever" in p;            // @note true

      // 典型用途：负下标数组、只读包装、日志、参数校验、Vue 3 的响应式
      // @note! 拦截不到私有字段（#x）
      // @note! 代理不是透明的：this 会指向 Proxy，某些内建方法会因此出错
    baseline: |
      `Proxy` 能在**语言层面拦截**对象的读取、写入、`in`、删除、函数调用等
      十几种操作 —— 这是 JS 里唯一能做到「无侵入地改变一个对象的全部行为」的
      机制，响应式框架都靠它。两个要留意的地方：拦截不到 `#` 私有字段，
      以及 `this` 会指向代理而不是原对象，某些内建方法会因此出错。
    vs:
      python: |
        Python 用 `__getattr__` / `__getattribute__` / `__setattr__` 这些
        魔术方法做同样的拦截，写在类里而不是包在外面。
        两边都能做响应式与代理，区别是侵入方式：这里是外加一层，
        Python 是类自己实现。
      java: |
        Java 的 `Proxy` 只能代理**接口**（动态代理），要代理类得靠字节码增强库。
        而且它拦的是方法调用，不像这里连属性读取、`in` 都能拦。
    equivalence:
      python: analogous
      java: divergent
