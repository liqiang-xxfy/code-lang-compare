id: basics-java/06-objects
topicId: basics-java
title: 对象与字典
order: 6
summary: 没有字典字面量、record 与 Map 要选对、深拷贝得自己写——从 Java 出发看这一层

features:
  - id: basics-java/object-create
    title: 创建对象与映射
    kind: syntax
    summary: 没有字面量，且 record 与 Map 是两种不同的选择

  - id: basics-java/object-access
    title: 取值与缺失行为
    kind: behavior
    summary: get 缺省返回 null，与"值是 null"分不清

  - id: basics-java/object-iterate
    title: 遍历键值
    kind: syntax
    summary: entrySet 或 forEach，顺序看实现类

  - id: basics-java/object-default
    title: 缺失键的默认值
    kind: behavior
    summary: getOrDefault 只读，computeIfAbsent 会写入

  - id: basics-java/object-merge
    title: 合并与更新
    kind: syntax
    summary: 只有原地合并，要新对象得自己先拷一份

  - id: basics-java/object-nested
    title: 嵌套与深拷贝
    kind: behavior
    summary: 没有内置深拷贝，浅拷贝还得自己写

  - id: basics-java/object-comprehension
    title: 推导式与批量构造
    kind: syntax
    summary: 构造映射靠流收集器，重复键默认报错

  - id: basics-java/object-equality
    title: 对象相等比较
    kind: behavior
    summary: equals 与 hashCode 必须成对，数组是个例外

  - id: basics-java/object-json
    title: JSON 序列化
    kind: behavior
    summary: 标准库完全没有 JSON，必须引第三方
