snippets:
  - featureId: concepts-java/collections
    equivalence: identical
    code: |
      List<String> list = new ArrayList<>();         // 容器是类，必须带泛型
      Map<String, Integer> counts = new HashMap<>(); // 键要实现 equals / hashCode
      list.add("a");
    body: |
      Java 的容器是**类**：`ArrayList`、`HashMap`、`HashSet`，都必须带泛型参数，
      没有字面量语法（`List.of(1, 2)` 是工厂方法）；`HashMap` 的键要正确实现
      `equals` / `hashCode`。

  - featureId: concepts-java/immutable-data
    equivalence: identical
    code: |
      String s = "x";                 // String 天生不可变
      List.of(1, 2);                  // 不可变集合，修改抛异常
      record Point(int x, int y) {}   // 不可变浅值对象
    body: |
      Java 的不变性有几种载体：`String` 天生不可变；`List.of` / `Map.of` 产出不可变集合；
      `record` 提供不可变的浅值对象；`final` 约束字段不能重新赋值。

  - featureId: concepts-java/string-format
    equivalence: identical
    code: |
      String.format("%.2f", 3.14159)   // "3.14" —— printf 风格格式串
      String.format("%,d", 1234567)    // "1,234,567"
    body: |
      Java 有库级的 printf 风格格式化：`String.format("%.2f", n)`、`%d`、
      `%,d`（千分位）、`%10s`（对齐）；循环拼接用 `StringBuilder`；多行文本用文本块 `"""`。

  - featureId: concepts-java/regex
    equivalence: identical
    code: |
      Pattern p = Pattern.compile("\\d+");
      p.matcher("a12").matches()   // false —— matches 要求整串匹配
      p.matcher("a12").find()      // true —— find 才找任意位置
    body: |
      Java 的正则要经过 `Pattern.compile` 再 `matcher(...)`：`matches()` 要求**整串匹配**，
      `find()` 才找任意位置的子串；命名分组是 `(?<name>...)`；`Pattern` 编译有开销，
      循环里要预编译。

  - featureId: concepts-java/serialization
    equivalence: identical
    code: |
      // 标准库没有 JSON，要引 Jackson / Gson
      new ObjectMapper().writeValueAsString(obj);   // Jackson
    body: |
      Java **标准库没有 JSON** —— 要序列化对象得引 Jackson / Gson 这类库，靠反射或注解
      把对象映射成 JSON；JDK 自带的 `Serializable` 是另一套二进制机制，且长期被视为
      安全隐患，新代码不建议用。

  - featureId: concepts-java/date-time
    equivalence: identical
    code: |
      LocalDate d = LocalDate.of(2026, 1, 5);   // 月份从 1 起
      d.plusMonths(1);                          // 不可变：返回新对象
      ZonedDateTime.now(ZoneId.of("UTC"));      // 时区是一等概念
    body: |
      Java 的 `java.time`（`LocalDate`、`Instant`、`ZonedDateTime`）是**不可变的**，
      月份从 1 开始，时区是一等概念；旧的 `java.util.Date` / `Calendar` 可变且月份从 0 起，
      已被弃用。
