  - featureId: basics-python/object-access
    equivalence: divergent
    code: |
      java.util.Map<String, Integer> d = new java.util.HashMap<>();
      d.put("a", 1);

      d.get("a");                  // 1
      d.get("z");                  // @note! null —— 缺失返回空值，不抛异常

      d.getOrDefault("z", 0);      // 0 —— 想给默认值用这个

      // @note 危险之处：值本身可以为 null 时，"键不存在"与"键存在但值是 null"
      // 用 get 分不出来，必须配合 containsKey
      d.containsKey("z");          // false

      // @note 没有点号/方括号的访问语法，一律是方法调用
  - featureId: basics-python/object-iterate
    equivalence: analogous
    code: |
      for (var e : d.entrySet()) {
          e.getKey();
          e.getValue();
      }

      d.forEach((k, v) -> { });              // @note 最简洁的形式：一次拿到键和值

      d.keySet();                            // 只要键
      d.values();                            // 只要值

      // @note! 遍历时不能直接改结构，会抛 ConcurrentModificationException；
