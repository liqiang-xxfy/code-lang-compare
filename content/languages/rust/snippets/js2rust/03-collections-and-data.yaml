  - featureId: js2rust/collections-exercise
    equivalence: analogous
    code: |
      #[derive(Clone)]
      struct Employee { name: String, dept: String, age: u32 }

      // @note! 参数用 &[Employee]（借用切片）而不是 Vec<Employee> —— 不夺走调用方的所有权
      fn group_by_dept(employees: &[Employee]) -> std::collections::HashMap<String, Vec<String>> {
          let mut groups: std::collections::HashMap<String, Vec<String>> = std::collections::HashMap::new();
          for e in employees {
              groups.entry(e.dept.clone())              // @note! entry API 一次查找
                    .or_insert_with(Vec::new)
                    .push(e.name.clone());
          }
          groups
      }

      fn avg_age(employees: &[Employee]) -> Option<f64> {
          if employees.is_empty() { return None; }      // @note! Option 而不是 null
          let total: u32 = employees.iter().map(|e| e.age).sum();
          Some(f64::from(total) / employees.len() as f64)   // @note! 不转 f64 就是整数除法
      }

      // @note or_insert_with 与 or_insert 的差别：前者传闭包，只在需要时才构造默认值；
      // 默认值构造成本高时（比如要分配 Vec）用它更划算
      // @note name 用 String 是因为结构体要拥有这些数据；如果结构体带生命周期，也可以用 &str
