# javascript —— basics/03-operators 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas

- featureId: basics/equality
  equivalence: divergent
  code: |
    1 == "1";        // true    —— @note! 会做隐式类型转换
    1 === "1";       // false   —— 工程规范：一律用 ===

    "" == 0;         // true    —— @note! 空字符串等于 0
    null == undefined; // true
    NaN === NaN;     // false   —— @note! 唯一的自反不等，用 Number.isNaN()

    Object.is(NaN, NaN); // true
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/arithmetic
  equivalence: divergent
  code: |
    7 / 2;                // 3.5  —— @note 整数相除也是浮点
    7 % 2;                // 1
    -7 % 2;               // -1   —— @note! 结果符号跟被除数走

    Math.trunc(7 / 2);    // 3    —— 取整要显式调用
    Math.floor(-7 / 2);   // -4   —— @note 注意与截断的区别
    2 ** 10;              // 1024
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/logical-short-circuit
  equivalence: analogous
  code: |
    // && 与 || 返回的是操作数本身，不是布尔值
    const a = "" || "default";     // "default"
    const b = "x" && "y";          // "y"

    // ?? 只在左值为 null / undefined 时兜底（0 和 "" 会保留）
    const c = null ?? "fallback";  // "fallback"
    const d = 0 ?? "fallback";     // 0 —— @note! 这正是 ?? 与 || 的关键差别

    obj?.method?.()                 // @note 可选链可安全调用
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/truthiness
  equivalence: divergent
  code: |
    // 假值只有 8 个：false, 0, -0, 0n, "", null, undefined, NaN
    Boolean("");     // false
    Boolean("0");    // true  —— @note 非空字符串恒为真

    Boolean([]);     // true  —— @note! 空数组是真值
    Boolean({});     // true  —— @note! 空对象也是真值
    Boolean(new Map()); // true
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/optional-chaining
  equivalence: divergent
  code: |
    const city = user?.address?.city;    // @note 链路中任一环为 null / undefined → 整体 undefined
    const n = obj?.method?.();           // @note 也可安全调用方法
    const [first] = list ?? [];          // 解构时配合 ?? 兜底

    // 注意：?. 只短路「取值」，不吞掉异常。
    // 若 user.address 存在但 city 的 getter 抛错，仍然会抛。
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/bitwise
  equivalence: divergent
  code: |
    5 & 3;           // 1
    5 | 3;           // 7
    5 ^ 3;           // 6
    ~5;              // -6   —— @note 按位取反（补码），不是「逻辑非」
    1 << 3;          // 8
    1 << 31;         // -2147483648   —— @note! 溢出到符号位
    -1 >>> 0;        // 4294967295    —— @note 无符号右移，Python 没有这个运算符

    // @note! 所有位运算都先把操作数转成「32 位有符号整数」再算，
    //        位宽外的部分直接丢——所以大数做位运算会静默出错
    (2 ** 31) | 0;   // -2147483648

    // @note 常用技巧：`n | 0` 取整（有范围限制）、`n & 1` 判奇偶
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/comparison-operators
  equivalence: divergent
  code: |
    '2' < 10;        // true   —— @note! 字符串被隐式转成数字
    '2' < '10';      // false  —— @note! 两边都是字符串时按 UTF-16 码元逐位比较，不是数值比较
    'a' < 'B';       // false  —— @note! 小写字母的码元大于大写
    [1] < [2];       // true   —— @note 数组先转成字符串再比，'1' < '2'

    null < 1;        // false  —— null 转成 0？不，这里走的是另一套规则，结果反直觉
    undefined < 1;   // false

    // @note! Python 3 里 '2' < 10 直接抛 TypeError，不允许跨类型比较大小
    // @note JS 里这类隐式转换不会报错，只会给出错误答案
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/increment-decrement
  equivalence: divergent
  code: |
    let i = 0;

    i++;             // 返回旧值 0，然后 i 变成 1（后缀）
    ++i;             // i 先变成 2，返回新值 2（前缀）
    i--;             // 后缀减
    --i;             // 前缀减

    i += 1;          // 与 ++i 效果相同，但返回的是新值（它是赋值表达式）
    i -= 1;

    const arr = [1, 2];
    let k = 0;
    arr[k++];        // 1 —— @note! 「取值并前进」，一行做两件事

    // @note! Python 完全没有 ++ / --，i++ 在那里是语法错误；
    //        arr[k++] 必须拆成「先取值、再 k += 1」两行
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/chained-comparison
  equivalence: divergent
  code: |
    const x = 5;

    0 < x < 10;             // @note! 结果是 true，但原因不是「x 在区间内」
    // 实际执行顺序：(0 < x) => true，然后 true < 10 => 1 < 10 => true
    // 换成 x = -5 再看看：
    const y = -5;
    0 < y < 10;             // 仍然是 true ！因为 (0 < -5) => false => 0 < 10 => true

    x > 0 && x < 10;        // 正解：必须用逻辑与拆开

    // @note! 这个表达式不报错、结果恒为 true，是「看起来对、实际全错」的典型
    // @note Python 的 0 < x < 10 是真正的链式比较，语义就是数学区间
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'
