  - featureId: js2python/concurrency-exercise
    equivalence: analogous
    code: |
      import asyncio

      cache = {}

      async def compute(k):
          return k * 2

      async def get(k):
          if k not in cache:                 # @note 检查后写入
              cache[k] = await compute(k)    # @note! 这里有 await —— 会被切走，复合动作不原子
          return cache[k]

      async def main():
          await asyncio.gather(get(1), get(1))    # @note compute(1) 可能被算两次

      asyncio.run(main())

      # @note! 三个问题的答案：
      # 1. JS 里不需要加锁（单线程，最坏是白算一遍）；
      #    asyncio 里同样不需要"锁"，但复合动作依然不原子 —— 要防重复计算得用
      #    asyncio.Lock，或者把结果缓存改成"先建占位"
      # 2. compute 是同步 CPU 密集时，它会**卡住整个事件循环** ——
      #    所有协程都停住，而 JS 里至少不会这样（那边没有共享的循环可卡）
      #    解法是 await asyncio.to_thread(compute, k) 或换 multiprocessing
      # 3. 只有真的用了 threading（多线程共享内存）才需要 threading.Lock；
      #    纯 asyncio 里需要的是 asyncio.Lock，两者不能混用
