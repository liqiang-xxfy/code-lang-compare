# Python 视角下的「工程实践」章节分组 —— 与 javascript.yaml 的差别在措辞与重心。
#
# 一处按 Python 心智模型做的调整：**虚拟环境写进章节名**。
# 在 JS 里 node_modules 是天然的每项目隔离，Python 里「隔离」是一件要主动做的事
# （venv / conda / poetry），所以它是这一章的第一句话，而不是一条边角。

section: practice
baseline: python

chapters:
  - id: packages
    title: 包管理与虚拟环境
    summary: pip / poetry、requirements 与 venv
    features: [package-manager, dependency-declaration, version-constraint, lockfile, environment-isolation, publishing]

  - id: toolchain
    title: 构建、检查与工具链
    summary: 打包分发、格式化、类型检查与解释器版本
    features: [compile-run, bundler, linter-formatter, type-checker, runtime-version, repl]

  - id: testing
    title: 测试
    summary: pytest 的组织、夹具与参数化
    features: [test-framework, assertions, mocking, parameterized-tests, coverage]
