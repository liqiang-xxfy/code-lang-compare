snippets:
  - featureId: concepts-python/class-inheritance
    equivalence: identical
    code: |
      class A:
          def greet(self): return "A"     # self 是显式参数
      class B(A): pass                    # 支持多继承，super() 走 MRO 链
      a = A()
      a.__dict__                          # 没有真私有：_x 只是约定
    body: |
      Python 的 `class` 是一等公民：支持**多继承**，方法解析顺序由 MRO 决定
      （`super()` 走的是 MRO 链，不是「父类」这一个）；实例方法第一个参数是显式的 `self`，
      且取出来是**绑定的**（`obj.method` 自带 self）。

      私有这一格是空的：`_name` 是约定、`__name` 只是名称改写（name mangling），
      外部依然够得着 —— 「这个属性不该被外面碰」只能靠约定与文档。所以写 Python 时
      要自己记住哪些名字属于内部接口，语言不会替你拦。

  - featureId: concepts-python/interface
    equivalence: identical
    code: |
      from typing import Protocol
      class Renderable(Protocol):           # 结构化：长得像就算，不必显式继承
          def to_text(self) -> str: ...
      from abc import ABC, abstractmethod
      class Base(ABC):                      # 名义式：必须显式继承
          @abstractmethod
          def to_text(self) -> str: ...
    body: |
      Python 两种都有：`Protocol`（结构化 —— 「长得像就算」）与 `ABC`（名义式 ——
      「必须显式继承才能实例化」）。静态检查交给 mypy，运行时 ABC 还能在实例化时拦住
      不完整的实现 —— 「把一项约束写下来并能被强制」在这里有两种手段可选。

  - featureId: concepts-python/generics
    equivalence: identical
    code: |
      from typing import TypeVar
      T = TypeVar("T")
      def first(items: list[T]) -> T: ...   # 标注在运行时被擦除
    body: |
      Python 有 `typing.TypeVar` 等标注工具，但它是**渐进类型**：标注自愿、可以只标一部分，
      解释器自己不检查，检查交给 mypy 这类外部工具；类型参数在运行时被擦除，
      所以「用泛型来做运行时判断」在这里行不通。标注写错了也不会阻止程序运行，
      只会让检查器报错。

  - featureId: concepts-python/error-handling
    equivalence: identical
    code: |
      raise ValueError("出错了")     # 只能抛 BaseException 的子类
      try:
          risky()
      except ValueError as e:       # except 必须写类型
          pass
      else:
          pass                       # 多一个 else：没出错时执行
    body: |
      Python 只能抛 `BaseException` 的子类，`except` 必须写明类型（裸 `except:` 会连
      `KeyboardInterrupt` 一起吞掉，是明确的反模式）；`try/except/else/finally` 有一个
      `else`（没出错时执行，把成功路径从 `try` 里挪出来）。

      另外一点：这里**没有受检异常**，签名上看不出「这个函数可能抛什么」。
