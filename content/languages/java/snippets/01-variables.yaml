- featureId: basics/var-destructuring
  equivalence: absent
  body: |
    Java 没有解构赋值语句。最接近的两件事都要绕：

    - **模式匹配**（Java 21 正式）—— 但只能出现在 `instanceof` 与 `switch` 里，不是赋值语法
    - **逐字段取值** —— 老老实实 `p.x()`、`p.y()`

    迁移时的直觉要改：JS 里「一行拆出多个值」的写法，在 Java 里会展开成若干行。
  code: |
    record Point(int x, int y) {}
    Point p = new Point(1, 2);

    // 只能逐字段取
    int x = p.x();
    int y = p.y();

    // @note Java 21 的 record pattern：这是模式匹配，只在条件分支里用
    if (obj instanceof Point(int px, int py)) {
      System.out.println(px + py);
    }

    // @note! 别把它当解构赋值用 —— 它没有「一次绑定多个名字」的赋值语句形式
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/var-multiple-assign
  equivalence: divergent
  code: |
    int a = 1, b = 2;      // @note 同一行声明多个同类型变量（不是解构）

    int t = a; a = b; b = t;   // @note 交换必须引入临时变量：没有元组解包

    int x, y;
    x = y = 0;             // @note 链式赋值合法，从右往左（与 JS 同）

    // @note! JS 用 [a, b] = [b, a] 一行交换；Java 没有这个语法，只能走临时变量
  review:
    state: draft
    provenance:
      origin: llm
