- featureId: basics/exception-flow
  equivalence: divergent
  code: |
    try {
        risky();
    } catch (IOException | IllegalStateException e) {   // @note 一次捕获多种
        log(e);
    } catch (Exception e) {
        log(e);
    } finally {
        cleanup();                                       // @note 总会执行
    }

    // @note! Java 有 **checked exception**：方法签名必须写 throws，
    //        调用方不处理就编译不过 —— 这是 JS / Python 都没有的强制机制
    void read() throws IOException { }

    // @note try-with-resources 自动关闭（对应 Python 的 with）
    try (var in = new FileInputStream("f")) { }
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'
