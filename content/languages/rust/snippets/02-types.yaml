- featureId: basics/type-checking
  equivalence: divergent
  code: |
    // Rust 的类型检查绝大多数在编译期完成，运行时几乎没有「问类型」的需要
    std::any::type_name::<&str>();   // "&str" —— @note 仅用于调试，输出不保证稳定

    // 少数场景：对 trait 对象做向下转型
    let v: Vec<Box<dyn std::any::Any>> = vec![Box::new("hi")];
    v[0].downcast_ref::<&str>();     // Some("hi")

    // @note! 如果代码里频繁出现「运行时判断类型」，通常说明该改用
    //        enum + match 把可能性写进类型系统 —— 这是 Rust 的惯用修正方向
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/null-undefined
  equivalence: divergent
  code: |
    // @note! Rust 没有 null / undefined：空值由 Option<T> 表达，且必须显式处理
    let maybe: Option<&str> = None;

    match maybe {
        Some(s) => println!("{s}"),
        None => println!("没有"),
    }
    maybe.unwrap_or("默认值");

    // @note 这是 Rust 最著名的一条设计：把「可能没有」编进类型，
    //       让「忘记判空」变成编译错误，而不是运行时崩溃
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/number-precision
  equivalence: divergent
  code: |
    let a: i32 = 2_147_483_647;
    // a + 1                    // @note! debug 构建当场 panic（overflow）
    a.wrapping_add(1);          // -2147483648 —— @note 想显式接受回绕就用 wrapping_*
    a.checked_add(1);           // None          —— @note 想安全处理就用 checked_*

    0.1 + 0.2;                  // 0.30000000000000004 —— 浮点问题与 JS 相同

    u128::MAX;                  // @note 原生最大 128 位；再大要引入 num-bigint 这类 crate

    // @note! 与 JS 不同：Rust 的整数溢出在 debug 下会当场炸，
    //        逼你在「真的想回绕」和「写错了」之间做出选择
