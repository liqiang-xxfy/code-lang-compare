  - featureId: basics-python/array-sort
    equivalence: divergent
    code: |
      const xs = [10, 9, 1];
      xs.sort();                   // @note! [1, 10, 9] —— 默认按字符串比较
      xs.sort((a, b) => a - b);    // [1, 9, 10] —— 数值排序必须传比较器

      const ys = xs.sort((a, b) => a - b);
      // @note! sort 原地改**并返回同一个数组**，所以这种写法看着像"取排序副本"其实不是
