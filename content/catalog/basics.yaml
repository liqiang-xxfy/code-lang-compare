# 清单 —— 唯一真源。
#
# 章节顺序与 feature 顺序都是**数组顺序**：没有 order 字段，也没有文件名序号。
# 增删章节、调换顺序、改标题只动这一处，一个语言文件都不用碰。
#
# 这份清单**与语言无关**：它回答「我们要对比哪些点」，不回答「某门语言怎么讲」。
# 每门语言在各知识点上的写法见 content/languages/<语言>/basics/variables.yaml。
#
# 试点阶段只声明 variables 一章（Batch 0）——
# 见 docs/内容架构迁移实施步骤.md 的「第 6 章 · 内容爬坡」。

section: basics
title: 基础语法

chapters:
  - id: variables
    title: 变量与声明
    summary: 声明、可变性、作用域与遮蔽
    features:
      - id: declaration
        title: 变量声明
        kind: syntax
        summary: 如何在语言里引入一个名字
        tags: [comparison]

      - id: mutability
        title: 可变性与重新赋值
        kind: behavior
        summary: 名字能否改绑，值能否被修改
        tags: [comparison]

      - id: scope
        title: 作用域
        kind: behavior
        summary: 一个名字在哪里可见，由什么决定

      - id: hoisting
        title: 声明提升与暂时性死区
        kind: behavior
        summary: 声明语句执行前访问会发生什么

      - id: shadowing
        title: 遮蔽
        kind: behavior
        summary: 内层同名的名字覆盖外层
