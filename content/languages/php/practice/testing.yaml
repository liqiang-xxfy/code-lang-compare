# php —— practice / testing
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: testing` 的那批：
# test-framework / assertions / mocking / parameterized-tests / coverage。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组最容易写错的一条是**归属** ——
# **PHPUnit 不是 PHP 官方的项目**，它是 Sebastian Bergmann 的第三方项目
# （有「事实标准」的地位，但治理上是第三方的）。这一条几乎人人都想当然。
# 另一条是版本：2026-10 的当前大版本是 **PHPUnit 13**（2026-02-06 发布，
# **要求 PHP 8.4+**），不是常被写的 10 / 11。
#
# 三条要写准的：
# ① `assertEquals` 是**宽松**比较、`assertSame` 才是严格 —— 这是 PHPUnit 最经典的坑；
# ② 覆盖率**必须装驱动**（Xdebug 或 PCOV），PHPUnit 自己算不了，
#    而且**只有 Xdebug 能出分支覆盖率**、两者**不能同时开**；
# ③ 参数化测试的数据提供器自 PHPUnit 12 起**只能用 attribute**，
#    `@dataProvider` 那种注释写法已经移除。
#
# 本文件的事实来自 phpunit.de 与 docs.phpunit.de 的官方文档核对
# （本机没有装 Composer / PHPUnit，所以这一组**是读文档的，不是跑出来的**）。

review:
  state: draft

boxes:
  test-framework:
    code: |
      // @note! 先说归属：**PHPUnit 不是 PHP 官方的** ——
      // @note! 它是 Sebastian Bergmann 名下的第三方项目，
      // @note! 只是占着「事实标准」的位置。PHP 官方从来没背书过它

      // @note 当前大版本是 **PHPUnit 13**（2026-02-06 发布，**要求 PHP 8.4+**）
      // @note 每年 2 月跳一个大版本；11 及更早已经不收 bug 修复了

      // 组织方式：测试类继承 TestCase，方法名以 test 开头
      //            或者用 #[Test] 属性显式标记
      final class EmailTest extends TestCase {
        public function testCanBeCreatedFromValidEmail(): void { /* ... */ }

        #[Test]
        public function it_does_something(): void { /* ... */ }
      }

      vendor/bin/phpunit                       // @note 跑全部
      vendor/bin/phpunit tests/EmailTest.php   // @note 跑单个文件
      // @note 配置在 phpunit.xml / phpunit.xml.dist

      // @note **Pest** 是另一套写法（闭包 + expect()），
      // @note 但它**构建在 PHPUnit 之上** —— 官方原话是
      // @note 「is built on top of PHPUnit」，`phpunit.xml` 照样生效。
      // @note 所以它不是竞品，是包装层；装 Pest 前要先 composer remove phpunit/phpunit
    vs:
      javascript: |
        两边的框架生态形状不同。JavaScript 那边是**多个框架并存**
        （Node 自带的 `node:test`、Jest、Vitest、Mocha…），
        组织方式以函数式注册为主（`test(...)` / `it(...)`）。
        PHP 这边几乎是 **PHPUnit 一家**（最新是 13，要求 PHP 8.4+），
        组织方式是**类继承**（`extends TestCase`），
        较新版本也支持 `#[Test]` 属性。
        另一处是「谁提供的」：那边的框架都是社区项目，
        但 Node 自带了一个官方的 `node:test`；
        PHP **没有官方的测试框架**，PHPUnit 虽然地位等同标准，
        但归属上完全是第三方 —— 这一点很容易被想当然。
        共同点是两边都能按名字过滤、都能跑单个文件。
      python: |
        两边的差别在**发现测试的方式**：Python 的 pytest 靠
        **命名约定**（`test_*.py` 里的 `test_*` 函数），不需要注册、
        不需要继承；PHPUnit 靠**类继承**（必须 `extends TestCase`），
        新版也能用 `#[Test]` 属性显式标记 ——
        一个是「按约定找」，一个是「显式声明」。
        另一处是归属：pytest 与 PHPUnit 都是第三方，
        但 Python 有标准库的 `unittest` 兜底；PHP 这边
        **连标准库的测试框架都没有**，全靠 PHPUnit。
        共同点是两边都能按名字过滤（`-k` ↔ `--filter`）、
        都有参数化与夹具机制。
      java: |
        **两边形态上最像**（JUnit ↔ PHPUnit：类继承 + 断言方法），
        而且都出现了更现代的那一套（JUnit 5 的 `@Test` ↔
        PHPUnit 的 `#[Test]` 属性 + 较新的断言）。
        差别在**新旧交替的进度**：Java 的 JUnit 5 已经普及多年、
        生态基本迁完；PHP 这边 PHPUnit 的大版本一年一跳，
        而且 13 直接要求 PHP 8.4+，也就是说**框架版本与语言版本绑得紧**——
        项目用的 PHP 版本会限制你能用的 PHPUnit 版本。
        另一处是归属：JUnit 是社区项目但被广泛当作 Java 的标准；
        PHPUnit 同样如此，但它是**个人名下**的项目，这一点比 JUnit 更集中。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  assertions:
    code: |
      // @note! 先分清**两族完全不同的东西**

      // ① 语言自带的三个（不是给测试用的）
      assert($x > 0);                   // @note! 只在 zend.assertions=1 时**存在**；
      // @note! php.ini-production 把它设成 -1，那时代码**根本不会被编译进去**
      // @note 失败抛 AssertionError（`assert.exception=1` 时）
      trigger_error("手写一条警告", E_USER_WARNING);   // @note 传统 E_* 诊断，与异常是两套

      // ② 测试框架的断言（判断「符合预期」的标准写法）
      $this->assertSame(3, $result);    // @note! **严格**比较（===）：类型与值都要一样
      $this->assertEquals(3, $result);  // @note! **宽松**比较（==）—— 最经典的坑
      $this->assertTrue($ok);
      $this->assertCount(3, $items);
      $this->assertNull($value);

      // @note! 异常断言要在**触发之前**调用（Arrange–Expect–Act）
      $this->expectException(InvalidArgumentException::class);
      $this->expectExceptionMessage('不能为空');
      throwIfEmpty($input);

      // @note PHPUnit 13 补了一批**更细的数组断言**（能控制严格性、键、顺序），
      // @note 例如 assertArraysAreIdentical / assertArraysHaveEqualValuesIgnoringOrder
    vs:
      javascript: |
        两边的断言处境差别很大：JavaScript **没有语言级的断言**
        （`console.assert` 与框架断言都是库函数，一直生效）；
        PHP 有语言级的 `assert()`，而它在生产配置下**会被整个去掉**
        （`zend.assertions=-1` 意味着代码根本不编译进去）——
        也就是说那边的「断言总有成本」，这边的「断言可以完全没有成本」。
        另一处是失败行为：那边的断言失败只是抛异常（能接住）；
        PHP 的 `assert()` 失败在 `assert.exception=1` 时抛 AssertionError，
        否则只是警告 —— 行为取决于 ini 配置，比那边复杂。
        共同点是两边测试框架的断言都很成熟，失败时都有清晰输出。
      python: |
        **这一格两边最容易搞反**。Python 的 `assert` 是**语言语句**，
        默认**是开的**（`python -O` 才关），失败抛 AssertionError（能接住）。
        PHP 的 `assert()` 同样在语言里，但默认行为取决于 ini，
        而且 **php.ini-production 直接把 `zend.assertions` 设成 -1** ——
        断言在生产环境里不是「跳过」，是「不存在」。
        也就是说 Python 那边「断言是一条能接住的异常」，
        这边「断言是一个可被配置彻底删除的调试设施」。
        另一处是测试断言：pytest 用**裸 assert**（靠重写字节码给出好信息），
        PHPUnit 用 `$this->assertXxx()` 方法 —— 写法完全不同。
      java: |
        两边都有断言、也都有开关，但**默认值相反**：
        Java 的 `assert` **默认是关的**（要 `-ea` 打开），
        而且失败抛的是 `AssertionError`（一个 `Error`）；
        PHP 的 `assert()` 默认是开的（`zend.assertions` 默认 1），
        但**生产配置会把它设成 -1**（彻底移除）。
        也就是说 Java 那边「默认不查、想查要加参数」，
        这边「默认查、生产上整个删掉」—— 一个默认保守、一个默认激进。
        共同点是两边测试框架的断言都区分「宽松」与「严格」
        （JUnit 的 assertEquals 也有 delta 参数），
        而且都鼓励用更精确的那个。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  mocking:
    code: |
      // @note! PHPUnit 把「测试替身」分成两类，**语义不同别当同义词**：
      // @note!   createStub() —— 只管「返回什么」，不关心被调了几次（管**输入**）
      // @note!   createMock() —— 可以配置**期望**，比如「必须调一次」（管**输出/交互**）
      // @note! 官方定义：mock 是「a type of test stub that can be configured
      // @note! with expectations about how it will be called」

      $stub = $this->createStub(Mailer::class);
      $stub->method('send')->willReturn(true);

      $mock = $this->createMock(Repo::class);
      $mock->expects($this->once())                 // @note 期望被调用一次
           ->method('save')
           ->with($this->isInstanceOf(User::class));
      $mock->method('find')->willReturnMap([[1, $alice], [2, $bob]]);
      $mock->method('boom')->willThrowException(new RuntimeException('炸'));

      // @note 次数匹配器：once() / exactly(n) / never()
      // @note getMockBuilder() 是流式 API，官方说「只该用于边角场景」

      // @note! 三条限制：
      // @note! ① **final 类不能被替身**（枚举也不能）
      // @note! ② final / private / static 方法不会被替身 —— 调用会打到真实现上
      // @note! ③ 没配置过的 mock 方法会发 notice

      // @note PHPUnit 13 新增 **sealed test doubles**：`seal()` 之后
      // @note 再改配置就报错；13 还把 `any()` 匹配器硬弃用了
    vs:
      javascript: |
        两边的能力与便利程度不同。JavaScript 的测试库能**在运行期直接改对象**
        （把模块的方法换掉、给对象塞假属性），不需要接口、
        也不需要代码支持注入；PHPUnit 的替身是**运行时生成一个类**
        （用反射与代码生成），所以它需要：
        目标是个类或接口、**不能是 final**、方法**不能是 final**。
        也就是说那边「测不动就 mock 一下」几乎是零成本，
        这边先要满足一堆结构性条件。
        另一处是概念划分：那边 mock / spy / stub 通常是同一套 API 的不同用法；
        PHPUnit 把 stub 与 mock 明确分成两个方法 —— 这个区分是官方口径。
      python: |
        两边都能造替身，但**手段完全不同**：Python 的
        `unittest.mock` 是**打补丁**（`patch` 一个名字就行），
        不需要接口、不需要目标类可继承；
        PHPUnit 的替身靠**生成子类**，所以 final 类直接不行。
        另一处是「期望」的表达：Python 用 `mock.assert_called_once_with(...)`
        **事后断言**；PHPUnit 用 `expects($this->once())` **事前声明**，
        调用次数不符时报错发生在调用时而不是测试末尾 ——
        一个事后检查、一个事前契约。
        共同点是两边都推荐只对**边界**做替身，不要 mock 领域对象。
      java: |
        **两边思路一致、机制也像**（都靠运行时生成子类/代理），
        但便利程度差一截。Java 的 Mockito 有 `when(...).thenReturn(...)`
        与 `verify(...)`，而且能 mock 得比较宽松；
        PHPUnit 的替身能力接近，但**限制更硬**：
        final 类不能替、final/private/static 方法不参与替身 ——
        这在 Java 生态里同样是限制，但 Mockito 有 inline mock maker
        能绕过一部分（包括替 final 类），PHPUnit 没有对应能力。
        另一处是概念：PHPUnit 把 stub 与 mock 明确分开
        （`createStub` 不管调用次数、`createMock` 可以管），
        Mockito 里两者都是 `mock()`，靠用不用 `verify` 来区分。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  parameterized-tests:
    code: |
      // @note! 写法已经换代：现在**只能用 attribute**，注释那种已移除
      // @note! （phpunit 10 起弃用注释，12 起移除）
      use PHPUnit\Framework\Attributes\DataProvider;

      final class AdditionTest extends TestCase {
        #[DataProvider('additionProvider')]           // @note! 不是 @dataProvider 注释
        public function testAdd(int $a, int $b, int $expected): void {
          $this->assertSame($expected, $a + $b);
        }

        // @note! 提供器必须是 **public static**，返回可迭代对象，
        // @note! 每次 yield 一个数组（元素就是测试方法的实参）
        public static function additionProvider(): array {
          return [
            'one plus one' => [1, 1, 2],              // @note! 用字符串键 = 具名数据集，
            'one plus two' => [1, 2, 3],              // @note! 失败信息里会显示这名字
          ];
        }
      }

      // @note! 三个实际约束：
      // @note! ① 提供器在 setUpBeforeClass() 与首个 setUp() **之前**执行 ——
      // @note!    所以不能在它里面碰测试用例的状态、不能在它里面造 mock
      // @note! ② 提供器执行期间**不收集覆盖率**
      // @note! ③ attribute 类名忘了 `use` 或拼错时**静默失效** ——
      // @note!    PHP 的属性不做「必须实现」校验，测试会退化成只跑一次
    vs:
      javascript: |
        两边都能跑多组输入，而且都是**框架提供**的写法，
        失败时都能指出是哪一组。差别在**数据来源的表达**：
        JavaScript 常用表格（`test.each([[1,1,2], ...])`），
        变量名靠位置对应；PHPUnit 的提供器是**一个方法**，
        返回数组，可以用**字符串键给每组起名字**，
        失败信息里显示的是名字而不是序号 —— 可读性更好一些。
        另一处是失效方式：JavaScript 的表格写错了通常直接报错；
        PHPUnit 的 `#[DataProvider]` 忘了 `use` 会**静默失效**
        （测试照跑，只是不再参数化）—— 这是很危险的一种坏法。
        共同点是两边都能按名字单独跑某一组数据。
      python: |
        两边都有参数化的正式写法（`@pytest.mark.parametrize` ↔
        `#[DataProvider]`），而且都会为每组数据单独报结果 ——
        这一层可以对应。
        差别在**提供器的位置**：pytest 把数据**直接写在装饰器里**
        （或引用一个模块级函数），一眼能看到数据；
        PHPUnit 把它放在**另一个 public static 方法**里，
        读测试方法时要跳过去看。另一处是命名：pytest 用
        `ids=[...]` 显式给名字，PHPUnit 用数组的字符串键 ——
        思路一样，写法不同。
        共同点是两边都能把「多组数据」表达成独立用例，
        失败时能定位到具体哪一组。
      java: |
        两边**高度对应**：JUnit 的 `@ParameterizedTest` +
        `@MethodSource` / `@CsvSource` ↔ PHPUnit 的
        `#[DataProvider]`，都是「同一段逻辑跑多组数据、每组单独报结果」。
        差别在**数据源的形态**：Java 可以用 `@CsvSource` 直接写
        一行行 CSV 字符串（紧凑，但要靠位置与类型转换）；
        PHPUnit 的数据是**真正的 PHP 值**（类型安全，但表格要写成数组）。
        另一处是契约：Java 的 `@MethodSource` 引用的方法也要求是 static，
        与 PHPUnit 的 `public static` 要求一致 —— 这一点两边一样。
        共同点是两边都把「提供器不能依赖测试实例状态」写成了硬约束。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  coverage:
    code: |
      // @note! **PHPUnit 自己算不了覆盖率** —— 必须装一个驱动扩展
      // @note!   Xdebug：xdebug.mode=coverage（或环境变量 XDEBUG_MODE=coverage）
      // @note!   PCOV：只做行覆盖，但**快得多**
      // @note! 两者**不能同时开**（会冲突），Xdebug 与 phpdbg / Blackfire 也冲突

      vendor/bin/phpunit --coverage-html build/coverage
      vendor/bin/phpunit --coverage-text
      vendor/bin/phpunit --coverage-clover build/clover.xml
      vendor/bin/phpunit --coverage-filter src        // @note 只看 src 下的代码

      // @note! 关键差别：**只有 Xdebug 能出分支 / 路径覆盖率**，
      // @note! PCOV **只有行覆盖**
      // @note! 常见组合：CI 上用 PCOV（快），本地要看分支覆盖才用 Xdebug

      // @note 没装驱动时 PHPUnit 会提示「没加载 PCOV 或 Xdebug」
      // @note Xdebug 在 CLI 下默认可能整个扩展都没加载 —— 要显式指定
      XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text
    vs:
      javascript: |
        两边的收集方式不同：JavaScript 的覆盖率由**引擎/工具在运行期采集**
        （不用改代码、不用换运行时）；PHP 的覆盖率要**加载一个专门的扩展**
        并切换模式，也就是说「跑覆盖率」是另一种运行配置。
        另一处是能力分层：PHP 这边有个明确的权衡 ——
        PCOV 快但没有分支覆盖、Xdebug 全但有明显开销，
        必须二选一；JavaScript 那边通常一个工具就有行与分支两种。
        共同点是两边都把覆盖率当参考指标，不当硬指标。
      python: |
        两边的处境差别明显：Python 的 `coverage.py` 是**纯 Python 包**，
        `pip install` 就能用、跟着解释器跑，不需要改运行时配置；
        PHP 的覆盖率要靠 **C 扩展**（Xdebug / PCOV），
        而且装哪个决定了你能拿到行覆盖还是分支覆盖 ——
        选择成本与配置成本都更高。
        另一处是「跟谁绑」：Python 那边覆盖率与测试框架解耦
        （pytest-cov 只是胶水）；PHP 这边覆盖率选项**内置在 PHPUnit 里**，
        但底层驱动在外 —— 一半在框架、一半在扩展。
        共同点是两边都能输出多种格式（text / html / clover）接进 CI。
      java: |
        两边**几乎完全对应**：Java 的 JaCoCo 也是**采集器 + 报告**两层，
        也要在构建/运行上加东西（agent 或插件），
        也能出 HTML / XML、能接 CI 红线。
        差别在**接入点**：JaCoCo 常挂在正常构建上（agent 采集），
        PHP 这边必须**换运行时配置**（加载 Xdebug/PCOV 并切模式）——
        也就是说 PHP 的「跑覆盖率」与「正常跑测试」更像是两次不同的运行。
        另一处是分支覆盖：JaCoCo 默认就有分支覆盖；PHP 要分支覆盖**只能选 Xdebug**
        （PCOV 不行）—— 这边的选择更受限制。
        共同点是两边都接受「覆盖率不是质量」这个前提。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
