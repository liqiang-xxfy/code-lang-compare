# javascript —— basics/07-control-flow 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/if-else
    equivalence: identical
    code: |
      if (score >= 90) {
        grade = 'A';
      } else if (score >= 60) {
        grade = 'B';
      } else {
        grade = 'C';
      }

      // @note 条件必须显式括起来；花括号可省但极易埋雷（加一行就改变语义），永远写上

      // @note 条件可以是任意值，会走真值转换——空数组是真值，这一点见运算符章
      if ([]) console.log('空数组也是真值');
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      条件必须**显式括在圆括号里**；花括号可以省，但极易埋雷（加一行就改变语义），永远写上。
      条件是任意表达式，会走真值转换 —— 所以 `if ([])` 也成立，空数组是真值。
  - featureId: basics-javascript/ternary
    equivalence: identical
    code: |
      const label = score >= 60 ? 'pass' : 'fail';      // @note 条件在前，结果在后

      // @note 可以嵌套但会迅速不可读
      const tier = score >= 90 ? 'A' : score >= 60 ? 'B' : 'C';

      // @note 只想要其中一个分支时可以短路
      const maybe = cond && doSomething();              // 条件不成立时拿到 false，不是 undefined

      // @note 三元表达式右结合，嵌套时可省括号：a ? b : c ? d : e 等价于 a ? b : (c ? d : e)
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      `cond ? a : b` —— **条件在前、结果在后**。可以嵌套，但会迅速不可读。
      三元是右结合的，嵌套时 `a ? b : c ? d : e` 等价于 `a ? b : (c ? d : e)`。
      只想要其中一个分支时可以短路：`cond && doSomething()`（条件不成立时拿到 `false`，
      而不是 `undefined`）。
  - featureId: basics-javascript/switch-match
    equivalence: identical
    code: |
      switch (lang) {
        case 'js':
          console.log('JavaScript');
          break;                       // @note! 忘了 break 会「穿透」到下一个 case——经典 bug 源
        case 'py':
          console.log('Python');
          break;
        default:
          console.log('unknown');
      }

      // @note 用的是 === 严格比较；case 里写表达式也只能是值，不是条件
      // @note 想表达「多个值走同一分支」时故意省略 break（这是唯一合理的穿透用法）
      // @note 只做 === 值匹配，不能解构也不能绑定变量；复杂分支只能退回 if/else 链
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      `switch` 用 `===` 严格比较、比较的是**值**而不是条件，而且**不写 `break` 会穿透**
      到下一个 `case` —— 经典 bug 源（「多个值走同一分支」时故意省略 `break`，
      是唯一合理的穿透用法）。
      它不能解构、不能绑定变量，复杂分支只能退回 `if/else` 链。
  - featureId: basics-javascript/for-loop
    equivalence: identical
    code: |
      // 计数循环：JS 特有
      for (let i = 0; i < 3; i++) console.log(i);

      // 遍历：对应 Python 的 for x in seq
      for (const x of [1, 2, 3]) console.log(x);

      // 遍历同时拿下标
      for (const [i, x] of [1, 2, 3].entries()) console.log(i, x);

      // @note! 三段式的任一部分都可省略（for (;;) 就是死循环），也能用逗号并列多个表达式
      // @note 三段式的三个部分都可省略，for (;;) 是死循环
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 两种都有：`for (let i = 0; i < n; i++)` 是**计数循环**，`for...of` 才是遍历。
      三段式的三个部分都可省略（`for (;;)` 就是死循环），也能用逗号并列多个表达式。
      遍历时同时拿下标，用 `.entries()` 解构 `[i, x]`。
  - featureId: basics-javascript/while-loop
    equivalence: identical
    code: |
      let n = 3;
      while (n > 0) {
        n--;
      }

      // @note do...while 至少执行一次：条件在循环体之后判断，与 while 正好相反
      let m = 0;
      do {
        m++;
      } while (m < 0);
      m;                        // 1 —— 条件一开始就不成立，但仍然执行了一次

      // @note 写死循环用 while (true)，靠 break 退出
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      `while` 与 `do...while` 都有：后者**至少执行一次**，条件在循环体之后判断，
      与 `while` 正好相反 —— 条件一开始就不成立时，它仍会执行一遍。
      写死循环用 `while (true)`，靠 `break` 退出。
  - featureId: basics-javascript/loop-control
    equivalence: identical
    code: |
      for (const x of [1, 2, 3, 4]) {
        if (x === 2) continue;      // 跳过本次
        if (x === 4) break;         // 结束整个循环
        console.log(x);             // 1, 3
      }

      // @note! 嵌套循环里 break 只跳出最内层，要跳多层得用标签
      outer: for (const a of [1, 2]) {
        for (const b of [1, 2]) {
          if (b === 2) continue outer;   // 跳到外层下一轮
        }
      }

      // @note 标签只能贴在循环或块前面，break/continue 带标签可以一次跳出多层嵌套
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      `break` 跳过整个循环、`continue` 跳过本次。要当心**嵌套循环里 `break` 只跳出最内层** ——
      想一次跳多层得给循环贴标签（`outer:`），再用 `break outer` / `continue outer`；
      标签只能贴在循环或块前面。
  - featureId: basics-javascript/loop-index
    equivalence: identical
    code: |
      const arr = ['a', 'b'];

      arr.forEach((v, i) => console.log(i, v));      // @note 下标恒从 0 开始

      for (const [i, v] of arr.entries()) console.log(i, v);

      Object.entries({ x: 1 }).forEach(([k, v]) => console.log(k, v));

      // @note! forEach 不能用 break/continue，中途想退出得改写成 for...of
      // @note! forEach 中途无法 break，也不能 await——需要提前退出或串行等待就用 for...of

      // @note forEach 里 await 不会等：会立刻返回，异步逻辑必须用 for...of
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      常用 `arr.forEach((v, i) => ...)`（**下标恒从 0 开始**）或 `arr.entries()` 解构，
      对象则先 `Object.entries`。
      要当心 `forEach`：**不能用 `break` / `continue`**，也**不会等 `await`**
      （回调里的异步不会被串起来，`forEach` 会立刻返回）—— 需要提前退出或串行等待，
      就得改写成 `for...of`。
  - featureId: basics-javascript/range-iteration
    equivalence: identical
    code: |
      // @note! JS 没有内置 range，得自己写或用库
      const range = (n) => Array.from({ length: n }, (_, i) => i);
      range(3);                       // [0, 1, 2]

      // 实际写法通常是直接构造数组
      [...Array(3).keys()];           // [0, 1, 2]  —— @note 这个技巧不直观，但很常见
      Array.from({ length: 3 }, (_, i) => i * 2);

      // @note 没有内置 range，惯用代替是 [...Array(n).keys()]；带步长则要自己映射
      // @note JS 里没有等价物，这也是为什么 JS 的循环更依赖计数三段式
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS **没有内置 `range`**，得自己写或用库：惯用代替是 `[...Array(n).keys()]`
      （不直观，但很常见），带步长则要自己映射。
      这也正是 JS 的循环更依赖计数三段式的原因 —— 想按序号走一遍，先得有序列。
  - featureId: basics-javascript/exception-flow
    equivalence: identical
    code: |
      try {
        JSON.parse('{bad');
      } catch (e) {
        console.log(e instanceof SyntaxError);   // true
        console.log(e.message);
      } finally {
        cleanup();                               // @note 无论成功失败都执行
      }

      // @note! throw 可以扔任何值：throw 'oops' / throw { code: 1 } 都合法
      //        所以 catch 里的 e 不一定是 Error，写 e.message 可能拿到 undefined
      // @note 自定义错误要 extends Error，否则丢失栈信息
      // @note catch 只接一个绑定参数，没有按异常类型分发的语法——
      //       只能自己 instanceof 判断，或者看 e.name（自定义错误要 extends Error）
      // @note 但 catch 的绑定可以省略（ES2019 起）—— 不需要那个变量时就不写

      try { risky(); } catch { /* 不要变量 */ }
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
      notes: 删除一处不实说法（原称"ES2025 的 catch 修饰符"；可选 catch 绑定实为 ES2019）。其余断言（throw 任意值、e.message undefined）实跑验证通过
    body: |
      结构是 `try/catch/finally`，`finally` 无论成功失败都执行。
      `catch` 只接一个绑定参数，**没有按异常类型分发的语法**，只能自己 `instanceof`
      判断（或看 `e.name`）；ES2019 起绑定可以省略：`catch { }`。

      要当心 `throw` 可以扔**任何值**：`throw 'oops'`、`throw { code: 1 }` 都合法，
      所以 `catch` 里的 `e` **不一定是 `Error`**，写 `e.message` 可能拿到 `undefined`。
      自定义错误要 `extends Error`，否则丢失栈信息。
