snippets:
  - featureId: concepts-javascript/type-system
    equivalence: identical
    code: |
      1 == "1"      // true —— == 会做隐式类型转换
      1 === "1"     // false —— 工程规范一律要求 ===
      "3" * "2"     // 6 —— 字符串被当成数字
    body: |
      JS 是**动态类型**：类型属于运行时的值，不属于变量名。

      同时还是**弱类型** —— `==`、`+`、`if` 都会隐式转换，于是 `1 == "1"` 为真、
      `[] + {}` 有结果、`"3" * "2"` 得 6。弱类型让调试变成「看值猜类型」：
      错误往往表现为一个不对的结果，而不是一条异常，所以 `console.log` 很管用。

  - featureId: concepts-javascript/numeric-type
    equivalence: identical
    code: |
      0.1 + 0.2             // 0.30000000000000004
      9007199254740993      // 9007199254740992 —— 超出安全整数范围静默丢精度
      7 / 2                 // 3.5 —— 只有一种除法
    body: |
      JS 只有一种数字：IEEE 754 双精度浮点（外加 BigInt 用于大整数）。
      **整数也是浮点**，所以 `0.1 + 0.2 !== 0.3`、超过 2^53 的整数静默丢精度。
      除法也只有一种：`7 / 2` 得 3.5，没有整除运算符。

  - featureId: concepts-javascript/null-value
    equivalence: identical
    code: |
      null == undefined    // true —— 一次挡掉两种空值
      0 || "默认"           // "默认" —— 0 是假值，被兜底吃掉
      0 ?? "默认"           // 0 —— ?? 只挡 null / undefined
    body: |
      JS 有两个表示「没有」的值：`null`（人为赋值）与 `undefined`（未赋值 /
      属性不存在 / 函数无返回）。绝大多数判空代码其实两者都要挡，于是有了
      `== null` 这个「同时匹配两者」的惯用写法，以及 `?.` / `??` 这套语法。

      要注意 `||` 与 `??` 的分工：`0`、`""`、`NaN` 在 `||` 下都是假值，
      用 `||` 兜底会把合法的 0 当成缺失，`??` 才是只挡空值的那个。

  - featureId: concepts-javascript/value-semantics
    equivalence: identical
    code: |
      const a = { n: 1 };
      const b = a;
      b.n = 2;
      a.n                  // 2 —— 对象赋值共享同一份数据
    body: |
      JS 的说法是「原始值按值、对象按引用」：给变量赋一个对象，两个名字指向
      同一份数据；赋一个数字，各自独立。

      这里缺一样东西：**没有「类型自带的不可变集合」**。想让一个对象不可变只能
      `Object.freeze`，而它是浅的、是运行时行为，也不进入类型签名 —— 换个语言里
      `tuple` / `frozenset` 那种「声明出来就能安全共享」的容器，JS 里没有对应物。
