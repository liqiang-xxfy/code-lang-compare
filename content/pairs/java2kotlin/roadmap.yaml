# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（java2kotlin），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: java2kotlin-1-equality-and-syntax
  order: 1
  title: 从相等语义开始改直觉
  durationHint: 2-3 小时
  todo:
    - 装 JDK 与 Kotlin 命令行（或用 IntelliJ IDEA 建工程）
    - 先把 `==` 与 `===` 的含义记住：与 Java 正好相反
    - 写一段熟悉的 Java 逻辑用 Kotlin 重写，体会没有 new、没有 static、没有三元
    - 对照本工具「语言机制」板块里 Kotlin 列的「静态 vs 动态」「类型标注」两格
  acceptance:
    - 能一眼说出 `==` 在 Java 与 Kotlin 里各指什么
    - 能不用 static / new / 三元运算符写出等价逻辑
  resources:
    - label: Kotlin 官方文档（中文）
      url: https://book.kotlincn.net/
    - label: Kotlin 官方文档 · 与 Java 互操作
      url: https://kotlinlang.org/docs/java-interop.html

- id: java2kotlin-2-classes-and-null
  order: 2
  title: 类、属性与空安全
  durationHint: 2-3 天
  todo:
    - 写几个类，体会默认 final、构造参数带 val / var 的区别
    - 用 companion object / object / 顶层函数替代 static
    - 把 null 的用法改成可空类型加判空（`String?` + ?. / ?:）
    - 对照本工具「数据与抽象」板块里 Kotlin 列的类与属性
  acceptance:
    - 能说清 Kotlin 的默认 final 与 Java 默认开放的设计取舍
    - 能说清可空类型比 Java 的 @Nullable 强在哪里
  resources:
    - label: Kotlin 官方文档 · 类与对象
      url: https://kotlinlang.org/docs/classes.html
    - label: Kotlin 官方文档 · 空安全
      url: https://kotlinlang.org/docs/null-safety.html

- id: java2kotlin-3-collections-and-functions
  order: 3
  title: 集合、函数与数值
  durationHint: 3-5 天
  todo:
    - 把 Java 的集合操作改写成 Kotlin 的扩展函数链（filter / map / groupBy）
    - 体会只读集合的协变与 MutableList 的不变，理解与通配符的对应
    - 检查数值代码：不隐式拓宽、显式转换、注意溢出
    - 用表达式体与块体各写几个函数，注意返回类型规则
  acceptance:
    - 能说清 Kotlin 的 List / MutableList 与 Java 通配符的对应关系
    - 能独立把一段集合处理代码从 Java 风格改写为 Kotlin 风格
  resources:
    - label: Kotlin 官方文档 · 集合
      url: https://kotlinlang.org/docs/collections-overview.html

- id: java2kotlin-4-coroutines
  order: 4
  title: 协程与并发
  durationHint: 3-5 天
  todo:
    - 把一段 ExecutorService 的代码改写成协程
    - 验证「协程默认不并行」：在 runBlocking 里 launch 几个任务看顺序
    - 用 Dispatchers.Default 显式并行；用 Mutex 保护共享状态
    - 理解结构化并发：子协程失败会取消父作用域
  acceptance:
    - 能说清协程与线程 / ExecutorService 的异同
    - 能用结构化并发表达「一组任务要么全成要么全败」
  resources:
    - label: Kotlin 官方文档 · 协程
      url: https://kotlinlang.org/docs/coroutines-guide.html

- id: java2kotlin-5-engineering
  order: 5
  title: 工程化与 Java 互操作
  durationHint: 1 周
  todo:
    - 用 Gradle 管一个 Kotlin 工程，理解它与 Maven 的差别
    - 写一个 Kotlin 类被 Java 调用，注意 @Throws 与默认 final 的影响
    - 处理一次 Java 与 Kotlin 混编的编译顺序问题
    - 对照本工具「工程实践」板块里 Kotlin 列的工具链
  acceptance:
    - 能独立搭起一个 Kotlin + Gradle 工程
    - 能说清 Kotlin 与 Java 互操作时的几处边界（异常、可空性、默认参数）
  resources:
    - label: Gradle 官方文档
      url: https://docs.gradle.org/current/userguide/userguide.html
    - label: Kotlin 官方文档 · 与 Java 互操作
      url: https://kotlinlang.org/docs/java-interop.html
