  - featureId: python2java/collections-exercise
    equivalence: identical
    code: |
      from collections import defaultdict

      def group_by_dept(employees):
          groups = defaultdict(list)
          for e in employees:
              groups[e["dept"]].append(e["name"])
          return dict(groups)          # @note 转成普通 dict，避免"读一次多一个空组"
