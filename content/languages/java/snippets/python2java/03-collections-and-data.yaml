      List<Integer> xs = new ArrayList<>(List.of(1, 2, 3, 4, 5));

      xs.subList(1, 3);                         // @note! 这是**视图**，不是拷贝
      var view = xs.subList(1, 3);
      view.set(0, 9);                           // @note! xs 也变了 —— 与切片直觉相反
      new ArrayList<>(xs.subList(1, 3));        // 要拷贝必须这样包一层

      // @note! 没有步长、没有负索引：反转要 Collections.reverse，末尾要 xs.get(xs.size()-1)
