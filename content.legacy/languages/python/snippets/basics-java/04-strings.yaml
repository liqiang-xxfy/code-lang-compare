  - featureId: basics-java/fstring-format
    equivalence: analogous
    code: |
      f"{3.14159:.2f}"             # @note '3.14'
      f"{3.14159:08.2f}"           # @note '00003.14' —— 同样有总宽度概念
      f"{1234567:,}"               # '1,234,567'
      f"{255:x}"                   # 'ff'
      f"{0.123:.1%}"               # '12.3%' —— 百分号不用手写

      format(255, "x")             # @note 同一套规格串，用于动态拼格式时

      # @note 规格串内联在字符串里，不存在"参数顺序写反了还不报错"
      # @note 但正因为内联，规格串不能像 Java 那样动态拼出来
  - featureId: basics-java/string-index-slice
    equivalence: divergent
    code: |
      s = "abcdef"
      s[0]                         # @note 'a'
      s[-1]                        # @note! 'f' —— 负索引原生支持，Java 没有
      s[1:4]                       # @note 'bcd' —— 左闭右开
      s[2:]                        # 'cdef'
      s[::2]                       # @note 'ace' —— 步长，Java 完全没有
      s[::-1]                      # @note 'fedcba' —— 一行反转

      s[2:999]                     # @note 'cdef' —— 切片越界静默截断
      s[999]                       # @note! IndexError —— 索引越界才抛，与 Java 一致
  - featureId: basics-java/string-regex
    equivalence: analogous
    code: |
      import re
      re.match(r"\d+", "a1")       # @note! None —— match 只从开头匹配，对应 lookingAt
      re.search(r"\d+", "a1")      # @note 匹配到 1 —— 任意位置，对应 find
      re.fullmatch(r"\d+", "a1")   # @note None —— 整串匹配，对应 matches

      m = re.search(r"(?P<y>\d{4})", "2026")
      m.group("y")                 # '2026'

      re.sub(r"(\w+)@(\w+)", r"\2@\1", "a@b")   # @note! 替换引用用 \1，Java 是 $1
      # @note 正则串一律加 r 前缀：不加的话 "\b" 会变成退格字符
