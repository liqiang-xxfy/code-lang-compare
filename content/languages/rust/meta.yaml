id: rust
name: Rust
shortName: Rust
aliases: [rs, rustlang]
version: '1.83'
fileExtension: .rs
comment:
  line: '//'
shikiLang: rust
paradigm: [multi-paradigm, functional, imperative]
typing: static
typeSystem: nominal
# Rust 没有 GC：内存由所有权 + 借用检查在编译期决定，需要开发者显式表达意图
memoryModel: manual
concurrency: [threads, async-await, channels]
baseline: false
links:
  - label: The Rust Programming Language（the book）
    url: https://doc.rust-lang.org/book/
  - label: Rust 标准库文档
    url: https://doc.rust-lang.org/std/
