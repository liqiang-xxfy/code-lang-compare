# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（python2swift），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: python2swift-1-types-and-values
  order: 1
  title: 类型与值语义
  durationHint: 2-3 小时
  todo:
    - 装 Xcode（macOS）或用 Swift Playgrounds 跑通一段代码
    - 写一段熟悉的 Python 逻辑用 Swift 重写，体会「处处显式转换」
    - 验证列表传参是拷贝而不是共享（值类型）
    - 对照本工具「语言机制」板块里 Swift 列的「值语义」「空安全」两格
  acceptance:
    - 能说清把列表传给函数时 Python 与 Swift 的行为差别
    - 能说清 Optional 是枚举，以及它与 None 的差别
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: python2swift-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 把推导式改写成 filter / map 链
    - 过一遍字符串操作，注意不能用整数下标
    - 试一次整数溢出，理解它会崩而不是回绕
    - 把 try / finally 改成 do / catch / defer
  acceptance:
    - 能独立写出变量、容器、控制流、函数定义，无语法错误
    - 知道哪些写法在 Swift 里会编译不过（字符串下标、隐式转换）
  resources:
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: python2swift-3-structs-and-protocols
  order: 3
  title: 值类型、协议与扩展
  durationHint: 3-5 天
  todo:
    - 用 struct 建几个数据模型，体会自动生成的逐成员构造器
    - 用协议 + 扩展做复用，对比 Python 的 mixin
    - 搞清 some 与 any 的区别
    - 处理一次闭包捕获造成的循环引用
  acceptance:
    - 能说清 struct 与 class 的取舍，以及为什么 Swift 默认用 struct
    - 能用协议 + 扩展替代多重继承
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/

- id: python2swift-4-concurrency
  order: 4
  title: 并发：async / await 与 actor
  durationHint: 3-5 天
  todo:
    - 把一段 asyncio 代码改写成 async / await
    - 用 Task 与 TaskGroup 表达并发，体会结构化并发
    - 用 actor 保护共享状态，理解数据竞争在编译期就被拦
    - 试一次协作式取消：cancel() 之后不检查标志，任务照样跑完
  acceptance:
    - 能说清 Swift 的 actor 与 Python 的 asyncio 在并发安全上的差别
    - 能写出正确响应的可取消任务
  resources:
    - label: Swift 官方文档 · 并发
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/

- id: python2swift-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 Swift Package Manager 管依赖，理解它与 pip / venv 的差别
    - 用 swift-testing 或 XCTest 写测试，注意 assert / precondition 的三档语义
    - 把一个 Python 小工具改写成 Swift 并跑起来
    - 对照本工具「工程实践」板块里 Swift 列的工具链
  acceptance:
    - 能独立搭起一个带依赖、测试的 Swift Package
    - 能说清 Swift 的构建与依赖管理和 Python 生态的差别
  resources:
    - label: Swift 官方文档 · Package Manager
      url: https://www.swift.org/documentation/package-manager/
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
