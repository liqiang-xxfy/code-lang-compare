# dart —— practice / toolchain
#
# boxes 的 key 必须是 catalog/practice/features.yaml 里 `group: toolchain` 的那批：
# compile-run / bundler / linter-formatter / type-checker / runtime-version / repl。
#
# 口径说明：几条要写准的 ——
# ① **断言默认是关的**（要 `--enable-asserts` 才开），与「断言默认开」的直觉相反；
# ② `dart analyze` 是**独立于编译**的一步，这与「类型检查就是编译」的编译型语言不同；
# ③ **「`dart format` 完全不可配置」是旧说法** —— 现在有 `page_width`、
#    `trailing_commas` 与逐文件标记注释三个口子；而且要提醒 **3.7 起换了排版风格**，
#    旧代码格式化后 diff 会很大；
# ④ **Dart 没有官方 REPL**（本机实跑确认：`dart` 不带参数只打印用法就退出）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-toolchain-v1
    generatedAt: '2026-10-03'

boxes:
  compile-run:
    code: |
      dart run bin/main.dart       # 直接跑：用的是虚拟机的即时编译
      dart run                     # 省略路径时按包的默认入口找

      dart test                    # 跑测试
      dart analyze                 # 静态分析

      # 注意：**断言默认是关的** —— 要让 assert 生效得显式加开关
      dart run --enable-asserts bin/main.dart

      # 依赖包里只有 bin/ 是对外可达的
      # 还能直接跑远端包：dart run <包名>@<版本>
    vs:
      javascript: |
        两边都是「一条命令直接跑」，开发时的反馈循环都短 ——
        这一格最像。差别在**底下发生了什么**：Dart 这边
        即时编译要先做一轮编译（首次启动慢一点），
        JavaScript 那边引擎边解析边跑。
        另一处是断言：两边默认都关（要靠开关打开），
        但 Dart 是把这件事明确写进了运行命令的参数里。
      python: |
        两边都是「解释执行、改完就跑」的体验，这一层相近。
        差别在**断言的默认值**：Python 的断言默认**是开的**
        （要用优化开关才关掉），Dart 默认**是关的**、要显式打开 ——
        方向正好相反，从 Python 过来时「我的断言怎么没生效」
        是很容易撞上的一处。
      java: |
        两边都要先编译再跑（Dart 的 `dart run` 背后是先编译再执行），
        这一点比解释执行的语言更接近 Java 的体感。
        差别在**产物的形态**：Java 编出的是字节码加虚拟机，
        Dart 开发时用即时编译，要独立产物得另走一条路（见下一格）。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  bundler:
    code: |
      dart compile exe bin/main.dart -o app     # AOT 编译成独立可执行文件
      dart compile js  bin/main.dart -o app.js  # 编译到 web
      dart compile wasm bin/main.dart           # 也可编到 wasm

      ./app                                      # 直接跑，不需要装运行时

      # 注意：`dart compile exe` 产出的东西**不支持** dart:mirrors ——
      # 注意：依赖运行期反射的库在 AOT 下用不了（见 mechanism/meta 那一组）
      # 交叉编译目前只支持以 Linux 为目标
    vs:
      javascript: |
        两边的「产物」差别很大：JavaScript 那边打包是为了**浏览器**
        （模块合并、体积优化、降级转译），产物仍然需要运行时才能跑；
        Dart 这边的 AOT 编译是为了**发布独立程序** ——
        产出的是一个自包含的可执行文件，与那边「打包」的动机不同。
        所以「打包」这个词在两个语言里指的不是一件事。
      python: |
        两边都想解决「让别人不装环境也能跑」这个问题，
        但手段的成熟度差得远：Python 那边有各种打包器，
        生态很碎、各自有各自的坑；Dart 的 `dart compile exe`
        是官方工具链里的一条命令，产出干净的独立二进制。
        代价是这条路上没有反射（依赖运行期反射的代码编不过）。
      java: |
        两边的分发模型是**两条路**：Java 发的是字节码加依赖，
        要对方装虚拟机；Dart 的 `dart compile exe` 直接产出机器码，
        用户拿到就能跑 —— 形态更像本机编译型语言那种分发。
        所以「要不要对方装运行时」这件事上两个语言选了不同的边，
        而 Dart 开发时又用即时编译，等于两条路都留着。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  linter-formatter:
    code: |
      dart analyze                 # 静态分析：与编辑器看到的是同一套
      dart analyze --fatal-infos   # 让提示级也导致失败
      dart fix --dry-run           # 看有哪些能自动修的
      dart fix --apply             # 真的修

      dart format .                # 格式化
      dart format --output=none --set-exit-if-changed .   # CI 里当检查用

      # 配置写在 analysis_options.yaml 里
      # 格式化也能配（虽然可配的很少）：
      #   formatter:
      #     page_width: 100
      #     trailing_commas: preserve
      # 还能逐文件标记：// dart format width=123 与 // dart format off

      # 注意：默认只把 error 与 warning 当失败，提示级不影响退出码
      # 注意：**3.7 起换了排版风格** —— 老代码格式化后 diff 会很大，别混进功能提交
    vs:
      javascript: |
        两边的工具生态都很成熟，差别在**内建程度**：
        JavaScript 那边检查与格式化几乎都是外挂工具（要装、要配、要接进编辑器）；
        Dart 把分析器与格式化器做进了语言工具链（`dart analyze` / `dart format`），
        配置只有一份。
        代价是**可配置项少**：那边的格式化器能通过配置改很多行为，
        这边的设计哲学是「让所有代码长得一样」，只留了几个口子。
      python: |
        两边都把检查器与格式化器分成了两个工具，这一层可以对应。
        差别在**配置的丰富程度**：Python 那边的格式化工具虽然也主张少配置，
        但生态里仍有多种风格可选；Dart 只有官方这一个格式化器，
        而且可配项被刻意压到最少。
        另一处是自动修复：Dart 的 `dart fix` 能修两类问题
        （带快速修复的诊断、以及迁移到新版本的改动），
        这个能力内建在工具链里。
      java: |
        两边都是「检查器加格式化器」的组合，工具形态相近
        （静态分析工具加风格检查器）。
        差别在**默认严格度与可配性**：Java 项目的规则集通常要自己裁一版；
        Dart 的默认规则就锚在官方风格上，而且**默认只让错误与警告失败** ——
        提示级的问题不会卡构建，这一点比 Java 项目常见的严格配置宽松。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  type-checker:
    code: |
      dart analyze                 # 类型错误在这一步就能看到

      # 注意：Dart 把「静态分析」与「编译」分成了两步：
      # 注意：  analyze 是独立命令，跑得快、不产出任何东西
      # 注意：  编译时也会检查，但那是另一条路径
      # 注意：所以 CI 里可以「先跑分析，再跑测试」，不必每次都完整编译

      # 分析器的配置：
      #   analysis_options.yaml
      #     include: package:lints/recommended.yaml
      #     analyzer:
      #       errors:
      #         unused_import: error      # 把某条提示升级成错误

      # 空安全是类型系统的一部分 —— 不处理可空就分析不过
    vs:
      javascript: |
        **两边差别很大**：JavaScript 本身不做类型检查，
        要另装一个检查器、另跑一遍；Dart 的类型分析**内建在工具链里**，
        `dart analyze` 与编辑器看到的是同一套结论。
        所以那边「装了检查器才有类型」，这边「不装也有」——
        这是从 JavaScript 过来最省事的一处。
      python: |
        两边的姿态正好相反：Python 的类型检查是一个**额外的、可选的**步骤
        （装一个检查器、单独跑，而且结论不影响程序能不能跑）；
        Dart 的类型分析是**工具链自带且默认生效**的，
        分析不过通常也编不出能跑的东西。
        所以从 Python 过来，「类型对不对」从一件需要注意的事
        变成了默认就被盯着的事。
      java: |
        两边都内置类型检查，但**检查发生在哪一步不同**：
        Java 的类型检查**就是编译**（没有独立的「只检查」命令）；
        Dart 把静态分析单独拆成了一条命令，跑得快、不产出产物 ——
        所以 CI 上可以先用它快速拦一遍，再跑真正耗时的步骤。
        这一点是 Dart 比 Java 顺手的地方。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  runtime-version:
    code: |
      # pubspec.yaml
      environment:
        sdk: ^3.6.0            # 注意：强制字段：省略会让取依赖直接失败

      # 注意：这个约束不只是「能不能装」——
      # 注意：它还决定这个包用**哪个版本的语言规则**来编译：
      # 注意：声明 ^3.6.0 的包不会因为 SDK 升到 4.x 而突然行为变化
      # 注意：所以老项目升级 SDK 之后，代码不会因为新语法规则而失效

      dart --version           # 看当前 SDK
      dart pub outdated        # 看哪些依赖挡着升级
    vs:
      javascript: |
        两边的版本管理对象不同：JavaScript 那边锁的是**运行时**
        （Node 的版本，靠配置文件里的引擎约束提示），
        Dart 这边锁的是 **SDK**，而且它是包清单里的强制字段。
        另一处更实质：Dart 的 SDK 约束还决定**语言版本** ——
        同一个 SDK 可以按不同的语言规则编译不同的包，
        这在 JavaScript 那边没有对应机制。
      python: |
        两边的版本约束都是包元数据的一部分，这一层可以对应。
        差别在**有没有「语言版本」这一层**：Python 用的是解释器版本，
        同一个解释器对同一个语法只有一种态度；
        Dart 把「语言版本」从 SDK 版本里解耦出来，
        每个包按自己声明的版本规则编译。
        所以那边升级解释器可能直接让旧代码语法失效，这边不会。
      java: |
        两边的思路接近（都是「指定一个版本、按它来」），
        但**约束的对象不同**：Java 那边是字节码目标版本与 JDK 版本，
        决定的是能用哪些 API 与语法；Dart 的 SDK 约束是整条工具链的版本，
        还会顺带决定语言规则。
        共同点是两边都要在「用新特性」与「兼容旧环境」之间选一个位置。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  repl:
    code: |
      # 注意：Dart **没有官方 REPL** —— 敲 dart 只会打印用法然后退出
      dart                      # 输出 help，然后结束

      # 最接近的替代是浏览器里的 DartPad（dartpad.dev），
      # 支持核心库与 Flutter，但不支持延迟加载

      # 想交互式试一段代码，另外两条路：
      #   - 写个 .dart 文件然后 dart run
      #   - 编辑器里的即时分析与补全（不执行，但能看类型）
    vs:
      javascript: |
        **这一格是直接的能力缺失**：JavaScript 的交互环境是运行时自带的，
        敲一下命令就进，是日常调试的一等工具；
        Dart 的语言工具链里**没有**这个入口，只有浏览器里的在线替代品。
        所以那边「随手试一行」的习惯，在这边要改成写个临时文件再跑。
      python: |
        两边的落差最大：Python 的交互解释器是语言的一部分，
        是官方文档里的教学工具、也是日常调试手段；
        Dart 根本没有 —— 这不是「做得不好」，是没做。
        部分原因是语言性质：一门静态编译的语言要做到
        「敲一行立刻求值」本来就难，而且它连求值字符串的入口都没有。
      java: |
        两边都是**编译型语言里没有自带交互环境**的例子，
        这一点处境相同（Java 那边要到较新的版本才有 `jshell`）。
        差别在替代品：Java 的 `jshell` 已经是正式工具，
        Dart 这边只有浏览器里的在线页面 —— 开发机上没有官方入口。
        两边共同的替代办法都是「写个最小的文件再跑」。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
