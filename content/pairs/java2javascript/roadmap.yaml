# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（java2javascript），后面接序号与短名。

- id: java2javascript-1-anchor
  order: 1
  title: 先接受「没有编译器兜底」
  durationHint: 2-3 小时
  todo:
    - 通读本工具「语言机制」板块的 Java 视角，把 Maven/npm、线程/事件循环这类映射先建起来
    - 只回答四个问题：类型系统、并发模型、值语义 vs 引用语义在「语言机制」板块，错误处理在「数据与抽象」板块
    - 明确写下「哪些 Java 直觉必须丢掉」——类型在编译期定死、受检异常逼你处理、只有一条线程、只有一种数字类型
  acceptance:
    - 能说出 JS 与 Java 在「相等比较」和「空值」上的两条根本差异
    - 知道 JS 只有一种数字类型，且它装不下 long 的全部范围
  resources:
    - label: MDN JavaScript 指南（中文）
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide
    - label: JavaScript.info（现代教程）
      url: https://javascript.info/

- id: java2javascript-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 2-3 天
  todo:
    - 按本工具「基础表达」板块逐章逐格对比，重点看标为「语义不同」的格子
    - 每看一格，手写一遍两边的代码（不要复制）——建立肌肉记忆
    - 把踩到的坑记进本方向的「迁移陷阱」清单，并打上自己的严重度
  acceptance:
    - 能独立写出变量、数组与对象、控制流、函数定义，无语法错误
    - 能解释 `===` 与 `==` 的区别，并知道为什么判 null 时反而常用 `x == null`
    - 能说清 `let` 与 `var` 在作用域上的差别
  resources:
    - label: MDN · 相等比较与何时用 ===
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Reference/Operators/Strict_equality
    - label: MDN · JavaScript 数据类型与数据结构
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Data_structures

- id: java2javascript-3-practice
  order: 3
  title: 动手写（占全部时间的 70%）
  durationHint: 1-2 周
  todo:
    - 做 Exercism 的 JavaScript track，接受 mentor 评审
    - 把写过的一个小工具（100-300 行）用 JS 重写一遍，跑在 Node 上
    - 重写时不要查原文件——凭记忆写，写完再对照
    - 刻意用一轮 map / filter / reduce 链，体会它与 Stream 的分工差异
  acceptance:
    - Exercism 完成 15 题以上
    - 能独立完成一个 100 行以上的命令行工具，不依赖翻译式写法
    - 能说清什么时候该用链式调用、什么时候该回到 for 循环
  resources:
    - label: Exercism JavaScript Track
      url: https://exercism.org/tracks/javascript
    - label: TheAlgorithms JavaScript
      url: https://github.com/TheAlgorithms/JavaScript

- id: java2javascript-4-deep
  order: 4
  title: 补齐语义层（事件循环与异步）
  durationHint: 3-5 天
  todo:
    - 真正理解事件循环：为什么一段 CPU 密集的代码会卡住所有回调
    - 理解微任务与宏任务的排队顺序，用一段 console.log 验证自己的理解
    - 把一段线程池 + Future 的代码改写成 Promise 与 async/await，重点是异常在哪一步浮出来
    - 理解闭包与作用域：为什么 `var` 在循环里会退化成共享绑定
  acceptance:
    - 能解释 JS 的单线程模型与 Java 的多线程在共享状态上的根本差别
    - 能说清 Promise.all 与等待一组 Future 在「一个失败会怎样」上的差别
    - 能写出不会阻塞事件循环的批处理代码
  resources:
    - label: MDN · 事件循环
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Event_loop
    - label: MDN · 使用 Promise
      url: https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Using_promises

- id: java2javascript-5-ecosystem
  order: 5
  title: 工程化与生态收口
  durationHint: 3-5 天
  todo:
    - 用 npm 建一个真实项目，理解 package.json 与构建坐标的分工差异
    - 跑一次 npm ci，理解 lockfile 为什么是可复现安装的前提
    - 配好 ESLint 与 Prettier，理解为什么这里是两个工具而不是一个
    - 用 vitest 或 node:test 写测试，注意断言风格与 JUnit 的差别
    - 加上类型标注与编辑期检查，把编译期的那层保护补回来一部分
  acceptance:
    - 能独立搭起一个带依赖管理、lint、格式化、测试的 Node 工程
    - 能说清 dependencies / devDependencies / peerDependencies 各自解决什么问题
    - 能解释 node_modules 为什么会那么大，以及 pnpm 之类的工具在解决什么
  resources:
    - label: npm 官方文档
      url: https://docs.npmjs.com/
    - label: Node.js 官方文档
      url: https://nodejs.org/docs/latest/api/
