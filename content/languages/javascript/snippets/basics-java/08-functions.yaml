  - featureId: basics-java/arg-passing
    equivalence: analogous
    code: |
      function mutate(xs) { xs.push(4); }        // @note 看得见
      function rebind(xs) { xs = [9]; }          // @note 看不见

      const xs = [1, 2, 3];
      mutate(xs);                                // @note xs 变成 [1, 2, 3, 4]
      rebind(xs);                                // @note xs 不变

      let k = 1;
      function bump(n) { n += 1; }
