  - featureId: basics-java/object-equality
    equivalence: divergent
    code: |
      {"a": 1} == {"a": 1}                    # @note! True —— 比内容，不需要实现 equals
      {"a": 1, "b": 2} == {"b": 2, "a": 1}    # @note True —— 与插入顺序无关
      {"a": [1, 2]} == {"a": [1, 2]}          # @note True —— 嵌套也会递归比较

      # @note! 容器之间的内容比较是免费的；Java 要自己重写 equals 与 hashCode
