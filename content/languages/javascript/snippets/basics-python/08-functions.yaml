  - featureId: basics-python/default-params
    equivalence: divergent
    code: |
      function add(item, bucket = []) {
        bucket.push(item);
        return bucket;
      }

      add(1);      // [1]
      add(2);      // @note [2] —— 默认表达式每次调用都重新求值，这是安全的

      // @note! 对照 Python 的 def add(item, bucket=[])：那边默认值只在定义时求值一次，
      // 第二次调用会看到第一次塞进去的东西。同一行代码，两种结果
  - featureId: basics-python/kwargs
    equivalence: absent
    code: |
      // @note! 没有关键字参数：位置就是位置，名字不影响调用
      function render(text, pretty, strict) { }
      render(text, true, false);          // 这两个布尔是什么意思，读不出来

      // 惯用替代是"传一个选项对象"：
      function render2(text, { pretty = false, strict = false } = {}) { }
      render2(text, { pretty: true });    // 调用处自带名字，但仍然不是语言强制的

      // @note 拼错的键会被解构默认值静默兜住，不会报错
    body: |
      JavaScript 没有关键字参数。最接近的惯用法是"传一个选项对象并在参数位置解构"，
      调用处写成 `render(text, { pretty: true })` —— 读起来确实清楚了，
      但那是**约定**，不是语言约束：引擎不会检查键名，拼错一个字母就静默走默认值。

      由此带来两个连锁差异：

      1. **无法强制具名**。没有 `/` 与 `*` 那样的分隔符，只能在文档或类型里声明意图。
      2. **位置参数一多就难读**。`f(a, b, true, false)` 这种调用必须翻签名才知道含义。

      实践上通常靠 TypeScript 的类型检查把这条补回来 —— 但那是工具层，不是运行时。
