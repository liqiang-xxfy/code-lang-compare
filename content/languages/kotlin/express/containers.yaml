# kotlin —— express / containers
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: containers` 的那批：
# arrays / maps。
#
# 口径说明：这一组真正要讲清的是**「数组」在 Kotlin 里不是一个类型而是一族** ——
# `IntArray` 与 `Array<Int>` 是两种东西（一个存原始值、一个存装箱对象），
# 而日常写代码用的其实是 `List`（`listOf`）。对 JavaScript 读者要澄清
# 「长度固定、不能 push」这一点；对 Java 读者要澄清基本类型数组与装箱数组的分野。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-containers-v1
    generatedAt: '2026-10-03'

boxes:
  arrays:
    code: |
      val nums = intArrayOf(1, 2, 3)       // @note IntArray：存的是原始值，不装箱
      val boxed = arrayOf(1, 2, 3)         // @note! Array<Int>：元素是装箱后的对象
      val words = arrayOf("a", "b")        // @note 引用类型数组
      val empty = IntArray(5)              // @note 长度 5，全 0
      val sized = IntArray(3) { it * 2 }   // @note 用下标算初值：0 2 4

      nums.size                            // @note 属性，不是 length
      nums[0]                              // @note 下标访问；越界抛异常
      nums[0] = 9                          // @note! 数组内容可变（val 只锁绑定）
      // nums.add(4)                       // @note! 没有这个方法：长度是固定的

      val asList = nums.toList()           // @note 转成日常用的 List
      val list = listOf(1, 2, 3)           // @note 平时写代码基本用这个，不用数组
    vs:
      javascript: |
        JavaScript 的数组是「什么都能装的可变长列表」 ——
        `push` / `pop` / 长度自己变，还能塞进不同类型的值。
        Kotlin 的数组**长度固定、没有增删方法**，而且分成了多种类型：
        `IntArray` 装原始整数、`Array<Int>` 装装箱对象、`arrayOf("a")` 装字符串，
        彼此不能混用。日常要的是「可变的列表」，在 Kotlin 里那是
        `MutableList`（不是数组）—— 这一点是迁移时最先撞上的概念错位。
      python: |
        Python 的 `list` 与 Kotlin 的 `List` 名字像、用途也像，
        但**可变性分家**：Python 一个 `list` 既能读又能改，
        Kotlin 把它拆成只读的 `List` 与可变的 `MutableList` 两个类型。
        另一处是「数组」这个词的落点：Python 的 `array` 是另一个模块里
        给数值用的紧凑类型，日常几乎不碰；Kotlin 的数组是语言内建的一族类型，
        但仍然不是日常容器 —— 平时写 `listOf(...)`。
      java: |
        两边都对「基本类型数组」与「对象数组」分得很清楚，
        连命名都能对应：Java 的 `int[]` ↔ Kotlin 的 `IntArray`，
        Java 的 `Integer[]` ↔ Kotlin 的 `Array<Int>`。
        差别在这层区分**更容易被忽略**：Java 写 `int[]` 与 `Integer[]`
        一眼能看出差别，Kotlin 写 `intArrayOf` 与 `arrayOf`
        只有几个字母之差，而后者的元素全是装箱对象 ——
        一不留神就在热路径上多出大量装箱。日常该用的是 `List`。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  maps:
    code: |
      val ages = mapOf("Ada" to 30, "Bob" to 25)    // @note 只读：没有 put
      val mut = mutableMapOf("a" to 1)              // @note 可变版本
      mut["b"] = 2                                  // @note 下标赋值就是 put
      mut.put("c", 3)

      ages["Ada"]                  // @note 30；取不到时给 null（不是抛异常）
      ages["Nobody"]               // @note null —— 所以返回类型是 Int?
      ages.getValue("Nobody")      // @note! 这个才抛 NoSuchElementException
      ages.getOrDefault("x", 0)    // @note 给兜底值
      mut.getOrPut("d") { 4 }      // @note 没有才放进去，一步完成「先查再建」

      for ((name, age) in ages) { }        // @note 解构遍历，键值一次拿到
      ages.keys; ages.values; ages.entries

      // @note mapOf 保留插入顺序（底层是 LinkedHashMap），遍历顺序可预期
    vs:
      javascript: |
        两边都用下标取值、取不到都给一个「空」的结果，思路接近。
        JavaScript 给的是 `undefined`，Kotlin 给的是 `null`，
        而且这个 `null` 是写在类型里的（`Int?`），用它之前必须处理。
        另一处差别是键的类型：JavaScript 的对象键只能是字符串或符号，
        Map 才能用任意对象当键；Kotlin 的 `Map` 从一开始就能用任意类型当键，
        而且键的类型是签名的一部分，写错编译不过。
      python: |
        Python 的字典与 Kotlin 的 `Map` 高度对应（`d[k]` ↔ `m[k]`、
        `d.get(k, 默认值)` ↔ `m.getOrDefault(k, 默认值)`、
        `d.setdefault` ↔ `m.getOrPut`），这一格两边可以互相翻译。
        最要紧的差别是**取不到的键**：Python 的 `d[k]` 抛 `KeyError`，
        Kotlin 的 `m[k]` 给 `null` —— 想让它抛异常得显式写 `getValue`。
        也就是说 Python 里那个 `try/except KeyError` 在 Kotlin 里
        默认变成一次判空，只有主动选择 `getValue` 才是异常路径。
      java: |
        方法名与 Kotlin 几乎一一对应（`get` / `put` / `getOrDefault` /
        `putIfAbsent`），`Map` 的默认实现两边也都是保持插入顺序的哈希表。
        两处主要差别：Java 的 `get` 取不到时返回 `null` 但没有类型保护，
        忘了判就 NPE；Kotlin 的可空返回类型会强制你处理。
        另一处是语法糖：Java 至今还是要写 `map.put(k, v)`，
        Kotlin 能写 `map[k] = v`，读起来更像在操作数组。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous
