# arkts —— practice / packages
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: packages` 的那批：
# package-manager / dependency-declaration / version-constraint /
# lockfile / environment-isolation / publishing。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的中心事实是**依赖与构建是两套命令**（ohpm 管依赖、
# hvigorw 管构建），与三个基准都不同 —— 两处都别写成「一条命令全包」。
# 三条最容易想当然、必须按官方文档写的：
# ① 依赖清单是 `oh-package.json5`，**工程级与模块级各一份**；
# ② 锁文件是 `oh-package-lock.json5`，由安装命令自动生成在**工程根目录**；
# ③ 版本区间的符号与 npm 一致（`^` / `~`），但**发布版本必须是三段式**。

review:
  state: draft

boxes:
  package-manager:
    code: |
      // 依赖交给 ohpm（OpenHarmony Package Manager）—— 工具链自带
      //   ohpm install                    按清单装依赖
      //   ohpm install <包名>             加一个依赖
      //   ohpm publish <目录>             发布

      // @note! 依赖与构建是**两套命令**：ohpm 管依赖，hvigorw 管构建
      // @note 官方中心仓是 ohpm.openharmony.cn；内网私仓用官方工具 ohpm-repo 自建
      // @note 没有「选一个包管理器」这一步 —— 官方只有这一个
    vs:
      javascript: |
        思路相近（清单 + 锁文件 + 中心仓），规模差得远 ——
        这里的仓里是给这个平台用的三方库，数量与那边不是一个量级。
        更实际的一处差别是**命令的划分**：那边常见「一条脚本命令把构建、
        测试、发布串起来」，这里的依赖与构建是两条独立的命令，
        各管一段，不互相调用。
      python: |
        Python 要先选包管理器（标准库不带，主流有好几个），
        再决定依赖写在哪；这里没有这一层选择 —— 官方只给一个工具，
        随命令行工具一起装好，装完就能用。
        另一处差别是依赖的落点（见「环境隔离」那一格）：
        那边要显式建虚拟环境，这里默认就是工程内。
      java: |
        Java 的依赖管理**长在构建工具里**：选 Maven 还是 Gradle，
        连带依赖那一套写法一起换。这里两者是分开的 ——
        依赖归 ohpm、构建归 hvigorw，换不了也拆不开。
        好处是依赖这件事只有一种写法；代价是没法像 Java 那样
        用一个工具串起从编译到发布的整条链。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  dependency-declaration:
    code: |
      // oh-package.json5 —— 工程级与模块级各一份，允许写注释（JSON5）
      {
        "dependencies": {
          "@ohos/axios": "^2.2.0"        // @note 运行时依赖
        },
        "devDependencies": {
          "@ohos/hypium": "1.0.21"       // @note 只在开发与测试期用
        },
        "dynamicDependencies": {
          "lib": "file:./library"        // @note 动态共享包（HSP）写在这里
        }
      }

      // @note 官方建议：工程级那份别放业务依赖（除 devDependencies 外）
    vs:
      javascript: |
        形态最接近的一格：都是 JSON、都有 dependencies 与 devDependencies。
        差别在**清单的份数** —— 这里的**工程与每个模块各有一份**，
        模块自己的依赖写在模块自己的清单里，天然分层；
        那边是单份 package.json，多包要靠 workspaces 才能表达同一件事。
        另一处小的便利：这里允许写注释（JSON5），
        而标准 JSON 不允许，那边的 package.json 里想留说明只能靠字段名。
      python: |
        依赖写在文本或 TOML 里，这里写在 JSON5 里 ——
        都能写注释，这一点比标准 JSON 友好。
        真正的差别在**层次**：Python 的依赖清单是「一个项目一份」，
        多包项目要额外机制；这里的工程与模块天然各有一份清单，
        模块依赖哪份库在模块目录里就能看到。
      java: |
        Java 把依赖写在**构建文件**里（pom.xml / build.gradle），
        声明依赖与声明构建方式是同一份文件；
        这里分成了两个文件：oh-package.json5 管依赖、
        build-profile.json5 管构建。好处是两件事互不干扰，
        代价是读一个工程要先知道该翻哪一份。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  version-constraint:
    code: |
      // 版本区间的写法与 npm 那一套一致
      {
        "dependencies": {
          "a": "1.2.3",        // @note 精确
          "b": "^1.2.3",       // @note 脱字符：锁主版本，可升到 1.x.x
          "c": "~1.2.3",       // @note 波浪号：锁主次版本，可升到 1.2.x
          "d": ">=1.2.3",      // @note 下限
          "e": "tag:beta"      // @note 按标签取
        }
      }

      // @note! 发布到中心仓的版本号必须是**三段式**（1.2.3）——
      // @note! 带预发布后缀的版本号会被拒绝，不能发布出去
      // @note 范围匹配时优先选正式版，没有匹配才退到 beta / rc
    vs:
      javascript: |
        这一格最接近：`^` 与 `~` 的含义与那边逐条一致，
        连「0 开头的版本特殊处理」这类细节也同源。
        差别在**发布侧的约束**：这里只接受三段式的版本号，
        预发布后缀不能作为发布版本；那边没有这条限制。
      python: |
        符号体系完全不同：Python 的版本规范里**没有 `^`**，
        「允许升到哪一版」要写兼容子句（`~=1.4.2`）。
        两个 `~` 长得像但语义不同 —— 这里的 `~1.2.3` 允许升到 `1.2.x`，
        那边的 `~=1.2.3` 允许升到 `1.2.*`，看着一样、
        但推导规则来自各自的规范，不能互相套用。
      java: |
        Maven 的版本号**没有语义化版本这回事** —— 官方明说不考虑
        语义化版本所隐含的含义，只按字符串规则比较。
        所以「`^1.2` 意味着什么」这个问题在两边不是一个问题：
        这里有一套明确的区间运算符，那边是坐标加可选的区间语法，
        语义由 Maven 自己定义。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  lockfile:
    code: |
      // oh-package-lock.json5 —— 装完依赖后自动生成在**工程根目录**
      // 记录每个依赖的：精确版本 + 下载地址 + 完整性校验（sha512）
      // 文件头写着 AUTOGENERATED / DO NOT EDIT

      // @note! 官方建议**入库** —— 别人据此装出同一套依赖
      // @note 它由安装命令自动维护，不需要（也不应该）手改

      // 多模块工程也只有工程根这一份，不在各模块下各放一个
    vs:
      javascript: |
        两边职责相同：锁定精确版本 + 记录完整性校验，都建议入库。
        差别在**位置与份数**：那边是每个 package.json 旁边一个锁文件，
        多包工程里会有好几份；这里是工程根一份。
        另一处是格式：这里是 JSON5，文件里能带说明性注释
        （尽管官方要求不要手改）。
      python: |
        这一格是 Python 生态的老问题：直到 2025 年才有了标准的锁文件格式，
        而在此之前能让所有工具互认的格式根本不存在 ——
        导出已装包的那条命令官方明说**不是**求解结果，
        真正能锁的几套方案都是第三方工具各自的格式。
        标准定下来不等于大家都在用：生态仍在过渡，
        所以那边至今要回答「你们项目用哪套锁定方案」。
        这里从一开始就只有一种锁文件，不存在这个问题。
      java: |
        Maven **默认没有锁文件** —— 版本在每次构建时重新解析，
        因此「今天装的和明天装的」理论上可以不同；
        Gradle 有依赖锁定，但要显式开启才有。
        这里是默认就有、且官方建议入库，可复现性是开箱状态。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  environment-isolation:
    code: |
      // 依赖装在**工程内**：<工程根>/oh_modules/
      //   ohpm 1.4 起统一放在 oh_modules/.ohpm/ 下，各模块目录里是软链接
      // @note 用户目录下只有**缓存**（下载过的包），安装落点始终在工程内

      // @note! 没有「全局装了一个包，所有工程都受影响」这种情况
      // @note! 也没有「先激活环境再构建」这一步 —— 进目录就能构建
    vs:
      javascript: |
        两边都是工程内隔离（各自一个依赖目录），这一点相同。
        差别在**多模块工程的组织**：那边要把多个包的依赖提到顶层共享，
        得引入 workspaces；这里的多模块是工程的原生概念，
        依赖自动集中到工程根、各模块用软链接指过去，
        不需要额外声明。
      python: |
        这是从 Python 过来最省心的一处：那边要先创建并**激活**虚拟环境，
        隔离才成立；这里的隔离是默认状态 —— 依赖就在工程目录里，
        没有激活这一步，也不会出现「忘了激活、装到全局去了」。
        代价是也没有「一个环境跑多个项目」这种用法，隔离是硬的。
      java: |
        落点正好相反：Java 的依赖缓存在**用户目录**（本地仓库），
        全局按坐标存放一份，工程目录里看不到依赖；
        这里依赖装在**工程内**，用户目录只放缓存。
        实际影响很直接：那边「清空本地仓库」是全局动作（影响所有项目），
        这里删掉依赖目录只影响这一个工程，重装也快。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  publishing:
    code: |
      // 发布一个供别人依赖的包
      //   ohpm publish ./library        // @note 目录、.har 或 .tgz 都行
      // @note! 共享包要打成 HAR（静态共享包）或 HSP（动态共享包）：
      // @note! HAR 编译期被拷进每个引用它的产物；HSP 运行时共享同一份

      // 私仓与作用域仓写在 .ohpmrc 里（用户级或工程级）
      //   registry=https://ohpm.openharmony.cn/ohpm/
      //   @myco:registry=https://my-ohpm.internal/repo/
      // @note 内网私仓用官方工具 ohpm-repo 自建，认证可用 token 或证书
    vs:
      javascript: |
        两边都是「传到中心仓、占住版本号」，流程形状一致。
        差别在**发布物的形态**：那边发布源码加元数据，消费方自己打包；
        这里要先把库打成共享包再发布，而且有两种形态可选 ——
        编译期拷贝进去的，和运行时共享同一份的。
        这个选择在那边不存在（模块就是模块）。
      python: |
        Python 也要先构建产物（wheel / 源码包）再上传，这一点相同。
        差别在**共享方式**：那边的包被各自复制进各自的环境，
        同一个库在十个项目里就是十份；这里的动态共享包能做到
        多个模块在运行时用同一份，改一处全局生效。
      java: |
        Java 发布到中央仓要走签名与审核，是几门里最重的一套流程；
        这里一条发布命令就完了。
        私仓那一侧两边都要自建（这里用官方工具，Java 用 Nexus 这类服务），
        差别是这里的私仓配置写在配置文件里、按作用域分流，
        Java 那边则是构建工具与设置文件两处配合。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
