# cpp —— model / errors
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: errors` 的那批：
# throw-raise / try-catch / finally-cleanup / error-types /
# custom-error / error-propagation。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的题眼是**「资源释放不靠 finally，靠析构」** ——
# **C++ 根本没有 `finally`**，那件事由 RAII 在栈展开时完成（实跑证实：
# 异常抛出后局部对象的析构先跑，然后才进 catch）。
# 另外两条实跑确认：**没有 checked exception**（抛什么类型都可以），
# 而 `noexcept` 承诺不抛却抛了会直接 `std::terminate`（GCC 给 -Wterminate 警告，进程退出码 3）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-errors-v1
    generatedAt: '2026-10-04'

boxes:
  throw-raise:
    code: |
      throw std::runtime_error("出事了");     // @note 抛一个**任意类型的值**
      throw 42;                                // @note! 合法 —— 连整数都能抛（别这么干）

      // @note! C++ **没有 checked exception**：函数签名里不写「我可能抛什么」，
      // @note! 调用方也不需要标注。抛什么、抛不抛，编译器都不管

      // 想声明「不抛」才要写，而且它是承诺、不是检查
      void safe() noexcept;             // @note 抛了就 terminate（见下）

      // 从构造函数里抛是标准做法：对象没构造完，析构不会跑
      // 从析构函数里抛很危险：析构默认 noexcept，展开期间再抛就 terminate
    vs:
      javascript: |
        两边都是「抛一个值」，但 C++ 抛的**可以是任何类型**（连 `int` 都行），
        所以「处理错误」在这边先得回答「谁来定义错误的形态」——
        靠约定使用标准异常类（`std::runtime_error` 等）。
        另一处差别在声明：JavaScript 也没有 checked exception，
        这一层两边一致；但 C++ 有 `noexcept` 这个**反向承诺**
        （声明「我不抛」），写错了直接终止进程，不是抛异常。
        还有一处是 C++ 从构造函数里抛是常见写法（对象没建成，析构不会跑），
        而构造过程本身没有「半成品」这回事。
      python: |
        两边都能抛任意对象，也都没有 checked exception，这一层很像。
        差别在**异常类必须继承什么**：Python 的异常要能被 `except Exception`
        接住才算「常规错误」（否则会穿透），所以有一套内建的层级；
        C++ 的 `catch (...)` 能接住任何东西，不存在「必须继承某个基类」
        的约束，于是「只接我认识的错误、其余放走」这件事两边写法不同。
        另一处是 C++ 的 `noexcept` 在 Python 里没有对应物
        （Python 没有「声明不抛」的语法）。
      java: |
        **这是两边差别最大的一格**：Java 有 checked exception ——
        方法签名里必须列出可能抛的受检异常，调用方必须处理或继续声明；
        C++ 完全没有这一层，抛什么、谁要处理，编译器一句都不问。
        所以从 Java 过来最大的变化是**编译器不再帮你追错误传播路径**，
        文档与类型要自己补（比如用 `std::expected` 把错误写进返回值）。
        另一处是 Java 的 `throw` 只能抛 `Throwable` 的子类，
        C++ 什么都能抛 —— 后者更自由，也更难靠类型统一处理。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  try-catch:
    code: |
      try {
        risky();
      }
      catch (const std::invalid_argument& e) {   // @note! 按**引用**接（值接会切片）
        std::puts(e.what());
      }
      catch (const std::exception& e) {          // @note 基类兜住其余标准异常
        std::puts(e.what());
      }
      catch (...) {                              // @note 兜底，什么都能接
        std::puts("未知错误");
      }

      // @note! 顺序要紧：**先窄后宽** —— 基类写在前面会把派生类全吃掉
      // @note! 按值接会**对象切片**（派生类信息被切掉），一定要用引用

      // @note 没有 finally（见 finally-cleanup 那一格），
      // @note 也没有「捕获即绑定变量」以外的花样
    vs:
      javascript: |
        两边的 `try` / `catch` 形态像，但**能不能按类型分支**不同：
        JavaScript 只有一个 `catch (e)`，要按类型分得在块里自己判断
        （`instanceof` 或看 `e.name`）；C++ 可以直接写多个 `catch` 子句
        按类型匹配，而且顺序有语义（先窄后宽）。
        另一处是 C++ 必须注意**按引用接**，写成按值接会发生对象切片 ——
        拿到的是一个残缺的基类对象，派生类的信息全丢了，而编译器不报错。
      python: |
        两边都能写多个 `except` / `catch` 子句按类型匹配，这一层对应得上。
        差别在**接住的东西是什么**：Python 的 `except E as e` 正常就是引用，
        没有切片问题；C++ 写成按值接会切片，是个要**刻意记住**的坑。
        另一处是 C++ 的 `catch (...)` 与 Python 的裸 `except:` 都表示兜底，
        但 C++ 的兜底**拿不到任何信息**（连类型都问不出来），
        Python 至少还能 `sys.exc_info()`。
      java: |
        两边的形态**几乎完全一致**（多个 catch、按类型匹配、顺序先窄后宽），
        这一格最接近。差别在编译器管不管：Java 的 catch 子句会被检查
        「这个异常真的可能被抛出吗」（不可能抛的 catch 是编译错误），
        C++ 完全不检查 —— 写一个永远不会触发的 `catch` 毫无提示。
        另一处是 C++ 要小心对象切片（按引用接），Java 的异常天生是引用，
        不存在这个问题。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  finally-cleanup:
    code: |
      // @note! **C++ 没有 finally** —— 这件事交给「析构函数一定会跑」

      struct File {
        FILE* fp;
        File(const char* p) { fp = fopen(p, "r"); if (!fp) throw std::runtime_error("打不开"); }
        ~File() { if (fp) fclose(fp); }        // @note 离开作用域就关，无论怎么离开
      };

      void work() {
        File f("data.txt");                    // @note 拿到就代表打开成功
        risky();                               // @note 这里抛了，f 的析构照样跑
      }                                        // @note 正常返回也一样跑

      // 实跑确认的执行顺序：异常抛出 → **先跑局部对象析构** → 再进 catch
      // 所以「出了异常也要执行的那段收尾」在这门语言里是**免费**的

      // @note 实在要写「块结束就跑」的一段代码，可以用一个带析构的小对象包住
      // @note （标准库的 lock_guard 就是这个套路）
    vs:
      javascript: |
        **这一格是两门语言资源管理的分水岭**：JavaScript 靠
        `try / finally`（或 `using` 声明）显式写出「无论如何都要执行的那段」，
        所以要**记得写**；C++ 根本没有 `finally` ——
        因为局部对象的析构函数在离开作用域时（包括异常展开时）一定会跑，
        「打开就配对关闭」这件事由类型自己负责，写代码的人不用记。
        代价是 C++ 里「资源」必须包成一个类型（这就是 RAII），
        裸资源（`fopen` 返回的指针）没有任何保证。
      python: |
        两边的差别就是 `finally` 与析构：Python 有 `finally`，
        而且 `with` 语句把「进入/退出必做」写成了协议（`__enter__` / `__exit__`）；
        C++ 没有 `finally` 也没有 `with`，对应物是**析构函数** ——
        只要是栈上的对象，退出作用域必然会析构（异常也照跑）。
        所以 Python 的 `with` 是显式语句、只能用在实现了协议的对象上；
        C++ 的析构是**隐含的**，任何类型都有，代价是「什么时候析构」
        由对象住哪决定（`new` 出来的就不会自动跑）。
      java: |
        两边都有 `try / catch / finally` 的形态？**C++ 其实没有 `finally`** ——
        这是从 Java 过来最容易找不到的一处。Java 的 `finally` 承担
        「关闭资源」的职责，C++ 把这件职责交给了析构函数（RAII），
        而且好处是**不用记得写**：只要对象活过作用域就会被清理，
        连「多个资源、其中一个打开失败」这种边角情况都自动正确
        （已构造的部分会被逆序析构）。Java 的 try-with-resources 思路最接近，
        但它是显式语句，C++ 是类型的默认行为。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  error-types:
    code: |
      // @note C++ **没有规定错误必须是什么类型** —— 抛什么都行
      // @note 标准库给了一棵自己的异常树，实际项目都按它来

      std::exception                    // 标准异常的根
        ├─ std::logic_error             // @note 逻辑错误：本可以避免
        │    ├─ std::invalid_argument
        │    ├─ std::out_of_range
        │    └─ std::domain_error
        └─ std::runtime_error           // @note 运行期错误：外部条件导致
             ├─ std::range_error
             └─ std::overflow_error

      std::exception::what();           // @note 唯一统一的接口：一个 const char*

      // @note! 还有完全不抛异常的一条路：错误码与 std::expected
      std::expected<int, std::error_code> parse(...);   // @note C++23
      // @note 这条路上的「错误」是个值，不是控制流
    vs:
      javascript: |
        两边都「能抛任何东西」，但 C++ 的**标准异常树更结构化**：
        JavaScript 的 `Error` 有 `name` / `message` / `stack` 三个约定字段，
        子类化靠自定义 class；C++ 的 `std::exception` 只强制一个
        `what()` 返回 `const char*`，信息量更少
        （要带上下文得自己定义类），但换来的是「任何标准异常都能
        用一个接口处理」。另一处是 C++ 有 `std::expected` 这条
        **不抛异常**的路线，把错误放进返回值里 —— 这在 JavaScript 里
        只能靠约定（返回 `{ok, value}` 这种形状）。
      python: |
        两边都有层次化的异常树（`BaseException` → `Exception` → 具体异常
        ↔ `std::exception` → `logic_error` / `runtime_error` → 具体异常），
        形状很像。差别在**信息载体**：Python 的异常是带任意属性的对象
        （可以塞任何上下文），而且 `str(e)` 与 `repr(e)` 都有用；
        C++ 的 `std::exception` 只有 `what()` 那一个字符串接口，
        想带结构化信息必须自己定义类并继承它。
        另一处是 C++ 有 `std::expected` 这种「错误当返回值」的选项，
        Python 里通常还是抛异常。
      java: |
        两边都有一棵分层的异常树，也都分「逻辑错误」与「运行期错误」，
        这一层高度对应（`logic_error` / `runtime_error` 几乎就是
        「受检 / 不受检」的那条分界，但**强制力完全不同**：
        Java 用编译器强制 checked exception 必须处理，
        C++ 只是把这两个名字用来分类，没有任何强制）。
        另一处是 Java 的异常带栈轨迹（`printStackTrace`），
        C++ 的 `what()` 只有消息 —— 要栈得用 C++23 的 `std::stacktrace`
        自己抓，而且那也不是异常自带的。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  custom-error:
    code: |
      class HttpError : public std::runtime_error {
      public:
        int status;
        HttpError(int s, const std::string& msg)
          : std::runtime_error(msg), status(s) {}     // @note 初始化基类
      };

      throw HttpError(404, "没找到");

      catch (const HttpError& e) {
        std::printf("%d %s\n", e.status, e.what());
      }

      // @note! 继承标准异常有两个必须记住的点：
      // @note! ① 要能按引用接住并不被切片 —— 所以别按值接
      // @note! ② `what()` 返回的是 `const char*`，字符串的生命周期要自己管住
      // @note 惯例：从 `std::runtime_error`（而不是 `std::exception`）继承，
      // @note 因为它自带了「存一个字符串」的实现

      // @note 析构函数别抛异常 —— 它是 noexcept 的，抛了就 terminate
    vs:
      javascript: |
        两边的做法几乎一样（继承基类、加自己的字段），这一格很接近。
        差别在**基类的约束强度**：JavaScript 的 `class MyError extends Error`
        有语言配合（`instanceof`、`stack` 自动带上），
        C++ 继承 `std::runtime_error` 主要是为了**复用一个存字符串的实现**，
        其余全靠约定。另一处是 C++ 要操心生命周期：
        `what()` 返回的是裸指针，如果构造时传的是临时字符串的
        `c_str()`，那个指针可能已经悬垂 —— JavaScript 没有这一层。
      python: |
        两边都是「继承一个基类、加字段」，形态一致。
        差别在**抛的时候**：Python 的 `raise HttpError(404, "...")` 里
        那个括号是构造，异常对象一路带着走，属性随时可取；
        C++ 的 `throw HttpError(404, "...")` 会**拷贝**一份异常对象
        （所以异常类型要能拷贝），接住的是那个副本 ——
        所以带大对象的异常在 C++ 里有拷贝成本，
        这也是老代码里常见「抛指针」的原因（现在不推荐）。
      java: |
        两边都继承基类加字段，写法高度对应（构造函数转发消息给基类）。
        差别在**受检与否**：Java 的自定义异常继承 `Exception` 就是受检的、
        继承 `RuntimeException` 就不受检，这个选择会影响所有调用方；
        C++ 没有受检这一说，继承 `std::runtime_error` 只是拿它的实现，
        不会给调用方任何强制。另一处是 C++ 的异常对象会被拷贝，
        Java 的异常对象是引用传递，成本模型不同。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  error-propagation:
    code: |
      // @note C++ 的传播**不需要任何标注** —— 不接就自动往上走
      void deep() { throw std::runtime_error("底层出事了"); }
      void mid()  { deep(); }              // @note 什么都没写，异常直接穿过
      void top()  { try { mid(); } catch (const std::exception& e) { /* 处理 */ } }

      // @note 想「包一层、保留原因」：标准库给了 nested_exception
      try { mid(); }
      catch (const std::exception& e) {
        std::throw_with_nested(std::runtime_error("上下文"));   // @note 把当前异常套进新的
      }
      // 接的时候用 rethrow_if_nested 一层层翻
      catch (const std::exception& e) {
        try { std::rethrow_if_nested(e); }
        catch (const std::exception& inner) { /* 原始的那层 */ }
      }
      // @note! 但这套是**手动的** —— 得记得包、记得翻，而且异常类型也要配合
      // @note! 忘了包一层，原因就丢了且没有任何提示（对比下一格的基准侧）

      // 另一条路：把错误放进返回值，一路顺着传（见 error-types）
      std::expected<int, std::string> step();
      // 调用方检查 !r，再决定是继续往上返回还是就地处理

      // @note! 还要小心裸的 `throw;`（重抛当前异常）：
      // @note! 它在 catch 块**外面**照样编译通过（实测 -Wall -Werror 也不报），
      // @note! 而在没有活动异常时执行它会直接 `std::terminate`
    vs:
      javascript: |
        两边的传播都是「不接就往上走」，这一层一致。
        差别在**保留原因的方式，而且一个是默认、一个是手动**：
        JavaScript 的 `new Error(msg, {cause: e})` 从 ES2022 起是标准写法，
        打印时整条链都显示；C++ 也有对应机制（`std::throw_with_nested`
        加 `rethrow_if_nested`），但**要手动包、手动翻** ——
        忘了包一层原因就丢了，而且没有任何提示。
        也就是说那边「原因链」是异常的默认属性，这边是一个可选动作。
        另一处是 JS 的 `throw e` 会保留栈、C++ 里连「栈」这个概念
        都不在异常对象上（要 C++23 的 `std::stacktrace` 另外抓）。
      python: |
        两边都有「重抛」与「包一层」两件事，但**凑在一起的代价不同**：
        Python 的 `raise NewError(...) from e` 一句话就完成了
        「抛新异常 + 保留原因 + 打印时两层都显示」；
        C++ 要包一层得调 `std::throw_with_nested`，要读原因得再调
        `rethrow_if_nested` 并自己套一层 try —— 能力有，但是散装的。
        另一处是裸重抛：C++ 的 `throw;` 与 Python 的裸 `raise` 都表示
        「重抛当前异常」，但 C++ 的 `throw;` 写在 catch 外面
        **编译器不拦**，运行到那里直接终止进程。
      java: |
        两边都有「包一层」的写法，但 Java 的 `new RuntimeException(msg, cause)`
        是**标准构造函数**，原因链是一等公民（`getCause()` 能一路翻）；
        C++ 的标准异常没有这个参数，得自己定义类型存起来。
        另一处差别很大：Java 的受检异常逼着你在签名里声明传播路径，
        所以「这个异常会飘到哪」是能静态看出来的；C++ 完全没有这层信息，
        只能靠文档，或者改用返回值传错误。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
