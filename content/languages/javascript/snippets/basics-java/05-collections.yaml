  - featureId: basics-java/array-index
    equivalence: divergent
    code: |
      const a = [10, 20, 30];
      a[0];                        // 10
      a[a.length - 1];             // @note 取末尾同样要自己算
      a.at(-1);                    // @note! 支持负索引 —— 但要显式用 at()

      a[99];                       // @note! undefined —— 越界静默返回空值，不抛
      a[99].toString();            // @note! 于是这里才崩，报错位置离原因很远
      // @note Java 的越界是当场抛，这边把错误推到了下游
  - featureId: basics-java/array-mutate
    equivalence: analogous
    code: |
      const a = [1, 2, 3];
      a.push(4);                   // @note 尾部追加
      a.pop();
      a.unshift(0);                // @note! 头部插入 O(n)
      a.shift();                   // @note! 头部弹出 O(n)

      a.splice(1, 2);              // @note 按下标删两个并返回被删项
      a.splice(1, 0, 9);           // 在 1 处插入 9
      // @note! 没有"按值删"：要删某个值得先 indexOf 再 splice，或 filter 重建

      // @note 好处是没有 Java 那个 remove(下标) 与 remove(值) 的歧义
  - featureId: basics-java/array-slice
    equivalence: divergent
    code: |
      const a = [1, 2, 3, 4, 5];
      const sub = a.slice(1, 3);
      sub[0] = 9;                  // @note! a 不受影响 —— slice 是**拷贝**不是视图

      a.slice(-2);                 // @note [4, 5] —— slice 支持负索引
      a.slice();                   // 浅拷贝一份

      // @note! 与 subList 的行为正好相反：那边改视图会写回原列表
      // @note 同样没有步长，反转要 [...a].reverse()
  - featureId: basics-java/array-iterate
    equivalence: analogous
    code: |
      for (const x of a) { }              // @note 直接给值
      for (const i in a) { }              // @note! for...in 给的是下标（字符串形式！）

      a.forEach((x, i) => { });           // @note 下标是第二个参数，比 Java 省事
      for (const [i, x] of a.entries()) { }   // @note entries() 直接给 [下标, 值]

      // @note 同样没有 zip，但至少"值 + 下标"有现成写法，Java 要手写循环
      // @note 遍历时增删有未定义行为，但不像 Java 那样抛异常
  - featureId: basics-java/array-map-filter
    equivalence: analogous
    code: |
      a.map((x) => x * 2);                        // @note 链式方法
      a.filter((x) => x > 0);
      a.map((x) => x * 2).filter((x) => x > 0);

      a.some((x) => x > 0);                       // @note 对应 anyMatch
      a.every((x) => x > 0);                      // 对应 allMatch
      a.reduce((acc, x) => acc + x, 0);

      // @note! 每个方法都立刻求值并新建数组，不像 Stream 那样惰性；
      // 好处是结果可以反复用，没有"流只能消费一次"的限制
      // @note 也不需要 mapToInt：数字就是 number，求和不必转类型
  - featureId: basics-java/array-sort
    equivalence: divergent
    code: |
      const a = [10, 9, 1];
      a.sort();                    // @note! [1, 10, 9] —— 默认按字符串比较
      a.sort((x, y) => x - y);     // [1, 9, 10] —— 数值排序必须传比较器

      const sorted = [...a].sort((x, y) => x - y);   // @note 要副本先复制

      // @note! 出错方式与 Java 相反：这边是"静默排错"，
      // Java 是"不可比较就编译不过"
      // @note 没有 Comparator 链，多字段排序要在一个比较函数里手写
  - featureId: basics-java/array-search
