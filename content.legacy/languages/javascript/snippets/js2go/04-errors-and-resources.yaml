      throw new Error("读取配置失败", { cause: e });   // @note 包装并保留因果链

      try {
        load();
      } catch (e) {
        if (e instanceof ConfigError) { }            // @note! 靠 instanceof 分类
        else throw e;
      }

      // @note! 错误类型不是签名的一部分，调用方无法穷尽处理
      // @note Go 用 %w 包装、用 errors.Is / As 判定 —— 同样是"保留因果链"的思路
  - featureId: js2go/errors-exercise
    equivalence: identical
    code: |
      async function loadConfig(path, retries = 3) {
        let lastErr;
        for (let i = 0; i < retries; i++) {
          try {
            const f = await open(path);
            try { return JSON.parse(await f.read()); }
            finally { await f.close(); }              // @note 这一轮结束就关
          } catch (e) {
            if (e.code === "ENOENT") throw e;         // @note 不可重试：直接抛
            lastErr = e;
            await sleep(100 * 2 ** i);
          }
        }
        throw lastErr;
      }

      // @note! Go 里 "defer 写在循环里" 会把所有句柄堆到函数返回才关 ——
      // 所以要把"一次尝试"抽成一个函数，defer 才会每轮都生效
