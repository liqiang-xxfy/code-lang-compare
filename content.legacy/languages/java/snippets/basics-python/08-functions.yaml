      static int sum(int... nums) {                     // @note 可变参数，收集成**数组**
          return java.util.Arrays.stream(nums).sum();
      }

      sum(1, 2, 3);
      sum(new int[]{1, 2, 3});                          // @note 数组可以直接传
      sum();                                            // 空数组

      // @note! 只能有一个可变参数，且必须在参数列表最后
      // @note! 也**没有**"关键字可变参数"：没有 **kwargs 的对应物

      static void f(String first, Object... rest) { }
      // @note! 陷阱：f(null) 会让 rest 变成 null 而不是空数组
  - featureId: basics-python/return-multiple
    equivalence: absent
    code: |
      // @note! 一个方法只能返回一个值，没有元组
      static int[] minMax(int[] xs) {                   // 要么塞进数组
          return new int[]{java.util.Arrays.stream(xs).min().orElseThrow(),
                           java.util.Arrays.stream(xs).max().orElseThrow()};
      }

      record MinMax(int lo, int hi) { }                 // 要么自定义一个类型（推荐）
      static MinMax minMax2(java.util.List<Integer> xs) {
          return new MinMax(java.util.Collections.min(xs), java.util.Collections.max(xs));
      }

      var r = minMax2(xs);
      r.lo();                                           // @note 访问器是方法调用
      // @note 也可以借用 Map.Entry / AbstractMap.SimpleEntry 当临时二元组，
      // 但那是权宜之计，语义上不表达"这两个值是一对"
    body: |
      Java 的方法只能返回一个值，也没有元组类型。要返回多个值只有两条路：

      1. **塞进数组或容器** —— `int[]` / `List<Object>`。
         代价是丢类型信息，访问靠下标，读的人不知道第 1 个是什么。
      2. **定义一个类型** —— `record MinMax(int lo, int hi)`。
         多写几行，但返回值和调用处都自解释。

      实践中第 2 条是主流，也是这门语言近年的方向：
      `record` 让"为一对值起个名字"的成本降到一行。

      与 Python 的 `return a, b` 相比，差的不只是写法 ——
      Python 那边**"多个返回值"其实是元组**这个事实，让它可以被整体传递、
      解包、用星号收集；这边一旦选定容器就固定了，后面再改要动所有调用点。
