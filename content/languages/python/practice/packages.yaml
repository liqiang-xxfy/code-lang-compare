# python —— practice / packages
#
# boxes 的 key 必须是 catalog/practice/features.yaml 里 `group: packages` 的那批。
# 这一组以 Python 为基准时展示在「包管理与虚拟环境」章（见 catalog/practice/python.yaml）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-packages-v1
    generatedAt: '2026-10-03'

boxes:
  package-manager:
    code: |
      pip install requests           # @note 官方那个
      poetry add requests            # @note 连清单带环境一起管
      uv add requests                # @note 新版，快很多

      # @note! 工具与清单是**绑在一起**的：
      #   pip      -> requirements.txt
      #   poetry   -> pyproject.toml + poetry.lock
      #   换工具通常要换一套文件

      pipx install ruff              # @note 装命令行工具用 pipx，别混进项目环境
    baseline: |
      官方是 **pip**，但生态里 poetry / uv 也常用。与别处不同的是：
      **工具与清单绑在一起** —— 选了 poetry，清单就是 `pyproject.toml`
      加它自己的锁文件；选 pip 就是 `requirements.txt`。所以「换包管理器」
      在这里往往意味着改项目文件。命令行工具用 `pipx` 装，
      别混进项目环境。
    vs:
      javascript: |
        JavaScript 的三个客户端读同一份 `package.json`，换客户端不用改清单；
        Python 的工具与清单是一对一的，换工具要改文件。
        两边都把「装命令行工具」与「装项目依赖」分开，只是方式不同。
      java: |
        Java 的构建工具同时管依赖与构建，更像「一个工具包办一切」；
        Python 这边包管理与构建是分开的（构建另有 build / hatchling 那套），
        但工具与清单绑定这一点让它显得比 Java 更碎。
    equivalence:
      javascript: divergent
      java: divergent

  dependency-declaration:
    code: |
      # pyproject.toml（PEP 621 标准写法）
      [project]
      name = "myapp"
      dependencies = [
        "requests>=2.31",
        "pydantic~=2.5",
      ]

      [project.optional-dependencies]     # @note 按用途分组
      dev = ["pytest", "ruff"]
      docs = ["sphinx"]

      # 安装：pip install -e ".[dev]"     ← 带上方括号里的那组
      # 旧写法：requirements.txt 一行一个，没有分组机制
    baseline: |
      依赖写在 `pyproject.toml` 的 `[project]` 里（PEP 621 之后这是标准），
      用 `optional-dependencies` **按用途分组**（`dev` / `docs` / …），
      安装时 `.[dev]` 取某一组。老项目仍常见 `requirements.txt`
      （一行一个包，没有分组，只能靠多个文件拆）。
    vs:
      javascript: |
        两边的分组维度不同：JavaScript 是「运行时 / 开发时 / 使用方 / 可选」
        四个固定分区，Python 是「核心 + 任意命名的用途分组」。
        JavaScript 装全部开发依赖是默认行为，Python 要显式写 `.[dev]`。
      java: |
        Maven 用 `<scope>` 表达「什么时候需要」，是固定的四个且带语义；
        Python 的分组更自由（想分几组都行），但也因此没有统一语义 ——
        `dev` 只是约定，不是语言规定。
    equivalence:
      javascript: analogous
      java: analogous

  version-constraint:
    code: |
      "==2.31.0"       # @note 精确
      ">=2.31,<3"      # @note 范围（逗号是「且」）
      "~=2.31"         # @note! 兼容版本：>=2.31 且 ==2.*（允许补丁位升）
      "!=2.30"         # @note 排除某个版本

      # @note 语义化版本在这里只是**约定** —— 生态里不遵守的包不少
      # @note! 默认什么都不写 = 任何版本，比别处更宽松

      pip install "requests>=2.31"     # @note 命令行里要加引号，否则 > 被 shell 吃掉
    baseline: |
      用 PEP 440 的版本规格符：`==` 精确、`>=` 加 `<` 组范围、`~=` 兼容版本
      （允许补丁位浮动）。**不写约束就是任何版本** —— 这一点比别的语言宽松，
      所以「锁文件」在这里格外重要。语义化版本同样只是约定，
      生态里不遵守的包不少。
    vs:
      javascript: |
        两边的范围语义相近，但默认值相反：JavaScript 的 `^` 是默认的
        （允许次版本浮动），Python 不写就是完全放开。
        另一处差别是命令行里的引号 —— Python 这边 `>` 会被 shell 当成重定向，
        必须加引号，JavaScript 用 `^` 没这个麻烦。
      java: |
        Maven 用区间写法 `[1.0,2.0)`，与这里的「逗号连接多个条件」不同。
        两边都面临传递依赖的版本冲突，Java 靠「最近优先」的仲裁规则，
        Python 靠解析器在锁文件里定死。
    equivalence:
      javascript: analogous
      java: analogous

  lockfile:
    code: |
      # poetry.lock / uv.lock / pip-tools 生成的 requirements.txt
      # @note 记录整棵依赖树的精确版本与哈希
      # @note 提交进版本库

      poetry install --sync        # @note 严格按锁文件装
      pip install -r requirements.txt   # @note 若这份文件已经是锁定的
      pip-compile requirements.in       # @note pip-tools：从 .in 生成锁定的 .txt

      # @note! 传统 requirements.txt 常常**不是**锁文件 ——
      #        里面写的是范围时，它只是清单，装出来的东西每次可能不同
    baseline: |
      现代工具（poetry / uv）用两层结构：`pyproject.toml` 声明意图、
      锁文件固化事实。传统做法是用 `requirements.txt` 直接写精确版本 ——
      那时它本身就是锁文件；但如果里面写的是范围，那它就只是清单，
      每次装出来的东西可能不同。这是这边最容易混淆的一处。
    vs:
      javascript: |
        两边都有「清单 + 锁文件」的两层结构与「严格按锁安装」的命令。
        差别在传统：JavaScript 从一开始就有独立的锁文件，
        Python 的 `requirements.txt` 既可能是清单也可能是锁，得看内容。
      java: |
        Maven 传统上没有锁文件，`pom.xml` 里写什么就是什么（传递依赖靠仲裁）；
        Gradle 才有依赖锁定。所以「可复现安装」这件事在 Java 这边
        历史上比前两家弱。
    equivalence:
      javascript: analogous
      java: divergent

  environment-isolation:
    code: |
      python -m venv .venv          # @note 建虚拟环境
      source .venv/bin/activate     # @note 激活（Windows 上是 .venv\Scripts\activate）
      pip install requests          # @note 装进这个环境，不污染全局

      # @note! 默认是**全局安装** —— 多项目共享一个环境，
      #        「A 要 1.0、B 要 2.0」就会打架。隔离要主动做。

      conda create -n myenv python=3.12   # @note conda 连解释器一起管
      poetry install                       # @note poetry 自动建环境
      uv venv                              # @note uv 也能建

      # @note 环境目录（.venv）**不要提交**
    baseline: |
      **隔离要主动做**：默认 `pip install` 装进全局环境，多个项目共享就会
      互相打架。所以标准流程是先建虚拟环境（`venv` / conda / poetry / uv 都行）
      再装。这也是「每个项目一个环境」这条习惯的来源。
      `.venv` 目录不要提交。
    vs:
      javascript: |
        JavaScript 天然隔离：每个项目一份 `node_modules`，不用做任何事。
        Python 必须记得激活环境 —— 忘了激活就会装到全局去，
        这是从那边换过来时最常见的操作事故。
      java: |
        Java 用本地仓库缓存所有版本、按坐标取用，项目之间通过类路径隔离 ——
        也不需要「激活环境」这个动作。两边的隔离都是自动的，
        Python 是这里唯一需要手动介入的。
    equivalence:
      javascript: divergent
      java: divergent

  publishing:
    code: |
      python -m build               # @note 构建 sdist 与 wheel
      twine upload dist/*           # @note 上传到 PyPI 或私有源

      # 私有源：pip.conf 或环境变量
      #   [global]
      #   index-url = https://pypi.mycorp.com/simple
      #   extra-index-url = https://pypi.org/simple

      # @note! 没有「按包前缀分流」这种机制 —— 只能靠 index-url 的优先级，
      #        或者用 devpi / Artifactory 做聚合代理
    baseline: |
      发布流程分两步：先用 `build` 打出发行包（源码包与 wheel），
      再用 `twine` 上传。私有源靠 `pip.conf` 的 `index-url` 配置 ——
      注意它**不能按包名分流**，只能设主源与附加源，混用内外部包时
      要靠代理服务（devpi / Artifactory）聚合。
    vs:
      javascript: |
        JavaScript 的 `.npmrc` 能按作用域把内外部包分流到不同源，
        一条配置就够；Python 只能设主源加附加源，要靠代理服务兜。
        两边的构建步骤也不同：那边基本不用先打包再上传。
      java: |
        两边的流程很像：先构建构件、再上传到仓库，客户端配镜像与私有源。
        差别在构件的组织：Java 是「坐标 + jar」，Python 是
        「sdist + wheel」两种发行包。
    equivalence:
      javascript: divergent
      java: analogous
