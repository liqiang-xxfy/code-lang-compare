id: concepts-javascript/02-data
topicId: concepts-javascript
title: 数据与字符串
order: 2
summary: 装数据的容器、不可变的那一套、文本与时间的处理方式
features:
  - id: concepts-javascript/collections
    title: 常用集合
    kind: concept
    summary: 对象字面量不是字典 —— 键只能是字符串，也没有不可变的有序容器

  - id: concepts-javascript/immutable-data
    title: 不可变数据
    kind: concept
    summary: 「不可变」在 JS 里只是一次运行时的浅冻结，不是类型属性

  - id: concepts-javascript/string-format
    title: 字符串格式化
    kind: concept
    summary: 模板字符串加几个方法调用，格式化不成体系

  - id: concepts-javascript/regex
    title: 正则表达式
    kind: concept
    summary: 正则写成字面量，入口函数一律匹配任意位置

  - id: concepts-javascript/serialization
    title: 序列化
    kind: concept
    summary: JSON 内建，但遇到函数与 undefined 会静默丢弃

  - id: concepts-javascript/date-time
    title: 日期时间
    kind: concept
    summary: Date 可变、月份从 0 起，时区要靠 Intl 与第三方库补足
