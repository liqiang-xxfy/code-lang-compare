- featureId: basics/type-casting
  equivalence: divergent
  code: |
    let d = 3.99_f64;
    let n = d as i32;        // @note as 是截断：3，不是四舍五入

    "42".parse::<i32>();     // Ok(42) —— @note 字符串转数字走 FromStr，失败返回 Result
    42.to_string();          // "42"

    // @note! as 是「位模式优先」的转换，可能给出意外结果：负数 as u32 会变成巨大的正数
    let small: u8 = u8::try_from(300).unwrap_or(0);   // 超出范围 -> 0（失败而非回绕）

    // @note 需要「失败就明确失败」时优先 try_into() / From，而不是 as
  review:
    state: draft
