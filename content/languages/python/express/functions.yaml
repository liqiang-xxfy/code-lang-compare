# python —— express / functions
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: functions` 的那批。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-functions-v1
    generatedAt: '2026-10-03'

boxes:
  function-declaration:
    code: |
      def greet(name):
          return f"你好，{name}"       # @note def 是唯一定义函数的方式

      square = lambda x: x * x          # @note 只能写一个表达式
      print(greet)                      # @note 函数是普通对象，可传可存

      class Greeter:
          def hello(self):              # @note 方法的第一个参数是 self，显式传
              return "你好"
      g = Greeter()
      f = g.hello                       # @note! 取出来就绑定好了，直接 f() 可用
    baseline: |
      用 `def` 定义，外加 `lambda` 写单表达式。函数是普通对象，可以赋值、传参、返回。
      方法就是「第一个参数是 `self` 的普通函数」—— 绑定发生在**取属性的那一刻**，
      所以 `f = obj.method` 之后单独调用 `f()` 一切正常，不存在「this 丢了」这回事。
    vs:
      javascript: |
        JavaScript 的函数有三种写法，还分「有没有自己的 this」；Python 只有 `def`，
        而且没有隐式 this —— `self` 是明明白白写在参数表里的。
        代价是每个方法都要手写 `self`，好处是「方法取出来调用就崩」这类事故不存在。
      java: |
        Java 的方法必须写在类里，没有自由函数；Python 允许顶层 `def`，
        模块本身就是命名空间。两边都能把函数当值传，但 Java 要落到函数式接口上，
        Python 直接传函数对象。
    equivalence:
      javascript: divergent
      java: divergent

  parameters:
    code: |
      def f(a, b=10, *args, **kwargs):     # @note 位置 / 默认 / 变长 / 关键字
          pass

      f(1, b=2)                            # @note 关键字参数，顺序随便
      f(1, 2, c=3)                         # @note 多余的进 kwargs

      def g(x, *, flag=True): pass         # @note * 之后只能按关键字传
      g(1, flag=False)

      def bad(x=[]):                       # @note! 默认值在**定义时**求值一次
          x.append(1)
          return x
      bad(); bad()                         # @note! [1] 然后 [1, 1]
    baseline: |
      参数有四种：位置、带默认值、`*args` 收多余位置、`**kwargs` 收关键字。
      调用时可以用关键字传参，顺序随意。`*` 之后的参数只能用关键字传 ——
      这是给布尔开关之类准备的，避免调用点出现 `f(1, True, False)` 读不懂。
      **默认值只在定义时求值一次**，所以可变默认参数（`x=[]`）会被所有调用共享。
    vs:
      javascript: |
        JavaScript 没有关键字参数，也没有 `**kwargs`，参数一多只能传对象解构；
        Python 的调用点可以写 `f(name="Ada")`。默认值的求值时机反过来：
        JavaScript 每次调用重新求值（`= []` 很安全），Python 只求一次（是坑）。
      java: |
        Java 没有默认参数与关键字参数，缺省行为只能靠重载写多个方法；
        Python 一个签名就能表达「必填 / 可选 / 只按关键字 / 任意个」。
        代价是 Java 的调用错误在编译期就报，Python 要等到运行时。
    equivalence:
      javascript: divergent
      java: divergent

  variadic:
    code: |
      def sum_all(*nums):          # @note 收成**元组**
          return sum(nums)
      sum_all(1, 2, 3)             # @note 6

      def tagged(**kw):            # @note 收关键字参数成字典
          return kw
      tagged(a=1, b=2)             # @note {'a': 1, 'b': 2}

      xs = [1, 2, 3]
      sum_all(*xs)                 # @note 调用处展开
      tagged(**{"a": 1})           # @note 字典按关键字展开
    baseline: |
      两种变长：`*args` 收位置参数成**元组**，`**kwargs` 收关键字参数成**字典**。
      调用处同一个星号是相反的意思：把序列 / 字典展开成一串实参。
      所以「任意参数」与「任意关键字参数」在 Python 里是两件分开的事，
      各有各的运算符。
    vs:
      javascript: |
        JavaScript 只有 `...rest` 一种，收到的是数组，对应这里的 `*args`；
        关键字参数那半边（`**kwargs`）没有对应物 —— 只能改成传一个对象。
        展开语法两边都在调用处可用，但 Python 的 `**` 展开的是字典。
      java: |
        Java 只有 `T...` 一种可变参数，收到的是数组，没有关键字那一半。
        另外 Java 的变长参数只能放在参数表最后，Python 的 `*args` 后面还能接
        关键字专用参数（`def f(*args, flag)`）。
    equivalence:
      javascript: analogous
      java: analogous

  return-values:
    code: |
      def f():
          pass                  # @note 没有 return -> None
      f() is None               # @note True

      def multi():
          return 1, 2           # @note! 其实返回的是元组 (1, 2)
      x, y = multi()            # @note 解包接回来
      pair = multi()            # @note 也可以整个接住
    baseline: |
      不写 `return` 就返回 `None`。多返回值是**原生**的：`return a, b` 返回元组，
      调用方 `x, y = f()` 直接解包 —— 不需要先包一个容器再拆开，
      但要知道它本质上就是一个元组（整个接住也完全合法）。
    vs:
      javascript: |
        JavaScript 想返回多个值得先包成数组或对象，调用方再解构；
        Python 的 `return a, b` 就是元组，解包是一等写法。另外两边都有
        「忘了 return 就是空值」的静默行为，只是空值一个叫 None 一个叫 undefined。
      java: |
        Java 的方法签名里写死了返回类型（没有就写 `void`），漏掉 `return`
        编译不过；Python 静默返回 None。想返回多个值 Java 得先包成 record
        或数组，再让调用方逐个取 —— 不如元组解包直接。
    equivalence:
      javascript: analogous
      java: divergent

  closures:
    code: |
      def counter():
          n = 0
          def inc():
              nonlocal n        # @note! 要**改**外层变量必须显式声明
              n += 1
              return n
          return inc
      next_ = counter()
      next_(); next_()          # @note 1 2

      # @note 循环里造函数同样有 late binding 问题
      fns = [lambda: i for i in range(3)]
      [f() for f in fns]        # @note! [2, 2, 2]
      fns = [lambda i=i: i for i in range(3)]   # @note 默认参数把值固定下来
      [f() for f in fns]        # @note [0, 1, 2]
    baseline: |
      闭包能读到外层变量，但**写**外层变量必须显式 `nonlocal`（模块级用 `global`）——
      没有这个声明，赋值会新建一个局部名，这是「以为在改外层其实没改」的来源。
      循环里造函数有 late binding 问题：所有函数共享同一个变量名，
      惯用解法是拿默认参数把当前值固定下来。
    vs:
      javascript: |
        两边的闭包与 late binding 坑一模一样（循环里造出的函数都拿到末值）。
        差别在于**写外层变量**：JavaScript 直接改就行，Python 必须写 `nonlocal`
        或 `global`，否则静默地建了个局部名。
      java: |
        Java 的 lambda 只能捕获 effectively final 的局部变量 —— 变量被捕获后
        就不能再赋值。所以「闭包共享可变状态」在 Java 里写不出来，
        要共享状态得放进对象字段里。
    equivalence:
      javascript: analogous
      java: divergent
