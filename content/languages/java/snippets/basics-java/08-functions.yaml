  - featureId: basics-java/default-params
    equivalence: identical
    code: |
      static String greet(String name) { return greet(name, "你好"); }   // @note 短的转调长的
      static String greet(String name, String greeting) { return greeting + "，" + name; }
      // @note! 没有默认参数语法，只能靠重载；默认值只写一处

      record Options(boolean pretty, boolean strict) {      // @note 参数多时改用 record + wither
          static Options defaults() { return new Options(false, false); }
          Options withPretty() { return new Options(true, strict); }
      }

      // @note 重载的默认值落在每个调用点上，不存在"默认值只在定义时求值一次"的共享问题
