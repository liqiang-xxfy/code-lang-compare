# 模板：一门语言在 express 板块、bindings 存放组下的内容。
#
# 复制到 content/languages/<新语言>/express/bindings.yaml，再把占位说明换成真代码。
#
# 四条约定：
#   1. 路径即归属 —— 顶层不写 language / section / group，全部由路径派生
#      （语言取祖父目录、板块取父目录、**存放组**取文件名）
#   2. 文件名是**存放组**（group），不是展示章 —— 展示章由每个基准的
#      catalog/<板块>/<基准>.yaml 决定，且各基准可以不同；存放组与基准无关，
#      这正是「同一个知识点在不同基准下落在不同章，而内容只写一份」的实现方式
#   3. boxes 的 key 必须是 catalog/<板块>/features.yaml 里 `group:` 等于本文件名的
#      那批 feature id，拼错的 key 会被校验拦住（R21）
#   4. baseline 是「本语言作基准列」的说明；基准固定为三门，所以新语言一律是对比列语言，
#      **不必写 baseline**，但要写全三份 vs

# 文件级默认 review；某一格要单独标注时，在那一格里再写一个 review 覆盖它
review:
  state: draft
  provenance:
    origin: llm
    model: <模型名>
    promptTemplateId: <模板 id>
    generatedAt: '2026-01-01'

boxes:
  # ① 代码 + ② 注释（注释就是写在代码行内的 @note，不是字段）+ ③ 说明
  declaration:
    code: |
      // 本语言声明一个变量的写法
      // @note 与某个基准的关键差别，贴在这一行上
    vs:
      javascript: |
        与 JavaScript 需要 let / const 显式声明相比……
      python: |
        与 Python「赋值即声明」相比……
      java: |
        与 Java 必须写出变量类型相比……
    equivalence:            # 缺 key = identical；key 必须是三大基准之一
      javascript: analogous
      python: analogous
      java: divergent

  mutability:
    code: |
      // 重新赋值与常量的写法
    vs:
      javascript: |
        …
    equivalence:
      javascript: analogous

  scope:
    code: |
      // 一个名字在哪里可见
    vs:
      javascript: |
        …
    equivalence:
      javascript: divergent

  # 三槽全空是合法的，但必须 absent: true —— 否则与「忘了写」无法区分
  hoisting:
    absent: true
    vs:
      javascript: |
        本语言没有变量提升这一概念。

  shadowing:
    code: |
      // 内层同名的名字覆盖外层
    vs:
      javascript: |
        …
    equivalence:
      javascript: identical

  naming-convention:
    code: |
      // 名字怎么写；如果大小写会影响可见性，在这里说明
    vs:
      javascript: |
        …
    equivalence:
      javascript: divergent
