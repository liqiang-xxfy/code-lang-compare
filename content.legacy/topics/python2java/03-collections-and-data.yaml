id: python2java/03-collections-and-data
topicId: python2java
title: 3. 容器与数据建模
order: 3
summary: 从 Python 到 Java：容器从一个内置类型变成"接口 + 实现"，而切片与推导式都留在了原地

features:
  - id: python2java/collections-intro
    title: 本章要解决什么
    kind: concept
    summary: 每种容器都要选一个实现类
    body: |
      Python 的容器就是那几个内置类型：`list`、`dict`、`set`、`tuple`。
      Java 把它们拆成了**两层**：接口（`List` / `Map` / `Set`）与实现
      （`ArrayList` / `HashMap` / `HashSet` / `LinkedList` / `TreeMap`…）。

      这多出来的一个决定不是形式主义 —— **实现不同，性能与顺序保证就不同**：

      | 想要 | Java 选型 |
      | --- | --- |
      | 随机访问快 | `ArrayList` |
      | 头部插入删除多 | `LinkedList`（但随机访问慢） |
      | 有序（按插入） | `LinkedHashMap` |
      | 有序（按大小） | `TreeMap` |

      **迁移要点**：`new ArrayList<>()` 是绝大多数场景的正确答案，
      先照它写，只在真的有性能或顺序需求时才换实现。
      另外要记住 `Map` 的键靠 `equals` / `hashCode`
      —— 自定义类不重写这两个方法，当键就会"找不到"。

  - id: python2java/list-model
    title: 列表：切片没了，下标与越界都变了
    kind: behavior
    summary: List 没有切片语法，越界抛异常
    body: |
      `list` 对应 `List`，但 Python 那套表达力强的语法几乎都没了：

      | Python | Java |
      | --- | --- |
      | `xs[1:3]` | `xs.subList(1, 3)`（**注意是视图**） |
      | `xs[::-1]` | 没有，要 `Collections.reverse` |
      | `xs[::2]` | 没有，要自己循环 |
      | `xs[-1]` | `xs.get(xs.size() - 1)` |

      **切片要特别小心**：`subList` 返回的是原列表的**视图**，
      改它会写回原列表；想要拷贝必须 `new ArrayList<>(xs.subList(1, 3))`。
      这跟 Python 切片"总是新对象"的直觉正好相反。

      好消息是越界行为一致：`xs.get(99)` 抛 `IndexOutOfBoundsException`，
      和 `IndexError` 一样是当场炸而不是静默返回空值。

  - id: python2java/map-model
    title: 字典：缺失键从抛异常变成返回 null
    kind: behavior
    summary: get 缺省返回 null，取默认值要显式调用
    body: |
      `dict` 对应 `Map`，但**缺失键的行为反过来了**：

      ```python
      d["z"]                  # Python：KeyError
      d.get("z", 0)           # 0
      ```

      ```java
      map.get("z");              // Java：null —— 不抛
      map.getOrDefault("z", 0);  // 0
      map.containsKey("z");      // 单独判存在
      ```

      **迁移要点**：在 Python 里"缺失即抛"帮你挡住了大量假设错误，
      在 Java 里这些会变成一路传下去的 `null`。
      所以从 Python 迁过来的代码，凡是用方括号取值的地方，
      都要重新想一遍"键一定存在吗"。

      另一处差别是默认值：Python 的 `defaultdict` 会在**读取时写入**，
      Java 对应的 `computeIfAbsent` 同样会写入 —— 这个副作用两边一样，
      但它不叫 `get`，而 `get` / `getOrDefault` 都是纯读的。名字本身就是提示。

  - id: python2java/data-modeling
    title: 数据建模：字典还是类
    kind: behavior
    summary: Java 里"临时结构"的默认答案不是 Map
    body: |
      Python 里描述一条记录，随手用 `dict` 就行：

      ```python
      user = {"id": 1, "name": "Ada", "active": True}
      user["name"]
      ```

      Java 里这样写会很难受：`Map<String, Object>` 取出来是 `Object`，
      每次都要强转，而且**拼错的键编译期查不出来**。

      **迁移要点**：在 Java 里，字段固定的小结构应该用 `record`：

      ```java
      record User(int id, String name, boolean active) { }
      User u = new User(1, "Ada", true);
      u.name();                       // 编译期就有类型
      ```

      判据很简单：**这组字段是固定的吗？**
      固定就用 `record`（或用类），确实动态才用 `Map`。
      从"随手 dict"的环境过来时，第一反应往往是继续用 `Map` ——
      那会丢掉 Java 最值钱的东西：编译期检查。

  - id: python2java/collections-exercise
    title: 练习：把分组统计迁到 Java
    kind: exercise
    summary: 两处必须换写法，一处是类型选择
    body: |
      下面这段 Python 按部门把员工分组，并统计每个部门的人数。

      请把它迁到 Java，要求**行为完全一致**：

      1. 分组结果的"部门 → 成员列表"用什么容器承载
      2. "员工"这个结构用 `Map` 还是 `record`，说明你的理由
      3. 空输入时返回空结果而不是 `null`

      对照参考实现时，重点看两处：
      分组累加在 Java 里没有 `defaultdict` 的对应写法，
      以及 `record` 与 `Map` 的选择理由。
