# python —— express / containers
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: containers` 的那批。
# 这一组以 Python 为基准时展示在「序列与映射」章（见 catalog/express/python.yaml）——
# 与 JS 视角把字符串与容器合成一章不同，那是每基准分组自由度的直接体现。

review:
  state: draft

boxes:
  arrays:
    code: |
      xs = [1, 2, 3]            # @note list：可变序列，元素类型不限
      xs.append(4)              # @note 改原列表
      ys = [x * 2 for x in xs]  # @note 列表推导式 —— 常用得多
      sorted(xs)                # @note 返回新列表
      xs.sort()                 # @note! 原地排序，返回 None
      xs[1:3]                   # @note 切片，**返回副本**
      xs[10]                    # @note! IndexError —— 越界立刻报错
      xs[-1]                    # @note 负下标从尾部数
      a, *rest = xs             # @note 解包
    baseline: |
      list 是可变序列：长度可变、元素类型不限。三处特点：**推导式**是造列表的
      主要写法；**切片返回副本**（改切片不影响原列表）；**越界立刻 IndexError**，
      没有「留个空洞」这种事。排序分两种：`sorted()` 返回新列表、
      `list.sort()` 原地改并返回 `None`（写成 `xs = xs.sort()` 是经典事故）。
    vs:
      javascript: |
        JavaScript 的数组与 list 最接近，但三处必须换脑子：那边的 `sort` 默认按
        字符串排（数字要传比较函数），这边按值排；那边越界赋值会造出稀疏数组，
        这边直接 IndexError；那边没有推导式，`map` / `filter` 要链式调用。
      java: |
        Java 的数组定长，要用 ArrayList 才能增删；Python 的 list 一个类型全包。
        另一处是取值：Python 用切片与负下标，Java 只能 `get(i)` 并且越界抛
        IndexOutOfBoundsException —— 两边都抛，只是 Python 还多一个
        「负下标从尾部数」的便利。
    equivalence:
      javascript: analogous
      java: divergent

  maps:
    code: |
      d = {"a": 1}              # @note dict 字面量
      d["a"]                    # @note 1
      d["missing"]              # @note! KeyError
      d.get("missing")          # @note None —— 不抛错
      d.get("missing", 0)       # @note 给默认值
      "a" in d                  # @note 判键存在
      len(d)                    # @note 大小
      {k: v * 2 for k, v in d.items()}   # @note 字典推导式
      d.setdefault("b", []).append(1)    # @note 分组累加的惯用写法
    baseline: |
      dict 一种就够：键必须**可哈希**（列表不能当键、元组可以），
      **按插入顺序**遍历（3.7 起是语言保证），`len()` 取大小。
      取值有两种写法要分清：`d[k]` 缺键抛 KeyError，`d.get(k)` 给 None、
      `d.get(k, 默认)` 给默认值。判键存在用 `in`，遍历用 `.items()`。
    vs:
      javascript: |
        JavaScript 把这件事拆成了普通对象与 `Map` 两样，Python 只有 dict 一样 ——
        它同时覆盖了「字面量写起来方便」与「键什么类型都行」。
        取值上 Python 的 `d[k]` 缺键抛错、`.get` 不抛，正好对应 JavaScript 里
        `obj[k]` 给 undefined 与 `Map.get` 给 undefined 两种行为。
      java: |
        Java 的 `get` 缺键返回 `null`，Python 的 `d[k]` 抛 KeyError ——
        一个静默一个响亮。Java 要选 `HashMap` / `LinkedHashMap` / `TreeMap`
        决定顺序，Python 的 dict 固定按插入序，不用选。
    equivalence:
      javascript: divergent
      java: analogous
