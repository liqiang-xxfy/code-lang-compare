snippets:
  - featureId: concepts-javascript/class-inheritance
    equivalence: identical
    code: |
      class Base { #secret = 1; }        // # 是真正的语言级私有
      class Sub extends Base {}          // 只能单继承，super 沿原型链向上
    body: |
      JS 的 `class` 是原型链的语法糖：单继承，`super` 沿原型向上找，
      私有字段用 `#name`（真正的语言级私有）。`this` 由调用方式决定，
      方法被单独取出或作为回调传入时会丢。

  - featureId: concepts-javascript/interface
    equivalence: identical
    code: |
      // 语言层面没有 interface —— 只要求「有这个方法」即可
      function render(x) { return x.toText(); }   // 传什么进来都行，跑起来才知道
    body: |
      JS 在语言层面**没有接口**这一概念 —— 一个对象能不能当作某物使用，
      完全看它有没有对应的方法（鸭子类型），`interface` 只是 TypeScript
      的编译期概念，运行时不留下任何痕迹。

      「这个参数应该实现哪些方法」在这里只能写进注释、文档或 TS 类型，
      运行时没有任何机制拦住一个不满足协议的对象 —— 直到某个方法被调用时
      才发现它不存在。

  - featureId: concepts-javascript/generics
    equivalence: identical
    code: |
      function first(list) { return list[0]; }    // 没有类型参数
      // 想在编译期约束只能靠 TS：function first<T>(list: T[]): T
    body: |
      JS 本身没有泛型 —— 想要类型参数只能靠 TypeScript 的编译期标注，
      而**标注在运行时不存在**，别指望用它做运行时判断。
      真要用，是「标注了就在编译期强约束」那一路。

  - featureId: concepts-javascript/error-handling
    equivalence: identical
    code: |
      throw "出错了";                    // 可以抛任意值
      try { risky(); } catch (e) {
        e.message                        // undefined —— 因为 e 不一定是 Error
      }
    body: |
      JS 可以 `throw` 任意值 —— 字符串、对象、数字都行，所以 `catch` 到的东西
      **不一定是 `Error`**，取 `e.message` 可能得到 `undefined`。

      也没有受检异常：任何函数都可能抛，签名上看不出来，错误处理只能靠纪律与文档。
