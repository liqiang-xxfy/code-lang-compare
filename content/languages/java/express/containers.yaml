# java —— express / containers
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: containers` 的那批。

review:
  state: draft

boxes:
  arrays:
    code: |
      int[] xs = {1, 2, 3};               // @note 数组：**长度固定**
      xs.length;                          // @note 是属性，不是方法
      xs[10];                             // @note! ArrayIndexOutOfBoundsException

      List<Integer> list = new ArrayList<>();   // @note 要动态增删就换集合
      list.add(4);
      list.get(0);
      list.size();                        // @note 集合是 size()，数组是 length

      List<Integer> fixed = Arrays.asList(1, 2, 3);   // @note! 定长视图，不能 add
      List<Integer> immutable = List.of(1, 2, 3);     // @note 真不可变
      int[] copy = Arrays.copyOf(xs, xs.length);      // @note 复制要显式调
    baseline: |
      **数组长度固定**（`new int[3]` 就一直是 3），要增删得换成 `ArrayList`
      这类集合 —— 这是它与别的语言最不一样的地方。长度：数组是属性 `length`、
      集合是方法 `size()`。取值不能切片，只能 `get(i)`，越界抛异常。
      集合还分可变（`new ArrayList<>()`）、定长视图（`Arrays.asList`）、
      真不可变（`List.of`）三种，用之前要先确认拿到的是哪一种。
    vs:
      javascript: |
        JavaScript 的数组一个 `[]` 就同时是「数组」与「可变列表」；
        Java 把它们分成定长数组与集合两条线，还要在可变 / 定长 / 不可变之间选。
        取值也少了切片与负下标，只有 `get(i)`。
      python: |
        Python 的 list 是长度可变的，Java 的数组不是 —— 从这边过去最需要改的习惯
        就是「先想清楚要不要增删，要就一开始用集合」。另一处是可变性：
        Java 的集合分成可变 / 定长 / 不可变三种，Python 只有 list 与 tuple 这一对。
    equivalence:
      javascript: divergent
      python: divergent

  maps:
    code: |
      Map<String, Integer> m = new HashMap<>();      // @note 无序
      Map<String, Integer> ordered = new LinkedHashMap<>();   // @note 按插入序
      Map<String, Integer> sorted = new TreeMap<>();          // @note 按键排序

      m.put("a", 1);
      m.get("missing");                     // @note null —— 不抛错
      m.getOrDefault("missing", 0);         // @note 给默认值
      m.containsKey("a");
      m.size();

      // @note 分组累加的惯用写法：省掉「先判空再放进一个空集合」
      m.computeIfAbsent("b", k -> new ArrayList<>()).add(1);

      for (var e : m.entrySet()) { }        // @note 遍历键值
      Map<String, Integer> ro = Map.of("a", 1);   // @note 不可变
    baseline: |
      映射是「一个接口多个实现」：`HashMap` 无序、`LinkedHashMap` 按插入序、
      `TreeMap` 按键排序 —— 用哪个要自己选。`get` 缺键返回 `null`
      （**不抛错**），所以要么 `getOrDefault`、要么 `containsKey` 先判。
      `computeIfAbsent` 是分组累加的惯用写法。另外 `Map.of(...)` 造出来的是
      不可变映射，塞东西会抛。
    vs:
      javascript: |
        JavaScript 的 `Map` 天生按插入序，Java 要专门选 `LinkedHashMap` 才有；
        取值两边都给空值而不抛错。差别在成本：这里「选哪个实现」是一道必答题，
        JavaScript 侧只有 `Map` 一个答案。
      python: |
        Python 的 dict 固定按插入序、键必须可哈希，Java 要在三种实现里挑顺序
        语义、且不强制键的哈希性（写错了要到运行时才发现）。
        Java 多一个 `computeIfAbsent` 这样的便利方法，Python 侧对应的是
        `setdefault`。
    equivalence:
      javascript: analogous
      python: analogous
