# M7 学习路线图 —— 按「JS → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）

- id: py-1-anchor
  lang: python
  order: 1
  title: 先建立心智模型，不要背语法
  durationHint: 2-3 小时
  todo:
    - 通读本工具 M4「心智模型对照表」，把 npm/pip、Promise/asyncio 这类映射建起来
    - 只回答四个问题：类型系统、并发模型、错误处理、值语义 vs 引用语义
    - 明确写下「哪些 JS 直觉必须丢掉」——块级作用域、隐式类型转换、对象字面量
  acceptance:
    - 能说出 Python 与 JS 在「作用域」和「相等比较」上的两条根本差异
    - 知道 Python 没有变量提升、没有可选链语法、没有常量语法
  resources:
    - label: Python 官方教程（中文）
      url: https://docs.python.org/zh-cn/3/tutorial/
    - label: Python for JS developers
      url: https://github.com/frankstepanski/python-for-js-developers

- id: py-2-basics
  lang: python
  order: 2
  title: 基础语法逐条对照
  durationHint: 1-2 天
  todo:
    - 按本工具 M1 的 8 个章节逐格对比，重点看标为「语义不同」的格子
    - 每看一格，手写一遍两边的代码（不要复制）——建立肌肉记忆
    - 把踩到的坑记进 M4 踩坑清单并打上自己的严重度
  acceptance:
    - 能独立写出变量、集合、控制流、函数定义，无语法错误
    - 能解释 `is` 与 `==` 的区别，并知道什么时候必须用 `is None`
  resources:
    - label: PEP 8 风格指南
      url: https://peps.python.org/pep-0008/

- id: py-3-practice
  lang: python
  order: 3
  title: 动手写（占全部时间的 70%）
  durationHint: 1-2 周
  todo:
    - 做 Exercism 的 Python track，接受 mentor 评审
    - 把写过的一个小 JS 脚本（100-300 行）用 Python 重写一遍
    - 重写时不要查 JS 原文件——凭记忆写，写完再对照
  acceptance:
    - Exercism 完成 15 题以上
    - 能独立完成一个 100 行以上的命令行工具，不依赖翻译式写法
  resources:
    - label: Exercism Python Track
      url: https://exercism.org/tracks/python
    - label: TheAlgorithms Python
      url: https://github.com/TheAlgorithms/Python

- id: py-4-deep
  lang: python
  order: 4
  title: 补齐语义层（并发与内存）
  durationHint: 3-5 天
  todo:
    - 真正理解 GIL：为什么多线程不能加速 CPU 密集任务
    - 对比 JS 的事件循环与 asyncio 的事件循环（谁在驱动、怎么进入）
    - 理解引用计数 + 循环 GC，以及 del 不等于释放
    - 理解可变默认参数为什么是坑
  acceptance:
    - 能解释为什么 Python 要用 multiprocessing 而不是 threading 做 CPU 密集任务
    - 能写出正确的 asyncio 并发代码，并知道 asyncio.gather 与 Promise.all 的差别
  resources:
    - label: asyncio 官方文档
      url: https://docs.python.org/3/library/asyncio.html
    - label: Fluent Python（深入理解语言语义）
      url: https://www.oreilly.com/library/view/fluent-python-2nd/9781492056348/

- id: py-5-ecosystem
  lang: python
  order: 5
  title: 工程化与生态收口
  durationHint: 3-5 天
  todo:
    - 用 venv + pyproject.toml 管理一个真实项目，替代 node_modules 的直觉
    - 配置 Ruff（= ESLint + Prettier 的合体），理解为什么 Python 工具链更"独裁"
    - 用 pytest 写测试，注意 assert 与 expect 的区别
    - 用 mypy 加类型标注，理解「gradual typing」的边界
  acceptance:
    - 能独立搭起一个带依赖管理、lint、测试、类型检查的 Python 工程
    - 能说清 pyproject.toml / venv / pip / uv 各自解决什么问题
  resources:
    - label: pytest 官方文档
      url: https://docs.pytest.org/
    - label: Ruff
      url: https://docs.astral.sh/ruff/
