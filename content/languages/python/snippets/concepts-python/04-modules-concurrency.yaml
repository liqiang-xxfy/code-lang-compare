snippets:
  - featureId: concepts-python/module-system
    equivalence: identical
    code: |
      import util                  # import 会真的执行：模块顶层代码此刻跑一遍
      from util import helper      # 没有显式导出 —— 所有顶层名字都可被导入
    body: |
      Python 的 `import` 是一句**会在那一刻真的执行**的语句：被导入模块的顶层代码立刻
      跑一遍，之后缓存在 `sys.modules`（默认只跑一次）。一个 `.py` 是 module、
      含 `__init__.py` 的目录是 package，而且**没有显式导出这回事 ——
      所有顶层名字都可被导入**（`_` 开头是约定私有）。

  - featureId: concepts-python/memory
    equivalence: identical
    code: |
      x = [1, 2, 3]
      del x                        # 只是减一次引用，别人还引用着就还在
      with open("f") as f:         # with 写出确定性的释放
          pass
    body: |
      Python 是**引用计数 + 循环 GC**：对象引用数归零立刻释放，循环引用靠周期性 GC 兜底。
      所以 `del x` 只是**减一次引用**，对象不一定立刻消失（还有别人引用着就还在）；
      好处是可以用 `with` 写出**确定性的释放**（文件、锁、连接）。

  - featureId: concepts-python/concurrency-unit
    equivalence: identical
    code: |
      import threading, multiprocessing
      # GIL：多线程无法并行跑 CPU 密集任务
      # CPU 密集要真并行，只能用多进程
    body: |
      Python 三种并发单元都有 —— 线程、进程、协程，但 **GIL** 让多线程无法并行执行
      CPU 密集任务，所以「想快就用多线程」只在 I/O 密集场景成立，CPU 密集必须用
      `multiprocessing`。共享状态要自己加锁，可见性、死锁都是要自己扛的事。

  - featureId: concepts-python/async-model
    equivalence: identical
    code: |
      import asyncio
      async def load():
          return 1
      load()                       # 返回协程对象，一行都不执行
      asyncio.run(load())          # 必须显式启动事件循环
    body: |
      Python 的 `asyncio` 需要一个**显式启动的事件循环**：协程函数调用后返回的是协程对象，
      不 `await`、不用 `asyncio.run()` / `create_task()` 驱动，它就**一行都不会执行**，
      而且通常**不报错**（只有一条 RuntimeWarning）。

      事件循环本身也是单线程的：在协程里调用同步阻塞函数（`time.sleep`、同步 HTTP 库），
      整个循环就被卡住。
