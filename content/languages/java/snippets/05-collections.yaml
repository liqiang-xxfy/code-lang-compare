- featureId: basics/array-slice
  equivalence: divergent
  code: |
    List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4, 5));

    list.subList(1, 3);                    // [2, 3] —— @note 左闭右开

    // @note! subList 返回的是**视图**不是拷贝：原 list 一改它就跟着变，
    //        而且会抛 ConcurrentModificationException
    new ArrayList<>(list.subList(1, 3));   // 想真拷贝要这样包一层

    int[] arr = {1, 2, 3};
    int[] copy = Arrays.copyOfRange(arr, 1, 3);

    // @note! Java 没有切片语法；subList 的「视图」语义与 JS 的 slice（新数组）不同
  review:
