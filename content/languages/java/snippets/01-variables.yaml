- featureId: basics/hoisting
  equivalence: absent
  body: |
    Java **没有变量提升**。局部变量在读取前必须「明确赋值」，否则是编译错误；
    类的字段则是例外 —— 会被自动初始化为默认值（`int` → 0，对象 → `null`）。

    与 JS 的差别不在「有没有提升」，而在**什么时候发现**：
    JS 会在运行时给出 `undefined`（`var`）或抛错（`let` 的 TDZ），Java 则在编译期直接拦住。
  code: |
    // Java 没有变量提升：名字在读取前必须已经「明确赋值」，否则编译不过
    int v;
    System.out.println(v);   // @note! 编译错误：variable v might not have been initialized
    v = 1;

    // @note 但类的字段是例外：会被自动初始化为默认值（int→0 / 对象→null）
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/const-immutability
  equivalence: divergent
  code: |
    final User user = new User("Ada");

    user.name = "Grace";        // @note! 允许：final 冻结的是「引用」，不是对象内容
    // user = new User("X");    // 编译错误：cannot assign a value to final variable

    // @note 想让内容真正不可变：字段全 final + 不给 setter，或直接用 record
    record Point(int x, int y) {}
    // p.x = 3;                 // 编译错误：record 的组件是 final 的

    // @note! 与 JS 的关键差异：JS 的 const 只管绑定，改内容要 Object.freeze；
    //        Java 没有「部分可变」的中间态 —— record 一点都改不了，普通类全都能改
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/naming-convention
  equivalence: identical
  code: |
    String userName = "Ada";         // 变量 / 方法：camelCase —— 与 JS 完全一致
    class UserProfile {}             // 类：PascalCase —— 一致
    static final int MAX_RETRY = 3;  // 常量：SCREAMING_SNAKE_CASE —— 一致
    package com.example.app;         // @note 包名全小写，这是 JS 没有的层级

    // @note 从 JS 过来几乎不需要改命名习惯；真正要改的是从 Python 过来的人（那边是 snake_case）
