# javascript —— basics/03-operators 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/equality
    equivalence: identical
    code: |
      1 == "1";        // true    —— @note! 会做隐式类型转换
      1 === "1";       // false   —— 工程规范：一律用 ===

      "" == 0;         // true    —— @note! 空字符串等于 0
      null == undefined; // true
      NaN === NaN;     // false   —— @note! 唯一的自反不等，用 Number.isNaN()

      Object.is(NaN, NaN); // true
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      这是全站**最高频的迁移陷阱**。
      JS 的 `==` 会做隐式类型转换（`1 == "1"` 为 `true`、`"" == 0` 为 `true`），所以工程规范一律要求用 `===`。
      Python 的 `==` **不做**隐式转换，`1 == "1"` 直接是 `False`。
      结论：把 JS 的 `==` 写成 Python 的 `==` 不会出错，但**把 JS 的 `===` 直译成 `is` 会出错**——`is` 判的是对象身份。
  - featureId: basics-javascript/arithmetic
    equivalence: identical
    code: |
      7 / 2;                // 3.5  —— @note 整数相除也是浮点
      7 % 2;                // 1
      -7 % 2;               // -1   —— @note! 结果符号跟被除数走

      Math.trunc(7 / 2);    // 3    —— 取整要显式调用
      Math.floor(-7 / 2);   // -4   —— @note 注意与截断的区别
      2 ** 10;              // 1024
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `/` 在两边都返回浮点，一致。差异在整除与取模：
      Python 有专门的 `//`，而 JS 只能 `Math.trunc()`；
      更隐蔽的是**负数取模**：`-7 % 2` 在 JS 是 `-1`（符号跟被除数），在 Python 是 `1`（符号跟除数）。
      这个差异会静默产生错误结果，不会报错。
  - featureId: basics-javascript/logical-short-circuit
    equivalence: identical
    code: |
      // && 与 || 返回的是操作数本身，不是布尔值
      const a = "" || "default";     // "default"
      const b = "x" && "y";          // "y"

      // ?? 只在左值为 null / undefined 时兜底（0 和 "" 会保留）
      const c = null ?? "fallback";  // "fallback"
      const d = 0 ?? "fallback";     // 0 —— @note! 这正是 ?? 与 || 的关键差别

      obj?.method?.()                 // @note 可选链可安全调用
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      两边的 `&&` / `and`、`||` / `or` 都返回**操作数本身**，这一点一致，是很好迁移的部分。
      差异在空值合并：JS 有 `??`（只对 `null` / `undefined` 兜底），Python 没有对应运算符，
      必须显式写条件表达式或 `if x is None`。
  - featureId: basics-javascript/truthiness
    equivalence: identical
    code: |
      // 假值只有 8 个：false, 0, -0, 0n, "", null, undefined, NaN
      Boolean("");     // false
      Boolean("0");    // true  —— @note 非空字符串恒为真

      Boolean([]);     // true  —— @note! 空数组是真值
      Boolean({});     // true  —— @note! 空对象也是真值
      Boolean(new Map()); // true
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      第二个高频陷阱，而且**方向与直觉相反**：
      JS 的假值只有 8 个（`false`、`0`、`-0`、`0n`、`""`、`null`、`undefined`、`NaN`），
      空数组 `[]`、空对象 `{}` 都是**真值**；
      而 Python 的 `[]`、`{}`、`()`、`set()`、`""` 全是**假值**。
      所以 JS 里可靠的 `if (arr)` 判「非空」，在 Python 里变成 `if arr` 判「非空」——看似一样，但 JS 的写法本身是错的。
  - featureId: basics-javascript/optional-chaining
    equivalence: identical
    code: |
      const city = user?.address?.city;    // @note 链路中任一环为 null / undefined → 整体 undefined
      const n = obj?.method?.();           // @note 也可安全调用方法
      const [first] = list ?? [];          // 解构时配合 ?? 兜底

      // 注意：?. 只短路「取值」，不吞掉异常。
      // 若 user.address 存在但 city 的 getter 抛错，仍然会抛。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `?.` 是语言级安全导航；Python **没有这个语法**，惯用做法是 `getattr(..., None)` 逐层兜底，
      字典链式取值更常用 `(obj or {}).get(k)`。
      迁移到 Python 时最常见的错误是继续写 `obj?.key`——它在 Python 里不是「返回 None」，而是语法错误。
  - featureId: basics-javascript/bitwise
    equivalence: identical
    code: |
      5 & 3;           // 1
      5 | 3;           // 7
      5 ^ 3;           // 6
      ~5;              // -6   —— @note 按位取反（补码），不是「逻辑非」
      1 << 3;          // 8
      1 << 31;         // -2147483648   —— @note! 溢出到符号位
      -1 >>> 0;        // 4294967295    —— @note 无符号右移：把结果当无符号 32 位整数

      // @note! 所有位运算都先把操作数转成「32 位有符号整数」再算，
      //        位宽外的部分直接丢——所以大数做位运算会静默出错
      (2 ** 31) | 0;   // -2147483648

      // @note 常用技巧：`n | 0` 取整（有范围限制）、`n & 1` 判奇偶
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      运算符本身完全一致：`&` `|` `^` `~` `<<` `>>`。
      差异在数值语义：JS 的位运算会**先把操作数转成 32 位有符号整数**，超出范围会被截断
      （所以 `2 ** 31 | 0` 会变成负数），而 Python 的整数是任意精度，`<<` 多少位都不会溢出。
      另外 Python 没有 `>>>`（无符号右移），因为它的整数不是定长的——需要时得自己用掩码实现。
  - featureId: basics-javascript/comparison-operators
    equivalence: identical
    code: |
      '2' < 10;        // true   —— @note! 字符串被隐式转成数字
      '2' < '10';      // false  —— @note! 两边都是字符串时按 UTF-16 码元逐位比较，不是数值比较
      'a' < 'B';       // false  —— @note! 小写字母的码元大于大写
      [1] < [2];       // true   —— @note 数组先转成字符串再比，'1' < '2'

      null < 1;        // false  —— null 转成 0？不，这里走的是另一套规则，结果反直觉
      undefined < 1;   // false

      // @note! 跨类型比较先转数字：'2' < 10 为 true，但 '10' < '9' 也为 true（字符串间按字典序）
      // @note JS 里这类隐式转换不会报错，只会给出错误答案
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      数值比较两边一致。差异在另外两处：
      ① **字符串比较**：JS 按 UTF-16 码元逐位比较（所以 `'a' < 'B'` 是 false），
         Python 按 Unicode 码点比较（行为类似，但对非 ASCII 的处理更符合直觉）；
      ② **跨类型比较**：JS 的 `<` 会做隐式转换（`'2' < 10` 为 true），
         Python 3 直接抛 `TypeError: '<' not supported between instances of 'str' and 'int'`。
      第二条是好事：迁移后这类隐蔽 bug 会立刻暴露。
  - featureId: basics-javascript/increment-decrement
    equivalence: identical
    code: |
      let i = 0;

      i++;             // 返回旧值 0，然后 i 变成 1（后缀）
      ++i;             // i 先变成 2，返回新值 2（前缀）
      i--;             // 后缀减
      --i;             // 前缀减

      i += 1;          // 与 ++i 效果相同，但返回的是新值（它是赋值表达式）
      i -= 1;

      const arr = [1, 2];
      let k = 0;
      arr[k++];        // 1 —— @note! 「取值并前进」，一行做两件事

      // @note! i++ 返回旧值、++i 返回新值，写在一行里混用极易出差一错误；
      //        风格指南通常直接建议只用 += 1
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 有 `i++` / `++i`（前缀后缀还影响表达式值），Python **完全没有**，
      只能写 `i += 1`。
      这不是小事：`for` 循环、`arr[i++]` 这类写法需要整体重写。
      顺带一提，把 `i++` 直译成 `i += 1` 时要注意 Python 里没有表达式求值副作用，
      所以 `arr[i++]` 这种「取值并前进」的写法在 Python 里必须拆成两行。
  - featureId: basics-javascript/chained-comparison
    equivalence: identical
    code: |
      const x = 5;

      0 < x < 10;             // @note! 结果是 true，但原因不是「x 在区间内」
      // 实际执行顺序：(0 < x) => true，然后 true < 10 => 1 < 10 => true
      // 换成 x = -5 再看看：
      const y = -5;
      0 < y < 10;             // 仍然是 true ！因为 (0 < -5) => false => 0 < 10 => true

      x > 0 && x < 10;        // 正解：必须用逻辑与拆开

      // @note! 这个表达式不报错、结果恒为 true，是「看起来对、实际全错」的典型
      // @note! JS 没有链式比较：0 < x < 10 先算出布尔值再和 10 比，恒为 true
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      Python 支持 `0 < x < 10` 这种链式比较，且语义是**数学上的区间**（等价于 `0 < x and x < 10`，
      中间的操作数只求值一次）。
      JS 里写 `0 < x < 10` **不会报错**，但它是 `(0 < x) < 10`——
      布尔值参与数值比较（`true < 10` 为 true），所以表达式恒为 true。
      这是极少数「看起来一样、结果完全不同、且不报错」的组合，属于必踩清单。
