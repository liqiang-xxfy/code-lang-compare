# dart —— express / values
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: values` 的那批：
# literals / type-inference / null-and-undefined / type-conversion。
#
# 口径说明：对 JavaScript 读者最要紧的一条是 **`/` 永远返回小数、整除要写 `~/`** ——
# 这与 JavaScript 恰好相反。对 Java 读者最要紧的是 **Dart 没有隐式数值转换**、
# **`int` 是 64 位**，以及**空安全是健全的**（`String` 里塞不进 null，
# 不需要靠注解或 Optional 补）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-values-v1
    generatedAt: '2026-10-03'

boxes:
  literals:
    code: |
      var i = 1                     // @note int：64 位整数
      var d = 1.0                   // @note double；1 与 1.0 是**两个不同的值**
      var big = 1e3                 // @note double 1000.0
      var hex = 0xFF                // @note 十六进制；Dart 没有二进制的数值字面量
      var sep = 1_000_000           // @note 下划线只是为了好读

      var c = 'a'                   // @note! 没有字符类型：单引号就是字符串
      var s = "abc"                 // @note 单双引号完全等价
      var raw = r'C:\Users'         // @note r 前缀：原样字符串，反斜杠不转义
      var multi = '''
      第一行
      第二行
      '''                           // @note 三引号：跨行

      var list = [1, 2];            // @note 列表字面量
      var map = {'a': 1};           // @note 映射字面量
      var set = {1, 2};             // @note 花括号没有冒号就是集合

      var empty = {};               // @note! 空花括号是**映射**不是集合，要写 <int>{}
      var list2 = [...list, 3];     // @note 展开：把一个可迭代对象摊进字面量
      var maybe = null;
      var safe = [...?maybe];       // @note 空感知展开：源为 null 时什么都不插

      // @note int 与 double 都是 num 的子类型，num 是它们的公共父类
    vs:
      javascript: |
        数字上两边差别很实在：JavaScript 只有一种数字类型，
        `1` 与 `1.0` 连类型都一样；Dart 把它们分成 `int` 与 `double`
        两个类型（`1 == 1.0` 仍为真，但 `identical` 为假，类型也确实是两个）。
        集合字面量上 Dart 多一种：`{}` 没有冒号就是集合，
        而 JavaScript 的 `{}` 永远是对象 —— 这一处最容易看错，
        而且**空的 `{}` 是映射不是集合**，这条几乎人人都会踩一次。
        展开写法两边语法相同（`...`），但 Dart 多一个空感知版本 `...?`，
        JavaScript 得自己写 `...(x ?? [])`。
        另外 Dart 有原样字符串前缀 `r`，JavaScript 只能靠反斜杠双写。
      python: |
        两边的字面量都很丰富。差别在两处：
        一是**单双引号**，Python 里两者等价、Dart 里也等价，
        但 Dart 没有字符类型，`'a'` 就是字符串，不存在 Python 那种
        「单字符」与「字符串」的区分（Python 那边其实也没区分，这里两边一致）。
        二是数字类型：Python 的 `int` 是任意精度，Dart 的 `int` 是 64 位定宽，
        超出会回绕；Python 的除法永远给浮点，Dart 的 `/` 也给浮点，
        这一点两边相同，但 Dart 另有 `~/` 做整除，Python 是 `//`。
      java: |
        数值字面量的形态接近（`0x`、下划线分隔、科学计数法），
        `int` / `double` 之名也都在。差别在**类型关系**：
        Java 的基本类型不是对象、各自独立，Dart 的 `int` 与 `double`
        都是类、且共享父类 `num` —— 所以能写出「收 `num` 的函数」，
        Java 里要收两种数字只能靠重载或装箱成 `Number`。
        另一处是 Dart 没有 `long` / `short` / `byte` 这一串宽度，
        整数只有 64 位一档，没有 `long` / `short` / `byte` 那一串分层。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  type-inference:
    code: |
      var x = 1                     // @note 推断为 int，之后不能换类型
      final name = "Ada"            // @note final 也推断
      const max = 3                 // @note const 同样推断出来

      var items = [1, 2];           // @note List<int>
      var mixed = [1, "a"];         // @note! List<Object>：共同父类兜底
      var empty = [];               // @note! List<dynamic>：空字面量推不出元素类型

      dynamic d = 1;                // @note! dynamic：关掉检查，任何操作推迟到运行期
      d.foo();                      // @note 编译通过，运行时才炸

      void f(List<int> xs) { }      // @note 参数类型不能省
      int g() => 1;                 // @note 返回值在箭头函数里可以省（官方风格建议写上）
    vs:
      javascript: |
        两边的 `var` 看起来一样，实质完全不同：JavaScript 的 `var`
        只表示「这是个变量」，里面装什么下次再说；Dart 的 `var`
        是**推断出一个确定的类型**，之后换类型编译不过。
        另外 Dart 有专门关掉检查的写法（`dynamic`），
        在 JavaScript 里那是默认状态 —— 所以 Dart 里看到 `dynamic`
        就该警觉：这是作者主动放弃了这一处的类型保护。
      python: |
        两边都能从初值推断。差别在**推断之后还算不算数**：
        Python 的推断只对类型检查器有意义，运行时不管，
        所以 `x = 1` 之后 `x = "文本"` 完全合法；
        Dart 的推断是编译器的结论，换类型直接编译不过。
        另一处是空字面量：Dart 的 `var empty = []` 会被推成
        `List<dynamic>`（因为推不出元素类型），Python 里没有这个问题，
        空列表就是空列表 —— 但代价是 Python 也不知道里面会装什么。
      java: |
        Java 的 `var` 只能用在局部变量上，字段、参数、返回值一律要写类型；
        Dart 的 `var` 在局部、字段、顶层都能用，`final` / `const` 也能推断。
        两边推断的原理一样（看初始化表达式）。差别在**有没有逃生口**：
        Java 想放弃类型检查只能退回 `Object` 再强转，
        Dart 有 `dynamic` 这个明确的「不要检查」标记，
        而且它是一等类型 —— 好处是看到它就知道这里是有意放松的。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  null-and-undefined:
    code: |
      // @note Dart 只有 null，没有第二个「空值」
      // @note! 而且 null 本身也是**一个对象**（Null 类的唯一实例）——
      // @note! 不是「没有类型」，只是上面没有你能用的成员
      int? maybe = null             // @note 「可能为空」写进类型：? 是类型的一部分

      // int nope = null;           // @note! 编译错误：int 不接受 null
      int? a;
      // print(a + 1);              // @note! 编译错误：可能为 null
      print(a?.isEven)              // @note 安全取值：为 null 时整个表达式是 null
      print(a ?? 0)                 // @note 默认值
      print(a! + 1)                 // @note! 非空断言：为 null 直接抛

      late int later;               // @note 「我保证用之前会赋值」，忘了就在使用处抛

      var m = {'a': 1};
      var v = m['missing'];         // @note 取不到的键给 null（返回类型是 int?）

      // @note 空安全是**健全的**：所有可能为 null 的地方都必须写出来，
      // @note 编译器能证明「这里一定不为 null」，不需要运行期兜底
    vs:
      javascript: |
        JavaScript 有 `null` 与 `undefined` 两个空值，几乎所有位置
        都同时接受两者，判断时得写 `x == null` 才能一并盖住；
        Dart 只有一个 `null`，并且要求类型里写明可空 ——
        所以「这里可能是空的」是从签名读得出来的事实。
        另一处是 `undefined` 承担的「变量还没赋值」这个状态：
        Dart 用 `late` 显式表达，读一个还没赋值的 `late` 变量会抛错，
        而不是静静地给出 `undefined`。
      python: |
        两边的空值都只有一个（`None` ↔ `null`），这一点相同。
        差别在类型系统管不管：Python 的 `None` 能赋给任何变量，
        忘了判就等 `AttributeError`；Dart 把可空性编码进类型，
        不处理就编译不过。另一处是「字典取不到的键」：
        Python 抛 `KeyError`，Dart 给 `null`（返回类型带 `?`）——
        所以 Python 里那个 `try/except` 在 Dart 里默认是一次判空。
      java: |
        Java 的 `null` 能赋给任何引用类型，编译器不管，解引用就是 NPE；
        Dart 在类型上区分 `int` 与 `int?`，不判空直接编译不过 ——
        Java 那边要靠 `@Nullable` 注解加静态分析工具才能接近，
        而且是可选的、覆盖不全；Dart 这边是语言的一部分，默认开启。
        「还没有值」这件事两边也都有专用机制：Java 靠 `Optional`
        （只是个容器，得显式取值），Dart 靠 `late`（是一个修饰符，
        用起来与普通变量没差别，只在忘了赋值时抛错）。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  type-conversion:
    code: |
      var i = 1;
      var d = i.toDouble();         // @note! 必须显式调用：Dart 没有隐式数值转换
      // double bad = i;            // @note! 编译错误

      double lit = 1;               // @note! 唯一的例外：**字面量**会自动当 double（等于 1.0）
      // double lit2 = i;           // @note! 换成变量就不行了 —— 例外只给字面量

      var n = 3.9;
      var t = n.toInt();            // @note 3：截断，不是四舍五入
      var r = n.round();            // @note 4：要四舍五入得说清楚

      var q = 7 ~/ 2;               // @note 3：整除是专门的运算符
      var f = 7 / 2;                // @note! 3.5 —— 除号永远给小数

      int.parse("42")               // @note 42；解析不了抛 FormatException
      int.tryParse("x")             // @note null —— 处理用户输入用这个
      double.parse("1.5")
      (3.7).toStringAsFixed(2)      // @note "3.70"：控制小数位

      var o = "42" as Object;
      var s = o as String;          // @note 类型断言；不符抛 TypeError
      o is String                   // @note 判断，配合类型提升用
    vs:
      javascript: |
        **除号是两边最容易搞反的一处**：JavaScript 的 `/` 给小数
        （这一点与 Dart 相同），但 JavaScript 的数字本来就只有一种，
        谈不上「整除」；Dart 有 `int` 与 `double` 两个类型，
        `/` 永远给 `double`，要整除必须写 `~/` ——
        写惯了 JavaScript 的人几乎必然会在第一次写出 `7 / 2` 然后拿到 3.5。
        另一处是解析：JavaScript 用 `parseInt` / `Number`，
        解析失败给 `NaN` 这种哨兵值，程序接着跑；
        Dart 的 `parse` 抛异常，`tryParse` 给 null，两条路都明确。
      python: |
        两边都要显式转换，但**除法的默认相反**：
        Python 的 `/` 给浮点、`//` 给整除，Dart 的 `/` 给浮点、`~/` 给整除 ——
        这一层两边一样，只是符号不同。
        差别在数字类型：Python 的 `int` 任意精度、`float` 是双精度，
        `int(3.9)` 截断，与 Dart 的 `toInt()` 行为一致；
        但 Python 的整数不会溢出，Dart 的 64 位整数会回绕。
        解析失败上两边都抛异常，Python 是 `ValueError`、
        Dart 是 `FormatException`，Dart 另有 `tryParse` 把失败变成 null。
      java: |
        Java 有隐式拓宽（`int` 能直接赋给 `double`），Dart 全部取消 ——
        从 Java 过来会多出一片 `toDouble()`。反过来 Java 的整除是默认
        （`7 / 2` 是 3），Dart 的整除要写 `~/` ——
        两边在「除法默认给什么」这件事上正好相反，这是迁移时最容易错的一处。
        窄化转换两边都截断、都不警告；解析上 Java 抛
        `NumberFormatException`（与 Dart 一样都是异常），
        Dart 多一个 `tryParse` 把失败变成 null。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent
