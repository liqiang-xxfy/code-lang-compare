  - featureId: java2python/types-exercise
    equivalence: identical
    code: |
      static String summarize(List<Integer> scores) {
          if (scores.isEmpty()) return null;
          long total = 0;                                  // @note 选 long 是怕 int 溢出
          for (int s : scores) total += s;

          double avg = (double) total / scores.size();      // @note! 不转 double 就是整数除法
          return String.format("总分 %d，平均 %.2f", total, avg);
      }
