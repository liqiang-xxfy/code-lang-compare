# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（java2dart），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: java2dart-1-syntax-and-numbers
  order: 1
  title: 语法与数值
  durationHint: 2-3 小时
  todo:
    - 装 Dart SDK，跑一个 `dart create` 的工程
    - 写一段熟悉的 Java 逻辑用 Dart 重写，重点试除法、取模、switch
    - 记住 `-7 % 3` 在两边各得几，以及整除用 `~/`
    - 对照本工具「基础表达」板块里 Dart 列的运算符与控制流
  acceptance:
    - 能说出取模与整除在 Java 与 Dart 的差异，以及什么时候会出错
    - 能写出不带 break 的 switch
  resources:
    - label: Dart 官方文档（中文）
      url: https://dart.cn/
    - label: Dart 语言之旅
      url: https://dart.dev/language

- id: java2dart-2-types-and-generics
  order: 2
  title: 类型系统与泛型
  durationHint: 2-3 天
  todo:
    - 体会空安全默认开启：可能为空的值要标 `?`
    - 试一次协变泛型的运行期错误（往 List<num> 里塞 double）
    - 用 `x is List<int>` 验证泛型是具体化的
    - 对照本工具「语言机制」板块里 Dart 列的「类型标注」「型变」两格
  acceptance:
    - 能说清 Dart 泛型与 Java 泛型在两轴上的相反之处
    - 能说清协变泛型什么时候安全、什么时候会在运行期炸
  resources:
    - label: Dart 官方文档 · 空安全
      url: https://dart.dev/null-safety
    - label: Dart 官方文档 · 泛型
      url: https://dart.dev/language/generics

- id: java2dart-3-classes-and-async
  order: 3
  title: 类、集合与异步
  durationHint: 3-5 天
  todo:
    - 用下划线表达库级私有，体会它没有 private / protected
    - 把一段 CompletableFuture 代码改写成 async / await
    - 验证 Future.wait 默认等全部完成；接受 Future 不可取消
    - 用 Stream 处理一串事件，体会它默认单订阅
  acceptance:
    - 能说清 Dart 的库级私有与 Java 的类级可见性差别
    - 能写出正确处理多播的 Stream 代码
  resources:
    - label: Dart 官方文档 · 类
      url: https://dart.dev/language/classes
    - label: Dart 官方文档 · 异步
      url: https://dart.dev/libraries/async/async-await

- id: java2dart-4-isolates
  order: 4
  title: 并发：从线程到 isolate
  durationHint: 2-3 天
  todo:
    - 用 `Isolate.run()` 跑一个计算密集任务
    - 试着跨 isolate 传一个可变对象，理解它是拷贝而非共享
    - 接受「没有锁、没有原子类型」：改成消息传递设计
    - 对照本工具「语言机制」板块里 Dart 列的并发模型
  acceptance:
    - 能说清 isolate 与 Java 线程 / 锁模型的根本差别
    - 能把一个共享状态加锁的 Java 设计改写成消息传递式
  resources:
    - label: Dart 官方文档 · 并发
      url: https://dart.dev/language/concurrency

- id: java2dart-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 pub 管依赖，理解它与 Maven 的差别
    - 用 dart analyze 与 dart test，注意断言默认关的影响
    - 写一个 build_runner 的代码生成，理解为什么不用反射
    - 对照本工具「工程实践」板块里 Dart 列的工具链
  acceptance:
    - 能独立搭起一个带依赖管理、analyze、测试的 Dart 工程
    - 能说清 Dart 生态为什么偏好编译期代码生成而不是运行期反射
  resources:
    - label: Dart 官方文档 · 包与库
      url: https://dart.dev/tools/pub/packages
    - label: Dart 官方文档（中文）
      url: https://dart.cn/
