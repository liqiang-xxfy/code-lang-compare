  - featureId: basics-python/chained-comparison
    equivalence: absent
    code: |
      int x = 5;
      // 0 < x < 10;                    // @note! 编译错误：boolean 不能参与 < 比较

      0 < x && x < 10;                  // 必须这样拆开写

      // @note 这里 Java 反而是"安全"的：Python 的 0 < x < 10 直译过来编译不过，
      // 而不是静默变成一个恒真的条件
    body: |
      Java 没有链式比较，`0 < x < 10` 直接是编译错误 —— 因为
      `(0 < x)` 得到 `boolean`，而 `boolean` 不能参与 `<` 运算。

      这一点在迁移时反而省心：Python 里那个漂亮的数学写法在 Java 里
      **不可能被悄悄写错**，写错就编译不过。真正危险的是那些
      "能编译、语义不同、结果恒真"的写法，这里是编译期就拦住的一类。
