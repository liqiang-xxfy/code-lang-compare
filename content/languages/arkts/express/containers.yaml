# arkts —— express / containers
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: containers` 的那批：arrays / maps。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 语言简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：集合是 ArkTS 少数**真有话说**的一组 —— 语法与母体同形，
# 但「用键取值」这条路上动态属性被禁，只能走 Map 或显式声明的类型。
# 拿不准的禁用项一律不罗列，只写能核实的概括。

review:
  state: draft

boxes:
  arrays:
    code: |
      const xs: number[] = [1, 2, 3];        // @note 元素类型写在类型位置
      const ys: Array<number> = [4, 5];      // @note 与 number[] 等价的另一种写法
      xs.push(4);                            // @note 增删改查方法与 JavaScript 相同
      const doubled = xs.map((x) => x * 2);  // @note 回调参数自动带上元素类型
      const first: number = xs[0];           // @note 下标读到的类型是确定的
      // xs.push("x");                       // @note! 编译错误：元素类型是 number
      // let loose: any[] = [];              // @note! 编译错误：any 被禁用，没有兜底类型
    vs:
      javascript: |
        数组的增删改查方法与 JavaScript 相同（同一个 `push` / `map` / `slice` 家族），
        差别全落在**元素类型**上：这里要求一个数组的元素类型在编译期就定下来，
        `xs[0]` 读到的是确定的类型而不是「任意值」，想混着放不同类型必须显式写成联合类型。
        更关键的是没有 `any` 可以兜底 —— JavaScript 里「先塞进去、用的时候再看」
        这种写法在这里编译不过，错误从运行时提前到了写的时候。
      python: |
        Python 的 list 元素不限类型、混着放是常态；这里的数组元素类型在编译期固定，
        要混放得显式声明成联合类型。下标访问两边规则不同：Python 越界抛 IndexError、
        负下标可用，这里越界得到 `undefined`、负下标不通用。
        类型这一层，Python 只在另跑的类型检查器里存在，这里是编译的一部分，不通过就出不了包。
      java: |
        Java 的数组长度固定、要动态增删还得换 `ArrayList`；这里一个 `[]` 兼顾两头。
        两边共同的底线是元素类型必须静态确定。差别在运行时：Java 的类型运行时还在
        （数组存储检查会抛 ArrayStoreException、反射也读得到），
        这里的类型编译后整个消失，运行时不检查任何东西。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  maps:
    code: |
      // 键值集合：键与值的类型都要在编译期说清楚
      const m: Map<string, number> = new Map();   // @note Map 是「动态键」的正当去处
      m.set("Ada", 90);
      m.get("nope");                              // @note number | undefined —— 逼你判空
      m.size;                                     // @note 大小直接读
      m.forEach((v, k) => { });                   // @note 遍历回调也带着键值类型

      // 想拿对象当字典，那个对象的形状必须先显式声明出来
      interface Scores { Ada: number; Bob: number }   // @note 键在声明里逐个写出来
      const s: Scores = { Ada: 90, Bob: 85 };
      // const loose = {};
      // loose[key] = 1;                          // @note! 动态属性被禁：没声明的键加不上去，要改用 Map
    vs:
      javascript: |
        运行时与 JavaScript 的 `Map` 一致（同样保插入顺序、同样有 `size`、
        取不到给 `undefined`）。真正的分歧在「拿对象当字典」这条路上：
        JavaScript 里 `obj[key]` 随手就能加一个新键，这里要求那个对象的形状
        先被显式声明出来，动态属性加不上去，只能改用 `Map`。
        于是选择变得干脆 —— 要动态键就用 `Map`，要固定字段就声明类型，
        中间那条路被堵死了。
      python: |
        Python 只有一种 dict；这里得**先选一种表达**：动态键用 `Map`，
        固定字段用一个显式声明的类型。两者在运行时不是一回事（`Map` 的键可以是任何值，
        对象的键只能是字符串），而 Python 的 dict 把这两个角色合在一起 ——
        所以从 Python 过来时要先想清楚用哪个。取缺失键两边都不会静默出错：
        Python 抛 KeyError（除非用 `get`），这里 `Map.get` 给 `undefined`。
      java: |
        Java 的 `Map` 也是「一个概念、多个实现」（`HashMap` 无序、`LinkedHashMap` 保插入序、
        `TreeMap` 按键排序），这里的 `Map` 只有一种、按插入顺序遍历。
        两边都要求键值类型显式写出来，这条接近；差别在运行时：Java 的类型还在
        （反射读得到，泛型虽被擦除但类文件里仍有痕迹），这里的类型编译后整个消失。
        取不到时 Java 给 `null`、这里给 `undefined`，两边都得自己判断。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
