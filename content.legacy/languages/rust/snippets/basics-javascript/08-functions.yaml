    equivalence: divergent
    code: |
      fn add(a: i32, b: i32) -> i32 {     // @note 参数与返回值都必须标类型
          a + b                            // @note! 最后一行不带分号 = 就是返回值
      }

      fn bad(a: i32) -> i32 {
          a + 1;      // @note! 编译错误：expected i32, found () —— 分号把它变成了语句
