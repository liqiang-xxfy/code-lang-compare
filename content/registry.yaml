# 内容注册表 —— 全局唯一开关与站点配置
# 语言「是否存在」由 content/languages/<id>/meta.yaml 的目录决定；
# 语言「是否启用」只由本文件决定（单一开关，避免与 meta 里的状态字段冲突）。

version: 1

# 发布策略（D-A / ADR-07）：
#   include-draft-with-badge —— draft 参与构建与搜索引擎索引，但页面必须显示「未经人工校对」
#   reviewed-only            —— 严格模式：draft 不进生产构建（校对迭代完成后切回）
#
# 当前 = include-draft-with-badge：P5 新增的 Java / Rust / Go 共 216 条实现由 AI 生成，
# 且**本机没有这三门语言的工具链**，无法像 JS / Python 那样逐条实跑验证 ——
# 因此全部标为 draft，让页面上的「未经人工校对」标记如实承载这个事实。
# 校对完成后（能实跑验证时）再切回 reviewed-only。
publishPolicy: include-draft-with-badge

# 默认基准语言 —— 首访默认值与 SSG 静态文案使用这一门。
# 必须是已启用语言；「谁有资格当基准」由各语言 meta.yaml 的 baseline: true 决定。
defaultBaseline: javascript

# equivalence 徽章的参照系 —— 全局声明一次，必须是已启用语言。
#
# 徽章（= / ≈ / ≠ / ∅）是**人手写的绝对值**，不是相对当前基准算出来的：
# 判定「Python 没有 var 提升」这类事实机器做不到，所以无法随基准切换重算。
# 运行时切基准只影响行级 diff 与列顺序，徽章保持不变 —— 页面必须如实说明。
equivalenceReference: javascript

site:
  name: 多语言并排对比
  shortDescription: 并排对比多门语言的同一概念。默认以 JavaScript 为基准，也可选 Python / Java，突出差异，让已有知识快速迁移。
  lang: zh-CN

# 首期只启用 JavaScript + Python（D-C）。
# 其余 5 门语言保留完整 meta 与独立身份，enabled: false 时其内容仍可通过校验但不渲染。
languages:
  javascript:
    enabled: true
  python:
    enabled: true
  # P5 新增：Java / Rust / Go —— 8 章 72 条实现已全部写完（每门 72 条，共 216 条）。
  # 过程印证了「先攒内容后启用」这条通路：写全之前一律 enabled: false，
  # 因为 R2 覆盖率是 **error** 级（已启用语言必须 72/72），
  # 而「未启用语言已写好内容」只给一条按语言汇总的 warning。
  java:
    enabled: true
  rust:
    enabled: true
  go:
    enabled: true
  typescript:
    enabled: false
  arkts:
    enabled: false
  kotlin:
    enabled: false
  swift:
    enabled: false
  dart:
    enabled: false

topics:
  basics:
    enabled: true
    title: 基础语法
    # kind 缺省为 concept（语言无关的概念对比）。
    # migration 的 topic 会在侧栏单独分组，且只覆盖 languages 列出的语言。
    kind: concept

  # ── 迁移教程（kind: migration）──────────────────────────────────────
  # 每个方向只涉及 from/to 两门语言，languages 声明决定了 R2 覆盖率的计算范围：
  # 不声明的话，R2 会按全部 5 门已启用语言要求实现，每个方向缺 3 格、直接阻断构建。
  #
  # 首批只做 4 个方向各 1 个样板模块（函数与参数传递），用于验证机制；
  # 结构跑通后再按同样形态批量扩展。
  js2python:
    enabled: true
    title: JavaScript → Python
    kind: migration
    languages: [javascript, python]
  js2java:
    enabled: true
    title: JavaScript → Java
    kind: migration
    languages: [javascript, java]
  js2rust:
    enabled: true
    title: JavaScript → Rust
    kind: migration
    languages: [javascript, rust]
  js2go:
    enabled: true
    title: JavaScript → Go
    kind: migration
    languages: [javascript, go]
