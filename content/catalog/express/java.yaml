# Java 视角下的「基础表达」章节分组 —— 与 javascript.yaml / python.yaml 又一套。
#
# 四处按 Java 心智模型做的调整（都是**重新归置**，不是改个名字）：
#   1. 「类型与声明」合成一章 —— Java 里声明与类型是同一件事（`int x = 1;` 无法
#      脱离类型谈声明），另有 `var` 推断与包装类型的空值。JS / Python 视图把
#      「变量」与「类型」分成两章，那是它们的心智模型。
#   2. 「方法」一章里带着作用域与遮蔽 —— Java 的块作用域与字段/局部变量同名，
#      只有放在方法语境里才讲得清。
#   3. 命名约定并入「类型与声明」—— Java 的命名**全是约定**，没有一条带语言语义
#      （可见性靠 `public` / `private` 关键字，不靠大小写；那是 Go 的做法）。
#      单独给它一章会撑不起来，放在声明旁边最自然。
#   4. `hoisting` 被**取舍掉** —— Java 的局部变量没有提升，以 Java 为参照系时
#      这一行不该出现（与 Python 视图取舍同一条）。

section: express
baseline: java

chapters:
  - id: types
    title: 类型、声明与命名
    summary: 基本类型、包装类型、var 推断、final 与命名约定
    features: [literals, type-inference, declaration, mutability, null-and-undefined, type-conversion, naming-convention]

  - id: operators
    title: 运算符与相等
    summary: 算术、逻辑，以及 == 与 equals 的分工
    features: [arithmetic, equality, logical, operator-overloading]

  - id: flow
    title: 控制流
    summary: 分支、循环与增强 for
    features: [conditionals, loops, iteration-protocol, switch-and-match]

  - id: methods
    title: 方法、作用域与闭包
    summary: 定义、重载、传参、块作用域与 lambda 捕获
    features: [function-declaration, parameters, variadic, return-values, closures, scope, shadowing]

  - id: strings
    title: 字符串
    summary: String 的不可变性与常用操作
    features: [string-literals, string-common-ops]

  - id: collections
    title: 数组与集合
    summary: 数组的定长与集合框架的选择
    features: [arrays, maps]
