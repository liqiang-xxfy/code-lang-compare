# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（python2cpp），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: python2cpp-1-toolchain
  order: 1
  title: 工具链与编译模型
  durationHint: 2-3 小时
  todo:
    - 装 g++ 或 clang++，写一个 hello world 编译运行
    - 显式指定 `-std=c++20`，确认默认标准是 C++17（不给 -std 时）
    - 理解头文件 / 源文件 / 编译单元 / 链接的关系
    - 对照本工具「语言机制」板块里 C++ 列的静态类型与编译期相关格
  acceptance:
    - 能独立编译一个多文件的 C++ 程序，说清编译与链接的分工
    - 知道哪些错误是编译错误、哪些是链接错误
  resources:
    - label: cppreference（在线参考）
      url: https://en.cppreference.com/w/
    - label: ISO C++ 官网
      url: https://isocpp.org/

- id: python2cpp-2-values-and-memory
  order: 2
  title: 值语义与内存
  durationHint: 3-5 天
  todo:
    - 验证赋值是拷贝：改副本不影响原对象
    - 用栈对象与智能指针各写一遍资源管理，体会 RAII 与 Python 的 with 的差别
    - 试一次越界访问与有符号溢出，理解 UB 的含义
    - 用 shared_ptr 造一个循环引用，再用 weak_ptr 修好
  acceptance:
    - 能说清值语义与 Python 引用语义的差别
    - 能识别三类常见 UB（越界、有符号溢出、失效迭代器）
  resources:
    - label: cppreference · 智能指针
      url: https://en.cppreference.com/w/cpp/memory
    - label: cppreference（在线参考）
      url: https://en.cppreference.com/w/

- id: python2cpp-3-containers
  order: 3
  title: 容器、迭代器与算法
  durationHint: 3-5 天
  todo:
    - 用 vector / map / string 各写几个操作，边界检查用 at
    - 把推导式改写成算法库加 lambda，或 C++20 ranges
    - 验证一次迭代器失效（push_back 之后用旧迭代器）
    - 注意整除与取模在负数上的语义与 Python 相反
  acceptance:
    - 能说清哪些操作会让迭代器失效
    - 能把一段 Python 集合处理代码改写成 C++ 的算法库风格
  resources:
    - label: cppreference · 容器
      url: https://en.cppreference.com/w/cpp/container
    - label: cppreference · 算法
      url: https://en.cppreference.com/w/cpp/algorithm

- id: python2cpp-4-concurrency
  order: 4
  title: 并发与协程
  durationHint: 3-5 天
  todo:
    - 用 std::thread 与 mutex 写一段并发代码，对比 Python 的 GIL
    - 理解数据竞争在 C++ 里是 UB（不是「可能出错」）
    - 试一次 C++20 协程，体会语言只给原语、不给调度器
    - 对照 Python 的 asyncio，理解两者补齐调度层的方式差别
  acceptance:
    - 能说清 C++ 的多线程模型与 Python 的 GIL 模型的根本差别
    - 能说清 C++ 协程为什么不是开箱即用的 async/await
  resources:
    - label: cppreference · 并发支持
      url: https://en.cppreference.com/w/cpp/thread
    - label: cppreference · 协程
      url: https://en.cppreference.com/w/cpp/language/coroutines

- id: python2cpp-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 CMake 组织一个多文件工程，理解它与 pip / venv 的差别
    - 用一个包管理器（vcpkg 或 Conan）装第三方库
    - 配 clang-tidy 与 sanitizer（ASan / UBSan），让 UB 现形
    - 对照本工具「工程实践」板块里 C++ 列的工具链
  acceptance:
    - 能独立用 CMake 搭起一个带依赖、测试的 C++ 工程
    - 能用 sanitizer 抓出隐藏的 UB
  resources:
    - label: CMake 官方文档
      url: https://cmake.org/documentation/
    - label: ISO C++ 官网
      url: https://isocpp.org/
