# python —— basics/06-objects 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/object-create
    equivalence: analogous
    code: |
      literal = {'name': 'Ada', 'age': 36}
      computed = {f'k{n}': n for n in range(1, 3)}
      dict(name='Ada', age=36)                 # @note 关键字构造，键必须是合法标识符

      # @note 键可以是任意可哈希对象：数字、元组、frozenset 都行
      d = {(1, 2): 'tuple key', 1: 'int key'}

      # @note! 3.7+ 保证插入有序；JS 对象对「整数样式的键」会特殊排序，两者规则不同
      list({'b': 1, 'a': 2})                   # ['b', 'a'] —— 保持插入顺序
    body: |
      形状与 JS 的对象字面量相似，但约束更宽：**键可以是任意可哈希对象** ——
      数字、元组、`frozenset` 都能当键，不会被转成字符串，也不会撞在一起。

      `dict` 保证**插入有序**（3.7+），而 JS 对象对「整数样式的键」有提前排序的特殊规则，
      两边规则不同。批量构造还能直接用字典推导式。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-access
    equivalence: divergent
    code: |
      d = {'name': 'Ada'}

      d['name']         # 'Ada'  —— @note 方括号访问的是「键」
      # d['missing']    # @note! KeyError —— 缺失立即报错，不静默给 None
      d.get('missing')  # None   —— @note 用 get 才是安全的
      'name' in d       # True

      # @note! d.name 访问的是「对象属性」，对字典基本会 AttributeError
      # 这两个在 JS 里完全等价，在 Python 里是两件事

      del d['name']     # 删除键
    body: |
      访问不存在的键抛 `KeyError`，不是静默给 `None`；要安全取值用 `d.get('missing')`。

      **`d.name` 与 `d['name']` 在这里不是一回事**：方括号访问的是「键」，
      点号访问的是「对象的属性」—— 对字典用点号基本会 `AttributeError`。
      这两者在 JS 里完全等价，是从那边过来最容易犯的错。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-iterate
    equivalence: analogous
    code: |
      d = {'a': 1, 'b': 2}

      for k, v in d.items():       # @note 最常用：直接解包成键和值
          print(k, v)

      for k in d:                  # @note 直接遍历字典等于遍历键（不是 JS 的 for...in 那种坑）
          print(k)

      list(d.keys())               # ['a', 'b']
      list(d.values())             # [1, 2]

      {k: v * 2 for k, v in d.items()}   # @note 字典推导式，JS 要 fromEntries 两步
    body: |
      `d.items()` 直接给 `(key, value)` 元组，是最常用的写法；`d.keys()` / `d.values()`
      分别拿键与值的视图，需要列表时再套一层 `list()`。

      直接遍历字典等于**遍历键**（`for k in d`）——这里没有 JS 的 `for...in` 那种
      「爬到原型链上」的坑。批量转换用字典推导式一步到位。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-default
    equivalence: divergent
    code: |
      conf = {'retries': 0}

      conf.get('retries', 3)        # 0   —— @note get 只读不写，0 会保留
      conf.get('timeout', 30)       # 30
      'timeout' in conf             # False —— @note! 取值不会顺手写入

      from collections import defaultdict
      counts = defaultdict(int)
      counts['new']                 # 0   —— @note! defaultdict 读取时「会写入」，字典被撑大
      len(counts)                   # 1   —— 这就是副作用

      # @note JS 的 || 会把 0 当空，Python 的 get 不会——所以从 JS 过来这里反而更安全
    body: |
      `d.get(key, default)` 取默认值，而且**只读不写**：取值不会顺手把键写进字典。

      要当心 `defaultdict` —— 它在读取时**会写入**默认值，顺带把字典撑大
      （读一次 `counts['new']`，`len(counts)` 就从 0 变成 1）。
      JS 那边 `||` 把 `0` 当成空的坑在这里不存在，`get` 不会误判。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-merge
    equivalence: analogous
    code: |
      a = {'x': 1, 'y': 2}
      b = {'y': 9, 'z': 3}

      {**a, **b}          # {'x':1, 'y':9, 'z':3}  —— @note 后者覆盖前者，返回新字典
      a | b               # @note 3.9+ 的管道运算符，写法更短

      a.update(b)         # @note! 原地修改 a，返回 None —— 与 {**a, **b} 语义不同
      a                   # {'x':1, 'y':9, 'z':3}

      # @note 同样是浅合并，嵌套字典仍共享引用
    body: |
      `{**a, **b}` 或 3.9+ 的 `a | b` 返回**新字典**，后者的键覆盖前者，
      与 JS 的展开写法一一对应。

      要当心 `a.update(b)` 是**原地修改** `a` 并返回 `None`，语义与 `{**a, **b}` 不同 ——
      这和 JS 里 `Object.assign(a, b)` 漏掉第一个 `{}` 是同一个陷阱。
      合并同样是浅的，嵌套字典仍共享引用。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-nested
    equivalence: analogous
    code: |
      import copy

      original = {'user': {'name': 'Ada'}, 'tags': ['a']}

      shallow = {**original}
      shallow['user']['name'] = 'Grace'
      original['user']['name']      # 'Grace'  —— @note! 浅拷贝：内层还是同一个对象

      deep = copy.deepcopy(original)   # @note 真深拷贝，能处理循环引用
      deep['user']['name'] = 'Hopper'
      original['user']['name']         # 仍是 'Grace'

      original.copy()                  # 等价于浅拷贝
      list(original['tags'])           # 只复制一层时的手工写法
    body: |
      浅拷贝是默认行为：`{**original}` 与 `original.copy()` 都只复制第一层，
      嵌套对象仍是共享引用 —— 与 JS 的 `{...obj}` 是同一个坑。

      深拷贝用 `copy.deepcopy()`，能处理循环引用。
      这一格的 bug 形态两边一样：**看起来复制了，改新对象却动了旧对象**。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-comprehension
    equivalence: analogous
    code: |
      langs = ['js', 'py']

      {l: len(l) for l in langs}                     # {'js': 2, 'py': 2}
      {k: v for k, v in {'a': 1, 'b': 2}.items() if v > 1}   # {'b': 2}

      {n: n * n for n in range(4)}                   # {0:0, 1:1, 2:4, 3:9}
      {v: k for k, v in {'a': 1}.items()}            # 反转键值

      # @note 推导式一步到位，且支持 if 过滤与嵌套；这是 Python 最值得专门练的语法之一
    body: |
      字典推导式 `{k: v for ...}` **一步到位**，还支持 `if` 过滤与嵌套 ——
      JS 那边同样的意图要走 `map` + `Object.fromEntries` 两步。

      推导式是最具辨识度的语法之一，值得练到「不假思索就能写」：
      从 JS 过来时，手写 for 循环攒字典的地方基本都该换成它。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-equality
    equivalence: divergent
    code: |
      a = {'x': 1}
      b = {'x': 1}

      a == b            # True   —— @note! 按「内容」比较，嵌套结构会递归比较
      a is b            # False  —— is 才是比引用

      [1, [2, 3]] == [1, [2, 3]]    # True  —— 列表同样按内容

      # @note 所以「两个字典是否相同」在 Python 里是免费的，JS 里要自己写
      # @note 自定义类默认也是按身份比较，想按内容比必须实现 __eq__
    body: |
      `==` 对 dict / list 比的是**内容**，嵌套结构会递归比较
      （`[1, [2, 3]] == [1, [2, 3]]` 是 `True`）；要比引用才用 `is`。

      所以「两个字典内容是否相同」在这里是免费的，JS 那边得自己写 ——
      这也意味着 `in`、去重、断言相等这些日常操作都直接可用。
      自定义类默认仍按身份比较，想按内容比必须实现 `__eq__`。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
  - featureId: basics-javascript/object-json
    equivalence: analogous
    code: |
      import json

      obj = {'name': '阿达', 'age': 36}

      json.dumps(obj)                          # @note! 默认 ensure_ascii=True —— 中文变成 \u963f\u8fbe
      json.dumps(obj, ensure_ascii=False)      # '{"name": "阿达", "age": 36}'
      json.dumps(obj, indent=2)                # 缩进
      json.loads('{"a": 1}')                   # {'a': 1}

      # @note 分隔符默认带空格（JS 是紧凑的），这是最直观的输出差异

      # @note! 遇到非 JSON 类型直接抛 TypeError，不静默丢弃（与 JS 相反）
      # json.dumps({'d': datetime.now()})      # TypeError: Object of type datetime is not JSON serializable
      # @note 正解是给 default 传一个转换函数
      json.dumps({'s': {1, 2}}, default=list)  # '{"s": [1, 2]}'

      # @note loads 不执行代码，比 eval 安全
      # @note 整数是任意精度，不会像 JS 的 JSON.parse 那样在 2^53 处被截断；小数仍是 double
      json.loads('9007199254740993')           # 9007199254740993 —— 精确
    body: |
      `json.dumps` / `json.loads`，有两处默认值会让人意外：`ensure_ascii` 默认为真，
      中文被转义成 `\uXXXX`（要可读得显式关掉）；分隔符默认带空格（`{"a": 1}`，
      JS 那边是紧凑的）。

      对非 JSON 类型**直接抛 `TypeError`**，不静默丢弃 —— 与 JS 相反。
      正解是给 `default` 传一个转换函数。整数是任意精度，不会像 JS 的 `JSON.parse`
      那样在 2^53 处被静默改值。
    review:
      state: reviewed
      provenance:
        origin: llm
        model: claude-sonnet-4.5
