# cpp —— express / control-flow
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: control-flow` 的那批。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组有三条实跑确认的边界 ——
# ① `switch` **只能作用在整数与枚举上**（`switch(std::string)` 直接报
#    「switch quantity not an integer」），不是通用的多路分支；
# ② `switch` **默认贯穿**，不写 `break` 就往下掉（这一点与「不贯穿」的语言相反）；
# ③ range-for 背后是 **begin/end 迭代器协议**，而 C++20 的 `views` 把
#    「惰性管道」做进了标准库（`iota(1) | take(3)` 能跑，证明它真的是惰性的）。

review:
  state: draft

boxes:
  conditionals:
    code: |
      if (x > 0) { } else if (x == 0) { } else { }

      if (int r = compute(); r > 0) { }     // @note 条件里声明变量，作用域只到 if

      // @note! 条件必须是能转成 bool 的东西 —— 没有「真值/假值」那套
      if (ptr) { }                          // @note 指针：非空为真（合法）
      if (count) { }                        // @note 整数：非零为真（合法）

      // @note! 经典陷阱：赋值写成了比较 —— 算术类型的赋值结果能当条件用
      // if (n = 1) { }                     // @note! 编译通过（GCC 给 -Wparentheses 警告），永远为真
      // @note 这类值能隐式转 bool 的类型都会被它咬到；对比运算符两侧不能赋值

      // @note 想按类型分支得用 if constexpr（编译期）或重载
      if constexpr (std::is_integral_v<T>) { /* 编译期选一支 */ }

      // @note 三元运算符是表达式，不是语句
      auto v = x > 0 ? "正" : "非正";
    vs:
      javascript: |
        两边的 `if` 形态一样，但**条件允许什么**差得很远：
        JavaScript 有一整套真值/假值（空字符串、0、NaN、null 都算假），
        所以 `if (name)` 是很常见的写法；C++ 里能隐式转成 `bool` 的
        主要是数值与指针类型（0 / 非空为假真），类类型要自己定义转换。
        另一处是 `switch` 与 `if` 的分工：JavaScript 的 `switch` 可以比较
        任意值（包括字符串），C++ 的只能用在整数与枚举上（见下一格），
        所以「按字符串分支」在 C++ 里只能写成一串 `if`。
      python: |
        Python 的真值判断是**对象自己说了算**（`__bool__`，空容器为假），
        而且 `if x:` 这种写法到处在用；C++ 的条件必须能转成 `bool`，
        容器、字符串都不能直接当条件 —— 要写 `if (!s.empty())`。
        所以那边「空的就是假的」这条便利在这边没有，
        好处是每个判断都写明了在判断什么。
        另一处是 Python 的 `match` 能按结构匹配，C++ 的 `if` 完全做不到（见 `switch-and-match`）。
      java: |
        两边**几乎完全一致**：条件必须是 `boolean`（C++ 允许数值与指针
        隐式转 bool，比 Java 松一点），`if` / `else if` / `else` 形态相同，
        三元运算符也同名同义。Java 没有「条件里声明变量」这个写法，
        C++ 有（`if (int r = f(); r > 0)`），是给「算一个值再判断」省一行用的。
        另一处是 C++ 的编译期分支 `if constexpr` 是 Java 没有的能力。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  loops:
    code: |
      for (int i = 0; i < n; ++i) { }        // @note 三段式 for（最常用）

      for (auto& x : vec) { x *= 2; }        // @note range-for：引用才能改到原容器
      for (const auto& x : vec) { }          // @note 只读就用 const 引用（不拷贝）
      for (auto [k, v] : map) { }            // @note 结构化绑定

      while (cond) { }
      do { } while (cond);                   // @note 至少执行一次

      // @note 中断与跳过：break / continue / return / goto 都在
      // @note! 范围 for 里改容器结构（增删元素）会让迭代器失效 —— 循环行为未定义
    vs:
      javascript: |
        两边都有三段式 `for` 与 `while`，C++ 多出来的是**迭代方式的选择**：
        JavaScript 的 `for...of` 是语言内置的协议，遍历的一定是「值」；
        C++ 的 range-for 背后是迭代器，`auto` / `auto&` / `const auto&`
        三种写法含义不同（拷贝 / 引用 / 只读引用），选错要么白拷贝、
        要么改不动原容器。另一处差别很实际：JavaScript 在 `for...of` 里
        删元素是允许的（有明确规则），C++ 的 range-for 里改容器结构
        会让迭代器失效，行为未定义。
      python: |
        两边的循环写法差别比看上去大：Python 的 `for x in seq` 遍历的
        是**元素**，要下标得用 `enumerate`；C++ 的 range-for 也是遍历元素，
        但底层是迭代器，而且能直接绑引用、绑结构化绑定。
        Python 的 `while` 与 C++ 的 `while` 一致，但 C++ 多一个 `do-while`。
        另一处是 C++ 的 `goto` 虽然不推荐但存在，Python 完全没有。
      java: |
        两边的四种循环**一一对应**（三段式 `for`、增强 `for`、`while`、`do-while`），
        连名字都对得上，这一格最接近。差别在写法细节：Java 的增强 for
        改元素要拿 `ListIterator`，C++ 的 range-for 直接写 `auto&` 就行；
        Java 有标签 `break outer;` 跳出多层循环，C++ 没有标签 break
        （只有标签 + `goto`）。另一处是 C++ 的 `for` 初始化语句里
        可以声明多个不同类型的变量（C++17 起）。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  iteration-protocol:
    code: |
      // @note! range-for 背后是 **begin / end 迭代器协议**，不是语言内置的遍历
      //   for (auto x : c)  ≈  for (auto it = begin(c); it != end(c); ++it)
      // 所以「可以被遍历」= 这个类型有可用的 begin() 与 end()

      std::vector<int> v{1, 2, 3};
      for (auto it = v.begin(); it != v.end(); ++it) { }   // @note 手写形态

      // @note 标准库容器、C 数组、initializer_list、以及 **任何提供了
      // @note begin/end 的自己的类型** 都能 range-for

      // @note C++20 ranges：把「管道」做进了标准库，而且是**惰性**的
      for (auto i : std::views::iota(1) | std::views::take(3)) { }   // @note 无限序列取前三个
      auto r = v | std::views::filter(pred) | std::views::transform(f);
    vs:
      javascript: |
        两边的「能被遍历」判据不同：JavaScript 靠**语言定义的协议**
        （`Symbol.iterator`，即对象上有没有那个特定方法），
        数组、字符串、Map、Set 都内建实现了它；
        C++ 靠**能不能找到 `begin()` 与 `end()`** ——
        这是个更松的约定（自己写的类型补两个函数就行，甚至能写自由函数）。
        另一处是惰性管道：JavaScript 要用生成器函数手写，
        C++20 起标准库里就有 views，`filter | transform` 是现成的。
      python: |
        **两边的迭代协议名字一样、位置不同**：Python 靠 `__iter__` 与
        `__next__`（迭代器自己记状态、`next` 一次一个），
        C++ 靠一对 `begin` / `end`（两个迭代器比位置，`++` 往前走）——
        前者是「我问下一个」，后者是「我指着一个位置」。
        所以 Python 的生成器天生就是迭代器，C++ 要写生成器得用协程。
        共同点是两边都能给自定义类型补上协议、都能惰性求值。
      java: |
        两边的模型不同：Java 的增强 `for` 吃 `Iterable`，
        而且必须实现那个接口（接口是名义的）；
        C++ 的 range-for 只要求 `begin()` / `end()` 能调用 ——
        这是个**结构化**要求，不要求继承任何东西。
        另一处是 C++ 的迭代器分五类（输入/前向/双向/随机访问/连续），
        泛型代码按类别挑算法；Java 的 `Iterator` 只有一种，
        随机访问要另外判断，粒度比 C++ 粗。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  switch-and-match:
    code: |
      enum class Color { Red, Green, Blue };
      Color c = Color::Red;

      switch (c) {                          // @note! switch 只能用在**整数与枚举**上
        case Color::Red:   /* ... */ break;
        case Color::Green: /* ... */ break;  // @note! 不写 break 会**贯穿**到下一支
        default: break;
      }

      // @note! `switch(std::string)` 编译不过：switch quantity not an integer
      // @note 所以「按字符串分支」在 C++ 里只能写成一串 if / else

      // @note 想按「有好几种可能」的值分支，标准做法是把它们放进一个联合类型
      std::variant<int, std::string> val = 42;
      std::visit([](auto&& x) {
        using T = std::decay_t<decltype(x)>;
        if constexpr (std::is_same_v<T, int>) { /* 整数分支 */ }
        else { /* 字符串分支 */ }
      }, val);                              // @note 分支穷尽性由编译器检查

      // @note C++17 起还能在 switch 头部声明变量：switch (auto n = f(); n)
    vs:
      javascript: |
        两边都有 `switch`，但**能比什么**和**会不会贯穿**都不同：
        JavaScript 的 `switch` 用 `===` 比较任意值（字符串、对象都行），
        而且现代写法里每支必须 `break` / `return`；
        C++ 的 `switch` 只能作用在整数与枚举上（比的是值），
        字符串直接编译不过，而且**不写 `break` 就往下贯穿** ——
        这个坑是 C++ 特有的。要按「好几种可能」分支，C++ 得换成
        `std::variant` 加 `visit`，那时穷尽检查由编译器负责；
        JavaScript 里没有这层，漏掉一种情况没人提醒。
      python: |
        Python 的 `match` 是**结构匹配**：能按形状拆列表、按属性拆对象、
        还能加守卫条件；C++ 没有这个能力 —— `switch` 只比整数与枚举的值，
        既不能匹配结构也不能绑定变量。真要「按几种可能分支」，
        C++ 的替代品是 `std::variant` 加 `std::visit`，
        它能把「有哪几种可能」写进类型并强制穷尽，
        但那个集合必须在写代码时就定死。Python 的 `match` 没有穷尽要求。
      java: |
        **这一格两边差得比较远**：Java 的 `switch` 早就支持字符串，
        较新版本还支持模式匹配、`sealed` 类型上的穷尽检查、
        以及箭头写法（`case X ->` 不贯穿）；C++ 的 `switch`
        仍然只能比整数与枚举，而且**默认贯穿**、没有箭头写法。
        所以 Java 那边「switch 一个字符串」是日常，
        这边要写成 `if` 链或者换成 `variant` + `visit`。
        C++ 唯一更强的地方是 `if constexpr` 能在编译期选分支。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
