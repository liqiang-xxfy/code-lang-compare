# 脚手架模板 —— 复制这个目录来新增一门语言
#
#   1. cp -r content/languages/_template content/languages/<新语言 id>
#   2. 把下面的 id 改成新语言的 id（必须与目录名一致）
#   3. 填 snippets/ 下的实现，并在 content/registry.yaml 里登记 + 设 enabled
#   4. npm run content:build && npm run verify:ext
#
# 以 `_` 开头的目录是「私有目录」：默认构建与校验都会跳过它，
# 所以这份模板不会被当成一门真语言渲染出来，也不会因残留而破坏校验。
id: _template
name: 语言名称
shortName: 短名
aliases: []
version: '1.0'
fileExtension: .xx
comment:
  line: '//'
  block: ['/*', '*/']
shikiLang: text
paradigm: []
typing: dynamic
memoryModel: gc
concurrency: []
# 基准候选资格：标 true 表示这门语言可作为参照系（可多门）。
# 默认基准由 content/registry.yaml 的 defaultBaseline 决定。
baseline: false
links:
  - label: 官方文档
    url: https://example.com/
