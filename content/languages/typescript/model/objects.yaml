# typescript —— model / objects
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: objects` 的那批：
# class-declaration / constructor / fields-and-properties / methods-and-receiver /
# inheritance / access-control。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）—— 包括**缩写**，
# 「JS」这类简称同样会被算作屏幕外的语言，泛指时写「另一门语言」。
#
# 这一组的真差异集中在**「类型层的可见性 vs 运行时的可见性」**：class 与 JavaScript
# 逐字同形，加的全是编译期那一层（字段声明、访问修饰符、参数属性、抽象类、接口），
# 编译后一律消失。运行时行为的部分不重复讲。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-objects-v1
    generatedAt: '2026-10-03'

boxes:
  class-declaration:
    code: |
      class User {                      // @note 与 JavaScript 的 class 同形
        name: string;                   // @note 字段要在类型里声明，JavaScript 里可省
        constructor(name: string) { this.name = name; }
        greet(): string { return "hi"; }
      }

      interface Point { x: number; y: number }   // @note 只描述形状，编译后不落地
      const p: Point = { x: 1, y: 2 };           // @note 结构化：形状对上即可

      // @note! 类型全是编译期的 —— 去掉它们就是一段合法的 JavaScript
    vs:
      javascript: |
        class 关键字与对象字面量的写法都与 JavaScript 逐字同形，加的是类型那一层：字段要
        声明、参数与返回值要标注。JavaScript 里字段可有可无、类型全靠约定；TypeScript 里
        声明了才算存在，strict 下访问没声明的字段直接报错。另一处是 interface / type 描述
        形状，JavaScript 里没有这个概念 —— 它只活在编译期，去掉之后整段就是 JavaScript。
      python: |
        Python 的类是运行时的对象，能反射、能动态创建；TypeScript 的类编译后落到一套普通
        对象模型上，类本身在运行时不可查。Python 的实例随时能长属性，TypeScript 里字段要在
        类里声明、多一个字段就多一行类型。另一处是 TypeScript 用 interface 描述「形状」而
        完全不产生运行时实体 —— 类型与值是两个世界，Python 里类是值、也就能当值用。
      java: |
        Java 的类是编译期的类型、字段必须声明，这两点与 TypeScript 一致。差别在类型判定：
        Java 是名义类型，两个字段一样的类也是不同类型；TypeScript 是结构化类型，只要形状
        对得上就算兼容。另一处是 Java 的类在运行时可查（反射能拿到字段与方法），TypeScript
        的类型标注编译后全部消失、运行时不设防。Java 还有匿名类，TypeScript 用对象字面量
        加类型标注表达同样的意图。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  constructor:
    code: |
      class User {
        name: string;
        constructor(name: string) {        // @note 只能有一个，与 JavaScript 一样没有重载
          this.name = name;
        }
        static from(o: { name: string }): User { return new User(o.name); }   // @note 多种构造靠静态工厂
      }

      class Point {
        constructor(public x: number, readonly y: number) {}   // @note 参数属性：一步声明字段并赋值
      }
      // @note! 参数属性是编译期语法糖，展开后与手写 this.x = x 等价
    vs:
      javascript: |
        constructor 与 JavaScript 同形：只能有一个、没有重载，多种构造靠静态工厂加默认参数。
        TypeScript 加的是**参数属性** —— 在构造参数上写 public / private / readonly 就同时声明
        字段并赋值，省掉手写的 this.x = x，以及参数的类型标注。去掉这些展开之后，剩下的构造
        过程与 JavaScript 完全一致。
      python: |
        Python 的 __init__ 只是初始化钩子（对象已经造好），TypeScript 的 constructor 是唯一
        入口、「造对象」与「初始化」合成一步。两边都能做替代构造，只是手段不同：Python 用
        命名不同的类方法，TypeScript 用静态工厂。Python 一个 __init__ 配默认参数就能覆盖
        多种情形，TypeScript 也要靠默认参数与可选参数来收。
      java: |
        Java 的构造函数可以重载、能用 this(...) 串到另一个；TypeScript 只有一个 constructor，
        多种构造靠静态工厂与默认参数。Java 的字段有默认值、初始化顺序有明确规定，TypeScript
        不写初值就是 undefined、按书写次序执行。相同点是两边都在编译期检查构造参数的类型。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  fields-and-properties:
    code: |
      class User {
        name = "匿名";                    // @note 实例字段，类型由初值推断
        static count = 0;                // @note 静态字段挂在类上
        readonly id: number = 1;         // @note readonly：只许在声明处或构造里赋值
        private secret = 1;              // @note 编译期的 private

        get display(): string { return this.name.toUpperCase(); }   // @note getter
        set display(v: string) { this.name = v.trim(); }            // @note setter
      }
      const u = new User();
      u.display;                         // @note 像属性一样读，背后调了 getter
      // @note! private / readonly 只在编译期拦，运行时字段照旧挂在实例上
    vs:
      javascript: |
        字段、get / set、static 的写法都继承自 JavaScript，同形。TypeScript 加的是声明上的
        类型与 readonly：字段能带类型、能用 readonly 锁住「构造后不再变」。注意 private 不是
        运行时私有 —— JavaScript 的 # 才是真私有，TypeScript 的 private 只是编译期的门闩。
      python: |
        两边都能定义「像属性一样访问、背后跑方法」的东西（Python 是 @property，TypeScript 是
        get / set）。差别在字段的声明与归属：Python 的实例属性随手赋就创建、类属性与实例
        属性共用一条查找链；TypeScript 的字段要在类体里声明（或用参数属性），static 明确挂在
        类上。Python 没有编译期的只读，TypeScript 的 readonly 能在编译期拦住赋值。
      java: |
        Java 没有属性（property）这种东西：字段就是字段、getter 就是方法，调用点必须带括号；
        TypeScript 可以写 obj.name 而背后跑的是 getter，调用点看不出区别。字段声明两边都
        强调，只是 Java 的字段有默认值、不写初值也不会是 undefined。相同点是两边都有编译期
        的可见性修饰符。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  methods-and-receiver:
    code: |
      class Counter {
        n = 0;
        bump() { this.n++; }                      // @note this 由调用方式决定（与 JavaScript 同）
        bumpArrow = () => { this.n++; };          // @note 箭头函数字段：this 绑定在实例上
        bumpTyped(this: Counter) { this.n++; }    // @note this 参数：编译期要求调用点给出接收者
      }
      const c = new Counter();
      const f = c.bump;
      f();                                        // @note! this 丢 —— 运行时行为与 JavaScript 一样
      // @note 方法返回类型写成 this，可以让链式调用保住子类类型
    vs:
      javascript: |
        this 的规则完全一样、由调用方式决定：方法取出来单独调用就丢，惯用的规避也是箭头函数
        字段 —— TypeScript 不在运行时改这一点。它能在编译期帮忙：写 this: Counter 这样的参数，
        编译器就要求这个函数必须以 Counter 为接收者调用；返回类型写 this 能让链式调用保住
        子类类型。这些标注编译后消失。
      python: |
        Python 的 self 是显式参数、在取属性时就绑定好，方法当回调传出去完全安全；TypeScript
        的 this 靠调用方式决定，得靠箭头函数字段或显式标注来兜 —— 这是两边读代码时最要换脑子
        的一处。Python 用 @classmethod / @staticmethod 区分接收者，TypeScript 没有运行时层面
        的对应，只能用类型标注表达。
      java: |
        Java 的 this 恒等于当前实例，方法引用 c::bump 取出来接收者也绑定好了，不存在丢接收者
        这回事；TypeScript 的 this 是动态的，要靠箭头函数字段或编译期的 this 参数补救。另一处
        差别是 TypeScript 的 this 能当类型用（方法返回 this），Java 没有对应的类型级写法。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  inheritance:
    code: |
      class Animal { speak(): string { return "..."; } }
      class Dog extends Animal {                       // @note 单继承，与 JavaScript 一致
        speak(): string { return super.speak() + " 汪"; }
      }

      interface Swimmer { swim(): void; }
      class Duck extends Animal implements Swimmer {   // @note 接口声明多份「能做什么」
        swim(): void { }
      }
      // @note! 只继承一个类；implements 只在编译期检查，运行时不落地
      // @note 一个类可以实现多个接口
    vs:
      javascript: |
        继承与 JavaScript 同形：单继承、extends、super，底层仍是原型链。TypeScript 加的是
        implements 与 interface —— 能检查「这个类有没有把接口要求的方法都实现」，但这一层在
        运行时不存在。「多份能力」在这里是编译期查、运行时不落地；去掉类型之后就是 JavaScript
        的单继承。
      python: |
        Python 支持多继承并用 MRO 裁决冲突，TypeScript 只能单继承，多份能力走接口这条路
        （接口编译后消失）。两边的继承本质也不同：Python 是类与类的父子关系，TypeScript 底层
        是原型链。Python 的 mixin 是运行时真的混入方法，TypeScript 的接口不携带实现。
      java: |
        Java 的类单继承、可以实现多个接口，表面上和 TypeScript 很像。差别是 Java 的接口是
        运行时实体（能反射、带默认方法时能给实现），TypeScript 的接口只是编译期契约、不携带
        实现也不能在运行时存在。另一处是 Java 所有类都隐式继承 Object，TypeScript 的类可以
        谁都不继承。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  access-control:
    code: |
      class Account {
        public owner: string = "";       // @note 默认就是 public
        private balance = 0;             // @note! private 只在**编译期**拦
        protected limit = 100;           // @note protected：本类与子类可见
        readonly id = 1;                 // @note readonly：构造后不可写
        #secret = 2;                     // @note # 才是运行时真私有
      }
      const a = new Account();
      a.balance;                         // @note! 编译错误：类外访问 private
      (a as any).balance;                // @note! 但运行时拿得到 —— 编译期拦不住
      // @note 参数属性也能带修饰符：constructor(private n: number) {}
    vs:
      javascript: |
        默认公开是一样的；差别是 TypeScript 多出一整套编译期可见性（public / private /
        protected / readonly）—— 它们只在编译期拦，编译产物的字段照旧挂在实例上，用强制手段
        绕过类型照样拿得到。真正的运行时私有是 JavaScript 的 #，那一个 TypeScript 完整继承。
        所以判断能不能碰，要看写的是 private 还是 #：前者是编译期的门闩，后者是引擎级的。
      python: |
        Python 的「私有」只有下划线约定，语言不强制，双下划线也只是改名；TypeScript 的
        private 由编译器执行，类外访问直接编译不过 —— 但只在编译期，运行时照样能读到。
        Python 连编译期这一档都没有，所以两边强度不同：一个「编译器拦、运行时不拦」，
        一个「谁都不拦」。
      java: |
        Java 的 private 由编译器强制，与 TypeScript 的 private 是同一档强度；差别在覆盖面与
        默认值：Java 每个成员都要选一个可见性、不写是包内可见，TypeScript 默认公开、只有写了
        的才受限。另一处是 TypeScript 用 readonly 表达「构造后不可再赋」，Java 用 final 表达
        同样的意思。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous
