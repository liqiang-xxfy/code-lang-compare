# 迁移学习路线 —— Python → Java

- id: py2java-1-types
  order: 1
  title: 先把类型系统补上
  durationHint: 2-3 天
  todo:
    - 通读「心智模型」板块的「类型与值」一章，先建立「类型先行」的直觉
    - 手写一遍原始类型与包装类的对应关系，注意 int/Integer 的装箱与 null
    - 记住 Java 的编译期检查能拦住哪些 Python 只能在运行时发现的错
  acceptance:
    - 能徒手写出带泛型的集合声明，不再靠 var 猜
    - 能说清 final 冻结的是绑定而不是内容
  resources:
    - label: Java 官方教程（Oracle）
      url: https://dev.java/learn/

- id: py2java-2-functions
  order: 2
  title: 重写函数这一层的直觉
  durationHint: 3-4 天
  todo:
    - 读《函数与参数传递》一章，把默认参数改写成重载、把 kwargs 改写成 Builder
    - 练习把一段工具函数搬进类里，并决定它是 static 还是实例方法
    - 观察 lambda 只能捕获事实不变变量这条规则，理解它为什么能避免闭包共享的坑
  acceptance:
    - 能不用默认参数语法、只靠重载写出等价签名的 API
    - 能解释为什么 Java 里没有「拼错参数名却被静默吞掉」这种问题
  resources:
    - label: Java 语言规范 · 方法重载
      url: https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html

- id: py2java-3-tooling
  order: 3
  title: 接上工具链与工程习惯
  durationHint: 1 周
  todo:
    - 用 Maven 或 Gradle 建一个空项目，跑通「写代码 → 编译 → 测试 → 打包」
    - 把 pip/venv 的心智映射到 Maven Central 与依赖声明
    - 配好 IDE 的重构与跳转，体会编译期检查带来的反馈速度
  acceptance:
    - 能独立新建一个项目并让它产出可执行 jar
    - 遇到编译错误时能读懂 javac 的报错并定位到具体类型不匹配
  resources:
    - label: Maven 官方入门
      url: https://maven.apache.org/guides/getting-started/
