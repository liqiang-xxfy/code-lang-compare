      from concurrent.futures import ThreadPoolExecutor

      t = threading.Thread(target=work)
      t.start()
      t.join()

      with ThreadPoolExecutor(max_workers=4) as pool:      # @note 形态与 Executor 几乎一样
          futures = [pool.submit(work, i) for i in range(10)]
          results = [f.result() for f in futures]

      # @note! 但同一时刻真正执行的只有一个线程 ——
      # CPU 密集的任务加线程池**不会变快**，通常还会因为切换开销更慢
      # 真要压榨多核只能用 multiprocessing
  - featureId: java2python/async-model
    equivalence: divergent
    code: |
      import asyncio

      async def run(url):
          try:
              result = (await fetch(url)).strip()      # @note await 是显式的让出标记
          except Exception:
              result = "默认"
          return result

      async def run_all(urls):
          return await asyncio.gather(*[run(u) for u in urls])

      asyncio.run(run_all(urls))

      # @note 异常回到普通的 try/except，不再有"完成异常到 join 才浮出来"那层间接
      # @note! 但 async 有传染性：调用链上一路都要 async；
      # 而且所有协程共享一个事件循环 —— 一个阻塞调用会卡住全部
