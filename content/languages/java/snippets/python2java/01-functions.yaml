  - featureId: python2java/defaults
    equivalence: absent
    code: |
      static Connection connect(String host) {
          return connect(host, 5432, 30);
      }
      static Connection connect(String host, int port, int timeout) {
          return new Connection(host, port, timeout);
      }
    body: |
      Java **没有默认参数语法**。可选配置的正统解法是重载 + 单一实现：

      ```java
      static Connection connect(String host) {
          return connect(host, 5432, 30);   // 短的转调长的，默认值只写一处
      }
      static Connection connect(String host, int port) {
          return connect(host, port, 30);
      }
      static Connection connect(String host, int port, int timeout) { ... }
      ```

      参数再多就该换成 Builder：`Config.builder().host(h).port(5432).build()`。
      Builder 的额外好处是**具名**——它同时补上了 Java 缺失的关键字参数。
