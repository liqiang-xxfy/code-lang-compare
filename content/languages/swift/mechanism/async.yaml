# swift —— mechanism / async
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: async` 的那批：
# event-loop / callback / promise-future / async-await / cancellation。
#
# Swift 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Swift 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的题眼是 **Swift 的异步模型是「任务」，不是「事件循环」** ——
# 运行时底下当然有调度器，但语言层面暴露的概念是 `Task` 与 `await`，
# 而且**结构化并发**把子任务的寿命绑在作用域上（不像别处「发出去就不管了」）。
# 另一条最承重的是**取消是协作式的**：`Task.cancel()` 只设标志，
# 任务必须自己检查（`Task.isCancelled` / `Task.checkCancellation()`）。

