  - featureId: basics-python/object-access
    equivalence: divergent
    code: |
      const d = { a: 1 };
      d.a;                  // 1
      d["a"];               // @note 1 —— 点号与方括号在这里完全等价
      d.z;                  // @note! undefined —— 缺失静默返回空值，不抛
      d.z.deep;             // @note! 于是这里才崩，报错位置离原因很远

      "a" in d;             // true —— 判存在要用 in 或 hasOwnProperty
      // @note Python 那边 d.a 是 AttributeError（点号不取键），d["z"] 是 KeyError
  - featureId: basics-python/object-iterate
    equivalence: analogous
    code: |
      Object.entries(d);              // @note [['a', 1], ['b', 2]] —— 要自己解构
      for (const [k, v] of Object.entries(d)) { }

      Object.keys(d);                 // 只要键
      Object.values(d);               // 只要值

      for (const k in d) { }          // @note! for...in 会连原型链上的可枚举属性一起遍历，
                                      // 所以不如 Object.entries 可靠
      // @note 遍历时增删同样有未定义行为，但不会像 Python 那样抛 RuntimeError
  - featureId: basics-python/object-default
    equivalence: analogous
    code: |
      d.k ?? 0;                       // @note! 只对 null / undefined 兜底
      d.k || 0;                       // @note! 0 和 "" 也会被当成"空"，多数时候是错的

      // @note 没有"读取时写入默认值"的对应物：
      // Python 的 defaultdict 与 setdefault 都会改字典，这边的 ?? 完全只读
      if (!(k in d)) d[k] = [];
      d[k] ??= [];                    // @note 这个才是"不存在就写入"的写法
  - featureId: basics-python/object-merge
