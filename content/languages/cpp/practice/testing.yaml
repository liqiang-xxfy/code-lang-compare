# cpp —— practice / testing
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: testing` 的那批：
# test-framework / assertions / mocking / parameterized-tests / coverage。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的题眼是**「测试全靠第三方，语言只给一个 assert」**。
# 两处实跑确认：① `assert` **默认开着** —— 它在 GCC 下由 `NDEBUG` 控制，
# 而 `NDEBUG` **不由标准库定义**，所以「release 构建自动关断言」是错的
# （实测 `-O2` 不加 `-DNDEBUG` 时断言照旧生效）；
# ② `static_assert` 是编译期断言，与运行期的 `assert` 是两回事。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-testing-v1
    generatedAt: '2026-10-04'

boxes:
  test-framework:
    code: |
      // @note! C++ **没有标准测试框架** —— 标准库里没有任何测试相关内容
      // @note 实际用的是第三方库，各有各的写法：
      //   GoogleTest   最主流，功能全（本机没装）
      //   Catch2       头文件库，上手快
      //   doctest      编译最快的那个
      //   Boost.Test   跟 Boost 一起用

      // GoogleTest 的形状长这样：
      #include <gtest/gtest.h>
      TEST(CalculatorTest, AddsTwoNumbers) {
        EXPECT_EQ(add(1, 2), 3);
      }
      // 测试的发现与运行由框架的 main 或链接进来的库负责

      // @note CMake 项目里通常再加一层 `ctest` 当统一入口：
      // @note   开发时直接跑测试可执行文件，CI 里跑 ctest

      // @note 测试的**组织方式是约定**：文件放哪、怎么命名、
      // @note 怎么把测试接进构建 —— 全是项目自己定，
      // @note 语言不提供「哪些文件是测试」这种信息

      // @note 与别的语言不同的是：测试要**编译**，所以跑一次测试
      // @note 包含一次完整构建 —— 反馈循环天然比解释型语言长
    vs:
      javascript: |
        **两边的「测试框架从哪来」完全不同**：JavaScript 有内置的
        `node:test`（较新版本起），生态里更有 Jest / Vitest 这类
        开箱即用的选择，装一个依赖就能写；C++ 的标准库里
        **一条测试相关的东西都没有**，必须选一个第三方库，
        还要把它接进构建系统。
        另一处是**发现测试的方式**：JavaScript 的框架按文件名/目录约定
        自动找到测试；C++ 的测试是编译进可执行文件的 ——
        「有哪些测试」在编译时就定死了，没有运行期发现。
      python: |
        两边都有成熟的测试框架（`pytest` ↔ GoogleTest / Catch2），
        这一层可以对应。差别在**门槛**：Python 装个包、新建
        `test_*.py` 就能跑，框架自己发现测试；
        C++ 要引库、改构建脚本、把测试编成一个可执行文件，
        还要选一个运行入口（框架自带 main，或者接进 ctest）。
        另一处是反馈速度：Python 改完直接跑测试，
        C++ 每次都要重新编译（链接时间往往比测试本身还长）。
      java: |
        两边**形态上最像**：都有主流的第三方框架
        （JUnit ↔ GoogleTest）、都用注解/宏来标记测试、
        测试方法名就是描述。
        差别在两处：① Java 的测试发现是**运行时**的
        （JUnit 扫描类路径上的测试类），C++ 的测试是**编译期**
        就编进可执行文件的；② Java 的构建工具（Maven/Gradle）
        与测试集成是标配，C++ 的 CMake + ctest 要多写不少配置。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  assertions:
    code: |
      // @note C++ 里有**两种**断言，一个是运行期、一个是编译期

      // ① 运行期断言：来自 C 的 assert（<cassert>）
      #include <cassert>
      assert(add(1, 2) == 3);        // @note! 默认**是开的**（实跑确认）
      // @note 关掉它的唯一办法是定义 NDEBUG：
      //   g++ -DNDEBUG ...
      // @note! 注意：`NDEBUG` **不由标准库定义** ——
      // @note! 所以「release 构建自动关断言」是错的：
      // @note! 实测 -O2 不加 -DNDEBUG 时断言**照旧生效**
      // @note 失败时打印文件行号然后 abort（不是抛异常，抓不住）

      // ② 编译期断言：static_assert
      static_assert(sizeof(int) == 4, "这个平台 int 不是 4 字节");
      template <typename T> void f(T) {
        static_assert(std::is_integral_v<T>, "只接受整数类型");
      }
      // @note 这个在**编译期**检查，编译不过就是编译不过

      // @note 测试框架里的断言是另一套（EXPECT_EQ / REQUIRE 等），
      // @note 那些失败时会继续跑并汇总，比 assert 好用得多

      // @note! 所以「断言」在 C++ 里要分清三种：
      // @note   assert（运行期、默认开、失败即 abort）
      // @note   static_assert（编译期）
      // @note   测试框架的断言（不在标准库里）
    vs:
      javascript: |
        两边的姿态相反：JavaScript **没有语言级的断言语句**，
        平时用的 `console.assert` 或框架断言都是**一直生效**的库函数；
        C++ 有语言级的 `assert`，而且它的开关是一个宏
        （`NDEBUG`）—— 也就是说「断言在不在」取决于构建参数。
        另一处是失败行为：JavaScript 的断言不通过只是打印，
        程序继续跑；C++ 的 `assert` 失败直接 `abort`（进程终止，
        而且**抓不住**，它不是异常）。
      python: |
        **这一格是两边最容易搞反的**：Python 的断言
        **默认是开的**，要用 `-O` 才关掉；C++ 的 `assert`
        也**默认是开的**（实跑确认），要 `-DNDEBUG` 才关 ——
        两边默认值其实一样，但「怎么关」不同：Python 是解释器开关，
        C++ 是一个宏，而且**标准库不会替你定义它** ——
        这意味着「我用了 -O2 所以断言关了」是错的。
        另一处是 C++ 多了 `static_assert`（编译期断言），
        Python 里没有对应物。
      java: |
        两边都有断言、也都有开关，但**默认值相反**：
        Java 的 `assert` **默认是关的**（要 `-ea` 打开），
        所以生产代码里几乎不敢用；C++ 的 `assert` **默认是开的**，
        要 `-DNDEBUG` 关掉 —— 也就是说 C++ 里断言是真的会拦住你，
        Java 里它默认不存在。
        另一处是失败行为：Java 的 AssertionError 是个 Throwable
        （能被捕获、能带消息）；C++ 的 assert 直接 abort，
        只打印一行文件行号，抓不住也格式化不了。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  mocking:
    code: |
      // @note! C++ **没有任何内建的测试替身机制** —— 连接口都要自己写

      // 手工做法：面向接口编程 + 写一个假实现
      struct Clock { virtual ~Clock() = default; virtual int now() const = 0; };
      struct RealClock : Clock { int now() const override { return time(nullptr); } };
      struct FakeClock : Clock {                     // @note 测试替身：自己写
        int fixed = 1000;
        int now() const override { return fixed; }
      };

      // 用的时候注入
      int age(const Clock& c) { return c.now() - 500; }
      // 测试里：  FakeClock fake; EXPECT_EQ(age(fake), 500);

      // 自动生成替身靠第三方库：
      //   GoogleMock（gtest 的一部分）—— 用宏定义 mock 类
      //   trompeloeil、FakeIt 等

      // @note! C++ 的替身有两条别处没有的约束：
      // @note! ① **虚函数才能替** —— 非虚函数在编译期就绑定死了，
      // @note!    替身根本没机会介入（除非用链接期替换，很脏）
      // @note! ② **要能被注入** —— 代码里直接 `new RealClock()`
      // @note!    就没法替，必须改成从外面传进来
      // @note 所以 C++ 的可测性更多取决于**设计**，而不是框架能力

      // @note 链接期替换（用假实现换掉真实现）也能做，
      // @note 但它绕过了类型系统，通常只在对付遗留代码时用
    vs:
      javascript: |
        **两边的机制完全不同**：JavaScript 的替身是**运行期改对象**
        （把模块的方法换掉、给对象塞一个假属性），
        不需要接口、不需要虚函数、改完立刻生效；
        C++ 的替身必须**事先设计好**：要有虚函数（才能被重写）、
        要有注入点（才能换进去），两样缺一不可。
        所以那边「测不动就 mock 一下」是常态，
        这边得先重构代码让它可替换。
        另一处是 C++ 有自动生成替身的库（GoogleMock），
        但那个库是靠宏展开生成一个继承自接口的类。
      python: |
        两边都有「换掉外部依赖」的需求，但**成本差很多**：
        Python 用 `unittest.mock` 打补丁（`patch` 一个名字就行），
        或者干脆用一个假对象传进去，不需要接口；
        C++ 的替身必须继承一个接口、而且接口得是虚函数，
        代码还得支持注入 —— 也就是说 C++ 里「可测性」
        是设计出来的，Python 里很多时候是随手就有的。
        另一处是 Python 的 mock 能记录调用、能断言调用次数，
        这些在 C++ 里要第三方库才能有。
      java: |
        **两边形态最接近**：`Mockito` ↔ `GoogleMock`，
        而且**都靠接口 + 虚方法**（Java 的接口方法天然是虚的，
        C++ 要显式写 `virtual`）—— 这一层对应得上。
        差别在**自动生成的容易程度**：Java 的 Mockito 可以在
        **运行时**动态生成代理（不需要你写实现类），
        用起来一行 `mock(Foo.class)`；C++ 的 GoogleMock
        要**用宏写一个 mock 类**（编译期生成），代码量明显更多。
        另一处是 C++ 只能替虚函数，非虚函数没有机会介入。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  parameterized-tests:
    code: |
      // @note! C++ 没有语法级的参数化测试 —— 靠框架提供的机制

      // 最土也最常见的办法：**用数据驱动一个循环**
      struct Case { int input; int expected; };
      TEST(AddTest, AllCases) {
        for (auto [in, exp] : std::vector<Case>{{1,2},{2,3},{-1,0}}) {
          EXPECT_EQ(add(in, 1), exp);
        }
      }
      // @note! 缺点是失败时只看到循环里那一行，看不出是哪组数据

      // GoogleTest 提供了正式的写法（TEST_P + INSTANTIATE_TEST_SUITE_P）：
      //   class AddTest : public TestWithParam<Case> {};
      //   TEST_P(AddTest, Matches) { auto [in, exp] = GetParam(); ... }
      //   INSTANTIATE_TEST_SUITE_P(All, AddTest, Values(Case{1,2}, Case{2,3}));
      // @note 这样每组数据是**独立的测试用例**，失败信息会带上参数

      // Catch2 走的是另一条路：SECTION / GENERATE，写法更像自然语言
      // @note 实际项目里「循环驱动」用得非常多，因为它不需要懂框架的泛型机制

      // @note 别忘了一件事：参数化测试**每加一组数据都要重新编译** ——
      // @note 这是编译型语言绕不开的成本
    vs:
      javascript: |
        两边都能跑多组输入，但**在哪一层**不同：JavaScript 的
        `test.each` / `it.each` 是框架提供的**一等写法**
        （而且很多框架支持从表格里跑），失败时能明确指出是哪一行数据；
        C++ 里最常见的是自己写循环 —— 那会让一组数据失败
        只报「这一行断言错了」，看不出是哪组。
        另一处是 C++ 有框架级的参数化（GoogleTest 的 `TEST_P`），
        但它是靠泛型与宏搭出来的，学起来比 `test.each` 重得多。
      python: |
        两边都有参数化的写法（`@pytest.mark.parametrize` ↔
        GoogleTest 的 `TEST_P`），而且都会给每组数据单独报结果。
        差别在**声明方式**：Python 用装饰器把数据直接写在函数上方，
        一行一组、一目了然；C++ 要定义一个测试类、
        走 `TEST_P` 加 `INSTANTIATE_...` 三步，
        而且数据必须能作为模板参数传（类型要能拷贝）。
        另一处是 Python 的数据可以在列表字面量里随便写，
        C++ 里类型不匹配就是编译错误。
      java: |
        两边**高度对应**：JUnit 的 `@ParameterizedTest` +
        `@MethodSource` / `@CsvSource` ↔ GoogleTest 的 `TEST_P` +
        `INSTANTIATE_TEST_SUITE_P`，都是「同一段逻辑跑多组数据、
        每组单独报结果」。
        差别在数据来源的写法：Java 的 `@CsvSource` 能直接在注解里写表格，
        非常紧凑；C++ 的每组数据是一个对象字面量，
        而且要匹配测试类的类型参数，写起来啰嗦一些。
        另一处是两边都要**重新编译/重新加载**才能改数据，成本相近。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  coverage:
    code: |
      // @note C++ 的覆盖率靠**编译插桩** —— 与编译器配套的工具

      // ① 用 gcov：编译时插桩，运行时产出计数文件，再用 gcovr/lcov 汇总
      g++ --coverage -O0 src.cpp test.cpp -o tests
      ./tests
      gcovr -r . --html-details coverage.html

      // ② Clang 那边用 LLVM 的 source-based coverage（更准，但要 clang）
      // @note 本机只有 g++，所以走的是 gcov 这条路

      // ③ 接进 CI 就是「多一步编译参数 + 上报报告」
      //    大项目还会设覆盖率红线（低于阈值让流水线红）

      // @note! C++ 的覆盖率有两个别处没有的麻烦：
      // @note! ① **要重新编译** —— 插桩是编译期的事，
      // @note!    所以「跑覆盖率」和「跑正常测试」是两次构建
      // @note! ② **模板与内联会重复计数** —— 同一份模板代码
      // @note!    被多个编译单元实例化，覆盖率数字会被稀释
      // @note 所以 C++ 的覆盖率数字**只当参考**，不适合当硬指标

      // @note 另一类更有价值的「覆盖率」是**运行时检查**：
      // @note   -fsanitize=address,undefined 能在跑测试时抓出越界、
      // @note   悬垂、有符号溢出这些类型系统管不到的错 ——
      // @note   对 C++ 来说这比行覆盖率有用得多
    vs:
      javascript: |
        两边都能统计覆盖率，但**收集方式**不同：JavaScript 的覆盖率
        是引擎/工具在运行期采集的（不用改代码，也不影响构建）；
        C++ 的覆盖率**必须在编译时插桩** —— 也就是说
        「跑覆盖率」需要专门构建一次，产物也不同。
        另一处是 C++ 有一套**运行期检查**（sanitizer）能抓越界、
        悬垂、数据竞争这类问题，那些错误在 JavaScript 里
        本来就是明确的异常，不需要额外工具。
      python: |
        两边的差距在「要不要重新构建」：Python 的覆盖率工具
        （`coverage.py`）跟着解释器跑就行，不用改代码；
        C++ 的覆盖率是**编译期插桩**的产物，要单独构建一次。
        另一处是 C++ 的模板与内联会让覆盖率数字重复计数、
        不那么可信；Python 里没有这个问题。
        共同点是两边都把覆盖率当作参考而不是目标，
        只是 C++ 这边更明显（还有 sanitizer 这类更实在的替代品）。
      java: |
        两边**几乎完全对应**：Java 的 JaCoCo 也是**字节码插桩**
        （构建期或运行期挂 agent），C++ 的 gcov 是编译期插桩 ——
        都是「要在构建上做文章」，都会产出报告、都能接 CI 红线。
        差别在 C++ 的插桩会**改变产物**（要专门构建一次覆盖率版本），
        Java 的 JaCoCo 可以挂在正常构建上、用 agent 在运行时采集。
        另一处是 C++ 的模板实例化会让统计失真，Java 的泛型是擦除的、
        不存在这个问题。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
