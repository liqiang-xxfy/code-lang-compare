id: concepts-java/01-types
topicId: concepts-java
title: 类型与值
order: 1
summary: 语言的地基 —— 类型什么时候检查、数字怎么存、空值有几个、赋值到底传了什么
features:
  - id: concepts-java/type-system
    title: 类型系统
    kind: concept
    summary: 静态 + 强类型：编译期就拦住类型错误，代价是处处要写类型

  - id: concepts-java/numeric-type
    title: 数值类型
    kind: concept
    summary: 原始类型各有位宽，溢出静默回绕；要任意精度得换 BigInteger

  - id: concepts-java/null-value
    title: 空值
    kind: concept
    summary: 只有一个 null，但基本类型不能为它；包装类型拆箱那一刻才炸

  - id: concepts-java/value-semantics
    title: 值语义与引用语义
    kind: concept
    summary: 原始类型按值、对象按引用；包装类型的 == 比的是引用
