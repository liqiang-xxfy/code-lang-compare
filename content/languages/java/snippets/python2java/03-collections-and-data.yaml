      // @note! 字段固定的小结构应该用 record，而不是 Map<String, Object>
      record Employee(int id, String name, String dept) { }

      var e = new Employee(1, "Ada", "研发");
      e.name();                                 // @note 编译期就有类型
      // e.nmae();                              // 编译错误 —— 拼错当场发现

      Map<String, Object> bad = new HashMap<>();      // @note 这条路能走，但取出来是 Object
      bad.put("id", 1);
      int id = (int) bad.get("id");                   // @note! 每次都要强转，转错运行时才炸

      // @note 判据：这组字段固定吗？固定用 record，确实动态才用 Map
  - featureId: python2java/collections-exercise
    equivalence: analogous
    code: |
      record Employee(int id, String name, String dept) { }

      static Map<String, List<String>> groupByDept(List<Employee> employees) {
          Map<String, List<String>> groups = new HashMap<>();
          for (Employee e : employees) {
              groups.computeIfAbsent(e.dept(), k -> new ArrayList<>()).add(e.name());
              // @note! 没有 defaultdict，用 computeIfAbsent 代替 —— 它同样是"读一次就写入"
          }
          return groups;
      }
      // @note 空输入自然返回空 Map，不需要特判 —— 与 Python 的版本一致
