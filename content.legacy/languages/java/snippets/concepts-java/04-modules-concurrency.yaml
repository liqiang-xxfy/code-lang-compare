snippets:
  - featureId: concepts-java/module-system
    equivalence: identical
    code: |
      package com.example;         // 组织单位是包与类，一个公开类一个文件
      import java.util.List;       // import 只引用名字，不执行代码
    body: |
      Java 的组织单位是**包**（`package`）与**类**：一个 public 类一个文件，
      `import` 只是引用名字、不执行代码；依赖靠 classpath 在编译与运行期解析；
      Java 9 引入的模块系统（`module-info.java`）能进一步声明导出与依赖，但用得不算普遍。

  - featureId: concepts-java/memory
    equivalence: identical
    code: |
      Object o = new Object();     // JVM 分代回收，可达性决定生命周期
      o = null;                    // 没有引用计数，循环引用不是问题
    body: |
      Java 的 GC 在 **JVM 堆**上做分代回收（年轻代 / 老年代，多种收集器可选），
      你基本不干预，`finalize` 已弃用；对象生命周期由可达性决定，没有引用计数，
      循环引用不是问题。JVM 还有丰富的 GC 调优参数与堆监控工具。

  - featureId: concepts-java/concurrency-unit
    equivalence: identical
    code: |
      new Thread(task).start();                 // 线程真并行，多核同时跑
      ExecutorService pool = Executors.newFixedThreadPool(4);
      synchronized (lock) { /* 共享状态要自己加锁 */ }
    body: |
      Java 的线程是**真并行**的：多个线程可以在多个核上同时跑，用 `ExecutorService`
      管理线程池、用锁与 `synchronized` 处理共享状态的竞争，代价是**数据竞争**与内存
      可见性都要自己扛。近年还有虚拟线程（Java 21）降低高并发线程的成本。

  - featureId: concepts-java/async-model
    equivalence: identical
    code: |
      CompletableFuture.supplyAsync(() -> 1)
          .thenApply(x -> x + 1);               // 异步靠线程池与 Future
      Thread.sleep(100);                        // 会真的阻塞线程，与 await 不同
    body: |
      Java 传统上并发靠线程与线程池，异步用 `CompletableFuture` 串联（或 Reactive Streams
      那套），没有语言内建的「事件循环 + await」；Java 21 的虚拟线程让「用同步写法做
      高并发 I/O」成为主流选择。
