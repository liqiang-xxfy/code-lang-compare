  - featureId: python2java/concurrency-exercise
    equivalence: identical
    code: |
      import threading
      from concurrent.futures import ThreadPoolExecutor

      counter = 0

      def bump(n):
          global counter
          for _ in range(n):
              counter += 1        # @note! 在 CPython 里侥幸正确，但不该依赖

      with ThreadPoolExecutor(max_workers=4) as pool:
          for _ in range(4):
              pool.submit(bump, 1000)
      # with 退出时会等所有任务完成
      print(counter)
      # @note 迁到真并行的环境时，这一行会开始给出小于 4000 的数字
