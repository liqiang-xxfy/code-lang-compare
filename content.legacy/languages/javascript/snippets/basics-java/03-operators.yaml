      1 == "1";                   // @note! true —— 宽松相等会隐式转换
      1 === "1";                  // false —— 工程规范一律用 ===

      const s1 = new String("x");
      s1 === "x";                 // @note! false —— 对象比引用，这点与 Java 一致
