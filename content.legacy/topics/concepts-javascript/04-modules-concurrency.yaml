id: concepts-javascript/04-modules-concurrency
topicId: concepts-javascript
title: 模块、并发与内存
order: 4
summary: 代码怎么分文件、内存谁来收、同时干几件事时到底谁在跑
features:
  - id: concepts-javascript/module-system
    title: 模块系统
    kind: concept
    summary: ESM 的 import 静态提升，一个文件即一个模块，导出即绑定

  - id: concepts-javascript/memory
    title: 内存管理
    kind: concept
    summary: 标记清除式回收；主要泄漏源是闭包持有与忘记解绑的监听器

  - id: concepts-javascript/concurrency-unit
    title: 并发单元
    kind: concept
    summary: 事件循环加单线程，所有回调都在同一个线程上跑

  - id: concepts-javascript/async-model
    title: 异步模型
    kind: concept
    summary: 事件循环一直在跑，调用即开始，await 之后不需要谁去启动
