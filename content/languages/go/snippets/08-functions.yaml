- featureId: basics/arg-passing
  equivalence: analogous
  code: |
    func mutate(arr []int, num int, p *User, m map[string]int) {
        arr[0] = 99        // @note! 传染：切片共享底层数组
        num = 999          // @note 不传染：基本类型按值
        p.Name = "x"       // @note! 传染：通过指针改
        m["k"] = 1         // @note! 传染：map 是引用语义
    }

    // @note! 规则：Go 一切按值传递，但 slice / map / channel / 指针 的「值」
    //        本身就是描述符或地址，所以改内容会传染
    // @note 口诀与 JS 相同（改内容传染、改绑定不传染），
    //        但要多问一句「这个类型的值到底是个啥」
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
