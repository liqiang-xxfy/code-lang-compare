# Python 视角下的「数据与抽象」章节分组 —— 与 javascript.yaml 刻意不同。
#
# 三处按 Python 心智模型做的调整：
#   1. 「模块与**包**」—— Python 有 `__init__.py` 与包这一层，JS 只有文件与目录，
#      所以这一章要带着包讲。
#   2. 「异常与**资源管理**」—— `with` 是语言级的清理机制，不是 try/finally 的糖，
#      它在 Python 里的地位比在 JS 里高得多。
#   3. 「容器与**拷贝语义**」—— 浅拷贝 / 深拷贝 / 可变默认参数是 Python 特有的一组坑，
#      与「切片取的是视图还是副本」绑在一起讲。
#   4. 拆出「推导式与生成器」与「协议与多态」两章 —— 前者是 Python 最标志性的写法，
#      后者是 duck typing / ABC / Protocol 的家（Python 没有 `interface` 这个关键字）。

section: model
baseline: python

chapters:
  - id: packages
    title: 模块与包
    summary: import 会执行代码，包与 __init__ 的边界
    features: [module-unit, export-import, default-vs-named, namespace-alias, module-resolution]

  - id: errors
    title: 异常与资源管理
    summary: try / except / finally 与 with
    features: [throw-raise, try-catch, finally-cleanup, error-types, custom-error, error-propagation]

  - id: containers
    title: 容器与拷贝语义
    summary: list / dict / set / tuple，以及浅拷贝与深拷贝
    features: [list-array, map-dict, set, tuple-record, collection-mutability, slicing]

  - id: comprehensions
    title: 推导式与生成器
    summary: 批量构造、惰性求值与解包
    features: [generator-yield, comprehension, lazy-evaluation, destructuring]

  - id: objects
    title: 类与数据模型
    summary: __init__、实例属性与继承
    features: [class-declaration, constructor, fields-and-properties, methods-and-receiver, inheritance, access-control]

  - id: protocols
    title: 协议与多态
    summary: 鸭子类型、ABC 与多重继承
    features: [interface, abstract-class, mixin-trait, duck-typing]
