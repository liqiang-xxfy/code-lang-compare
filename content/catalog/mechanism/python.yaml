# Python 视角下的「语言机制」章节分组 —— 与 javascript.yaml 刻意不同。
#
# 三处按 Python 心智模型做的调整：
#   1. **泛型并入类型标注**（5 章而非 6 章）—— Python 的泛型就是标注体系的一部分
#      （TypeVar / Generic / `list[int]`），运行期同样不留痕，与静态检查器是同一件事。
#      JS 视角把它们分成两章，是因为 TS 的泛型有自己的型变规则要单独讲。
#   2. 「对象模型与内存」—— Python 讲的是引用计数 + 循环 GC + 可变对象的共享引用，
#      不是「什么时候会漏内存」。
#   3. 「GIL 与并发」—— 并发的第一句话是「同一时刻只有一个线程跑字节码」，
#      而不是「有没有线程」。

section: mechanism
baseline: python

chapters:
  - id: typing
    title: 类型标注与泛型
    summary: 动态运行期 + 可选的静态检查器，泛型写在标注里
    features: [static-vs-dynamic, type-annotation, structural-nominal, type-narrowing, null-safety, type-assertion, generic-declaration, generic-constraint, variance, type-erasure]

  - id: memory
    title: 对象模型与内存
    summary: 引用计数、循环 GC 与共享可变对象
    features: [value-vs-reference, garbage-collection, ownership-borrow, lifetime, weak-reference]

  - id: concurrency
    title: GIL 与并发
    summary: 线程、进程与 asyncio 的分工
    features: [concurrency-unit, shared-state, lock-mutex, channel, atomicity]

  - id: async
    title: 异步与事件循环
    summary: 协程、await 与任务取消
    features: [event-loop, callback, promise-future, async-await, cancellation]

  - id: meta
    title: 装饰器与元编程
    summary: 装饰器、描述符与动态求值
    features: [reflection, decorator-annotation, dynamic-eval, proxy-interception]
