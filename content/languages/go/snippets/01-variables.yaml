- featureId: basics/var-global-declaration
  equivalence: divergent
  code: |
    var counter = 0        // 包级变量

    func bump() {
        counter += 1       // @note 直接改包级变量，不需要任何声明
    }

    func shadow() {
        counter := 99      // @note! := 创建了新的局部变量，包级那个没被改
        fmt.Println(counter)
    }

    // @note Go 用「:= vs =」把「新建」和「赋值」在语法上分开了，
    //       所以不会出现 Python 那种「以为在改外层、其实创建了局部」的静默错误
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/var-shadowing
  equivalence: analogous
  code: |
    var value = 1

    func f() {
        value := 2           // @note := 遮蔽包级变量
        fmt.Println(value)   // 2
    }
    // 包级的 value 仍然是 1

    // @note! 最容易无意遮蔽的地方是 if / for 的短声明
    err := doA()
    if err := doB(); err != nil {   // 这是新的 err，前面那个没被改
        fmt.Println(err)
    }
    return err                      // 这里返回的还是 doA 的结果
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'
