snippets:
  - featureId: basics-java/var-declaration
    equivalence: identical
    code: |
      int count = 0;              // @note 类型先行；也可以先声明后赋值
      final String name = "Ada";  // final 冻结绑定
      var inferred = 1;           // @note! Java 10+ 的类型推断，类型仍在编译期定死，不是动态类型
    body: |
      Java 的声明是**类型先行**的：`int count = 0;` 先写类型再写名字，
      而且可以只声明不赋值（`int count;`），赋值留到后面。

      Java 10 起有了 `var count = 0;`，但它**只是局部变量的类型推断**，
      不是动态类型 —— 编译器仍然在编译期把类型定死，之后不能换。
  - featureId: basics-java/var-scope
    equivalence: identical
    code: |
      for (int i = 0; i < 3; i++) { }
      // i -> 编译错误：局部变量是块级的

      class Counter {
        private int total;   // @note 字段属于对象，与代码块无关，生命周期跟随实例
      }
    body: |
      Java 的**局部变量是块级**的：`for (int i = 0; ...)` 里的 `i` 出了循环就不可见，
      连"循环结束后读 i"都编译不过。

      字段则完全不同：它属于对象（或类），生命周期跟随实例，和代码块无关。
  - featureId: basics-java/hoisting
    equivalence: identical
    code: |
      class Config {
        int retry;           // @note 字段自动填默认值 0，声明后立刻可读
        String label;        // null
        boolean on;          // false
      }

      void run() {
        int local;
        System.out.println(local);   // @note! 编译错误：局部变量没有默认值
      }
    body: |
      Java 没有"提升"机制，但有一组容易被当成提升的规则：

      - **字段**会被自动填默认值（`0` / `0.0` / `false` / `null`），声明后立刻可读
      - **局部变量**没有默认值，读一个未初始化的局部变量是**编译错误**，不是运行时异常

      所以「未初始化」在 Java 里是被编译期直接挡掉的 —— 不需要靠约定或运行时报错兜底。
  - featureId: basics-java/const-immutability
    equivalence: identical
    code: |
      final List<String> xs = new ArrayList<>();
      xs.add("a");              // @note! final 拦不住这个：冻结的是绑定不是内容

      List<String> frozen = List.of("a", "b");   // @note 不可变靠类型
      record Point(int x, int y) { }             // record 的字段天然 final
    body: |
      `final` 限制的是**引用不能再指向别的对象**，不是对象内容不可变：

      ```java
      final List<String> xs = new ArrayList<>();
      xs.add("a");          // 合法 —— final 拦不住这个
      ```

      想让内容真正不可变，靠的是**类型本身不可变**：
      `String` 不可变，`List.of(...)` 返回不可变列表，`record` 的字段天然是 final 的。
  - featureId: basics-java/naming-convention
    equivalence: identical
    code: |
      int maxRetryCount = 3;        // 变量 camelCase
      class HttpClient { }          // 类 PascalCase
      static final int MAX_RETRY = 3;   // static final 常量 SCREAMING_SNAKE_CASE
    body: |
      这是唯一一处「纯风格、无语义」的差异，但迁移时满屏的命名不一致会显著增加阅读阻力。
      变量与方法用 `camelCase`、类用 `PascalCase`、`static final` 常量用
      `SCREAMING_SNAKE_CASE`。

      唯一带语义的一条是可见性：`private` / 包可见性在**语言层面**表达「谁能碰这个成员」，
      而不是一条命名约定。
  - featureId: basics-java/var-destructuring
    equivalence: identical
    code: |
      Point p = new Point(1, 2);
      int x = p.x();               // @note! 没有解构赋值，逐个访问

      if (p instanceof Point(int px, int py)) {   // @note Java 21 record pattern：
        System.out.println(px);                   //        是模式匹配，不是赋值语句
      }
    body: |
      Java **没有解构赋值**：`a, b = pair` 与 `const { name } = user` 都没有对应写法。
      取多个值只能逐个访问（`p.x()` / `p.y()`，或 `map.get("k")`）。

      Java 21 的 record pattern（`if (p instanceof Point(int x, int y))`）看起来接近，
      但它是**模式匹配**的一部分，只能出现在 `instanceof` / `switch` 的判断位置，
      不能当作赋值语句用。
  - featureId: basics-java/var-multiple-assign
    equivalence: identical
    code: |
      int a = 1, b = 2;
      int t = a; a = b; b = t;     // @note! 没有多重赋值，交换必须借临时变量

      int x, y;
      x = y = 0;                   // 链式赋值合法（赋值表达式的值就是赋进去的值）
    body: |
      Java 没有多重赋值语句，`a, b = b, a` 与 `[a, b] = [b, a]` 都不成立。
      交换两个变量必须写临时变量：

      ```java
      int t = a; a = b; b = t;
      ```

      链式赋值 `a = b = 0` 倒是合法（赋值表达式的值是赋进去的值），
      但它要求 `a` 与 `b` 类型兼容，而且右侧是可变对象时两个名字会指向同一个对象。
  - featureId: basics-java/var-global-declaration
    equivalence: identical
    code: |
      class Config {
        static int counter = 0;    // @note 没有全局变量，最接近的是 static 字段
        static void bump() { counter += 1; }
      }

      int base = 10;
      Function<Integer, Integer> f = v -> v + base;   // @note! 只能捕获 final / 事实不变的局部变量：
                                                      //         捕获的是值，不是变量绑定
    body: |
      Java 没有模块级全局变量，最接近的是 `static` 字段 —— 它属于类而不是实例，
      并且要显式通过类名访问（`Config.RETRY`）。

      更值得记住的是**闭包捕获规则**：lambda 与匿名内部类只能捕获
      `final` 或**事实不变**（effectively final，即赋值后从未再改）的局部变量。
      这不是限制而是设计：捕获的是**值**，不是变量本身。

      ```java
      int base = 10;
      Function<Integer, Integer> f = x -> x + base;   // 合法：base 之后没再改
      ```

      代价是循环里想捕获变化的量，必须自己造一个 final 副本。
  - featureId: basics-java/var-shadowing
    equivalence: identical
    code: |
      class User {
        private final String name;
        User(String name) { this.name = name; }   // @note 参数遮蔽字段，靠 this. 区分
      }

      void run() {
        int n = 1;
        // int n = 2;   // @note! 同一方法内重复声明同名局部变量是编译错误——语言层面直接拦住
      }
    body: |
      Java 允许局部变量遮蔽同名的**字段**，而且这是很常见的写法：

      ```java
      class User {
          private final String name;
          User(String name) { this.name = name; }   // 参数遮蔽了字段
      }
      ```

      用法上靠 `this.` 区分。需要注意的是局部变量之间**不允许**嵌套遮蔽 ——
      在内层块里声明与外层块同名的局部变量是编译错误。
      这条限制能挡掉一整类「看错变量」的 bug。
