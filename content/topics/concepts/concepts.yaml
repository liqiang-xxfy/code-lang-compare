# 心智模型对照（M4 横向工具）
# entries 是 N 列记录 —— 界面上的「两列对照」只是它的一个投影（JS 一列 + 其他列）
# 这样新增语言时不需要改数据结构（v1 的 {baseline, target} 两列结构装不下 7 语言）

- id: concept-package-manager
  concept: 包管理
  entries:
    javascript: { label: npm / pnpm, detail: 'package.json 声明 + node_modules 落地' }
    python: { label: pip / uv, detail: 'pyproject.toml 或 requirements.txt + venv 隔离' }
    arkts: { label: ohpm, detail: 'oh-package.json5，面向 HarmonyOS 生态' }

- id: concept-runner
  concept: 运行时
  entries:
    javascript: { label: Node.js / 浏览器引擎, detail: '事件循环驱动，单线程 + 异步 I/O' }
    python: { label: CPython 解释器, detail: 'GIL 限制下多线程不能并行跑 CPU 密集任务' }
    arkts: { label: ArkUI 引擎, detail: '非浏览器非 Node，声明式 UI 运行时' }

- id: concept-async
  concept: 异步模型
  entries:
    javascript: { label: Promise / async-await, detail: '微任务队列，天然单线程并发' }
    python: { label: asyncio / 协程, detail: '需要显式进入事件循环，async def + await' }

- id: concept-build
  concept: 构建工具
  entries:
    javascript: { label: Vite / webpack, detail: '打包 + 转换，产物面向浏览器' }
    python: { label: 通常不需要, detail: '解释执行；只有发布时才打包（build / wheel）' }

- id: concept-test
  concept: 测试框架
  entries:
    javascript: { label: Vitest / Jest, detail: 'test(''名'', () => {}) 风格' }
    python: { label: pytest, detail: 'def test_x(): assert ...，用 assert 而非 expect' }

- id: concept-lint
  concept: 代码检查与格式化
  entries:
    javascript: { label: ESLint + Prettier, detail: '规则可插拔，风格与检查分离' }
    python: { label: Ruff / Black, detail: '风格几乎不可配置，官方偏好唯一答案' }

- id: concept-repl
  concept: 交互式环境
  entries:
    javascript: { label: node / 浏览器控制台, detail: 'node 直接进 REPL' }
    python: { label: python / ipython, detail: 'python 直接进 REPL，无参数' }

- id: concept-null
  concept: 空值
  entries:
    javascript: { label: null + undefined, detail: '两种空值，判空噪音大' }
    python: { label: None, detail: '只有一种空值，用 is None 判断' }

- id: concept-collection
  concept: 常用集合
  entries:
    javascript: { label: Array / Object / Map / Set, detail: '对象字面量与 Map 语义不同' }
    python: { label: list / dict / set / tuple, detail: 'tuple 不可变，dict 有序（3.7+）' }

- id: concept-type-system
  concept: 类型系统
  entries:
    javascript: { label: 动态 + 弱类型, detail: '运行时类型，比较时隐式转换' }
    python: { label: 动态 + 强类型, detail: '运行时类型，但基本不做隐式转换' }
    arkts: { label: 静态 + 名义类型, detail: '禁用 any 与结构化类型，编译期强约束' }

- id: concept-memory
  concept: 内存管理
  entries:
    javascript: { label: 垃圾回收, detail: '标记清除；闭包是主要泄漏源' }
    python: { label: 引用计数 + 循环 GC, detail: 'del 只是减引用，不一定立即释放' }

- id: concept-value-semantics
  concept: 值语义与引用语义
  entries:
    javascript: { label: 原始值按值、对象按引用, detail: '对象赋值是共享同一份数据' }
    python: { label: 一切都是引用, detail: '连整数都是对象引用；可变默认参数是最经典的坑' }

- id: concept-module-system
  concept: 模块系统
  entries:
    javascript: { label: ESM import/export, detail: '一个文件即模块；import 是静态提升的' }
    python: { label: import / from ... import, detail: '一个 .py 是 module，含 __init__.py 的目录是 package' }

- id: concept-error-handling
  concept: 错误处理
  entries:
    javascript: { label: try/catch + Error 子类, detail: '可以 throw 任意值，catch 到的不一定是 Error' }
    python: { label: try/except + 异常类, detail: '只能抛 BaseException 子类；except 必须写类型' }

- id: concept-generics
  concept: 泛型
  entries:
    javascript: { label: 无（靠 TS）, detail: '运行时不保留类型参数，编译期擦除' }
    python: { label: typing.TypeVar, detail: '标注层面存在，运行时同样擦除' }

- id: concept-class
  concept: 类与继承
  entries:
    javascript: { label: class + 原型链, detail: '单继承，多态靠原型；私有字段用 #name' }
    python: { label: class + 多继承, detail: '支持多继承与 MRO；私有靠约定，没有真私有' }

- id: concept-interface
  concept: 接口与协议
  entries:
    javascript: { label: 无语言级概念, detail: '靠结构化类型隐式满足（TS 才引入 interface）' }
    python: { label: Protocol / ABC, detail: 'Protocol 是结构化，ABC 是名义式，两者都存在' }

- id: concept-immutability-data
  concept: 不可变数据
  entries:
    javascript: { label: Object.freeze（浅）, detail: '深冻结要递归；structuredClone 用于复制' }
    python: { label: tuple / frozenset, detail: '不可变是「类型属性」，可作为字典键' }

- id: concept-serialization
  concept: 序列化
  entries:
    javascript: { label: JSON.stringify / parse, detail: '静默丢弃函数与 undefined' }
    python: { label: json.dumps / loads, detail: '遇到非 JSON 类型抛 TypeError；中文默认被转义' }

- id: concept-date-time
  concept: 日期时间
  entries:
    javascript: { label: Date（可变、月从 0 起）, detail: '建议改用 Temporal 或 dayjs' }
    python: { label: datetime（不可变、月从 1 起）, detail: '带时区要显式 tzinfo，否则是 naive 时间' }

- id: concept-regex
  concept: 正则表达式
  entries:
    javascript: { label: /pattern/flags 字面量, detail: 'match 任意位置；命名分组 (?<name>...)' }
    python: { label: re 模块 + r 字符串, detail: 'match 只匹配开头；命名分组 (?P<name>...)' }

- id: concept-string-format
  concept: 字符串格式化
  entries:
    javascript: { label: 模板字符串 + toFixed, detail: '没有 printf 风格的语言级格式化' }
    python: { label: f-string + 格式说明符, detail: 'f"{n:.2f}" 表达力最强；另有 % 与 format' }

- id: concept-numeric-type
  concept: 数值类型
  entries:
    javascript: { label: number（统一 float64）+ BigInt, detail: '整数也是浮点，超出安全范围静默丢精度' }
    python: { label: int（任意精度）+ float + Decimal, detail: '整数不溢出；精确小数要 Decimal' }

- id: concept-testing-mock
  concept: 测试替身
  entries:
    javascript: { label: vi.fn / jest.mock, detail: '模块级 mock 需要提升，写法偏魔法' }
    python: { label: unittest.mock / monkeypatch, detail: '靠鸭子类型替换，通常更直白' }

- id: concept-concurrency-unit
  concept: 并发单元
  entries:
    javascript: { label: 事件循环 + Worker, detail: '主线程单线程；CPU 密集要靠 Worker 隔离' }
    python: { label: 线程 + 进程 + 协程, detail: 'GIL 使线程不能并行跑 CPU 任务，要 multiprocessing' }

- id: concept-dependency-isolation
  concept: 依赖隔离
  entries:
    javascript: { label: node_modules（就近查找）, detail: '同一依赖可能有多个版本共存' }
    python: { label: venv（全局一套）, detail: '同一个环境里同名包只能有一个版本' }

