  - featureId: js2python/resource-cleanup
    equivalence: divergent
    code: |
      with open(path) as f:            # @note! try/finally 整块消失
          data = f.read()

      with open(a) as f, open(b) as g: # @note 多个资源一行搞定
          pass

      # @note! 手写 finally 里 close 会吞掉原始异常，with 能正确处理这一点
      # @note 自定义成本很低：只要 __enter__ / __exit__，或者用 contextlib 包一个函数

      import contextlib
      @contextlib.contextmanager
      def timer():
          start = time.perf_counter()
          try:
              yield
          finally:
              print(time.perf_counter() - start)

      with timer():
          do_work()
  - featureId: js2python/errors-exercise
    equivalence: analogous
    code: |
      import json, time
      from pathlib import Path

      class ConfigError(Exception):
          pass

      def load_config(path, retries=3):
          last = None
          for i in range(retries):
              try:
                  with open(path) as f:        # @note! finally 那一整块没了
                      return json.load(f)
              except FileNotFoundError as e:
                  raise ConfigError(f"找不到配置：{path}") from e   # @note 不可重试：直接抛
              except (OSError, json.JSONDecodeError) as e:
                  last = e
                  time.sleep(0.1 * 2 ** i)
          else:
              raise ConfigError(f"重试 {retries} 次仍失败") from last
          # @note! for-else：循环跑完都没 break/return 才执行 ——
          # "没成功"这个出口不必再维护标志位

      # @note! 也可以写成 for 里 raise、循环外 raise last；
      # for-else 的写法把"没成功"与"某次成功了"分得更清楚
