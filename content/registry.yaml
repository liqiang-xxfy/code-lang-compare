# 内容注册表 —— 全局唯一开关与站点配置（v2 内容架构）
#
# 目标形态见 docs/完整项目架构.md。与 v1 的根本差别：
#   内容按**语言**组织，每门语言为每个基准各写一份差异解释；
#   清单分两层：feature 池（与基准无关）+ 每基准的章节分组。
#
# 语言「是否存在」由 content/languages/<id>/meta.yaml 的目录决定；
# 语言「是否启用」只由本文件决定（单一开关，避免与 meta 里的状态字段冲突）。

version: 3

# 发布策略（D-A / ADR-07）：
#   include-draft-with-badge —— draft 参与构建与搜索引擎索引，但页面必须显示「未经人工校对」
#   reviewed-only            —— 严格模式：draft 不进生产构建（校对迭代完成后切回）
publishPolicy: include-draft-with-badge

# 默认基准语言 —— 首访默认值与 SSG 静态文案使用这一门。
# 必须是已启用语言；「谁有资格当基准」由各语言 meta.yaml 的 baseline: true 决定。
# 基准固定为 JavaScript / Python / Java 三门，不再增减（ADR-47）。
defaultBaseline: javascript

# 默认对比语言 —— 首访时对比列默认选中的那一门。必须已启用且 ≠ 默认基准。
defaultCompareLanguage: python

# ── 指称同族组（R25 的唯一例外）────────────────────────────────────────
# 同组语言**互相点名不算「屏幕外的语言」**。判据按两门算：一格的说明里提到 M
# 是合法的，只要 M 与「本语言」或「该格面对的基准」同族。
#
# 为什么需要它：JavaScript 与 TypeScript 在读者眼里是同一套生态的两面 ——
# 「JavaScript 自己没有泛型，要靠 TypeScript」这句话里，TypeScript 不是屏幕上
# 冒出来的第三门语言，而是那一列本身的两个层次。2026-10-03 启用 TypeScript 时
# 实测：既有五门语言的内容里有 53 处这样的句子，按逐字点名的字面规则全会被报成
# 幽灵语言；改写成「另一门静态超集」不会让读者更明白，只会让说明变含糊。
#
# 成员是**语言目录名**；R8 会核对它们确实已登记。成员不必都已启用 ——
# 未启用的成员本来就不参与检测（R25 的词表只收已启用语言）。
#
# 刻意**不**把 ArkTS 放进来：它不是 JavaScript 的超集，是一门独立的语言，
# 讲 JavaScript 时提到它确实是屏幕外的另一门语言。
mentionGroups:
  - [javascript, typescript]

site:
  name: 编程语言对照手册
  shortDescription: 选一门基准语言，勾选若干对比语言，并排看每门语言和基准差在哪。默认以 JavaScript 为基准。

# ── 语言 ──────────────────────────────────────────────────────────────
# **本段的书写顺序就是界面上的显示顺序**（ADR-58）：
# 基准语言在前（JS → Python → Java，与 `baseline: true` 的声明序一致），
# 对比语言在后（go → rust → …）。基准选择器、对比语言勾选条、矩阵列、
# 首页三张基准卡都读这个次序，不另设 order 字段。
#
# 曾经按目录名字母序排：界面上就成了 Java / JS / Py，Go 排在 Python 前面 ——
# 读起来是随机的。顺序是给人看的，就该由人写。
languages:
  javascript:
    enabled: true
  python:
    enabled: true
  java:
    enabled: true
  go:
    enabled: true
  rust:
    enabled: true
  typescript:
    enabled: false
  arkts:
    enabled: false
  kotlin:
    enabled: false
  swift:
    enabled: false
  dart:
    enabled: false
  cpp:
    enabled: false
  php:
    enabled: false

# ── 板块注册表 ────────────────────────────────────────────────────────
# 板块的**唯一真源**：左栏分组、URL 段、页面标题、语言控件形态、SEO 文案
# 全部由这里派生。加一个板块 = 在这里加一条（+ content/catalog/<板块>/），
# 不改散落的代码。
#
# 三个属性刻意分开声明，**不能互相推导**：
#   shape   数据形态。chapter = 有章节的并排矩阵；list = 一页列表资源
#   scope   baseline = 以基准语言为参照、对比列可多选；pair = 锁定「基准→目标」两门
#   columns 语言控件形态。multi = 多选并排（矩阵）；single = 单选（一篇文章）
#
# 分界依据（第四版，见 docs/完整项目架构.md §2.4）：按**迁移者先关心什么**重划 ——
#   express   能读懂对方在写什么
#   model     能照着改写
#   mechanism 敢动它（换语言必须重学的机制集中在这里）
#   practice  能落地（换工具、但概念不变的部分）
#
# 命名刻意是主题式的，不是「第一课 / 第二课」：本站是查阅型地图而非教程，
# 四个板块表达的是关注点而非阅读顺序。
sections:
  # 顺序即左栏顺序。四个章节型板块之后是速查三兄弟（按症状与术语查）。
  express:
    order: 1
    label: 基础表达
    title: 基础表达
    shape: chapter
    scope: baseline
    columns: multi
    # 站点落点：从「我要迁移」进来的用户，最该先看到的是一格一格的对照
    landing: true
    # SEO 模板一律用引号包起来：**以 `{` 开头的普通标量会被 YAML 当成流式映射**。
    # {compared} = 已启用语言里除基准之外的语言名（对比列由页内多选决定，这里是确定性的全集）
    # {chapterTitle} 取**该基准**的章节分组里的标题 —— 章节名随基准变（§2.5）
    seo:
      title: "以 {baseline} 为基准 · {chapterTitle}"
      description: "{chapterTitle}：{sample} —— 以 {baseline} 为参照系，对照 {compared} 的写法与行为差异。"

  model:
    order: 2
    label: 数据与抽象
    title: 数据与抽象
    shape: chapter
    scope: baseline
    columns: multi
    seo:
      title: "以 {baseline} 为基准 · {chapterTitle}"
      description: "{chapterTitle}：{sample} —— 从 {baseline} 的视角，对照 {compared} 在模块、错误与对象模型上的差异。"

  mechanism:
    order: 3
    label: 语言机制
    title: 语言机制
    shape: chapter
    scope: baseline
    columns: multi
    seo:
      title: "以 {baseline} 为基准 · {chapterTitle}"
      description: "{chapterTitle}：{sample} —— 换语言必须重学的机制，以 {baseline} 为参照对照 {compared}。"

  practice:
    order: 4
    label: 工程实践
    title: 工程实践
    shape: chapter
    scope: baseline
    columns: multi
    seo:
      title: "以 {baseline} 为基准 · {chapterTitle}"
      description: "{chapterTitle}：{sample} —— 换语言要换的那套工具，以 {baseline} 为参照对照 {compared}。"

  # ── 速查三兄弟：唯一保留方向性的内容（ADR-45）──────────────────────
  # 它们的主语是**方向**，不是语言 ——「带着 JS 习惯写 Python 会踩的坑」
  # 换成「Python 的坑」就丢掉了最有价值的那半句。内容在 content/pairs/<基准>2<目标>/
  pitfalls:
    order: 5
    label: 迁移陷阱
    title: 迁移陷阱
    shape: list
    scope: pair
    columns: single
    # 列表型板块：取自 PairPayload 的哪个字段，以及用哪个渲染器
    dataKey: pitfalls
    renderer: pitfalls
    seo:
      title: "{direction} 迁移陷阱"
      description: "带着 {baseline} 的习惯写 {target} 会踩的 {count} 个坑：{sample}。"
      # {sample} 取前几条 —— 默认 8，这里沿用原先的 5
      sampleLimit: 5

  glossary:
    order: 6
    label: 速语词典
    title: 速语词典
    shape: list
    scope: pair
    columns: single
    dataKey: glossary
    renderer: glossary
    seo:
      title: "{direction} 速语词典"
      description: "从 {baseline} 出发最容易误解的 {count} 个术语：{sample}。"

  roadmap:
    order: 7
    label: 迁移学习路线
    title: 迁移学习路线
    shape: list
    scope: pair
    columns: single
    dataKey: roadmaps
    renderer: roadmap
    seo:
      title: "{direction} 学习路线"
      description: "从 {baseline} 迁移到 {target} 的 {count} 个阶段：目标、时长与验收标准。"

# v2 取消了 topic 概念：章节与 feature 的归属由 content/catalog/ 表达，
# 方向的归属由 content/pairs/ 的目录名表达 —— 注册表里不再有对应字段。
