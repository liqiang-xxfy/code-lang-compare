  - featureId: basics-python/string-regex
    equivalence: analogous
    code: |
      java.util.regex.Pattern p = java.util.regex.Pattern.compile("\\d+");
      java.util.regex.Matcher m = p.matcher("a1");

      m.matches();                 // @note! false —— matches() 是**整串**匹配，不是从开头
      m.find();                    // @note true —— 任意位置查找，对应 re.search
      m.lookingAt();               // @note true —— 从开头匹配，才对应 re.match
      m.group();                   // "1"

      java.util.regex.Pattern.compile("(?<y>\\d{4})").matcher("2026").group("y");
      "a@b".replaceAll("(\\w+)@(\\w+)", "$2@$1");   // @note! 替换引用用 $1，不是 \1
      // @note 反斜杠一律双写：没有原始字符串可用
