# javascript —— express / values
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: values` 的那批：
# literals / type-inference / null-and-undefined / type-conversion。
#
# `vs.<基准>` 写的是**这个语言自己的行为**，措辞落在对方读者认得的参照物上 ——
# 读者以 Python 为基准看 JS 这一列时，他要的是「JS 这边会怎样」，不是「Python 怎样」。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-values-v1
    generatedAt: '2026-10-03'

boxes:
  literals:
    code: |
      const n = 42;                     // @note 数字只有一种：都是双精度浮点
      const big = 9007199254740993n;    // @note 超出安全整数范围要加 n 后缀用 BigInt
      const s = 'text';                 // @note 单双引号等价
      const t = `你好，${name}`;         // @note 反引号可以插值
      const obj = { a: 1 };             // @note 对象字面量
      const xs = [1, 2];                // @note 数组字面量
    baseline: |
      数字不分整型与浮点，全是 IEEE 754 双精度 —— `1` 与 `1.0` 是同一个值。
      超出安全整数范围（2^53-1）就得用 `BigInt`（后缀 `n`），否则大整数会悄悄丢精度。
      字符串三种引号，只有反引号那种能插值。对象与数组字面量是最主要的两种复合值。
    vs:
      python: |
        Python 的整型是任意精度，`10 ** 100` 照样精确；JavaScript 的数字都是双精度浮点，
        大整数会静默丢精度 —— 要精确必须显式写 BigInt（后缀 `n`），而 BigInt 与普通
        数字不能混算。
      java: |
        Java 的数字按宽度分成 `int` / `long` / `double` 等，字面量默认是 `int`，
        超出范围要加后缀（`L` / `f`）。JavaScript 只有一种数字类型，写起来省事，
        代价是大整数丢精度、整数除法得到小数。
    equivalence:
      python: divergent
      java: divergent

  type-inference:
    code: |
      let n = 42;          // @note 不写类型 —— 类型跟着值走
      typeof n;            // @note "number"，运行时才能查
      n = "now a string";  // @note! 合法：变量本身没有类型约束
    baseline: |
      声明时不写类型，类型属于**值**而不属于名字 —— 同一个 `let` 可以先后装数字与
      字符串。想知道类型只能在运行时用 `typeof` / `instanceof` 查。
      想要静态检查得另加一层 TypeScript，那是编译期的事，运行时不留下痕迹。
    vs:
      python: |
        Python 的语言层面也没有类型约束，但标注是语法的一部分：`def f(x: int) -> str`
        写得出来，只是解释器不检查。JavaScript 连标注语法都没有 ——
        想要静态类型必须换 TypeScript 这种超集。
      java: |
        Java 是静态类型：类型写在声明上，编译器全程检查，`var` 只是让编译器替你推断
        而推断结果仍然是固定的。JavaScript 的 `let` 可以先后装不同类型，
        这种写法在 Java 里根本编译不过。
    equivalence:
      python: analogous
      java: divergent

  null-and-undefined:
    code: |
      let a;               // @note undefined —— 声明了但还没有值
      const b = null;      // @note null —— 有意表示「这里是空的」
      a == b;              // @note! true —— 松散相等把两者视为一样
      a === b;             // @note false —— 严格相等能区分它们
      obj.missing;         // @note undefined —— 不存在的属性也是它
    baseline: |
      有**两种**空：`undefined` 是「还没有值」（未初始化的变量、缺失的属性、
      没有 return 的函数），`null` 是「有意为空」。它们松散相等为真、严格相等为假，
      这是 `==` 最著名的坑之一。可选链 `?.` 与空值合并 `??` 都只对这两者生效。
    vs:
      python: |
        Python 只有一种空值 `None`，「还没赋值」与「有意为空」不做区分 ——
        未定义的变量是 NameError，不是某个空值。JavaScript 分成 undefined 与 null
        两种，判断时要分清是「没有这个属性」还是「属性值就是空」。
      java: |
        Java 也只有 `null` 一种，而且它可以是任何引用类型的值 —— 编译器不会提醒你
        某个变量可能是空的。JavaScript 多一个 undefined，但两边共通的坑是一样的：
        把空值当成有值用，要到运行时才炸。
    equivalence:
      python: divergent
      java: divergent

  type-conversion:
    code: |
      "1" + 1;             // @note! "11" —— 有字符串就是拼接
      "3" * 2;             // @note! 6 —— 但别的运算符会把字符串转成数字
      Number("12px");      // @note NaN —— 显式转换失败给 NaN，不抛错
      1 == "1";            // @note! true —— 松散相等会先转换类型
      [] + {};             // @note! "[object Object]" —— 两边都被转成字符串
    baseline: |
      **隐式转换到处发生**：`+` 只要有一边是字符串就拼接，其余算术运算符却把字符串
      转成数字；`==` 在比较前先做类型转换，`===` 不做。转换失败给 `NaN` 而不是抛错，
      于是错误会一路漂到很远的地方才显形。真值判断也走隐式转换：
      `""` / `0` / `NaN` / `null` / `undefined` 为假，其余为真。
    vs:
      python: |
        Python 基本不做隐式转换：`1 + "a"` 直接抛 TypeError，`"1" == 1` 是 False
        而不是先转换再比较。JavaScript 的隐式转换是两边最需要提防的差异 ——
        它不报错，只是给出另一个值。
      java: |
        Java 只在数值类型之间做隐式拓宽（`int` 能自动变 `long` / `double`），
        数字与字符串之间必须显式写 `Integer.parseInt` / `String.valueOf`。
        JavaScript 把「字符串与数字」这条线也隐式跨过去了，代价是
        `"1" + 1` 得到字符串、`"3" * 2` 得到数字。
    equivalence:
      python: divergent
      java: divergent
