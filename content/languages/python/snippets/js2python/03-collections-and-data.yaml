  - featureId: js2python/list-model
    equivalence: analogous
    code: |
      xs = [1, 2, 3, 4, 5]
      xs[1:3]                      # @note [2, 3] —— 同样是浅拷贝，这条两边一致
      xs[-1]                       # @note! 5 —— 负索引原生支持，不必 at()
      xs[::2]                      # @note! 步长 —— JS 完全没有
      xs[::-1]                     # @note 一行反转

      xs[99]                       # @note! IndexError —— 越界**抛异常**，不像 JS 给 undefined
      xs[99:]                      # @note [] —— 切片越界反而静默
      # @note! 同一个列表上两种行为并存：索引抛、切片静默。
      # JS 里两者都静默，所以迁过来时容易以为切片也会抛

      xs.append(4)                 # @note push
      xs.pop()
      del xs[1:3]                  # @note splice 要拆成 del 切片或 insert + pop
