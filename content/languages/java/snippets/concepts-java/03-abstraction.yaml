snippets:
  - featureId: concepts-java/class-inheritance
    equivalence: identical
    code: |
      class Base { private int secret = 1; }        // private 是编译期强制的真私有
      class Sub extends Base implements Runnable {  // 单继承 + 多接口
          public void run() {}
      }
    body: |
      **类 + 接口** —— 单一继承但可多接口；`private` 是真私有，
      `this` 隐式且始终指向当前实例。

  - featureId: concepts-java/interface
    equivalence: identical
    code: |
      interface Renderable {              // 接口是中心概念
          String toText();
          default boolean empty() { return false; }   // default 方法
      }
    body: |
      **interface** —— 一个类可实现多个接口，接口可有 `default` 方法、
      可以是函数式接口，编译器会检查实现是否完整。

  - featureId: concepts-java/generics
    equivalence: identical
    code: |
      List<String> list = new ArrayList<>();   // 泛型在编译期检查
      list.getClass();                         // 运行期都是 ArrayList —— 擦除
    body: |
      **泛型（运行时擦除）** —— 有类型参数、边界与通配符；
      `List<String>` 与 `List<Integer>` 运行期都是 `List`。

  - featureId: concepts-java/error-handling
    equivalence: identical
    code: |
      void read() throws IOException { }   // 受检异常写进签名，编译器强制处理
      try { read(); }
      catch (IOException e) { }            // 只能抛 Throwable 的子类
    body: |
      **try/catch + 受检异常** —— 只能抛 `Throwable` 子类；
      受检异常把「必须处理」写进签名，编辑器强制调用方处理或声明。
