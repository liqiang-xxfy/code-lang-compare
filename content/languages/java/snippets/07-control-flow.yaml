- featureId: basics/range-iteration
  equivalence: divergent
  code: |
    IntStream.range(0, 5);         // 0,1,2,3,4    —— @note 半开区间（不含右端）
    IntStream.rangeClosed(0, 5);   // 0,1,2,3,4,5  —— @note 闭区间

    for (int i : IntStream.range(0, 5).toArray()) { }

    // @note! Java 没有语言级的区间语法（不存在 0..5），必须显式调用 IntStream
    // @note 啰嗦程度和 JS 的 Array.from({length:n}) 差不多，都不如 Python 的 range()
  review:
    state: draft
    provenance:
