snippets:
  - featureId: concepts-java/package-manager
    equivalence: identical
    code: |
      <!-- pom.xml 里用坐标声明依赖，由构建工具解析 -->
      <dependency>
        <groupId>com.google.guava</groupId>
        <artifactId>guava</artifactId>
        <version>33.0.0-jre</version>
      </dependency>
    body: |
      Java 的包管理由**构建工具**承担：Maven 用 `pom.xml`、Gradle 用 `build.gradle`，
      依赖用坐标（`groupId:artifactId:version`）从中央仓库拉 JAR，工具负责传递依赖解析；
      编译期与运行期共享同一份 classpath；多依赖之间的版本冲突靠 `dependencyManagement`
      集中仲裁。

  - featureId: concepts-java/dependency-isolation
    equivalence: identical
    code: |
      // classpath 扁平：同一个类加载器下一个类名只能有一个版本
      // 冲突时用 dependencyManagement 仲裁，或 shading 改名重打包
    body: |
      Java 的 classpath 是**扁平**的：同一个类加载器下，一个类名只能对应一个版本，
      多版本共存要靠类加载器隔离或 shading（把依赖改名重打包）。这正是「classpath 地狱」
      的根源 —— 两个库要求同一依赖的不同版本时，只能选一个。解决要么靠类加载器隔离，
      要么靠 shading 把依赖改名重打包，两种都不轻松。

  - featureId: concepts-java/runner
    equivalence: identical
    code: |
      // javac 编译成字节码 → JVM 解释执行 + JIT 即时编译热点代码
      // 跨平台，代价是启动慢、内存占用大
    body: |
      Java 的运行时是 **JVM**：源码编译成字节码，JVM 负责解释执行与 **JIT** 即时编译
      （热点代码编译成机器码，所以「跑热了更快」），字节码带来跨平台；代价是启动慢、
      内存占用大。

  - featureId: concepts-java/build-tool
    equivalence: identical
    code: |
      mvn package        // 编译 + 测试 + 打包，产出 JAR
      // 构建工具即项目骨架：依赖、编译、测试、发布都在里面声明
    body: |
      Java 的「构建」是**编译**：`javac` 把源码编成字节码。Maven / Gradle 不只是打包器，
      而是项目的骨架 —— 依赖、编译、测试、打包、发布都在里面声明，产出 JAR / WAR。
      不编译就没法运行。

  - featureId: concepts-java/test-framework
    equivalence: identical
    code: |
      @Test
      void adds() {
          assertEquals(2, 1 + 1);   // 断言是静态方法，发现靠注解
      }
    body: |
      Java 的测试是 **JUnit 5**：方法上标 `@Test`，断言用 `assertEquals` / `assertThrows`
      这类静态方法（或 AssertJ 的流式断言），测试发现靠**注解**，可以在注解上参数化、分组。

  - featureId: concepts-java/testing-mock
    equivalence: identical
    code: |
      @Mock UserRepo repo;
      @InjectMocks UserService service;   // 依赖是注入的，替换替身很自然
      when(repo.find(1)).thenReturn(user);
    body: |
      Java 的 mock 主流是 **Mockito**：`@Mock` / `@InjectMocks` 靠字节码生成代理，
      能验证调用次数与参数；静态方法与构造器 mock 需要额外能力（mockito-inline），
      Spring 那套还能靠容器注入替身。依赖通常作为字段或构造参数注入，替换它们很自然。

  - featureId: concepts-java/lint-format
    equivalence: identical
    code: |
      // Checkstyle 管风格、SpotBugs / Error Prone 管缺陷
      // Spotless 集成构建，格式化用 google-java-format
    body: |
      Java 的检查工具是分类的：Checkstyle 管风格、SpotBugs / Error Prone 管缺陷，
      格式化用 google-java-format（配 Spotless 集成进构建），通常由 Maven / Gradle 插件
      在构建时执行、失败就阻断。

  - featureId: concepts-java/repl
    equivalence: identical
    code: |
      jshell
      jshell> int n = 1 + 1
      n ==> 2
    body: |
      Java 9 起有 `jshell` 可以交互式求值，但 Java 的编译加类型系统让 REPL 的手感不如
      动态语言顺 —— 很多「一段话验证一个语法」的事，在 Java 里更常靠写个小类跑。
