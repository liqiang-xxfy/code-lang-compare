id: concepts-java/05-toolchain
topicId: concepts-java
title: 工具链与生态
order: 5
summary: 装包、跑起来、测、查、格式化 —— 迁移后每天都要用的那一套
features:
  - id: concepts-java/package-manager
    title: 包管理
    kind: concept
    summary: 构建工具兼管依赖、拉的是 JAR vs 独立的 npm 生态、拉的是源码包

  - id: concepts-java/dependency-isolation
    title: 依赖隔离
    kind: concept
    summary: classpath 扁平、一个类名只能一个版本 vs node_modules 就近查找、多版本共存

  - id: concepts-java/runner
    title: 运行时
    kind: concept
    summary: JVM 字节码加 JIT、跑热了更快 vs 浏览器与 Node 两个引擎、各给各的 API

  - id: concepts-java/build-tool
    title: 构建工具
    kind: concept
    summary: 构建等于编译、工具即项目骨架 vs 不构建也能跑、工具面向发布与浏览器

  - id: concepts-java/test-framework
    title: 测试框架
    kind: concept
    summary: JUnit 的注解加静态断言 vs describe/it/expect，发现方式也换了

  - id: concepts-java/testing-mock
    title: 测试替身
    kind: concept
    summary: 依赖是注入的、替换很自然 vs 依赖是模块导入的、ESM 绑定换不动

  - id: concepts-java/lint-format
    title: 代码检查与格式化
    kind: concept
    summary: 检查与格式化常是各自独立的工具 vs ESLint + Prettier 可插拔组合

  - id: concepts-java/repl
    title: 交互式环境
    kind: concept
    summary: jshell 能用但手感一般；到 JS 里随手验证变成了几秒钟的事
