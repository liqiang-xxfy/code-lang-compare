# Java 视角下的「语言机制」章节分组 —— 与 javascript.yaml / python.yaml 又一套。
#
# 三处按 Java 心智模型做的调整：
#   1. 「类型系统」的第一句话是**静态且写在源码里**（不是可选标注），
#      空安全靠 `@Nullable` 那类工具与 Optional，不是类型的一部分。
#   2. 「泛型与擦除」独立成章 —— 擦除带来的后果（不能 `new T[]`、不能 `instanceof List<String>`、
#      不能重载 `f(List<String>)` 与 `f(List<Integer>)`）是 Java 里必须单独讲的一课。
#   3. 「JVM 与内存模型」讲的是堆栈划分、GC 分代与 happens-before，
#      不是 Python 的引用计数、也不是 JS 的「GC 兜底」。
#   `ownership-borrow` / `lifetime` 在 Java 视角里保留为行（「本语言没有所有权」），
#   因为读者正是在这里第一次听说 Rust 的那套东西。

section: mechanism
baseline: java

chapters:
  - id: types
    title: 类型系统
    summary: 静态检查、装箱与空安全的边界
    features: [static-vs-dynamic, type-annotation, structural-nominal, type-narrowing, null-safety, type-assertion]

  - id: generics
    title: 泛型与类型擦除
    summary: 编译期强约束、运行期抹掉
    features: [generic-declaration, generic-constraint, variance, type-erasure]

  - id: memory
    title: JVM 与内存模型
    summary: 堆与栈、GC 分代与 happens-before
    features: [value-vs-reference, garbage-collection, ownership-borrow, lifetime, weak-reference]

  - id: concurrency
    title: 线程与并发工具
    summary: 线程、锁、并发容器与 CompletableFuture
    features: [concurrency-unit, shared-state, lock-mutex, channel, atomicity]

  - id: async
    title: 异步
    summary: Future、CompletableFuture 与虚拟线程
    features: [event-loop, callback, promise-future, async-await, cancellation]

  - id: meta
    title: 注解与反射
    summary: 运行期读取类型信息与注解处理
    features: [reflection, decorator-annotation, dynamic-eval, proxy-interception]
