  - featureId: basics-python/fstring-format
    equivalence: analogous
    code: |
      String.format("%.2f", 3.14159);      // @note "3.14" —— printf 风格
      String.format("%08.2f", 3.14159);    // @note "00003.14" —— 同样有总宽度概念
      String.format("%,d", 1234567);       // @note "1,234,567"（依赖默认区域）
      String.format("%x", 255);            // "ff"
      String.format("%.1f%%", 12.3);       // @note 百分号要自己写进格式串

      // @note 规格串是运行时字符串，可以动态拼 —— 这点比 Python 的 f-string 灵活；
      // 但参数顺序靠位置，参数一多就容易错位
