# java —— basics/03-operators 的实现
# 上下文：片段默认位于类的方法体内。⚠️ 本机无 JDK，未做执行验证，待补校对。

- featureId: basics/equality
  equivalence: divergent
  code: |
    Integer a = 1000, b = 1000;
    a == b;              // @note! false —— == 比的是引用（对象身份）
    a.equals(b);         // true  —— 比的是内容

    Integer c = 100, d = 100;
    c == d;              // @note! true —— 小整数有缓存（-128..127），最容易骗到人的区域

    int x = 1, y = 1;
    x == y;              // true —— 基本类型的 == 就是比值

    // @note! 记一条就够：引用类型比内容一律用 equals()，
    //        == 只用于基本类型、以及「判断是不是同一个对象」
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/arithmetic
  equivalence: divergent
  code: |
    7 / 2;      // 3     —— @note! 整数相除直接截断（JS 给 3.5）
    7 % 2;      // 1
    -7 % 2;     // -1    —— @note 符号跟被除数走（与 JS 同，与 Python 反）
    7.0 / 2;    // 3.5   —— 只要有一边是浮点就按浮点算

    // @note! 从 JS 过来最容易忽略的一条：7/2 在这里是 3，不是 3.5
  review:
