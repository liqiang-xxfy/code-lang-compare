      static int counter = 0;
      static void bump() { counter += 1; }        // @note! 真并行下会丢更新 —— 读、加、写三步不原子

      Thread t = new Thread(() -> work());        // @note! 有真线程，而且共享内存
      t.start(); t.join();

      try (var pool = java.util.concurrent.Executors.newFixedThreadPool(4)) {   // @note 池化是常规做法
          for (int i = 0; i < 10; i++) pool.submit(() -> work());
      }

      // @note! "这段代码在 JS 里跑得好好的"是**无效证据** —— 那边根本没有真并行
      // @note 三样 JS 里不存在的问题：丢更新、ConcurrentModificationException、可见性
  - featureId: js2java/async-model
    equivalence: divergent
    code: |
      var r = java.util.concurrent.CompletableFuture
              .supplyAsync(() -> fetch(url))
              .thenApply(String::trim)
              .exceptionally(e -> "默认");
      r.join();                                   // @note! 阻塞取结果

      var all = java.util.concurrent.CompletableFuture.allOf(f1, f2, f3);

      // @note! 没有 await 语法糖：多步组合之后很难一眼看出执行顺序
      // @note! thenApply 里抛的异常不会当场抛出，而是变成"完成异常"，到 join 时才浮出来 ——
      // 与 JS 的 await 把 rejection 抛在那一行相比，定位难度差很多
      // @note 底层是真实线程池（默认 ForkJoinPool.commonPool），不是同一个事件循环
