# typescript —— practice / testing
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: testing` 的那批：
# test-framework / assertions / mocking / parameterized-tests / coverage。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：测试这一侧与 JavaScript 共用同一批框架，差别集中在**类型**上 ——
# 测试代码也要过类型检查、全局函数的类型要有来源、替身要满足被替者的形状。
# 另有一条贯穿全组、也与 toolchain 呼应的事实：**覆盖率与类型检查是两回事**，
# 覆盖率达标不代表类型正确。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-testing-v1
    generatedAt: '2026-10-03'

boxes:
  test-framework:
    code: |
      // 框架要自己挑，两类主流选择：
      //   与构建同源的那个（原生 ESM、配置与打包共用）
      //   历史更久的那个（走转译管道，生态与插件更多）
      // @note 运行时自带的测试运行器也能跑 TypeScript，小项目可以零依赖

      // @note! 这里比纯 JavaScript 项目多一件事：**测试代码也要过类型检查**，
      // @note! 所以「描述 / 用例 / 断言」这些全局函数的类型要有来源 ——
      // @note! 要么装框架的类型包，要么把它的类型加进配置的全局类型里

      // 测试文件的位置由框架的匹配规则决定（默认按文件名后缀找）
    vs:
      javascript: |
        同一批框架都能用，命令行也一样。差别全在**类型这一侧**：
        测试代码要过类型检查，全局函数（描述、用例、断言）的类型得有来源；
        测试替身还要满足被替换者的形状。
        收益是「用例写错了、替身签名不对」这类问题在编译期就暴露，
        代价是测试目录也要进类型检查的范围，跑得慢一些。
      python: |
        两边都要选框架（那边的标准库自带一个、主流用第三方；这里全靠第三方
        或运行时自带）。差别在类型：那边的标注不影响运行，
        测试写错了要到跑起来才知道；这里**测试代码也在检查范围内**，
        替身的类型不对根本跑不起来。
        所以在这边，测试与生产代码是同一套类型规则的受益者与受害者。
      java: |
        两边都是第三方框架（或运行时自带），都按约定发现用例。
        差别在**全局函数的类型来源**：那边靠静态导入断言类，
        编辑器自然知道它们是什么；这里框架把描述与断言挂成全局，
        类型要额外声明一次，否则编译器不认识这些名字。
        这是从纯 JavaScript 项目切过来时最容易卡住的一步。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  assertions:
    code: |
      expect(add(1, 2)).toBe(3);                     // @note 同一个值（原始值或同一个引用）
      expect(user).toEqual({ name: "Ada" });         // @note 逐层比较内容
      expect(user).toStrictEqual({ name: "Ada" });   // @note 更严：多出的空字段也算不同
      expect(() => parse("")).toThrow();             // @note 抛错

      // @note 取反、以及「断言一定会抛」这类都有对应写法
      // @note! 断言的目标类型来自被断言的值 —— 拿错字段、参数写反，
      // @note! 编译期就能发现（这在这件事上确实帮得上忙）
    vs:
      javascript: |
        同一套断言 API（连方法名都一样），这里多一层类型检查。
        用处很具体：断言里写错字段名、传错类型的期望值，
        在那边要跑起来才报错，这里编译期就被拦下。
        代价是期望值也得写对类型 —— 想断言一个「本来就不该是那个类型」
        的东西，得先把它断言成宽类型，这里会啰嗦一点。
      python: |
        两边风格不同：那边一个流派用**裸断言语句加表达式**，
        失败时由框架重写断言、给出详细的差异对比；
        这里与另一个流派是方法链式调用，失败信息由断言方法提供。
        共同点是都不靠「把两个值打印出来自己看」。
        类型上这边的收益更明显：那边断言写错只有跑起来才知道。
      java: |
        两边都是断言方法，命名也相近。差别在**比较的分档**：
        这里有「同一个值」「内容相等」「连类型与多余字段都算」三档，
        测对象时可以按需要挑；那边相等与不等两种为主，
        需要深比较时往往要自己实现相等性判断。
        测复杂对象时，这个分档带来的体感差别很大。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  mocking:
    code: |
      // 两个主流框架的替身 API 几乎一样，下面是其中一套：
      const fake = vi.fn();                    // @note 造一个假函数
      vi.spyOn(obj, "method");                 // @note 监视并可选替换某个方法
      vi.mock("./module");                     // @note 整个模块换掉

      // @note! 模块替换的调用会被**提升到文件顶部** ——
      // @note! 所以替换工厂里用不了文件里其他变量（有专门的绕过写法）
      // @note 这里比纯 JavaScript 多一层：假函数与假模块的形状要满足类型，
      // @note 写错了编译期就报错

      // @note 两套框架有一处已知差异：其中一套的替换工厂允许是异步的
    vs:
      javascript: |
        同一套 API，差别在类型：假函数、被替换的模块、监视的方法，
        形状都要对得上，写错了编译不过。
        好处是「替身与被替的东西长得不一样」这类错误提前暴露；
        坏处是要给替身补类型，简单的场景也得写几行。
      python: |
        那边能在运行时给任何属性打补丁，包括模块里的自由函数；
        这里同样能替换整个模块，但替换是按**导入路径**指定的，
        而不是按名字去改一个已经存在的对象。
        两边都能校验调用次数与参数。差别在时机：
        那边的补丁可以事后加、随意撤销，这里的替换在文件顶部就定了。
      java: |
        那边的打桩库靠动态代理与字节码增强，因此能给**只有接口、
        没有实现**的类型生成替身；这里的替身是假函数与模块替换，
        总得有个真实存在的东西可以替。
        两边都有「指定返回值 + 校验调用次数」这一套，形态接近，
        差别在替身从哪来：一边是凭空生成，一边是先有实物再换掉。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  parameterized-tests:
    code: |
      test.each([
        ["42", 42],
        ["-7", -7],
        ["", 0],
      ])("parse(%s) = %i", (input, want) => {
        expect(parse(input)).toBe(want);
      });

      // @note 用例名里的占位符与参数一一对应（字符串与数字各有符号）
      // @note 失败时用例名带参数值，一眼看出是哪一组
      // @note! 回调参数的类型由表格**推断**出来 ——
      // @note! 表里的列数或类型写错了，编译期就报错
    vs:
      javascript: |
        同一个 API。这里的收益是**表格与回调的类型自动对上**：
        表里每行几项、什么类型，回调参数就按那个推断；
        行里少写一项、类型不符，编译期就报错。
        在那边这类错误要跑到测试才暴露 —— 对一张几十行的用例表来说，
        这个差别不小。
      python: |
        两边都是「同一段逻辑跑多组输入」，写法不同：
        那边用装饰器声明，多个装饰器叠加会做成笛卡尔积；
        这里用带表格的调用，写的是一张表，一行一组。
        都能给用例命名、都能单跑某一组。
        类型上这里更严：表格里的列要与回调参数对得上。
      java: |
        两边都能声明一组用例并逐个报告。差别在**数据能不能算出来**：
        那边的用例来源可以指向一个方法，因此用例能由代码动态生成；
        这里的表格是字面量，更紧凑但不能算。
        组合爆炸的场景那边更合适，「一堆固定的输入输出对照」这里更顺手。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  coverage:
    code: |
      // 覆盖率住在**测试运行器自己的配置**里，与编译器无关
      //   一套用的是运行时自带的统计（默认，不用插桩）
      //   另一套用的是传统插桩方案
      // @note 两者都能设阈值，低于阈值让流水线失败

      // @note! 覆盖率工具同样**不做类型检查** —— 它只统计跑过哪些代码
      // @note! 所以「覆盖率 100%」与「类型正确」是两件互相独立的事，
      // @note! 流水线上这两步要分别跑
    vs:
      javascript: |
        完全同一套：同一批工具、同样的配置位置、同样的阈值机制。
        这一格两边没有差别 —— 类型那一层不参与覆盖率统计。
      python: |
        两边都是测试运行器的能力，都能出报告、都能设阈值卡流水线。
        差别在配置摆在哪（那边通常在专门的配置段里，
        这里就在测试运行器的配置对象里）。
        共同点是两边都要记住：覆盖率不检查类型，
        它只回答「哪些代码被执行过」。
      java: |
        那边的覆盖率要靠插件接进构建工具才有报告；
        这里住在测试运行器的配置里，与构建工具无关。
        两边都把覆盖率当成流水线的一道门（可设阈值），
        也都不等价于类型正确 —— 这一点在两边都容易被当成一回事。
    equivalence:
      javascript: identical
      python: analogous
      java: analogous
