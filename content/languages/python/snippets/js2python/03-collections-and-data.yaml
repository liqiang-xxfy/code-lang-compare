  - featureId: js2python/collections-exercise
    equivalence: analogous
    code: |
      from collections import defaultdict
      from dataclasses import dataclass

      @dataclass(frozen=True)
      class Employee:
          name: str
          dept: str
          age: int

      def group_by_dept(employees):
          groups = defaultdict(list)
          for e in employees:
              groups[e.dept].append(e.name)     # @note! 对应 JS 的 (groups[k] ??= []).push(...)
          return dict(groups)                   # @note! 不转会留下"读一次就多一个空组"的痕迹

      def avg_age(employees):
          if not employees:
              return 0
          total = sum(e.age for e in employees)
          return total / len(employees)         # @note / 天然是浮点，不需要额外转换

      # @note 空输入自然返回 {}；sum 是内置的，不必自己 reduce
