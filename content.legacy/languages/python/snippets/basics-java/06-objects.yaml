  - featureId: basics-java/object-access
    equivalence: divergent
    code: |
      d = {"a": 1}
      d["a"]                       # 1
      d["z"]                       # @note! KeyError —— 缺失当场抛，不是返回 null
      d.get("z")                   # None —— 想容忍缺失才用 get
      d.get("z", 0)                # 0 —— 对应 getOrDefault
      "z" in d                     # False

      d.a                          # @note! AttributeError —— 点号找的是属性，不是字典的键
      # @note 于是也没有"值本身是 None 时分不出来"那个问题：缺失是异常，None 是值
  - featureId: basics-java/object-iterate
    equivalence: analogous
    code: |
      for k, v in d.items():       # @note 直接给 (key, value) 元组，比 entrySet 短
          pass
      for k in d:                  # 默认遍历键
          pass
      for v in d.values():
          pass

      # @note! 顺序由语言保证是**插入顺序**（3.7+），不需要选实现类
      for k in d:
          del d[k]                 # @note! RuntimeError: dictionary changed size
      for k in list(d):            # 要改就遍历副本
          del d[k]
  - featureId: basics-java/object-default
    equivalence: analogous
    code: |
      d.get(k, 0)                  # @note 只读，不写入 —— 对应 getOrDefault
      d.setdefault(k, [])          # @note! 读取的同时会写入

      from collections import defaultdict
      groups = defaultdict(list)
      groups[k].append(v)          # @note! 读一次就建好 —— 对应 computeIfAbsent

      # @note 这边的判断依据不是名字而是类型：get 只读，defaultdict / setdefault 会写；
      # Java 那边看名字里有没有 get
  - featureId: basics-java/object-merge
    equivalence: divergent
    code: |
      merged = {**a, **b}          # @note! 新字典，b 覆盖 a —— 一行
      merged = a | b               # 3.9+，同样的语义，更短
      a.update(b)                  # @note! 原地改，返回 None
      a = a.update(b)              # @note! 经典错误：a 现在成了 None

      # @note Java 只有 putAll 那种原地合并；这边两种意图各有各的写法
      # @note | 对嵌套是浅合并：同名的键整体替换，不递归
  - featureId: basics-java/object-nested
    equivalence: analogous
    code: |
      b = dict(a)                  # @note 浅拷贝
      b = a.copy()                 # 同上
      b = {**a}                    # 同上

      a2 = {"cfg": {"retry": 3}}
      b2 = dict(a2)
      b2["cfg"]["retry"] = 5       # @note! a2 也变了 —— 内层还是同一个对象

      import copy
      c = copy.deepcopy(a2)        # @note! 有内置深拷贝，Java 那边完全没有

      # @note 浅拷贝至少有一行写法（Java 要手写复制构造），深拷贝也有标准答案
  - featureId: basics-java/object-comprehension
