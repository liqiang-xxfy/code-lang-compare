# arkts —— model / objects
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: objects` 的那批：
# class-declaration / constructor / fields-and-properties / methods-and-receiver /
# inheritance / access-control。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被算作屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：ArkTS 的类与继承与语法相近的那门静态方言高度同形，本文件只写**能核实**的
# 差别 —— 结构化的对象字面量被禁用（必须对应已声明的类或接口）、字段与参数要带类型、
# this 的运行时语义不变。拿不准的细节（参数属性、修饰符的运行期行为）一律不编造；
# 写不出差异的格子如实标 identical / analogous 并附一句短说明，不灌水。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-objects-v1
    generatedAt: '2026-10-03'

boxes:
  class-declaration:
    code: |
      class User {                      // @note 与 JavaScript 的 class 同形
        name: string = "";              // @note 字段要声明类型（或由初值推断）
        constructor(name: string) { this.name = name; }
        greet(): string { return "hi"; }
      }

      interface Point { x: number; y: number }
      const p: Point = { x: 1, y: 2 };  // @note 对象字面量必须对上已声明的类型
      // const loose = { x: 1 };        // @note! 编译错误：结构化类型被禁用
      // @note! 形状对上还不够 —— 类型认名字，不认「恰好长得一样」
    vs:
      javascript: |
        class 关键字与对象字面量的写法都继承自 JavaScript，同形。实质差别有两条：字段要带
        类型（推不出来就报错），以及**结构化类型被禁用** —— JavaScript 可以随手写 { x: 1 }
        造一个没有名字的形状，ArkTS 要求对象字面量对应到已经声明的类或接口，否则编译不过。
        「形状恰好一样就算同一个类型」这件事在这里不成立。
      python: |
        Python 的类是运行时对象、实例能随时长属性；ArkTS 的类是编译期的类型，字段在写代码时
        就固定。Python 常拿 dict 当「临时结构」用，ArkTS 没有这种便利：要一个具名的类或接口，
        形状得先有名字。另一处是 Python 的类能动态创建，ArkTS 的类在编译期就定死。
      java: |
        Java 的类是类型、字段必须声明，这一点两边一致，并且都按名字判断类型（名义类型）。
        差别在 Java 的类在运行时可查（反射能拿到字段与方法），ArkTS 的类型标注编译后落到同一
        套运行时对象模型上、不可查。另一处是 Java 有匿名类可一次性覆写接口，ArkTS 的对象
        字面量必须落到一个具名类型上。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  constructor:
    code: |
      class User {
        name: string = "";
        constructor(name: string)                // @note 重载签名：只声明，不实现
        constructor(id: number)
        constructor(v: string | number) {        // @note 唯一的实现体
          this.name = typeof v === "string" ? v : `#${v}`;
        }
        static from(name: string): User { return new User(name); }   // @note 另一种造法：静态工厂
      }

      const u = new User("Ada");          // @note 按参数匹配合适的签名
      const w = new User(42);
      // @note! 形状相同的字面量不能冒充 —— 类型对不对由名字决定
    vs:
      javascript: |
        constructor 与 JavaScript 同形，运行时的构造过程也一致。ArkTS 加的是类型那一层：
        参数与字段都要有类型，new 出来的对象类型固定，形状相同的字面量不能冒充。
        另外它可以写重载签名（多个签名头配一个实现体），由编译期按参数挑一种解释 ——
        这一条 JavaScript 没有，那边只能在运行时靠参数个数与类型自己判断。
      python: |
        Python 的 __init__ 只是初始化钩子（对象已经造好），ArkTS 的 constructor 是唯一入口、
        「造对象」与「初始化」合成一步。两边都能做替代构造：Python 用命名不同的类方法，ArkTS
        用静态工厂。差别在检查时机：Python 的参数类型运行时不生效，ArkTS 的参数写错编译不过。
      java: |
        Java 的构造函数可以重载、能用 this(...) 串到另一个；ArkTS 只有一个 constructor，多种
        构造靠静态工厂与默认参数。相同点是两边都在编译期检查构造参数的类型、字段都要声明。
        差别是 Java 的字段有默认值、初始化顺序有明确规定。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  fields-and-properties:
    code: |
      class User {
        name: string = "匿名";            // @note 实例字段要写类型（或由初值推断）
        static count: number = 0;         // @note 静态字段挂在类上，全类共享一份

        get display(): string { return this.name.toUpperCase(); }   // @note getter
        set display(v: string) { this.name = v.trim(); }            // @note setter
      }

      const u = new User();
      u.display;                          // @note 像属性一样读，背后调了 getter
      u.name = "Ada";                     // @note 赋值时类型要对得上
      // @note 字段必须在类里声明，不能随手加一个
    vs:
      javascript: |
        字段、get / set、static 的写法都继承自 JavaScript，同形。差别是每个字段要带类型、必须
        在类体里声明（推不出来就报错）。运行时的属性读写与 getter / setter 行为两边一致，ArkTS
        加的是编译期那一层检查。
      python: |
        两边都能定义「像属性一样访问、背后跑方法」的东西（Python 是 @property，ArkTS 是
        get / set）。差别在字段的声明与归属：Python 的实例属性随手赋就创建、类属性与实例属性
        共用一条查找链；ArkTS 的字段要在类里声明类型，static 明确挂在类上。Python 没有编译期
        的只读，ArkTS 的字段类型写错直接出不了包。
      java: |
        Java 没有属性（property）这种东西：字段就是字段、getter 就是方法、调用点必须带括号；
        ArkTS 可以写 obj.name 而背后跑的是 getter，调用点看不出区别。字段声明两边都强调，
        只是 Java 的字段有默认值、不写初值也不会是 undefined。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  methods-and-receiver:
    code: |
      class Counter {
        n: number = 0;
        bump(): void { this.n++; }                     // @note this 由调用方式决定（与 JavaScript 同）
        bumpArrow: () => void = () => { this.n++; };   // @note 箭头函数字段：this 绑在实例上
      }

      const c = new Counter();
      const f = c.bump;
      f();                                             // @note! this 丢 —— 运行时行为与 JavaScript 一样
      // @note 惯用规避也是箭头函数字段，两边一致
    vs:
      javascript: |
        this 的规则完全一样、由调用方式决定：方法取出来单独调用就丢，惯用的规避也是箭头函数
        字段。ArkTS 不改运行时语义，这一格两边实质相同，差别只在方法要带类型标注。
      python: |
        Python 的 self 是显式参数、在取属性时就绑定好，方法当回调传出去完全安全；ArkTS 的
        this 靠调用方式决定，得靠箭头函数字段兜住 —— 这是两边读代码时最要换脑子的一处。
        Python 用 @classmethod / @staticmethod 区分接收者，ArkTS 没有运行时层面的对应。
      java: |
        Java 的 this 恒等于当前实例，方法引用取出来接收者也绑定好了，不存在丢接收者这回事；
        ArkTS 的 this 是动态的，要靠箭头函数字段补救。两边在「接收者会不会丢」上答案相反。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  inheritance:
    code: |
      class Animal {
        speak(): string { return "..."; }
      }
      class Dog extends Animal {                       // @note 单继承
        speak(): string { return super.speak() + " 汪"; }   // @note super 调父类方法
      }

      interface Swimmer { swim(): void; }
      class Duck extends Animal implements Swimmer {   // @note 可以实现多个接口
        swim(): void { }
      }
      // @note! 只继承一个类 —— 多份能力靠接口或组合
    vs:
      javascript: |
        继承与 JavaScript 同形：单继承、extends、super，底层仍是同一套对象模型。ArkTS 加的是
        接口与 implements：能声明「必须实现哪些方法」并在编译期检查，但这一层运行时不落地。
        去掉类型之后就是 JavaScript 的单继承。
      python: |
        Python 支持多继承并用 MRO 裁决冲突，ArkTS 只能单继承，多份能力走接口这条路（接口编译
        后消失）。两边的继承本质也不同：Python 是类与类的父子关系，ArkTS 底层是原型链。
        Python 的 mixin 是运行时真的混入方法，ArkTS 的接口不携带实现。
      java: |
        Java 的类单继承、可以实现多个接口，表面上和 ArkTS 很像。差别是 Java 的接口是运行时
        实体（能反射、带默认方法时能给实现），ArkTS 的接口只是编译期契约、不携带实现。另一处
        是根类型：Java 的类隐式继承 `Object`，ArkTS 的类可以不写父类 —— 但底层仍是
        原型链、根上同样是 `Object`，差的只是「要不要显式写出来」。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  access-control:
    code: |
      class Account {
        owner: string = "";                 // @note 不写修饰符时成员默认可见
        private balance: number = 0;        // @note 修饰符由编译器在编译期检查

        deposit(n: number): void { this.balance += n; }
        getBalance(): number { return this.balance; }
      }
      const a = new Account();
      // a.balance;                       // @note! 类外访问私有成员编译不过
      a.getBalance();                     // @note 走公开方法读
    vs:
      javascript: |
        JavaScript 没有可见性修饰符，默认全公开，只有 # 是真私有；ArkTS 用编译期的修饰符表达
        「谁能看见」，默认仍是公开。JavaScript 的 # 在运行时就不可见，ArkTS 的修饰符是编译器
        在编译期拦下的那一道。
      python: |
        Python 的「私有」只有下划线约定，语言不强制，双下划线也只是改名；ArkTS 的修饰符由
        编译器执行，类外访问直接编译不过。强度不同：一个「编译器拦」，一个「谁都不拦」。
      java: |
        Java 的 private 由编译器强制，与 ArkTS 的可见性修饰符是同一档做法 —— 都在编译期管住
        「谁能看见」。差别在默认值：Java 每个成员都要选一个可见性、不写是包内可见；ArkTS 不写
        就是公开。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
