# javascript —— basics-python/01-variables 的实现
#
# 注意本文件与 01..08 的区别：那些文件里 JavaScript 是**基准**，
# 这里它是**被对照的那一门**，所以 equivalence 描述的是「相对 Python 基准」的差异。
# 属性：以 Python 为基准看 JavaScript 的变量模型。
