# 迁移学习路线 —— JavaScript → Go
# 骨架期样板：先列三个阶段，后续按同形态细化

- id: js2go-1-mental-model
  order: 1
  title: 先接受「没有异常、没有类继承」
  durationHint: 2-3 小时
  todo:
    - 通读「心智模型」板块，把两边在这些根本差异上的映射建起来
    - 只回答四个问题（答案在「心智模型」板块里）：类型系统、并发模型、错误处理、值语义 vs 引用语义
    - 明确写下「哪些 JS 直觉必须丢掉」——try/catch 兜底、原型继承、对象即字典
  acceptance:
    - 能说清 `(T, error)` 与 throw 在控制流上的区别
    - 知道 Go 的接口是隐式满足的，不需要 implements
  resources:
    - label: Go 官方教程（Tour of Go）
      url: https://go.dev/tour/

- id: js2go-2-basics
  order: 2
  title: 基础语法逐条对照
  durationHint: 3-5 天
  todo:
    - 按基础语法板块的章节逐格对比，每看一格手写一遍两边的代码（不要复制）
    - 把踩到的坑记进本方向的迁移陷阱清单并打上自己的严重度
    - 练习把一段 JS 的数组链式调用改写成 Go 的循环（Go 没有 map/filter）
  acceptance:
    - 能独立写出变量、切片、map、控制流、函数，无编译错误
    - 能解释 slice 与数组的区别，以及 append 为什么常常要重新赋值
  resources:
    - label: Effective Go
      url: https://go.dev/doc/effective_go

- id: js2go-3-tooling
  order: 3
  title: 接上工具链与工程习惯
  durationHint: 1 周
  todo:
    - 建一个 module（go mod init）并跑通 build / test / vet 三步
    - 把 npm 的心智映射到 Go modules 与 go get
    - 用 gofmt 固定格式，体会「格式没有争论」带来的协作收益
  acceptance:
    - 能独立新建一个 module 并产出可执行文件
    - 能读懂编译错误与 `go vet` 的提示定位问题
  resources:
    - label: Go Modules 参考
      url: https://go.dev/ref/mod
