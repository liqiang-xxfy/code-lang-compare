id: concepts-python/02-data
topicId: concepts-python
title: 数据与字符串
order: 2
summary: 装数据的容器、不可变的那一套、文本与时间的处理方式
features:
  - id: concepts-python/collections
    title: 常用集合
    kind: concept
    summary: 你的 dict 是任意键的映射，JS 的对象字面量只是「字符串键的映射」

  - id: concepts-python/immutable-data
    title: 不可变数据
    kind: concept
    summary: 不可变在 Python 是类型属性，在 JS 只是一次运行时的浅冻结

  - id: concepts-python/string-format
    title: 字符串格式化
    kind: concept
    summary: f-string 内嵌一门格式小语言，JS 只有模板字符串加方法调用

  - id: concepts-python/regex
    title: 正则表达式
    kind: concept
    summary: re.match 只匹配开头，于是你对「match 是任意位置」这件事有错误直觉

  - id: concepts-python/serialization
    title: 序列化
    kind: concept
    summary: json 遇到不认识的类型抛错，JS 的 JSON 静默丢字段 —— 后者难查得多

  - id: concepts-python/date-time
    title: 日期时间
    kind: concept
    summary: datetime 不可变、月从 1 起；JS 的 Date 可变、月从 0 起，两个差异叠在一起最坑
