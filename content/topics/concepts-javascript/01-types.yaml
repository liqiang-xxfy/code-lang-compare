id: concepts-javascript/01-types
topicId: concepts-javascript
title: 类型与值
order: 1
summary: 语言的地基 —— 类型怎么绑、数字怎么存、空值有几个、赋值到底传了什么
features:
  - id: concepts-javascript/type-system
    title: 类型系统
    kind: concept
    summary: 两边都是动态类型，但一边比较时会偷偷转换，另一边不会

  - id: concepts-javascript/numeric-type
    title: 数值类型
    kind: concept
    summary: 一个 number 打天下 vs int / float / Decimal 三分，精度行为完全不同

  - id: concepts-javascript/null-value
    title: 空值
    kind: concept
    summary: 两个空值 vs 一个空值，判空写法的噪音量差一倍

  - id: concepts-javascript/value-semantics
    title: 值语义与引用语义
    kind: concept
    summary: 「传引用还是传值」这个问题两边都问错了，真正要问的是「什么可变」
