  - featureId: basics-javascript/string-methods
    equivalence: identical
    code: |
      "  hi  ".trim();               // 'hi'
      "abc".includes("b");           // true   —— @note 返回布尔
      "abc".indexOf("b");            // 1      —— @note 找不到返回 -1
      "a,b".split(",");              // ['a', 'b']
      "ab".padStart(4, "0");         // '00ab'
      "ab".toUpperCase();            // 'AB'

