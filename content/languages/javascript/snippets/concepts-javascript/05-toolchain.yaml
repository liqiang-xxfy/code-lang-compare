snippets:
  - featureId: concepts-javascript/package-manager
    equivalence: identical
    code: |
      npm install lodash
      npm install -D vitest
      npx vitest
    body: |
      JS 用 `package.json` 声明依赖 + `node_modules` 落地，锁文件是
      `package-lock.json` / `pnpm-lock.yaml`；锁文件是标配，
      「拉到的到底是哪一版」有确定的答案。

  - featureId: concepts-javascript/dependency-isolation
    equivalence: identical
    code: |
      // node_modules 就近查找：同一个库的不同版本可以共存
      node_modules/a/node_modules/lodash
      node_modules/lodash
    body: |
      JS 的 `node_modules` **就近查找**：不同的包可以各自依赖同一库的
      不同版本，互不干扰（代价是体积与「到底装了哪个版本」的困惑）。

  - featureId: concepts-javascript/runner
    equivalence: identical
    code: |
      // 同一份写法在两端 API 不同
      fetch("/api");        // 浏览器与 Node 18+ 都有，但 fs / DOM 各只有一边有
    body: |
      JS 的运行时是分裂的：浏览器引擎与 Node 各有各的 API（`fetch`、
      `fs`、DOM），「这段代码在哪跑」是一个必须时刻意识到的问题，
      并由此衍生出打包、转译、polyfill 一整套工具。

      换来的是「同一份逻辑前后端共享」这个 JS 特有的能力。

  - featureId: concepts-javascript/build-tool
    equivalence: identical
    code: |
      npm run build      // 打包 + 转译 + 压缩，产物面向浏览器
      // 浏览器不能直接跑 node_modules 与最新语法，所以这一步是必备的
    body: |
      JS 的构建是**标配**：打包、转译、压缩、tree-shaking，
      因为浏览器不能直接跑 `node_modules` 与最新的语法。

  - featureId: concepts-javascript/test-framework
    equivalence: identical
    code: |
      import { test, expect } from "vitest";
      test("加法", () => { expect(1 + 1).toBe(2); });
    body: |
      JS 的测试是「描述 + 回调」风格：`test('名', () => { expect(x).toBe(y) })`，
      框架提供 `describe` / `it` / `expect` 一整套词汇，断言要挑对匹配器
      （`toBe` / `toEqual` / `toStrictEqual` 各有各的语义）。

  - featureId: concepts-javascript/testing-mock
    equivalence: identical
    code: |
      vi.mock("./api", () => ({ fetchUser: vi.fn() }));   // 提升到 import 之前
      const spy = vi.fn().mockReturnValue(1);
    body: |
      JS 的模块 mock（`jest.mock` / `vi.mock`）需要**提升到 import 之前**，
      写法上偏魔法，且对 ESM 的支持一直有坑 —— 模块绑定只读，替换不动。

  - featureId: concepts-javascript/lint-format
    equivalence: identical
    code: |
      npx eslint .        # 规则可插拔，报什么级别都能配
      npx prettier --write .
    body: |
      JS 的 ESLint 是**规则可插拔**的：检查什么、报什么级别都能配，
      风格交给 Prettier，两者刻意分离，于是社区里每个项目一套配置 ——
      换一个项目就得先读一遍它的规则。

  - featureId: concepts-javascript/repl
    equivalence: identical
    code: |
      node
      > [1, 2, 3].map((x) => x * 2)
      [ 2, 4, 6 ]
    body: |
      JS 用 `node` 进 REPL，或在浏览器控制台里试，不用建项目、不用写文件。
