id: concepts-python/05-toolchain
topicId: concepts-python
title: 工具链与生态
order: 5
summary: 装包、跑起来、测、查、格式化 —— 迁移后每天都要用的那一套
features:
  - id: concepts-python/package-manager
    title: 包管理
    kind: concept
    summary: pip 只管装包、与构建分离；依赖锁定默认较弱

  - id: concepts-python/dependency-isolation
    title: 依赖隔离
    kind: concept
    summary: 一个环境一套版本，隔离靠虚拟环境

  - id: concepts-python/runner
    title: 运行时
    kind: concept
    summary: 一个解释器就是全部；分发的是源码而不是编译产物

  - id: concepts-python/build-tool
    title: 构建工具
    kind: concept
    summary: 解释执行，日常开发没有构建这一步；打包只在发布时发生

  - id: concepts-python/test-framework
    title: 测试框架
    kind: concept
    summary: 普通函数加裸 assert，靠命名约定被发现

  - id: concepts-python/testing-mock
    title: 测试替身
    kind: concept
    summary: 猴补丁直接替换属性、不必提升；也可以照常注入依赖

  - id: concepts-python/lint-format
    title: 代码检查与格式化
    kind: concept
    summary: 检查与格式化分开，生态收敛到 ruff / black 这套答案

  - id: concepts-python/repl
    title: 交互式环境
    kind: concept
    summary: 不带参数运行 python 就进 REPL，是日常的验证工具
