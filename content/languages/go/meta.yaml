id: go
name: Go
shortName: Go
aliases: [golang]
version: '1.23'
fileExtension: .go
comment:
  line: '//'
shikiLang: go
paradigm: [imperative, concurrent]
typing: static
# Go 的接口是隐式实现（鸭子类型），因此类型系统是结构化的，与 Java/Rust 的具名类型不同
typeSystem: structural
memoryModel: gc
concurrency: [goroutine, channel, select]
baseline: false
links:
  - label: Go 官方教程（Tour of Go）
    url: https://go.dev/tour/
  - label: Effective Go
    url: https://go.dev/doc/effective_go
