      import asyncio

      async def fetch(url):
          ...

      async def fetch_all(urls):
          return await asyncio.gather(*[fetch(u) for u in urls])
          # @note await 是显式的"在这里让出"标记，一眼能看出哪里会切换

      asyncio.run(fetch_all(urls))

      # @note 所有协程跑在同一个事件循环上，不是真线程
      # @note 并发上限靠信号量控制，或者用 gather 分批
