  - featureId: js2python/exception-model
    equivalence: divergent
    code: |
      try:
          risky()
      except (KeyError, IndexError):   # @note 一个分支接多种类型
          fallback()
      except Exception as e:
          log(e)
          raise                        # @note! 单独一句 raise 就是重新抛出，不必写 raise e
      else:
          succeeded()                  # @note! 多了 else：没抛异常时执行
      finally:
          cleanup()

      # @note else 的价值：把"可能抛的那一句"圈在 try 里，其余逻辑放外面，
      # 避免误捕自己后续代码抛出的异常 —— JS 只能靠缩小 try 块范围来近似
