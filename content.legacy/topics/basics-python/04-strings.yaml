    title: 字符串字面量
    kind: syntax
    summary: 单双引号等价，三引号管多行，而且没有字符类型

  - id: basics-python/template-string
    title: 字符串插值
    kind: syntax
    summary: f-string 简洁，但花括号里写不了反斜杠

  - id: basics-python/string-methods
    title: 常用字符串方法
    kind: behavior
    summary: 方法名全小写，查找用 in 而不是 find

  - id: basics-python/multiline-string
    title: 多行字符串
    kind: syntax
    summary: 三引号直接换行，join 的主语是分隔符

  - id: basics-python/fstring-format
    title: 格式化输出
    kind: behavior
    summary: 格式说明符自带宽度、精度、对齐

  - id: basics-python/string-index-slice
    title: 索引与切片
    kind: behavior
    summary: 负索引、越界抛异常、切片还能带步长

  - id: basics-python/string-regex
    title: 正则表达式
    kind: behavior
    summary: 一律用原始字符串，match 与 search 不是一回事

  - id: basics-python/string-concat
    title: 字符串拼接
    kind: syntax
    summary: + 只认字符串，拼接大量片段用 join

  - id: basics-python/string-raw-escape
