snippets:
  - featureId: concepts-python/module-system
    equivalence: identical
    code: |
      import util                  # import 会真的执行：模块顶层代码此刻跑一遍
      from util import helper      # 没有显式导出 —— 所有顶层名字都可被导入
    body: |
      Python 的 `import` 是一句**会在那一刻真的执行**的语句：被导入模块的顶层代码立刻
      跑一遍，之后缓存在 `sys.modules`（默认只跑一次）。一个 `.py` 是 module、
      含 `__init__.py` 的目录是 package，而且**没有显式导出这回事 ——
      所有顶层名字都可被导入**（`_` 开头是约定私有）。

      JS 的 ESM `import` 是**静态提升**的：声明位置不影响执行顺序，导入是活的绑定，
      循环依赖能被处理，导出什么由 `export` 明确决定。

      从 Python 出发的两点变化：① 你在模块顶层做的副作用（注册、连接、初始化）
      在 JS 里执行时机不同 —— 它被提升、且在模块图求值阶段就跑；② 你失去了
      「懒得写 `__all__`、所有名字都暴露」的随性 —— JS 里没被 `export` 的名字外部拿不到。

  - featureId: concepts-python/memory
    equivalence: identical
    code: |
      x = [1, 2, 3]
      del x                        # 只是减一次引用，别人还引用着就还在
      with open("f") as f:         # with 写出确定性的释放
          pass
    body: |
      Python 是**引用计数 + 循环 GC**：对象引用数归零立刻释放，循环引用靠周期性 GC 兜底。
      所以 `del x` 只是**减一次引用**，对象不一定立刻消失（还有别人引用着就还在）；
      好处是可以用 `with` 写出**确定性的释放**（文件、锁、连接）。

      JS 是**标记清除**式的 GC：从根出发找不到的对象被回收，循环引用不是问题，
      但「什么时候回收」完全不透明，也没有引用计数可查。主要泄漏源是**闭包持有**
      与忘记解绑的事件监听。

      从 Python 迁移的实质损失是「确定性」：`with` 那种「出了这个块就一定释放」的保证
      在 JS 里没有直接对应 —— 得在 `finally` 里手动清理。反过来，你在 Python 里为循环引用
      操心的那些事，在 JS 里不用管。

  - featureId: concepts-python/concurrency-unit
    equivalence: identical
    code: |
      import threading, multiprocessing
      # GIL：多线程无法并行跑 CPU 密集任务
      # CPU 密集要真并行，只能用多进程
    body: |
      Python 三种并发单元都有 —— 线程、进程、协程，但 **GIL** 让多线程无法并行执行
      CPU 密集任务，所以「想快就用多线程」只在 I/O 密集场景成立，CPU 密集必须用
      `multiprocessing`。

      JS 的并发模型相反地简单：**事件循环 + 单线程**，所有回调在同一个线程上跑，
      没有数据竞争、没有锁；CPU 密集只能丢给 `Worker` 隔离 —— Worker 有独立执行环境，
      靠 `postMessage` 通信、不共享内存。

      从 Python 过来会先觉得「终于没有 GIL 了」，但也失去「多线程共享一块内存」这回事：
      你原先靠共享变量协调的写法，在 JS 里要改成消息传递。反过来，JS 的
      「永远不用担心锁」是 Python 多线程里必须自己扛的。

  - featureId: concepts-python/async-model
    equivalence: identical
    code: |
      import asyncio
      async def load():
          return 1
      load()                       # 返回协程对象，一行都不执行
      asyncio.run(load())          # 必须显式启动事件循环
    body: |
      Python 的 `asyncio` 需要一个**显式启动的事件循环**：协程函数调用后返回的是协程对象，
      不 `await`、不用 `asyncio.run()` / `create_task()` 驱动，它就**一行都不会执行**，
      而且通常**不报错**（只有一条 RuntimeWarning）。

      JS 的异步是**运行时自动驱动**的：事件循环一直在跑，`async` 函数调用即开始执行，
      `await` 之后自动继续，不需要谁去「启动」。

      从 Python 过去，最需要重新建立的是「调用即执行」这条直觉 —— 在 Python 里你被反复
      提醒「协程要 await」，到 JS 里 Promise 一创建就开始跑了。

      一边的共通处：**阻塞事件循环会拖垮全部并发** —— 在协程里调同步阻塞函数
      （`time.sleep`、同步 HTTP 库），两边整个循环都会被卡住。
