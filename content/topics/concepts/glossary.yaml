# 术语词典 —— 同名不同义 / 异名同义
# 迁移时最容易被"看起来一样"骗到的一组词

- term: 对象
  aliases: [object]
  perLanguage:
    javascript: '"对象" 默认指 Object 字面量，也可以泛指一切非原始值'
    python: '"对象" 指一切值（连整数都是对象）；没有专门对应 JS Object 字面量的说法'
  note: JS 的「对象」是同名异义最严重的一个词。

- term: 列表 / 数组
  aliases: [array, list]
  perLanguage:
    javascript: Array（可变、长度可变、可混合类型）
    python: list（可变）；tuple（不可变，常被误当成 Array 用）
  note: Python 的 list 不是链表，是动态数组；性能特征与 JS 数组接近。

- term: 字典 / 哈希表
  aliases: [dict, map, hash]
  perLanguage:
    javascript: Object 字面量（键只能是字符串/符号）或 Map（任意键）
    python: dict（任意可哈希键，3.7+ 保证插入有序）
  note: JS 的 Object 与 Map 语义不同（键类型、原型链、遍历顺序），Python 只有一个 dict。

- term: 接口
  aliases: [interface, protocol, trait]
  perLanguage:
    javascript: 无语言级概念，靠结构化类型隐式满足（TS 才引入 interface）
    python: Protocol（typing，结构化，3.8+）或 ABC（抽象基类，名义式）
  note: 这是「同名不同义」的典型：TS 的 interface 是结构化，Python 的 ABC 是名义式。

- term: 模块
  aliases: [module, package]
  perLanguage:
    javascript: 一个文件即一个模块（ESM）；package 指 npm 包
    python: 一个 .py 文件是 module，含 __init__.py 的目录是 package
  note: 「module → package」的层级关系在 Python 里有明确语法，JS 里没有。

- term: 闭包
  aliases: [closure]
  perLanguage:
    javascript: 函数捕获定义时所在的词法环境
    python: 同机制，但循环变量是单个绑定（这点与 JS 的 var 一样是坑）
  note: 机制一致，坑也一致——只是当年 JS 用 let 修掉了，Python 的 for 变量仍然共享。

- term: 装饰器
  aliases: [decorator, annotation]
  perLanguage:
    javascript: 提案阶段语法 @decorator（TS 里已可用），写法在类/方法上
    python: 成熟的语法特性 @decorator，可作用于任意函数/类，本质是高阶函数
    arkts: '@State / @Prop / @Link 等，用于声明式 UI 的状态绑定，语义与 Python 完全不同'
  note: 三个语言里 @xxx 长得一样，含义天差地别——同名不同义的高危词。

- term: 迭代器 / 可迭代
  aliases: [iterator, iterable, generator]
  perLanguage:
    javascript: 协议是 Symbol.iterator + next()；async 版本用 for await
    python: __iter__ / __next__；生成器函数用 yield，且是一次性消耗品
  note: 两边的生成器都只能遍历一次，重复遍历要显式转成列表。

- term: 类型转换
  aliases: [cast, coercion]
  perLanguage:
    javascript: 隐式转换大量存在（+、==、比较），显式用 Number()/String()
    python: 几乎不隐式转换，一律显式 int()/str()/float()
  note: 「弱类型 vs 强类型」的实际差别就在这里。

- term: 可变默认参数
  aliases: []
  perLanguage:
    javascript: 默认参数每次调用重新求值，不存在这个问题
    python: def f(x=[]) 的 [] 只求值一次，会被所有调用共享 —— 经典陷阱
  note: 只有 Python 有这个问题，但它是 Python 面试题出现频率最高的坑之一。
