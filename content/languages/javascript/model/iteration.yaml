# javascript —— model / iteration
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: iteration` 的那批：
# generator-yield / comprehension / lazy-evaluation / destructuring。
#
# 与 express/control-flow 的 `iteration-protocol` 分工：那里讲「什么样的对象能被遍历」，
# 这里讲「怎么造出一个可遍历 / 惰性求值的东西」。

review:
  state: draft

boxes:
  generator-yield:
    code: |
      function* countdown(n) {
        while (n > 0) yield n--;       // @note 每次 yield 暂停在这里
      }
      [...countdown(3)];               // @note [3, 2, 1]

      function* chain() {
        yield 1;
        yield* countdown(2);           // @note! yield* 委托给另一个可迭代对象
        yield 4;
      }

      const g = countdown(2);
      g.next();                        // @note { value: 2, done: false }
      g.next(); g.next();              // @note 最后一次 done: true
    baseline: |
      `function*` 定义的函数体在调用时**不执行**，而是返回一个生成器对象；
      每次 `next()` 跑到下一个 `yield` 就暂停。因此「产出序列」写起来就是普通循环。
      `yield*` 委托给另一个可迭代对象。生成器同时是迭代器 ——
      只能走一遍，走完再遍历就空了。
    vs:
      python: |
        两边的 `yield` 是同一套东西（调用时不执行、每次推进到下一个 yield）。
        差别在能力：Python 的生成器还能 `send()` 从外部送值进去、用 `yield from`
        委托并拿到返回值；这里只有 `yield*`，没有双向通信。
      java: |
        Java **没有生成器语法**。想惰性产出一串值，要么手写 `Iterator` 类，
        要么用 `Stream`（但 Stream 不能中途暂停再恢复）。
        写「惰性的、带状态的序列」，这里的 `function*` 一行就能表达。
    equivalence:
      python: analogous
      java: divergent

  comprehension:
    code: |
      // @note! 没有推导式语法 —— 靠方法链
      const doubles = xs.map((x) => x * 2);
      const evens = xs.filter((x) => x % 2 === 0);
      const pairs = xs.flatMap((x) => ys.map((y) => [x, y]));   // @note 嵌套

      // 造字典：先造键值对数组再 Object.fromEntries
      const byId = Object.fromEntries(users.map((u) => [u.id, u]));

      // 造集合
      new Set(xs.map((x) => x.kind));

      // @note 惰性版本要自己写生成器函数，没有链式的惰性管道
    baseline: |
      **没有推导式**。造新容器靠方法链（`map` / `filter` / `flatMap`）加上
      `Object.fromEntries`、`new Set(...)` 这类构造器。每一步都是**急切**求值的：
      链有多长就跑几遍，中间数组是真实存在的。想要惰性得自己写生成器函数。
    vs:
      python: |
        Python 的推导式把「造一个容器」写成一个表达式，列表 / 字典 / 集合 / 生成器
        各有各的写法；这里全靠方法链，还要额外转一次
        （`Object.fromEntries`、`new Set(...)`）。两边都是急切的，
        但 Python 的生成器表达式（`(x for x in xs)`）一行就能得到惰性版本。
      java: |
        Java 用 `Stream` 管道加 `Collectors`：`xs.stream().filter(...).map(...)
        .toList()`。与这里的方法链很像，但 Java 的 Stream 是**惰性**的 ——
        中间操作不执行，直到遇到终止操作。这里是急切求值，每一步都真的跑。
    equivalence:
      python: divergent
      java: analogous

  lazy-evaluation:
    code: |
      // @note 数组方法全部是急切的：每一步都产生一个真实数组
      const r = xs.map(f).filter(g).slice(0, 3);   // 跑了三遍，中间数组都存在

      // @note 惰性要自己用生成器搭
      function* take(iter, n) {
        let i = 0;
        for (const x of iter) { if (i++ >= n) return; yield x; }
      }
      function* nat() { let i = 0; while (true) yield i++; }   // @note 无限序列
      [...take(nat(), 3)];                        // @note [0, 1, 2] —— 不卡死

      // @note 想「管道式」的惰性，得靠库（如 Iterators helpers 提案）或 RxJS
    baseline: |
      内建的数组方法是**急切**的：`map` / `filter` 每一步都真的跑完并产生中间数组，
      所以「先筛再取前 3 个」会处理完整个数组。要惰性得自己用生成器搭
      （也正是生成器存在的意义）—— 无限序列因此可行：只要不取完就不会算完。
      没有内建的惰性管道。
    vs:
      python: |
        Python 的生成器表达式与 `itertools` 提供了同样甚至更顺手的惰性工具
        （`islice` / `count` 直接就有）。两边都靠生成器实现惰性，
        Python 只是把常用算子做进了标准库，这里基本要自己写。
      java: |
        Java 的 `Stream` **天生惰性**：中间操作（`filter` / `map`）只是记账，
        直到终止操作（`toList` / `forEach`）才真正跑一遍，而且每个元素是
        「一个走完全部步骤再走下一个」。这里的方法链是急切的，语义差别很大。
    equivalence:
      python: analogous
      java: divergent

  destructuring:
    code: |
      const [a, b = 2, ...rest] = [1];       // @note 数组解构 + 默认值 + 剩余
      const { name, age: years = 0 } = user;  // @note 对象解构 + 改名 + 默认值
      const { a: { b } } = nested;            // @note 嵌套

      function f({ x, y }) {}                 // @note 参数位置直接解构
      [a, b] = [b, a];                        // @note 交换
      const [, second] = xs;                  // @note 跳过第一个
    baseline: |
      数组与对象**都能解构**，而且可以嵌套、带默认值（只在值是 `undefined`
      时生效）、用 `...` 收集剩余、用 `:` 改名。函数参数位置也能直接解构，
      这让「传一个配置对象」的写法很顺手。解构失败不会报错 ——
      取不到就是 `undefined`。
    vs:
      python: |
        Python 的元组解包与数组解构几乎一一对应（含 `*rest`、嵌套、交换）。
        明显的差别是**字典不能解构** —— 想按名字取只能 `d["name"]` 或
        用 `match` 的模式匹配，这里写 `const { name } = obj` 就行。
      java: |
        Java **没有解构赋值**这个语法。record 的模式匹配能在 `instanceof` 与
        `switch` 里拆字段，但那是模式匹配、不是「给几个变量同时赋值」。
        写 `var a = p.x(); var b = p.y();` 是这边唯一的路。
    equivalence:
      python: analogous
      java: divergent
