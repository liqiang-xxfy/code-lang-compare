# php —— mechanism / memory
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: memory` 的那批：
# value-vs-reference / garbage-collection / ownership-borrow /
# lifetime / weak-reference。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 口径说明：这一组的中心事实是**引用计数**，四条推论 ——
# ① 非环对象的析构是**确定性的**（计数归零立刻析构），这一点像 RAII 而不像 tracing GC；
# ② **成环**的对象要等周期回收器，析构时机不确定（本机实测：unset 之后没析构，
#    gc_collect_cycles() 跑完才析构，返回回收的环数是 2）；
# ③ 没有所有权 / 借用这套东西，`&` 是**别名**不是借用；
# ④ 弱引用只能指向**对象**（标量、数组不行）。
#
# 本文件的事实全部在本机 PHP 8.5.11 上实跑确认过。

