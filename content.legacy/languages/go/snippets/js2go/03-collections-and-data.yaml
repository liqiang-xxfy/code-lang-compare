  - featureId: js2go/collections-exercise
    equivalence: analogous
    code: |
      type Employee struct {
          Name string
          Dept string
          Age  int
      }

      func groupByDept(employees []Employee) map[string][]string {
          groups := make(map[string][]string)       // @note! 必须先 make
          for _, e := range employees {
              groups[e.Dept] = append(groups[e.Dept], e.Name)
              // @note! 读不存在的键得到 nil 切片，append 到 nil 切片是合法的 ——
              // 所以这一行直接就能工作，不需要判存在
          }
          return groups
      }

      func avgAge(employees []Employee) (float64, bool) {
          if len(employees) == 0 {
              return 0, false                       // @note! ok=false 表示"没有结果"
          }
          total := 0
          for _, e := range employees {
              total += e.Age
          }
          return float64(total) / float64(len(employees)), true   // @note! 不转就是整数除法
      }

      // @note 空输入返回空 map（不是 nil map），调用方可以直接 range
