# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（javascript2php），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: javascript2php-1-runtime-model
  order: 1
  title: 先理解「共享无状态」的运行时
  durationHint: 2-3 小时
  todo:
    - 装 PHP 8 与 Composer，跑一个 hello world
    - 理解每个请求是独立进程：写一个全局变量，跨请求看它是否还在
    - 记住 `||` 恒返回 bool，取默认值要用 `??`
    - 对照本工具「语言机制」板块里 PHP 列的执行模型相关格
  acceptance:
    - 能说清 PHP 的请求生命周期与 Node 长驻进程的差别
    - 能说清为什么 `$x = $a || 'default'` 是错的
  resources:
    - label: PHP 官方手册（中文）
      url: https://www.php.net/manual/zh/
    - label: PHP 官方手册（英文）
      url: https://www.php.net/manual/en/

- id: javascript2php-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 过一遍变量、数组、字符串操作，注意数组是值拷贝
    - 试一次 `(int)"abc"`，理解它给 0 而不是报错
    - 用 mb_strlen 与 strlen 各数一次中文，看差别
    - 把 switch 改成 match，体会严格比较
  acceptance:
    - 能独立写出变量、数组、控制流、函数定义，无语法错误
    - 知道哪些写法会静默给错值（|| 取默认、isset 判 null、强转）
  resources:
    - label: PHP 官方手册 · 类型
      url: https://www.php.net/manual/zh/language.types.php

- id: javascript2php-3-classes-and-types
  order: 3
  title: 类、严格类型与属性
  durationHint: 3-5 天
  todo:
    - 理解对象是句柄、数组是拷贝，用 clone 复制对象
    - 在每个文件顶部开 declare(strict_types=1)，体会它按调用方生效
    - 写一个子类构造函数，注意必须显式调 parent::__construct
    - 用 reflection 读一次 `#[...]` 属性，理解它只是元数据
  acceptance:
    - 能说清 PHP 的严格类型声明为什么按调用方生效
    - 能说清属性与 JS 装饰器的本质差别
  resources:
    - label: PHP 官方手册 · 类与对象
      url: https://www.php.net/manual/zh/language.oop5.php

- id: javascript2php-4-ecosystem
  order: 4
  title: Composer 与生态
  durationHint: 2-3 天
  todo:
    - 用 Composer 建一个工程，装几个包
    - 注意 Composer 的 `~` 与 npm 的 `~` 语义不一致
    - 配 PHPStan 或 Psalm，体会用静态分析补上「没有泛型」的缺口
    - 理解 autoload（PSR-4）与 node_modules 的差别
  acceptance:
    - 能说清 Composer 与 npm 在版本约束上的差异
    - 能用 PHPDoc + 静态分析给容器标注元素类型
  resources:
    - label: Composer 官方文档
      url: https://getcomposer.org/doc/
    - label: PHP 官方手册（中文）
      url: https://www.php.net/manual/zh/

- id: javascript2php-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 PHPUnit 写测试
    - 搭一个最小的 Web 应用（路由 + 模板 + 数据库），走通请求生命周期
    - 对照本工具「工程实践」板块里 PHP 列的工具链
    - 体验一次常驻进程形态（Swoole / RoadRunner），对比经典模型
  acceptance:
    - 能独立搭起一个带依赖、测试、静态分析的 PHP 工程
    - 能说清经典共享无状态模型与常驻进程模型的取舍
  resources:
    - label: Composer 官方文档
      url: https://getcomposer.org/doc/
    - label: PHP 官方手册（中文）
      url: https://www.php.net/manual/zh/
