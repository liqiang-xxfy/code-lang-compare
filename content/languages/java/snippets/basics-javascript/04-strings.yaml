  - featureId: basics-javascript/template-string
    equivalence: divergent
    code: |
      String name = "Ada";
      String s1 = "hi, " + name + "!";              // @note 简单拼接还是 +
      String s2 = "hi, %s!".formatted(name);        // @note Java 15+ 的实例方法
      String s3 = String.format("hi, %s!", name);   // 老写法

      // @note! 没有 JS 那种反引号插值模板；
      //        Java 21 的字符串模板（STR."..."）到 21 仍是预览特性
  - featureId: basics-javascript/string-methods
    equivalence: divergent
    code: |
      String s = "Hello";

      s.length();            // @note 是方法不是属性（JS 的 s.length 是属性）
      s.toUpperCase();
      s.trim();              // @note 去 ASCII 空白；strip() 才认 Unicode 空白
      s.split(",");          // 返回 String[]，不是 List
      s.replace("a", "b");   // @note 字面替换（不认正则）；replaceAll 才走正则
      s.contains("ell");
      s.isEmpty();

      // @note! 与 JS 的行为正好相反：JS 的 replace 只换第一个匹配，Java 的 replace 换全部
  - featureId: basics-javascript/multiline-string
    equivalence: divergent
    code: |
      String s = """
          line1
          line2
          """;       // @note 文本块（Java 15+）：自动去掉公共缩进

      String old = "line1\n" +
                   "line2\n";

      // @note 文本块会自动对齐缩进，这点比 JS 的反引号更贴心
      // @note! 但结尾的换行会被保留 —— 不想要得用行尾转义 \（Java 15+）
  - featureId: basics-javascript/fstring-format
    equivalence: analogous
    code: |
      String.format("%.2f", 3.14159);      // "3.14"
      String.format("%8.2f", 3.14159);     // "    3.14"  —— @note 总宽度 8
      String.format("%08.2f", 3.14159);    // "00003.14"
      String.format("%d%%", 25);           // "25%"
      "%s = %d".formatted("x", 1);         // "x = 1"

      // @note! Java 的格式说明符与 Python 的 f-string 是同一套 C 血统（printf），
      //        连总宽度概念都一样 —— 这一点上 Java 比 JS 的 Intl 更接近 Python
  - featureId: basics-javascript/string-index-slice
    equivalence: divergent
    code: |
      String s = "hello";
      s.charAt(0);                    // 'h' —— @note 返回 char，不是 String
      s.charAt(s.length() - 1);       // 'o' —— @note! 没有负索引

      s.substring(1, 3);              // "el" —— @note 左闭右开
      // s[0];                        // 编译错误：Java 没有下标语法

      // @note! Java 没有切片语法、没有负索引、没有步长；
      //        Python 的 s[-3:] 在这里要写成 s.substring(s.length() - 3)
  - featureId: basics-javascript/string-regex
    equivalence: divergent
    code: |
      "abc123".matches("\\w+");                        // true

      Pattern p = Pattern.compile("(?<num>\\d+)");
      Matcher m = p.matcher("abc123");
      if (m.find()) {
          m.group("num");                              // "123" —— @note 命名分组
      }

      // @note! 反斜杠要写两遍（Java 字符串本身先转义一次），这是最烦的一点
      // @note! matches() 要求**整串匹配**；JS 的 test() 是「包含即匹配」，语义不同
  - featureId: basics-javascript/string-concat
    equivalence: analogous
    code: |
      String a = "x" + "y";              // @note 少量拼接直接 +（编译期会用 StringBuilder）
      a += "z";

      StringBuilder sb = new StringBuilder();   // @note 循环里拼接必须用它
      for (int i = 0; i < 1000; i++) sb.append(i);
      sb.toString();

      String.join(",", "a", "b");        // @note 分隔符在**前面**

      // @note! Java 与 Python 的 join 都是「分隔符.调用()」，
      //        而 JS 是「数组.join()」—— 主宾语正好相反
