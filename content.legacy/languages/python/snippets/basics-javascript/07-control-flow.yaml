# python —— basics/07-control-flow 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
review:
  state: reviewed
  provenance:
    origin: manual
    license: CC-BY-4.0
  reviewedBy: 阿岩
  reviewedAt: '2026-10-01'
snippets:
  - featureId: basics-javascript/if-else
    equivalence: analogous
    code: |
      if score >= 90:
          grade = 'A'
      elif score >= 60:          # @note 是 elif，不是 else if
          grade = 'B'
      else:
          grade = 'C'

      # @note 用缩进代替花括号：同一个块必须缩进一致，混用 Tab 与空格会直接报错
      # @note 条件后面必须写冒号，这是最容易漏的一处语法
    body: |
      结构完全对应，只有三处表面差异：条件**不需要括号**、`else if` 写成 `elif`、
      用缩进代替花括号（同一块缩进必须一致，混用 Tab 与空格直接报错）。
      条件后面的**冒号**是最容易漏的一处语法。

      真正的差异在条件表达式本身：两边都允许任意表达式当条件，但真值规则不同
      （见《运算符》一章的「真值判断」）。
  - featureId: basics-javascript/ternary
    equivalence: divergent
    code: |
      label = 'pass' if score >= 60 else 'fail'      # @note! 结果在前、条件在后，与 JS 语序相反

      tier = 'A' if score >= 90 else ('B' if score >= 60 else 'C')   # 嵌套可读性差

      # @note 只想要其中一个分支时：
      maybe = do_something() if cond else None

      # @note 常见错误是把 JS 的 cond ? a : b 直译成 cond ? a : b —— Python 里会语法错误
      # @note 复杂逻辑超过一层就应该拆成 if 语句，别硬写三元
    body: |
      **语序是反的**：`a if cond else b`，结果写在前面、条件在后面。
      这是逐行翻译时最容易写错的一格，而且写错往往**不会报错**
      （只要两边都是合法表达式），只是逻辑反了。

      只想要其中一个分支时写 `maybe = do_something() if cond else None`。
      链式条件表达式也支持，但可读性差，超过一层就该拆回 `if` 语句。
  - featureId: basics-javascript/switch-match
    equivalence: divergent
    code: |
      # 3.9 及以前：只能写 if/elif 链
      if lang == 'js':
          name = 'JavaScript'
      elif lang == 'py':
          name = 'Python'
      else:
          name = 'unknown'

      # 3.10+ 的 match：结构化模式匹配，不是 switch 的替代品
      match status:
          case 200:
              ok()
          case 404 | 410:                 # @note 多个模式用 | 合并
              missing()
          case {'error': msg}:            # @note! 解构字典并绑定变量——switch 做不到
              log(msg)
          case [first, *rest]:            # 解构序列
              handle(first, rest)
          case _ if fallback_enabled:      # @note 守卫条件
              fallback()
          case _:
              unknown()

      # @note! 没有穿透这回事，也永远不需要 break；忘记这一点反而会多写 break 导致语法错误
    body: |
      3.10 之前只能写 `if/elif` 链。3.10+ 有了 `match`，但它是**结构化模式匹配**，
      不是 `switch` 的替代品 —— 能解构字典与序列、能绑定变量、能用 `|` 合并多个模式、
      还能加守卫条件（`case _ if cond`）。

      这里**没有穿透这回事，也永远不需要 `break`** —— 从 JS 带过来的 `break`
      反而会变成语法错误。别把它当 `switch` 用，否则会浪费掉这个特性。
  - featureId: basics-javascript/for-loop
    equivalence: divergent
    code: |
      for x in [1, 2, 3]:              # @note 只有遍历，没有三段式
          print(x)

      for i in range(3):               # 需要计数就显式用 range
          print(i)

      for i, x in enumerate([1, 2, 3]):
          print(i, x)

      for k, v in {'a': 1}.items():
          print(k, v)

      # @note! 循环变量在循环结束后仍然存在（Python 的 for 不产生新作用域）
      print(x)                         # 3 —— JS 里 var 是这个行为，let 不是
    body: |
      **只有遍历，没有计数三段式**：`for x in iterable`。需要下标就用 `range()` 或
      `enumerate()`，遍历字典用 `.items()`。

      这不是缺点：取向是「遍历容器，而不是遍历下标」，能消除大量 off-by-one 错误。
      另外有一处作用域差别 —— **循环变量在循环结束后仍然存在**，`for` 不产生新作用域。
  - featureId: basics-javascript/while-loop
    equivalence: analogous
    code: |
      n = 3
      while n > 0:
          n -= 1

      # @note! 没有 do...while。惯用替代是 while True + break：
      m = 0
      while True:
          m += 1
          if m >= 1:
              break

      # @note 写死循环用 while True:（大写 True），JS 是 while (true)
    body: |
      `while` 两边一致。**没有 `do...while`**（至少执行一次的循环），
      惯用替代是 `while True:` + `break`，或者把首次逻辑抽出来先执行一遍。

      这类「少一个语法结构」的差异在迁移时会集中暴露，属于需要专门记一组的清单。
      注意死循环写 `while True:` —— `True` 在这里是大写的关键字。
  - featureId: basics-javascript/loop-control
    equivalence: divergent
    code: |
      for x in [1, 2, 3, 4]:
          if x == 2:
              continue
          if x == 4:
              break
          print(x)          # 1, 3

      # @note! Python 没有循环标签，嵌套循环要跳多层只能靠标志位或抽成函数 return
      # @note for...else 是 Python 独有的：循环「没被 break 打断」时执行 else
      for x in [1, 2, 3]:
          if x == 9:
              print('found')
              break
      else:
          print('not found')    # 会执行 —— 表达「找过了，没找到」，省掉一个标志位变量
    body: |
      `break` / `continue` 与 JS 一致。**没有循环标签** —— 嵌套循环要一次跳多层，
      只能靠标志位变量或把内层抽成函数 `return`。

      多出来的是 **`for...else`**：`else` 块在循环**没有被 break 打断**时执行，
      表达的正是「找过了，没找到」。JS 里这个模式要额外维护一个标志位变量，
      这是「用语法消除状态变量」的典型例子。
  - featureId: basics-javascript/loop-index
    equivalence: analogous
    code: |
      arr = ['a', 'b']

      for i, v in enumerate(arr):        # @note 最常用
          print(i, v)

      for i, v in enumerate(arr, start=1):   # @note! 可以从 1 开始计数，JS 的 forEach 没有这个能力
          print(i, v)

      for k, v in {'x': 1}.items():
          print(k, v)

      # @note enumerate 返回惰性迭代器，不会先物化一个列表
    body: |
      用 `enumerate(seq)` 直接拿 `(i, v)`，比 `range(len(seq))` 更地道；字典用 `.items()`。
      它还有 `start=` 参数能指定起始下标（`enumerate(arr, start=1)`）—— JS 的 `forEach`
      下标恒从 0 开始，做不到这一点。

      `enumerate` 返回的是**惰性迭代器**，不会先物化一个列表；这里用的是普通循环，
      所以「中途 `break`」和「逐步 `await`」这两件 `forEach` 做不到的事，天然都成立。
  - featureId: basics-javascript/range-iteration
    equivalence: divergent
    code: |
      list(range(3))          # [0, 1, 2]  —— @note 左闭右开；单参数等于 range(0, 3)
      list(range(1, 4))       # [1, 2, 3]
      list(range(0, 10, 2))   # [0, 2, 4, 6, 8]
      list(range(5, 0, -1))   # [5, 4, 3, 2, 1] —— @note 支持负步长，倒序很方便

      range(3)                # @note! 是 range 对象不是列表，打印出来是 range(0, 3)
      type(range(3))          # <class 'range'>

      # @note range 是惰性的：range(10**9) 只占常数内存
      for i in range(3):
          ...
    body: |
      `range()` 是内置的**左闭右开**惰性序列：`range(3)` 与 `range(0, 3)` 等价，
      支持步长与负步长（`range(5, 0, -1)` 倒序很方便），`range(10**9)` 只占常数内存。

      要注意 `range(3)` 返回的是 **range 对象而不是列表**，想要列表必须 `list(range(3))`
      —— 打印出来是 `range(0, 3)`，这是新手最常见的疑问之一。
  - featureId: basics-javascript/exception-flow
    equivalence: divergent
    code: |
      try:
          data = json.loads('{bad')
      except json.JSONDecodeError as e:      # @note! 必须写类型才能精确捕获
          print(e.msg)
      except (KeyError, TypeError) as e:     # @note 多个类型用元组合并
          print('other')
      else:
          print('没抛异常才执行')              # @note! Python 独有，JS 没有 else 分支
      finally:
          cleanup()

      # @note! 永远不要写裸 except: —— 它会连 KeyboardInterrupt / SystemExit 一起吞掉
      # @note 只能抛 BaseException 的子类：raise ValueError('msg')，不能 raise 'msg'
      # @note 所以 except X as e 之后 e 一定是个异常对象，可以放心用 e.args
      # @note 自定义异常：class MyError(Exception): pass
    body: |
      结构对应 `try/except/finally`，但有三处实质差异：

      ① `except` **必须写异常类型**才能精确捕获；裸 `except:` 会连 `KeyboardInterrupt`、
      `SystemExit` 一起吞掉，永远不要这么写（多个类型用元组合并）；
      ② 多一个 **`else`** 分支，没抛异常时执行；
      ③ 只能抛 `BaseException` 的子类，`raise 'msg'` 直接报错 —— 所以 `except X as e`
      之后 `e` 一定是个异常对象，可以放心用 `e.args`。
