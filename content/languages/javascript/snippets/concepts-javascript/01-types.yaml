snippets:
  - featureId: concepts-javascript/type-system
    equivalence: identical
    code: |
      1 == "1"      // true —— == 会做隐式类型转换
      1 === "1"     // false —— 工程规范一律要求 ===
      "3" * "2"     // 6 —— 字符串被当成数字
    body: |
      **动态 + 弱类型** —— 运行时类型，比较与算术都会隐式转换。
      错误通常表现为「结果不对」而不是抛异常。

  - featureId: concepts-javascript/numeric-type
    equivalence: identical
    code: |
      0.1 + 0.2             // 0.30000000000000004
      9007199254740993      // 9007199254740992 —— 超出安全整数范围静默丢精度
      7 / 2                 // 3.5 —— 只有一种除法
    body: |
      **number（统一 float64）+ BigInt** —— 整数也是浮点，超范围静默丢精度。

  - featureId: concepts-javascript/null-value
    equivalence: identical
    code: |
      null == undefined    // true —— 一次挡掉两种空值
      0 || "默认"           // "默认" —— 0 是假值，被兜底吃掉
      0 ?? "默认"           // 0 —— ?? 只挡 null / undefined
    body: |
      **null + undefined** —— 两种空值，判空噪音大，所以才有 `?.` 与 `??`。

  - featureId: concepts-javascript/value-semantics
    equivalence: identical
    code: |
      const a = { n: 1 };
      const b = a;
      b.n = 2;
      a.n                  // 2 —— 对象赋值共享同一份数据
    body: |
      **原始值按值、对象按引用** —— 对象赋值与传参都是共享，
      所以「改了别处」是最常见的一类意外。
