  - featureId: java2python/numeric-types
    equivalence: divergent
    code: |
      2 ** 100                       # @note 任意精度 —— 溢出与回绕彻底消失
      10 ** 30 + 1                   # 不用再选位宽

      7 / 2                          # @note! 3.5 —— 不是 3！整数除法不再截断
      -7 / 2                         # @note! -3.5 —— 这是最危险的一处
      7 // 2                         # 3 —— 要 Java 那种语义得显式写 //
      -7 // 2                        # @note -4 —— 而 // 是"向下取整"，与 Java 的"向零"仍不同
      int(-7 / 2)                    # -3 —— 想完全对齐 Java 用这个
      -7 % 3                         # @note! 2 —— 与 Java 的 -1 不同

      1 / 0                          # @note! ZeroDivisionError，当场炸，不再静默变 Infinity
