boxes:
  concurrency-unit:
    code: |
      use std::thread;

      let h = thread::spawn(|| {          // @note OS 线程，一个线程一个栈
        println!("在新线程里");
      });
      h.join().unwrap();                   // @note 等它结束

      // 跨线程传值：move 把所有权搬进去
      let v = vec![1, 2, 3];
      let h = thread::spawn(move || v.len());
      // @note! 闭包是 move 的，之后外面不能再用 v

      // 作用域线程：可以借用外部数据，不用 move
      thread::scope(|s| {
        s.spawn(|| println!("{}", v.len()));   // @note v 只是被借用
      });

      // 异步任务不是标准库的事 —— 需要 tokio / async-std 这类运行时
    vs:
      javascript: |
        JavaScript 在浏览器或 Node 里是**单线程事件循环**，没有真正的并行；
        Rust 的 `thread::spawn` 创建的是操作系统线程，真的并行执行。
        另一个直接后果是数据共享：JavaScript 里没有共享内存，
        所以没有数据竞争；Rust 里多个线程访问同一份数据必须有
        `Arc` 之类的共享所有权，且编译器会检查能不能安全共享。
        异步在 Rust 里存在，但不是默认，要引入运行时。
      python: |
        Python 有真线程但受 GIL 限制，CPU 密集任务并行不起来；
        Rust 的线程没有这层限制，`thread::spawn` 就是真并行。
        共享数据的方式也不同：Python 靠全局锁躲开大部分竞争，
        Rust 靠类型系统（`Send` / `Sync`）在编译期拒绝不安全的共享。
        Python 的 `multiprocessing` 才是真并行，代价是进程间通信。
      java: |
        Java 的 `Thread` 与 Rust 的 `thread::spawn` 都是 OS 线程，
        这一层最接近。差别在两点：① Rust 的线程闭包默认借用外部环境，
        跨线程必须 `move` 把所有权搬进去，Java 的 lambda 捕获引用即可；
        ② Rust 的 `thread::scope` 允许线程借用外部数据并保证在作用域结束前
        全部汇合，Java 没有对应机制。Java 的虚拟线程（21 起）
        与 Rust 的异步任务定位相近，但 Rust 的异步要额外的运行时。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  shared-state:
    code: |
      use std::sync::{Arc, Mutex};
      use std::thread;

      let counter = Arc::new(Mutex::new(0));      // @note Arc 共享所有权，Mutex 提供可变性
      let mut handles = vec![];

      for _ in 0..10 {
        let c = Arc::clone(&counter);
        handles.push(thread::spawn(move || {
          let mut n = c.lock().unwrap();          // @note 锁住才能拿到内部值的可变引用
          *n += 1;
        }));                                       // @note 离开作用域自动解锁
      }
      for h in handles { h.join().unwrap(); }
      println!("{}", *counter.lock().unwrap());

      // @note! 数据竞争在 Rust 里是**编译错误**：
      // 不写 Mutex 就直接共享 &mut，借用检查器不放行
    vs:
      javascript: |
        JavaScript 没有共享可变状态（单线程），所以不存在数据竞争；
        Rust 的共享状态必须显式包起来：`Arc` 负责「多个人拥有」，
        `Mutex` 负责「同时只有一个能改」。关键在于这是**类型系统强制的**——
        忘写锁就拿不到可变引用，编译不过。JavaScript 里
        对应的风险（并发读写同一个对象）根本不会出现，但也没有并行可言。
      python: |
        Python 有 GIL，多线程共享状态时大部分竞争被全局锁挡住了，
        但仍有「读-改-写」竞态需要 `Lock`；Rust 没有 GIL，
        共享可变状态**必须**走 `Mutex`（或原子类型），
        而且编译器会强制 —— 不写锁就编译不过。
        所以 Python 里「忘了加锁」是个要靠 review 抓的问题，
        Rust 里写不出来。
      java: |
        Java 用 `synchronized` 或 `ReentrantLock` 保护共享状态，
        忘了加锁是运行时数据竞争（要靠 `-race` 类似工具或 review 抓）；
        Rust 把这件事提到编译期：共享可变状态必须包在 `Mutex` 里，
        想拿可变引用就得先 `lock()`。
        Java 的 `synchronized` 是修饰符、作用在一段代码上，
        Rust 的 `Mutex<T>` 包住**数据本身** —— 拿不到锁就拿不到数据，
        这个设计让「漏加锁」不可能发生。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  lock-mutex:
    code: |
      use std::sync::Mutex;

      let m = Mutex::new(vec![1, 2, 3]);      // @note! 数据在锁**里面**
      {
        let mut guard = m.lock().unwrap();     // @note MutexGuard：拿锁的同时拿到数据
        guard.push(4);
      }                                        // @note guard 离开作用域自动解锁
      // m.lock().unwrap().push(5);            // @note 一行版：锁在语句结束就释放

      // 读写锁：多读单写
      use std::sync::RwLock;
      let rw = RwLock::new(0);
      let r = rw.read().unwrap();              // @note 可以同时有多个读锁
      // let w = rw.write().unwrap();          // @note! 还有读锁时拿写锁会阻塞

      // 死锁仍可能发生：两把锁以不同顺序获取
      // 但「忘了解锁」不可能 —— Drop 会处理
    vs:
      javascript: |
        JavaScript 没有锁（单线程不需要），也没有共享可变状态。
        Rust 的 `Mutex<T>` 最值得注意的设计是**数据放在锁里面**：
        不 `lock()` 就拿不到值，所以「访问共享数据忘了加锁」编译不过。
        JavaScript 里不存在这个问题，但代价是没有并行；
        一旦用 Worker 做并行，就要自己发明类似的纪律。
      python: |
        Python 的 `threading.Lock` 与它保护的数据是**分开**的：
        锁是个对象，数据是另一个，靠约定「访问前先 acquire」——
        忘了加锁代码照样跑。Rust 的 `Mutex<T>` 把数据装进锁里，
        拿不到锁就拿不到数据，这条规则由借用检查器保证。
        另一处差别是解锁：Python 要 `with lock:` 或手写 release，
        Rust 靠 `MutexGuard` 的 Drop 自动释放，函数提前 return 也不会漏。
      java: |
        Java 的 `synchronized` 或 `ReentrantLock` 与数据是分开的
        （锁一个对象、数据另一个），漏加锁是运行时问题；
        Rust 把数据和锁绑成一个值，从类型上消除这种可能。
        自动释放上两边都能做到：Java 的 `synchronized` 块、
        `try (Lock l = …)` 或 `finally unlock`；Rust 是 `MutexGuard` 的 Drop。
        Java 的 `ReadWriteLock` 对应 Rust 的 `RwLock`，语义一致。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  channel:
    code: |
      use std::sync::mpsc;                     // @note 多生产者、单消费者
      use std::thread;

      let (tx, rx) = mpsc::channel();          // @note 发送端可以 clone 出多个
      let tx2 = tx.clone();

      thread::spawn(move || tx.send(1).unwrap());
      thread::spawn(move || tx2.send(2).unwrap());

      for msg in rx {                          // @note 迭代直到所有发送端被丢弃
        println!("{}", msg);
      }

      // 带缓冲
      let (tx, rx) = mpsc::sync_channel(10);   // @note 缓冲满了 send 会阻塞

      // 多消费者要用 crossbeam-channel 之类的库，标准库不支持
    vs:
      javascript: |
        JavaScript 没有内建的线程间通道；`postMessage` 与 `MessageChannel`
        是宿主环境提供的，形态与 Rust 的 `mpsc` 不同（那边是异步事件、
        这边是阻塞或非阻塞的 `send`/`recv`）。Rust 的 channel
        是标准库能力，且发送端 clone 出多个就自然形成多生产者。
        阻塞语义也不同：Rust 的 `recv()` 会挂起当前线程，
        JavaScript 里对应的是 await 一个 Promise。
      python: |
        Python 的 `queue.Queue` 与 Rust 的 `mpsc` 用途一致
        （线程间传数据），但 Python 的队列是**多生产者多消费者**，
        Rust 标准库的 channel 只支持单消费者（多消费者要换库）。
        阻塞行为两边相似：Python 的 `q.get()` 与 Rust 的 `rx.recv()`
        都会挂起线程。差别在类型：Rust 的 channel 有元素类型，
        发错类型编译不过；Python 里什么都能塞。
      java: |
        Java 的 `BlockingQueue`（`ArrayBlockingQueue` / `LinkedBlockingQueue`）
        支持多生产者多消费者；Rust 标准库的 `mpsc` 只有单消费者，
        要做多消费者得换 `crossbeam-channel`。
        关闭语义不同：Java 没有「队列被关闭」这回事，
        通常用毒丸（poison pill）或中断；Rust 的 channel
        在所有发送端被丢弃后 `recv()` 返回 `Err`，迭代自然结束 ——
        这个「发送端全部消失即结束」是 Rust 独有的便利。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  atomicity:
    code: |
      use std::sync::atomic::{AtomicUsize, Ordering};
      use std::sync::Arc;
      use std::thread;

      let counter = Arc::new(AtomicUsize::new(0));   // @note 无锁的原子类型
      let mut hs = vec![];
      for _ in 0..10 {
        let c = Arc::clone(&counter);
        hs.push(thread::spawn(move || {
          c.fetch_add(1, Ordering::SeqCst);          // @note 原子加一
        }));
      }
      for h in hs { h.join().unwrap(); }
      println!("{}", counter.load(Ordering::SeqCst));

      // compare_exchange：CAS，用来实现无锁结构
      let _ = counter.compare_exchange(10, 0, Ordering::SeqCst, Ordering::SeqCst);

      // @note Ordering 是 Rust 特有的显式项 —— 别的语言把它藏起来了
    vs:
      javascript: |
        JavaScript 单线程，`SharedArrayBuffer` + `Atomics` 是唯一的原子工具，
        而且只在跨 Worker 时有意义。Rust 的原子类型（`AtomicUsize` 等）
        是常规工具，用来避免为了一个计数器去拿互斥锁。
        另一处 Rust 独有的是 `Ordering` 参数：内存序要显式写出来，
        而 JavaScript 的 `Atomics` 只有顺序一致的语义，没有别的选择。
      python: |
        Python 有 GIL，单条字节码操作是原子的，所以
        `counter += 1` 这种「读-改-写」在 Python 里要加锁（它跨多条字节码），
        但很多简单操作不必。Rust 没有 GIL，共享计数器要么加锁
        要么用原子类型。Python 的 `itertools.count` 之类不是原子的，
        标准库也基本不暴露内存序；Rust 把 `Ordering` 摆到台面上，
        写错顺序是常见的 bug 来源（虽然默认用 `SeqCst` 最安全）。
      java: |
        Java 的 `AtomicInteger` / `AtomicLong` 与 Rust 的原子类型一一对应，
        `compareAndSet` 对应 `compare_exchange`，`incrementAndGet` 对应
        `fetch_add`。差别在内存序：Java 的原子类内部用 volatile 语义
        （相当于 `SeqCst`），没有给用户选择；Rust 把 `Ordering`
        作为参数暴露出来，可以在确认安全时用更弱的序换性能 ——
        更细致，也更容易写错。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
