# java —— express / operators
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: operators` 的那批。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-operators-v1
    generatedAt: '2026-10-03'

boxes:
  arithmetic:
    code: |
      int a = 7 / 2;              // @note 3 —— 整数除法直接截断
      int b = -7 / 2;             // @note! -3 —— 向零截断，不是向下
      int c = -7 % 3;             // @note! -1 —— 余数符号跟着被除数
      double d = 7 / 2.0;         // @note 3.5 —— 有一边是浮点才是真除

      int big = Integer.MAX_VALUE;
      big + 1;                    // @note! -2147483648 —— 溢出静默回绕
      double p = Math.pow(2, 10); // @note 没有 ** 运算符
    baseline: |
      整数之间 `/` 直接截断（**向零**，所以 `-7 / 2` 是 -3），余数符号跟着被除数。
      想得到真除法得让一边是浮点。要特别注意**溢出**：`int` 加过界会静默回绕成负数，
      编译器不报错也不抛异常。幂要调 `Math.pow`，没有运算符。
    vs:
      javascript: |
        JavaScript 的 `/` 永远得浮点，没有截断这回事；Java 的整数除法会截断，
        想要小数必须让操作数里有一个是浮点。余数两边一致（符号都跟着被除数），
        但 Java 多一个 JavaScript 完全没有的坑：整数溢出静默回绕。
      python: |
        Python 的 `/` 恒得浮点、`//` 向下取整；Java 的 `/` 在整数之间向零截断 ——
        负数上结果不同（`-7 / 2` 在 Java 是 -3、在 Python 的 `//` 是 -4）。
        另一处是溢出：Python 的 int 装多大都行，Java 的 int 会回绕。
    equivalence:
      javascript: analogous
      python: divergent

  equality:
    code: |
      int x = 1, y = 1;
      x == y;                     // @note true —— 基本类型比的是值

      String s1 = "abc";
      String s2 = new String("abc");
      s1 == s2;                   // @note! false —— 对象比的是引用
      s1.equals(s2);              // @note true —— 值相等要用 equals

      Integer i1 = 127, i2 = 127;
      i1 == i2;                   // @note! true —— 小整数有缓存，别依赖
      Integer i3 = 128, i4 = 128;
      i3 == i4;                   // @note! false —— 出了缓存区就现原形
    baseline: |
      `==` 对基本类型比**值**，对对象比**引用**；值相等必须用 `equals`。
      包装类型（`Integer`）是对象，所以 `==` 比的是引用 —— 而 -128~127 有缓存，
      小整数恰好「看起来对」，换个大数就翻车。这个坑每年都要骗到人，
      记住一条就够：**对象一律用 `equals`**。
    vs:
      javascript: |
        JavaScript 的 `===` 与 Java 的 `==` 在「对象比引用」上一样，但 Java 缺一个
        针对对象的默认值比较 —— 得显式调 `equals`。JavaScript 两个内容相同的对象
        也没有内建的值比较，两边最终都得自己写。
      python: |
        Python 的 `==` 默认就比较内容（列表、字典都能直接比），Java 只有基本类型
        有这个待遇，对象必须 `equals`。另一处差别是 Python 的 `is` 明确标出
        「我在比身份」，而 Java 用同一个 `==` 表达两件事，得靠类型去分辨。
    equivalence:
      javascript: divergent
      python: divergent

  logical:
    code: |
      boolean ok = a > 0 && b > 0;    // @note 严格返回 boolean
      // if (0) { }                   // @note! 编译错误：int 不是 boolean
      // int n = count || 10;         // @note! 编译错误：|| 不能当取值用

      String name = (input != null) ? input : "默认";
      int n = Optional.ofNullable(box).orElse(10);   // @note 标准库的默认值写法
      if (a != null && a.b != null) { use(a.b.c); }  // @note 判空要一层层写
    baseline: |
      `&&` / `||` 是**纯布尔**运算符：操作数必须是 `boolean`，返回值也是
      `boolean`。所以「用 `||` 给默认值」这套写法在这里不存在，也没有空值合并与
      可选链 —— 缺省值靠三目或 `Optional`，判空靠 `!= null` 一层层串起来。
      好处是没有真值转换这一类意外。
    vs:
      javascript: |
        JavaScript 的 `&&` / `||` 返回操作数本身，`0 || "默认"` 是常用写法；
        Java 严格返回 boolean，同样的写法编译不过。Java 换来的是「没有真值转换
        这回事」—— 但也少了 `??` 与 `?.` 这两个顺手的工具。
      python: |
        Python 的 `and` / `or` 返回操作数本身，`0 or 默认` 是常用写法；
        Java 的两个运算符严格返回 boolean，同样的写法编译不过。Java 换来的是
        「什么算真」没有歧义，代价是判空取值啰嗦得多。
    equivalence:
      javascript: divergent
      python: divergent

  operator-overloading:
    code: |
      // @note! Java 不支持运算符重载 —— 这一格没有代码可写，只有替代写法

      Money a = new Money(1);
      Money b = new Money(2);
      a.plus(b);              // @note 相加只能写成方法
      a.equals(b);            // @note 判等也只能写成方法

      String s = "共 " + a;   // @note 唯一的重载：+ 对 String 是拼接，
                              //        它会自动调用 a.toString()
    baseline: |
      语言层面**不支持运算符重载**：自定义类型相加只能写方法（`plus` / `add`），
      判等写 `equals`。唯一「重载」过的是 `+` —— 只要有一边是 `String` 就是拼接，
      并把另一边转成字符串。这条规则是编译器写死的，用户改不了。
    vs:
      javascript: |
        两边都做不了运算符重载，`+` 也都对字符串拼接开了口子（会自动把对象转成
        字符串）。所以「自定义类型 + 自定义类型」在这两边都得写成方法。
      python: |
        Python 可以把 `+` / `==` / `<` 都重载到自定义类型上（`__add__` / `__eq__`），
        Java 完全不行。这是两边语法弹性差别最大的地方之一：Python 里
        「让自定义类型用起来像内建类型」是常规写法，Java 里想都不要想。
    equivalence:
      javascript: identical
      python: divergent
