id: concepts-javascript/01-types
topicId: concepts-javascript
title: 类型与值
order: 1
summary: 语言的地基 —— 类型怎么绑、数字怎么存、空值有几个、赋值到底传了什么
features:
  - id: concepts-javascript/type-system
    title: 类型系统
    kind: concept
    summary: JS 是动态 + 弱类型：类型属于运行时的值，比较时还会隐式转换

  - id: concepts-javascript/numeric-type
    title: 数值类型
    kind: concept
    summary: 一个 number 打天下 —— 整数也是浮点，超出安全整数范围静默丢精度

  - id: concepts-javascript/null-value
    title: 空值
    kind: concept
    summary: 两个空值（null / undefined），判空要一次挡住两种

  - id: concepts-javascript/value-semantics
    title: 值语义与引用语义
    kind: concept
    summary: 原始值按值、对象按引用；没有语言级的不可变容器
