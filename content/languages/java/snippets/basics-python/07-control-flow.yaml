  - featureId: basics-python/range-iteration
    equivalence: absent
    code: |
      // @note! 没有 range 类型，只有流上的两个静态方法
      java.util.stream.IntStream.range(0, 5);        // 0,1,2,3,4 —— 同样左闭右开
      java.util.stream.IntStream.rangeClosed(0, 5);  // 0,1,2,3,4,5 —— 闭区间要显式选

      java.util.stream.IntStream.range(0, 5).toArray();      // 要数组才能复用
      java.util.stream.IntStream.range(0, 5).boxed().toList();   // 要 List 得先装箱

      for (int i = 0; i < 5; i++) { }                // 多数场合直接写计数循环更省事

      // @note! 流是一次性的：同一个 range 结果不能遍历两次；
      // Python 的 range 对象则可以反复遍历，且支持 len() 与 in
    body: |
      Java 没有 `range` 类型，只有 `IntStream.range` / `rangeClosed` 这两个流工厂
      方法 —— 区间本身和"遍历"是绑定的，不能像 `range(5)` 那样先存下来再决定怎么用。

      三个连锁差异：

      1. **左闭右开要显式选**。`range` 是 `[start, end)`，`rangeClosed` 是 `[start, end]`
         —— 两个名字相近，写错了就是经典的 off-by-one。
      2. **流是一次性的**。`IntStream.range(0, 5)` 产出的流遍历一次就耗尽，
         要复用必须先 `toArray()` 或 `toList()` 物化。
      3. **元素类型**。`IntStream` 只处理原始 `int`，要当对象用（放进 `List`、
         参与泛型）必须 `boxed()`。

      实践里绝大多数计数场景直接写 `for (int i = 0; i < n; i++)` 更清楚，
      流只在需要接 `map` / `filter` 链时才划算。
  - featureId: basics-python/exception-flow
    equivalence: divergent
    code: |
      // @note! 受检异常：可能抛出的异常必须在方法签名里声明，或当场捕获
      void load() throws java.io.IOException {
          java.nio.file.Files.readString(java.nio.file.Path.of("a.txt"));
      }

      try {
          load();
      } catch (java.io.IOException | java.nio.file.NoSuchFileException e) {   // @note 多重捕获
          log(e);
      } finally {
          cleanup();                     // @note 一定会执行，与 Python 一致
      }

      // @note! 没有 else 子句：想区分"没抛异常的路径"只能靠 try 块的边界
      // @note! 只能抛 Throwable 的子类，这点与 Python 一致

      try (var in = java.nio.file.Files.newInputStream(p)) {   // @note try-with-resources
          in.read();
      }                              // 自动关闭，比 finally 里手写 close 安全
