  - featureId: basics-java/default-params
    equivalence: divergent
    code: |
      def greet(name, greeting="你好"):     # @note! 有默认参数语法
          return f"{greeting}，{name}"

      greet("Ada")
      greet("Ada", greeting="Hi")           # @note! 还能按关键字传

      def add(item, bucket=[]):             # @note! 默认值只在**定义时**求值一次
          bucket.append(item)               # 所有调用共用同一个列表 —— Java 的重载没有这个问题
          return bucket
      add.__defaults__                      # 默认值就存在函数对象上
  - featureId: basics-java/kwargs
    equivalence: divergent
    code: |
      greet(name="Ada", greeting="Hi")      # @note! 有关键字参数，调用处带名字

      def render(text, *, pretty=False, strict=False):
          ...
      # @note! * 之后的参数只能关键字传 —— 语言层面强制调用方写清意图
      render(text, pretty=True)             # 一眼看出这个 True 是什么
