id: concepts-javascript/05-toolchain
topicId: concepts-javascript
title: 工具链与生态
order: 5
summary: 装包、跑起来、测、查、格式化 —— 迁移后每天都要用的那一套
features:
  - id: concepts-javascript/package-manager
    title: 包管理
    kind: concept
    summary: package.json 声明加 node_modules 落地，锁文件是标配

  - id: concepts-javascript/dependency-isolation
    title: 依赖隔离
    kind: concept
    summary: node_modules 就近查找，同一个库的多版本可以共存

  - id: concepts-javascript/runner
    title: 运行时
    kind: concept
    summary: 浏览器与 Node 两个运行时，各自的 API 只有一边有

  - id: concepts-javascript/build-tool
    title: 构建工具
    kind: concept
    summary: 打包与转译是必备环节 —— 浏览器跑不了 node_modules

  - id: concepts-javascript/test-framework
    title: 测试框架
    kind: concept
    summary: 描述式 API：test / expect 一套词汇，断言要挑对匹配器

  - id: concepts-javascript/testing-mock
    title: 测试替身
    kind: concept
    summary: 模块 mock 要提升到 import 之前，而 ESM 绑定只读

  - id: concepts-javascript/lint-format
    title: 代码检查与格式化
    kind: concept
    summary: ESLint 规则可插拔、Prettier 管风格，每个项目一套配置

  - id: concepts-javascript/repl
    title: 交互式环境
    kind: concept
    summary: node 或浏览器控制台，不用建项目就能试一段代码
