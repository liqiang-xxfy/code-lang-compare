# kotlin —— model / modules
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: modules` 的那批：
# module-unit / export-import / default-vs-named / namespace-alias / module-resolution。
#
# 口径说明：这一组对 Java 读者最重要的一条是**默认可见性反过来了** ——
# Java 不写修饰符是「包内可见」，Kotlin 不写是 **public**，而且 Kotlin **没有**
# 「包内可见」这一档，取而代之的是 `internal`（module 级）。
# 另一条是 `internal` 在字节码里会被改名，**不是安全边界** —— 这句必须写，
# 否则读者会把它当成 Java 的包私有来用。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-modules-v1
    generatedAt: '2026-10-03'

boxes:
  module-unit:
    code: |
      // 文件顶部声明包名（可以省略，省略就是根包）
      package com.example.cart

      // @note! 一个文件里能有多个顶层类 —— 文件名不必与类名一致
      class Cart { }
      class Item { }

      // @note 顶层函数挂在「包」里，不挂在类里
      fun totalOf(c: Cart) = 0

      // @note 真正划分边界的不是包，是 **module**（一个 Gradle source set /
      // @note 一个 Maven 项目）—— internal 可见性按它来判
    vs:
      javascript: |
        两边都是「一个文件就是一个单元」，但**边界的性质不同**：
        JavaScript 的模块边界由文件决定，一个文件一个模块，
        导出的东西才能被外面看到；Kotlin 的文件不构成可见性边界 ——
        可见性由包与 module 决定，同一个包里的文件互相看得见。
        最接近 JavaScript 直觉的是 Kotlin 的**顶层 `private`**：
        它才是「只在这个文件里可见」，但那是声明级的修饰符，不是文件级的规则。
      python: |
        Python 的模块就是文件、包就是带 `__init__` 的目录，
        所以目录结构**就是**程序结构，导入路径与文件路径必须对上；
        Kotlin 的包只是一个名字空间，文件放在哪个目录与包名无关
        （约定上会对应，编译器不管）。结果是从 Python 过来会不适应：
        这边可以随意挪文件而不破坏导入，但也少了「看目录就知道结构」这层保障。
      java: |
        两处方向相反的差别。一是**默认可见性**：Java 不写修饰符是
        「同一个包内可见」，Kotlin 不写就是 **public** —— 默认姿态从保守变成了开放，
        迁移时最容易在这一点上把不该暴露的东西暴露出去。
        二是**文件名**：Java 要求 public 类必须与文件同名，
        Kotlin 没这个规矩，一个文件能放好几个顶层类与顶层函数 ——
        所以读 Kotlin 项目的「这个类在哪个文件」不能靠猜。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  export-import:
    code: |
      import kotlin.math.sqrt              // @note 导入具体的东西
      import com.example.util.*            // @note 星号：导入一批
      import com.example.Cart as 购物车     // @note 起别名，避免重名
      import com.example.Config.Companion.DEFAULTS   // @note 连伴生对象成员也能导

      // @note! 与同名显式导入冲突时，**显式的那条赢**，星号不会把它盖掉
      // @note 默认已经导入了 kotlin.* / kotlin.collections.* / kotlin.io.* 等一批
      // @note JVM 上还默认导入 java.lang.* —— 所以 String 这类名字不用自己导
    vs:
      javascript: |
        两边都有具名导入与别名（`as` ↔ `as`），形状接近。
        差别在**导入的粒度**：JavaScript 导入的是模块的导出项，
        「默认导出」与「具名导出」是两种不同的东西；
        Kotlin 导入的是名字（顶层函数、类、对象成员都能导），
        没有「默认导出」这个概念 —— 所以那边 `import x from 'y'`
        与 `import { x } from 'y'` 的区别，在这边根本不存在。
      python: |
        两边的导入写法可以逐条对应（`import ... as ...` ↔ `import ... as ...`），
        连星号导入的争议都相似。差别在**导入的是什么**：
        Python 导入模块对象，所以 `import os` 之后要用 `os.path`；
        Kotlin 导入的是名字，所以能直接把一个函数或对象成员导进来用 ——
        因此 Kotlin 里看不到「模块名」这一层前缀，读代码时
        不容易一眼看出某个名字来自哪里。
      java: |
        Java 的 `import` 同样只是名字的引入，两边都能逐条对应
        （通配符导入、静态导入 ↔ 导入伴生对象成员）。
        差别在**默认导入的范围**：Java 只默认导入 `java.lang`，
        Kotlin 默认导入了 `kotlin.*`、`kotlin.collections.*`、
        `kotlin.text.*` 等一大批 —— 好处是集合与字符串的工具函数
        直接可用，代价是这些名字从哪来，读 Kotlin 代码时不容易看出来。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  default-vs-named:
    code: |
      // @note Kotlin 没有「默认导出」这个概念，所有导出都是按名字的
      // @note 想让某个名字对外可见，标 public（默认就是）即可

      public class Cart { }                 // @note 默认可见性
      internal class Cache { }              // @note 只在同一个 module 内可见
      private fun helper() { }              // @note! 顶层 private = 只在这个文件里可见

      // @note 一个文件里能同时有多个 public 顶层声明，
      // @note 编译后各自成为独立的类，没有「文件级的导出面」
    vs:
      javascript: |
        JavaScript 有「默认导出」这一档 —— 一个模块只能有一个，
        导入时可以随便起名，于是同一个东西在不同文件里叫不同的名字；
        Kotlin 完全没有这个机制，所有对外的名字都是固定的，
        想改名只能在自己这边用 `as` 起别名。
        代价是 Kotlin 这边多写几个字，换来的是「搜名字一定能搜到定义处」。
      python: |
        两边都是「按名字」，没有默认导出这一档 —— 这一层可以对应。
        差别在**控制可见性的手段**：Python 用下划线开头表示私有
        （君子协定，解释器不管），Kotlin 用 `private` / `internal`
        这些修饰符，违反了编译不过。
        另一处是导出面：Python 一个文件就是一个模块，导出的是文件里的名字；
        Kotlin 一个文件能放很多顶层声明，可见性逐个标，没有「文件级导出」的开关。
      java: |
        Java 用 `public` 还是 `private` 控制可见，Kotlin 也有这两档，
        但**默认值相反**：Java 什么都不写是包内可见（保守），
        Kotlin 什么都不写是 public（开放）。而且 Kotlin 没有「包内可见」
        这一档 —— 它把这一层换成了 `internal`（module 级），
        比包大、比 public 小。从 Java 过来时，
        「忘了写修饰符」在两个语言里的后果完全相反。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  namespace-alias:
    code: |
      typealias Handler = (String) -> Unit          // @note 给函数类型起个名字
      typealias UserMap = Map<String, List<Cart>>   // @note 给复杂泛型起名字

      // @note! typealias **不产生新类型** —— 别名与原类型可以互相赋值，
      // @note! 编译器报错时也会展开成原类型，别指望靠它区分两种东西
      val h: Handler = { s -> println(s) }
      val raw: (String) -> Unit = h                 // @note 完全等价

      // @note 想真的造一个新类型用 value class 或 fun interface
      @JvmInline value class UserId(val raw: Int)   // @note 加一层类型保护，运行期不额外开销

      // @note typealias 不能声明在函数里，只能顶层或类内
    vs:
      javascript: |
        JavaScript 没有类型别名这回事（类型只活在文档和工具链里），
        所以「给一个函数签名起名字」这件事在那边根本不存在。
        Kotlin 的 `typealias` 只是个**缩写**，不是新类型 ——
        这一点与 JavaScript 那边「起个名字方便读」的动机一致，
        但 Kotlin 会因为别名影响编译器的报错文本（会展开成原类型）。
      python: |
        Python 的类型别名只是普通的赋值（`Handler = Callable[[str], None]`），
        运行期就是一个变量；Kotlin 的 `typealias` 是语言级的声明，
        可以带类型参数、能被编译器识别。共同点是**都不产生新类型** ——
        两边都没法靠别名把 `str` 与 `UserId` 区分开。
        想做「有名字的新类型」，Python 那边靠 NewType，Kotlin 靠 value class。
      java: |
        Java 没有类型别名（`typedef` 是 C 的东西），想让一个复杂泛型好读
        只能抽一个类出来 —— 而抽类就真的产生了新类型。
        Kotlin 的 `typealias` 是纯粹的缩写，不产生新类型，
        想产生新类型另有 `value class`（带类型保护，且多数情况下
        不会带来装箱开销）。所以 Java 那边「为了可读性抽个类」
        的写法搬到 Kotlin 里可以用 typealias，但**语义与 Java 的抽类不同**。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  module-resolution:
    code: |
      import com.example.cart.Cart          // @note 按包名解析，与文件位置无关

      // @note 默认导入的包（不用写 import 就能用）：
      // @note   kotlin.*  kotlin.collections.*  kotlin.text.*  kotlin.io.*
      // @note   kotlin.ranges.*  kotlin.sequences.*  kotlin.math.*
      // @note JVM 上另有 java.lang.* 与 kotlin.jvm.*

      // @note 同名冲突时用 as 起别名，或者写全限定名
      // @note 依赖从哪来由构建工具决定（Gradle / Maven），语言层面只有包名
    vs:
      javascript: |
        解析规则的起点不同：JavaScript 的导入写的是**路径**
        （相对路径或包名），所以文件放在哪儿是语义的一部分；
        Kotlin 导入的是**包名加名字**，与文件位置无关 ——
        同一份代码把文件挪到别的目录，只要包声明不改就照样编译。
        另一处是默认导入：JavaScript 什么都不默认导入，
        Kotlin 有一批隐式可用的名字，读代码时这些名字「凭空出现」。
      python: |
        解析规则相反：Python 的导入路径**就是**文件路径，
        所以「装了什么、放在哪里」直接决定能不能导入，
        `sys.path` 与虚拟环境也因此成了日常话题；
        Kotlin 的包名是纯粹的名字空间，解析靠构建工具的依赖列表，
        文件位置不参与。共同点是两边都有一批内置可用的名字，
        只是 Python 需要显式 `import` 的东西在 Kotlin 里可能已经默认导入了。
      java: |
        两边都按包名解析、都用构建工具管依赖，这一格最接近。
        差别在**默认导入的范围**：Java 只默认导入 `java.lang`，
        用 `List` 还得写 `import java.util.List`；
        Kotlin 默认导入了集合、字符串、区间、序列等一整批工具包 ——
        所以 Kotlin 文件顶部的 import 列表通常短得多，
        但反过来，看到 `map` 或 `filter` 时得知道它们来自默认导入。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
