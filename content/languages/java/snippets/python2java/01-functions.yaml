      static Map<String, Object> configure(Map<String, Object> options) { ... }
      // @note! Java 没有关键字参数，调用方要么传 Map，要么用 Builder
  - featureId: python2java/exercise
    equivalence: analogous
    code: |
      static String summarize(List<String> items) {
          return summarize(items, "-", "", 0);
      }

      static String summarize(List<String> items, String sep, String prefix, int limit) {
          List<String> picked = limit <= 0 ? items : items.subList(0, Math.min(limit, items.size()));
          return prefix + String.join(sep, picked);
      }
