  - featureId: basics-java/object-access
    equivalence: divergent
    code: |
      const d = { a: 1 };
      d.a;                  // 1
      d["a"];               // @note 1 —— 点号与方括号完全等价
      d.z;                  // @note! undefined —— 缺失静默返回空值，与 Java 的 get 一致

      "a" in d;             // true —— 判存在要用 in 或 hasOwnProperty
      // @note 同样是"分不出键不存在与值是 undefined"的老问题

      // @note 好处是没有"点号取键还是取字段"的区分：两者在这里是一回事
  - featureId: basics-java/object-iterate
    equivalence: analogous
    code: |
      Object.entries(d);              // @note [['a', 1], ['b', 2]] —— 要自己解构
      for (const [k, v] of Object.entries(d)) { }
      Object.keys(d);
      Object.values(d);

      for (const k in d) { }          // @note! 会连原型链上的可枚举属性一起遍历

      // @note! 顺序规则不同：整数键被提前，其余按插入 ——
      // 没有 LinkedHashMap / TreeMap 那种"选实现决定顺序"
      // @note 遍历时增删是未定义行为，但不会抛异常
  - featureId: basics-java/object-default
    equivalence: analogous
    code: |
      d.k ?? 0;                       // @note! 只对 null / undefined 兜底
      d.k ??= [];                     // @note 这个才是"不存在就写入"

      // @note! 没有 getOrDefault / computeIfAbsent 那一组方法：
      // ?? 完全只读，"写默认值"要靠 ??= 或手写 if
      if (!(k in d)) d[k] = [];

      const g = new Map();
      g.get(k) ?? (g.set(k, []), g.get(k));   // @note 没有 computeIfAbsent，写起来更绕
  - featureId: basics-java/object-merge
