snippets:
  - featureId: basics-javascript/function-declare
    equivalence: divergent
    code: |
      def declared(a):
          return a

      # @note 只有 def 一种形式。匿名函数用 lambda，但只能是单个表达式：
      add = lambda a, b: a + b        # @note! 不能有语句、不能多行、不能写类型标注
      # add2 = lambda a, b: if a: 1   # 语法错误

      # @note! def 在执行到它时才创建函数对象；调用写在定义之前会 NameError
      # declared(1)

      def typed(a: int) -> int:        # @note 类型标注是给工具看的，运行时不做检查
          return a
    body: |
      **只有 `def` 一种形式**。想「匿名」用 `lambda`，但它只能是**单个表达式** ——
      不能有语句、不能多行、不能写类型标注。

      `def` 在执行到它时才创建函数对象，所以**调用写在定义之前会 `NameError`**，
      没有 JS 那种声明提升。类型标注可以写，但那是给工具看的，运行时不做检查。
  - featureId: basics-javascript/default-params
    equivalence: divergent
    code: |
      def f(x=[]):          # @note! 默认值只在「函数定义时」求值一次
          x.append(1)
          return x

      f()      # [1]
      f()      # [1, 1]   ← @note! 被上一次调用污染了；这是 Python 最经典的坑之一
      f()      # [1, 1, 1]

      def safe(x=None):     # @note 正解：用不可变哨兵 + 函数体内新建
          if x is None:
              x = []
          x.append(1)
          return x

      safe()   # [1]
      safe()   # [1]  —— 干净

      # @note 同理 {}/set() 作默认值也有问题；不可变类型（None/0/''/元组）当默认值是安全的
    body: |
      默认参数在**函数定义时求值一次**，所以 `def f(x=[])` 里的那个列表
      **会被所有调用共享** —— 第一次调用塞进去的东西，第二次还看得见。

      这是这套内容里「看起来完全一样的两行代码行为不同」最好的例子，也是最高频的坑之一。
      正解是用不可变哨兵：`def safe(x=None)`，再在函数体内新建。
      同理 `{}`、`set()` 作默认值也有问题；`None` / `0` / `''` / 元组这类不可变值是安全的。
  - featureId: basics-javascript/kwargs
    equivalence: divergent
    code: |
      def create(name, age=18, *, active=True):   # @note! * 之后的参数只能按名传
          return {'name': name, 'age': age, 'active': active}

      create('Ada')                       # @note 位置传参
      create('Ada', 36)                   # 位置
      create('Ada', age=36, active=False) # @note 关键字传参：调用处意图一目了然
      # create('Ada', 36, False)          # @note! TypeError：active 必须写名字

      def allkw(**kw): ...                # @note ** 收集所有关键字参数
      allkw(a=1, b=2)

      # @note Python 原生支持关键字参数，不需要像 JS 那样靠对象解构模拟；
      #       代价是 **kw 会把拼错的参数名静默吞掉
    body: |
      **原生支持关键字参数**，调用处写 `name=value` 即可，意图一目了然 ——
      不需要像 JS 那样靠对象解构模拟，也就没有「参数名拼错只拿到 `undefined`」那种静默失败。

      真正的能力在 `/` 与 `*` 两个分隔符：`def f(a, /, b, *, c)` 表示 `a` 只能位置传、
      `b` 两种都行、`c` 只能关键字传 —— **语言层面强制调用方写清楚意图**。
      `**kw` 收集所有关键字参数，代价是会把拼错的参数名一起吞掉。
  - featureId: basics-javascript/rest-params
    equivalence: analogous
    code: |
      def total(*nums):                 # @note! 收集成「元组」，不是列表
          return sum(nums)

      total(1, 2, 3)                    # 6
      type(nums) if False else None

      def mixed(first, *rest):          # @note 位置参数在前，* 在后
          return first, rest

      mixed(1, 2, 3)                    # (1, (2, 3))

      nums = [1, 2]
      total(*nums)                      # @note 调用处用 * 展开

      d = {'a': 1}
      def g(a=None): ...
      g(**d)                            # @note! 字典用 ** 展开成关键字参数
    body: |
      `*nums` 收集成**元组**（不可变），不是列表；同样只能放在最后一个参数。

      调用处的展开也用 `*`（`total(*nums)`），而且多一种：**字典用 `**` 展开成关键字参数**。
      与 JS 相比多出来的能力是把「位置可变」与「关键字可变」分成两个参数 ——
      这既是能力（能同时接住两类），也是陷阱（`**kwargs` 会把拼错的参数名静默吞掉）。
  - featureId: basics-javascript/return-multiple
    equivalence: analogous
    code: |
      def divmod_like(a, b):
          return a // b, a % b          # @note 看起来返回两个值

      q, r = divmod_like(7, 2)          # q=3, r=1  —— 解包接收
      type(divmod_like(7, 2))           # <class 'tuple'>  —— @note! 其实是一个元组

      pair = divmod_like(7, 2)          # (3, 1)  —— 不解包就拿整个元组

      first, *rest = divmod_like(7, 2)  # @note 可以用 * 收集剩余
      first                             # 3
      rest                              # [1]

      # @note 内置的 divmod() 也是这个语义；返回元组不可变，比 JS 的数组更安全
    body: |
      `return a, b` 返回的其实是**元组**，不是「真的返回两个值」—— 这点在 `x = f()` 时
      会暴露：拿到的是整个元组。元组不可变，比 JS 的数组更安全。

      解包接收也支持用 `*` 收集剩余：`first, *rest = f()`。
      内置的 `divmod()` 就是这套语义的标准例子。
  - featureId: basics-javascript/lambda-arrow
    equivalence: divergent
    code: |
      double = lambda n: n * 2
      double(2)                    # 4

      # @note! 只能是一个表达式：不能有语句、不能赋值、不能多行、不能写标注
      # @note 而且没有 return——表达式的结果就是返回值

      # 主要用途是短回调：
      sorted(['bb', 'a'], key=lambda s: len(s))     # ['a', 'bb']

      # @note 闭包捕获的是变量不是值，循环里创建 lambda 会出现经典的延迟绑定：
      fs = [lambda: i for i in range(3)]
      [f() for f in fs]            # [2, 2, 2]  —— @note! 不是 [0, 1, 2]
      fs2 = [lambda i=i: i for i in range(3)]       # 正解：用默认参数把值绑住
      [f() for f in fs2]           # [0, 1, 2]

      # @note JS 的箭头函数有独立的 this 语义，Python 的 lambda 没这个问题（没有 this）
    body: |
      `lambda` 只有**一个表达式**：不能有语句、不能赋值、不能多行、不能写标注，
      也没有 `return` —— 表达式的结果就是返回值。使用范围比箭头函数窄得多，
      主要用在 `key=` 这类短回调上。

      要当心闭包**捕获的是变量而不是值**：循环里创建 `lambda` 会出现经典的延迟绑定
      （三个都返回 `2`），正解是用默认参数把值绑住。JS 那边有 `this` 的坑，这边没有 `this`，
      但换来了这个。
  - featureId: basics-javascript/function-callback
    equivalence: analogous
    code: |
      def apply(fn, x):            # @note 函数可以当参数传
          return fn(x)

      apply(lambda n: n + 1, 1)    # 2

      list(map(lambda n: n * 2, [1, 2]))    # @note! 函数在前、可迭代在后（JS 是数组在前）
      list(filter(lambda n: n > 1, [1, 2]))

      # @note filter 的第一个参数传 None 表示「按真值过滤」
      list(filter(None, [0, 1, '', 'a']))   # [1, 'a']

      handlers = {'on_ok': lambda: 'ok'}
      handlers['on_ok']()                   # 'ok'  —— 函数也能存在字典里
    body: |
      函数同样是一等值：`def` 出来的和 `lambda` 出来的都能传递、返回、存进字典。

      差别在**参数顺序**：JS 是「数组在前、函数在后」（`arr.map(fn)`），
      这里的 `map` / `filter` 是「函数在前、可迭代在后」，而 `sorted(arr, key=fn)`
      又是另一种排法 —— 没有统一规律，只能逐个记。
      另外 `filter` 的第一个参数传 `None` 表示「按真值过滤」。
  - featureId: basics-javascript/function-docstring
    equivalence: divergent
    code: |
      def add(a, b):
          """计算两数之和。

          Args:
              a: 第一个加数
              b: 第二个加数

          Returns:
              两数之和
          """
          return a + b

      add.__doc__              # @note! 文档是「数据」，可以直接读出来
      help(add)                # @note 直接打印格式化后的文档
      add.__name__             # 'add'

      # @note! docstring 必须是函数体的第一条语句，前面写别的就不算
      def broken():
          x = 1
          """这不是 docstring，只是被丢弃的字符串表达式"""
      broken.__doc__           # None

      # @note 还能被 doctest 执行：>>> add(1, 2) 会真的跑一遍
    body: |
      文档是**字符串字面量**，直接挂在对象的 `__doc__` 上 —— `help(f)`、
      `print(f.__doc__)` 都能直接拿到。

      这意味着文档在这里是「**数据**」：可以被反射、被 `help()` 排版，
      甚至被 `doctest` 执行。要注意 docstring 必须是函数体的**第一条语句**，
      前面写了别的就不算（`__doc__` 会是 `None`）。
  - featureId: basics-javascript/arg-passing
    equivalence: analogous
    code: |
      def mutate(lst, num, d):
          lst.append(1)        # @note! 原地修改会传染到外部
          num = 999            # @note 重新绑定不会
          d = {'replaced': True}   # @note 重新绑定不会

      a, n, o = [], 1, {'x': 1}
      mutate(a, n, o)
      a      # [1]        —— 被改了
      n      # 1          —— 没变
      o      # {'x': 1}   —— 没变

      # @note! 口诀：改内容会传染，改绑定不会。两门语言都是这个规则
      # @note 官方说法是 call by object reference / call by sharing，
      #       既不是值传递也不是引用传递——说「引用传递」是不准确的
    body: |
      和 JS 是**同一个规则**，所以这一格不用重新学：既不是值传递也不是引用传递，
      而是「传递对象引用的副本」（官方说法是 call by object reference / call by sharing）。

      传入不可变对象（数字、字符串、元组），函数内重新赋值不影响外部；
      传入可变对象（列表、字典），函数内**原地修改会影响外部**，但重新赋值不影响。
      记住一句话：**改内容会传染，改绑定不会。**
