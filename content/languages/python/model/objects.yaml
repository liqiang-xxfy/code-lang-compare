# python —— model / objects
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: objects` 的那批。
# 这一组以 Python 为基准时展示在「类与数据模型」章（见 catalog/model/python.yaml）。

review:
  state: draft

boxes:
  class-declaration:
    code: |
      class User:
          kind = "person"              # @note 类属性：所有实例共享
          def __init__(self, name):
              self.name = name         # @note 实例属性：每个实例一份

      u = User("Ada")
      u.kind, User.kind                # @note 都能读到 —— 查找先实例后类
      u.__class__                      # @note 类本身也是对象
      User = type("User", (), {})      # @note 可以用 type() 动态造类

      # @note 类体是一个作用域，但方法内部**看不到**类属性（要写 self. 或类名）
    baseline: |
      类是**运行时的对象**：可以反射、可以动态创建（`type(...)`）、可以作为值传递。
      类属性与实例属性共用一条查找链（先实例、后类），所以「这个属性从哪来」
      要看是谁设的。`self` 必须显式写在每个方法的第一个参数里 ——
      这不是啰嗦，而是「方法就是普通函数」这个设计的直接后果。
    vs:
      javascript: |
        JavaScript 的 `class` 是语法糖，运行时没有类这个实体；Python 的类是
        真对象。两边的属性查找都是「沿一条链往上找」，但这里多了类属性这一层
        显式概念，而 JavaScript 要理解成原型链。
      java: |
        Java 的类在编译期就固定了，运行时不能凭空造一个新类；Python 的类
        是普通对象，`type()` 三个参数就能造一个。代价是 Java 的类型检查更强，
        Python 的灵活性更高。
    equivalence:
      javascript: divergent
      java: divergent

  constructor:
    code: |
      class User:
          def __init__(self, name, age=0):     # @note 不是构造函数，是初始化钩子
              self.name = name
              self.age = age

          @classmethod
          def from_dict(cls, d):                # @note 替代构造：类方法
              return cls(d["name"], d.get("age", 0))

          def __new__(cls, *a, **kw):           # @note 真要控制「造对象」才用它
              return super().__new__(cls)

      User("Ada")                               # @note __new__ 先生成实例，再 __init__
      User.from_dict({"name": "Ada"})
    baseline: |
      `__init__` **不是构造函数** —— 调用 `User(...)` 时对象已经由 `__new__` 造好了，
      `__init__` 只是往里填东西（所以它不该有返回值）。想做多种构造方式就写
      **类方法**（`@classmethod` 的 `from_xxx`），这是标准库里的通行惯例
      （`datetime.fromtimestamp`、`dict.fromkeys`）。
    vs:
      javascript: |
        JavaScript 的 `constructor` 也是唯一入口、多种构造靠静态工厂；
        两边思路一样。差别是 Python 把「造对象」与「初始化」拆成了
        `__new__` / `__init__` 两步，JavaScript 合成了一步。
      java: |
        Java 的构造函数**可以重载**，同名不同参数表编译器自动挑，
        还能用 `this(...)` 串起来；Python 一个 `__init__` 要处理所有情形，
        替代构造只能靠命名不同的类方法。
    equivalence:
      javascript: analogous
      java: divergent

  fields-and-properties:
    code: |
      class Circle:
          pi = 3.14159                    # @note 类属性

          def __init__(self, r):
              self._r = r                 # @note 实例属性（下划线表示内部）

          @property
          def area(self):                 # @note 像属性一样访问，实际调方法
              return self.pi * self._r ** 2

          @area.setter
          def area(self, v):
              self._r = (v / self.pi) ** 0.5

          __slots__ = ("_r",)             # @note 限制实例属性，省内存

      Circle(2).area                      # @note 不带括号
    baseline: |
      类属性与实例属性分开：类属性共享一份，实例属性各是各的（在 `__init__` 里
      赋 `self.x` 就创建了，**不需要预先声明**）。`@property` 把方法伪装成属性，
      访问时不带括号、背后可能跑代码。`__slots__` 能限制实例属性名并省内存 ——
      这是「属性不必声明」的一个代价的补偿。
    vs:
      javascript: |
        两边都能定义「像属性的方法」，写法不同（`get` / `set` vs `@property`）。
        差别在属性从哪来：JavaScript 的实例字段要在类体里声明或在构造函数里赋，
        这里随便 `self.x = ...` 就创建了 —— 灵活但打错字也不会报错。
      java: |
        Java 没有属性这种东西，字段就是字段、getter 就是方法，调用点必须带括号。
        另外 Java 的字段**必须声明**（编译期就固定有哪些字段），
        Python 的实例可以随时长出新属性 —— 这也是 `__slots__` 存在的理由。
    equivalence:
      javascript: analogous
      java: divergent

  methods-and-receiver:
    code: |
      class Counter:
          def __init__(self): self.n = 0
          def bump(self): self.n += 1

      c = Counter()
      f = c.bump          # @note! 取属性时就绑定好了：f 是个「绑定方法」
      f(); f()            # @note 正常执行，c.n 变成 2

      Counter.bump(c)     # @note 等价写法：显式传 self

      # @note 装饰器会改变「谁算 self」：@staticmethod 不收、@classmethod 收类
    baseline: |
      `self` 是显式参数，绑定发生在**取属性的那一刻** —— `f = c.bump` 之后
      `f()` 一切正常，不存在「丢了接收者」这回事。类方法用 `@classmethod`
      收 `cls`，静态方法用 `@staticmethod` 谁都不收。区分这三种是 Python 里
      很容易忽略的一处：装饰器决定了第一个参数到底是什么。
    vs:
      javascript: |
        JavaScript 的 `this` 由**调用方式**决定，方法取出来单独调用就丢了；
        Python 在取属性时就绑定好，所以「把方法当回调传出去」在这边完全安全。
        这是两边读代码时最需要换脑子的一处。
      java: |
        Java 的 `this` 恒等于当前实例，也不用写进参数表；Python 的 `self`
        必须显式写。两边都不会出现「接收者丢了」这种事。
    equivalence:
      javascript: divergent
      java: analogous

  inheritance:
    code: |
      class Animal:
          def speak(self): return "..."

      class Dog(Animal):
          def speak(self): return super().speak() + " 汪"

      class A: pass
      class B: pass
      class C(A, B): pass          # @note 多继承

      C.__mro__                    # @note 方法解析顺序：C -> A -> B -> object
      class D(A, B): pass
      # @note! 「菱形继承」时 MRO 决定先找谁 —— 它是可查的、确定的

      # 惯用做法是 mixin：只提供一小块行为，不单独实例化
      class JsonMixin:
          def to_json(self): ...
    baseline: |
      **支持多继承**，冲突由 MRO（方法解析顺序）裁决 —— 它是确定的、可查询的
      （`C.__mro__`），不是「先写谁就赢」这种模糊规则。实际用法里很少真的多继承，
      最常见的是 **mixin**：一个只提供一小块行为的类，混进来补某种能力。
    vs:
      javascript: |
        JavaScript 只能单继承，多份行为复用要靠混入原型或组合；Python 有多继承
        加 MRO 这套正式机制。两边的继承本质也不同：那边是原型链，
        这里是类与类的父子关系。
      java: |
        Java 的类只能单继承，但**可以实现多个接口**，接口带默认方法之后
        也能提供实现 —— 所以「多份能力」在 Java 里走接口这条路。
        Python 直接多继承类，更灵活但冲突规则也要更小心。
    equivalence:
      javascript: divergent
      java: divergent

  access-control:
    code: |
      class Account:
          def __init__(self):
              self._balance = 0        # @note 单下划线：约定「内部使用」
              self.__secret = 1        # @note! 双下划线：名称改写

      a = Account()
      a._balance                       # @note 完全能访问 —— 只是约定
      a.__secret                       # @note! AttributeError
      a._Account__secret               # @note! 但这样就能拿到 —— 改写不是保护

      # @note 双下划线的真正目的是避开**子类的意外覆盖**，不是保密
      class Sub(Account):
          def __init__(self):
              self.__secret = 2        # @note 这是 _Sub__secret，与父类那个不冲突
    baseline: |
      **全是约定**：单下划线表示内部、双下划线触发名称改写（`__x` 变成
      `_类名__x`），但两者**都能访问**。双下划线的目的不是保密，
      而是让子类里同名的 `__x` 不会意外覆盖父类的那个 —— 它是为继承设计的，
      不是为封装设计的。真要保密只能靠闭包或设计上的隔离。
    vs:
      javascript: |
        JavaScript 的 `#` 是引擎级的真私有（类外访问是语法错误、反射也拿不到），
        Python 两个下划线加起来也只是改名。所以「这个字段是不是真碰不到」
        在两边的答案完全不同。
      java: |
        Java 的 `private` 由编译器强制：类外访问直接编译错误。Python 这边没有
        任何一档是强制的 —— 从 Java 换过来最容易误以为 `__x` 和 `private`
        是一回事，其实前者只是改名，`a._Account__secret` 照样拿得到。
    equivalence:
      javascript: divergent
      java: divergent
