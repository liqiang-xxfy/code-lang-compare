  - featureId: python2java/types-intro
    equivalence: divergent
    code: |
      int count = 0;                  // @note! 类型写在声明上，跟着名字走一辈子
      // count = "一";                // 编译错误 —— 错误提前到编译期

      var inferred = 0;               // @note var 只是省略类型名，inferred 依然是 int

      Object anything = 1;            // @note 想装任意类型只能用 Object
      int back = (int) anything;      // @note! 取回来要强转，转错在运行时抛 ClassCastException
  - featureId: python2java/numeric-types
    equivalence: divergent
    code: |
      // @note! 整数按位宽分档：byte / short / int / long，都有上限
      Integer.MAX_VALUE + 1;          // @note! -2147483648 —— 静默回绕，不报错
      long big = 9007199254740993L;   // 装得下；再大要用 BigInteger，运算符随之失效

      7 / 2;                          // @note! 3 —— 整数除法，Python 那边是 3.5
      -7 / 2;                         // -3 —— 向零截断
      -7 % 3;                         // @note! -1 —— 与 Python 的 2 不同

      Math.floorDiv(-7, 2);           // @note -4 —— 要 Python 那种向下取整得换这一对
      Math.floorMod(-7, 3);           // 2 —— floorDiv 与 floorMod 必须同时换

      1 / 0;                          // @note! ArithmeticException（整数除零才抛）
      1.0 / 0;                        // @note! Infinity —— 浮点除零静默
