# 迁移学习路线 —— JavaScript → Rust
# 骨架期样板：先列三个阶段，后续按同形态细化

- id: js2rust-1-mental-model
  order: 1
  title: 先接受「编译器会一直拦你」
  durationHint: 3-4 小时
  todo:
    - 通读「心智模型」板块，把两边在这些根本差异上的映射建起来
    - 只回答四个问题（答案在「心智模型」板块里）：类型系统、并发模型、错误处理、值语义 vs 引用语义
    - 明确写下「哪些 JS 直觉必须丢掉」——对象随处共享、null 表达缺失、异常兜底
  acceptance:
    - 能说清移动、借用、克隆三者的区别，并知道什么时候该用哪个
    - 知道 Rust 没有 null，缺失用 Option 表达
  resources:
    - label: Rust 程序设计语言（中文版）
      url: https://kaisery.github.io/trpl-zh-cn/

- id: js2rust-2-basics
  order: 2
  title: 基础语法逐条对照
  durationHint: 1 周
  todo:
    - 按基础语法板块的章节逐格对比，每看一格手写一遍两边的代码（不要复制）
    - 把踩到的坑记进本方向的迁移陷阱清单并打上自己的严重度
    - 练习把一段 JS 的对象处理改写成 struct + impl，体会类型定义与行为放在一起的写法
  acceptance:
    - 能独立写出变量、集合、控制流、函数与结构体，无编译错误
    - 能让一段涉及所有权的代码通过借用检查器，并解释为什么这样写是对的
  resources:
    - label: Rust by Example
      url: https://doc.rust-lang.org/rust-by-example/

- id: js2rust-3-tooling
  order: 3
  title: 接上工具链与工程习惯
  durationHint: 1 周
  todo:
    - 用 cargo 新建项目，跑通 build / test / clippy / fmt 四步
    - 把 npm 的心智映射到 crates.io 与 Cargo.toml
    - 认真读一次 borrow checker 的报错全文 —— 它的建议通常就是修法
  acceptance:
    - 能独立新建 crate 并发布一个可执行程序
    - 遇到借用冲突时能读懂 E0502 / E0499 这类错误码并自行修复
  resources:
    - label: Cargo 手册
      url: https://doc.rust-lang.org/cargo/
