id: basics-python/08-functions
topicId: basics-python
title: 函数与参数
order: 8
summary: 默认参数只求值一次、关键字参数能强制具名、返回多个值其实是元组——从 Python 出发看这一层

features:
  - id: basics-python/function-declare
    title: 函数声明
    kind: syntax
    summary: 只有 def 一种形式，匿名只能靠单表达式

  - id: basics-python/default-params
    title: 默认参数
    kind: behavior
    summary: 默认值在定义时求值一次，可变默认值会被共享

  - id: basics-python/kwargs
    title: 关键字参数
    kind: behavior
    summary: 按名字传参，还能用 / 与 * 强制调用方写清意图

  - id: basics-python/rest-params
    title: 可变参数
    kind: syntax
    summary: "位置可变参数收成元组，关键字可变参数收成字典"

  - id: basics-python/return-multiple
    title: 多返回值
    kind: behavior
    summary: return a, b 返回的其实是元组

  - id: basics-python/lambda-arrow
    title: lambda
    kind: behavior
    summary: 只有一个表达式，主要用在短回调上

  - id: basics-python/function-callback
    title: 一等函数与回调
    kind: syntax
    summary: 函数是值，但内置函数的参数顺序不统一

  - id: basics-python/function-docstring
    title: 文档字符串
    kind: syntax
    summary: docstring 是字符串对象，不是注释

  - id: basics-python/arg-passing
    title: 参数传递
    kind: behavior
    summary: 传的是对象引用的副本，可变性决定表现
