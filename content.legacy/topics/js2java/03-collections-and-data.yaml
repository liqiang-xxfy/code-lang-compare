id: js2java/03-collections-and-data
topicId: js2java
title: 3. 容器与数据建模
order: 3
summary: 从 JavaScript 到 Java：数组变成两层、data 对象变成 record、subList 是视图

features:
  - id: js2java/collections-intro
    title: 本章要解决什么
    kind: concept
    summary: 容器要选两次，而且只能装对象
    body: |
      JS 的容器只有三种形态：数组、对象字面量、`Map` / `Set`。
      到了 Java，它们各对应**两层**：接口（`List` / `Map` / `Set`）与实现
      （`ArrayList` / `HashMap` / `LinkedHashMap`…）。

      多出来的那个决定有实际后果：

      | 想要 | 选型 |
      | --- | --- |
      | 随机访问快 | `ArrayList` |
      | 头部插入删除多 | `LinkedList`（但随机访问慢） |
      | 按插入顺序遍历 | `LinkedHashMap` |
      | 按键排序遍历 | `TreeMap` |

      这次选型在 JS 里不存在 —— `Map` 保证插入顺序，数组就是数组。
      **迁移时的默认答案是 `ArrayList` / `HashMap`**，只在确有顺序或性能需求时才换。

      另一处硬约束：**泛型只能装对象**。

      ```java
      List<int> bad;              // 编译错误
      List<Integer> ok;           // 只能这样
      ```

      于是 `List<number>` 变成 `List<Integer>` / `List<Double>`，
      而且从里面取出数字时会拆箱 —— 那个"拆箱才炸"的时机在这里同样适用。

  - id: js2java/list-model
    title: 列表：subList 是视图，越界一律抛
    kind: behavior
    refFeatureId: basics-javascript/array-slice
    summary: 切片变成方法调用，而且可能是视图
    body: |
      对应关系大体能一一对上，但有两处要专门记。

      **1. 取一段可能是视图，不是拷贝**

      ```java
      xs.subList(1, 3);                    // 视图：改它会写回原列表
      new ArrayList<>(xs.subList(1, 3));   // 拷贝：独立的新列表
      ```

      JS 的 `slice()` **总是**返回新数组，所以"取一段就是复制"是那边的铁律。
      这边不是 —— 带着那个直觉用 `subList`，会在"我改的是副本"的假设下
      改到原列表，而且不会有任何报错。

      **2. 缺了 JS 里那些便利写法**

      | 想要 | JS | Java |
      | --- | --- | --- |
      | 负索引 | `at(-1)` | `get(size() - 1)` |
      | 步长 | `filter((_, i) => ...)` | 自己写循环 |
      | 反转 | `[...xs].reverse()` | `Collections.reverse(new ArrayList<>(xs))` |

      好消息是**越界行为一致**：两边的下标越界都是当场抛/当场给空值 ——
      不，准确说，Java 抛 `IndexOutOfBoundsException`，JS 给 `undefined`。
      这边更严格，`undefined` 带着问题漂到下游这类 bug 在这里不会发生。

  - id: js2java/map-model
    title: 映射：键的相等由 equals 决定
    kind: behavior
    refFeatureId: basics-javascript/object-access
    summary: get 缺省返回 null，但键必须重写 equals/hashCode
    body: |
      缺失键的行为**两边一致**：`get` 返回 `null`，不抛。
      这一点比 Python 那种"缺失即抛"的写法省事，但也少了那层保护。

      ```java
      map.get("z");              // null
      map.getOrDefault("z", 0);  // 0
      ```

      真正需要重建的是**键的相等规则**。

      JS 里对象的键只能是字符串或 Symbol，而字符串按值比较，
      所以"用同一个字符串取同一个值"从来不是问题。
      这里键可以是任意对象，但**按 `equals` / `hashCode` 判等**：

      ```java
      record Point(int x, int y) { }        // record 自动生成这一对，当键是安全的
      var grid = new HashMap<Point, String>();

      class Bad { }                          // 普通类不重写 → 比引用身份
      map.put(new Bad(), 1);
      map.get(new Bad());                    // null —— 放进去就再也找不出来
      ```

      **迁移要点**：用自定义类型当键时，要么用 `record`，要么手写
      `equals` + `hashCode`（两个都要）。这在 JS 里不是问题，
      所以是容易漏掉的一步 —— 而且症状是"明明放进去了却取不到"，
      不报错，只返回 `null`。

  - id: js2java/data-modeling
    title: 数据建模：对象字面量变成 record
    kind: behavior
    refFeatureId: basics-javascript/object-create
    summary: 一次定义、之后再也不用担心字段名
    body: |
      JS 里描述一条记录随手就是对象字面量：

      ```js
      const user = { id: 1, name: "Ada", active: true };
      ```

      Java 里同样的形态是 `Map<String, Object>`，但那样会丢掉类型：

      ```java
      var user = new HashMap<String, Object>();
      user.put("id", 1);
      int id = (int) user.get("id");       // 每次都要强转，拼错的键查不出来
      ```

      正解是用 `record`：

      ```java
      record User(int id, String name, boolean active) { }
      var u = new User(1, "Ada", true);
      u.name();                            // 编译期就有类型
      // u.nmae();                         // 编译错误
      ```

      判据与在 Python 里一样：**这组字段固定吗？**
      固定就用 `record`（或用类），确实动态才用 `Map`。

      **迁移时的心理障碍**：JS 里定义"一条记录的类型"成本很高
      （要手写类或上 TypeScript），所以那边习惯了随手对象字面量。
      这里 `record` 只要一行，而且立刻换来"字段名写错编译不过"——
      值得改掉那个习惯。

      `record` 还顺带给了按字段的 `equals` / `hashCode` / `toString`，
      以及不可变性 —— 这些在 JS 里都得自己写。

  - id: js2java/collections-exercise
    title: 练习：把分组统计迁到 Java
    kind: exercise
    summary: 三个改动点，其中一个是类型选择
    body: |
      下面这段 JS 按部门把员工分组，并算出每个部门的平均年龄。

      请把它迁到 Java，要求**行为完全一致**：

      1. 分组结果的容器怎么选（注意"按插入顺序"这件事）
      2. "员工"用什么类型承载，说明理由
      3. 输入为空时返回空结果

      对照参考实现时，重点看两处：**分组累加**用了哪个方法
      （JS 的 `??=` 在这里没有对应写法），以及**平均年龄**那一行。

      （提示：第 1 问里"按插入顺序"这一点在 JS 里是 `Map` 的默认行为，
      在这里需要特意挑一个实现类。第 3 问注意别让整数除法悄悄生效。）
