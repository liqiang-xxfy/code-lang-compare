# go —— model / errors
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: errors` 的那批。
#
# Go 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Go 与那个基准两门语言（R25）。

review:
  state: draft

boxes:
  throw-raise:
    code: |
      func divide(a, b int) (int, error) {   // @note! error 是普通返回值，不是异常
        if b == 0 {
          return 0, errors.New("除数为零")
        }
        return a / b, nil
      }

      // @note panic 用于「不该发生」的情况：越界、nil 解引用、显式 panic()
      func mustPositive(n int) {
        if n <= 0 {
          panic("必须为正数")     // @note 会终止程序（除非被 recover 接住）
        }
      }

      var xs []int
      // _ = xs[9]                  // @note! 越界 panic: index out of range
    vs:
      javascript: |
        JavaScript 用 `throw` 抛出异常 —— 它打断正常流程、沿调用栈跳转；
        Go 的 `error` 是一个**普通返回值**，函数签名上就写着它可能失败，
        调用方习惯紧接着 `if err != nil`。Go 也有 `panic`，
        但它表示「程序有 bug」，不是处理业务错误的常规手段 ——
        正常失败一律走 `error`。
      python: |
        Python 的 `raise` 是控制流跳转，异常会一路向上抛直到被 except 接住；
        Go 的 `error` 是返回值，每个调用点自己决定怎么处理，
        不存在「不知道哪一层会接住」这回事。Go 的 `panic` 对应 Python 里
        那些不该被捕获的致命错误，但 Go 社区明确要求
        「不要用 panic 做流程控制」。
      java: |
        Java 的受检异常写在 `throws` 里，调用方必须处理 ——
        意图与 Go 的 `(值, error)` 相通，但机制相反：Java 是跳转，
        Go 是返回值。Java 的 `RuntimeException` 免检、随时可能冒出，
        Go 把所有失败都摆在返回值上，没有「看不见的失败」。
        Go 的 `panic` 只在真正的 bug 上使用。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  try-catch:
    code: |
      v, err := divide(6, 0)      // @note 惯例：错误紧跟在结果后面
      if err != nil {
        return err                // @note 这就是 Go 的「catch」—— 没有专门语法
      }
      fmt.Println(v)

      // 想区分错误种类用 errors.Is / errors.As，而不是比字符串
      if errors.Is(err, os.ErrNotExist) {
        fmt.Println("文件不存在")
      }

      var pathErr *os.PathError
      if errors.As(err, &pathErr) {   // @note 取出具体的错误类型
        fmt.Println(pathErr.Path)
      }

      // recover 只能接住 panic，且在 defer 里才有效
      defer func() {
        if r := recover(); r != nil { fmt.Println("接住了", r) }
      }()
    vs:
      javascript: |
        Go **没有 try / catch** —— `if err != nil` 就是它的 catch 块，
        只是写成了普通条件判断。好处是失败处理的位置与调用点一一对应，
        读代码时不用找「这一段里哪句会抛」；代价是 `if err != nil`
        会重复很多遍。判断错误类型用 `errors.Is` / `errors.As`，
        而 JavaScript 用 `instanceof`；Go 也准备了 `recover`，
        但只用于接住 panic，不能当异常机制用。
      python: |
        Go **没有 try / except**，`if err != nil` 承担了 except 的角色。
        这意味着不是「一段代码块可能出错」而是「这一次调用可能失败」——
        粒度更细，读起来更线性。Python 里 `except ValueError`
        对应 Go 的 `errors.As`（取具体类型）、`except KeyError`
        这类比对对应 `errors.Is`。Python 的 `finally` 在 Go 里是 `defer`。
      java: |
        Go **没有 try / catch / finally**。Java 的 catch 块对应 Go 的
        `if err != nil` 分支，Java 的 `finally` 对应 `defer`，
        Java 的 `instanceof` 对应 `errors.As`。
        最大的不同是控制流：Java 的异常会跳出当前逻辑，
        Go 的错误处理是顺序执行的普通代码 —— 没有隐式跳转，
        也没法「忘了 catch」（因为 err 就是个值，不用它就白拿了）。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  finally-cleanup:
    code: |
      f, err := os.Open("data.txt")
      if err != nil { return err }
      defer f.Close()             // @note! defer 注册的调用在函数返回时执行

      func process() {
        mu.Lock()
        defer mu.Unlock()          // @note 加锁后立刻写解锁，中间 return 也不会漏

        wg.Add(1)
        defer wg.Done()            // @note 多个 defer 按后进先出执行
      }

      // defer 的参数在**注册时**求值，不是执行时
      for i := 0; i < 3; i++ {
        defer fmt.Println(i)       // @note! 打出 2 1 0 —— 值已固定，顺序是倒的
      }
    vs:
      javascript: |
        JavaScript 用 `try { … } finally { … }` 保证清理；
        Go 用 `defer` —— 写在资源获取的下一行，函数返回时自动执行。
        差别在**摆放位置**：JavaScript 的清理代码块在末尾，
        Go 的 defer 紧跟着获取语句，读的时候一眼能配对上。
        Go 的 defer 也有坑：参数在注册时就求值，循环里 defer
        用的是当时的值；多个 defer 后进先出。
      python: |
        Python 用 `with` 语句（上下文管理器）或 `try / finally`；
        Go 用 `defer`，写在打开资源之后。`with` 的块边界很清楚，
        `defer` 则绑定到整个函数 —— 所以 Go 里常见把「用资源的那段」
        单独拆成一个函数，让 defer 早点生效，不然大函数里
        资源会一直占着到函数结束。
      java: |
        Java 的 `try-with-resources` 与 Go 的 `defer` 目的相同，
        但 Java 的作用域是那个 try 块，Go 的 defer 作用域是整个函数 ——
        这是从 Java 过来最容易忽略的差别：Go 的 defer 不会提前释放，
        想让资源早点关就得把代码拆进小函数。
        Java 的 finally 与 defer 一样在异常路径下也会执行；
        Go 的 defer 在 panic 展开时同样会跑。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  error-types:
    code: |
      // error 是一个内建接口 —— 只有一个方法
      type error interface {
        Error() string
      }

      // 错误值可以很简单
      var ErrNotFound = errors.New("not found")   // @note 哨兵错误：包级变量

      // 也可以带类型
      type ValidationError struct {
        Field string
        Msg   string
      }
      func (e *ValidationError) Error() string {  // @note! 指针接收者，才能被 errors.As 取到
        return e.Field + ": " + e.Msg
      }

      // 包内导出错误值，调用方用 errors.Is 比对，而不是比字符串
    vs:
      javascript: |
        Go 的 `error` 是一个**只有一个方法的接口**，任何类型实现 `Error() string`
        就是错误 —— 没有基类、没有继承层级。JavaScript 用 `Error` 基类
        加子类，靠 `instanceof` 分派。Go 的判断方式更稳：
        `errors.Is` 比对哨兵值、`errors.As` 取具体类型，
        即使错误被层层包装过也能穿透 —— JavaScript 里包一层就丢了原型，
        `instanceof` 直接失灵。
      python: |
        Python 的异常必须继承 `Exception`，靠 `except 类名` 捕获，
        继承层级就是分类体系；Go 的 `error` 是接口，任何类型都能满足，
        分类靠**类型断言**（`errors.As`）与哨兵值（`errors.Is`）。
        Go 这边更松散也更灵活，代价是没有「所有错误都得是某个共同祖先」的约束，
        不过 `error` 接口本身就充当了那个共同祖先。
      java: |
        Java 的异常有 `Exception` / `Error` 两大分支和一条继承链，
        受检与免检还有语言级区分；Go 的 `error` 只有一个方法，
        没有受检概念、没有层级 —— 分类完全由你自己定义。
        Java 的 `instanceof` 对应 Go 的 `errors.As`，但 Go 的这个函数
        能穿透多层包装（`fmt.Errorf` 带 `%w`），Java 的 `instanceof`
        对包装过的异常同样需要顺着 `getCause()` 一层层找。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  custom-error:
    code: |
      type TimeoutError struct {
        Seconds int
      }

      func (e *TimeoutError) Error() string {   // @note! 实现这一个方法就够
        return fmt.Sprintf("超时 %d 秒", e.Seconds)
      }

      // 带底层原因的包装（%w）—— 这是 Go 的「错误链」
      func load() error {
        if err := read(); err != nil {
          return fmt.Errorf("加载配置失败: %w", err)   // @note %w 保留原错误，errors.Is 能穿透
        }
        return nil
      }

      // 自定义判断逻辑
      func (e *TimeoutError) Is(target error) bool {
        t, ok := target.(*TimeoutError)
        return ok && t.Seconds == e.Seconds
      }
    vs:
      javascript: |
        JavaScript 自定义错误要 `class MyError extends Error`，
        还得处理原型链与 `name`；Go 只要实现 `Error() string` 一个方法，
        连继承都不用。错误链的写法也不同：JavaScript 用 `cause` 选项，
        Go 用 `fmt.Errorf("…: %w", err)`，而且 `errors.Is` / `errors.As`
        能穿透任意多层 —— 这一套是 Go 独有的、相当好用的机制。
      python: |
        Python 的 `class MyError(Exception)` 极简，Go 要写一个方法
        （也只是一行 `Error() string`），两边都很轻。
        差别在包装与穿透：Python 用 `raise … from e` 记 cause，
        要判断得沿着 `__cause__` 自己走；Go 的 `%w` 加 `errors.Is`
        是标准且自动穿透的，判断「是不是这个错误」不必关心被包了几层。
      java: |
        Java 继承 `Exception` 就自带 message 与 cause，构造器还能直接串联；
        Go 实现一个方法即可，但没有 message/cause 字段 ——
        「底层原因」靠 `%w` 包装，判断靠 `errors.Is` / `errors.As`。
        Java 的 `getCause()` 要自己一层层剥，Go 的这两个函数自动穿透，
        表达「这个错误是不是（或包含）某个错误」更直接。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  error-propagation:
    code: |
      func load() error {
        data, err := os.ReadFile("c.json")
        if err != nil {
          return fmt.Errorf("读取配置: %w", err)   // @note 加一层上下文再往上抛
        }
        if err := parse(data); err != nil {
          return fmt.Errorf("解析配置: %w", err)
        }
        return nil
      }

      // 调用方用 errors.Is / errors.As 穿透所有包装
      if errors.Is(err, os.ErrNotExist) { }

      // 也可定义可判定的哨兵错误
      var ErrInvalid = errors.New("invalid")
    vs:
      javascript: |
        JavaScript 的异常自动上抛，中间层什么都不用写；
        Go 每一层都要 `if err != nil { return ... }`，多写很多行。
        换来的好处是**每一层都在错误上加了自己的上下文**
        （`"读取配置: %w"`），出问题时的错误信息就是一条完整路径；
        JavaScript 里想做到这点得每层 catch 再 throw，
        而实践中很少有人这么写。判断上 Go 用 `errors.Is` 穿透包装，
        JavaScript 用 `instanceof`，包装过就失效。
      python: |
        Python 里不处理的异常自动上抛，栈信息自动累积；
        Go 必须显式 `return err`，每层都要表态。
        好处是错误信息可以逐层加语境（`%w`），而且仍然能用
        `errors.Is` 判断原始错误 —— Python 的 `raise … from e`
        也能记链，但判断「是不是这个错误」要看链上有没有它，
        没有 `errors.Is` 这样方便的标准工具。
      java: |
        Java 的受检异常必须声明或处理 —— 这份「编译器盯着你表态」
        与 Go 的 `if err != nil` 目标一致，但 Java 是跳转、
        Go 是返回值。Java 用 `throw new XxxException("…", e)`
        逐层包装并保留 cause，Go 用 `fmt.Errorf("…: %w", err)` ——
        两边都能串出完整路径。判断上 Java 要自己走 `getCause()`，
        Go 的 `errors.Is` 直接穿透。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
