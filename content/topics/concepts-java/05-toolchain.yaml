id: concepts-java/05-toolchain
topicId: concepts-java
title: 工具链与生态
order: 5
summary: 装包、跑起来、测、查、格式化 —— 迁移后每天都要用的那一套
features:
  - id: concepts-java/package-manager
    title: 包管理
    kind: concept
    summary: 构建工具兼管依赖，坐标三段式，拉的是编译好的 JAR

  - id: concepts-java/dependency-isolation
    title: 依赖隔离
    kind: concept
    summary: classpath 扁平，一个类名只能有一个版本胜出

  - id: concepts-java/runner
    title: 运行时
    kind: concept
    summary: 编译成字节码由 JVM 跑，JIT 预热之后越来越快

  - id: concepts-java/build-tool
    title: 构建工具
    kind: concept
    summary: 构建就是编译，不编译跑不了；工具同时规定项目骨架

  - id: concepts-java/test-framework
    title: 测试框架
    kind: concept
    summary: '@Test 注解加静态断言，参数顺序是「期望在前」'

  - id: concepts-java/testing-mock
    title: 测试替身
    kind: concept
    summary: 依赖靠构造注入，可替换是设计出来的，不改模块

  - id: concepts-java/lint-format
    title: 代码检查与格式化
    kind: concept
    summary: 检查与格式化常是各自独立的工具，没有事实上的中心

  - id: concepts-java/repl
    title: 交互式环境
    kind: concept
    summary: jshell 是官方 REPL，但生态里用得少
