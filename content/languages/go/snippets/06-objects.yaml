- featureId: basics/object-create
  equivalence: divergent
  code: |
    type User struct {
        Name string
        Age  int
    }
    u := User{Name: "Ada", Age: 36}      // @note 结构体：字段固定、类型固定
    p := &User{Name: "Bob"}              // 指针形式

    m := map[string]int{"a": 1}           // @note map：字典，键值类型都要写
    m2 := make(map[string]int)

    // @note Go 的 struct（有形状）与 map（无形状）是两种东西，
    //        与 JS 一个对象字面量走天下的习惯不同
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-access
  equivalence: divergent
  code: |
    u := User{Name: "Ada"}
    u.Name                    // @note 直接访问字段

    m := map[string]int{"a": 1}
    m["missing"]              // @note! 0 —— 缺失键返回**零值**，不报错也不 panic

    v, ok := m["missing"]     // @note! comma-ok：判断键存不存在只有这一种写法
    _, _ = v, ok              // v == 0，ok == false

    // @note! 「零值 vs 存在」的歧义是 Go map 最经典的坑：
    //        取到的 0 可能是「存了 0」，也可能是「键不存在」，必须用 comma-ok 区分
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-iterate
  equivalence: analogous
  code: |
    m := map[string]int{"a": 1, "b": 2}

    for k, v := range m { }
    for k := range m { }

    // @note! Go 的 map 迭代顺序是**随机化**的（故意的，防止程序依赖顺序）
    //        需要稳定顺序要先取出 key 再排序
    keys := make([]string, 0, len(m))
    for k := range m {
        keys = append(keys, k)
    }
    slices.Sort(keys)
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-default
  equivalence: divergent
  code: |
    m := map[string]int{}

    if v, ok := m["a"]; ok {          // @note! Go 没有 getOrDefault，惯用法就是 comma-ok
        _ = v
    }

    // 想「取不到就写入」只能显式两步
    if _, ok := m["a"]; !ok {
        m["a"] = 0
    }

    // @note 没有 computeIfAbsent / entry().or_insert() 那种合并 API —— 全靠手写
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-merge
  equivalence: divergent
  code: |
    a := map[string]int{"x": 1}
    b := map[string]int{"y": 2}

    for k, v := range b {         // @note! Go 没有 map 合并语法，必须循环
        a[k] = v
    }

    maps.Copy(a, b)               // @note Go 1.21+ 的 maps 包提供覆盖式合并

    // @note! 与 JS 的 {...a, ...b} 相比，这里确实啰嗦不少
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-nested
  equivalence: divergent
  code: |
    type Address struct{ City string }
    type User struct {
        Name    string
        Address Address            // @note 值字段：嵌入的是副本
    }

    u := User{Name: "Ada", Address: Address{City: "成都"}}
    u2 := u
    u2.Address.City = "北京"
    // u.Address.City 仍是 "成都"

    // @note! 这是与 JS 最大的差别：Go 的 struct 赋值是**值拷贝**。
    //        要共享必须用指针（*User）—— JS 那种「赋值后两个名字指同一对象」在这里不会发生
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-comprehension
  equivalence: divergent
  code: |
    names := []string{"a", "bb"}

    // @note Go 没有推导式，批量构造就是 for 循环
    m := make(map[string]int, len(names))
    for _, n := range names {
        m[n] = len(n)
    }

    // @note Go 1.21+ 有 slices / maps 的泛型工具，但没有语法级的推导式
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-equality
  equivalence: divergent
  code: |
    type Point struct{ X, Y int }

    Point{1, 2} == Point{1, 2}      // true —— @note struct 可逐字段比较

    m1 := map[string]int{"a": 1}
    m2 := map[string]int{"a": 1}
    // m1 == m2                     // @note! 编译错误：map 不可比较

    maps.Equal(m1, m2)              // true —— @note 比内容要用 maps.Equal

    // @note! 与 JS 相反：JS 的对象永远引用比较；
    //        Go 的 struct 是**值比较**，而 map / slice 干脆不可比（只能和 nil 比）
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/object-json
  equivalence: divergent
  code: |
    type User struct {
        Name string `json:"name"`      // @note 结构体标签控制 JSON 字段名
        Age  int    `json:"age"`
    }
    u := User{Name: "Ada", Age: 36}

    b, err := json.Marshal(u)          // @note! 失败放在 err 里，不 panic
    json.Unmarshal(b, &u)              // 注意要传指针

    // @note! Go 的 JSON 在**标准库**里（不像 Java / Rust 要引依赖）
    // @note! 代价：只有**导出字段**（首字母大写）会被序列化 ——
    //        小写字段静默丢失，是「JSON 输出成空对象」的最常见原因
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'
