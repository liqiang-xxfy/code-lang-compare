  - featureId: js2go/concurrency-exercise
    equivalence: identical
    code: |
      const cache = new Map();

      async function compute(k) { return k * 2; }

      async function get(k) {
        if (!cache.has(k)) {                       // @note "检查后写入"这个复合动作
          cache.set(k, await compute(k));          // @note 有 await，这里真的会被切走
        }
        return cache.get(k);
      }

      await Promise.all([get(1), get(1)]);
      // @note! 最坏是 compute(1) 被算两次 —— cache 不会损坏（单线程，没有并发写）
      // @note! Go 里是真的并发写同一个 map，会直接 panic（concurrent map writes）——
      // 而且这个 panic 是运行时才出现的，编译器不会提醒
