# javascript —— mechanism / types
#
# boxes 的 key 必须是 catalog/mechanism/features.yaml 里 `group: types` 的那批：
# static-vs-dynamic / type-annotation / structural-nominal / type-narrowing /
# null-safety / type-assertion。

review:
  state: draft

boxes:
  static-vs-dynamic:
    code: |
      let n = 1;
      n = "字符串";         // @note! 完全合法 —— 变量没有类型
      n.toFixed(2);        // @note! 运行时才炸：n.toFixed is not a function

      typeof n;            // @note 类型只能在运行时问
      Array.isArray(n);    // @note 数组要单独判 —— typeof [] 是 "object"

      // @note 想静态检查得用 TypeScript：它编译期报错，运行时不留下任何东西
    baseline: |
      **动态类型**：类型属于值、不属于变量，所以 `let n = 1` 之后赋字符串完全合法。
      类型错误在运行到那一行时才暴露，而且通常报的是「没有这个方法」而不是
      「类型不对」—— 从错误信息回推是哪一步错了要费点劲。想提前发现只能上
      TypeScript，那是一层编译期的检查，运行时不留下痕迹。
    vs:
      python: |
        Python 同样是动态类型，但失败方式不同：调不存在的方法抛 AttributeError，
        `1 + "a"` 抛 TypeError，报错通常比 JavaScript 更直接地指出类型问题。
        两边的类型标注也都是可选的，检查靠外部工具。
      java: |
        Java 是静态类型：类型写在声明上、编译器全程检查，`n = "字符串"` 直接
        编译错误。换来的是「这类错误不可能活到运行时」，代价是写起来更啰嗦、
        且表达能力受类型系统约束。
    equivalence:
      python: analogous
      java: divergent

  type-annotation:
    code: |
      // @note! 语言层面没有类型标注 —— 一行都写不出来
      function f(n) { return n * 2; }

      // 想标注只有两条路：
      //  1. TypeScript（语法扩展，编译期检查）
      //     function f(n: number): number { return n * 2 }
      //  2. JSDoc 注释（给编辑器与检查器看，不影响运行）
      /**
       * @param {number} n
       * @returns {number}
       */
      function g(n) { return n * 2; }
    baseline: |
      **语言里没有类型标注这回事** —— 想标注只能换 TypeScript（超集，编译期检查）
      或者写 JSDoc 注释（编辑器与检查器能读，运行时完全忽略）。所以
      「这个函数收什么」在纯 JS 代码里只有文档能回答，运行时不校验任何东西。
    vs:
      python: |
        Python 把标注做进了语法（`def f(n: int) -> int`），而且运行时会存进
        `__annotations__` —— 虽然不检查，但框架能读出来做校验或生成文档。
        JavaScript 连这个都没有，标注要么靠 TS 要么靠注释。
      java: |
        Java 的标注就是类型声明本身，编译器强制、不可省略，而且是方法签名的一部分。
        这里的「标注」是可选的附加信息，运行时不看、Java 那边是硬约束。
    equivalence:
      python: divergent
      java: divergent

  structural-nominal:
    code: |
      // @note! 运行时完全是鸭子类型 —— 只看有没有那个方法
      function area(shape) { return shape.area(); }
      area({ area: () => 1 });        // @note 合法，形状对就行
      area(new Circle());             // @note 也合法

      // TS 把这层判断搬到了编译期：**结构化类型**
      //   interface Shape { area(): number }
      //   任何有 area(): number 的东西都算 Shape，不需要 implements
    baseline: |
      运行期是**鸭子类型**：一个值能不能用，只看它有没有那个方法 / 属性。
      TypeScript 把这层判断提升到编译期，而且保持**结构化** ——
      「形状对」就算相容，不需要显式声明实现某个接口。
      所以 JS 生态里没有「实现某某接口」这种写法。
    vs:
      python: |
        同样是鸭子类型，Python 的 `Protocol` 把「形状约定」写成了可检查的类型，
        与 TypeScript 的结构化类型思路一致。两边的运行期都只看实际有没有那个方法。
      java: |
        Java 是**名义类型**：能不能传进某个参数，看有没有声明实现那个接口，
        与它实际有没有那个方法无关。「形状对但没声明」编译不过，
        这是鸭子类型在这里完全行不通的原因。
    equivalence:
      python: analogous
      java: divergent

  type-narrowing:
    code: |
      function f(x) {
        if (typeof x === "string") {
          x.toUpperCase();           // @note 运行期这里一定是字符串
        }
        if (Array.isArray(x)) { }
        if (x instanceof Date) { }
        if ("kind" in x) { }         // @note 按属性存在性判断
      }

      // TS 在这些检查之后会**自动收窄**类型，不用额外写断言：
      //   function f(x: string | number) {
      //     if (typeof x === "string") x.toUpperCase();  // 这里 x 被收窄成 string
      //   }
    baseline: |
      运行期靠检查来保证：`typeof` / `instanceof` / `Array.isArray` /
      `"key" in obj`。语言不会因此改变什么，是你自己确认了形状。
      TypeScript 则会把这些检查**当作类型收窄的依据** —— 判断过之后类型自动变窄，
      不需要再写断言，这是它最好用的地方之一。
    vs:
      python: |
        Python 用 `isinstance` / `hasattr` 做同样的检查，类型检查器也会据此收窄。
        差别是 Python 的 `isinstance` 能接元组一次判多种
        （`isinstance(x, (int, float))`），这里要写两次 `typeof` 或 `||`。
      java: |
        Java 的收窄由**编译器**做，而且用模式匹配写在语法里：
        `if (obj instanceof Point p) { p.x(); }` 直接绑定新变量。
        这里（含 TypeScript）的收窄是分析出来的，Java 的是显式声明的。
    equivalence:
      python: analogous
      java: divergent

  null-safety:
    code: |
      let a;                       // @note undefined
      let b = null;                // @note null —— 两种空
      a.length;                    // @note! TypeError

      obj?.prop?.deep;             // @note 可选链：中途为空就整体给 undefined
      value ?? "默认";              // @note 空值合并：只认 null / undefined

      // @note! 语言不区分「一定非空」与「可能为空」
      //   TS 的 strictNullChecks 才把这层写进类型：string 与 string | null 是两回事
    baseline: |
      有两种空值（`undefined` / `null`），而且**类型系统不区分「可能为空」**——
      语言层面每个引用都可能为空，编译器不提醒。`?.` 与 `??` 是缓解手段，
      不是保证。想真正把「可能为空」写进类型，只能靠 TypeScript 的
      `strictNullChecks`。
    vs:
      python: |
        Python 只有一种空值，而且同样不在类型系统里；`Optional[X]` 标注是
        给检查器看的（运行时不检查）。两边的空值都要靠约定与工具兜住。
      java: |
        Java 的 `null` 可以塞进任何引用类型、编译器不提醒 —— 与这里一样是
        「谁都可能为空」。Java 有 `Optional` 把「可能没有」写进返回类型，
        但那是标准库的约定，不是类型系统强制的。
    equivalence:
      python: analogous
      java: analogous

  type-assertion:
    code: |
      // @note! 语言层面没有类型断言 —— 没有东西可以「断言」
      //   运行时只能检查，不能声称：
      if (!(x instanceof Date)) throw new TypeError("需要 Date");

      // TS 里有断言语法，但它**不做任何运行时检查**：
      //   const d = x as Date;      // 只是让编译器闭嘴
      //   x!                        // 非空断言，同样不检查
    baseline: |
      运行期**没有类型断言这回事** —— 没有类型可以断言。要保证类型只能当场检查
      （`instanceof` / `typeof`）并在不符合时抛错。TypeScript 的 `as` 是纯编译期的
      声明「我知道它是什么」，运行时一行代码都不生成，所以断错了不会报，
      只会在后面某处炸掉。
    vs:
      python: |
        Python 的 `typing.cast` 与这里 TypeScript 的 `as` 一样是**空操作**，
        只影响检查器。真正能在运行时确认的是 `isinstance` 或 `assert isinstance(...)`。
        两边都是「声称」与「检查」分开的。
      java: |
        Java 的强制转换 `(Date) x` 会**在运行时真的检查**，不匹配抛
        ClassCastException。这是与这里最关键的区别：Java 的转换是动作，
        TypeScript 的断言只是承诺。
    equivalence:
      python: analogous
      java: divergent
