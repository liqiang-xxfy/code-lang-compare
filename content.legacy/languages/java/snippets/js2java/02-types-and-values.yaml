  - featureId: js2java/numeric-types
    equivalence: divergent
    code: |
      7 / 2;                   // @note! 3 —— 整数除法，JS 里是 3.5
      (double) 7 / 2;          // 3.5 —— 要小数必须先转 double
      -7 / 2;                  // @note -3 —— 向零截断
      -7 % 3;                  // -1 —— 这条与 JS 一致

      Integer.MAX_VALUE + 1;   // @note! -2147483648 —— 溢出静默回绕，JS 里是丢精度
      9007199254740993L;       // @note 装得下 —— long 是 64 位
      new java.math.BigInteger("9007199254740993");    // 再大要换类型，运算符随之失效

      char c = 'a';            // @note! 有独立的 char 类型，不是长度为 1 的字符串
      c + 1;                   // 98 —— 它本质是数值
      // "a" * 3;              // @note! 编译错误：JS 里这个得 NaN，这边根本写不出来
