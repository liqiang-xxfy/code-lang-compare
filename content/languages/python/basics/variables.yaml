# python —— basics / variables（v2 结构）
#
# 试点阶段只写「作对比列、基准为 JavaScript」时的 vs 说明；
# 基准取 Java 的那一份留待内容爬坡补齐。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: pilot-basics-variables
    generatedAt: '2026-10-03'

boxes:
  declaration:
    code: |
      count = 0            # @note 赋值即声明，没有关键字
    vs:
      javascript: |
        JavaScript 要用 `let` / `const` / `var` 显式声明，选关键字还顺带决定了作用域
        与能否改绑；Python 的赋值语句**本身就是声明**，没有单独的声明关键字。
    equivalence:
      javascript: analogous

  mutability:
    code: |
      n = 1
      n = 2                # @note 名字只是绑定，随时可以指向别的值
      MAX = 100            # @note! 全大写只是约定，解释器不会阻止你重新赋值
    vs:
      javascript: |
        JavaScript 用 `const` 表达「不可改绑」；Python 没有常量语法，
        `MAX = 100` 只是「大家都别改」的约定，解释器照改不误。
    equivalence:
      javascript: divergent

  scope:
    code: |
      for i in range(3):
          pass
      print(i)             # @note! 打出 2 —— 循环变量漏到了函数作用域
    vs:
      javascript: |
        JavaScript 的 `let` / `const` 以 `{}` 为边界；Python **只有函数会产生新作用域**，
        `if` / `for` / `while` 的块体不产生 —— 循环变量会留在外面。
    equivalence:
      javascript: divergent

  hoisting:
    absent: true
    vs:
      javascript: |
        Python 没有变量提升这一概念。相关但不同的坑在别处：函数里只要出现过
        `x = ...`，`x` 在整个函数内就是局部名，在赋值前读它会抛 UnboundLocalError。

  shadowing:
    code: |
      x = 1
      def f():
          x = 2            # @note 这是函数内的新局部名，不动外层
          return x
      print(f(), x)        # @note 2 1
    vs:
      javascript: |
        与 JavaScript 一样是「内层新建绑定、遮蔽外层」；区别在边界 ——
        Python 的边界是函数，JavaScript 的边界是块。
    equivalence:
      javascript: analogous
