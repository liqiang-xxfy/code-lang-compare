# Java 视角下的「工程实践」章节分组 —— 与 javascript.yaml / python.yaml 又一套。
#
# 两处按 Java 心智模型做的调整：
#   1. **依赖与构建合成一章** —— Maven / Gradle 同时管这两件事（`pom.xml` 里
#      既写依赖坐标又写编译插件），拆成两章反而割裂。
#   2. `bundler` 被**取舍掉** —— Java 没有打包器这一层：编译产物就是 jar，
#      归在「构建」里；没有「源码 → 转译 → 打包」这条链路。
#      `linter-formatter` / `type-checker` / `repl` 收进「JDK 工具链」，
#      因为类型检查就是编译器本身，不是独立工具。

section: practice
baseline: java

chapters:
  - id: build
    title: 构建工具与依赖
    summary: Maven / Gradle、坐标与仓库
    features: [package-manager, dependency-declaration, version-constraint, lockfile, environment-isolation, publishing, compile-run]

  - id: toolchain
    title: JDK 与工具链
    summary: javac、格式化检查、jshell 与版本管理
    features: [linter-formatter, type-checker, runtime-version, repl]

  - id: testing
    title: 测试
    summary: JUnit、断言与构建集成
    features: [test-framework, assertions, mocking, parameterized-tests, coverage]
