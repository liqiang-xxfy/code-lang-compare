# arkts —— express / operators
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: operators` 的那批：
# arithmetic / equality / logical / operator-overloading。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：ArkTS 与语法相近的那门静态方言共享大量写法，运算符这一组
# 两边基本同形 —— 本文件只写**能核实**的差别，写不出实质差异的格子
# 如实标 `analogous` 加一句短说明，不为了填满而灌水。已核实的项：
# `?.` 与 `??` 完全支持。

review:
  state: draft

boxes:
  arithmetic:
    code: |
      let q: number = 7 / 2;        // @note 3.5 —— 只有一种除法，永远得浮点
      // @note 想要 3 得自己截断，例如 Math.trunc(7 / 2)

      let r: number = -7 % 3;       // @note! -1 —— 余数符号跟着被除数走
      let k: number = 1 + 2 * 3;    // @note 7 —— 优先级与数学一致，先乘后加

      let i: number = 0;
      i++;                          // @note 自增自减是表达式，有前置 / 后置之别
    vs:
      javascript: |
        算术运算符与 JavaScript 是同一套 —— 只有一种除法、结果恒为浮点、
        余数符号跟着被除数，这些都是引擎层面的行为，换了语言也不变。
        多出来的是静态类型这一层：参与运算的名字必须有确定且一致的类型，
        ArkTS 不做隐式类型变换，所以运算之前「这个值现在是数字还是字符串」
        已经在编译期定好了。
      python: |
        Python 用 `//` 做整除、`/` 做真除法，两个运算符分得很清楚；
        这里只有 `/` 一个，结果永远是浮点，要整数得自己截断。
        余数也不同：Python 的 `%` 符号跟着**除数**（`-7 % 3` 得 2），
        这里跟着被除数（得 -1）。还有精度：Python 的整数任意精度，
        这里全是双精度浮点，大整数与小数运算会悄悄丢精度。
      java: |
        两边都有 `+ - * / %` 与 `++` / `--`，写法几乎可以照搬，是最接近的一对。
        差别在数字的模型：Java 的 `7 / 2` 得 3 是因为两边都是 int，混入 double 才变浮点；
        这里只有一个双精度浮点类型，`7 / 2` 恒得 3.5，想要 3 得自己截断。
        溢出也分道：Java 的 int 静默回绕，这里的数值到不了那个边界，代价是大整数丢精度。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  equality:
    code: |
      let same: boolean = 1 === 1;       // @note true —— 值相等且类型一致才算相等

      let nan: number = NaN;
      let nanEq: boolean = nan === nan;  // @note! false —— NaN 与任何值都不相等
      // @note 判断 NaN 要用 Number.isNaN()，=== 永远是 false

      let a: number[] = [1, 2];
      let b: number[] = [1, 2];
      let ref: boolean = a === b;        // @note! false —— 内容相同也比较引用

      // 想按内容比较只能自己逐项来，语言没有内置的值比较
    vs:
      javascript: |
        严格相等 `===` 的语义与 JavaScript 逐条相同 —— 类型不同即不等、
        NaN 不等于自己、对象与数组比引用，这些都是同一套引擎行为。
        需要注意的是那套会做隐式转换的松散相等 `==`：JavaScript 里 `1 == "1"` 为真，
        ArkTS 不做隐式类型变换，判等一律走 `===` 才稳妥。
      python: |
        Python 的 `==` 比**值**、`is` 比身份；ArkTS 的 `===` 更接近 Python 的 `is` ——
        对数组与对象，它比的都是引用，两个内容相同的列表并不相等。
        所以从 Python 过来最容易踩的一处是「内容一样却不相等」，
        想按内容比得自己逐项来。浮点上两边倒是一致：NaN 不等于自己。
      java: |
        Java 的 `==` 对基本类型比数值、对引用比地址，值相等要靠 `equals`；
        ArkTS 只有一个 `===`，比什么由值本身决定 —— 基本值比数值、对象比引用。
        两边的共同点是都没有「自动按内容比较」：Java 要记得调 `equals`，
        ArkTS 根本没有这个方法，只能自己写逐项比较的逻辑。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  logical:
    code: |
      let name: string = "";
      name = name || "默认";         // @note "默认" —— || 返回操作数本身，常用它兜底

      function withDefault(x: number | null): number {
        return x ?? 5;               // @note 0 —— ?? 只在 null / undefined 时取右边
      }

      interface User { address: string | null }

      function cityOf(user: User | null): string {
        return user?.address ?? "未知";
        // @note 可选链碰到空就整条短路成 undefined，再由 ?? 兜底
      }
    vs:
      javascript: |
        可选链与空值合并 ArkTS 完全支持，语义与 JavaScript 一致 —— `?.` 碰到空就短路，
        `??` 只认 `null` / `undefined`，所以 `0 ?? 5` 得 0、`0 || 5` 得 5；
        `&&` / `||` 返回操作数本身这条也一样。真正多出来的是静态类型这一层：
        参与运算的名字类型必须确定，`??` 左边的可空性也要在类型里写清楚。
      python: |
        Python 的 `and` / `or` 与这里一样返回操作数本身，也常拿来给缺省值。
        差别是没有空值合并与可选链：Python 的 `or` 会把 `0` / `""` 当成假，
        想只对 None 生效得写 `x if x is not None else 默认`；这里的 `??`
        只认 null / undefined，`0 ?? 5` 得 0。可选链 `?.` 在 Python 里
        没有对应写法，只能一层层判空。
      java: |
        Java 的 `&&` / `||` 严格返回 boolean，不能像这里那样用 `a || b` 直接取值 ——
        想给默认值得写三目或 `Optional.orElse`。这里的两套取值语法是常态：
        `||` 返回操作数本身，`??` 只认空值。另一处是 Java 没有空值合并与可选链，
        判空要靠 `!= null` 一层层写；这里把它们各做成一个运算符。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  operator-overloading:
    absent: true
    vs:
      javascript: |
        ArkTS 与 JavaScript 一样**不支持运算符重载**，`+` 只认数值与字符串，
        对象相加不会得到新对象。需要相加语义时两边都得写成命名方法（`a.add(b)`）。
        差别在越界之后：JavaScript 会让 `+` 退化成字符串拼接或 NaN，悄悄给你一个错结果；
        ArkTS 的静态检查会直接拦下，这道限制在它这边是编译期就看得见的。
      python: |
        Python 的运算符重载是一等公民 —— 定义 `__add__` 之后 `a + b` 直接可用；
        ArkTS 完全没有这条路，自定义类型要做加法只能定义 `add` 方法。
        从 Python 过来最容易低估的就是这一条：矩阵、向量、金额这类类型
        在 Python 里写 `a + b` 很自然，在 ArkTS 里一律是 `a.add(b)`，
        好处是任何一个 `+` 的行为都不必去查定义。
      java: |
        Java 与 ArkTS 立场相同：都不支持运算符重载，自定义类型要做加法只能写命名方法。
        两边都为字符串保留了 `+` 的拼接语义，但都到此为止 ——
        没有 `__add__` 那样的钩子，也没有办法为自定义类型定义新的运算符含义。
    equivalence:
      javascript: identical
      python: divergent
      java: identical
