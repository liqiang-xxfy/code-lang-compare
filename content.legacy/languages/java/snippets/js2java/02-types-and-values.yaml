  - featureId: js2java/nullability
    equivalence: divergent
    code: |
      String s = null;         // @note 两种空合成一种，判空只剩 == null 一种写法

      int n;                   // @note! 基本类型不能为 null：字段默认 0，局部必须赋值
      // int m = null;         // 编译错误 —— JS 里没有这层限制

      s.length();              // @note! NullPointerException，编译期完全不拦

      Integer boxed = null;
      int unboxed = boxed;     // @note! 拆箱那一刻才炸 —— JS 里没有这个中间态

      // @note! 条件位置只接受 boolean，所以"判空"与"判真"不会混：
      // if (!n) 在这里是编译错误，必须写 n == 0
  - featureId: js2java/types-exercise
    equivalence: analogous
    code: |
      static double summarize(java.util.List<Order> orders) {
          if (orders.isEmpty()) return 0;
          long total = 0;                              // @note! 先想位宽：int 可能不够
          for (Order o : orders) total += (long) o.price() * o.qty();

          double avg = (double) total / orders.size(); // @note! 不转 double 就是整数除法
          return Double.parseDouble(String.format("%.2f", avg));
      }

      record Order(double price, int qty) { }

      // @note! 两处静默错误都在这一行里：
      // 除以 size() 忘了转 double（得整数），以及 total 用 int 会回绕
      // @note JS 那边怕的是精度，这边怕的是溢出 —— 同一段代码、两种担心
