# cpp —— mechanism / concurrency
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: concurrency` 的那批：
# concurrency-unit / shared-state / lock-mutex / channel / atomicity。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的题眼是**「线程是标准库给的，数据竞争是未定义行为」**。
# 实跑确认：四个线程各加十万次，普通变量给出 **242410**（应该是 400000），
# 换成 `std::atomic` 才是 400000 —— 而且这不是「丢了几次」，是 UB，
# 理论上编译器可以优化掉任何它认为不会发生竞争的代码。
# 另一处要写准：**标准库没有通道**（`std::atomic` 的等待/通知要到 C++20），
# 想消息传递得自己搭或用第三方库。

review:
  state: draft

boxes:
  concurrency-unit:
    code: |
      // @note C++ **没有内建的线程语法** —— `std::thread` 是标准库的类
      #include <thread>

      std::thread t([]{ /* 在另一根线程上跑 */ });
      t.join();                    // @note 等它结束（不 join 也不 detach 会 terminate）
      // t.detach();               // @note 放它自己跑（之后就管不着了）

      std::thread::hardware_concurrency();   // @note 实跑：24 —— 只是提示，不是保证

      // @note C++20 起有 std::jthread：析构自动 join，还带取消信号
      std::jthread jt([]{ /* ... */ });

      // @note! 语言层面**没有**「协程 = 并发」这回事：
      // @note C++20 的协程是**无栈**的，而且标准库**不给调度器** ——
      // @note 语言只给挂起原语（co_await），什么时候恢复要自己安排
      // @note 唯一的例外是 C++23 的 `std::generator`，那是**同步**生成器
      // @note 真正能当异步任务用的任务类型要到 C++26（sender 那一套）

      // @note 线程是**真的并行**（多核同时跑），不是并发调度 ——
      // @note 代价是共享内存带来的全部问题（见后两格）
    vs:
      javascript: |
        两边都不是「语言给了线程」，但差别很大：JavaScript 有 Worker
        （本质是独立的执行环境 + 消息传递），主线程上永远只有一个执行流；
        C++ 的 `std::thread` 是**真的多线程共享内存**，
        所有线程看得到同一个地址空间 —— 这才引出了数据竞争、
        锁、内存序这一整套问题。也就是说那边「不用锁」是因为
        根本没有共享内存，这边「必须想锁」是因为共享是默认。
        另一处是 C++ 的协程与并发是**两件事**（协程是挂起机制，
        并发要靠线程或自己搭调度），JavaScript 的 `async` 直接就是调度好的。
      python: |
        两边都有真线程（Python 的 `threading` ↔ C++ 的 `std::thread`），
        而且共享内存、要加锁 —— 这一层对应得上。
        关键差别在**能不能真并行**：Python 有全局解释器锁，
        纯计算的线程其实串着跑（要并行得用多进程）；
        C++ 的线程是**真并行**，多核同时跑，所以竞争问题也更实在。
        另一处是 C++ 的协程没有调度器（语言只给挂起原语），
        Python 的 `asyncio` 是完整的事件循环 —— 两边「协程」这个词
        指的东西成熟度差得很远。
      java: |
        两边**最接近**：都有真线程、都是共享内存、都要自己加锁、
        都有线程池的概念（Java 的 `ExecutorService` ↔ C++ 的
        `std::async` / 第三方库）。差别在两处：
        ① C++ 的线程对象析构时如果还没 join 会**直接 terminate**
        （Java 的 Thread 没这个问题），所以 C++ 里要记得 join 或 detach；
        ② Java 有虚拟线程把「大量并发」变得便宜，C++ 只能靠
        线程池或协程自己搭 —— 而且 C++ 的协程没有调度器。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  shared-state:
    code: |
      // @note! 两个线程碰同一块内存、又没有同步，就是**数据竞争** ——
      // @note! 而数据竞争在 C++ 里是**未定义行为**（不是「结果不确定」那么轻）

      long long counter = 0;                 // 普通变量
      std::atomic<long long> acounter{0};    // 原子变量

      // 四个线程各加十万次
      // @note 实跑结果：
      // @note   普通变量 → 242410（应该是 400000，丢了很多）
      // @note   原子变量 → 400000
      // @note! 而且「丢了多少次」完全不可预测，换台机器换次编译都可能不同

      // @note 为什么是 UB 而不是「不确定」：编译器可以假设数据竞争不发生，
      // @note 于是可以把你写的检查优化掉、把循环合并、把变量缓存进寄存器 ——
      // @note 所以「加个 if 判断一下」这种补救在优化过的代码里可能直接消失

      // 想安全共享有两条路：
      //   ① 用原子操作（std::atomic）
      //   ② 用锁保护起来（见下一格）
      // @note 还有第三条：**别共享** —— 每个线程一份数据，最后合并
    vs:
      javascript: |
        两边的处境完全不同：JavaScript 的 Worker **不共享内存**，
        每个 Worker 有自己的堆，通信靠消息（结构化克隆或转移所有权）——
        所以「数据竞争」这个问题在那边**根本不存在**，也不需要原子变量。
        C++ 的线程共享同一个地址空间，两个线程同时写一个变量
        就是 UB（实跑：普通变量少加了 40%，原子变量才对）。
        也就是说那边「不用锁」不是因为做得好，是因为问题被设计掉了。
      python: |
        两边都有共享内存与数据竞争这个隐患，但**后果的严重程度不同**：
        Python 有全局解释器锁，单个字节码指令是原子的，
        `counter += 1` 会丢更新但不会读到垃圾；C++ 里同时读写
        是**未定义行为** —— 可能丢更新，也可能读到撕裂的值、
        或者因为优化而完全不是你写的那个意思。
        另一处是 C++ 给了 `std::atomic` 与内存序这一整套显式工具
        （默认是最严的顺序一致），Python 里没有语言级的原子类型。
      java: |
        两边**几乎一模一样**：共享内存、数据竞争、
        `AtomicLong` ↔ `std::atomic`、内存可见性问题 ——
        这一格可以逐条对应，连「不加同步会丢更新」的现象都一样。
        差别在**语言怎么定义它**：Java 的内存模型规定得比较细
        （volatile 的可见性语义、final 字段的初始化安全），
        说「不加同步结果不可预测」；C++ 直接把数据竞争判成
        **未定义行为**，编译器可以据此做任意优化 ——
        所以 C++ 这边「看起来能跑」更不能当作正确。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  lock-mutex:
    code: |
      #include <mutex>

      std::mutex m;
      int shared = 0;

      // @note 手动版本：容易忘记解锁、或者异常路径上漏掉
      m.lock();
      shared += 1;
      m.unlock();

      // @note 标准写法：RAII 包一层，出作用域自动解锁（异常也照解）
      {
        std::lock_guard<std::mutex> g(m);      // @note 构造即加锁、析构即解锁
        shared += 1;
      }

      // @note 需要中途解锁/再加锁时用 unique_lock（更灵活、略重）
      std::unique_lock<std::mutex> ul(m);
      ul.unlock();
      ul.lock();

      // @note 条件变量也是这个套路：wait 必须配 unique_lock
      std::condition_variable cv;
      cv.wait(ul, []{ return ready; });

      // @note 同时锁多个别一个个锁（会死锁）—— 用 std::scoped_lock
      std::scoped_lock lk(m1, m2);             // @note C++17，内部用死锁避免算法

      // @note 只读共享还能更省：std::shared_mutex 允许多个读者 / 一个写者
    vs:
      javascript: |
        **这一格 JavaScript 基本上用不上** —— 没有共享内存就不需要锁，
        所以那边根本没有互斥量这个概念（Atomics 是给 SharedArrayBuffer
        用的，属于特例）。C++ 里锁是日常工具，
        而且最典型的用法是 **RAII 包一层**（`lock_guard`）——
        构造时加锁、析构时解锁，于是异常路径也不会漏掉解锁。
        这个「用对象生命周期管资源」的模式是 C++ 的标志性写法，
        JavaScript 那边没有对应需求。
      python: |
        两边都有锁，而且 Python 的 `with lock:` 与 C++ 的
        `lock_guard` 是一个思路（都用「块结束就释放」保证不漏）。
        差别在**为什么需要**：Python 的保护往往是为了守住
        「多条语句之间的不变量」（因为单条字节码本来就原子），
        C++ 连一次 `+=` 都需要保护（它不是一步）。
        另一处是 C++ 有 `shared_mutex`（读写锁）、
        `scoped_lock`（一次锁多个、防死锁）这些标准库工具，
        Python 的 `threading` 里对应物要少一些、也更简单。
      java: |
        两边**高度对应**：`synchronized` 块 ↔ `lock_guard` 作用域、
        `ReentrantLock` ↔ `unique_lock`、`ReadWriteLock` ↔ `shared_mutex`，
        连「用作用域保证解锁」这个模式都一样（Java 用 try-finally 或
        try-with-resources 实现）。差别在 C++ 的锁是**库类型**、
        靠析构函数保证解锁；Java 的 `synchronized` 是**语言关键字**、
        由编译器和 JVM 保证。另一处是 C++ 有 `std::scoped_lock`
        一次锁多个互斥量并避免死锁，Java 里要自己按固定顺序加锁。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  channel:
    code: |
      // @note! **标准库没有通道** —— 这是一处真实的能力缺口
      // @note C++20 给的是 std::atomic 的等待/通知（wait / notify_one），
      // @note 那是「等一个条件」的底层原语，不是「传消息的队列」

      // 手搓一个「传消息」的常见搭法：互斥量 + 条件变量 + 队列
      std::mutex m;
      std::condition_variable cv;
      std::queue<Message> q;

      void send(Message msg) {
        { std::lock_guard<std::mutex> g(m); q.push(std::move(msg)); }
        cv.notify_one();                       // @note 通知在解锁之后发
      }
      Message recv() {
        std::unique_lock<std::mutex> ul(m);
        cv.wait(ul, []{ return !q.empty(); }); // @note 醒来要重新检查条件
        Message msg = std::move(q.front()); q.pop();
        return msg;
      }

      // @note 想直接要通道得引第三方库，或者等 C++26 的 sender/receiver
      // @note 标准库还给了 std::promise / std::future（单次结果传递）

      // @note 另有一条「不用锁」的路线：每个线程一份数据、最后合并 ——
      // @note 在很多场景下比搭通道更简单也更快
    vs:
      javascript: |
        **两边的处境正好颠倒**：JavaScript 的 Worker 之间**只有**消息传递
        （`postMessage` 是唯一的通信方式），共享内存反而是特例；
        C++ 的线程之间**只有**共享内存，消息传递要自己用
        互斥量加条件变量搭出来。也就是说这边「不共享、改用通信」
        是一种**要额外付出努力才能达到的设计**，
        而那边是默认、也是唯一的选择。
        代价是 C++ 这条路上细节多：通知要放在解锁之后、
        醒来必须重新检查条件（虚假唤醒）。
      python: |
        两边都能做消息传递，而且 Python 的 `queue.Queue` 开箱即用 ——
        C++ 的对应物是**一组原语**（互斥量、条件变量、队列容器），
        要自己拼装，还要小心「醒来后条件可能已经不成立」这类细节。
        另一处是 Python 有 `multiprocessing.Queue` 能跨进程传，
        C++ 的标准库没有进程间通信这一层（要平台 API 或第三方）。
        共同点是消息传递这个模式在两边都能用，只是一个现成、一个自建。
      java: |
        两边**基本对应**：Java 的 `BlockingQueue` 提供现成的阻塞队列，
        C++ 的标准库**没有** —— 要用 `std::mutex` 加
        `std::condition_variable` 自己搭，或者引第三方库。
        所以从 Java 过来会明显感到缺了一件日常工具。
        另一处是 Java 的 `CompletableFuture` 与 C++ 的
        `std::future` / `std::promise` 对应（一次性的结果传递），
        两边都有，但 Java 的可组合性强得多。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  atomicity:
    code: |
      // @note! 「一条语句」在 C++ 里**不等于「一步」**
      // @note   `counter += 1` 是「读 → 加 → 写」三步，中间可以被插队

      std::atomic<int> a{0};
      a += 1;                          // @note 原子版本的读改写（默认 seq_cst）
      a.fetch_add(1);                  // @note 显式写法，可以指定内存序
      a.load();  a.store(1);

      // @note 内存序：默认是最严格的顺序一致（seq_cst），最贵也最好懂
      a.fetch_add(1, std::memory_order_relaxed);   // @note 只保证原子，不保证顺序
      a.fetch_add(1, std::memory_order_acq_rel);   // @note 获取-释放语义

      // @note C++20 起原子量还能当「轻量等待」用（不再需要条件变量）
      a.wait(0);                       // @note 等到值不再是 0
      a.notify_one();

      // @note! 内存序写错不会报错，只会在某些机器上偶尔出错 ——
      // @note! 这是 C++ 并发里最难查的一类 bug（「在我机器上没事」）
      // @note 不确定就用默认的 seq_cst，它慢一点但语义直白

      // @note 还有一件事：`volatile` **不是**用来做同步的 ——
      // @note 它只表示「这个值可能在别处被改」，不提供任何跨线程保证
    vs:
      javascript: |
        两边都有原子操作，但**位置不同**：JavaScript 的 `Atomics`
        是给 `SharedArrayBuffer` 配套的**特例工具**（因为默认不共享，
        想共享反而要显式申请一块共享内存）；C++ 的 `std::atomic`
        是日常工具（因为默认就共享）。
        另一处是 C++ 暴露了**内存序**这一层（relaxed / acquire-release /
        seq_cst），让你在「正确」与「快」之间做选择；
        JavaScript 只给了顺序一致这一档，不让你调。
        也就是说 C++ 这边更自由，也更容易写错。
      python: |
        两边的原子性层次完全不同：Python 有全局解释器锁，
        **单条字节码**天然是原子的，所以很多操作不需要显式原子类型；
        C++ 里连一次自增都不是一步，必须显式用 `std::atomic`
        或者加锁。另一处是 C++ 有内存序这层显式控制
        （可以为了性能放宽到 relaxed），Python 里没有这个概念。
        共同点是两边都可能遇到「看起来对、偶尔错」的并发 bug，
        但 C++ 这边因为优化与重排，出错方式更隐蔽。
      java: |
        两边**非常接近**：`AtomicInteger` / `AtomicLong` ↔ `std::atomic<int>`，
        都有「原子但不管顺序」的档位（`lazySet` ↔ `memory_order_relaxed`），
        都有显式的内存序工具（Java 的 `VarHandle` 提供了
        acquire/release/opaque 等访问模式）。
        差别在**默认值与易错性**：Java 的 `volatile` 语义清晰、
        使用门槛低；C++ 的内存序有六档、组合起来很容易写出
        「能跑但不正确」的代码 —— 所以 C++ 这边更强调
        「不确定就用默认的 seq_cst」。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
