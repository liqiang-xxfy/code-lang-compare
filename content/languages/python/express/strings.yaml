# python —— express / strings
#
# boxes 的 key 必须是 catalog/express/features.yaml 里 `group: strings` 的那批。
# 这一组以 Python 为基准时展示在「字符串」章（见 catalog/express/python.yaml）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-strings-v1
    generatedAt: '2026-10-03'

boxes:
  string-literals:
    code: |
      a = 'text'                 # @note 单双引号完全等价
      b = "text"
      name = "Ada"
      t = f"你好，{name}"         # @note f-string：插值
      u = f"{value:.2f}"         # @note 格式规格也写在里面
      multi = """第一行
      第二行"""                   # @note 三引号可以跨行
      raw = r"C:\path\to"        # @note! 原始字符串：反斜杠不转义
      bs = b"\x00\x01"           # @note bytes 是另一种类型，不是 str
    baseline: |
      单双引号等价，`f"..."` 插值（格式规格也能写在花括号里），三引号跨行，
      `r"..."` 保留反斜杠。**没有字符类型** —— `'a'` 就是长度 1 的字符串。
      `str` 与 `bytes` 是两种不同类型，不能隐式互转，文件与网络读写时要显式
      `encode` / `decode`。
    vs:
      javascript: |
        JavaScript 用反引号的模板字符串插值，跨行与插值在同一套语法里；
        Python 分成 f-string（插值，不跨行）与三引号（跨行，不插值）两件事。
        Python 还多两样这里没有的：原始字符串前缀与 bytes 类型。
      java: |
        Java 以前只有 `+` 拼接，新版的文本块能跨行但仍没有插值；
        Python 的 f-string 把插值与格式规格写在一处。另一处差别是 Java 把
        `char` 与 `String` 分得很开，Python 与这里一样没有字符类型。
    equivalence:
      javascript: analogous
      java: divergent

  string-common-ops:
    code: |
      s = "hello"
      len(s)                  # @note 5 —— 字符数（不是字节数）
      s.upper()               # @note 返回新串，s 没变
      "ell" in s              # @note True —— 成员判断用 in
      s[1:3]                  # @note "el" —— 切片，越界不报错
      s[::-1]                 # @note "olleh" —— 反转
      s.split(",")            # @note 拆成列表
      "-".join(["a", "b"])    # @note 拼回去
      s.replace("l", "L")     # @note! "heLLo" —— 默认**全部**替换
      f"{3.14159:.2f}"        # @note "3.14" —— 格式化
    baseline: |
      常用操作一半是内建函数、一半是方法：`len(s)` 数**字符**（不是字节），
      成员判断用 `in`，取子串用切片（越界自动截断、不抛错），反转用 `s[::-1]`。
      `str.replace` **默认全部替换** —— 这一点与不少语言相反。字符串不可变，
      每个方法都返回新串。格式化首选 f-string。
    vs:
      javascript: |
        JavaScript 把长度做成属性、切片做成方法（`length` / `slice`），
        Python 用 `len()` 与切片语法。两处默认值相反、必须记住：
        Python 的 `replace` **全替换**，JavaScript 的只换第一处；
        Python 的切片越界**截断**，JavaScript 的 `slice` 同样是截断但下标从 0 起、
        不支持负步长。
      java: |
        Java 的字符串操作与这里大体对得上（`substring` / `contains` /
        `split` / `replace`），但 `length` 是方法、下标从 0 起、没有切片语法。
        `replace` 的默认行为这里与 Python 一致（全替换），
        而 Java 的 `replaceAll` 收的其实是**正则** —— 名字与行为对不上。
    equivalence:
      javascript: divergent
      java: analogous
