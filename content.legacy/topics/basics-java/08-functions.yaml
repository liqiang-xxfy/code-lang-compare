id: basics-java/08-functions
topicId: basics-java
title: 函数与参数
order: 8
summary: 方法必须挂在类上、没有默认参数、单返回值——从 Java 出发看这一层

features:
  - id: basics-java/function-declare
    title: 函数声明
    kind: syntax
    summary: 没有自由函数，一切方法都要挂在类上

  - id: basics-java/default-params
    title: 默认参数
    kind: behavior
    summary: 没有这个语法，靠重载或 Builder

  - id: basics-java/kwargs
    title: 关键字参数
    kind: behavior
    summary: 没有关键字参数，调用处只有位置

  - id: basics-java/rest-params
    title: 可变参数
    kind: syntax
    summary: 只能有一个可变参数，且必须是最后一个

  - id: basics-java/return-multiple
    title: 多返回值
    kind: behavior
    summary: 一个方法只能返回一个值，多值要自定义类型

  - id: basics-java/lambda-arrow
    title: lambda 与函数式接口
    kind: behavior
    summary: lambda 必须赋给某个接口类型，且只能捕获事实不变变量

  - id: basics-java/function-callback
    title: 一等函数与回调
    kind: syntax
    summary: 方法引用比 lambda 更短，参数顺序是"主语在前"

  - id: basics-java/function-docstring
    title: 文档字符串
    kind: syntax
    summary: Javadoc 是注释，运行时不进字节码

  - id: basics-java/arg-passing
    title: 参数传递
    kind: behavior
    summary: 一切按值传递，但基本类型与对象表现不同
