  - featureId: js2java/types-exercise
    equivalence: identical
    code: |
      function summarize(orders) {
        if (orders.length === 0) return 0;
        const total = orders.reduce((acc, o) => acc + o.price * o.qty, 0);
        const avg = total / orders.length;        // @note 除以零由上面的守卫挡住
        return Number(avg.toFixed(2));           // @note toFixed 自带四舍五入
      }

