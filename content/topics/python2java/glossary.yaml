# 速语词典 —— 从 Python 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 会拦第三门）

- term: 函数
  aliases: [function, method]
  perLanguage:
    python: 一等对象，模块级函数与类方法没有本质区别；`def` 即可定义
    java: 必须挂在类上；Java 8 起有 lambda，但它只能赋给函数式接口类型，不是独立类型
  note: Python 的「函数」迁到 Java 时，第一个要决定的就是"它该挂在哪个类上"。

- term: 重载
  aliases: [overload, override]
  perLanguage:
    python: 没有重载 —— 同名函数后定义的会直接覆盖先定义的
    java: 编译期按参数列表选择同名方法；`@Override` 是另一件事（子类覆盖父类实现）
  note: 「重载」与「覆盖」在 Java 里是两个词，Python 里只有后者，而且不需要标注。

- term: 参数
  aliases: [parameter, argument]
  perLanguage:
    python: 支持默认值、关键字传参、`*args` / `**kwargs` 四种自由度
    java: 只能按位置传；可变参数 `T...` 只能一个且在最后；没有默认值
  note: 从 Python 到 Java，参数这一层的自由度是**被收回**最多的地方。

- term: 类型标注
  aliases: [type hint, annotation, generic]
  perLanguage:
    python: 注解只是给工具看的，运行时完全不强制；写错了不会报错
    java: 泛型在编译期擦除，但类型检查是真的会拦你；`List<String>` 与 `List<Integer>` 在运行期是同一个类
  note: 两边都有「类型信息在运行时消失」这件事，但原因和时间点完全不同。
