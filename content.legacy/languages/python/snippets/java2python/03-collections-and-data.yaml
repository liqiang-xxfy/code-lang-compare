  - featureId: java2python/collections-exercise
    equivalence: analogous
    code: |
      from collections import defaultdict

      @dataclass(frozen=True)
      class Employee:
          id: int
          name: str
          dept: str

      def group_by_dept(employees):
          groups = defaultdict(list)
          for e in employees:
              groups[e.dept].append(e.name)   # @note! 对应 computeIfAbsent：读一次就建好
          return dict(groups)
          # @note! 这一步是必须的：不转会留下"读一次就多一个空组"的痕迹
      # @note 空输入自然返回空字典
