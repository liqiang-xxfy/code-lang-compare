- featureId: basics/function-docstring
  equivalence: divergent
  code: |
    // Add 计算两个数的和。
    //
    // 参数为负时返回错误。
    func Add(a, b int) (int, error) { return a + b, nil }

    // @note! Go 的文档注释就是普通 // 注释，**紧贴在声明上方**即可
    // @note 约定：注释以函数名开头（"Add 计算..."），godoc 据此生成文档
    // @note 没有 @param / @return 这类结构化标签 —— 全靠自然语言约定
  review:
