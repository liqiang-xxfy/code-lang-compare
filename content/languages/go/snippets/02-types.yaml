- featureId: basics/primitive-types
  equivalence: analogous
  code: |
    var i int = 1           // @note int 的位宽随平台（32 或 64 位）
    var i64 int64 = 1       // @note 要固定宽度必须显式写 int64
    var f float64 = 1.0
    var b bool = true       // @note 只有 true / false
    var r rune = 'A'        // @note rune 就是 int32，表示 Unicode 码点
    var by byte = 0x41      // @note byte 就是 uint8

    // @note! Go 没有隐式类型转换：int 与 int64 是两个类型，不能直接相加
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/type-inference
  equivalence: divergent
  code: |
    count := 0              // 推断为 int，此后类型固定
    // count = "text"       // 编译错误：cannot use "text" as int

    var x float64 = 1
    y := x                  // float64

    // @note Go 推断出具体类型后就不再变化，且没有隐式转换 ——
    //       int + int64 必须写成 int64(x) + y，比 JS 严格得多
  review:
