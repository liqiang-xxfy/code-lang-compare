# arkts —— model / modules
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: modules` 的那批：
# module-unit / export-import / default-vs-named / namespace-alias / module-resolution。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：模块语法沿用 ES 模块那一套，与 JavaScript 高度同形；能核实的差别主要
# 在「模块从哪来」—— 系统能力是一组固定命名的 SDK 模块、第三方依赖写在包管理清单里、
# 运行时不是 Node 因此没有 CommonJS 那条老路。拿不准的细节一律不编造，
# 写不出差异的格子如实标 identical / analogous 加一句短说明，不灌水。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-modules-v1
    generatedAt: '2026-10-03'

boxes:
  module-unit:
    code: |
      // 一个 .ets / .ts 文件就是一个模块
      const secret = 1;                  // @note 模块顶层名字默认私有
      export const shared = 2;           // @note 要 export 出去，别的模块才看得见

      export default class EntryAbility extends UIAbility { }   // @note 一个文件一个入口

      // @note! 运行时不是 Node，没有 require / module.exports 这套 CommonJS 机制
      // @note! .ets 放 UI 组件、.ts 放纯逻辑，两者都是同样的模块
    vs:
      javascript: |
        模块语义是同一套：一个文件一个模块、顶层名字默认私有、导出的才可见，
        且只在第一次被导入时执行一次。差在**运行时的历史包袱** —— 这里不是 Node，
        没有 CommonJS 那条老路，也就没有 `require` 与模块格式混用的问题；
        JavaScript 里为两种模块格式、扩展名与清单字段做的取舍，这里不需要。
        另一处是文件类型：界面组件与纯逻辑分成两类文件，但模块的含义一样。
      python: |
        Python 一个文件也是模块，但顶层名字默认**全公开**，靠下划线表示内部；
        这里反过来，不导出就是私有。更大的差别在包：Python 用「目录加 `__init__.py`」
        构成多一级的作用域；ArkTS 没有目录级的包，分组靠 `namespace` 与模块文件结构，
        目录本身只决定文件的摆放。
      java: |
        Java 的模块单位是**类**而不是文件（一个文件可以放多个类），命名空间靠
        `package` 声明；ArkTS 的单位就是文件本身，文件与模块是同一件事，
        代码层的分组用 `namespace`（或直接靠目录结构）。Java 还有一层可选的模块声明
        （显式列出依赖与对外导出的包），ArkTS 的对应物是依赖清单 `oh-package.json5` ——
        依赖写在清单与导入导出里，不在语言里再声明一遍。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  export-import:
    code: |
      // 导出
      export const x = 1;
      export function f(): number { return x; }
      export class Helper { }

      // 导入
      import { f, Helper } from './utils/Helper';   // @note 相对路径，编译期解析到同名文件
      import { UIAbility } from '@kit.AbilityKit';  // @note 系统能力：从 SDK 提供的模块取

      // @note! 导入导出只能写在顶层，路径与模块名都必须是字面量
      // @note! 相对路径不写扩展名，由编译期按模块清单解析
    vs:
      javascript: |
        导入导出是同一套静态声明：只能写在顶层、路径必须是字面量、默认与具名两种
        写法都有，语序与语义可以直接照搬。差别在**模块从哪来** —— 这里的系统能力是
        一组以固定前缀命名的 SDK 模块，应用自己的依赖写在包管理清单里；JavaScript
        那边统一走「包名到依赖目录」的查找，两者的解析规则与配置位置都不一样。
      python: |
        Python 的 import 是**运行时语句**，会真的把整个模块执行一遍，也能写在函数里、
        条件执行；ArkTS 的导入是静态声明，只能写在顶层，依赖图因此编译期就完整。
        另一处是可见性方向相反 —— Python 顶层名字默认全公开，这里默认私有，
        必须显式导出别的模块才拿得到。
      java: |
        Java 的 `import` 只给类型起个短名、不加载任何东西，类什么时候被加载由运行时
        决定；ArkTS 的导入会把模块真正纳入依赖并执行一次。Java 用可见性修饰符逐个
        成员控制暴露，ArkTS 在模块层面靠导出决定，单位是名字而不是成员。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  default-vs-named:
    code: |
      // 默认导出：一个模块最多一个
      export default class EntryAbility extends UIAbility { }

      export const named = 1;                       // @note 具名导出可以有多个
      export class Utils { }

      // 导入侧
      import EntryAbility from './EntryAbility';    // @note 默认导出可以随便起名
      import { named } from './utils/a';
      import EntryAbility2, { named as n } from './utils/a';
    vs:
      javascript: |
        两种导出形态逐条对应：默认导出一个、具名多个，导入方对默认导出可以自由起名、
        对具名导出必须名字对上，写法与命名规则都不用改。差别只在用例的侧重 ——
        这里的默认导出多用在「一个文件一个入口」的场合（一个 ability、一个页面组件），
        共享的工具与常量则走具名导出。这一格与 JavaScript 之间没有可核实的语法差异。
      python: |
        Python 只有具名这一种：模块顶层的名字就是它的全部导出，没有默认导出，
        想表达「一个模块一个主角」只能靠命名惯例。ArkTS 两种都有，默认导出让导入方
        可以自由起名，因此入口类的文件名与类名不必强绑在一起。
      java: |
        Java 没有「导出什么」这个动作：可见性写在每个成员上，也没有默认导出与具名
        导出之分。ArkTS 照搬了模块层面的两分法 —— 先列导出清单、再谈可见性，单位是
        名字；Java 只有成员级别的那一套。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  namespace-alias:
    code: |
      import * as utils from './utils';            // @note 整包收进一个对象，避免重名
      utils.f();

      import { veryLongName as short } from './utils';   // @note 导入时改名
      export { short as publicName };              // @note 导出时也能改名

      // @note! 重名在模块边界上解决：每个名字都属于某个模块
      // @note! 没有可以随手往里塞名字的全局命名空间
    vs:
      javascript: |
        别名手段与 JavaScript 完全一致：`import * as ns` 把模块收成一个对象、
        `as` 在导入与导出两侧都能改名，语法与语义逐条对应。
        因此重名的解法也相同 —— 都在模块边界上解决，不需要一个手工维护的全局
        命名空间。这一格两边没有可核实的写法差异，如实标为同构。
      python: |
        Python 的 `import m as alias` 与 `from m import n as alias` 覆盖同样两种需求，
        写法几乎一一对应。差别在通配：Python 的 `from m import *` 把名字直接摊进
        当前作用域，还会带进没写进导出清单的东西；ArkTS 的 `import * as ns` 是收进
        一个对象，不会污染当前作用域。
      java: |
        Java 没有给类型起别名的机制，同名只能写全限定名；ArkTS 的 `as` 随手就能解决
        重名。分组单位也不同：Java 靠包与嵌套类，包名与目录结构绑定；ArkTS 靠模块，
        模块由路径与依赖清单决定，与目录位置的绑定更松。
    equivalence:
      javascript: identical
      python: analogous
      java: divergent

  module-resolution:
    code: |
      import { f } from './utils/Helper';          // @note 相对路径：编译期解析到同名 .ets / .ts
      import { router } from '@kit.ArkUI';         // @note 系统能力：SDK 提供的固定模块名
      import { BusinessError } from '@kit.BasicServicesKit';

      // oh-package.json5（依赖清单）：声明第三方依赖
      // "dependencies": { "dayjs": "1.11.10" }
      // import dayjs from 'dayjs';                // @note 按清单里的模块名导入

      // @note! 写模块名（系统模块 / 第三方库）与写相对路径，是两种不同的解析方式
    vs:
      javascript: |
        JavaScript 的解析由路径本身与包清单决定，规则都写在代码与清单里；
        ArkTS 多了一层**依赖清单**与一组 SDK 提供的固定模块名 —— 系统能力不在
        文件系统里，而是按约定的名字从 SDK 取。相对路径那一半两边一致，区别在于
        两种模块来源各自的解析规则由谁定义。
      python: |
        Python 靠运行时的搜索路径列表逐级去找，同名模块看谁先被找到，环境变量与
        当前目录都能改变结果；ArkTS 的解析在编译期由相对路径、依赖清单与 SDK 模块名
        确定，不依赖搜索顺序。差别在于不确定性 —— 一边「导入的是哪个」可能随环境变，
        另一边在编译期就锁死。
      java: |
        Java 用类路径按顺序搜索，同名谁先生效取决于顺序；ArkTS 的解析在编译期完成，
        依赖用清单声明、系统模块有固定名字，没有「同名谁先生效」这类问题。分组依据
        也不同：Java 的包名与目录结构必须对应，ArkTS 的模块由路径与依赖清单决定，
        相对路径之外的部分并不落在文件系统里。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous
