id: concepts-python/05-toolchain
topicId: concepts-python
title: 工具链与生态
order: 5
summary: 装包、跑起来、测、查、格式化 —— 迁移后每天都要用的那一套
features:
  - id: concepts-python/package-manager
    title: 包管理
    kind: concept
    summary: 声明文件与落地位置都换了，JS 默认就锁版本

  - id: concepts-python/dependency-isolation
    title: 依赖隔离
    kind: concept
    summary: 你的环境全局一套、同名包只能一个版本；JS 就近查找、多版本共存

  - id: concepts-python/runner
    title: 运行时
    kind: concept
    summary: 一个解释器就是全部 vs 同一份代码要跑在浏览器与 Node 两套 API 上

  - id: concepts-python/build-tool
    title: 构建工具
    kind: concept
    summary: 解释执行、开发不用构建；JS 的打包转译是每次都要跑的环节

  - id: concepts-python/test-framework
    title: 测试框架
    kind: concept
    summary: 普通函数加裸 assert vs 框架词汇加 expect 链

  - id: concepts-python/testing-mock
    title: 测试替身
    kind: concept
    summary: 猴补丁直接换属性 vs 模块级 mock 需要提升

  - id: concepts-python/lint-format
    title: 代码检查与格式化
    kind: concept
    summary: 生态收敛到唯一答案 vs 规则可插拔、每个项目一套配置

  - id: concepts-python/repl
    title: 交互式环境
    kind: concept
    summary: 两边都有 REPL，迁移期用它在不建项目的前提下验证差异
