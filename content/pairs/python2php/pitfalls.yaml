# 迁移陷阱 —— 带着 Python 的习惯写 PHP 会踩的坑
# severity: 1 = 一般 / 2 = 经常踩 / 3 = 必踩

- id: pitfall-py2php-modulo-sign
  featureId: express/arithmetic
  title: 取模的符号跟被除数
  symptom: |
    Python 的 `-5 % 3` 是 **1**（跟除数、结果非负）；
    PHP 的 `-5 % 3` 是 **-2**（跟被除数）。两者都不报错。
  cause: |
    PHP 的 `%` 结果与被除数同号；Python 的结果与除数同号。
    正数时一致，负数时方向相反 —— 这类差异不会报错，只会算错。
  fix: |
    涉及负数的取模要特别小心；需要 Python 那种「非负余数」就自己调整
    （先加一个除数再取模）。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [数值, 运算符]

- id: pitfall-py2php-array-copy-object-handle
  featureId: mechanism/value-vs-reference
  title: 数组是值拷贝，对象是句柄
  symptom: |
    Python 的 list 是引用语义；PHP 的数组赋值是**拷贝**，改副本不影响原数组。
    但对象赋值是句柄（共享）。
  cause: |
    PHP 的数组是值类型（赋值即拷贝）；对象默认是引用语义，要复制得显式 clone。
    Python 的 list / dict 都是引用语义。
  fix: |
    数组要共享得传引用（`&$arr`）；对象要独立副本用 `clone`（浅拷贝）。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [值语义, 数组]

- id: pitfall-py2php-isset-null
  featureId: express/null-and-undefined
  title: isset 对 null 返回 false
  symptom: |
    用 `isset($arr['key'])` 判断键在不在，键存在但值是 null 时返回 false。
  cause: |
    PHP 的 isset 问的是「存在且不为 null」。
    Python 的 `'key' in dict` 只问键在不在 —— 语义更接近 PHP 的 array_key_exists。
  fix: |
    只问键在不在用 `array_key_exists`；同时排除 null 才用 isset。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [空值]

- id: pitfall-py2php-cast-gives-zero
  featureId: express/type-conversion
  title: 类型转换失败给的是 0
  symptom: |
    Python 的 `int("abc")` 抛 ValueError；PHP 的 `(int)"abc"` 得到 **0**，不报错。
  cause: |
    PHP 的显式转换尽量给一个数（非数字开头给 0，数字开头取前面部分）。
    Python 的 int() 严格，不合法就抛异常 —— 这是「快速失败」与「尽量给值」的差别。
  fix: |
    要校验用 `is_numeric()` 或 `filter_var($x, FILTER_VALIDATE_INT)`，
    别指望强转会报错。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [类型转换]

- id: pitfall-py2php-string-bytes
  featureId: express/string-common-ops
  title: 字符串是字节序列
  symptom: |
    Python 的 `len("中文")` 是 2（字符数）；PHP 的 `strlen("中文")` 是 6（字节数）。
  cause: |
    Python 3 的 str 是 Unicode 字符序列；PHP 的字符串是**字节数组**，
    strlen / 下标 / substr 都按字节算。
  fix: |
    用 mbstring：`mb_strlen($s, 'UTF-8')`、`mb_substr(...)`。
    Python 的字符串直觉在这里不成立。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [字符串]

- id: pitfall-py2php-match-vs-switch
  featureId: express/switch-and-match
  title: match 严格比较，switch 松散比较
  symptom: |
    看到 PHP 的 match 以为是 Python 的结构模式匹配，其实它只是
    「严格比较的多分支选择」；而 switch 用松散比较会走错分支。
  cause: |
    PHP 的 `match` 是**严格比较**（`===`）的多分支表达式，不贯穿、能返回值；
    `switch` 用**松散比较**（`==`）。
    Python 的 match 是**结构模式匹配**（能解构、能匹配类型与形状）——
    三者都叫 match，能力完全不同。
  fix: |
    PHP 的 match 当成「更安全的 switch」用，别期待结构模式匹配。
  severity: 2
  languages: [python, php]
  fromBaseline: true
  tags: [控制流]

- id: pitfall-py2php-attributes-are-metadata
  featureId: mechanism/decorator-annotation
  title: 属性不执行任何代码
  symptom: |
    看到 `#[Route('/home')]` 以为是 Python 那种会执行的装饰器，其实它只是元数据。
  cause: |
    Python 的装饰器是高阶函数，`@deco` 会真的执行并替换函数。
    PHP 8 的 `#[...]` 属性**不执行任何代码**，是纯元数据，靠反射读取。
    语法位置像，机制完全不同。
  fix: |
    把 `#[...]` 理解成「带类型的注解」，行为由读取它的代码提供。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [装饰器, 元编程]

- id: pitfall-py2php-no-generics
  featureId: mechanism/generic-declaration
  title: 没有泛型
  symptom: |
    想在类型标注里写 `array<int>`，PHP 没有这种语法。
  cause: |
    PHP 没有泛型（2026-05 的 RFC 被 Declined）。
    Python 有 typing 的 `list[int]`（虽擦除但能静态检查）。
    PHP 只能靠 PHPDoc 注释加静态分析工具。
  fix: |
    用 `@param Foo[] $items` 这样的 PHPDoc 标注，配 PHPStan / Psalm。
  severity: 2
  languages: [python, php]
  fromBaseline: true
  tags: [泛型]

- id: pitfall-py2php-array-plus-union
  featureId: express/arrays
  title: 数组相加是并集，不是拼接
  symptom: |
    Python 的 `a + b` 把两个 list 接起来；PHP 的 `$a + $b` 是**并集**，
    左边已有的键不被覆盖。
  cause: |
    PHP 的 `+` 对数组是并集（只补右边缺的键）。
    Python 的 `+` 对 list 是拼接，`|` 对 dict 是合并（右边覆盖）。
  fix: |
    合并用 `array_merge($a, $b)` 或 `[...$a, ...$b]` ——
    类似 Python 的 `a | b`。
  severity: 2
  languages: [python, php]
  fromBaseline: true
  tags: [数组]

- id: pitfall-py2php-logical-returns-bool
  featureId: express/logical
  title: 逻辑运算符恒返回布尔值
  symptom: |
    Python 的 `x = a or 'default'` 是取默认值的常用写法；
    PHP 的 `$x = $a || 'default'` 给的是 **true**。
  cause: |
    Python 的 `and` / `or` 返回**操作数**（短路求值后那个值）。
    PHP 的 `||` / `&&` **恒返回 bool**。
  fix: |
    取默认值用 `??`（null 合并）或 `?:`。记住 `||` 只给 bool。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [运算符]

- id: pitfall-py2php-variables-and-typing
  featureId: express/declaration
  title: 变量带 $ 前缀，而且声明是弱的
  symptom: |
    每个变量都要写 `$`；而且没有「先声明后使用」的规则，
    拼错变量名在旧版本里静默当 null。
  cause: |
    PHP 的变量必须带 `$` 前缀，且是弱类型（除非开 strict_types）。
    Python 的变量不需要前缀，但名字拼错会 NameError —— PHP 8 之前是静默。
  fix: |
    注意 `$` 前缀；PHP 8 下拼错变量名会有 Warning，别关掉警告。
    开 `declare(strict_types=1)` 让类型检查严起来。
  severity: 2
  languages: [python, php]
  fromBaseline: true
  tags: [声明]

- id: pitfall-py2php-shared-nothing
  featureId: mechanism/concurrency-unit
  title: 共享无状态请求模型
  symptom: |
    想在请求间共享缓存，发现每次请求状态全新。
  cause: |
    PHP 经典模型是**共享无状态**：每请求一个进程，结束即销毁，
    全局变量、静态变量只在单请求内有效。
    Python 的 WSGI 应用通常每请求调用，但进程可能复用（有全局状态累积的风险）——
    两者的生命周期语义不同。
  fix: |
    跨请求共享用外部存储（Redis、文件、数据库）。
    常驻进程形态要用 Swoole / RoadRunner 之类，那改变了执行模型。
  severity: 3
  languages: [python, php]
  fromBaseline: true
  tags: [并发, 运行时]
