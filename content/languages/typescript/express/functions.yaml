# typescript —— express / functions
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: functions` 的那批：
# function-declaration / parameters / variadic / return-values / closures。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）——
# 包括缩写，「TS」这类简称同样算点名。泛指第三门时写「另一门语言」。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-functions-v1
    generatedAt: '2026-10-03'

boxes:
  function-declaration:
    code: |
      function greet(name: string): string {   // @note 声明式：与 JavaScript 同形，多出类型签名
        return `你好，${name}`;
      }
      const hi = function (name: string): string { return name; };   // @note 函数表达式
      const yo = (name: string): string => `你好，${name}`;          // @note 箭头函数

      // 重载：一个函数可以有多个调用签名，实现体只有一个
      function pick(x: string): string;
      function pick(x: number): number;
      function pick(x: string | number) { return x; }   // @note 实现签名对外不可见，调用方只看见上面两条

      // this 参数是虚构的形参，只用来给 this 标类型
      function get(this: { n: number }): number { return this.n; }

      function first<T>(xs: T[]): T { return xs[0]; }   // @note 泛型函数的类型由调用处推断
    vs:
      javascript: |
        三种写法逐字相同 —— 去掉冒号和类型标注就是合法的 JavaScript，
        运行时的函数行为也一字不改。多出来的是纯类型层的东西：重载签名
        （JavaScript 里同名函数只能存在一个，写在后面的覆盖前面的）、
        `this` 参数的标注，以及泛型。代价是这些保证只覆盖写了标注的地方 ——
        没标类型的位置会悄悄退回 JavaScript 那套动态行为，编译器不再多问一句。
      python: |
        Python 只有 `def`（外加 `lambda` 表达式），而 TypeScript 的三种写法里
        箭头函数语义差别不小：它没有自己的 `this`，直接取定义处外层的那个；
        Python 的方法靠显式 `self` 参数，不存在「this 丢了」这回事。
        重载的机制也相反：TypeScript 的多条调用签名是编译器的事，运行时只有一个实现；
        Python 想在类型检查器里表达重载得额外导入 `overload`，而运行时同样不参与。
      java: |
        Java 没有自由函数，所有方法必须写在类里；TypeScript 的顶层函数随便写。
        重载两边都有，但机制相反：Java 的重载在运行时按参数类型选中不同的方法体，
        TypeScript 的调用签名编译后全部抹掉，只剩一个实现 —— 它只是让调用点通过检查。
        泛型函数是两边最可对应的一处：都要引入一次类型参数，调用时都能推断。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  parameters:
    code: |
      function f(a: number, b = 10, c?: string): void {}   // @note 可选参数写在必填参数之后
      f(1);                        // @note b 取默认值，c 是 undefined

      // 解构参数：靠对象模拟具名参数，默认值也能写在解构里
      function makeUser({ name, age = 0 }: { name: string; age?: number }) {}
      makeUser({ name: "Ada" });   // @note 顺序无关，缺的字段走默认值

      class P {
        constructor(public id: number, private tag = "x") {}   // @note 参数属性：形参一步变成字段
      }

      // @note! `c?: string` 的类型是 string | undefined，把 null 传进去会被拦下
    vs:
      javascript: |
        实参的传递语义逐字相同：少传是 `undefined`、不会报错，默认值只在传 `undefined`
        时触发、每次调用重新求值。TypeScript 多出的是**签名上的约束**：可选参数
        `c?: string` 把「可以不给」变成类型的一部分，参数属性让构造器少写一段赋值。
        但这些约束都止于编译期 —— 运行时该怎么传还是怎么传，看调用点也看不出差别。
      python: |
        Python 有真正的关键字参数，调用方写 `make_user(name="Ada")` 就能无视顺序；
        TypeScript 只能靠解构对象模拟，而且这个「具名参数」在运行时只是个普通对象。
        默认值的求值时机两边相反：Python 只在定义时求值一次（`def f(x=[])` 是著名的坑），
        TypeScript 每次调用重新求值。可选参数两边都有，位置限制也一样（要放最后）。
      java: |
        Java 没有默认值、没有可选参数，缺省行为只能靠重载写多个方法；
        可选参数那一层是纯类型的；默认值不一样 —— 它会原样留在编译产物里，运行时有行为。
        另一处差别在少传实参：Java 编译期就报错，TypeScript 里不传可选参数是合法的 ——
        调用点上看不出这里「本可以少传」，契约只写在签名那一侧。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  variadic:
    code: |
      function sum(...nums: number[]): number {   // @note rest 的类型是 number[]，收成真数组
        return nums.reduce((a, b) => a + b, 0);
      }
      sum(1, 2, 3);                  // @note 6 —— 实参个数不进入类型

      const xs = [1, 2, 3];
      sum(...xs);                    // @note 调用处的 ... 是展开，把数组摊成实参

      // @note! 用元组类型才能约束「至少一个 / 前面几个固定」
      function head<T>(first: T, ...rest: T[]): T { return first; }

      // @note! rest 必须放最后、只能有一个；展开元组时个数会被逐个核对
    vs:
      javascript: |
        语法与运行时行为逐字相同 —— `...nums` 收成真数组、调用处 `...xs` 把数组摊开，
        连 `arguments` 那套旧写法都一样。TypeScript 只多做一件事：把 rest 标成
        `number[]`，于是每个实参都要与元素类型对上。再往上一层，元组类型能把
        「至少要有一个参数」这类约束也写进签名 —— 这是 JavaScript 完全表达不了的。
      python: |
        Python 用 `*args` 收成**元组**，TypeScript 的 rest 收成数组（可变、可再处理）；
        更关键的是 Python 还有 `**kwargs` 收关键字参数，TypeScript 没有对应物，
        要「一组可选的命名参数」只能传一个对象。展开语法两边都有，
        但产物不同：`*args` 展开的是元组，`...xs` 展开的是数组。
      java: |
        Java 的可变参数 `int... nums` 在方法内部就是一个数组，而且**必须是最后一个参数**；
        TypeScript 的 `...rest` 同样放最后，这条规则一致。真正的差别有两个：
        Java 不能在调用处把已有数组「展开」成实参，只能整只传进去；
        TypeScript 可以 `sum(...xs)` 摊开，还能靠元组约束实参个数。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  return-values:
    code: |
      function f(): void {}            // @note void 明确表示「不返回」
      function g() { return; }         // @note 推断成 void；不写 return 也是 void

      // 多返回值：用元组，每个位置有自己的类型
      function minMax(xs: number[]): [number, number] {
        return [Math.min(...xs), Math.max(...xs)];
      }
      const [lo, hi] = minMax([3, 1, 2]);   // @note 解构接回，lo / hi 各自是对应位置

      // @note 命名元组让调用点看得懂每个位置是什么
      function split(s: string): [head: string, tail: string] { return [s[0], s.slice(1)]; }

      // @note! 箭头函数直接返回对象字面量要加括号，否则 `{}` 被当成函数体
      const obj = () => ({ a: 1 });
    vs:
      javascript: |
        运行时完全一样：不写 `return` 得到 `undefined`、裸 `return` 也是；
        箭头函数返回对象要加圆括号这条坑两边都踩。TypeScript 多出的是返回类型 ——
        声明了 `[number, number]` 之后，少返回一个元素、或顺序写反都会被编译器指出；
        而 JavaScript 里接元组的那次解构纯靠约定，接错位置没有东西会提醒你。
      python: |
        两边都能一次带回多个值，但层的厚度不同：Python 的 `return a, b` 是原生语法，
        调用方直接 `x, y = f()` 解包，形状不用先声明；TypeScript 得先写一个元组类型
        `[number, number]` 才能接。另一处是标注的性质：Python 的返回标注只有类型检查器
        在意，TypeScript 声明了 `void` 却在某条路径上给出值，编译就过不去。
      java: |
        Java 必须声明返回类型、`void` 表示不返回，而且所有路径都要有返回值 ——
        「忘写 return」在编译期就报错。TypeScript 的返回类型可以不写、由推断得出，
        漏掉一条分支有时只是悄悄变成 `undefined`。多返回值两边都要自己打包：
        Java 一般用 record 或容器，TypeScript 用元组更轻，接的时候还能按位置拿类型。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous

  closures:
    code: |
      function counter(): () => number {
        let n = 0;
        return () => ++n;                 // @note 闭包记住 n，返回出去后它仍然活着
      }
      const next = counter();
      next(); next();                     // @note 1 2
      // @note! 收窄不会带进闭包体：编译器假设闭包稍后才会执行
      let v: string | number = "a";
      if (typeof v === "string") {
        // const h = () => v.toUpperCase();   // @note! 报错：闭包里 v 又变回联合类型
      }

      // @note! `var` 的循环变量所有闭包共享；`let` 每轮新建一个绑定
      const fns: (() => number)[] = [];
      for (var i = 0; i < 3; i++) fns.push(() => i);   // 全部拿到 3
    vs:
      javascript: |
        闭包的运行时语义逐字相同 —— 捕获的是变量本身、`var` 共享一个绑定而 `let`
        每轮新建，全都一样，TypeScript 不改变其中任何一条。差别落在**类型**这一层：
        收窄是某个代码位置上成立的结论，写进闭包体时编译器会当作它失效
        （因为它假设闭包可能在变量被改动之后才执行）。想保住那个结论，
        得先把值存进一个不再变的名字，或者自己写一个类型守卫函数。
      python: |
        Python 的闭包同样晚绑定 —— 循环里造的函数共享同一个变量，最后都拿到末值；
        TypeScript 这边 `let` 每轮新建绑定，所以那个坑只在用 `var` 时出现。
        另一处是「在闭包里改外层变量」：Python 需要 `nonlocal` 显式声明，
        TypeScript 直接赋值就行。差别还落在类型上：TypeScript 能发现收窄在闭包里失效，
        Python 的标注管不到这一层。
      java: |
        Java 的 lambda 只能捕获**事实上的 final** 变量 —— 捕获之后就不能再改，
        编译器直接拦住，所以「闭包共享一个可变变量」这个坑在 Java 里写不出来。
        TypeScript 的闭包能捕获可变的 `let`，换来的是编译器没法再信任在捕获那一刻
        得到的收窄结论。两边对「捕获完之后那个变量还能不能变」的态度正好相反。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent
