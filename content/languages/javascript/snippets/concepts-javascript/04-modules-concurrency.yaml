snippets:
  - featureId: concepts-javascript/module-system
    equivalence: identical
    code: |
      import { helper } from "./util.js";   // 静态提升：声明位置不影响执行顺序
      export function run() {}
    body: |
      JS 的 ESM `import` 是**静态提升**的：声明位置不影响执行顺序，
      且导入是绑定（活的引用），循环依赖能被处理。

      一个文件即一个模块，导出什么完全由 `export` 决定 —— 没有 module / package
      两级结构，也没有「所有顶层名字都可被导入」这回事。

  - featureId: concepts-javascript/memory
    equivalence: identical
    code: |
      let big = new Array(1e6).fill(0);
      big = null;                  // 标记清除：没有引用指向它，GC 会回收
      // 主要泄漏源是闭包持有与忘记解绑的监听器
    body: |
      JS 用标记清除式的 GC：从根出发找不到的对象被回收，循环引用不是问题。
      主要泄漏源是**闭包持有**与忘记解绑的事件监听。

      释放时机不可控：资源是跟着 GC 走的，没有「作用域结束就释放」这回事。

  - featureId: concepts-javascript/concurrency-unit
    equivalence: identical
    code: |
      setTimeout(() => {}, 0);     // 事件循环：所有回调在同一个线程上
      new Worker("worker.js");     // CPU 密集只能靠 Worker 隔离
    body: |
      JS 的并发模型是**事件循环 + 单线程**：所有回调在同一个线程上跑，
      没有数据竞争，也不用担心锁；CPU 密集任务只能丢给 Worker 隔离。

  - featureId: concepts-javascript/async-model
    equivalence: identical
    code: |
      async function load() { return await fetch("/api"); }
      load();                      // 调用即开始跑 —— 事件循环一直在驱动
    body: |
      JS 的异步是**运行时自动驱动**的：事件循环一直在跑，`await` 之后
      不需要谁去「启动」它，写个 `async` 函数调用即可。

      代价是事件循环被阻塞会拖垮全部并发：只要在回调或 `await` 的路径上
      跑了同步的重活，整个循环就卡住了。
