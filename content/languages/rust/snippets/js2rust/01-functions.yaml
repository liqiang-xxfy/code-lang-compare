  - featureId: js2rust/intro
    equivalence: divergent
    code: |
      // Rust 的顶层函数：语法形状与 JS 接近，多出来的是类型与所有权标注
      fn greet(name: &str, greeting: &str) -> String {
          format!("{}，{}", greeting, name)
      }

      // @note! 签名上的 & 不是装饰：它表示"借用，不拿走所有权"。
      //       如果写成 name: String（按值），调用方之后就不能再用那个 String 了 ——
      //       这是 JS 里完全不存在的一类约束，也是本模块的主线。
      //
      // @note 与 JS 的另外两点差异：
      //   · 没有函数提升，函数必须先定义（或声明）后使用
      //   · 匿名函数是闭包 |x| x + 1，且它的类型无法直接命名
  - featureId: js2rust/param-passing
    equivalence: divergent
    code: |
      #[derive(Debug)]
      struct User { name: String }

      // ── 只读看一眼：借用，调用方保留所有权 ──────────────
      fn label(user: &User) -> String {
          user.name.to_uppercase()
      }

      // ── 就地修改：可变借用，独占这个值 ──────────────────
      fn rename(user: &mut User, name: &str) {
          user.name = name.to_string();
      }

      // ── 拿走所有权：调用方之后不能再用 ──────────────────
      fn consume(user: User) -> String {
          user.name
      }

      fn demo() {
          let mut u = User { name: String::from("ada") };

          label(&u);                 // @note 借用结束后 u 仍然可用

          rename(&mut u, "grace");   // @note! 可变借用期间，u 不能被其他代码读或写

          let owned = consume(u);    // u 被**移动**了
          // println!("{}", u.name); // @note! 编译错误：borrow of moved value
          println!("{}", owned);
      }

      // @note 迁移心智：把 JS 的参数默认理解成 &T（借用），这与 JS 行为最接近。
      //       只有当确实要把所有权交出去（存进结构体、跨线程、返回）时才用按值。
  - featureId: js2rust/defaults
    equivalence: absent
    code: |
      struct Connection { host: String, port: u16, tls: bool }

      // 路径一：Option 表达可选参数
      fn connect(host: &str, port: Option<u16>, tls: Option<bool>) -> Connection {
          Connection {
              host: host.to_string(),
              // @note 默认值集中在函数体内，而不是写在参数表上
              port: port.unwrap_or(8080),
              tls: tls.unwrap_or(false),
          }
      }

      fn demo() {
          connect("db", None, None);              // 全默认
          connect("db", Some(5432), None);        // @note 必须显式写 None 占位
          connect("db", Some(5432), Some(true));
      }

      // @note 路径二（可选参数多时）：Builder
      //   let c = Connection::builder().host("db").tls(true).build();
      //
      // @note! 不要用「传 0 表示不设置」凑合：那会让「端口设为 0」
      //        和「没设置端口」无法区分，Option 就是为消灭这类歧义而存在的。
    body: |
      Rust **没有默认参数**，也没有函数重载。可选性由类型系统表达，有两条路径：

      - **`Option<T>`**：可选参数少、逻辑简单时。调用方必须显式写 `None` 或 `Some(v)`
        —— 没有"省略"这回事。
      - **Builder**：可选参数多时。`Connection::builder().host("db").tls(true).build()`。

      与 JS 的 `undefined` 相比，`Option<T>` 的关键差别是它**是类型的一部分**：
      编译器强制你在使用前处理 `None` 分支。这正是"迁过来之后 bug 变少、
      但写起来更啰嗦"的主要来源。
  - featureId: js2rust/variadic
    equivalence: absent
    code: |
      // 正道：收一个切片
      fn sum(nums: &[i32]) -> i32 {
          nums.iter().sum()
      }

      fn demo() {
          sum(&[1, 2, 3]);                    // @note 调用处必须包成切片
          let picked = vec![1, 2, 3];
          sum(&picked);                       // 已有集合也可以直接借

          // @note! 下面这些在 Rust 里都不存在（对比 JS 的 sum(1, 2, 3) / sum(...arr)）：
          //   sum(1, 2, 3);
          //   sum(...picked);
      }

      // @note 宏确实能变参，但那是另一套机制：
      //   println!("{} {}", 1, "a");   // 参数类型都可以不同
      //   写成普通函数就做不到了。
    body: |
      Rust **不支持可变参数函数**（没有 `fn f(args: ...)` 这种写法）。

      标准替代是**接收切片**：`fn sum(nums: &[i32]) -> i32`，调用处写 `sum(&[1, 2, 3])`。
      数组字面量或 `vec![]` 在调用处包一层即可。

      真正支持变参的只有宏（`println!` 那种），但宏是编译期展开的另一套机制，
      不是普通函数的能力。

      如果参数是**不同类型**（JS 里 `console.log(a, b, c)` 那种模式），
      Rust 没有直接对应物，只能用枚举或宏 —— 这是迁移时最需要重新设计的一处。
  - featureId: js2rust/exercise
    equivalence: divergent
    code: |
      // 参考实现：三种用途，三种签名

      // 用途 a —— 只读看一眼，调用方之后还要用原来的值
      fn normalize_read(name: &str) -> String {
          // @note 参数用 &str 而不是 &String：&str 能同时接住 String 与字面量，
          //       这是 Rust API 的惯用选择（对应 JS 里"传什么都行"的宽松）
          name.trim().to_lowercase()
      }

      // 用途 b —— 拿走所有权，调用方不再需要
      fn normalize_owned(name: String) -> String {
          name.trim().to_lowercase()
      }

      // 用途 c —— 就地修改，不产生新分配
      fn normalize_in_place(name: &mut String) {
          // @note! 这里体现 JS 里没有的约束：&mut 期间**独占**这个值
          *name = name.trim().to_lowercase();
      }

      fn demo() {
          let a = String::from("  Ada  ");
          let a1 = normalize_read(&a);
          println!("{} {}", a, a1);          // @note a 仍然可用

          let b = String::from("  Ada  ");
          let b1 = normalize_owned(b);
          println!("{}", b1);
          // println!("{}", b);              // @note! 编译错误：b 已被移动

          let mut c = String::from("  Ada  ");
          normalize_in_place(&mut c);
          println!("{}", c);                 // @note 原地改完了
      }

      // @note 三种签名没有绝对优劣，只有适用场景：
      //       · 用途 a 用 normalize_owned 会白白丢掉调用方的值
      //       · 用途 b 用 normalize_read 会多一次拷贝
      //       · 用途 c 用 normalize_owned 会让调用方拿不到结果（返回值被丢弃）
