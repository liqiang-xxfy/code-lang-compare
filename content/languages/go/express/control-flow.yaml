# go —— express / control-flow
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: control-flow` 的那批。
#
# Go 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Go 与那个基准两门语言（R25）。

review:
  state: draft

boxes:
  conditionals:
    code: |
      if score >= 60 {
        fmt.Println("及格")
      }
      // @note! Go 没有三元运算符 —— 只有 if 语句

      if v, err := load(); err == nil {   // @note 初始化语句 + 条件，v 与 err 只在这个 if 内可见
        fmt.Println(v)
      }

      if err := run(); err != nil {
        return err                         // @note Go 里 if 最常见的形态就是这一条
      }
    vs:
      javascript: |
        Go **没有三元运算符**，JavaScript 的 `cond ? a : b` 到了 Go 只能写成
        完整的 `if` / `else` 语句。条件上两边反而一致：都不做真值转换，
        JavaScript 的 `if (1)` 虽然合法但那是隐式转换，Go 直接编译不过。
        Go 独有的是 `if` 可以带一条初始化语句，把「先算再判」压进一行，
        而且那些变量出了 if 就不存在 —— JavaScript 里只能提前声明，作用域更大。
      python: |
        Go **没有三元运算符**，Python 的条件表达式 `a if cond else b`
        到了 Go 要写成完整的 if 语句。python 的 `if` 是真值判断
        （空列表、0、"" 都算假），Go 要求条件必须是 `bool`，
        想判空得写 `len(xs) > 0`。Go 的 `if` 还能带初始化语句，
        这种「判断与取值绑在一起」的写法在 Python 里没有对应物。
      java: |
        Java 有 `?:` 三元运算符，Go 没有 —— 这是从 Java 过来最先察觉的缺失。
        Go 多出的是 `if` 前的初始化语句（Java 里要写在外面，变量作用域更大）。
        条件类型两边一致，都必须是布尔。另外 Go 把「先执行、再看错误」
        做成了惯例写法 `if err := f(); err != nil`，
        这在 Java 里通常表现为 try/catch，形态差别很大。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  loops:
    code: |
      for i := 0; i < 3; i++ { }      // @note C 式三段 —— for 是唯一的循环关键字

      n := 0
      for n < 3 { n++ }               // @note 只留条件，就相当于 while

      for {                           // @note 什么都不写 = 无限循环
        break
      }

      for i, v := range xs { }        // @note range 遍历切片：下标 + 值
      for k, v := range m { }         // @note 遍历映射：键 + 值
      for _, v := range xs { }        // @note 不要下标就写 _

      outer:
      for i := 0; i < 3; i++ {        // @note 标签 + break，直接跳出外层
        for j := 0; j < 3; j++ {
          if j == 2 { continue outer }
        }
      }
    vs:
      javascript: |
        Go 把 `while` 与 `for` 合并成了一个关键字：`for n < 3` 就是 while，
        `for` 什么都不写就是无限循环 —— JavaScript 里对应 `while` 与 `while(true)`。
        `range` 相当于 `for…of`（遍历值）与 `for…in`（遍历键）的合体，
        切片给下标加值、映射给键加值，不要的那个用 `_` 丢掉。
        标签跳出两边都有对应，但 Go 的标签写法更常见。
      python: |
        Go 保留了 C 式三段 `for`，Python 只有 `for x in 可迭代对象` ——
        从 Python 过来最需要改的习惯就是「按下标循环」：
        Go 里宁可 `for i, v := range xs` 也不写三段式。
        Go 的 `for n < 3` 对应 Python 的 `while n < 3`，
        `for {}` 对应 `while True`。标签跳出两边都有，语法也接近。
      java: |
        两边的 C 式三段 `for`、`while`、带标签的 `break` / `continue` 都直接对应，
        迁移成本最低的就是这一节。差别在遍历集合：Java 用
        `for (String s : list)`，Go 用 `for i, s := range list`，
        而且 Go 的 `range` 一个关键字同时覆盖切片、映射、字符串与通道；
        Java 想遍历 Map 得先拿 `entrySet()`。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  iteration-protocol:
    code: |
      // Go 没有 Iterator 接口 —— range 是语言内建，只认这几种类型：
      // 数组、切片、映射、字符串、通道，以及（1.23 起）特定签名的函数

      func Countdown(n int) iter.Seq[int] {   // @note 1.23 的 range-over-func
        return func(yield func(int) bool) {
          for i := n; i > 0; i-- {
            if !yield(i) { return }           // @note yield 返回 false = 调用方 break 了
          }
        }
      }

      for v := range Countdown(3) {           // @note 把这种函数当迭代源
        fmt.Println(v)
      }
    vs:
      javascript: |
        JavaScript 的迭代协议是运行时的：对象挂上 `Symbol.iterator` 就能被
        `for…of` 遍历，任何对象都能自定义。Go **没有可实现的迭代协议** ——
        `range` 只认语言内建的几种类型，自定义类型想被遍历，
        只能返回一个切片，或者（Go 1.23 起）提供一个接收 `yield` 回调的函数。
        两边都能做到，但 Go 的写法是「把循环体交给被调方」，
        而不是「让对象能吐出下一个值」。
      python: |
        Python 靠 `__iter__` / `__next__` 让任意对象可迭代；Go 没有这样的钩子，
        `range` 只支持内建的几种类型。自定义类型要可迭代，
        Go 的选项是返回切片，或提供一个「接收 yield 回调」的函数让 `range` 调用 ——
        控制流方向与 Python 相反：Python 是对象被问「下一个是什么」，
        Go 是把循环体推进去执行。
      java: |
        Java 的 `Iterable` 是接口，任何类实现它就能放进 for-each；
        Go 的 `range` 是编译器内建能力，不认接口，只认数组、切片、映射、
        字符串与通道。所以「让自定义集合能被 for-each」这件事，
        Java 有标准答案，Go 没有 —— 结果是 Go 代码里到处返回切片，
        而不是返回一个可以惰性拉取的迭代器。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  switch-and-match:
    code: |
      switch code {
      case 200:
        fmt.Println("OK")
      case 301, 302:                 // @note 一个分支多个值
        fmt.Println("重定向")
      default:
        fmt.Println("未知")
      }
      // @note! 每个 case 结束自动跳出 —— 不需要 break，也不会意外穿透

      switch {                        // @note 不带表达式，就当成 if-else 链用
      case n < 0:
        fmt.Println("负")
      case n == 0:
        fmt.Println("零")
      }

      switch v := x.(type) {          // @note 类型开关：按接口的动态类型分支
      case string:
        fmt.Println("字符串", v)
      case int:
        fmt.Println("整数", v)
      }
    vs:
      javascript: |
        Go 的 `switch` **不会穿透** —— 每个 case 结束自动跳出，不需要 `break`；
        JavaScript 忘写 `break` 会掉进下一个分支，是最经典的错误之一，
        在 Go 里根本写不出来。Go 还能省掉表达式把它当 if-else 链用，
        JavaScript 必须写 `switch (true)` 才能勉强达到类似效果。
        两边都不做穷尽检查 —— case 允许不写全，`default` 也是可选的。
      python: |
        Python 3.10 的 `match` 与 Go 的 `switch` 都能做分支匹配，
        但 Python 支持解构与模式（`case [x, y]`），Go 的 case 只能是表达式。
        Go 独有的是**类型开关** `switch v := x.(type)` ——
        按接口里装的具体类型分支，Python 里对应的是 `isinstance` 链，
        没有专门语法。两边都不穿透、都不做穷尽检查。
      java: |
        Go 的 `switch`（不穿透、可省表达式）与 Java 传统 `switch`（穿透、
        必须 break）差别明显，但 Java 14 起的箭头形式 `case 200 ->` 已经
        不穿透了，两边在这点上正在靠拢。Go 不穿透且能当 if-else 链用；
        Java 的 `switch` 表达式也要求穷尽。最接近的一处是类型判断：
        Java 的 `instanceof` 模式匹配与 Go 的类型开关服务同一个目的，
        只是 Go 把它做成了 switch 的一个形态。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
