id: concepts-python/01-types
topicId: concepts-python
title: 类型与值
order: 1
summary: 语言的地基 —— 类型什么时候检查、数字怎么存、空值有几个、赋值到底传了什么
features:
  - id: concepts-python/type-system
    title: 类型系统
    kind: concept
    summary: 动态 + 强类型：类型属于值，但比较与运算基本不做隐式转换

  - id: concepts-python/numeric-type
    title: 数值类型
    kind: concept
    summary: int 任意精度、不会溢出；除法是真除法，整除用另一个运算符

  - id: concepts-python/null-value
    title: 空值
    kind: concept
    summary: 只有一个 None，任何值都可能是它；判空统一写 is None

  - id: concepts-python/value-semantics
    title: 值语义与引用语义
    kind: concept
    summary: 一切值都是引用，「这个类型可变吗」才是决定共享与否的判据
