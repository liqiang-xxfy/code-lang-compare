snippets:
  - featureId: concepts-python/collections
    equivalence: divergent
    code: |
      const o = { 1: "a" };
      o[1] === o["1"]      // @note! true —— 对象字面量的数字键被转成字符串
      const m = new Map(); // @note 任意键映射要显式用 Map；JS 没有 tuple
    body: |
      **Array / Object / Map / Set** —— 对象字面量只支持字符串键，
      真正的任意键映射要显式用 `Map`；用对象表达映射时得先判断键的类型，
      否则会静默串键（`1` 与 `"1"` 撞在一起）。

      对象字面量的字符串键同样有插入顺序，但没有 `tuple` 那种不可变有序容器，
      「这个序列不该被改」只能靠约定。`Array(3).fill([0, 0, 0])` 会共享同一个
      内层数组，与 Python 的 `[[0] * 3] * 3` 是同一个坑。

  - featureId: concepts-python/immutable-data
    equivalence: divergent
    code: |
      const o = Object.freeze({ inner: { n: 1 } });
      o.inner.n = 2        // @note! 2 —— freeze 是浅的，嵌套照样能改
      // @note 没有不可变类型，也就不能用「不可变」当字典键
    body: |
      **Object.freeze（浅）** —— 没有「不可变类型」这个概念。冻结是运行时行为、
      且是浅的（嵌套对象照样能改），不影响任何类型签名；复制用 `structuredClone`
      （深）或展开运算符（浅）。

      实质损失是「用类型表达不可变」的能力：没有 tuple 那种「改不了、还能当键」的
      类型，要用元组当键只能自己序列化成字符串；想共享一份配置得靠 `freeze` 加纪律，
      犯规时没有任何机制提醒。

  - featureId: concepts-python/string-format
    equivalence: divergent
    code: |
      const n = 3.14159;
      n.toFixed(2)                 // @note "3.14" —— 格式化靠方法调用，没有格式串
      (1234567).toLocaleString()   // @note "1,234,567"，对齐要 padStart
    body: |
      **模板字符串 + toFixed** —— 模板字符串只负责求值插入，**格式化全靠方法**：
      小数用 `toFixed`、千分位用 `toLocaleString`、对齐用 `padStart`、日期用
      `Intl.DateTimeFormat`。没有语言级的 printf 风格格式串（`console.log` 里的
      `%s` 只作用于日志，不是字符串 API），知道每个需求对应哪个方法能省掉大量
      手写补零与对齐的代码。

  - featureId: concepts-python/regex
    equivalence: divergent
    code: |
      "a1".match(/\d/)     // @note! ["1"] —— 任意位置匹配，没有「只匹配开头」
      /(?<num>\d+)/.exec("12")?.groups?.num   // @note 命名分组是 (?<name>...)
    body: |
      **/pattern/flags 字面量** —— `str.match(re)` 与 `re.test(str)` 都是**任意位置**
      匹配，没有「只匹配开头」的同名函数（要自己加 `^` 锚点），Python 的 `re.match`
      直觉在这里会反向失效。命名分组是 `(?<name>...)`。

      也没有原始字符串这回事：正则字面量 `/\d+/` 本来就不经过字符串转义，不需要前缀。

  - featureId: concepts-python/serialization
    equivalence: divergent
    code: |
      JSON.stringify({ f: () => 1, u: undefined, n: 1 })   // @note! '{"n":1}' —— 静默丢弃
      // @note 不报错也不提示，字段「莫名消失」时就该想到这里
    body: |
      **JSON.stringify / parse** —— 语言内置、宽松：函数、`undefined`、Symbol 被
      **静默丢弃**，只有循环引用才抛错；`JSON.parse` 拿到什么是什么，也不验证形状。
      先觉得「宽松真好」，然后在某个「字段莫名消失」的 bug 上花掉半天，是常见的路径。

      也没有 `default=` 那种钩子，自定义类型要自己先转成普通对象。

  - featureId: concepts-python/date-time
    equivalence: divergent
    code: |
      const d = new Date(2026, 0, 5);   // @note! 月份从 0 起 —— 这里其实是 1 月 5 日
      d.setMonth(1);                    // @note 就地修改 d 本身，与 datetime 的不可变相反
    body: |
      **Date（可变、月从 0 起）** —— 建议改用 Temporal 或 dayjs。
      月份基准差 1 与「就地修改」叠在一起，是这段迁移最容易踩的一格：
      按 Python 直觉写 `new Date(2026, 1, 5)` 以为是一月五号，实际是二月五号；
      习惯 `d = d.replace(...)` 之后写 `d.setMonth(1)`，会**就地改掉 d**，
      别处还引用着同一个 `Date` 时就会看到意外变化。
