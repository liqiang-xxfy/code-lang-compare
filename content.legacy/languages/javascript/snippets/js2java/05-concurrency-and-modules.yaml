  - featureId: js2java/concurrency-exercise
    equivalence: identical
    code: |
      const cache = new Map();

      async function compute(k) { return k * 2; }

      async function get(k) {
        if (!cache.has(k)) {                       // @note "检查后写入"这个复合动作
          cache.set(k, await compute(k));          // @note 有 await，这里真的会被切走
        }
        return cache.get(k);
      }

      await Promise.all([get(1), get(1)]);
      // @note! 在现代 JS 里这不算是 bug —— 最坏是 compute(1) 被算两次，
      // 但 cache 不会损坏（单线程，没有并发写）
      // @note! 到了 Java 里同一段代码会变成"两个线程同时写同一个键"，
      // 而且 HashMap 并发写可能死循环 —— 性质完全不同
