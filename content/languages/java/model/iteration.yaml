# java —— model / iteration
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: iteration` 的那批。
# 这一组以 Java 为基准时展示在「流与迭代」章（见 catalog/model/java.yaml）。

review:
  state: draft

boxes:
  generator-yield:
    code: |
      // @note! Java 没有生成器语法 —— 这里没有对等物，只有三种替代

      // 1. 手写 Iterator：状态自己维护
      class Countdown implements Iterator<Integer> {
        private int n;
        Countdown(int n) { this.n = n; }
        public boolean hasNext() { return n > 0; }
        public Integer next() { return n--; }
      }

      // 2. Stream.generate / Stream.iterate：造无限流
      Stream.iterate(3, x -> x > 0, x -> x - 1).toList();   // [3, 2, 1]

      // 3. 虚拟线程 + 队列（生产者-消费者）—— 重得多，只在真并发时值得
    baseline: |
      **没有 `yield` 这种语法**。惰性序列有三条路：手写 `Iterator`（自己维护状态，
      最常见）、`Stream.iterate` / `generate` 造无限流、或用虚拟线程加队列做
      生产者（只在真需要并发时才值得）。前两条都能表达「惰性」，但都不能
      「暂停在中间、之后从外部继续」，也没有双向通信。
    vs:
      javascript: |
        JavaScript 的 `function*` 一行就能写出带状态的惰性序列；Java 要么手写
        Iterator 类、要么用 Stream 工厂方法。差别在表达同样一件事的代码量。
      python: |
        Python 的 `yield` 一行就能写出带状态的惰性序列，Java 完全没有对应语法。
        写「会暂停、可恢复的序列」时，这边要么手写 Iterator 类、
        要么退到 Stream 工厂方法。
    equivalence:
      javascript: divergent
      python: divergent

  comprehension:
    code: |
      // @note! 没有推导式语法 —— 用 Stream 管道加 Collectors
      xs.stream().map(x -> x * 2).toList();
      xs.stream().filter(x -> x % 2 == 0).toList();

      // 造映射：Collectors.toMap
      users.stream().collect(Collectors.toMap(User::id, u -> u));

      // 造集合
      xs.stream().map(User::kind).collect(Collectors.toSet());

      // 分组
      users.stream().collect(Collectors.groupingBy(User::city));
    baseline: |
      用 **Stream 管道 + `Collectors`** 表达「从一批数据造出另一个容器」：
      `map` / `filter` / `flatMap` 是中间操作，`toList` / `toMap` / `toSet` /
      `groupingBy` 是终止操作。表达力与别的语言的推导式相当，
      但它是方法调用而不是语法，而且比手写循环长。
    vs:
      javascript: |
        两边都是方法链，写法几乎逐字对应（`map` / `filter`）。
        差别在语义：Java 的 Stream 是惰性的、终止操作才真正跑；
        JavaScript 的数组方法每一步都立刻产生中间数组。
      python: |
        Python 一个推导式表达式就够，Java 要 `stream()` 开头、`collect(...)`
        收尾。表达力相当，差距在写法长度 —— 两边一个偏语法、一个偏 API。
    equivalence:
      javascript: analogous
      python: divergent

  lazy-evaluation:
    code: |
      // @note Stream 是惰性的：中间操作只记账，终止操作才跑
      var s = xs.stream().filter(this::heavy).map(this::expensive);
      // 到这里一行都没执行
      s.toList();                  // @note 现在才跑

      Stream.iterate(0, i -> i + 1).limit(3).toList();   // @note 无限流取前三个

      // @note Optiona 也是惰性的：orElse 一定会求值，orElseGet 才懒
      opt.orElseGet(() -> compute());    // @note 只在为空时才调 compute
      opt.orElse(compute());             // @note! 无论空不空都会先算 compute

      // @note! Stream 只能消费一次 —— 用完再用抛 IllegalStateException
    baseline: |
      **Stream 天生惰性**：`filter` / `map` 这些中间操作只是记账，
      直到终止操作（`toList` / `forEach` / `count`）才真正遍历一遍 ——
      而且是「一个元素走完全部步骤，再走下一个」。所以无限流加 `limit` 能跑。
      要记住 Stream **只能消费一次**，用完再用抛异常。
      `Optional` 也是同理：`orElse` 的参数一定会求值，`orElseGet` 才惰性。
    vs:
      javascript: |
        JavaScript 的数组方法每一步都真的跑完并产生中间数组 ——
        同样是 `map(...).filter(...)`，「什么时候真正执行」完全不同。
        Java 在这里更省，但也多一个「Stream 只能用一次」的约束。
      python: |
        Python 的生成器表达式也是惰性的，思路一致。差别在形态：
        Python 的惰性对象是可手动推进的生成器，Java 的 Stream 是一条
        不能暂停、只能跑完的管道，组合算子更现成但更封闭。
    equivalence:
      javascript: divergent
      python: analogous

  destructuring:
    code: |
      // @note! 没有解构赋值 —— 只能逐个取
      Point p = new Point(3, 4);
      int px = p.x();
      int py = p.y();

      // 模式匹配能拆，但那是在 instanceof / switch 里
      if (obj instanceof Point(int x, int y)) {
        int sum = x + y;             // @note x / y 在这里可见
      }

      switch (shape) {
        case Point(int x, int y) -> x + y;
        case Circle(double r)    -> (int) (Math.PI * r * r);
        default -> 0;
      }

      // @note 交换仍然要写临时变量
      int t = a; a = b; b = t;
    baseline: |
      **没有 `a, b = b, a` 这种解构赋值**。record 的**模式匹配**能在
      `instanceof` 与 `switch` 里把字段拆出来绑定成局部变量，
      但它的作用域只在那一个分支里，也不是「同时给几个已存在的变量赋值」。
      所以交换两个变量仍然要写临时变量 —— 这是从别的语言换过来时最不习惯的一处。
    vs:
      javascript: |
        JavaScript 的数组与对象都能解构，函数参数位置也行；Java 只有在
        `instanceof` / `switch` 的模式里才能拆，而且不能给已存在的变量赋值。
        交换、多返回值拆包这类日常动作在这里都要多写几行。
      python: |
        Python 的元组解包同样能直接给多个变量赋值、能交换；Java 的模式匹配
        只是一次性的绑定，不能赋值给已有变量。两边的能力差距在
        「解构能不能用在赋值语句左边」这一条上。
    equivalence:
      javascript: divergent
      python: divergent
