# 迁移学习路线 —— JavaScript → Java
# 骨架期样板：先列三个阶段，后续按同形态细化

- id: js2java-1-mental-model
  order: 1
  title: 先建立心智模型，不要背语法
  durationHint: 2-3 小时
  todo:
    - 通读「心智模型」板块，把两边在这些根本差异上的映射建起来
    - 只回答四个问题（答案在「心智模型」板块里）：类型系统、并发模型、错误处理、值语义 vs 引用语义
    - 明确写下「哪些 JS 直觉必须丢掉」——隐式类型转换、`==` 的宽松语义、对象即字典
  acceptance:
    - 能说出 Java 的 `==` 与 `equals` 的分工，并知道字符串该用哪个
    - 知道 Java 是编译型语言，很多错误在编辑器里就会亮红
  resources:
    - label: Java 官方教程（Oracle）
      url: https://dev.java/learn/

- id: js2java-2-basics
  order: 2
  title: 基础语法逐条对照
  durationHint: 3-5 天
  todo:
    - 按基础语法板块的章节逐格对比，每看一格手写一遍两边的代码（不要复制）
    - 把踩到的坑记进本方向的迁移陷阱清单并打上自己的严重度
    - 练习把一段 JS 的 `Array.map/filter/reduce` 链改写成 Java 的 Stream
  acceptance:
    - 能独立写出变量、集合、控制流、方法定义，无编译错误
    - 能解释 `int` 与 `Integer` 的区别，以及自动装箱在什么时候会咬人

- id: js2java-3-tooling
  order: 3
  title: 接上工具链与工程习惯
  durationHint: 1 周
  todo:
    - 用 Maven 或 Gradle 建一个空项目，跑通「写代码 → 编译 → 测试 → 打包」
    - 把 npm 的心智映射到 Maven Central 与依赖声明
    - 配好 IDE 的跳转与重构，体会编译期检查带来的反馈速度
  acceptance:
    - 能独立新建一个项目并让它产出可执行 jar
    - 能读懂 javac 的类型不匹配报错并定位到具体位置
  resources:
    - label: Maven 官方入门
      url: https://maven.apache.org/guides/getting-started/
