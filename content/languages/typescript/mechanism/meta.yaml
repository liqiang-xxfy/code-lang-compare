# typescript —— mechanism / meta
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: meta` 的那批：
# reflection / decorator-annotation / dynamic-eval / proxy-interception。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）—— 包括**缩写**，
# 其他语言的简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：这一组的枢纽是**「编译期知道的那一层，运行期一点不剩」**。
# 反射、装饰器、代理三格都在讲同一件事的两面：运行时的内省工具（`Reflect`、
# `Proxy`、`constructor.name`）齐全，而静态类型、接口、类型实参全部消失。
# 装饰器那一格另有一个反直觉的事实：**它到今天仍不是 JavaScript 的标准特性**，
# 只有 TypeScript（和 Babel）实现了它 —— 所以「超集」在这里反而多了东西。

review:
  state: draft

boxes:
  reflection:
    code: |
      class User {
        constructor(readonly id: number, readonly name: string) {}
      }

      const u = new User(1, "Ada");
      u.constructor.name;                             // @note "User"
      u instanceof User;                              // @note true
      Object.keys(u);                                 // @note 值上有什么字段，看得见
      Object.getPrototypeOf(u) === User.prototype;    // @note true

      Reflect.has(u, "name");                         // @note Reflect 与 Proxy 的 trap 一一对应
      Object.hasOwn(u, "name");                       // @note 没有 Reflect.hasOwn 这个方法

      // 但**声明**的那一层拿不回来：接口、类型别名、类型实参编译后都不存在
      interface Shape { area(): number }
      // const s = {} as Shape; s.area();             // @note! 编译通过，运行时才炸
    vs:
      javascript: |
        运行时这一层两边是**同一套**：`constructor.name`、`instanceof`、
        `Object.getPrototypeOf`、`Object.keys` 都能用，`Reflect` 有同样的方法，
        TypeScript 一点没往上加。它加的那一层 —— 静态类型 ——
        恰好正是反射拿不到的那层。
        有一处是这里独有的坑：`as` 能让你把一个不存在的形状断言出来，
        编译器此后按你说的办。这在 JavaScript 里写不出来，
        因为没有「向编译器保证」这个动作。
      python: |
        内省手段两边都够用，但**标注的存活期**完全相反。
        Python 把标注留在对象上，运行期真能读到（函数和类都有 `__annotations__`，
        还能解出字符串形式的注解），所以那边的框架能靠它做校验、生成文档；
        这里的标注编译后一点不剩，接口和类型别名也不存在。
        于是同一件事在两边要用完全不同的做法：那边读标注，
        这边只能把需要的信息**另存成一个运行期存在的值**。
      java: |
        Java 的反射比这里强得多：它能读到**声明**上有什么 ——
        类有哪些成员、参数是什么类型、注解写了什么 —— 因为类文件里保留了这些；
        这里反射只能问「这个值上现在有什么」，声明那一层是空的。
        另一处是访问控制：Java 的反射能突破私有访问，这里没有私有可突破，
        也没有「声明」可查。两边都慢，两边也都建议把结果缓存起来。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  decorator-annotation:
    code: |
      // 标准装饰器拿到的是（被装饰的值, 上下文）
      function tag<T>(value: T, context: ClassMethodDecoratorContext): T {
        console.info(`装饰 ${String(context.name)}`);   // @note 定义时执行一次
        return value;                                   // @note 返回原值，不做包装
      }

      class Service {
        @tag
        run(): string { return "done"; }                // @note 方法、字段、类、访问器都能标
      }

      // @note! 装饰器到今天仍是**提案**（TC39 2.7 阶段），不是 JavaScript 标准的一部分
      // @note! 参数装饰器只存在于旧写法里 —— 那要开 experimentalDecorators
    vs:
      javascript: |
        这一格是少数几处**这里比 JavaScript 多一个语法**的地方：
        装饰器至今没有进入标准，只有 TypeScript 与 Babel 实现了它，
        所以这段代码在 JavaScript 里跑不了 —— 必须先经过编译。
        另一处差别在语义：这里的装饰器由编译器改写并在**定义时执行一次**，
        装饰器拿到的是一个带名字、种类、是否静态的**上下文对象**，
        还能注册初始化钩子；JavaScript 里没有对应物可比。
      python: |
        两边都是「给声明挂上额外语义」，但机制差得远。
        Python 的装饰器就是普通的可调用对象在定义时被调用一次 ——
        没有任何编译器参与，也拿不到「这是个方法」之类的上下文；
        这里的装饰器是编译器特性，会收到一个描述被装饰对象的上下文，
        还能区分方法、字段、访问器。
        覆盖面也不同：Python 什么都能装饰，这里的标准写法标不了**参数**，
        参数装饰器留在旧的那套开关后面。
      java: |
        Java 的注解与这里的装饰器**不是一回事**，这是最容易混淆的一格。
        注解只是元数据，本身不做任何事 —— 行为要由编译期的注解处理器
        或运行期的读取者提供；这里的装饰器**本身就是行为**，
        直接包装或替换被装饰的东西。
        另一处：Java 的注解能标在参数、局部变量上，运行时还能被反射读到；
        这里的标准装饰器标不了参数，也没有运行时元数据这一层。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent

  dynamic-eval:
    code: |
      const expr = "1 + 1";
      const r: number = eval(expr);   // @note! 返回值是 any —— 类型检查在这里失效
      console.info(r.toFixed(2));     // @note 编译期不核对；expr 换成非数字就运行时炸

      // 直接调用看得见局部作用域；间接调用在全局作用域执行
      const indirect = (0, eval)("typeof globalThis");

      // 与 eval 同源的另一个入口：只在全局作用域求值
      const add = new Function("a", "b", "return a + b");
      console.info((add as (a: number, b: number) => number)(1, 2));
    vs:
      javascript: |
        同一个 `eval`、同一套规则，两边逐条一致 —— 连注意事项都一样
        （它是注入的入口，严格的内容安全策略默认会挡掉它）。
        对这里来说多一层代价：`eval` 的返回值类型是 `any`，
        于是这段代码**恰好落在类型检查失效的地方** ——
        一门语言最有价值的能力，在它最危险的语法上关掉了。
        要拿回检查，只能自己在外层补断言或做运行时校验。
      python: |
        两边都有运行时求值，也都有同样的告诫。差别在**能不能限制作用域**：
        Python 的求值入口接受可选的名字空间，可以只给一个空环境就跑；
        这里没有这个参数 —— 直接调用看得见局部作用域，间接调用落在全局，
        都改不了。
        另一处是入口的分工：Python 把「求一个表达式的值」与「执行一段语句」
        分成两个函数，这里只有 `eval` 一个（加上构造函数的那个变体），
        表达式与语句混在一起。
      java: |
        Java 的语言层**没有**运行时求值 —— 表达式形式是封闭的一整套，
        没有「把字符串当代码跑」这个入口，所以这类写法在那边要么不合法，
        要么得引入一个脚本引擎（那个引擎在较新版本里已被移除，
        剩下的只是接口）。
        两边的取舍其实一致：动态求值换来灵活性，代价是性能、可调试性，
        以及一个几乎必然存在的注入面 —— 一边把路关了，一边留着让人小心走。
    equivalence:
      javascript: identical
      python: analogous
      java: divergent

  proxy-interception:
    code: |
      const raw = { name: "Ada", age: 36 };

      const p = new Proxy(raw, {
        get(t, key) {                                 // @note trap 与 Reflect 上的方法一一对应
          console.info(`读 ${String(key)}`);
          return Reflect.get(t, key);
        },
        set(t, key, v) { return Reflect.set(t, key, v); },
      });

      console.info(p.name);     // @note 日志照打，值照常拿到

      // @note! p 的静态类型就是 typeof raw —— 编译期看不出它是代理；
      // @note! 想把这个事实说给调用方，得自己写一个更窄的类型
    vs:
      javascript: |
        同一个内建、同一套 trap，两边逐条一致；这里加的只是处理函数的类型。
        值得记住的是**类型这一层帮不上忙**：代理的静态类型就是被代理对象的类型，
        「它其实是个代理、读属性会打日志」这件事完全不在类型里 ——
        也就是说，代理对调用方是透明的，无论是好是坏。
        另一处小的编译期差别：删一个必需属性会被编译器拦下（要求它可选），
        这在 JavaScript 里同样是运行期才说话。
      python: |
        两边都能在属性访问上插一层，插的位置不同。Python 的钩子写在**类里**
        （属性钩子、描述符、元类），所以它能拦的是「这个类自己的属性访问」；
        要包装一个已经有实例的对象，得另写一个包装类。
        这里的代理从**外面**套住任意一个已有对象，不碰它的类 ——
        这是最实用的一处差别：拿不到源码的对象也能拦。
        代价是类型层看不见这层壳，调用方以为手里还是原来那个对象。
      java: |
        两边的代理能拦的范围不同。Java 的动态代理**只能代理接口** ——
        要代理一个类得靠额外的字节码库；这里的代理能套住任何对象，
        包括临时写出来的字面量。
        另一处是粒度：Java 拦的是接口方法调用，这里连读属性、写属性、
        判断键是否存在、删除都能拦。
        相同的是两边都建议只在对的地方用：多一层看不见的对象，
        调试和性能都要多留一份心。
    equivalence:
      javascript: identical
      python: analogous
      java: analogous
