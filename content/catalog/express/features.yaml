# feature 池 —— 基础表达板块的**知识点清单**，与基准无关，全站唯一。
#
# 这一层回答「这个板块要对比哪些点」，不回答「某个基准怎么把它们讲给读者听」。
# 各基准的章节分组见同目录下的 javascript.yaml / python.yaml —— 章节名、分组、
# 顺序、取舍都可以不同，而**这里的一个 feature 永远只有一份内容**。
#
# `group` 是**存放组**，即内容文件名：content/languages/<语言>/express/<group>.yaml。
# 它与展示章解耦 —— 这正是「每基准一份章节分类」不会让内容翻倍的原因。
#
# 池里的**顺序不表达任何东西**（展示顺序全在章节分组里），这里只求好读。

section: express
title: 基础表达

features:
  # ── bindings 变量与绑定 ──────────────────────────────────────────
  - id: declaration
    group: bindings
    title: 变量声明
    kind: syntax
    summary: 如何在语言里引入一个名字
    tags: [comparison]

  - id: mutability
    group: bindings
    title: 可变性与重新赋值
    kind: behavior
    summary: 名字能否改绑，值能否被修改
    tags: [comparison]

  - id: scope
    group: bindings
    title: 作用域
    kind: behavior
    summary: 一个名字在哪里可见，由什么决定
    tags: [comparison]

  - id: hoisting
    group: bindings
    title: 声明提升与暂时性死区
    kind: behavior
    summary: 声明语句执行前访问会发生什么

  - id: shadowing
    group: bindings
    title: 遮蔽
    kind: behavior
    summary: 内层同名的名字覆盖外层

  # ── values 类型与值 ─────────────────────────────────────────────
  - id: literals
    group: values
    title: 字面量与初始化
    kind: syntax
    summary: 各类值在源码里怎么写

  - id: type-inference
    group: values
    title: 类型推断与显式标注
    kind: syntax
    summary: 类型是写出来的，还是推出来的

  - id: null-and-undefined
    group: values
    title: 空值表示
    kind: syntax
    summary: 「没有值」用什么表达，有没有第二种空

  - id: type-conversion
    group: values
    title: 隐式与显式转换
    kind: behavior
    summary: 不同类型之间怎么互换，什么时候悄悄发生

  # ── operators 运算符与表达式 ────────────────────────────────────
  - id: arithmetic
    group: operators
    title: 算术与自增自减
    kind: syntax
    summary: 数值运算的写法与整数除法的行为

  - id: equality
    group: operators
    title: 相等与同一性
    kind: behavior
    summary: 两个值在什么条件下算相等

  - id: logical
    group: operators
    title: 逻辑运算与空值合并
    kind: syntax
    summary: 与或非的短路行为，以及缺省值怎么写

  - id: operator-overloading
    group: operators
    title: 运算符重载
    kind: concept
    summary: 能否为自定义类型定义运算符

  # ── control-flow 控制流 ─────────────────────────────────────────
  - id: conditionals
    group: control-flow
    title: 条件分支
    kind: syntax
    summary: if / else 的形态，以及什么值算「假」

  - id: loops
    group: control-flow
    title: 循环
    kind: syntax
    summary: 计数循环与条件循环的写法

  - id: iteration-protocol
    group: control-flow
    title: 迭代协议
    kind: behavior
    summary: 什么样的对象可以被遍历

  - id: switch-and-match
    group: control-flow
    title: 多路分支与模式匹配
    kind: syntax
    summary: 多分支选择，以及能否按结构匹配

  # ── functions 函数与参数 ────────────────────────────────────────
  - id: function-declaration
    group: functions
    title: 函数定义
    kind: syntax
    summary: 定义一个可调用的东西有几种写法

  - id: parameters
    group: functions
    title: 参数传递与默认值
    kind: syntax
    summary: 实参怎么交给形参，默认值何时求值

  - id: variadic
    group: functions
    title: 可变参数
    kind: syntax
    summary: 接受不定个数参数的写法

  - id: return-values
    group: functions
    title: 返回值与多返回值
    kind: syntax
    summary: 函数返回什么，能不能一次返回多个

  - id: closures
    group: functions
    title: 闭包
    kind: concept
    summary: 函数记住它定义处的外部名字

  # ── strings 字符串与容器 ────────────────────────────────────────
  - id: string-literals
    group: strings
    title: 字符串字面量与插值
    kind: syntax
    summary: 字符串怎么写，能不能内嵌表达式

  - id: string-common-ops
    group: strings
    title: 字符串的常用操作
    kind: syntax
    summary: 拼接、切分、查找、大小写

  - id: arrays
    group: strings
    title: 数组与列表
    kind: concept
    summary: 有序集合的形态与增删改查

  - id: maps
    group: strings
    title: 字典与映射
    kind: concept
    summary: 键值集合的形态与遍历顺序
