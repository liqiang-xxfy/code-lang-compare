# python —— mechanism / concurrency
#
# boxes 的 key 必须是 catalog/mechanism/features.yaml 里 `group: concurrency` 的那批。
# 这一组以 Python 为基准时展示在「GIL 与并发」章（见 catalog/mechanism/python.yaml）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-concurrency-v1
    generatedAt: '2026-10-03'

boxes:
  concurrency-unit:
    code: |
      import threading, multiprocessing, asyncio

      t = threading.Thread(target=work)      # @note 线程：能并发，但受 GIL 限制
      t.start(); t.join()

      p = multiprocessing.Process(target=work)   # @note 进程：真并行，各有各的内存
      p.start(); p.join()

      asyncio.run(main())                    # @note 协程：单线程内的并发，不并行

      # @note! GIL：同一时刻只有一个线程在执行字节码
      #        纯计算的活开线程不会变快，要开进程
      #        IO 等待时 GIL 会释放，所以 IO 密集用线程/协程有效
    baseline: |
      三种并发单元各有各的适用面：**线程**能并发但受 GIL 限制（纯计算不快、
      IO 等待有效）、**进程**真并行（各有各的内存，代价是通信要序列化）、
      **协程**单线程内并发（不并行，但切换开销最小）。
      「同一时刻只有一个线程跑字节码」是这门语言并发的第一句话 ——
      它决定了「开线程能不能提速」这个问题的答案取决于你在等 IO 还是在算。
    vs:
      javascript: |
        JavaScript 主线程连线程都没有，并行只有 Worker 一条路（且天然隔离）；
        Python 有线程但被 GIL 限制成「只有一个在跑字节码」。
        两边最终的结论相似：想要真并行都得开独立执行环境。
      java: |
        Java 的线程没有 GIL，多核上真并行、共享堆内存 —— 所以那边并发编程的
        核心是「怎么安全地共享」。Python 因为 GIL，第一步往往是
        「我到底该用线程、进程还是协程」。
    equivalence:
      javascript: divergent
      java: divergent

  shared-state:
    code: |
      counter = 0

      def inc():
          global counter
          for _ in range(100_000):
              counter += 1        # @note! 不是原子操作：读-加-写三步

      ts = [threading.Thread(target=inc) for _ in range(2)]
      [t.start() for t in ts]; [t.join() for t in ts]
      counter                        # @note! 通常小于 200000 —— 丢更新

      # @note GIL 只保证单条字节码原子，`counter += 1` 是好几条
      lock = threading.Lock()
      with lock:                     # @note 加锁之后才对
          counter += 1
    baseline: |
      线程**共享内存**，所以数据竞争是实打实的问题。要特别消除一个常见误解：
      **GIL 不等于线程安全** —— 它只保证单条字节码原子，而 `counter += 1`
      是「读-加-写」三步，中间会被切走。共享可变状态要么加锁，
      要么改用队列把数据传出去（`queue.Queue` 自己是线程安全的）。
    vs:
      javascript: |
        JavaScript 主线程只有一个执行流，`counter++` 天然不会被打断；
        要并行得进 Worker，而那又变回隔离模型（靠消息传数据）。
        Python 的线程是真的共享内存，所以必须处理竞争。
      java: |
        两边都有真线程与共享内存，都要面对可见性与原子性。差别在 Java 把这些
        写成了语言级的规则（`volatile` / `synchronized` / JMM），
        Python 只有 GIL 这条隐式约束加库里给的锁。
    equivalence:
      javascript: divergent
      java: analogous

  lock-mutex:
    code: |
      lock = threading.Lock()
      with lock:                     # @note 上下文管理器：离开自动释放
          counter += 1

      rlock = threading.RLock()      # @note 可重入：同一线程能再拿一次
      sem = threading.Semaphore(3)   # @note 信号量：最多三个同时进
      ev = threading.Event()         # @note 事件：等一个信号

      # @note! 忘了释放就死锁 —— 所以一律用 with
      # @note! 加锁顺序不一致会造成死锁（A 等 B、B 等 A）

      q = queue.Queue()              # @note 更省心的选择：队列自己带锁
    baseline: |
      库里有 `Lock` / `RLock` / `Semaphore` / `Event`，**一律用 `with` 语句**
      （离开自动释放，避免忘了解锁）。死锁的两个经典成因在这里同样成立：
      忘了释放、以及多个锁的获取顺序不一致。多数场景下
      `queue.Queue` 比手写锁更省心 —— 它内部已经处理好了同步。
    vs:
      javascript: |
        JavaScript 主线程根本没有临界区，所以没有锁；要「互斥」只能把异步操作
        串成一队。Python 的锁是真的会阻塞线程的互斥量。
      java: |
        Java 有语言级的 `synchronized` 与库级的 `ReentrantLock`（还支持超时、
        可中断、公平锁），Python 的锁偏基础。两边都要求「用 with / try-finally
        保证释放」，Java 的 `synchronized` 块连这个都省了。
    equivalence:
      javascript: divergent
      java: analogous

  channel:
    code: |
      import queue

      q = queue.Queue()              # @note 线程安全：不用自己加锁
      def producer():
          for i in range(3): q.put(i)
      def consumer():
          while True:
              item = q.get()         # @note 队列空时阻塞
              q.task_done()

      # @note! 线程之间还能直接共享变量（有锁的前提下），队列只是更省心的选择
      # @note 多进程之间要用 multiprocessing.Queue（传对象要能 pickle）

      pipe_parent, pipe_child = multiprocessing.Pipe()
    baseline: |
      `queue.Queue` 是线程间传数据的标准做法 —— **它自己带锁**，所以不用手写同步，
      这是「不要共享状态，改成传消息」这条建议最直接的落地。
      多进程之间要用 `multiprocessing.Queue` 或 `Pipe`，传的对象必须能序列化。
      与共享变量相比，队列把同步的负担从你身上移到了库里。
    vs:
      javascript: |
        JavaScript 的通道只在 Worker 之间（`MessageChannel`），传的是结构化克隆；
        Python 的线程队列是在**共享内存之上**搭出来的通信抽象 ——
        底下仍然是共享的，只是把锁藏起来了。
      java: |
        Java 的 `BlockingQueue` 与 `queue.Queue` 是同一个东西（阻塞队列、
        自己处理同步），两边的用法几乎可以逐行对照。差别在于 Java 还有
        「不使用队列、直接共享 + 加锁」这条同样常见的选择。
    equivalence:
      javascript: analogous
      java: analogous

  atomicity:
    code: |
      counter += 1                   # @note! 读 -> 加 -> 写，三步都可能被切走

      # 靠锁保证
      with lock: counter += 1

      # 或者用原子性的容器操作（队列 / deque 的部分操作是原子的）
      from collections import deque
      d = deque(); d.append(1)       # @note append / popleft 是原子的

      # @note! GIL 只让单条字节码原子 —— 别把它当成"线程安全"的保证
      # @note "看起来是一行" 的 `x += 1` / `d[k] = d.get(k,0)+1` 都不是原子的
    baseline: |
      **`counter += 1` 不是原子的** —— 它由「读、加、写」三条字节码组成，
      中间会被切走，所以两个线程各跑十万次通常得不到二十万。GIL 保证的只是
      单条字节码不会被打断，而复合操作不在此列。要原子要么加锁，
      要么用已经是原子的操作（`deque.append`、`queue.Queue` 的方法）。
    vs:
      javascript: |
        JavaScript 主线程没有别的执行流，`counter++` 天然原子 ——
        真正会被打断的是跨 `await` 的复合操作。两边「什么算一步」的边界不同：
        这里是字节码，那边是「到下一个 await 为止」。
      java: |
        Java 有 `AtomicInteger` / `volatile` / JMM 这套正式工具来定义原子性与
        可见性；Python 没有语言级的原子类型，只有 GIL 这条隐式约束加库里的锁。
        「看起来是一行不等于一步」这个坑两边都有。
    equivalence:
      javascript: divergent
      java: analogous
