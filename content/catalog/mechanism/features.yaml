# feature 池 —— 语言机制板块的**知识点清单**，与基准无关，全站唯一。
#
# 板块定位（docs/完整项目架构.md §2.4）：前三步是「读懂 / 改写」，这一板块是
# **敢动它** —— 换语言必须重学的机制集中在这里（类型系统、泛型、内存、并发、异步、元编程）。
#
# `group` 是**存放组**，即内容文件名：content/languages/<语言>/mechanism/<group>.yaml。
# 章节分组见同目录下的 javascript.yaml / python.yaml / java.yaml。

section: mechanism
title: 语言机制

features:
  # ── types 类型系统 ──────────────────────────────────────────────
  - id: static-vs-dynamic
    group: types
    title: 静态与动态类型
    kind: concept
    summary: 类型在什么时候被检查，错了什么时候发现

  - id: type-annotation
    group: types
    title: 类型标注与签名
    kind: syntax
    summary: 怎么写出类型，写完谁在检查

  - id: structural-nominal
    group: types
    title: 结构化与名义类型
    kind: concept
    summary: 类型相容看名字还是看形状

  - id: type-narrowing
    group: types
    title: 类型收窄与守卫
    kind: behavior
    summary: 检查过之后，编译器怎么知道它更具体了

  - id: null-safety
    group: types
    title: 空安全
    kind: concept
    summary: 「可能为空」是不是类型的一部分

  - id: type-assertion
    group: types
    title: 类型断言与转换
    kind: syntax
    summary: 怎么把「我说它是」写出来，以及失败的代价

  # ── generics 泛型与参数化 ───────────────────────────────────────
  - id: generic-declaration
    group: generics
    title: 泛型声明
    kind: syntax
    summary: 把类型当参数写

  - id: generic-constraint
    group: generics
    title: 类型约束
    kind: syntax
    summary: 限定类型参数必须具备什么能力

  - id: variance
    group: generics
    title: 型变
    kind: concept
    summary: 容器之间的赋值方向，以及 in / out

  - id: type-erasure
    group: generics
    title: 类型擦除
    kind: behavior
    summary: 泛型参数在运行期还剩多少

  # ── memory 内存与所有权 ─────────────────────────────────────────
  - id: value-vs-reference
    group: memory
    title: 值语义与引用语义
    kind: concept
    summary: 赋值与传参传的是值还是地址

  - id: garbage-collection
    group: memory
    title: 垃圾回收
    kind: concept
    summary: 内存什么时候被收回，能不能指望它

  - id: ownership-borrow
    group: memory
    title: 所有权与借用
    kind: concept
    summary: 谁拥有这块内存，借用有什么规矩

  - id: lifetime
    group: memory
    title: 生命周期
    kind: concept
    summary: 引用的有效期能不能写出来

  - id: weak-reference
    group: memory
    title: 弱引用与循环引用
    kind: behavior
    summary: 相互指着的一对对象怎么被回收

  # ── concurrency 并发 ────────────────────────────────────────────
  - id: concurrency-unit
    group: concurrency
    title: 并发单元
    kind: concept
    summary: 线程、协程、进程，以及能不能真的并行

  - id: shared-state
    group: concurrency
    title: 共享状态与数据竞争
    kind: behavior
    summary: 两个执行流碰同一块内存会发生什么

  - id: lock-mutex
    group: concurrency
    title: 锁与互斥
    kind: concept
    summary: 怎么把临界区保护起来

  - id: channel
    group: concurrency
    title: 通道与消息传递
    kind: concept
    summary: 不共享内存，改用通信

  - id: atomicity
    group: concurrency
    title: 原子性与内存序
    kind: concept
    summary: 一条语句未必是一步，重排未必看得出来

  # ── async 异步 ──────────────────────────────────────────────────
  - id: event-loop
    group: async
    title: 事件循环
    kind: concept
    summary: 单线程怎么同时应付很多等待

  - id: callback
    group: async
    title: 回调
    kind: syntax
    summary: 最早的异步写法，以及它的坑

  - id: promise-future
    group: async
    title: Promise 与 Future
    kind: concept
    summary: 表示「将来会有个值」的对象

  - id: async-await
    group: async
    title: async 与 await
    kind: syntax
    summary: 把异步写成同步的样子

  - id: cancellation
    group: async
    title: 取消与超时
    kind: behavior
    summary: 一个还没完成的异步任务怎么叫停

  # ── meta 元编程 ─────────────────────────────────────────────────
  - id: reflection
    group: meta
    title: 反射
    kind: concept
    summary: 运行期看见并操作类型本身

  - id: decorator-annotation
    group: meta
    title: 装饰器与注解
    kind: syntax
    summary: 给声明挂上额外语义

  - id: dynamic-eval
    group: meta
    title: 动态求值
    kind: concept
    summary: 把字符串当代码跑

  - id: proxy-interception
    group: meta
    title: 代理与拦截
    kind: concept
    summary: 在属性访问上插一层
