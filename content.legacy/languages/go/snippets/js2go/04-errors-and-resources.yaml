      f, err := os.Open(path)
      if err != nil { return err }
      defer f.Close()              // @note! 紧跟在申请之后写，函数返回时执行

      // @note! 多个 defer 按**后进先出**执行，正好对应"申请顺序的逆序"
      // @note! defer 的参数在**注册时**求值：
      for i := 0; i < 3; i++ {
          defer fmt.Println(i)     // 输出 2 1 0，不是 0 1 2
      }

      // @note 与 finally 一样，它解决了"提前 return 也会释放"的问题；
      // 但 defer f.Close() 会**丢弃关闭错误**，要处理得写 defer func() { err = f.Close() }()
