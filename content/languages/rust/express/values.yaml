# rust —— express / values
#
# 文件名是**存放组**（group），不是展示章 —— 展示章随基准变（见 catalog/express/*.yaml），
# 存放组不随。boxes 的 key 必须是 catalog/express/features.yaml 里 `group: values` 的那批。
#
# Rust 不是基准候选（meta.yaml 里 baseline: false），所以**没有 baseline 字段**，
# 三份 vs 必须写全（R22）；vs.<基准> 里只能出现 Rust 与那个基准两门语言（R25）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-values-v1
    generatedAt: '2026-10-03'

boxes:
  literals:
    code: |
      let a = 42;              // @note 默认推断为 i32
      let b = 42u8;            // @note 数字字面量可以带类型后缀
      let c = 0xff;            // @note 十六进制；还有 0o / 0b
      let d = 1_000_000;       // @note 下划线只是给人看的分隔符

      let ch = 'a';            // @note! char 是单个 Unicode 标量值，用单引号
      let s = "hello";         // @note &str：借用的字符串切片
      let owned = String::from("hello"); // @note 拥有所有权的字符串
      let raw = r#"含 "引号" 的原文"#;   // @note 原始字符串，不处理转义
    vs:
      javascript: |
        Rust 把「字符」与「字符串」分成了不同类型：`'a'` 是 `char`，
        `"a"` 是 `&str`，两者不能互相赋值；JavaScript 只有 `string` 一种，
        `'a'` 与 `"a"` 是同一个东西，单双引号只是写法。
        数字上 Rust 更细：字面量可以带类型后缀（`42u8`），
        没写时默认 `i32` —— JavaScript 的 `number` 是唯一的双精度浮点，
        没有整数与浮点的区分，也没有位宽可选。
      python: |
        两边都有「字面量决定类型」的直觉，但落点不同：Python 的 `1` 是任意精度整数，
        Rust 的 `1` 是 `i32`（固定 32 位，溢出在 debug 构建下 panic）。
        Rust 还把字符与字符串分成两种类型（`'a'` / `"a"`），
        而 Python 里两者都是 `str`。多出来的还有原始字符串 `r#"…"#`，
        写正则与路径时不用层层转义。
      java: |
        Java 的 `'a'` 是 `char`、`"a"` 是 `String`，这一点与 Rust 一致；
        差别在 `String` 是引用类型且不可变，Rust 的 `&str` 是**借用**——
        它不拥有那段文本，生命周期受借用检查约束。数字字面量两边都能写下划线，
        Java 的整数默认 `int`（32 位），与 Rust 默认 `i32` 相同。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  type-inference:
    code: |
      let n = 1;                        // @note 推断为 i32
      let v = vec![1, 2, 3];            // @note 推断为 Vec<i32>
      let mut empty = Vec::new();       // @note 这里推不出来，需要后文或标注
      empty.push(1u8);                  // @note 由这一行反推出 Vec<u8>
      let parsed: u32 = "42".parse().unwrap(); // @note 必须标出目标类型才能解析
    vs:
      javascript: |
        JavaScript 没有类型推断这回事 —— 变量本身不带类型，运行时值是什么就是什么。
        Rust 的推断是**编译期**的，而且只往前看：`Vec::new()` 这种自身看不出元素的，
        要靠后面的用法反推，或者由作者标注。推断失败是编译错误，
        不会默默退化成「什么都能装」的动态类型。
      python: |
        Python 的类型标注是可选的、运行时不检查的提示；Rust 的推断是编译器
        必须完成的功课，推不出来就不许通过。所以 Rust 里
        `let parsed = "42".parse()` 这种写法编译不过 ——
        目标类型是推断的输入而不是输出，`parse()` 的结果类型取决于你要什么。
      java: |
        Java 10 起局部变量可以用 `var` 推断，范围限制在局部变量；
        Rust 的 `let` 从一开始就推断，字段、常量、函数返回值也各有各的规则。
        两边都不做隐式数值转换，但 Rust 更进一步：
        连 `Vec::new()` 的元素类型都可以由后面的 `push` 反推，
        Java 的 `var` 只在声明那一行就地推断。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  null-and-undefined:
    code: |
      // let x: i32 = null;              // @note! 编译错误：Rust 里没有 null

      let found: Option<i32> = Some(3);
      match found {
        Some(n) => println!("{}", n),    // @note 必须同时处理两个分支
        None => println!("没有"),
      }

      let n = found.unwrap_or(0);        // @note 显式给出缺省值
      // let m = found.unwrap();          // @note! 是 None 时 panic —— 只在确实不会缺时用
    vs:
      javascript: |
        Rust **没有 null 也没有 undefined**。可能缺的值必须写成 `Option<T>`，
        而 `Option` 是一个普通枚举 —— 编译器会检查你有没有处理 `None` 分支。
        JavaScript 里 `undefined` 可以出现在任何变量上、任何时刻，
        类型系统（如果有）也拦不住；Rust 里「可能缺」是类型的一部分，
        想拿到里面的值得先把缺的情况处理掉。
      python: |
        Python 用 `None` 表示缺失，而 `None` 可以赋给任何变量，检查全靠自觉；
        Rust 把「可能缺」编码进类型：`Option<i32>` 与 `i32` 是两个不同的类型，
        不解开就不能当数字用。Python 里 `x.attr` 撞上 None 是运行时 AttributeError，
        Rust 里忘记处理 None 根本编译不过。
      java: |
        Java 的 `null` 可以赋给任何引用类型，`NullPointerException` 是运行时事故；
        Rust 没有 `null`，用 `Option<T>` 表达同一件事，并且**编译器强制你处理**。
        Java 近年有 `Optional`，但它只是库类型，字段与参数照样能用裸 `null` 绕过；
        在 Rust 里绕不过去 —— `Option` 就是唯一写法。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  type-conversion:
    code: |
      let n = 3.9f64;
      let i = n as i32;                  // @note as 是截断转换：3.9 → 3，不做四舍五入

      let s: String = String::from("42");
      let v: i32 = s.parse().unwrap();   // @note 解析用 parse，失败返回 Result

      let n2: i64 = i32::from(7i32);     // @note From / Into 是无损转换
      let big: i64 = 7i32.into();        // @note 同一个转换的另一种写法
    vs:
      javascript: |
        JavaScript 的转换常常是隐式发生的 —— `"3" * 2` 得 6，
        `1 + "2"` 得 "12"，转换规则藏在运算符语义里。
        Rust **没有任何隐式数值转换**：想让 i32 变成 i64 必须显式写，
        想让字符串变成数字必须调 `parse()` 并把失败当值处理。
        代价是多写几个字，收益是读代码时不必推演运算符背后的转换表。
      python: |
        Python 有 `int()` / `float()` / `str()` 这类显式转换，也有 `"3" * 2` 得 "33"
        这种隐式语义；Rust 的转换走两套 trait —— 无损的 `From` / `Into`，
        可能失败的 `TryFrom`，解析字符串则用 `parse()` 返回 `Result`。
        另一个显著差别是 `as`：它做截断转换且不报错，
        Python 的 `int(3.9)` 同样是截断，两边在这点上反而一致。
      java: |
        Java 有隐式加宽（`int` 到 `long` 自动）与显式窄化（`(int)` 强制转换），
        超出范围会静默回绕；Rust 的 `as` 也会按位截断，但**加宽也必须写出来** ——
        没有自动提升。Java 解析字符串用 `Integer.parseInt` 抛异常，
        Rust 用 `parse()` 返回 `Result`，把「可能失败」放在类型里而不是异常里。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
