id: basics-python/02-types
topicId: basics-python
title: 原始类型与类型推断
order: 2
summary: 一个 int 打天下、bool 是 int 的子类、除法与除零都与别处不同——从 Python 出发看类型这一层

features:
  - id: basics-python/primitive-types
    title: 内置类型清单
    kind: concept
    summary: Python 的标量只有几种，但整数没有宽度上限

  - id: basics-python/type-inference
    title: 类型与变量的绑定关系
    kind: concept
    summary: 名字没有类型，类型跟着对象走

  - id: basics-python/type-checking
    title: 运行时类型检查
    kind: behavior
    summary: 用 isinstance，不要用 type(x) is T

  - id: basics-python/null-undefined
    title: 空值：只有 None
    kind: behavior
    summary: 一个空值、一个单例，判等一律用 is

  - id: basics-python/number-precision
    title: 数值精度与除法
    kind: behavior
    summary: 整数不溢出，但除法有两种、除零会崩

  - id: basics-python/type-casting
    title: 显式类型转换
    kind: syntax
    summary: 类型名就是构造函数，转换失败一律抛异常

  - id: basics-python/boolean-conversion
    title: 真值判断
    kind: behavior
    summary: 空容器是假值，这是与别处差异最大的一条

  - id: basics-python/type-names
    title: 类型自省
    kind: behavior
    summary: type(x) 给的是类对象，不是字符串

  - id: basics-python/immutable-primitives
    title: 不可变类型
    kind: behavior
    summary: 字符串数字元组改不了，只能换绑
