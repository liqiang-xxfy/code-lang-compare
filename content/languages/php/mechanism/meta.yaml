# php —— mechanism / meta
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: meta` 的那批：
# reflection / decorator-annotation / dynamic-eval / proxy-interception。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 口径说明：这一组要写准的四件事 ——
# ① `#[...]` **属性（attributes）本身不执行任何代码**，是纯元数据；
#    要 `getAttributes()` 读出来、再 `newInstance()` 才会构造它 ——
#    **它不是装饰器**，与本格标题里的「注解」是一路的，与另外两个基准的「装饰器」不是；
# ② 反射是**只读内省**：不能建类、不能改已加载类的结构；
#    而且 **8.1 起 private / protected 默认就能读**，`setAccessible()` 基本是空操作；
# ③ 动态求值这条路上 PHP 的可用点很多（`eval`、可变函数、变量变量、
#    `__call` 兜底），比多数语言宽松；
# ④ 没有内建 Proxy —— 拦截要靠魔术方法与手写代理类。
#
# 本文件的事实全部在本机 PHP 8.5.11 上实跑确认过。

