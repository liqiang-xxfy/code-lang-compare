# cpp —— express / bindings
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: bindings` 的那批。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组有四件事必须写准，都实跑验过 ——
# ① **没有提升**：名字必须先声明（`x = 1; int x;` 直接编译错误），
#    唯一像提升的是**类体内成员函数可以引用后面声明的成员**（完整类上下文）；
# ② **局部变量不初始化就是不确定值**（读它是 UB），而全局/静态的会被零初始化 ——
#    这与「声明即给默认值」的语言正好相反；
# ③ **命名约定在这门语言里带语义**：以下划线开头/双下划线的标识符是标准**保留**的，
#    用它们是 UB，而编译器**一声不吭**（实测 -Wall -Wextra 零警告）——
#    它是本组唯一「纯风格约定其实会咬人」的格子；
# ④ 遮蔽默认不报，要 `-Wshadow` 才提醒，而且可以用 `::x` 拿到被遮蔽的全局。

review:
  state: draft

boxes:
  declaration:
    code: |
      int x = 1;                  // @note! 声明与定义是**同一句话**，同时分配存储
      extern int y;               // @note 只有声明：告诉编译器「别处有个 y」
      auto z = 1;                 // @note 类型推断（C++11）

      const int K = 10;           // @note 只读，但仍是运行期的变量
      constexpr int N = 10;       // @note 编译期常量，能当数组长度用

      int arr[]{1, 2, 3};
      auto [a, b] = std::pair{1, 2.5};    // @note 结构化绑定：一条声明引出两个名字

      using Id = unsigned long;   // @note 类型别名（不是新类型，只是另一个名字）
    vs:
      javascript: |
        两边都会「给一个名字赋值」，但 C++ 的声明同时定下三件事：类型、存储、
        生存期 —— `int x = 1;` 不只是让 `x` 指向 1，而是当场分配了一块存 int 的地方。
        所以 C++ 里出现了 JavaScript 没有的一种写法：**只要声明不要定义**
        （`extern int y;`，告诉编译器「这个名字别处有」）。
        另一处是 `auto`：它让编译器推类型，但**类型仍然存在且被钉死** ——
        不像 JavaScript 的变量可以换成别的类型。`using` 也只是别名，
        不会像类那样引入一个新类型。
      python: |
        两边的写法都短，但 C++ 的声明带着 Python 没有的两层含义：
        **存储与生存期**（声明即分配），以及**编译期与运行期的分界**
        （`constexpr` 的值根本不进运行时，`const` 的还在）。
        Python 的 `x = 1` 只是把名字绑到对象上，对象的生死另有人管 ——
        C++ 里没有这个「另有人」，名字和那块内存是绑在一起的。
        另一处是 C++ 要用一个名字必须先让编译器见过它（见 `hoisting` 那一格）。
      java: |
        两边语法几乎一样（`int x = 1;`、`auto` ↔ `var`、`using` ↔ `import` 别名），
        但**声明与定义是不是一回事**上两边分开了：Java 的声明不决定对象住哪
        （对象永远在堆上、由 GC 管），C++ 的声明就在声明存储 ——
        局部变量住栈上、`new` 出来的住堆上，是写代码的人选的。
        另一处是 C++ 有 `extern` 这种「只说有、不说在哪」的声明，
        Java 的编译单元模型里不需要它。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  mutability:
    code: |
      int a = 1;
      a = 2;                      // @note 普通变量想改就改

      const int b = 3;            // @note! const 变量没有默认初值就是错误
      // b = 4;                   // @note! 编译错误

      int& r = a;                 // @note 引用：**不能改绑**，此后 r 就是 a 的别名
      r = 5;                      // @note 改的是 a，不是「让 r 指向别人」

      constexpr int N = 10;       // @note 编译期常量：连运行期的存储都可能没有

      struct S {
        int v = 0;
        mutable int cache = 0;              // @note 例外：const 成员函数里也能改
        int get() const { return v; }
      };
    vs:
      javascript: |
        两边都能「声明一个之后不能改的名字」，但冻结的**层次**不同：
        JavaScript 的 `const` 只冻结绑定，对象里的属性照样能改；
        C++ 的 `const` 是**类型的一部分** —— 一个 `const S&` 连调用非 const 成员
        都不允许，编译器按类型拒绝。所以那边「名义上只读、实际能改」的口子，
        在这边要靠显式写 `mutable` 才开得出来（而且一眼能看见）。
        另一处是 `constexpr`：C++ 能把值彻底挪到编译期，JavaScript 没有这一层。
      python: |
        Python 根本没有「不能改的名字」，只有「不能改的对象」
        （靠元组、冻结集合这类类型实现）；C++ 走的是另一条路：
        **名字可以冻结，而对象本身还能通过别的名字改** ——
        这就是引用存在的意义（`int& r = a; r = 5;` 改的是 `a`）。
        两边都有「不能改」这个概念，但一个落在对象上、一个落在名字和类型上，
        于是 C++ 里同一个对象可以同时被一个可写的名字和一个只读的名字指着。
      java: |
        最接近的一对是 Java 的 `final`，但**冻结的层次又不一样**：
        Java 的 `final int b = 3` 是靠「之后不许再赋值」实现的，
        C++ 的 `const` 是类型的一部分，会一路影响重载决议、成员函数调用、
        模板匹配 —— 一个 `const` 参数能传进来的东西和普通参数是两套。
        另一处是 Java 没有「不可改绑的引用」这个概念（引用本身从来都不可改绑），
        C++ 的引用**恰恰就是**那个东西，而它的指针是可改绑的 —— 两个都要有。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  scope:
    code: |
      int g = 0;                  // @note 命名空间作用域（「全局」，但默认外部链接）

      namespace app { int v = 1; }        // @note 名字空间：把名字圈起来
      using app::v;                        // @note 可以用 using 把名字引进来

      static int fileOnly = 2;             // @note static 在命名空间作用域 = 内部链接
      namespace { int hidden = 3; }        // @note 匿名命名空间：现在的推荐写法

      struct S {
        int member;                          // @note 类作用域
        void f() { int local; (void)local; } // @note 函数/块作用域
      };

      void loop() { label: goto label; }     // @note! 函数作用域还有一类：标签
    vs:
      javascript: |
        两边都有块作用域，但**「全局」的含义差得远**：JavaScript 的顶层声明
        挂在模块作用域上，模块之间互不可见；C++ 的命名空间作用域变量
        **默认是外部链接的** —— 只要别处声明一句 `extern int g;` 就能直接用上，
        所以「全局」在这边是真的全局。要限制可见性得显式写 `static`
        或者放进匿名命名空间，也就是说 C++ 的默认方向是「敞开」。
        另一处是块作用域里可以放标签（配合 `goto`），JavaScript 没有这个东西。
      python: |
        两边的分层思路不同：Python 的作用域由**函数**划分，类体只是执行一遍
        就丢掉的临时命名空间；C++ 的作用域按 `{}` 划分 —— 一个 `if` 的分支、
        一个 `for` 的循环体各自是一层，循环变量出了循环就不存在。
        另一处是 C++ 有**命名空间**这一层（专门用来防重名），
        Python 靠模块和包做同一件事，但模块是文件、命名空间不是。
      java: |
        两边都有「块作用域」，但 C++ 多出两层 Java 没有的东西：
        **命名空间**（Java 用包名加目录结构代替，是文件系统层面的约定）
        和**匿名命名空间 / `static`**（Java 没有「只在当前文件可见」这个概念）。
        另一处差别是名字空间可以嵌套并用 `using` 局部引入，
        Java 的 `import` 只针对类，不能引入「一批名字」再加别名。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  hoisting:
    code: |
      // @note! C++ **没有提升**：名字必须先让编译器见过
      // x = 1;                    // @note! 编译错误：'x' was not declared
      // int x;

      // 唯一像提升的是**类体内**：成员函数可以引用后面才声明的成员
      struct S {
        int f() const { return later; }     // @note later 在后面才声明 —— 合法
        int later = 42;
      };

      void g() {
        // 函数内部不做预先扫描，一行一行按顺序看
        int a = b;                // @note! 编译错误：b 还没出现
        int b = 1;
      }
    vs:
      javascript: |
        **这一格是直接的有无之分**：JavaScript 的声明会被扫一遍先建好名字
        （`var` 提升成 `undefined`、函数声明整个可用、`let` 有暂时性死区），
        所以「语句执行前名字就存在」；
        C++ 里名字**在声明点之后才存在**，`x = 1; int x;` 直接编译不过 ——
        没有提升，也没有死区，因为压根没有「声明前的那段时间」。
        代价是 C++ 里必须把辅助函数和类型写在用它的地方之前，或者先写一句声明。
      python: |
        两边都是「必须先出现」，这一层一致 —— Python 的局部变量也是
        从赋值那一行起才存在。但两边的报错时机不同：
        Python 要到函数**被调用**时才报 `UnboundLocalError`，
        C++ 在编译期就报 `'x' was not declared in this scope`，
        而且报的是「这个名字根本不存在」还是「存在但用早了」是两句话。
        另一处是 C++ 的类体是一个例外（成员可以先用后声明），Python 的类体没有。
      java: |
        两边都没有提升，都要求先声明后使用，这一格很接近 ——
        连「类体内成员可以互相引用、不分先后」这条都一样
        （Java 的字段和方法也是整个类体里可见）。
        差别在报错的位置：C++ 里「用了不存在的名字」和「用了还没声明的名字」
        都报 `was not declared in this scope`，而 Java 对字段的先后顺序
        更宽松一些（初始化顺序变了但依然编译得过）。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  shadowing:
    code: |
      int x = 100;

      int main() {
        int x = 1;                // @note 遮蔽外层的 x —— **默认不报错**
        {
          int x = 2;              // @note 还能再遮一层
          (void)x;
        }
        // 想拿到被遮住的全局，用 :: 前缀
        int y = ::x;              // @note 100：作用域解析符直达全局
        (void)y;
      }

      // 编译器可以提示，但不是默认行为：编译时加 -Wshadow
    vs:
      javascript: |
        两边都允许遮蔽，也都能靠一层前缀找回外层的东西
        （JavaScript 的变量没有「全局前缀」可用，得绕道去模块顶层取；
        C++ 直接写 `::x`）。真正的差别在**有没有信号**：
        C++ 用 `-Wshadow` 就能让编译器把每一处遮蔽指出来，
        JavaScript 的遮蔽和普通赋值长得一模一样，靠读代码分辨。
        另一处是 C++ 的作用域按 `{}` 分层，遮一层、两层都是常规写法。
      python: |
        两边的默认姿态相反：Python 的函数作用域是**整块的** ——
        函数里任何一个赋值都让这个名字从此属于局部，函数里就没有「内层遮蔽外层」
        这回事（只有嵌套函数才有）。C++ 按 `{}` 一层层分，
        一个 `if` 的分支里就能遮出一个新名字，出了分支就恢复。
        所以那边「函数内处处同一个 x」，这边「每对花括号都可能换一个 x」。
      java: |
        两边都按块分层，规则很接近。差别在一处很实际的地方：
        Java **不允许**在同一个方法里用一个内层块去遮蔽局部变量
        （编译错误「variable x is already defined」），
        C++ 允许，只给个 `-Wshadow` 提示。另一处是 C++ 的
        `::x` 能直接跳到全局作用域，Java 没有对应写法 ——
        被字段遮住的局部变量要靠 `this.x` 往回收，而静态字段只能改名。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  naming-convention:
    code: |
      // @note! 这一格在 C++ 里**不只是风格** —— 标准把某些标识符**保留**了：
      int __double_under;         // @note! 双下划线：任何位置都保留给实现
      int _Capital;               // @note! 下划线+大写：任何位置都保留
      int _lower_global;          // @note! 下划线+小写：全局作用域下保留

      // 用了它们是 UB，而编译器**一声不吭**（实测 -Wall -Wextra 零警告）

      // 其余确实只是社区惯例，各家不一致：
      //   Google：函数 PascalCase、变量 snake_case、成员加尾下划线
      //   标准库：类型 snake_case、概念 PascalCase
      // 文件名惯例按扩展名走：.h / .hpp / .cpp / .cc
    vs:
      javascript: |
        **这一格两边差别最本质**：JavaScript 的命名约定纯粹是社区习惯
        （驼峰与否不影响任何东西），命名冲突由作用域自己解决；
        C++ 里**有一类名字是被标准保留的** —— 双下划线、
        下划线加大写、全局作用域的下划线加小写，用它们是未定义行为，
        而且编译器通常不会警告。所以 C++ 的命名约定是「一半风格、一半规则」，
        下划线开头这条尤其要记住：它不是「不推荐」，是「不属于你」。
      python: |
        两边都有「下划线带含义」的传统，但含义完全不同：
        Python 把前导下划线当作**约定俗成**表示「内部用」
        （真正强制的是双下划线名字改写，而且那只影响类属性查找）；
        C++ 保留下划线的理由是**给实现留名字空间** ——
        用到了可能和标准库或编译器内部撞上，后果是未定义行为。
        所以一边是「大家说好别碰」，一边是「标准说这本来就不是你的」。
      java: |
        两边都有「命名带含义」这一类规则，而且都容易踩：
        Java 里 `$` 是编译器合成名字用的（写它合法但建议别用），
        单个下划线 `_` 从 Java 9 起是**关键字**、直接编译不过；
        C++ 保留的是一组**模式**（双下划线、下划线加大写等），
        用到了不报错、行为未定义。两边共同的教训是
        「跟标准抢名字」的代价不对称 —— 出事时离你写的那一行很远。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
