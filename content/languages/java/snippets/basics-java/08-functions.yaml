      static int[] minMax(int[] xs) { ... }     // @note 塞进数组：丢类型信息，访问靠下标

      record MinMax(int lo, int hi) { }         // @note 定义一个类型 —— 推荐
      static MinMax minMax2(java.util.List<Integer> xs) {
          return new MinMax(java.util.Collections.min(xs), java.util.Collections.max(xs));
      }

      var r = minMax2(xs);
      r.lo();                                   // @note 访问器是方法调用

      // @note! 一个方法只能返回一个值，没有元组 —— 选定容器后就固定了，后面再改要动所有调用点
