  - featureId: basics-java/string-index-slice
    equivalence: divergent
    code: |
      const s = "abcdef";
      s.charAt(0);                 // 'a' —— 与 Java 一致
      s[0];                        // @note 更常见的写法，两者等价
      s.slice(1, 4);               // @note "bcd" —— 左闭右开
      s.substring(1, 4);           // "bcd"

      s.at(-1);                    // @note 'f' —— 支持负索引（charAt 不支持）
      s.slice(2, 999);             // @note "cdef" —— 越界静默截断
      // @note! 但 charAt(999) 返回空字符串而不是抛异常 —— 与 Java 的抛相反
      [...s].reverse().join("");   // @note 反转同样要绕一道（没有步长）
