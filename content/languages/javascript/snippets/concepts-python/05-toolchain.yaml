topic: concepts-python
review:
  state: draft
  provenance:
    origin: llm
    model: claude-code-agent
    promptTemplateId: concepts-v1
    generatedAt: '2026-10-02'
snippets:
  - featureId: concepts-python/package-manager
    equivalence: analogous
    code: |
      npm install lodash
      npm install -D vitest         // @note 对标 dev 依赖组
      npx vitest                    // @note 对标 uvx，临时跑一个工具
    body: |
      **npm / pnpm** —— `package.json` 声明 + `node_modules` 落地，
      锁文件是标配，默认就锁版本。

  - featureId: concepts-python/dependency-isolation
    equivalence: divergent
    code: |
      // node_modules 就近查找：同一库的不同版本可以共存
      node_modules/a/node_modules/lodash   // @note! 没有「一个环境一个版本」这回事
      // @note 代价是体积与「到底装了哪一版」的困惑
    body: |
      **node_modules（就近查找）** —— 同一依赖可能有多个版本共存；
      从 Python 过去反而更宽松，不用为版本冲突建第二个环境。

  - featureId: concepts-python/runner
    equivalence: divergent
    code: |
      fetch("/api");               // @note 浏览器与 Node 都有，但 fs / DOM 各只有一边有
      // @note! 运行时分裂：要时刻意识到「这段代码在哪跑」
    body: |
      **Node.js / 浏览器引擎** —— 事件循环驱动，单线程 + 异步 I/O；
      代价是多出打包 / 转译一整套工具，好处是同一份逻辑能前后端共享。

  - featureId: concepts-python/build-tool
    equivalence: divergent
    code: |
      npm run build                // @note! 打包 + 转译 + 压缩，浏览器不能直接跑源码
      // @note 开发时也一直在跑，构建是日常的一部分
    body: |
      **Vite / webpack** —— 打包 + 转换，产物面向浏览器；
      从 Python 过去，构建从「发布的一步」变成「日常的一环」。

  - featureId: concepts-python/test-framework
    equivalence: divergent
    code: |
      import { test, expect } from "vitest";
      test("加法", () => { expect(1 + 1).toBe(2); });   // @note 断言链代替裸 assert
      // @note 发现靠框架配置的 glob，不靠命名约定
    body: |
      **Vitest / Jest** —— `test('名', () => {})` 风格，
      断言靠 `expect` 链（`toBe` / `toEqual` 语义不同）。

  - featureId: concepts-python/testing-mock
    equivalence: divergent
    code: |
      vi.mock("./api", () => ({ fetchUser: vi.fn() }));   // @note! 必须提升到 import 之前
      const spy = vi.fn().mockReturnValue(1);              // @note 模块绑定换不动
    body: |
      **vi.fn / jest.mock** —— 对象属性可以直接替换，但模块级依赖不能，
      必须提前声明 mock。

  - featureId: concepts-python/lint-format
    equivalence: divergent
    code: |
      npx eslint .                 // @note! 规则可插拔，每个项目一套配置
      npx prettier --write .       // @note 风格与检查分离，不是「唯一答案」
    body: |
      **ESLint + Prettier** —— 规则可插拔、风格与检查分离；
      从 Python 过去会多出「先跟团队吵一轮规则」这件事。

  - featureId: concepts-python/repl
    equivalence: identical
    code: |
      node
      > [1, 2, 3].map((x) => x * 2)
      [ 2, 4, 6 ]
    body: |
      **node / 浏览器控制台** —— `node` 直接进 REPL。
      核对本手册里任意一条差异，最快的办法就是两边各敲一遍。
