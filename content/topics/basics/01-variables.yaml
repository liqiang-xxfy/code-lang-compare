id: basics/01-variables
topicId: basics
title: 变量与声明
order: 1
summary: 声明方式、块级作用域、变量提升与「不可变」的真实含义

features:
  - id: basics/var-declaration
    title: 变量声明
    kind: syntax
    summary: 声明与赋值的写法差异
    body: |
      JavaScript 用 `let` / `const` / `var` **声明**变量，声明与作用域绑定；
      Python 没有声明语法，赋值语句本身就是「把名字绑定到对象」。
      迁移时的第一个心智转变：**不要问「怎么声明」，要问「这个名字绑到了什么对象上」**。

  - id: basics/var-scope
    title: 作用域
    kind: behavior
    summary: 块级作用域 vs 函数级作用域
    body: |
      两者都有 `{}` 缩进块，但作用域规则完全不同：
      - JS：`let` / `const` 是**块级**的，`var` 是**函数级**的（这也是 `var` 被弃用的主因）
      - Python：**块不产生新作用域**，只有函数、类、模块才产生
      这是前端转 Python 最容易踩的一条——把 JS 直觉带过去会得到「变量怎么还在」的困惑。

  - id: basics/hoisting
    title: 变量提升
    kind: behavior
    summary: 声明前访问会发生什么
    body: |
      Python **没有变量提升这个概念**（本行标为「无等价」）。
      JS 里 `var` 会提升为 `undefined`，`let` / `const` 提升但存在暂时性死区（TDZ）会抛错；
      Python 直接抛 `NameError`。理解差异的关键是：**JS 的提升是编译期行为，Python 只有运行时名字查找**。

  - id: basics/const-immutability
    title: const 与不可变性
    kind: behavior
    summary: const 冻结的是绑定，不是对象
    body: |
      `const` 限制的是**重新绑定**，不是内容不可变；想让对象真正不可变要 `Object.freeze()`。
      Python 干脆没有「不可重新绑定」的语法，只有**约定**（全大写变量名）表示「不要改」。
      两边的「常量」都靠自觉，这是共性，也是容易误判的地方。

  - id: basics/naming-convention
    title: 命名与大小写惯例
    kind: syntax
    summary: camelCase vs snake_case
    body: |
      唯一一处「纯风格、无语义」的差异，但迁移时满屏的命名不一致会显著增加阅读阻力。
      记住一条：JS 的 `camelCase` → Python 的 `snake_case`，类名两边都是 `PascalCase`，
      真正常量两边都习惯 `SCREAMING_SNAKE_CASE`。

  - id: basics/var-destructuring
    title: 解构赋值
    kind: syntax
    summary: 从数组/对象里按形状取值
    body: |
      JS 的数组解构按**位置**、对象解构按**键名**，还能设默认值和重命名；
      Python 只有「按位置解包」（`a, b = pair`），没有对象解构——
      想按名字取值要写 `d['key']` 或 `d.get('key')`。
      这是 Python 少有的、比 JS 表达力更弱的一块，迁移时会明显感觉到。

  - id: basics/var-multiple-assign
    title: 多重赋值与交换
    kind: syntax
    summary: 交换变量与同时赋值
    body: |
      Python 的 `a, b = b, a` 一行交换，靠的是「先构造右侧元组、再解包」；
      JS 没有这个能力，同样的事要么引入临时变量，要么用数组解构 `[a, b] = [b, a]`。
      另外 `a = b = 0` 在 JS 里是**链式赋值**（从右往左），在 Python 里也是合法的——但语义是
      「把 0 赋给 b，再把 b 的值赋给 a」，遇到可变对象时两者行为会分叉，别混用。

  - id: basics/var-global-declaration
    title: 全局变量与 global
    kind: behavior
    summary: 函数内改外部变量的两种写法
    body: |
      JS 里函数内直接给外层变量赋值就行（只要能找到那个作用域），除非在严格模式外隐式创建全局。
      Python 里**函数内赋值默认创建局部名字**，想改模块级变量必须显式 `global`，
      改外层函数变量要 `nonlocal`。
      这条「必须声明意图」的设计能挡掉大量意外覆盖，但也意味着逐行翻译 JS 代码时，
      原本能跑的代码在 Python 里会静默变成「改了个局部变量，外面没变」。

  - id: basics/var-shadowing
    title: 变量遮蔽
    kind: behavior
    summary: 内层同名变量覆盖外层
    body: |
      两边都允许遮蔽，但后果不同：JS 用 `let` 遮蔽是块级、作用域清晰；
      Python 因为**块不产生作用域**，在 `if` 里重复赋值只是改同一个名字，不是遮蔽。
      真正的坑是「遮蔽内置名」——Python 里写 `list = [1,2]` 或 `id = 1`
      会把内置函数盖掉，之后同一模块里所有 `list(...)` 都会报错，而且很难定位。

