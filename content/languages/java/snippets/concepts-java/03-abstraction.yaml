snippets:
  - featureId: concepts-java/class-inheritance
    equivalence: identical
    code: |
      class Base { private int secret = 1; }        // private 是编译期强制的真私有
      class Sub extends Base implements Runnable {  // 单继承 + 多接口
          public void run() {}
      }
    body: |
      Java 的类是**单一继承 + 多接口**：`extends` 一个类、`implements` 多个接口
      （接口可有 `default` 方法提供实现），`abstract` 类不能实例化，`private` 是编译期
      强制的真私有，`this` 隐式，且永远是「当前实例」，不受调用方式影响。

  - featureId: concepts-java/interface
    equivalence: identical
    code: |
      interface Renderable {              // 接口是中心概念
          String toText();
          default boolean empty() { return false; }   // default 方法
      }
    body: |
      接口是 Java 的**中心概念**：一个类可以 `implements` 多个接口，接口有 `default` /
      `static` 方法、可以是函数式接口（配 lambda）、可以带泛型。

  - featureId: concepts-java/generics
    equivalence: identical
    code: |
      List<String> list = new ArrayList<>();   // 泛型在编译期检查
      list.getClass();                         // 运行期都是 ArrayList —— 擦除
    body: |
      Java 有完整的泛型：`List<String>`、类型参数、`extends` / `super` 边界、通配符 `?`；
      但**运行时擦除** —— `List<String>` 与 `List<Integer>` 在运行期都是 `List`，
      所以不能 `new T[]`、不能对泛型做 `instanceof`。

  - featureId: concepts-java/error-handling
    equivalence: identical
    code: |
      void read() throws IOException { }   // 受检异常写进签名，编译器强制处理
      try { read(); }
      catch (IOException e) { }            // 只能抛 Throwable 的子类
    body: |
      Java 的错误处理带着**受检异常**：方法签名上 `throws IOException` 是契约，
      编译器强制调用方处理或继续声明；只能抛 `Throwable` 的子类；
      `try/catch/finally` 有 `finally` 但没有 `else`。抛出的必须是 `Throwable` 的子类，
      这由编译器保证。
