# 速语词典 —— 从 JavaScript 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 会拦第三门）

- term: 所有权
  aliases: [ownership, borrow, move]
  perLanguage:
    javascript: 没有对应概念 —— 对象由 GC 管，谁都能持有引用，生命周期不由代码表达
    rust: 每个值有唯一所有者，所有者离开作用域即释放；借用（&）是临时出借，编译期检查
  note: 「谁负责释放」这件事在 JS 里根本不用想，在 Rust 里是每行代码都要回答的问题。

- term: 可变性
  aliases: [mutability, const, let]
  perLanguage:
    javascript: '`const` 冻结绑定但不冻结内容；对象默认可变'
    rust: '`let` 默认不可变，要可变必须写 `let mut`；可变借用同时只能有一个'
  note: JS 的 const 是"不能重新赋值"，Rust 的默认不可变是"连内容也不能改" —— 严格程度完全不同。

- term: 错误处理
  aliases: [error, exception, result]
  perLanguage:
    javascript: throw / try / catch；未捕获的异常会中断当前调用栈
    rust: 可恢复错误用 `Result<T, E>` 显式返回，不可恢复用 panic；`?` 负责向上传递
  note: 两边都不鼓励用 panic/throw 处理可预期的问题，但 Rust 把这个约定写进了类型。

- term: 字符串
  aliases: [string, str, utf-8]
  perLanguage:
    javascript: 只有一种 string，UTF-16 编码，按码元索引
    rust: '`String`（拥有所有权、可增长）与 `&str`（借用切片）两种；UTF-8 编码，不能直接按整数下标取字符'
  note: 从 JS 迁过来时，「字符串怎么会有两种」和「为什么不能 s[0]」是两个连着的惊讶。

- term: 借用
  aliases: [borrow, reference, '&', '&mut']
  perLanguage:
    javascript: 没有对应概念 —— 所有引用都是共享的，谁都能改，也没有"借出期间不能动"这回事
    rust: '`&T` 是不可变借用（可同时存在多个），`&mut T` 是可变借用（同时只能有一个）；借用期间原值不能动'
  note: JS 里"传个引用过去"不必想什么；Rust 里借出与借入是一对需要同时满足的约束。

- term: 生命周期
  aliases: [lifetime, "'a", scope]
  perLanguage:
    javascript: GC 保证引用永远有效，所以"这个引用还能活多久"不是需要回答的问题
    rust: 编译器跟踪每个引用活多久，并验证它不会比被引用的数据更长寿；多数情况能自动推断
  note: 生命周期标注看起来在描述"活多久"，其实是在描述**引用之间的关系** —— 它不改变实际生命周期。

- term: 智能指针
  aliases: [smart pointer, Box, Rc, Arc, RefCell]
  perLanguage:
    javascript: 只有一种引用，GC 负责回收，没有"共享所有权"与"独占所有权"之分
    rust: '`Box<T>`（独占堆分配）、`Rc<T>`（单线程共享）、`Arc<T>`（跨线程共享）、`RefCell<T>`（运行期借用检查）各管一件事'
  note: JS 里一个引用走天下，Rust 里选哪种指针取决于"几个所有者、跨不跨线程、要不要运行期检查"。

- term: 特征
  aliases: [trait, interface, protocol, impl]
  perLanguage:
    javascript: 没有语言级概念 —— 靠鸭子类型隐式满足，TypeScript 的 interface 只在编译期存在
    rust: '`trait` 定义行为契约，可以给任何类型 `impl`（包括你不拥有的类型）；也可以是泛型约束或 `dyn Trait`'
  note: 与 JS 相比多了一层：Rust 的 trait 既能当接口用，也能当泛型约束用，还能为已有类型补实现。

- term: 迭代器
  aliases: [iterator, iter, collect, lazy]
  perLanguage:
    javascript: 数组方法（map/filter）立刻求值并返回新数组；生成器函数可以惰性求值
    rust: '`iter()` 产出的是惰性迭代器，链式操作零成本；必须用 `collect()` / `sum()` 这类终结操作消费'
  note: 两边都有"惰性"的概念，但 Rust 是**默认**惰性且编译期优化，JS 是默认立刻求值、要惰性得显式用生成器。

- term: 宏
  aliases: [macro, format, vec, println]
  perLanguage:
    javascript: 没有宏 —— 只有函数；要生成代码得靠构建期工具（babel 插件、代码生成器）
    rust: '`macro_rules!` 与过程宏在**编译期**展开成代码；`println!` / `format!` / `vec!` 都是宏'
  note: 名字后面那个 `!` 是在提醒"这不是函数调用" —— 它的参数在编译期被改写，所以能做函数做不到的事（比如编译期检查格式串）。
