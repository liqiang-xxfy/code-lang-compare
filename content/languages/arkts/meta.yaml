# ArkTS —— 按 D-D 要求作为「独立语言身份」维护，不与 TypeScript 合并、不做变体视图。
# 它与 TS 共享大部分语法，但价值点在于「同语法、不同运行时与生态」，因此：
#   · 保留独立列与独立 snippets
#   · metadata 里显式记录运行时 / 生态差异，供 M5 工具链与 M6 并发内存模块消费
#   · shikiLang 用 'typescript' 是刻意的近似（Shiki 无 ArkTS 语法包），不影响语言身份
id: arkts
name: ArkTS
shortName: ArkTS
aliases: [arkts, harmonyos, harmony, ets]
version: API 12 (HarmonyOS NEXT)
fileExtension: .ets
comment:
  line: '//'
  block: ['/*', '*/']
shikiLang: typescript
paradigm: [oop, declarative-ui, static-typing]
typing: static
typeSystem: nominal
memoryModel: gc
concurrency: [single-threaded-ui, taskpool, worker]
baseline: false
metadata:
  runtime: HarmonyOS ArkUI（非浏览器 / 非 Node）
  supersetOf: TypeScript
  compiler: ArkTS Compiler（非 tsc）
  packageManager: ohpm（非 npm）
  stateManagement: '@State / @Prop / @Link 等装饰器'
  restrictions: 禁用 any、结构化类型、动态属性、原型改写等 TS 特性
links:
  - label: ArkTS 语言基础（HarmonyOS 开发者文档）
    url: https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkts-basic-syntax-overview
