- featureId: basics/immutable-primitives
  equivalence: divergent
  code: |
    let a = 1;
    let mut b = a;
    b = 2;                  // a 仍是 1 —— @note 整数实现了 Copy，赋值即复制

    let s1 = String::from("hello");
    let s2 = s1;            // @note! 这不是复制，是「移动」：s1 之后不可再用
    // println!("{s1}");    // 编译错误：borrow of moved value

    let s3 = s2.clone();    // @note 想真复制必须显式 clone

    // @note 与 JS 最根本的差别：默认不可变 + 默认移动，
    //       「复制」和「共享」都得你亲手写出来
