  - featureId: basics-javascript/ternary
    equivalence: divergent
    code: |
      // @note! Rust 没有三元运算符 —— if 本身就是表达式，不需要它
      let label = if score >= 60 { "及格" } else { "不及格" };

      // 两个分支的类型必须完全一致
