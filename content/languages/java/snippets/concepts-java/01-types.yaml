snippets:
  - featureId: concepts-java/type-system
    equivalence: identical
    code: |
      int n = 1;                  // 类型属于变量，编译期检查
      String s = 1;               // 编译错误 —— 编译器直接拦住
    body: |
      Java 是**静态类型**：类型属于变量与表达式，编译期就检查，运行之前 `javac`
      已经拦掉一大类错误。类型还是**名义式**的 —— 一个值能不能当某物用，看的是
      它声明的类型，对不上就是编译错误。

  - featureId: concepts-java/numeric-type
    equivalence: identical
    code: |
      int max = Integer.MAX_VALUE;
      max + 1                     // -2147483648 —— 整数溢出静默回绕
      BigDecimal exact = new BigDecimal("0.1");
    body: |
      Java 的数值是一组**原始类型**：`int`、`long`、`double` 等，各有固定宽度的二进制
      表示，整数溢出会**静默回绕**（`Integer.MAX_VALUE + 1` 是负数），
      精确十进制用 `BigDecimal`、大整数用 `BigInteger`。宽度是要自己选的：
      用 `int` 还是 `long`、够不够表示业务值，得在写的时候就定下来。

  - featureId: concepts-java/null-value
    equivalence: identical
    code: |
      String s = null;            // 只有一种 null，且只能赋给引用类型
      s.length()                  // 抛 NullPointerException
      Optional.ofNullable(s);     // 把「可能没有」编码进类型
    body: |
      Java 里 `null` 只有一种，但它只能赋给**引用类型**（`int` 这类原始类型不能为 null），
      访问 null 引用会抛 `NullPointerException` —— 那个著名的「十亿美元错误」。
      近年用 `Optional` 把「可能没有」编码进类型。

  - featureId: concepts-java/value-semantics
    equivalence: identical
    code: |
      int a = 1; int b = a;       // 原始类型按值复制
      Object o = new Object();    // 对象按引用，赋的是引用
      final int F = 1;            // final 只约束不能重新绑定
    body: |
      Java 区分得很清楚：**原始类型按值**（`int a = b` 复制），**对象按引用**
      （赋的是引用，两个名字指向同一个对象），`final` 只约束「不能重新绑定」。
      装箱类型（`Integer` 与 `int`）之间的自动转换是这套语义的常见暗礁。
