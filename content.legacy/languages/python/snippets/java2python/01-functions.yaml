      def connect(host, port=5432, timeout=30):   # @note 原生语法，不用写重载
          ...

      # @note! 与 Java 最危险的一处差异：默认值只在定义时求值一次
      def collect(item, bucket=[]):
          bucket.append(item)
          return bucket

      # 正统写法：用 None 当哨兵
      def collect(item, bucket=None):
          bucket = [] if bucket is None else bucket
          bucket.append(item)
          return bucket
