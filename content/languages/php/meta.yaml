id: php
name: PHP
shortName: PHP
aliases: [php8]
version: '8.5'
fileExtension: .php
comment:
  line: '//'
  block: ['/*', '*/']
shikiLang: php
paradigm: [procedural, oop, multi-paradigm]
# 类型声明可选、且默认不做强制检查 —— 是渐进式而不是动态（与 Python 同类，与 JS 不同）
typing: gradual
memoryModel: gc
# 共享无状态的请求模型：一次请求一个进程，没有语言级的并发原语
concurrency: []
baseline: false
links:
  - label: PHP 官方手册（中文）
    url: https://www.php.net/manual/zh/
