    func add(a int, b int) int {        // @note 返回类型写在参数括号**后面**
        return a + b
    }

    func add2(a, b int) int { return a + b }   // @note 同类型参数可合并

    func div(a, b int) (int, error) { }        // @note 多返回值写在括号里

    // @note Go 支持顶层函数（不需要类），这点比 Java 自由
  review:
