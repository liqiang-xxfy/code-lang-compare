# 速语词典 —— 从 JavaScript 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 是 error，写第三门会被拦下）
#
# 选词标准：**同名不同义**优先。含义相同的词（函数、循环、字符串）不必收 ——
# 读者不会误解的东西，收了只是稀释。

- term: const
  aliases: [const, final]
  perLanguage:
    javascript: const 只表示「不能再赋值」，对象内容随便改
    dart: const 是编译期常量、深度冻结；「只锁绑定」那一档叫 final
  note: |
    三个关键字在两边对不上号，这是最需要重新记的一处。
    JS 的 const ≈ Dart 的 final；Dart 的 const 比 JS 的 const 强得多。

- term: 相等
  aliases: [equality, identical]
  perLanguage:
    javascript: '`===` 严格比较、`==` 宽松比较；没有 identical'
    dart: '`==` 是值相等；判同一实例用 `identical(a, b)`，没有 `===`'
  note: |
    Dart 的 `==` 跨数值类型也相等（`1 == 1.0` 为 true）。
    要判「是不是同一个对象」得用 identical。

- term: 数值
  aliases: [int, double, number]
  perLanguage:
    javascript: 只有一个 number（双精度浮点）
    dart: 有 int 与 double 之分；`/` 给小数，整除用 `~/`，`%` 永远非负
  note: |
    取模非负是与 JS 最危险的差异：`-7 % 3` 在 Dart 是 2。
    要带符号余数用 remainder()。

- term: 泛型
  aliases: [generic, variance]
  perLanguage:
    javascript: 没有类型参数
    dart: 协变且具体化 —— `x is List<int>` 运行期能判断，但协变带来运行期类型错误
  note: |
    具体化（reified）是 Dart 的特色：类型参数在运行期保留。
    代价是 List<num> 里塞 double 会在运行期抛 TypeError。

- term: isolate
  aliases: [isolate, worker, concurrency]
  perLanguage:
    javascript: Worker 之间不能共享可变对象，靠消息传递
    dart: isolate 内存隔离，没有锁、没有原子类型，靠消息传递
  note: |
    两者都不共享内存，但 Dart 的并发单元是 isolate（独立内存 + 独立事件循环）。
    因为没有共享，锁与原子类型这整套概念失去了对象。

- term: Future
  aliases: [future, promise, async]
  perLanguage:
    javascript: Promise；Promise.all 首个拒绝即返回
    dart: Future；Future.wait 默认等全部完成才报第一个错误
  note: |
    Future 与 Promise 大体对应，但 wait / all 的失败时机相反。
    要快速失败得给 Future.wait 传 eagerError: true。

- term: Stream
  aliases: [stream, observable]
  perLanguage:
    javascript: 没有内建 Stream；用事件、异步迭代器或库
    dart: 内建 Stream，默认单订阅；广播流要显式创建
  note: |
    Dart 的 Stream 是被语言内建支持的异步序列，默认只能消费一次。
    它也是唯一能真正取消的东西（StreamSubscription.cancel）。

- term: 断言
  aliases: [assert]
  perLanguage:
    javascript: 没有语言级 assert（console.assert 只是打印）
    dart: 有 assert，但默认关闭，只在 --enable-asserts 或 debug 下生效
  note: |
    别用 assert 做生产期的参数校验 —— 发布构建里它被整个忽略。
    要真校验就 throw。

- term: 空安全
  aliases: [null-safety, nullable]
  perLanguage:
    javascript: null / undefined 通用，出错在运行时
    dart: 空安全默认开启（健全空安全），可能为空的值要标 `?`
  note: |
    Dart 的空安全是「健全」的：类型系统保证非空类型真的不会是 null。
    这与 JS 的「空值满天飞」正相反，是从 JS 过来明显更省心的一块。

- term: 反射
  aliases: [reflection, mirrors]
  perLanguage:
    javascript: Reflect / Proxy 等是语言内建，到处能用
    dart: dart:mirrors 只在 Native 的 JIT 上（Experimental），Flutter / AOT / web 都没有
  note: |
    运行期反射在多数部署形态下不可用，所以 Dart 生态靠 build_runner 做编译期代码生成。
