- featureId: basics/immutable-primitives
  equivalence: divergent
  code: |
    a := 1
    b := a
    b = 2
    // a 仍是 1 —— @note 基本类型按值复制

    type Point struct{ X, Y int }
    p1 := Point{1, 2}
    p2 := p1
    p2.X = 99
    // p1.X 仍是 1 —— @note! 结构体也是值拷贝（Go 与 JS / Java 的显著差异）

    s1 := []int{1, 2}
    s2 := s1
    s2[0] = 99
    // s1[0] 也变成 99 —— @note! 切片是「描述符 + 底层数组」，赋值共享底层数据

    // @note Go 的规则是「一切按值传递」，但 slice / map / channel 的「值」本身是引用语义的描述符
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'
