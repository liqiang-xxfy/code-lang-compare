# JavaScript 视角下的「基础表达」章节分组。
#
# 章节名、分组、顺序都**只对这一门基准生效** —— 读者以 JavaScript 为参照系时，
# 左栏与矩阵的行就长这样。换成 Python 基准，看到的是同目录下 python.yaml 那一套。
#
# `features` 里写的是池（features.yaml）里的 feature id。同一个知识点可以在不同基准下
# 落在不同的章里，而**它的内容只写一份** —— 见 docs/对比内容架构.md §2.5。

section: express
baseline: javascript

chapters:
  - id: bindings
    title: 变量、作用域与提升
    summary: 声明、可变性、作用域与遮蔽
    features: [declaration, mutability, scope, hoisting, shadowing]

  - id: values
    title: 类型与值
    summary: 字面量、类型推断与空值
    features: [literals, type-inference, null-and-undefined, type-conversion]

  - id: operators
    title: 运算符与相等
    summary: 算术、逻辑与相等判定
    features: [arithmetic, equality, logical, operator-overloading]

  - id: control-flow
    title: 控制流
    summary: 分支、循环与迭代
    features: [conditionals, loops, iteration-protocol, switch-and-match]

  - id: functions
    title: 函数与参数
    summary: 定义、传参、返回与闭包
    features: [function-declaration, parameters, variadic, return-values, closures]

  - id: strings
    title: 字符串与容器
    summary: 字符串操作、数组与映射
    features: [string-literals, string-common-ops, arrays, maps]
