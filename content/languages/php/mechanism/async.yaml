  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-async-v1
    generatedAt: '2026-10-04'

boxes:
  event-loop:
    code: |
      // @note! PHP 核心**没有事件循环** —— 没有 loop、没有调度器
      // @note 核心只有底层的 I/O 多路复用：
      $r = [$socket]; $w = null; $e = null;
      stream_select($r, $w, $e, 1, 0);   // @note 这就是核心的全部「事件」能力
      // @note 它是**阻塞式的一次查询**，不是「注册回调然后一直跑」的循环

      // @note 脚本的真实形态是**同步的**：从第一行跑到最后一行，跑完进程结束
      $data = file_get_contents('https://example.com/a');   // @note 阻塞到拿完
      $more = file_get_contents('https://example.com/b');   // @note 再阻塞一次
      // @note 两次请求串行，总耗时是两者之和

      // @note! 想要事件循环，路子只有两条，**都不在核心**：
      // @note   ① 用户态库：ReactPHP / Amp / Revolt（纯 PHP 实现）
      // @note   ② PECL 扩展：Event（libevent 移植）/ Ev / Eio
      // @note 另有 Swoole（扩展，自带协程与事件循环，改写了整个运行模型）

      // @note 本机实测的否定结论：class_exists('EventBase') 为 false —— 没装
    vs:
      javascript: |
        **这一格是两边差别最根本的地方**。JavaScript 的运行时
        **本身就是**一个事件循环：所有 I/O 都是异步的，
        回调与微任务排队执行，「跑完一行等下一行」需要显式写 `await`。
        PHP 反过来：脚本是**同步顺序执行**的，每个 I/O 调用
        老老实实阻塞到返回 —— 事件循环要另外引库或装扩展。
        也就是说 JavaScript 那边「异步」是默认、同步要刻意做，
        PHP 这边「同步」是默认、异步要刻意做。
        另一处是这个差异的后果：那边的服务器能在单线程上撑住大量并发连接，
        这边「一个请求一个进程」的模型靠**多开进程**来扛 ——
        这也是 PHP 经典部署形态（Nginx + 一堆 FPM 进程）的由来。
      python: |
        Python 把两条路都放在标准库里：同步代码是一般写法，
        而 `asyncio` 提供完整的事件循环、`async` / `await` 语法、
        任务调度 —— `asyncio.run(main())` 就能跑起来。
        PHP **标准库里什么都没有**：核心只有 `stream_select()`，
        想要事件循环得引 ReactPHP / Amp / Revolt 这种第三方，
        或者装扩展。
        所以两边都能写异步，但一边是「语言自带的一等公民」，
        另一边是「生态补上的能力」。共同点是两边都保留了
        同步阻塞的写法作为默认（PHP 是唯一写法，Python 至今仍是主流）。
      java: |
        Java 传统上是**同步阻塞 + 线程池**：想要并发就多开线程，
        让每个线程各阻塞各的。PHP 连这条路都没有 ——
        **核心没有线程**，所以「同步阻塞」就真的是一个个排队。
        Java 较新版本有 `CompletableFuture` 与虚拟线程，
        Netty 这类框架也提供事件循环；PHP 这边对应的东西
        全在扩展与第三方库里。
        另一处是「谁在扛并发」：Java 靠线程池（一个进程内），
        PHP 靠进程池（FPM 起一堆进程）—— 后者的内存开销大得多，
        也正是 PHP 单请求内存必须小的原因。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  callback:
    code: |
      // @note 回调本身在 PHP 里是**一等公民** —— 这一格反而是 PHP 的强项
      // @note 一个「可调用」可以是：闭包、箭头函数、字符串函数名、
      // @note 数组 [对象, 方法]、静态数组 [类名, 方法]、或第一类可调用

      array_map(fn($n) => $n * 2, [1, 2, 3]);

      $f = strlen(...);                 // @note! 8.1 起的第一类可调用语法
      echo $f('abcd');                  // @note 4

      usort($list, fn($a, $b) => $a <=> $b);
      preg_replace_callback('/\d+/', fn($m) => "[{$m[0]}]", 'a1b2');

      // @note 8.5 起还有管道运算符 `|>`，能把值串过一串可调用
      // @note   $out = ' hello ' |> trim(...) |> strtoupper(...);

      // @note! 但**回调不等于异步** —— PHP 的回调绝大多数是**同步调用**：
      // @note! array_map 会等在回调返回之后才继续，它是「把函数当参数」，
      // @note! 不是「把事情丢出去稍后通知你」
      // @note! 真正的异步回调要等事件循环，那要引库（见上一格）

      // @note 「回调地狱」在 PHP 里其实少见，因为同步顺序执行的代码
      // @note 本来就是一维的；嵌套回调主要出现在「回调即异步」的那类生态里
    vs:
      javascript: |
        两边的回调机制高度相似：都是「把函数当值传」，
        连 `array_map(cb, arr)` ↔ `arr.map(cb)` 的形状都一样。
        差别在**回调什么时候被执行**：JavaScript 的回调
        常常是**异步**的（I/O 完成后由事件循环调），
        所以顺序要靠 Promise / async 来理；
        PHP 的回调**几乎全是同步**的（`array_map`、`usort`、
        `preg_replace_callback` 都是当场调用、当场返回）——
        也就是说 PHP 里没有「回调地狱」这个经典问题，
        因为根本没有异步的回调。
        另一处是写法：JavaScript 的箭头函数是主要形态，
        PHP 到 7.4 才有箭头函数（之前只有 `function () use (...)`），
        8.1 又补了第一类可调用语法。
      python: |
        Python 的函数也是一等值，`map` / `filter` / `sorted(key=...)`
        都能接回调 —— 与 PHP 逐条对应（`array_map` / `array_filter` / `usort`）。
        差别在**装饰器**：Python 有一整套 `@decorator` 语法，
        回调与元编程结合得深；PHP 没有装饰器语法，
        8.0 起的 `#[...]` **属性**是纯元数据（不执行代码），
        与 Python 的装饰器不是一回事。
        另一处是「回调是不是异步」：Python 的 `asyncio`
        让回调可以挂在事件循环上；PHP 核心的回调全是同步的。
        共同点是两边都能把任意可调用当值传。
      java: |
        Java 到 8 才有 lambda，之前要写匿名内部类 ——
        所以「把函数当参数」这件事在 Java 里比 PHP 晚得多、也重得多。
        PHP 的闭包、箭头函数、第一类可调用三种写法都能用，
        而且 `array_map` 这类函数从很早就接受「字符串函数名」这种形式。
        差别在**类型**：Java 的 lambda 必须匹配一个函数式接口
        （`Comparator<T>`、`Runnable`…），签名不匹配编译不过；
        PHP 的 `callable` 是个宽泛的形状式类型，
        接不接受要到运行时才知道（而且 `callable` **不能做属性类型**）。
        另一处是异步：Java 有 `CompletableFuture` 能把回调串起来，
        PHP 核心连异步回调都没有。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  promise-future:
    code: |
      // @note! PHP 核心**没有 Promise / Future** —— 无此概念
      // @note 本机实测：class_exists('Promise') 与 class_exists('Future')
      // @note 都是 false，核心包里一个都没有

      // @note 名字里带 Future 的只有 `parallel\Future`（PECL 扩展，本机没装）：
      // @note   它表示「另一个线程里正在跑的任务」，用 ->value() 取值（会阻塞）

      // @note 生态里的 Promise 都在第三方库里：
      // @note   · ReactPHP 有自己的 Promise 实现（deferred / then / catch）
      // @note   · Amp 用的是 Future + 协程
      // @note   · Guzzle 也带一套 Promise（给并发 HTTP 用）
      // @note 这些**互相不兼容**，各有各的 await 语义

      // @note 而在最主流的写法（同步阻塞）里，根本不需要 Promise：
      $a = file_get_contents($urlA);     // @note 阻塞
      $b = file_get_contents($urlB);     // @note 再阻塞
      // @note 两次串行。想并发得引库（Guzzle 的 Pool、ReactPHP 的 all()）

      // @note! 这也是为什么 PHP 生态里 Promise 的普及度远低于其他语言 ——
      // @note! 「一个请求一个进程、跑完就死」的模型下，
      // @note! 请求内并发的收益有限，而引一套异步框架会改写整个调用栈
    vs:
      javascript: |
        JavaScript 的 Promise **是语言的一部分**：`new Promise`、
        `then` / `catch` / `finally`、`Promise.all` / `race` / `allSettled`
        全在运行时里，而且 `await` 直接消费 Promise。
        PHP **核心一样都没有** —— Promise 只存在于第三方库里，
        而且各家实现互不兼容（ReactPHP 的与 Guzzle 的就不是一个东西）。
        也就是说 JavaScript 那边「并发几个请求然后等全部完成」
        是一行 `Promise.all`，PHP 这边要么用库、要么串行、
        要么自己开多进程。
        另一处是错误传播：Promise 的 rejection 是链式的、有明确语义；
        PHP 生态里各家的错误模型不统一，切换库就等于换一套语义。
      python: |
        Python 的 `asyncio.Future` / `Task` 在**标准库**里，
        与 `async` / `await` 语法配套；`gather` 相当于 `Promise.all`。
        PHP **标准库里没有** Future 或 Promise，
        第三方库又各做各的。
        差别在「有没有统一语义」：Python 的 Future 只有一套
        （标准库那套），所有库都基于它；
        PHP 这边 ReactPHP / Amp / Guzzle 各有各的 Promise 实现，
        互相桥接要靠适配器 —— 这是没有语言级原语的直接代价。
        共同点是两边的「并发等待」都最终要落到一个事件循环上，
        Python 的循环在标准库，PHP 的循环在第三方库里。
      java: |
        Java 的 `Future` / `CompletableFuture` 在**标准库**里，
        配套还有 `ExecutorService` 线程池，`allOf` / `anyOf`
        相当于 `Promise.all` / `race` —— 一整套都在 JDK 里。
        PHP 核心一个都没有，最接近的 `parallel\Future`
        还是个 PECL 扩展，而且语义是「另一个线程里的任务」，
        不是「一个可组合的承诺」。
        另一处是组合能力：`CompletableFuture` 能链式组合、异常恢复、
        超时控制；PHP 生态里的 Promise 实现能力参差，
        而且要先把整个调用栈改成异步风格才用得上。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  async-await:
    code: |
      // @note! PHP **没有 async / await 这两个关键字** —— 语法层面就不存在
      // @note! `Fiber`（8.1）只做「协作式挂起 / 恢复」，
      // @note! **不含调度器**，官方 RFC 明说它是给库作者用的底层原语，
      // @note! 不该在业务代码里直接用

      $f = new Fiber(function (): void {
        $x = Fiber::suspend('把控制权交出去');   // @note 像 await 的那一半
        echo $x;
      });
      $f->start();                        // @note 跑到 suspend 停住
      $f->resume('继续');                  // @note 谁来 resume？—— 没人管，你自己管

      // @note! 这就是它和 await 的关键差别：
      // @note! `await` 会**自动**把控制权交给调度器，等 I/O 好了再回来；
      // @note! `Fiber::suspend()` 只是停下，**什么时候恢复、由谁恢复，核心不管**
      // @note! 官方把事件循环明确留给了框架 —— 所以 Fiber 是「积木」不是「特性」

      // @note 真正的 async 写法在生态里：
      // @note   · Amp / Revolt：把 Fiber 包成协程，提供 await 风格的 API
      // @note   · Swoole：自带协程（`Co\run` + 协程化 I/O），改写运行模型
      // @note 这些都不是语言的一部分，换库就要换一套写法
    vs:
      javascript: |
        JavaScript 的 `async` / `await` 是**语法**：
        函数标 `async`、调用时 `await`，控制权自动交给事件循环再回来。
        PHP **没有这两个关键字** —— 最接近的 `Fiber::suspend()` 只有
        「停下」这一半，没有「自动恢复」那一半，调度得自己写。
        所以 PHP 的异步体验是「用库模拟出来的语法」，
        而不是引擎给的语法。
        另一处是传染性：JavaScript 的 `async` 会沿着调用链传染
        （调用者也得 async），PHP 的 Fiber 同样要求调用栈配合，
        但因为没有语法标记，传染这件事变得**隐式**、更难看出来。
      python: |
        Python 的 `async` / `await` 也是**语法**（3.5 起），
        配套 `asyncio.run()` 与事件循环 —— 也就是说「异步」在那里
        是写进语法的东西。PHP 一样都没有，只有 Fiber 这个底层原语。
        差别在**标准库的厚度**：Python 的事件循环、任务调度、
        超时、同步原语（`asyncio.Lock` / `Queue`）全在标准库里，
        所以「写异步」是一件自足的事；
        PHP 要把这些都从第三方库或扩展里凑齐，
        而且选哪套库会决定你的整个代码风格。
        共同点是两边都要求「一路异步到底」，
        中间混进一个阻塞调用就会卡住整个循环。
      java: |
        Java 到较新版本才有虚拟线程，让「同步写法获得并发能力」，
        之前主流的异步写法是 `CompletableFuture` 的链式回调
        （`thenApply` / `thenCompose`），不是 `async` / `await` 语法。
        PHP 既没有 `async` / `await`，也没有虚拟线程，
        只有 Fiber 这个原语加一堆上层库 —— 也就是说
        Java 那边「让同步写法获得并发能力」这条路线，PHP 至今没有。
        两边的共同点是都在处理同一个问题：**怎么在等 I/O 的时候
        不占着执行流**；区别是 Java 把答案做进了语言与标准库，
        PHP 把它留给了生态。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  cancellation:
    code: |
      // @note! PHP 核心**没有取消机制** —— 没有 CancellationToken、
      // @note! 没有 AbortSignal 那种东西。一旦开始执行，就只能跑完

      // @note 能做的三件事，都是「绕」：
      // @note   ① 超时：给 stream / socket 设超时，让 I/O 自己失败
      $ctx = stream_context_create(['http' => ['timeout' => 3]]);
      file_get_contents($url, false, $ctx);        // @note! 超时抛 Warning，不是取消

      // @note   ② 自己检查标志位（协作式取消）—— 约定靠应用层
      foreach ($items as $it) {
        if ($shouldStop()) { break; }              // @note 只有轮询到才停得下来
        work($it);
      }

      // @note   ③ 硬停：set_time_limit 会中断脚本，但那是致命错误不是取消
      // @note 进程层面还有 pcntl 的信号（Unix）—— 但那是「杀掉」不是「优雅取消」

      // @note 生态里：ReactPHP 的 Promise 有 cancel()、
      // @note Amp 有 CancellationToken、Guzzle 支持传 AbortSignal 类的东西 ——
      // @note 都是各自设计的，互不通用，而且只在异步调用链里有效

      // @note! 根因还是那个执行模型：**同步阻塞的代码没有「取消点」** ——
      // @note! 一行 file_get_contents 卡在那里时，没有任何代码有机会跑
    vs:
      javascript: |
        JavaScript 的取消靠 `AbortController` / `AbortSignal`，
        已经是运行时的一部分，`fetch` 等一批 API 原生支持
        （`fetch(url, { signal })`）。PHP **核心没有对应物** ——
        最接近的是给 stream 设超时，那只能让 I/O 自己失败，
        不是「调用方主动取消」。
        也就是说 JavaScript 那边「这个请求我不要了」是一行代码，
        PHP 这边只能等它超时或者把进程杀掉。
        另一处是异步前提：那边的取消之所以有效，是因为控制权
        经常回到事件循环，有机会检查信号；PHP 的同步代码里
        **根本没有可以插入检查的时刻**。
      python: |
        Python 的 `asyncio` 有完整的取消机制（`Task.cancel()`、
        `CancelledError` 会抛进协程里），同步代码里也能靠超时与信号
        （`signal.alarm`）做粗粒度中断。
        PHP **核心什么都没有**：`set_time_limit` 是「到点抛致命错误」，
        不是可捕获的取消；同步 I/O 卡住时也没有插检查的机会。
        差别在**取消是不是可捕获的事件**：Python 的 `CancelledError`
        是异常，可以被 `finally` 收拾；PHP 的超时是致命错误，
        清理逻辑能不能跑完都不一定。
        共同点是两边都要求代码「配合」才能优雅取消 ——
        但 Python 有语言级的钩子，PHP 只能靠约定。
      java: |
        Java 的取消是**中断模型**：`Thread.interrupt()` 设标志位、
        阻塞方法抛 `InterruptedException`、`Future.cancel()` 还能尝试打断。
        这是一套语言与标准库协同的机制。
        PHP 没有线程，也就没有中断；进程级别的 `pcntl` 信号（Unix）
        更接近「杀」而不是「取消」。
        另一处是「能不能中途退出」：Java 的阻塞调用会因为中断抛异常，
        给你一个可捕获的清理点；PHP 的阻塞调用只会在超时后失败，
        而且失败形式是 Warning 或致命错误，清理时机不可靠。
        两边的共同点是都承认「只有协作式的取消才优雅」；
        区别在有没有一套现成的钩子来协作 —— Java 有，PHP 没有。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
