# 模板：一门语言在 mechanism 板块、types 存放组下的内容。
#
# 允许的 key 见 content/catalog/mechanism/features.yaml 里 `group: types` 的那批
# feature id（static-vs-dynamic / type-annotation / structural-nominal / type-narrowing /
# null-safety / type-assertion）。完整约定见 ../../express/bindings.yaml 与 ../../README.md。

review:
  state: draft

boxes:
  static-vs-dynamic:
    code: |
      // 这门语言在什么时候检查类型
      // @note 与某个基准的关键差别，贴在这一行上
    vs:
      javascript: |
        与 JavaScript 相比……
      python: |
        与 Python 相比……
      java: |
        与 Java 相比……
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent
