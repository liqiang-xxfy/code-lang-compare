  - featureId: basics-python/array-map-filter
    equivalence: analogous
    code: |
      xs.map((x) => x * 2);                        // @note 链式方法，对应推导式
      xs.filter((x) => x > 0);
      xs.map((x) => x * 2).filter((x) => x > 0);   // 这个顺序读起来是"先映射再过滤"

      xs.reduce((acc, x) => acc + x, 0);           // @note reduce 是数组方法，不用额外 import

      // @note! 每个方法都新建一个数组并**立刻求值**，不像 Python 的 map/filter 是惰性迭代器；
