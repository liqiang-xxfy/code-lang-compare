  - featureId: basics-python/string-raw-escape
    equivalence: absent
    code: |
      // @note! 没有原始字符串：反斜杠一律双写
      String path = "C:\\new\\test";
      java.util.regex.Pattern.compile("\\d+\\.\\d+");

      // 文本块也不关闭转义（只是额外加了 \ 续行与 \s 空格），所以帮不上忙
      String p2 = """
              C:\\new\\test""";

      // Unicode 转义用 \uXXXX，且是**编译期**处理，固定 4 位
      String emoji = "\uD83D\uDE00";   // @note 代理对要写两段
    body: |
      Java 没有原始字符串字面量。正则和 Windows 路径这类"反斜杠密集"的场景，
      只能把每个反斜杠双写 —— 这也是 Java 里 `Pattern.compile("\\d+")`
      遍地都是的原因。

      文本块（Java 15+）解决的是换行与缩进，**不关闭转义处理**：
      `\n` 在文本块里依然是换行，`\t` 依然是制表符。它新增的 `\` 续行与 `\s`
      是用来控制空白的小工具，与"原样保留"是两回事。

      所以从有 `r""` 的语言迁过来时，最该建立的反射是：
      **看到反斜杠先想"这里要不要写两遍"**，而不是先想正则对不对。
