# kotlin —— mechanism / async
#
# boxes 的 key 必须是 catalog/mechanism/features.yaml 里 `group: async` 的那批：
# event-loop / callback / promise-future / async-await / cancellation。
#
# 口径说明：**cancellation 是整组最承重的一格**，而且它的坑很具体：
# 取消是靠抛一个特殊异常实现的，所以 `catch (e: Exception)` 会把它一起吞掉，
# 协程从此不再响应取消却仍被标记为已取消。这条必须写，
# 而且要配上 `finally` + `NonCancellable` 的清理写法。
# 另一条要澄清的是**取消是协作式的** —— 纯计算不检查取消就跑到底。

