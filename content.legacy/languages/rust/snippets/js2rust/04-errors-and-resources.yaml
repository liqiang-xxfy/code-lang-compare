      fn parse(s: &str) -> Result<i32, std::num::ParseIntError> { s.parse() }
      // @note! "会失败"写在返回类型上 —— 调用方忘了处理就编译不过

      match parse("42") {
          Ok(n) => println!("{n}"),
          Err(e) => println!("出错了：{e}"),
      }

      // @note! 两条路：可恢复的失败用 Result（是返回值，不是控制流）；
      // 不可恢复的用 panic!（用于"程序有 bug"，不是正常错误处理）
  - featureId: js2rust/exception-model
    equivalence: divergent
    code: |
      match s.parse::<i32>() {
          Ok(n) => Ok(n * 2),
          Err(_) => Ok(default_value),
      }
      // @note! Result 是返回值，没有"跳过后面所有代码"的能力 —— 每一步都要显式接住

      fn double(s: &str) -> Result<i32, std::num::ParseIntError> {
          let n = s.parse::<i32>()?;             // @note! ? 等价于"出错就提前 return Err"
          Ok(n * 2)
      }
      // @note! ? 只能用在返回 Result / Option 的函数里 —— 所以函数签名会诚实地跟着改

      // r.unwrap_or(0) / r.expect("必须有值") / r.ok()
      // @note! unwrap() 是断言"我确定不会失败"，生产路径上要克制
  - featureId: js2rust/error-propagation
    equivalence: divergent
    code: |
      fn load(path: &str) -> Result<Config, ConfigError> {
          let text = std::fs::read_to_string(path)?;   // @note! 出错就提前返回
          let cfg: Config = toml::from_str(&text)?;
          Ok(cfg)
      }

      // @note! 调用链上每层可能返回不同的错误类型，? 要求 Err 能转换过去。三种解法：
      // 1. Box<dyn Error> —— 原型最快，丢类型信息
      enum ConfigError { Io(std::io::Error), Parse(toml::Error) }   // 2. 自定义 enum + From
      impl From<std::io::Error> for ConfigError {
          fn from(e: std::io::Error) -> Self { ConfigError::Io(e) }
      }
      // 3. thiserror（库）/ anyhow（应用）—— 实践里最常见

      // @note! 没有 throw：只有"返回 Err"。错误类型是签名的一部分，调用方 match 就能穷尽处理
      // @note 代价是每加一种错误都要改签名 —— 这正是"显式"的另一面
  - featureId: js2rust/resource-cleanup
