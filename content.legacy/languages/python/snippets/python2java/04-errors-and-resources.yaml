  - featureId: python2java/errors-exercise
    equivalence: identical
    code: |
      import json

      class ConfigError(Exception):
          pass

      def load_config(path):
          try:
              with open(path) as f:          # @note 无论成功失败都会关闭
                  raw = f.read()
          except FileNotFoundError as e:     # @note 与解析失败区分开
              raise ConfigError(f"找不到配置：{path}") from e
          except OSError as e:
              raise ConfigError(f"读不了配置：{path}") from e

          try:
              return json.loads(raw)
          except json.JSONDecodeError as e:
              raise ConfigError("配置不是合法 JSON") from e
