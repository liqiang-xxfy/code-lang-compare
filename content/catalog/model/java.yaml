# Java 视角下的「数据与抽象」章节分组 —— 与 javascript.yaml / python.yaml 又一套。
#
# 两处按 Java 心智模型做的调整：
#   1. **顺序不同**：接口与抽象类**排在类之前**。Java 里先有契约（接口）再有实现，
#      这是读 Java 代码时最要紧的一层；JS 视角里抽象排在最后（对象是基础，抽象是补丁）。
#   2. 结尾两章换成「集合框架」与「流与迭代」—— Java 的集合是**框架**（一套接口谱系
#      加若干实现），不是几个内建类型，所以要先讲框架再讲 Stream。

section: model
baseline: java

chapters:
  - id: packages
    title: 包与模块
    summary: package、import 与 module-info
    features: [module-unit, export-import, default-vs-named, namespace-alias, module-resolution]

  - id: errors
    title: 异常与资源管理
    summary: 受检异常、异常链与 try-with-resources
    features: [throw-raise, try-catch, finally-cleanup, error-types, custom-error, error-propagation]

  - id: abstraction
    title: 接口与抽象类
    summary: 契约先于实现
    features: [interface, abstract-class, mixin-trait, duck-typing]

  - id: objects
    title: 类与成员
    summary: 构造、字段、方法与可见性
    features: [class-declaration, constructor, fields-and-properties, methods-and-receiver, inheritance, access-control]

  - id: collections
    title: 集合框架
    summary: List / Map / Set 的谱系与选择
    features: [list-array, map-dict, set, tuple-record, collection-mutability, slicing]

  - id: streams
    title: 流与迭代
    summary: Stream、Optional 与惰性管道
    features: [generator-yield, comprehension, lazy-evaluation, destructuring]
