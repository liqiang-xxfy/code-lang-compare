  - featureId: basics-python/function-docstring
    equivalence: absent
    code: |
      /**
       * 打个招呼。
       *
       * @param name 名字
       * @return 问候语
       */
      static String greet(String name) { return "你好，" + name; }

      // @note! Javadoc 是**注释**，运行时拿不到：没有 __doc__ 这样的属性
      // greet.getClass().getMethod("greet", String.class).getDocComment();   // 不存在

      // @note 反射能拿到方法名、参数类型、注解，但拿不到文档文本
      // @note 想从代码里提取文档只能解析源码（Javadoc 工具就是这样做的）
    body: |
      Java 的文档是**注释**（Javadoc），不是数据。运行时通过反射能拿到
      方法名、参数类型、注解，但**拿不到文档文本** —— 它根本不进字节码
      （除非特意开启参数名保留等编译选项，而那也只是一部分信息）。

      由此带来两个连锁差异：

      1. **文档无法被程序消费**。没有 `help(obj)` 这种运行时读文档的能力；
         想生成文档站在构建期解析源码（`javadoc` 工具做的正是这件事）。
      2. **没有"必须写在最前面"的约束**。注释放哪里都行，
         所以也少了"位置不对就不是 docstring"这类静默失效 ——
         代价是位置错了也没人提醒。

      反过来，注解（`@Override`、`@Deprecated`）是**真的数据**，
      能被反射读到并影响行为 —— 那是与注释完全不同的另一套机制。
  - featureId: basics-python/arg-passing
    equivalence: analogous
    code: |
      static void mutate(java.util.List<Integer> items) { items.add(4); }   // @note 看得见
      static void rebind(java.util.List<Integer> items) { items = java.util.List.of(9); }  // 看不见

      var xs = new java.util.ArrayList<>(java.util.List.of(1, 2, 3));
      mutate(xs);                    // xs 变成 [1, 2, 3, 4]
      rebind(xs);                    // xs 不变

      // @note! 但基本类型是真的复制：int 传进去怎么改都不影响外面
      static void bump(int n) { n += 1; }
      int k = 1;
      bump(k);                       // @note! k 还是 1 —— 这里与 Python 的"不可变"表现一致，
                                     // 但原因不同：那边是 int 不可变，这边是值复制
