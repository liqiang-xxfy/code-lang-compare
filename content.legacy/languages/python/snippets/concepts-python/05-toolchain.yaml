snippets:
  - featureId: concepts-python/package-manager
    equivalence: identical
    code: |
      pip install requests
      uv add requests              # dev 依赖组对标 npm install -D
      uvx ruff                     # 对标 npx，临时跑一个工具
    body: |
      Python 用 `pyproject.toml`（或 `requirements.txt`）声明依赖，装进**环境**而不是
      项目目录，锁文件传统上不是标配（要另配 `pip-compile` / `uv lock`）。

  - featureId: concepts-python/dependency-isolation
    equivalence: identical
    code: |
      python -m venv .venv
      # 同一个环境里同名包只能有一个版本
      # 冲突时正确动作是建第二个 venv，不是升降级
    body: |
      Python 的环境是**全局一套**：同一个虚拟环境里，同名包只能有一个版本，
      所以「A 要 requests 2.x、B 要 3.x」的解法是**拆成两个虚拟环境**，而不是各装各的。

  - featureId: concepts-python/runner
    equivalence: identical
    code: |
      python app.py
      # 运行时就是解释器本身，不存在「平台 API 不一致」这层问题
    body: |
      Python 的运行时就是 CPython 解释器（另有 PyPy 等实现），没有「环境 API 不一致」
      这层问题，代价是**没有浏览器那套东西** —— 想做界面必须借助其他体系。

  - featureId: concepts-python/build-tool
    equivalence: identical
    code: |
      python -m build        # 只有发布时才打包成 wheel / sdist
      # 开发时不需要构建 —— 改完直接跑
    body: |
      Python 是解释执行，**开发时不需要构建**；只有发布时才打包（`python -m build`
      出 wheel / sdist）。「构建」在这里只是发布流程的一步。

  - featureId: concepts-python/test-framework
    equivalence: identical
    code: |
      def test_add():
          assert 1 + 1 == 2      # 测试就是普通函数加裸 assert
      # 发现靠命名约定：test_*.py / test_*
    body: |
      Python 的主流是 **pytest**：测试就是普通函数加裸 `assert`，`assert x == y` 直接写，
      失败信息由 pytest 重写断言生成；测试发现靠**命名约定**（文件 `test_*.py`、
      函数 `test_*`，不符合就静默不跑）。

  - featureId: concepts-python/testing-mock
    equivalence: identical
    code: |
      def test_it(monkeypatch):
          monkeypatch.setattr(api, "fetch_user", lambda: {"id": 1})
          # 直接替换属性，作用域由 fixture 管，用完自动还原
    body: |
      Python 靠**猴补丁**：`monkeypatch.setattr(obj, 'name', fake)`，直接替换某个对象上的
      属性，作用域由 fixture 管，用完自动还原。因为方法查找是运行时的、鸭子类型是常态，
      替换一个依赖通常就是换掉一个属性。

  - featureId: concepts-python/lint-format
    equivalence: identical
    code: |
      ruff check .
      ruff format .
      # 风格几乎没有可选项 —— 官方偏好就是唯一答案
    body: |
      Python 的 Ruff / Black 走的是**收敛**路线：格式化几乎没有可选项，
      官方倾向就是唯一答案，直接用生态默认值即可。

  - featureId: concepts-python/repl
    equivalence: identical
    code: |
      python
      >>> [x * 2 for x in [1, 2, 3]]
      [2, 4, 6]
    body: |
      Python 直接敲 `python` 就是 REPL，另有 `ipython` 提供更好的补全与历史。
      不建项目、不写文件就能验证一条语法或一个类型行为。
