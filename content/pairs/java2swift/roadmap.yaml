# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（java2swift），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: java2swift-1-values-and-memory
  order: 1
  title: 值语义与内存模型
  durationHint: 2-3 小时
  todo:
    - 装 Xcode（macOS）或用 Swift Playgrounds 跑通一段代码
    - 写一段熟悉的 Java 逻辑用 Swift 重写，体会「值类型是默认」
    - 验证把数组传给函数是拷贝而不是共享
    - 对照本工具「语言机制」板块里 Swift 列的「值语义」「内存管理」两格
  acceptance:
    - 能说清 struct 与 class 的取舍，以及为什么 Swift 默认用 struct
    - 能说清 ARC 与 GC 的差别，以及循环引用为什么要手动打断
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: java2swift-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 过一遍字符串、数组、字典的操作，注意字符串不能用整数下标
    - 试一次整数溢出，理解它崩溃而不是回绕
    - 把 try / finally 改成 do / catch / defer
    - 注意 `==` 比值、`===` 比引用（只对类）
  acceptance:
    - 能独立写出变量、容器、控制流、函数定义，无语法错误
    - 知道哪些写法会编译不过（字符串下标、隐式转换、值类型用 ===）
  resources:
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: java2swift-3-protocols
  order: 3
  title: 协议、扩展与可见性
  durationHint: 3-5 天
  todo:
    - 用协议 + 扩展做复用，对比 Java 的接口与默认方法
    - 用 struct 建数据模型，体会自动生成的逐成员构造器
    - 搞清 private / fileprivate / internal / public / open 的区别
    - 处理一次闭包捕获造成的循环引用（加 [weak self]）
  acceptance:
    - 能说清 Swift 的协议与 Java 接口的异同（值类型也能实现）
    - 能在需要共享状态时正确选择 class 并处理引用环
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/

- id: java2swift-4-concurrency
  order: 4
  title: 并发：async / await 与 actor
  durationHint: 3-5 天
  todo:
    - 把一段 ExecutorService 的代码改写成 async / await 与 TaskGroup
    - 用 actor 保护共享状态，理解数据竞争在编译期就被拦
    - 试一次协作式取消：cancel() 之后不检查标志，任务照样跑完
    - 对比 Swift 的 actor 与 Java 的 synchronized / 锁
  acceptance:
    - 能说清 actor 模型与共享内存加锁的差别
    - 能写出正确响应的可取消任务
  resources:
    - label: Swift 官方文档 · 并发
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/

- id: java2swift-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 Swift Package Manager 管依赖，理解它与 Maven / Gradle 的差别
    - 用 swift-testing 或 XCTest 写测试
    - 处理一次跨模块的访问控制问题（open vs public）
    - 对照本工具「工程实践」板块里 Swift 列的工具链
  acceptance:
    - 能独立搭起一个带依赖、测试的 Swift Package
    - 能说清 Swift 的构建与依赖管理和 JVM 生态的差别
  resources:
    - label: Swift 官方文档 · Package Manager
      url: https://www.swift.org/documentation/package-manager/
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
