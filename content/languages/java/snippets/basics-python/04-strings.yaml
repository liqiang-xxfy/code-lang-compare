  - featureId: basics-python/template-string
    equivalence: absent
    code: |
      // @note! 没有字符串插值，字符串里写不出变量
      String name = "Ada";
      String msg = "你好，" + name + "！";              // 只能拼
      String msg2 = String.format("你好，%s！", name);   // 或者用格式化
      String msg3 = "你好，%s！".formatted(name);        // Java 15+

      // 复杂表达式要先用变量接住，再拼进去 —— 无法在串内直接求值
    body: |
      Java 没有字符串插值。字符串字面量里的一切都是字面量，
      想把变量放进去只能拼接或走 `String.format`。

      代价不只是写起来啰嗦：**拼接顺序即求值顺序**，
      一个长表达式串里混着多个方法调用时，读的人必须自己在脑内标出
      每一段的边界。对应到 Python，f-string 的花括号同时承担了
      "这里是个表达式"和"边界在哪"两个作用，这正是它读起来更省力的原因。

      Java 15+ 的文本块（`"""`）只解决换行与缩进，不提供插值。
  - featureId: basics-python/string-methods
    equivalence: analogous
    code: |
      "  x  ".strip();             // @note 与 Python 同名（Java 11+；旧的叫 trim，只去 ASCII 空白）
      "abc".toUpperCase();         // @note 方法名驼峰，Python 叫 upper
      "abc".contains("b");         // @note! 这是个方法调用，对应 Python 的 in 运算符
      "abc".indexOf("z");          // -1 —— 与 find 一致
      "a,b".split(",");            // String[] {"a", "b"}
      String.join("\n", list);     // @note 静态方法，主语是分隔符 —— 这个顺序反而与 Python 一致
