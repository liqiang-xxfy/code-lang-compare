      class ConfigError(Exception):       # @note 统一继承 Exception，没有那个选择
          pass

      class TransientError(Exception):    # @note 判据仍在，只是不再由类型系统承载
          pass

      # @note! 别为了"像 Java"而给每个异常都造一个类：
      # ValueError / KeyError / TypeError 这些内置异常在这里是常规用法，
      # 只有确实要给调用方一个可捕获的类别时才自定义
  - featureId: java2python/errors-exercise
    equivalence: analogous
    code: |
      import json
      from pathlib import Path

      class ConfigError(Exception):
          pass

      def load_config(path):
          try:
              raw = Path(path).read_text(encoding="utf-8")     # @note 自动关闭，不用 with
          except FileNotFoundError as e:
              raise ConfigError(f"找不到配置：{path}") from e    # @note from 关联因果链
          except OSError as e:
              raise ConfigError(f"读不了配置：{path}") from e

          try:
              return json.loads(raw)
          except json.JSONDecodeError as e:
              raise ConfigError("配置不是合法 JSON") from e

      # @note! Java 版里那串 throws 替调用方做的提醒，这里没有对应物 ——
      # 要补上只能写进 docstring，或者让类型检查工具去发现
