  - featureId: basics-python/array-map-filter
    equivalence: divergent
    code: |
      xs.stream()
        .map(x -> x * 2)
        .filter(x -> x > 0)
        .toList();                               // @note 流是惰性的，但必须用 toList 收回来

      xs.stream().mapToInt(Integer::intValue).sum();          // @note 求和要转原始类型流
      xs.stream().anyMatch(x -> x > 0);
      xs.stream().allMatch(x -> x > 0);

      xs.stream().reduce(0, Integer::sum);       // @note reduce 在这里是流的方法
      // @note! 流只能消费一次，重复用会抛 IllegalStateException（与迭代器耗尽同类）
  - featureId: basics-python/array-sort
    equivalence: analogous
    code: |
      int[] a = {10, 9, 1};
      java.util.Arrays.sort(a);                  // @note! 原地改，且比的是数值本身
      // @note 与"默认按字符串比较"不同，这边数值排序不需要比较器

      java.util.List<Integer> xs = new java.util.ArrayList<>(java.util.List.of(10, 9, 1));
      java.util.Collections.sort(xs);            // 原地改，返回 void
      xs.sort(java.util.Comparator.comparingInt(u -> u));

      xs.stream().sorted().toList();             // 要副本就走流
      // @note 排序是稳定的；多字段用 Comparator.comparing(...).thenComparing(...)
      // @note! 如果元素不可比较（Mixed types），这里是编译期就过不去
  - featureId: basics-python/array-search
    equivalence: divergent
    code: |
      java.util.List<Integer> xs = java.util.List.of(10, 20, 30);
      xs.contains(20);                           // @note 布尔
      xs.indexOf(20);                            // @note! 找不到返回 -1（不抛）

      xs.stream().filter(x -> x > 15).findFirst();          // Optional<Integer>
      xs.stream().filter(x -> x > 15).findFirst().orElse(null);   // @note 带默认值

      // @note! 没有 in 运算符，一律是方法调用；而且找不到时的返回值
      // 在 contains / indexOf / findFirst 三处各不相同
  - featureId: basics-python/array-unpack
    equivalence: absent
    code: |
      // @note! 没有展开运算符，构造新列表只能逐个 add 或用流
      java.util.List<Integer> merged = new java.util.ArrayList<>(xs);
      merged.addAll(ys);

      // @note 唯一沾边的是可变参数：方法**定义与调用**处可以是若干值
      int sum(int... nums) { return java.util.stream.IntStream.of(nums).sum(); }
      sum(1, 2, 3);
      // sum(xs);                                // @note! 数组可以直接传，但 List 不行，得先转成数组

      // @note 解包成多个变量也不存在，只能逐项取值
    body: |
      Java 没有展开/解包运算符，`...` 只是可变参数的语法糖，且只作用于
      方法签名，不能用在构造表达式里。

      "把两个列表合成一个"只能 `new ArrayList<>(a)` 再 `addAll(b)`；
      "把列表摊开传给方法"要先把 `List` 转成数组（`xs.toArray(new Integer[0])`）。
      两边都要求先想清楚目标类型，而不能像 `[*a, *b]` 那样一步到位。

      可变参数本身也有个陷阱：它编译成数组，所以 `sum()` 与 `sum((int[]) null)`
      是两回事 —— 后者在方法体里会拿到一个 `null` 而不是空数组。
