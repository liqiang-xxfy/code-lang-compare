# arkts —— mechanism / async
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: async` 的那批：
# event-loop / callback / promise-future / async-await / cancellation。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：这一组里最容易写错的两件事 ——
# ① 事件循环与宏微任务不是本语言自己的规定，官方文档只有一句话；
# ② **没有 DOM 式的取消信号对象**（AbortController / AbortSignal 在 app 文档里
#    查不到依据），能写进内容的只有「哪套并发支持取消」这一层事实。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-async-v1
    generatedAt: '2026-10-03'

boxes:
  event-loop:
    code: |
      console.info("1 同步");
      setTimeout(() => console.info("5 宏任务"));
      Promise.resolve().then(() => console.info("3 微任务"));

      async function f(): Promise<void> {
        console.info("2 await 之前是同步的");   // @note! 这一行不在微任务里
        await null;
        console.info("4 await 之后进微任务队列");
      }
      f();

      // 结果：1 → 2 → 3 → 4 → 5
      // @note 官方的说法只有一句：宏任务跑完先跑微任务
    vs:
      javascript: |
        事件循环两边是同一个 —— 它本来就不是语言层的规则：微任务队列由语言规范
        定义，「什么时候跑宏任务」由宿主定义。这里与 JavaScript 同一套引擎思路，
        先行后序也一致。所以这一格没有可写的差别。
      python: |
        Python 的 asyncio 是标准库给的一套循环，要 `await` 或到让出点才切换任务；
        这里的事件循环是运行时内建的：同步代码先跑完，微任务排队，再轮到宏任务。
        启动方式也不同 —— Python 要把协程显式交给循环，
        这里的 async 函数调用即开始执行（到第一个 await 为止）。
      java: |
        Java 没有事件循环：并发靠线程，阻塞就是真把线程停住。
        这里只有一条执行流在跑事件循环，所以「等」必须表现成让出 ——
        `await` 之后的代码排进微任务队列，不是另起一条执行流。
        所以 Java 里常见的阻塞式调用，在这里会把后面所有任务一起卡住。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  callback:
    code: |
      // 回调是宿主 API 常见的形态 —— 网络请求就是回调式的
      httpRequest.request(url, {
        method: http.RequestMethod.GET,
        success: (data: http.HttpResponse) => { console.info(`${data.result}`); },
        fail: (err: BusinessError) => { console.error(`${err.code}`); }
      });

      // @note 取消是销毁请求，不是传一个信号进去
      httpRequest.destroy();
    vs:
      javascript: |
        回调的形态一样，这里多一层类型：成功回调拿到什么、失败回调拿到什么，
        签名里写着。但「回调会被调几次」「会不会永远不调」类型管不了 ——
        这一点两边相同。另一处是取消的方式：这里用销毁请求（一个方法调用），
        而不是把一个信号对象传进去。
      python: |
        Python 里回调是一个普通可调用对象，语义一致。差别在默认选择：
        Python 的异步生态以协程为主，回调多见于「给已有的 future 挂个通知」；
        这里两套并存 —— 回调是宿主 API 常见的形态，Promise 是语言层的。
        两边的调试体验因此不同：回调式的错误要自己接住，
        Promise 的失败有统一的传播路径。
      java: |
        Java 的回调通常写成具名接口的 lambda（消费型、转换型各有各的名字），
        能复用也能带默认方法；这里的回调写在配置对象的字段里 ——
        成功一个、失败一个，形态更啰嗦，但一次就把两条路径都写全了，
        不会出现「只处理了成功那条」的写法。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  promise-future:
    code: |
      const p: Promise<number> = fetchCount();   // @note 三态：等待 / 成功 / 失败
      p.then((n: number) => { console.info(`${n}`); })
       .catch((e: Error) => { console.error(`${e.message}`); });

      await Promise.all([a, b]);       // @note 全部等齐
      await Promise.race([a, b]);      // @note 谁先回来算谁

      // @note 没人接住的失败有全局事件可以挂：errorManager 上的
      // 「全局未处理拒绝」事件，用来兜底与上报
    vs:
      javascript: |
        Promise 是同一个实现，行为逐条一致。这里多的是类型：标注写全之后
        回调参数自动就是对应类型，不必在回调里再断言一次。
        另一处是没人接住的失败 —— 这里有一个全局事件可以挂上去统一处理，
        JavaScript 那边只有运行时的默认行为。
      python: |
        Python 把「调度」与「结果」分成两个对象（任务与 future），这里只有一个
        Promise。写法上 Python 要把协程交给循环去跑，这里调用即开始。
        组合子两边对得上：全部等齐、谁先回来都有。差别在失败那一侧 ——
        Python 的异常一路传到 await 处，这里的失败要先被 `catch` 接住，
        否则落到全局兜底那条路。
      java: |
        Java 的 `CompletableFuture` 与这里最对应：链式组合、全部等齐、谁先回来，
        两边的组合子几乎一一对得上。差别在失败那一侧 —— Java 有单独的
        异常处理入口，这里统一走 `catch`；而两边的方法签名都看不出
        「这个异步会不会失败」，失败都是类型之外的事。
    equivalence:
      javascript: identical
      python: analogous
      java: analogous

  async-await:
    code: |
      async function load(id: string): Promise<string> {
        const r: string = await fetchOne(id);   // @note 拿到的是结果，不是 Promise
        return r.trim();                        // @note 返回值自动包成 Promise
      }
      // @note! 返回类型必须标成 Promise<T>，写成 T 是编译错误

      for await (const chunk of stream) { }      // @note 异步迭代
    vs:
      javascript: |
        语法与运行时行为完全一致 —— 这两个关键字本来就是内建的。
        这里多规定了一件编译期的事：async 函数的返回类型必须标成 `Promise<T>`，
        写 `T` 编译不过。好处是调用方一眼看到「这里要 await」，
        不必翻函数体去找有没有 await。
      python: |
        写法几乎一样，差别在两处：Python 的协程要显式交给事件循环去跑，
        直接调用一个 `async def` 只会得到协程对象、不会执行；
        这里的 async 函数调用就开始跑（到第一个 await 为止）。
        另一处是标注的位置 —— Python 标的是协程返回的那个值，
        这里标的是包装后的 `Promise<T>`。
      java: |
        Java 没有这两个关键字：异步组合靠链式调用，代码形状是「注册回调」
        而不是「顺序写下来」。Java 21 的虚拟线程让阻塞式写法重新可用 ——
        那是最接近这里的一种思路：把异步写得像同步。差别在实现代价 ——
        这里靠编译把函数切成状态机，Java 靠把阻塞调用变成廉价的线程切换。
    equivalence:
      javascript: identical
      python: analogous
      java: divergent

  cancellation:
    code: |
      import { taskpool } from '@kit.ArkTS';

      // 取消要看用的是哪套并发 —— 任务池的任务可以按 id 取消
      const task = new taskpool.Task(compute, payload);
      taskpool.execute(task);          // @note 返回 Promise
      // 取消时用 task.taskId，在子线程里调 taskpool.cancel

      // @note! 手动那套的线程不支持取消单个任务，只能整个销毁
      // @note 官方文档没有给出脚本层的取消信号对象：超时要在任务内部自己做
    vs:
      javascript: |
        两边的取消都不在语言层，但形态不同：JavaScript 那边是一个信号对象，
        由脚本创建、传给接收方，接收方自己决定要不要理会；
        这里要看用的是哪套并发 —— 任务池的任务可以取消（按 id 发起），
        手动那套的线程只能整个销毁。所以这里的取消是**运行时的能力**，
        而不是一层约定。
      python: |
        Python 的取消是语言与运行时的机制：任务可以被取消，协程里会抛出异常，
        `finally` 照样执行 —— 取消方不需要被取消方配合。
        这里只有任务池提供取消，而且是按 id 发起的；手动那套只能销毁线程。
        差别在粒度：一边能停掉单个任务并让它有机会善后，
        一边只能收掉整条线程。
      java: |
        Java 的取消会尝试中断线程，但能不能真的停下来取决于任务有没有
        检查中断标志 —— 与这里的「按 id 取消」一样，都是要对方配合的请求。
        差别在 Java 手里还有线程这个实体，这里连任务都是运行时内部的对象，
        脚本能做的只有发起取消。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
