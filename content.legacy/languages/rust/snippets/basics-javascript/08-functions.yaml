  - featureId: basics-javascript/arg-passing
    equivalence: divergent
    code: |
      fn take(v: Vec<i32>) { }             // @note 按值：拿走所有权
      fn borrow(v: &Vec<i32>) { }           // @note 不可变借用
      fn mutate(v: &mut Vec<i32>) { }       // @note 可变借用

      let mut v = vec![1];
      borrow(&v);
      mutate(&mut v);
      take(v);          // @note! 移动之后 v 不可再用

      // @note! Rust 把参数传递拆成三种明确的选择（移动 / 借用 / 可变借用），
      //        而 JS / Python / Java 都只有一种。
      //        Rust 让「这个函数会不会改我的数据」直接写在签名里
