# go —— model / abstraction
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: abstraction` 的那批。
#
# Go 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Go 与那个基准两门语言（R25）。

review:
  state: draft

boxes:
  interface:
    code: |
      type Shape interface {          // @note 接口只列方法签名
        Area() float64
      }

      type Circle struct{ R float64 }

      // @note! 隐式实现：不用写任何 "implements"，有这个方法就满足
      func (c Circle) Area() float64 { return 3.14 * c.R * c.R }

      func total(shapes []Shape) float64 {   // @note 接收接口切片
        var sum float64
        for _, s := range shapes { sum += s.Area() }
        return sum
      }

      shapes := []Shape{Circle{R: 1}}        // @note Circle 自动就是 Shape
      total(shapes)

      // 接口要小 —— 惯用的单方法接口
      type Stringer interface{ String() string }
    vs:
      javascript: |
        JavaScript 没有接口，靠约定；Go 的接口是**隐式满足**的 ——
        Circle 只要有 `Area()` 方法就自动是 Shape，不用声明。
        这与 JavaScript 的鸭子类型看着像，但有一个关键差别：
        Go 在**编译期**检查「传进去的东西满不满足接口」，
        JavaScript 要到运行时调用才发现少了方法。
        另一处差别是接口要小 —— Go 里单方法接口是常态。
      python: |
        Go 的接口与 Python 的鸭子类型思路一致（有那些方法就算数），
        但 Go 在编译期检查、且可以声明一个**具名的接口类型**当参数类型，
        这让「这个函数到底需要什么」写在签名上。
        Python 里通常只能靠文档或 `Protocol`（3.8 起）表达，
        而 `Protocol` 还需要显式继承或结构化匹配才生效。
      java: |
        Java 的接口**必须显式 `implements`**，Go 是**隐式满足** ——
        这是两者最大的差别。好处是 Go 可以给已有类型（包括标准库、
        第三方库的类型）定义接口并用它，不必改那个类型的定义；
        Java 想包装一个第三方类的接口只能写适配器。
        代价是 Go 里「谁实现了这个接口」不能靠跳转定义找到，
        要自己搜方法名（IDE 靠类型分析补上）。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  abstract-class:
    absent: true
    vs:
      javascript: |
        Go **没有抽象类**，也没有继承。想要「一组类型共享一段实现」，
        做法是把那段实现抽成一个普通函数或一个结构体，
        再让各类型**嵌入**它 —— 嵌入的方法会被提升到外层。
        但这是组合不是继承：没有 `super`、没有虚方法覆写，
        外层也不能被当成内层类型用。
      python: |
        Go **没有抽象类**（没有 `abc.ABC`）。要表达「必须实现这个方法」，
        就定义接口并在文档里写清 —— 编译器会检查
        「传进来的类型满不满足接口」，相当于把检查推到了使用点，
        而不是在类型定义处强制。想要共享实现就用嵌入结构体。
      java: |
        Go **没有抽象类**。Java 的 `abstract class` 承担「声明未实现的方法」
        与「复用已实现的字段+方法」两件事：前者的对应物是接口，
        后者的对应物是嵌入一个结构体。差别是接口不能带数据，
        嵌入又会把方法暴露出去（还会造成字段提升的困惑）——
        Go 用组合替代继承，代价是有些复用要写转发方法。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  mixin-trait:
    code: |
      type Base struct{ Name string }
      func (b Base) Describe() string { return "我是 " + b.Name }   // @note 给 Base 挂方法

      type User struct {
        Base                 // @note! 匿名字段 = 嵌入：User 直接获得 Describe()
        Email string
      }

      u := User{Base: Base{Name: "Ada"}, Email: "a@b.c"}
      u.Describe()           // @note 提升上来的方法
      u.Name                 // @note 字段也被提升

      // 覆写：外层定义同名方法就遮住内层的
      func (u User) Describe() string { return "用户 " + u.Name }
    vs:
      javascript: |
        JavaScript 用 `Object.assign` 把方法混入原型，或用类的多继承
        （那要走 mixin 工厂函数）。Go 的嵌入是语言级的：
        匿名字段的方法与字段被自动提升，外层再定义同名方法就覆写。
        但 Go 的嵌入不是继承 —— 把 User 传给要 Base 的地方不成立，
        而 JavaScript 的原型链上 `user instanceof Base` 会是 true。
      python: |
        Python 的 mixin 类通过多继承实现，MRO 决定方法解析顺序；
        Go 的嵌入是单层的、平的方法提升，没有 MRO ——
        多个嵌入字段有同名方法时，外层必须自己定义那一个，否则编译歧义。
        共享实现上两边都能做到，Go 的规则更简单也更死板。
      java: |
        Java 的接口 `default` 方法能提供共享实现，但接口**不能带数据**；
        Go 的嵌入结构体既能带数据又能带方法 —— 这一点上 Go 更接近
        Java 的抽象类。覆写行为不同：Java 的 default 方法被类实现覆盖后
        可以 `Interface.super.method()` 调回原实现，
        Go 里要显式写 `u.Base.Describe()`。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  duck-typing:
    code: |
      type Quacker interface{ Quack() string }

      type Duck struct{}
      func (Duck) Quack() string { return "嘎" }

      type Robot struct{}
      func (Robot) Quack() string { return "哔" }   // @note 没有声明，Robot 也是 Quacker

      func use(q Quacker) { println(q.Quack()) }
      use(Duck{})
      use(Robot{})            // @note 编译期检查：有 Quack() 就行

      // 空接口：任何类型都满足
      var any interface{} = 42
      // 新写法是 any
      var a any = "x"
    vs:
      javascript: |
        JavaScript 的鸭子类型完全在运行时；Go 的接口满足是**编译期**判定的，
        但规则同样是「看方法不看名字」—— 这就是结构化类型。
        所以两边都不需要写 `implements`，区别只在什么时候发现错误：
        JavaScript 到调用那一刻才炸，Go 在编译时就说
        「Robot 没有实现 Quacker」。Go 因此被称为「静态的鸭子类型」。
      python: |
        Python 的鸭子类型在运行时；Go 把同一套规则搬到了编译期，
        并且允许把「需要的这组方法」命名成一个接口类型写进签名。
        这让 Go 既能像 Python 一样不为接口去改类型定义，
        又能像静态语言一样提前发现不满足 —— 这是 Go 接口设计的核心取舍。
      java: |
        Java 的接口必须显式 `implements`，Go 是结构化的（隐式满足）——
        这是两门语言在抽象上最根本的差别。Go 的规则带来两个实际好处：
        ① 可以为自己**用不到源码**的类型（标准库、第三方）定义接口；
        ② 接口可以按使用方的需要事后定义，而不是让类型作者预先设计。
        代价是「谁实现了这个接口」需要工具来分析，不能靠跳转定义。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent
