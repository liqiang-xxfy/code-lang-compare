      "a" && "b";            // 'b'

      const x = 0;
      x ?? 5;                // @note 5，但 ?? 只对 null / undefined 兜底
      0 ?? 5;                // @note 0 —— 这个才是"只对空值兜底"
      // Python 没有 ?? 运算符，要同样的语义得写条件表达式
  - featureId: basics-python/truthiness
