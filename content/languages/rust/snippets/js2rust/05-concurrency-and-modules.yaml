      use std::sync::{Arc, Mutex};

      let counter = Arc::new(Mutex::new(0));       // @note! 原子引用计数 + 互斥锁，两层都要写
      let c = Arc::clone(&counter);
      std::thread::spawn(move || { *c.lock().unwrap() += 1; });

      // @note! 忘了加锁是**编译不过**的 —— Send / Sync 由编译器自动推导并检查
      // @note Rc<T>（非原子引用计数）不是 Send，拿到别的线程会编译错误，
      // 而不是静默的数据竞争 —— 这正是 Rust 相对 Java 最大的不同
  - featureId: js2rust/async-model
    equivalence: divergent
    code: |
      async fn fetch_all(urls: &[String]) -> Vec<String> {
          let futures: Vec<_> = urls.iter().map(|u| fetch(u)).collect();
          futures::future::join_all(futures).await   // @note 对应 Promise.all
      }

      #[tokio::main]                               // @note! 运行时是库，要自己选
      async fn main() { }

      // @note! async 只是把函数编译成状态机，"谁来驱动它"是另一件事 ——
      // JS 里事件循环由运行时托管，从不选择
      // @note! 跨 .await 持有的类型必须 Send，否则编译错误 ——
      // 这是 JS 里完全没有的一类问题，也是新手最常见的异步编译错误
