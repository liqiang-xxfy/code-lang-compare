# swift —— model / iteration
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: iteration` 的那批：
# generator-yield / comprehension / lazy-evaluation / destructuring。
#
# Swift 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Swift 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组要写准的是**「Swift 没有生成器语法」** ——
# 没有 `yield` 关键字，要惰性序列就**写一个遵守 IteratorProtocol 的类型**，
# 或者用 `.lazy` 把已有的变换变惰性。
# 另一处是**惰性与否在同一个 API 上只差一个词**：
# `a.map` 立刻求值、`a.lazy.map` 才是惰性 —— 与很多语言默认惰性相反。

review:
  state: draft

boxes:
  generator-yield:
    code: |
      // @note! Swift **没有生成器语法** —— 没有 `yield` 这个关键字

      // 想要「能暂停、按需产出的序列」，得**写一个类型**遵守协议：
      struct Fibonacci: Sequence, IteratorProtocol {
        var a = 0, b = 1
        mutating func next() -> Int? {      // @note 返回 nil 表示结束
          defer { (a, b) = (b, a + b) }
          return a                           // @note 用 while 包住就能无限：不返回 nil
        }
      }

      for x in Fibonacci().prefix(6) { print(x) }   // @note 0 1 1 2 3 5（靠 prefix 截断）

      // @note 也就是说「惰性序列」在 Swift 里是**一个类型**（要写 next()），
      // @note 而在别的语言里是一段带 yield 的函数 ——
      // @note 表达力上缺一块：没法写「中间有复杂控制流的惰性序列」而不写类型

      // @note 替代方案：
      //   · `.lazy` 把现成的变换变惰性（见 lazy-evaluation 那一格）
      //   · `AsyncStream` / `AsyncSequence` 处理异步产出
      //   · 第三方库提供 `AnyIterator { ... }` 这种闭包式构造

      // @note AnyIterator 能让写法轻一点：
      //   var n = 0
      //   let seq = AnyIterator { n < 3 ? (n += 1) : nil }
    vs:
      javascript: |
        **两边是直接的有无之分**：JavaScript 的 `function*` 加 `yield`
        是语言特性，写「能暂停的函数」非常直接，`for...of` 直接消费；
        Swift **没有生成器语法** —— 要惰性序列就得写一个类型，
        实现 `next()` 方法。所以那边「随手写个生成器」这件事
        在这边是一次类型定义，中间夹着复杂控制流的惰性序列尤其难写。
        另一处是 Swift 的 `AnyIterator { ... }` 用闭包能补一部分，
        但那不是语言特性、是标准库提供的构造器。
        共同点是两边的序列都能被 `for-in` / `for...of` 直接遍历。
      python: |
        两边的落差最大：Python 的 `yield` 是关键字，
        函数里有它就自动变成生成器 —— 这是 Python 最标志性的能力之一；
        Swift **完全没有对应语法**，要写一个遵守 `IteratorProtocol`
        的类型（`mutating func next() -> Element?`）。
        所以从 Python 过来最直观的失落就是「不能写生成器函数」，
        得改用 `.lazy` 加现成变换，或者真的写个类型。
        另一处是终止的表示：Python 抛 StopIteration，Swift 返回 nil。
      java: |
        **两边处境相同**：Java 也没有 `yield` 式的生成器
        （要惰性序列得实现 `Iterator`），也就是说得**写一个类型**。
        也就是说「能暂停的函数」在这门语言里不是语言特性，
        而是靠协议实现出来的。另一处是 Swift 的 `Sequence` 协议
        比 Java 的 `Iterable` 更细（还能区分「只能遍历一次」与
        「能反复遍历」两种协议）。
        共同点是两边的序列都能被 `for-in` 直接消费。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  comprehension:
    code: |
      // @note! Swift **没有推导式语法** —— 最接近的是标准库的变换组合

      let v = [1, 2, 3, 4, 5]

      // 「造一个新序列」
      v.map { $0 * $0 }                  // @note [1, 4, 9, 16, 25]
      v.filter { $0 % 2 == 1 }           // @note [1, 3, 5]

      // 串起来（立刻求值，每一步都造一个数组）
      v.filter { $0 % 2 == 1 }.map { $0 * $0 }     // @note [1, 9, 25]

      // @note 链上想省掉中间数组就加 .lazy（见下一格）

      // @note 几种容易混的变换：
      //   map      一对一
      //   compactMap  map 之后把 nil 丢掉（顺便改变元素个数）
      //   flatMap   把嵌套结构摊平
      //   reduce    折叠成一个值

      // @note 用 for 循环造也行，而且**很多时候更清楚**
      var out: [Int] = []
      for x in v where x % 2 == 1 { out.append(x * x) }
      // @note 注意 `for ... where ...` 这个写法是 Swift 的（循环里带过滤）
    vs:
      javascript: |
        两边的写法形态很接近（都是链式调用），这一格可以对应 ——
        连 `map` / `filter` / `reduce` 的名字都一样。
        差别在**求值时机**：JavaScript 的 `map` / `filter` 立刻造新数组；
        Swift 默认也是立刻求值，但加一个 `.lazy` 就变成惰性链 ——
        也就是说「惰性」在这边是同一个 API 上的一个开关，
        不像那边要换成生成器函数。
        另一处是 Swift 的 `compactMap`（map 之后丢 nil）是一个独立方法，
        JavaScript 里要靠 `map(...).filter(Boolean)` 拼出来。
      python: |
        两边的形态差得最远：Python 有**推导式语法** ——
        `[x*x for x in v if x % 2]` 一行搞定，读起来就是个集合定义；
        Swift 只能拼库调用（`v.filter{}.map{}`）或者写 for 循环。
        所以那边「造一个序列」是语言语法，这边是标准库组合。
        另一处是求值时机：Python 的列表推导式立刻算完、
        生成器表达式才惰性；Swift 默认立刻算，`.lazy` 才惰性 ——
        两边的「默认」与「开关」形式不同。
        共同点是两边都有 `map` / `filter` / `reduce` 这套函数式工具。
      java: |
        两边的处境**相似**（都没有推导式语法，都靠 Stream/序列变换组合），
        这一格最接近。差别在**惰性与终端的约定**：Java 的 Stream
        末尾必须有个终端操作才真的跑，而且用完不能再用；
        Swift 的序列是**可以重复遍历的**，没有「流已消费」这个概念。
        另一处是 Java 的 Stream 能并行（`parallel()`），
        Swift 没有这层。共同点是两边都有 `map` / `filter` / `reduce`，
        而且都能用显式循环代替。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  lazy-evaluation:
    code: |
      // @note Swift 的惰性求值主要落在 `.lazy` 上
      let v = Array(1...1_000_000)

      // @note! 不加 lazy：立刻跑一遍，可能造出中间数组
      v.map { expensive($0) }             // @note 一百万次，立刻算

      // @note! 加 lazy：变成惰性链，算到哪个元素才算哪个
      v.lazy.map { expensive($0) }.prefix(3)   // @note 只算前三个

      // @note 惰性链的常见搭档（都是「只取一部分」的）
      .prefix(3)        // @note 前 n 个
      .dropFirst(2)     // @note 丢掉前 n 个
      .first(where:)    // @note 第一个满足条件的（找到就停）

      // @note! 但 Swift 的惰性**不等于无限序列** —— 它的序列仍然有终点，
      // @note 只是「没算到的地方不算」；要无限序列得自己写 IteratorProtocol

      // @note 另一处「懒」的标准库设施：惰性属性
      //   lazy var expensive: T = { ... }()   —— 第一次访问才算
      // @note 注意 `lazy var` 与 `.lazy` 是两个不同的东西（一个是属性延迟初始化、
      // @note   一个是序列变换延迟求值），名字像但无关

      // @note! 惰性链如果被遍历两次会**算两遍**（它不是缓存）
    vs:
      javascript: |
        **两边的默认相反**：JavaScript 的 `map` / `filter` 是**立即**的
        （每次调用造一个新数组），要惰性得改用生成器函数；
        Swift 的序列变换默认也是立即的，但加一个 `.lazy` 就整条链变惰性 ——
        也就是说「惰性」是一个开关而不是换一套写法。
        另一处是 Swift 的 `.lazy` 链**不缓存**，遍历两次算两遍，
        这一点与 JavaScript 的生成器一致（生成器也只能用一次）。
        还有一处是 Swift 的 `lazy var`（属性延迟初始化）与 `.lazy`
        （序列惰性）是两件事，名字像但用途完全不同。
      python: |
        两边都有惰性与非惰性两条路，但**默认值与开关形式都不同**：
        Python 的列表推导式立刻算、生成器表达式惰性（写 `()` 而不是 `[]`）——
        换一个括号就换一种求值；Swift 的默认立刻算，加 `.lazy` 才惰性。
        另一处是 Python 的生成器**用过就空**（一次性迭代器），
        Swift 的 `.lazy` 链是**可以重复遍历的**（每次重算）。
        共同点是两边都能表达「只算用到的那部分」，
        而且都不缓存结果。
      java: |
        两边都有惰性管道（Stream ↔ `.lazy` 链），形态相近。
        差别在**生命周期**：Java 的 Stream 是**一次性的**，
        消费过就不能再用（再遍历抛异常）；Swift 的 `.lazy` 链
        可以重复遍历（每次重算）。
        另一处是 Java 的 Stream 末尾必须有终端操作才真的跑，
        Swift 的惰性链在被遍历时才跑 —— 触发方式不同但都是「用到才算」。
        还有一处是 Swift 有 `lazy var` 这种属性级的延迟初始化，
        Java 里要靠 `Supplier` 或双重检查锁手工实现。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  destructuring:
    code: |
      // @note Swift 的解构叫**绑定**，主要用在三处

      // ① 元组
      let (a, b) = (1, 2)
      let (_, second) = (1, 2)            // @note 不要的位置用 _
      let (x, y) = point

      // ② for-in 里
      for (i, ch) in "abc".enumerated() { }
      for (k, v) in dict { }

      // ③ switch / if case 的**模式匹配**（这是最强的一处）
      switch shape {
      case .circle(let r): print(r)             // @note 直接解出数据
      case .rect(let w, let h): print(w * h)
      }

      if case .some(let v) = optional { print(v) }
      guard case .success(let data) = result else { return }

      // @note! 与别的语言不同的地方：解构的能力来自**模式匹配**这一整套，
      // @note! 所以它能解的不只是元组 —— 枚举的关联值、可选值、
      // @note! 甚至「某些位置是常量」的混合模式都能解
      switch point {
      case (0, let y): print("在 y 轴上，y=\(y)")     // @note 混合：固定 + 绑定
      case (let x, let y) where x == y: print("对角线")
      default: break
      }

      // @note 数组不支持这种解构（长度是运行期的）——
      // @note 想按位置取就用下标或 first/last
    vs:
      javascript: |
        两边的解构形态很像（`const [a, b] = ...` ↔ `let (a, b) = ...`），
        而且都能解对象/元组、都能在循环里用 —— 这一层可以对应。
        差别在**解构的通用性**：JavaScript 的数组解构能吃任何可迭代对象、
        个数不匹配时补 `undefined`、还能用默认值；
        Swift 的解构只对**编译期知道结构**的东西成立（元组、枚举关联值），
        数组不行、个数也不匹配。
        另一处是 Swift 的解构与**模式匹配**是同一套机制 ——
        所以能在 `switch` 里「部分固定、部分绑定」，
        JavaScript 的 `case` 只能比值，没有这个能力。
      python: |
        两边的解构都是按位置，而且都能配循环用 —— 这一层接近。
        差别在**能不能吃变长结构**：Python 的 `a, *rest = seq`
        能接住剩下所有元素、还能匹配嵌套结构；
        Swift 的解构要求结构在编译期确定，没有「剩下的都给它」。
        另一处是 Swift 的解构能力来自模式匹配 ——
        所以它在 `switch` 里能表达「第一项是 0、第二项绑个名字」
        这种混合模式，Python 的 `match` 也能（两边在这里反而很像）。
      java: |
        **这一格 Java 长期落后、较新版本才补**：Java 的 `switch` 模式匹配
        与记录解构是后来加的，而且只对记录类型有效；
        Swift 的结构化绑定从早期就有，而且能解元组、枚举关联值、
        可选值 —— 覆盖面宽得多。
        另一处是 Swift 能在 `if case` / `guard case` 里用模式匹配当条件，
        Java 要到较新版本才有 `instanceof` 的模式匹配。
        共同点是两边都**不能**拆运行期长度的容器（数组/列表）。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent
