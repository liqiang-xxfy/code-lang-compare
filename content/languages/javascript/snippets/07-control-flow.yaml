# javascript —— basics/07-control-flow 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas

- featureId: basics/if-else
  equivalence: analogous
  code: |
    if (score >= 90) {
      grade = 'A';
    } else if (score >= 60) {
      grade = 'B';
    } else {
      grade = 'C';
    }

    // @note 条件必须显式括起来；花括号可省但极易埋雷（加一行就改变语义），永远写上

    // @note 条件可以是任意值，会走真值转换——空数组是真值，这一点见运算符章
    if ([]) console.log('空数组也是真值');
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/ternary
  equivalence: divergent
  code: |
    const label = score >= 60 ? 'pass' : 'fail';      // @note 条件在前，结果在后

    // @note 可以嵌套但会迅速不可读
    const tier = score >= 90 ? 'A' : score >= 60 ? 'B' : 'C';

    // @note 只想要其中一个分支时可以短路
    const maybe = cond && doSomething();              // 条件不成立时拿到 false，不是 undefined

    // @note Python 的语序是反的：a if cond else b——逐行翻译时必须反过来写
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/switch-match
  equivalence: divergent
  code: |
    switch (lang) {
      case 'js':
        console.log('JavaScript');
        break;                       // @note! 忘了 break 会「穿透」到下一个 case——经典 bug 源
      case 'py':
        console.log('Python');
        break;
      default:
        console.log('unknown');
    }

    // @note 用的是 === 严格比较；case 里写表达式也只能是值，不是条件
    // @note 想表达「多个值走同一分支」时故意省略 break（这是唯一合理的穿透用法）
    // @note 只能对值匹配，不能解构、不能绑定变量——Python 3.10+ 的 match 是结构化模式匹配，强得多
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/for-loop
  equivalence: divergent
  code: |
    // 计数循环：JS 特有
    for (let i = 0; i < 3; i++) console.log(i);

    // 遍历：对应 Python 的 for x in seq
    for (const x of [1, 2, 3]) console.log(x);

    // 遍历同时拿下标
    for (const [i, x] of [1, 2, 3].entries()) console.log(i, x);

    // @note! Python 没有三段式 for，只有遍历；想要计数必须显式用 range()
    // @note 三段式的三个部分都可省略，for (;;) 是死循环
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/while-loop
  equivalence: analogous
  code: |
    let n = 3;
    while (n > 0) {
      n--;
    }

    // @note do...while 至少执行一次（Python 没有这个结构）
    let m = 0;
    do {
      m++;
    } while (m < 0);
    m;                        // 1 —— 条件一开始就不成立，但仍然执行了一次

    // @note 写死循环用 while (true)，靠 break 退出
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/loop-control
  equivalence: divergent
  code: |
    for (const x of [1, 2, 3, 4]) {
      if (x === 2) continue;      // 跳过本次
      if (x === 4) break;         // 结束整个循环
      console.log(x);             // 1, 3
    }

    // @note! 嵌套循环里 break 只跳出最内层，要跳多层得用标签
    outer: for (const a of [1, 2]) {
      for (const b of [1, 2]) {
        if (b === 2) continue outer;   // 跳到外层下一轮
      }
    }

    // @note Python 没有循环标签，也没有 for...else——「找过了没找到」要自己维护标志位
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/loop-index
  equivalence: analogous
  code: |
    const arr = ['a', 'b'];

    arr.forEach((v, i) => console.log(i, v));      // @note 下标恒从 0 开始

    for (const [i, v] of arr.entries()) console.log(i, v);

    Object.entries({ x: 1 }).forEach(([k, v]) => console.log(k, v));

    // @note! forEach 不能用 break/continue，中途想退出得改写成 for...of
    // @note Python 的 enumerate 有 start 参数能指定起始下标，JS 的 forEach 没有

    // @note forEach 里 await 不会等：会立刻返回，异步逻辑必须用 for...of
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/range-iteration
  equivalence: divergent
  code: |
    // @note! JS 没有内置 range，得自己写或用库
    const range = (n) => Array.from({ length: n }, (_, i) => i);
    range(3);                       // [0, 1, 2]

    // 实际写法通常是直接构造数组
    [...Array(3).keys()];           // [0, 1, 2]  —— @note 这个技巧不直观，但很常见
    Array.from({ length: 3 }, (_, i) => i * 2);

    // @note Python 的 range() 是内置的、惰性的，并且能直接带步长与起止
    // @note JS 里没有等价物，这也是为什么 JS 的循环更依赖计数三段式
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/exception-flow
  equivalence: divergent
  code: |
    try {
      JSON.parse('{bad');
    } catch (e) {
      console.log(e instanceof SyntaxError);   // true
      console.log(e.message);
    } finally {
      cleanup();                               // @note 无论成功失败都执行
    }

    // @note! throw 可以扔任何值：throw 'oops' / throw { code: 1 } 都合法
    //        所以 catch 里的 e 不一定是 Error，写 e.message 可能拿到 undefined
    // @note 自定义错误要 extends Error，否则丢失栈信息
    // @note 没有「按异常类型分发」的 catch（不像 Python 的 except ValueError），
    //       只能自己 instanceof 判断，或者看 e.name
    // @note 但 catch 的绑定可以省略（ES2019 起）—— 不需要那个变量时就不写

    try { risky(); } catch { /* 不要变量 */ }
  review:
    state: reviewed
    provenance:
      origin: llm
      model: claude-sonnet-4.5
      promptTemplateId: m1-snippet-v1
      generatedAt: '2026-10-01'
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'
    notes: 删除一处不实说法（原称"ES2025 的 catch 修饰符"；可选 catch 绑定实为 ES2019）。其余断言（throw 任意值、e.message undefined）实跑验证通过
