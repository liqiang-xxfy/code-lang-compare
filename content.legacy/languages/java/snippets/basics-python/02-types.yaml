    equivalence: divergent
    code: |
      int n = 10;              // @note 32 位，有宽度就有上限
      long big = 10L;
      double f = 3.14;
      boolean ok = true;
      char c = 'A';            // @note 单字符是独立的基本类型，不是长度为 1 的字符串

      // big 还是装不下 10**30 —— 要用 BigInteger，且它不能参与运算符
