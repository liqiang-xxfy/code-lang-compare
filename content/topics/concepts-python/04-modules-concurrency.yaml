id: concepts-python/04-modules-concurrency
topicId: concepts-python
title: 模块、并发与内存
order: 4
summary: 代码怎么分文件、内存谁来收、同时干几件事时到底谁在跑
features:
  - id: concepts-python/module-system
    title: 模块系统
    kind: concept
    summary: 文件即模块、目录即包；import 会真的把那个文件执行一遍

  - id: concepts-python/memory
    title: 内存管理
    kind: concept
    summary: 引用计数为主，计数归零立刻释放；循环引用交给分代 GC 兜底

  - id: concepts-python/concurrency-unit
    title: 并发单元
    kind: concept
    summary: 线程 / 进程 / 协程三选一，而且线程被 GIL 限制着

  - id: concepts-python/async-model
    title: 异步模型
    kind: concept
    summary: asyncio 要显式启动事件循环，协程不 await 就不执行
