- featureId: basics/while-loop
  equivalence: divergent
  code: |
    for 条件 { }        // @note! 这就是 Go 的 while —— 根本没有 while 关键字

    for {               // 无限循环
        if done {
            break
        }
    }

    // @note! Go 也没有 do-while；「至少执行一次」要写成 for + 末尾判断
    for {
        doSomething()
        if !again {
            break
        }
    }
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/loop-control
  equivalence: identical
  code: |
    outer:
    for i := 0; i < 3; i++ {          // @note 标签写在循环的前一行
        for j := 0; j < 3; j++ {
            if j == 1 {
                continue outer
            }
            if i == 2 {
                break outer
            }
        }
    }

    // @note Go 的标签跳转与 JS 几乎一致
    // @note! 但 Go 要求标签真的被用到，否则报错 "label defined and not used"
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

