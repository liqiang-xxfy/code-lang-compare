      # @note 异常体系是扁平的：能捕获的都继承自 Exception，没有受检/非受检之分
      # @note! 代价是"这里会抛什么"不再由编译器提醒 —— 只能在 docstring 里写，
      # 或者等它运行时炸出来
  - featureId: java2python/exception-model
    equivalence: divergent
    code: |
      try:
          risky()
      except (OSError, ValueError):    # @note 元组代替 | 做多重捕获
          fallback()
      except Exception as e:
          log(e)
          raise                          # 重新抛出，保留原始栈
      else:
          succeeded()                    # @note! 多了 else：没抛异常时执行
      finally:
          cleanup()

      # @note! 不要写空的 except: —— 它会连 KeyboardInterrupt 一起吞掉
      # @note else 的价值：把可能抛的那一句圈在 try 里，其余逻辑放外面，
      # 避免误捕自己后续代码抛出的异常
  - featureId: java2python/resource-cleanup
    equivalence: analogous
    code: |
      with open(path) as f:              # @note 离开块必定关闭
          data = f.read()

      with open(a) as f, open(b) as g:   # @note 多个资源一行搞定
          pass

      # @note! 不要求实现特定接口，只要对象有 __enter__ / __exit__；
      # contextlib 能把任意"进入-退出"逻辑包出来，代价比 AutoCloseable 低得多
      import contextlib

      @contextlib.contextmanager
      def timer():
          start = time.perf_counter()
          try:
              yield
          finally:
              print(time.perf_counter() - start)
