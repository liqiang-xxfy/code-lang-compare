id: basics-java/01-variables
topicId: basics-java
title: 变量与声明
order: 1
summary: 类型先行、字段有默认值、final 冻结绑定——从 Java 出发看其余语言的这一层

features:
  - id: basics-java/var-declaration
    title: 变量声明
    kind: syntax
    summary: Java 的声明带类型，且声明与赋值可以分两步
    body: |
      Java 的声明是**类型先行**的：`int count = 0;` 先写类型再写名字，
      而且可以只声明不赋值（`int count;`），赋值留到后面。

      Java 10 起有了 `var count = 0;`，但它**只是局部变量的类型推断**，
      不是动态类型 —— 编译器仍然在编译期把类型定死，之后不能换。

      从 Java 出发看 Python，最容易低估的是「没有声明」这件事：
      `count = 0` 既是引入名字也是绑定对象，而且这个名字之后可以绑到完全不同类型的对象上。

  - id: basics-java/var-scope
    title: 作用域
    kind: behavior
    summary: 局部变量是块级的，字段是对象级的
    body: |
      Java 的**局部变量是块级**的：`for (int i = 0; ...)` 里的 `i` 出了循环就不可见，
      连"循环结束后读 i"都编译不过。

      字段则完全不同：它属于对象（或类），生命周期跟随实例，和代码块无关。

      这条差异在做迁移时要分两层看：JS 的 `let` 也是块级（与 Java 一致），
      而 Python 的块**根本不产生作用域** —— 同一段缩进结构，
      Java / JS 里出块即失效，Python 里出了块还在。

  - id: basics-java/hoisting
    title: 声明顺序与默认值
    kind: behavior
    summary: 字段有默认值，局部变量必须先初始化
    body: |
      Java 没有 JS 那种"提升"机制，但有一组容易与它混淆的规则：

      - **字段**会被自动填默认值（`0` / `0.0` / `false` / `null`），声明后立刻可读
      - **局部变量**没有默认值，读一个未初始化的局部变量是**编译错误**，不是运行时异常

      所以 Java 的"未初始化"问题在编译期就被挡掉了，而 JS 的 `var` 会静默给出
      `undefined`，Python 要等到运行时才抛 `NameError`。
      三门语言的失败时机分别是：编译期 / 静默 / 运行时。

  - id: basics-java/const-immutability
    title: final 与不可变性
    kind: behavior
    summary: final 冻结的是绑定，对象的不可变要靠类设计
    body: |
      `final` 限制的是**引用不能再指向别的对象**，不是对象内容不可变：

      ```java
      final List<String> xs = new ArrayList<>();
      xs.add("a");          // 合法 —— final 拦不住这个
      ```

      想让内容真正不可变，靠的是**类型本身不可变**：
      `String` 不可变，`List.of(...)` 返回不可变列表，`record` 的字段是 final 的。

      三条语言在这里的分工正好可以对照：Java 用 `final` 关键字 + 不可变类型，
      JS 用 `const` + `Object.freeze`，Python 两者都没有，只有全大写命名约定。

  - id: basics-java/naming-convention
    title: 命名与大小写惯例
    kind: syntax
    summary: camelCase vs snake_case
    body: |
      唯一一处「纯风格、无语义」的差异，但迁移时满屏的命名不一致会显著增加阅读阻力。
      Java 与 JS 都用 `camelCase`（方法/变量）、`PascalCase`（类）、
      `SCREAMING_SNAKE_CASE`（`static final` 常量）；Python 用 `snake_case`。

      唯一带语义的一条：Python 用前导下划线表示「非公开」，
      Java 用 `private` / 包可见性在语言层面表达同一件事。

  - id: basics-java/var-destructuring
    title: 解构赋值
    kind: behavior
    summary: Java 没有解构赋值，取字段靠访问器
    body: |
      Java **没有解构赋值**：`a, b = pair` 与 `const { name } = user` 都没有对应写法。
      取多个值只能逐个访问（`p.x()` / `p.y()`，或 `map.get("k")`）。

      Java 21 的 record pattern（`if (p instanceof Point(int x, int y))`）看起来接近，
      但它是**模式匹配**的一部分，只能出现在 `instanceof` / `switch` 的判断位置，
      不能当作赋值语句用。

      JS 的数组/对象解构与 Python 的可迭代解包都远比它灵活 ——
      从 Java 出发时，这一层是最需要重新适应的地方。

  - id: basics-java/var-multiple-assign
    title: 多重赋值与交换
    kind: behavior
    summary: 没有多重赋值，交换变量必须借临时变量
    body: |
      Java 没有多重赋值语句，`a, b = b, a` 与 `[a, b] = [b, a]` 都不成立。
      交换两个变量必须写临时变量：

      ```java
      int t = a; a = b; b = t;
      ```

      链式赋值 `a = b = 0` 倒是合法（赋值表达式的值是赋进去的值），
      但它要求 `a` 与 `b` 类型兼容，而且和 Python / JS 一样——
      右侧是可变对象时会共享同一个对象。

  - id: basics-java/var-global-declaration
    title: 静态字段与闭包捕获
    kind: behavior
    summary: 没有全局变量，捕获的外部变量必须是 final 或事实不变
    body: |
      Java 没有模块级全局变量，最接近的是 `static` 字段 —— 它属于类而不是实例，
      并且要显式通过类名访问（`Config.RETRY`）。

      更值得记住的是**闭包捕获规则**：lambda 与匿名内部类只能捕获
      `final` 或**事实不变**（effectively final，即赋值后从未再改）的局部变量。
      这不是限制而是设计：捕获的是**值**，不是变量本身。

      ```java
      int base = 10;
      Function<Integer, Integer> f = x -> x + base;   // 合法：base 之后没再改
      ```

      对照来看，JS 与 Python 的闭包捕获的是**变量绑定**（所以循环变量共享那一类坑才存在），
      Java 捕获值，因此没有这个问题，代价是循环里想捕获变化的量必须自己造一个 final 副本。

  - id: basics-java/var-shadowing
    title: 变量遮蔽
    kind: behavior
    summary: 局部变量遮蔽字段是常见且允许的
    body: |
      Java 允许局部变量遮蔽同名的**字段**，而且这是很常见的写法：

      ```java
      class User {
          private final String name;
          User(String name) { this.name = name; }   // 参数遮蔽了字段
      }
      ```

      用法上靠 `this.` 区分。需要注意的是局部变量之间**不允许**嵌套遮蔽 ——
      Java 禁止在内层块里声明与外层块同名的局部变量（编译错误），
      这一点比 JS 和 Python 都严格，能挡掉一整类"看错变量"的 bug。

      Python 则相反：它能遮蔽**内置名**（`list = []`），影响范围是整个模块，
      是三者中最容易造成远处报错的一种遮蔽。
