  - featureId: basics-python/null-undefined
    equivalence: identical
    code: |
      x = None
      x is None                # @note 单例，判等一律用 is
      x == None                # @note! 能跑但不该用：对象自定义了 __eq__ 就可能反直觉
      None == False            # False —— 空值不等于假值

      if not x:                # @note! 把 None / 0 / "" / [] / {} 全部归为假
          pass
  - featureId: basics-python/number-precision
    equivalence: identical
    code: |
      6 / 3                    # @note 2.0 —— / 永远返回浮点
      6 // 3                   # 2 —— 向下取整除法
      -7 // 2                  # -4 —— 是"向下"不是"向零"
      -7 % 3                   # 2 —— 取余跟着 // 走

      1 / 0                    # @note! ZeroDivisionError，当场抛，不会静默变 Infinity
      0.1 + 0.2                # 0.30000000000000004 —— 浮点仍是双精度
  - featureId: basics-python/type-casting
    equivalence: identical
    code: |
      int("3.7")               # @note! ValueError —— 要先 float 再 int
      int(3.9)                 # 3 —— 直接截断，不是四舍五入
      int("ff", 16)            # 255 —— 可以指定进制
      float("nan")             # nan —— 这个字符串反而合法

      str(255)                 # '255' —— str() 不接受进制参数
      bool([])                 # False
  - featureId: basics-python/boolean-conversion
    equivalence: identical
    code: |
      bool([])                 # @note False —— 所有空容器都是假值
      bool({})                 # False
      bool("")                 # False
      bool("0")                # @note! True —— 非空字符串一律是真值
      bool(0.0)                # False

      if not items:            # @note 惯用法：这里问的是"空不空"
          pass
  - featureId: basics-python/type-names
    equivalence: identical
    code: |
      type(1)                  # @note <class 'int'> —— 返回类对象，不是字符串
      type(1).__name__         # 'int' —— 要字符串名字就取 __name__
      type(1) is int           # True

      # @note! 别用 type(x).__name__ == 'int' 判类型：既慢又认不出子类
