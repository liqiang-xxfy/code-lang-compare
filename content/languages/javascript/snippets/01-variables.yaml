# javascript —— basics/01-variables 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas

- featureId: basics/var-declaration
  equivalence: analogous
  code: |
    let count = 0;          // @note 块级作用域，可以重新赋值
    const name = "Ada";     // @note 块级作用域，绑定不可重新赋值
    var legacy = 1;         // @note! 函数作用域且会提升，只应出现在遗留代码里
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/var-scope
  equivalence: divergent
  code: |
    if (true) {
      let inside = 1;       // @note 块级作用域：出了这个 {} 就消失
      var leaked = 2;       // @note! var 不认块，泄漏到外层函数
    }

    // inside  -> ReferenceError: inside is not defined
    // leaked  -> 2
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/hoisting
  equivalence: divergent
  code: |
    // var：声明被提升到函数顶部，此时值是 undefined
    console.log(v);         // undefined
    var v = 1;

    // let / const：同样会提升，但处于「暂时性死区」，访问即抛错
    console.log(l);         // @note! ReferenceError: Cannot access 'l' before initialization
    let l = 1;
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/const-immutability
  equivalence: analogous
  code: |
    const user = { name: "Ada" };

    user.name = "Grace";    // @note! 允许：const 冻结的是绑定，不是对象内容
    user = {};              // TypeError: Assignment to constant variable.

    Object.freeze(user);    // @note 想真正不可变，必须显式冻结（且只冻结第一层）
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/naming-convention
  equivalence: analogous
  code: |
    const userName = "Ada";       // 变量 / 函数：camelCase
    class UserProfile {}          // 类：PascalCase
    const MAX_RETRY = 3;          // 真正常量：SCREAMING_SNAKE_CASE
    function getUser() {}
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/var-destructuring
  equivalence: divergent
  code: |
    const [a, b] = [1, 2];                        // @note 数组解构：按「位置」
    const { name, age = 18 } = { name: 'Ada' };   // @note 对象解构：按「键名」，且能给默认值
    const { name: userName } = { name: 'Ada' };   // @note 冒号是重命名，不是赋默认值
    const [first, ...rest] = [1, 2, 3];           // 收集剩余
    const [, second] = [1, 2];                    // 跳过一个位置

    // @note! Python 只有按位置解包，没有对象解构——想按名字取值只能 d['key']
    // @note 解构默认值只在值为 undefined 时生效，传 null 不会生效
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/var-multiple-assign
  equivalence: divergent
  code: |
    let a = 1;
    let b = 2;

    [a, b] = [b, a];        // @note 交换：右侧先整体求值再解构，所以不用临时变量

    let x;
    let y;
    x = y = 0;              // @note 链式赋值：从右往左，两个名字都拿到 0

    // @note! 链式赋值遇到对象时只是让两个名字指向同一个对象，不是复制
    // @note Python 的 a, b = b, a 是同一件事的语法糖，写起来更短
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/var-global-declaration
  equivalence: divergent
  code: |
    let counter = 0;

    function bump() {
      counter += 1;          // @note 直接改外层变量，不需要任何声明
    }

    function shadow() {
      let counter = 99;      // @note 这是新变量，只是遮蔽了外层
      return counter;
    }

    // @note! 完全不写声明的赋值会隐式创建全局变量（仅非严格模式）；
    //        在 ESM / 'use strict' 下直接抛 ReferenceError
    // @note! Python 相反：函数内赋值默认创建局部名字，想改外层必须写 global / nonlocal
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'

- featureId: basics/var-shadowing
  equivalence: analogous
  code: |
    const value = 'outer';

    {
      const value = 'inner';    // @note 块级遮蔽：出了这个 {} 就恢复外层
      console.log(value);       // 'inner'
    }

    console.log(value);         // 'outer'

    // @note! 遮蔽内置名同样有害（比如把变量命名成 Array），
    //        但 JS 里它是模块级局部，影响面被限制住了
    // @note Python 里写 list = [1,2] 会在整个模块内盖掉内置函数 list()，危害大得多
  review:
    state: reviewed
    provenance:
      origin: manual
      license: CC-BY-4.0
    reviewedBy: 阿岩
    reviewedAt: '2026-10-01'
