- featureId: basics/type-checking
  equivalence: analogous
  code: |
    var x any = "hello"

    s, ok := x.(string)      // @note 类型断言：comma-ok 形式不会 panic
    fmt.Printf("%T\n", x)    // "string" —— @note %T 打印类型

    switch v := x.(type) {    // @note type switch：按类型分支
    case string:
        fmt.Println(v)
    }

    // @note Go 的接口是隐式实现，所以「这个值实现了哪些接口」要到运行时才确定
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/null-undefined
  equivalence: divergent
  code: |
    var p *int              // @note nil：指针 / 切片 / map / channel / 接口 / 函数的零值
    // var i int = nil      // 编译错误：int 不能为 nil（零值是 0）

    var s []int
    s == nil                // true
    // @note! 但 len(s) == 0 也是 true，而这两件事并不等价：
    //        一个 nil 切片可以直接 append，一个空切片也是

    type User struct{ Name string }
    var u *User
    u.Name                  // @note! panic: nil pointer dereference（编译期拦不住）

    // @note 与 Java 的 null 类似：只有一个空值，解引用会崩。
    //       但 Go 的零值设计让「未初始化的 int」是 0 而不是 nil，这点比 Java 友好
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/number-precision
  equivalence: divergent
  code: |
    var a int32 = 2147483647
    a + 1                   // @note! Go 的整数溢出是**静默回绕**（不像 Rust 会 panic）

    0.1 + 0.2               // 0.30000000000000004 —— 与 JS 同样

    // @note 需要任意精度用标准库 math/big
    big.NewInt(0).SetString("9007199254740993", 10)
    big.NewFloat(0).Add(big.NewFloat(0.1), big.NewFloat(0.2))

    // @note Go 默认没有高精度小数类型，日常只有 float64
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/type-casting
  equivalence: divergent
  code: |
    var i int = 1
    var f float64 = float64(i)     // @note 必须显式转换，Go 没有隐式数值转换

    var d float64 = 3.99
    var n int = int(d)             // 3 —— 直接截断

    s := strconv.Itoa(42)             // 数字 -> 字符串
    n2, err := strconv.Atoi("42")     // @note! 字符串 -> 数字：失败放在 error 里，不 panic

    // @note! JS 的 Number("abc") 给 NaN，Go 要求你处理 err —— 迁移时控制流会变长
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/boolean-conversion
  equivalence: divergent
  code: |
    // Go 没有真值 / 假值：条件必须是 bool
    // if 1 {}       // 编译错误：non-boolean condition
    // if "" {}      // 编译错误

    // @note 字符串转布尔没有内建「宽松」版本，只有严格的解析
    b, err := strconv.ParseBool("true")   // 只认 "1" / "t" / "true" 等有限形式

    // @note! 与 JS 差别极大：Go 里 len(s) > 0 必须显式写，不存在「空字符串为假」
  review:
    state: draft
