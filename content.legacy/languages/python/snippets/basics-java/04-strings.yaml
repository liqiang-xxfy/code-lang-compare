  - featureId: basics-java/string-methods
    equivalence: analogous
    code: |
      "  x  ".strip()              # @note 名字不同：Java 叫 strip（这边没有 trim）
      "abc".upper()                # @note! 方法名全小写，Java 是驼峰
      "b" in "abc"                 # @note! 判断包含用 in 运算符，不是方法调用
      "abc".find("z")              # -1 —— 同样返回 -1
      "a,b".split(",")             # ['a', 'b']
      "abc".replace("a", "x")      # @note 替换**全部**匹配，Java 的 replace 也是全部

      "\n".join(["a", "b"])        # @note 主语是分隔符，与 String.join 同序
