# php —— express / containers
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: containers` 的那批：
# arrays / maps。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 口径说明：这一组是**唯一一组「两个知识点其实是同一个东西」**的格子 ——
# PHP 的数组就是有序映射，没有独立的 list 类型。所以 arrays 与 maps
# 两格要写的是**同一个类型的两个侧面**，不要写成两种容器。
#
# 三条最容易错的：
# ① 数组赋值是**值拷贝**（写时复制），对象赋值才是句柄 —— 与三个基准的直觉都不同；
# ② `+` 是**并集**（不覆盖已有键），`array_merge` 才覆盖（且会重排 int 键）；
# ③ **保持插入顺序**是哈希表实现自带的，不是后来加的。
#
# 本文件的事实全部在本机 PHP 8.5.11 上实跑确认过。

review:
  state: draft
  provenance:
