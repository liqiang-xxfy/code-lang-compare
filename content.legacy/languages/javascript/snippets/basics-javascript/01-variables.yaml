# javascript —— basics/01-variables 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/var-declaration
    equivalence: identical
    code: |
      let count = 0;          // @note 块级作用域，可以重新赋值
      const name = "Ada";     // @note 块级作用域，绑定不可重新赋值
      var legacy = 1;         // @note! 函数作用域且会提升，只应出现在遗留代码里
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JavaScript 用 `let` / `const` / `var` 声明变量。声明这个动作同时交代了两件事：
      这个名字**能不能重新绑定**（`const` 不能），以及它**在哪里可见**
      （`let` / `const` 是块级，`var` 是函数级）。

      从别的语言过来时，第一个要转变的心智是：不要只问「怎么声明」，
      要问「这个名字绑到了什么、还能不能改绑」—— 后者才是 `const` 真正限制的东西。
  - featureId: basics-javascript/var-scope
    equivalence: identical
    code: |
      if (true) {
        let inside = 1;       // @note 块级作用域：出了这个 {} 就消失
        var leaked = 2;       // @note! var 不认块，泄漏到外层函数
      }

      // inside  -> ReferenceError: inside is not defined
      // leaked  -> 2
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `let` / `const` 的作用域是**块级**的：出了 `{}` 就消失。
      `var` 是**函数级**的：它在整个函数体内都可见，哪怕声明写在 `if` 或 `for` 里面。

      两者的差别不是「新旧语法」，而是作用域单元不同 —— 这正是 `var` 被弃用的主因。
      一个直接的后果：用 `var` 在循环里注册的回调会共享同一个变量，用 `let` 则每次迭代
      都是新的绑定。同一段缩进结构，换个关键字，可见范围就变了。
  - featureId: basics-javascript/hoisting
    equivalence: identical
    code: |
      // var：声明被提升到函数顶部，此时值是 undefined
      console.log(v);         // undefined
      var v = 1;

      // let / const：同样会提升，但处于「暂时性死区」，访问即抛错
      console.log(l);         // @note! ReferenceError: Cannot access 'l' before initialization
      let l = 1;
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `var` 的声明会被提升到函数顶部，此时值是 `undefined` —— 所以声明前访问**不报错**，
      只是拿到 `undefined`。`let` / `const` 同样会提升，但处于**暂时性死区**（TDZ）：
      在声明语句执行前访问会直接抛 `ReferenceError`。

      区别在于：前者的「能跑」是假象，问题要等到用的时候才暴露；
      后者把错误提前到了访问的那一刻。理解提升的关键是 ——
      它是**编译期行为**，和运行时的赋值不是一回事。
  - featureId: basics-javascript/const-immutability
    equivalence: identical
    code: |
      const user = { name: "Ada" };

      user.name = "Grace";    // @note! 允许：const 冻结的是绑定，不是对象内容
      user = {};              // TypeError: Assignment to constant variable.

      Object.freeze(user);    // @note 想真正不可变，必须显式冻结（且只冻结第一层）
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `const` 限制的是**重新绑定**，不是内容不可变：`const user = { name: 'Ada' }` 之后，
      `user.name = 'Grace'` 完全合法，只有 `user = {}` 才会抛 `TypeError`。

      想让对象真正不可变要 `Object.freeze()`，而且它只冻结**第一层**，
      嵌套对象照样能改。一句话记住：`const` 说的是「这个名字不能再指向别的对象」，
      不是「这个对象不能被修改」。
  - featureId: basics-javascript/naming-convention
    equivalence: identical
    code: |
      const userName = "Ada";       // 变量 / 函数：camelCase
      class UserProfile {}          // 类：PascalCase
      const MAX_RETRY = 3;          // 真正常量：SCREAMING_SNAKE_CASE
      function getUser() {}
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JavaScript 的惯例是：变量与函数用 `camelCase`，类与构造函数用 `PascalCase`，
      真正常量用 `SCREAMING_SNAKE_CASE`。这是唯一一处「纯风格、无语义」的差异，
      但迁移时满屏的命名不一致会显著增加阅读阻力。

      有一点值得留意：`SCREAMING_SNAKE_CASE` 只是**约定**，
      语言层面没有任何东西阻止你给这个名字重新赋值。
  - featureId: basics-javascript/var-destructuring
    equivalence: identical
    code: |
      const [a, b] = [1, 2];                        // @note 数组解构：按「位置」
      const { name, age = 18 } = { name: 'Ada' };   // @note 对象解构：按「键名」，且能给默认值
      const { name: userName } = { name: 'Ada' };   // @note 冒号是重命名，不是赋默认值
      const [first, ...rest] = [1, 2, 3];           // 收集剩余
      const [, second] = [1, 2];                    // 跳过一个位置

      // @note! 对象解构取不存在的键得到 undefined，不报错——拼错键名是静默失败
      // @note 解构默认值只在值为 undefined 时生效，传 null 不会生效
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      数组解构按**位置**取值，对象解构按**键名**取值，两边都能设默认值、也都能重命名
      （`const { age: years } = user`）。函数参数位置同样可以直接解构，
      省掉一层「先把对象拆开」的过场。

      它是 JS 表达力很强的一块语法，代价是读代码时要同时盯住**形状**和**变量名**
      两件事 —— 嵌套解构尤其容易看漏一层。
  - featureId: basics-javascript/var-multiple-assign
    equivalence: identical
    code: |
      let a = 1;
      let b = 2;

      [a, b] = [b, a];        // @note 交换：右侧先整体求值再解构，所以不用临时变量

      let x;
      let y;
      x = y = 0;              // @note 链式赋值：从右往左，两个名字都拿到 0

      // @note! 链式赋值遇到对象时只是让两个名字指向同一个对象，不是复制
      // @note 解构赋值两侧长度不必相等：多出的目标是 undefined，多的元素被丢弃
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      `a = b = 0` 是**链式赋值**，从右往左执行：先把 `0` 赋给 `b`，再把 `b` 的值赋给 `a`。
      交换两个变量没有专门语法，要么引入临时变量，要么用数组解构 `[a, b] = [b, a]`。

      链式赋值碰到**可变对象**时要留神：两个名字会指向同一个对象，
      改其中一个的内容，另一个也会跟着变。这不是 bug，是引用语义。
  - featureId: basics-javascript/var-global-declaration
    equivalence: identical
    code: |
      let counter = 0;

      function bump() {
        counter += 1;          // @note 直接改外层变量，不需要任何声明
      }

      function shadow() {
        let counter = 99;      // @note 这是新变量，只是遮蔽了外层
        return counter;
      }

      // @note! 完全不写声明的赋值会隐式创建全局变量（仅非严格模式）；
      //        在 ESM / 'use strict' 下直接抛 ReferenceError
      // @note! 内层函数读外层变量走作用域链，是词法（静态）绑定——与在哪里调用无关
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      函数内直接给外层作用域的变量赋值就行 —— 只要那个名字在作用域链上找得到。
      真正要小心的是**没找到**的时候：非严格模式下，这行赋值会隐式创建一个全局变量；
      严格模式（`'use strict'`，以及 ES 模块默认）下直接抛 `ReferenceError`。

      这也是模块作用域的价值：模块顶层的变量不会挂到全局对象上，
      「隐式全局」这条路径在模块里根本不存在。
  - featureId: basics-javascript/var-shadowing
    equivalence: identical
    code: |
      const value = 'outer';

      {
        const value = 'inner';    // @note 块级遮蔽：出了这个 {} 就恢复外层
        console.log(value);       // 'inner'
      }

      console.log(value);         // 'outer'

      // @note! 遮蔽内置名同样有害（比如把变量命名成 Array），
      //        但 JS 里它是模块级局部，影响面被限制住了
      // @note 同一个块里用 let 重复声明同名变量会直接抛 SyntaxError，var 则静默覆盖
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      在内层作用域用 `let` / `const` 声明一个与外层同名的变量，就产生了遮蔽：
      内层从此看不见外层那一个，直到内层块结束。`var` 则**不构成遮蔽** ——
      它本来就在函数级，重复声明只是反复改同一个变量。

      遮蔽本身不是错误，但层数一多，读代码的人就得在脑子里维护
      「这一行用的是哪一个」。作用域开得越小，这类问题越少。
