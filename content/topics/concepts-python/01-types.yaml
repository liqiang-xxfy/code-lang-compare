id: concepts-python/01-types
topicId: concepts-python
title: 类型与值
order: 1
summary: 语言的地基 —— 类型什么时候检查、数字怎么存、空值有几个、赋值到底传了什么
features:
  - id: concepts-python/type-system
    title: 类型系统
    kind: concept
    summary: 你习惯「类型不对就报错」，到 JS 里会变成「默默算出一个别的结果」

  - id: concepts-python/numeric-type
    title: 数值类型
    kind: concept
    summary: int 不会溢出是你默认的前提，JS 里整数也是浮点，超范围静默丢精度

  - id: concepts-python/null-value
    title: 空值
    kind: concept
    summary: 你只有一个 None，JS 有两个空值，判空写法不能直接照搬

  - id: concepts-python/value-semantics
    title: 值语义与引用语义
    kind: concept
    summary: 你熟悉「一切皆引用」，但真正决定共享与否的是「这个类型可变吗」
