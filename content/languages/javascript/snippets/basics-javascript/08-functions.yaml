# javascript —— basics/08-functions 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/function-declare
    equivalence: identical
    code: |
      function declared(a) { return a; }        // 函数声明：会被提升
      const expressed = function (a) { return a; };   // 函数表达式：不会提升
      const arrow = (a) => a;                   // 箭头函数：隐式返回

      declared(1);        // 调用可以写在定义之前（提升）
      // expressed(1);    // @note! ReferenceError：const 未初始化

      // @note 类方法、对象方法都是第四种形式
      // @note! 函数声明会整体提升（定义前可调用），函数表达式不会——后者提前调用直接报错
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 有函数声明、函数表达式、箭头函数、类方法等多种形式，且**声明会被提升**。
      Python 只有一种：`def`。想「匿名」用 `lambda`，但它只能是**单个表达式**，
      不能有语句、不能有类型标注、不能多行。
      「一种形式」让 Python 的代码更容易预测，代价是失去了 JS 里「函数即值」的便利写法。
  - featureId: basics-javascript/default-params
    equivalence: identical
    code: |
      function f(x = [], y = {}) {       // @note! 每次调用重新求值，安全
        x.push(1);
        return x;
      }

      f();      // [1]
      f();      // [1]  —— 不会被上一次污染

      // @note 默认值可以是任意表达式，甚至引用前面的参数：function g(a, b = a * 2)
      // @note! 默认值每次调用都重新求值，所以默认值是对象或数组也不会在调用之间共享
      // @note 显式传 undefined 会触发默认值，传 null 不会
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 的默认参数在**每次调用时求值**，所以 `function f(x = [])` 是安全的。
      Python 的默认参数在**函数定义时求值一次**，所以 `def f(x=[])` 里的那个列表
      **会被所有调用共享**——第一次调用往里面塞了东西，第二次调用还能看见。
      这是 Python 面试题出现频率最高的坑之一，也是「看起来完全一样的两行代码行为不同」的最好例子。
  - featureId: basics-javascript/kwargs
    equivalence: identical
    code: |
      // @note! JS 没有关键字参数。模拟方式是传一个对象再解构
      function create({ name, age = 18, active = true } = {}) {
        return { name, age, active };
      }

      create({ name: 'Ada' });                  // { name:'Ada', age:18, active:true }
      create({ name: 'Ada', age: 36, active: false });

      // @note 好处是「按名传参」的可读性；代价是：① 参数名拼错不会报错，只是拿到 undefined
      //                                 ② 没有语言层面的「必须传」约束
      // @note 没有关键字参数，惯用做法是传一个选项对象、再在函数签名里解构
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 没有关键字参数（只能靠传对象解构模拟）；Python 原生支持，且调用处必须写 `name=value`。
      更关键的是 `/` 与 `*` 这两个分隔符：`def f(a, /, b, *, c)` 表示
      `a` 只能位置传、`b` 都能、`c` 只能关键字传——**语言层面强制调用方写清楚意图**。
      JS 里想达到同样效果只能靠约定或 TypeScript 类型。
  - featureId: basics-javascript/rest-params
    equivalence: identical
    code: |
      function sum(...nums) {              // @note 收集成真正的数组
        return nums.reduce((a, b) => a + b, 0);
      }

      sum(1, 2, 3);                        // 6

      function mixed(first, ...rest) {     // @note 只能放在最后一个参数
        return [first, rest];
      }

      // @note 收集与展开是同一个符号的两种位置：定义处收集、调用处展开
      const nums = [1, 2];
      Math.max(...nums);                   // 调用处展开
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `...args` 收集成**数组**；Python 的 `*args` 收集成**元组**（不可变），
      `**kwargs` 收集成**字典**。两边都是「先收集再使用」。
      差异在于 Python 把「位置可变」和「关键字可变」分成两个参数：
      这既是能力（能同时接住两类），也是陷阱（`**kwargs` 会把拼错的参数名静默吞掉）。
  - featureId: basics-javascript/return-multiple
    equivalence: identical
    code: |
      function divmod(a, b) {
        return [Math.floor(a / b), a % b];   // @note 返回数组，靠解构取
      }

      const [q, r] = divmod(7, 2);           // q=3, r=1

      // @note! 返回的是数组而不是「多个值」；少写一层解构就会拿到整个数组
      const pair = divmod(7, 2);             // [3, 1]

      // @note 返回对象更利于可读性（调用方不用记位置）
      function stats(xs) {
        return { min: Math.min(...xs), max: Math.max(...xs) };
      }
      const { min } = stats([1, 2]);
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 用 `return [a, b]` + 解构；Python 用 `return a, b`——**返回的其实是元组**，
      不是「真的返回两个值」。这个事实在需要单独传递时会暴露：`x = f()` 拿到的是元组。
      两边都能解构接收，但 Python 还支持用 `*` 收集剩余项：`first, *rest = f()`。
  - featureId: basics-javascript/lambda-arrow
    equivalence: identical
    code: |
      const double = (n) => n * 2;
      const noArgs = () => 1;
      const body = (n) => { return n * 2; };   // 花括号时不会隐式返回
      const obj = (n) => ({ value: n });       // @note! 返回对象字面量必须加括号

      // @note 箭头函数没有自己的 this：继承外层作用域
      const counter = {
        value: 0,
        start() {
          setInterval(() => { this.value++; }, 1000);   // @note this 指向 counter（普通函数会指向定时器）
        },
      };

      // @note! 也正因为没有 this，箭头函数不能用作构造函数（new 会抛错）
      // @note 箭头函数体要返回对象字面量时得加圆括号：() => ({ a: 1 })
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      看起来都是「短函数」，但两件事完全不同：
      ① JS 箭头函数最大的特点是**没有自己的 `this`**（继承外层），这解决了回调里 `this` 丢失的经典问题；
      ② Python 的 `lambda` 只有**一个表达式**，连 `if` 都得写成条件表达式，实际使用范围比箭头函数窄得多。
      Python 的取向是「有名字的函数更可读」，`lambda` 主要用在 `key=`、`sorted` 这类短回调上。
  - featureId: basics-javascript/function-callback
    equivalence: identical
    code: |
      const apply = (fn, x) => fn(x);          // @note 函数可以当参数传
      apply((n) => n + 1, 1);                  // 2

      [1, 2].map((n) => n * 2);                // @note 数组在前、函数在后
      [1, 2].filter((n) => n > 1);

      // @note! 回调里的 this 取决于调用方式，把方法直接当回调传会丢 this；
      //        用箭头函数包一层（() => obj.method()）最稳妥
      const handlers = { onOk: () => 'ok' };
      handlers.onOk();                          // 函数也能存在对象里
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      两边函数都是一等值，都能传递、返回、存进容器。差异在**调用方式**：
      JS 传的是函数本身（`arr.map(fn)`），Python 也是（`map(fn, arr)`）——
      但注意参数顺序：JS 是「数组在前、函数在后」，Python 的 `map`/`filter` 是「函数在前、可迭代在后」，
      与 `sorted(arr, key=fn)` 的顺序又不同，没有统一规律，只能逐个记。
  - featureId: basics-javascript/function-docstring
    equivalence: identical
    code: |
      /**
       * 计算两数之和。
       * @param {number} a
       * @param {number} b
       * @returns {number}
       */
      function add(a, b) {
        return a + b;
      }

      // @note! 这是「注释」，运行时拿不到；要靠 JSDoc 工具提取
      add.toString();            // 拿得到源码文本，但不是结构化的文档
      add.name;                  // 'add'

      // @note JSDoc 只是注释，运行时读不到——f.toString() 拿到的是源码文本，
      //       没有结构化的文档对象；要程序化取用只能靠编译期工具或另建文档数据
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 的文档是**注释**（`/** ... */`），运行时可访问但需要工具提取；
      Python 的文档是**字符串字面量**，直接挂在对象的 `__doc__` 上——
      `help(f)`、`print(f.__doc__)` 都能直接拿到。
      这意味着 Python 的文档是「数据」，可以被反射、被测试（`doctest` 能执行文档里的示例）。
      注意 docstring 必须是函数体的**第一条语句**，否则不会被识别。
  - featureId: basics-javascript/arg-passing
    equivalence: identical
    code: |
      function mutate(arr, num, obj) {
        arr.push(1);          // @note! 改内容会传染到外部
        num = 999;            // @note 改绑定不会
        obj = { replaced: true };  // @note 改绑定不会
      }

      const a = [];
      const n = 1;
      const o = { x: 1 };
      mutate(a, n, o);
      a;                      // [1]        —— 被改了
      n;                      // 1          —— 没变
      o;                      // { x: 1 }   —— 没变

      // @note! 口诀：改内容会传染，改绑定不会。两门语言都是这个规则
      // @note const 冻结的是「绑定」而不是内容：const o = { x: 1 }; o.y = 2 完全合法
    review:
      state: reviewed
      provenance:
        origin: llm
        model: claude-sonnet-4.5
        promptTemplateId: m1-snippet-v1
        generatedAt: '2026-10-01'
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
      notes: 措辞修正（"const 参数"→ const 冻结的是绑定）。行为断言实跑验证通过
    body: |
      这是被误传最多的一格。两门语言**都不是**「值传递」也不是「引用传递」，
      而是「传递对象引用的副本」（Python 官方说法是 call by object reference / call by sharing）。
      实际表现：传入不可变对象（数字、字符串、元组），函数内重新赋值**不影响外部**；
      传入可变对象（列表、字典、对象），函数内**原地修改会影响外部**，但重新赋值不影响。
      JS 里 `const` 参数可以被改内容（同样因为绑定与对象分离，见变量声明章）。
      记住一句话：**改内容会传染，改绑定不会。**
