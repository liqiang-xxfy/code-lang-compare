# typescript —— practice / toolchain
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/practice/features.yaml 里 `group: toolchain` 的那批：
# compile-run / bundler / linter-formatter / type-checker / runtime-version / repl。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的头号事实是**「必须编译」这句话已经不成立了** ——
# 运行时现在默认就能直接跑纯类型标注的源码（类型擦除自较新版本起默认开启、
# 之后转为稳定）。但只支持**可擦除的语法**：枚举、带运行时代码的命名空间、
# 构造函数参数属性这些会直接报错，仍然要过编译器。
# 第二条同样要紧、且全站只有这里有：**打包器不做类型检查** ——
# 「构建成功」与「类型正确」是两件事，检查必须单独跑。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: practice-toolchain-v1
    generatedAt: '2026-10-03'

boxes:
  compile-run:
    code: |
      // @note 现在可以直接跑 TypeScript —— 纯类型标注不需要构建
      //   node app.ts               // 标注与接口被就地擦掉

      // @note! 但只支持**可擦除的语法**，下面这些会直接报错：
      //   enum Color { Red }                          // @note! 不支持
      //   namespace N { export const x = 1 }          // @note! 不支持
      //   class C { constructor(private x: number) {} }  // @note! 参数属性不支持

      // 传统路线仍然最全：先编译再跑
      //   npx tsc                   // 按配置产出 JavaScript
      //   node dist/app.js

      // @note 直接跑有两个额外要求：导入要带扩展名（./lib.ts），
      // @note 且不能引用依赖目录里的 .ts
    vs:
      javascript: |
        这一格最近变了，值得单独记：以前要跑这里写的代码，
        得先过一遍编译；现在**纯类型标注可以直接跑**。
        但两件事仍然要编译 —— 要发布给别人用的库，
        以及用了枚举、装饰器这类**带运行时代码**的语法。
        所以「要不要构建步骤」今天的答案是「看写法」，
        而选写法时多了一条新的权衡：可擦除的语法能省掉整个构建环节。
      python: |
        Python 的标注运行时不生效、代码直接跑；这里现在的处境与那边接近了 ——
        纯标注也能直接跑，不用先编译。
        差别在**检查仍然要另跑一遍**：那边是外部检查器，
        这里是编译器本身加一个「只检查不产出」的开关，
        两边都不是「跑起来就检查过了」。
      java: |
        那边必须先编译成字节码才能跑，没有「直接跑源码」这条路；
        这里有了（限定在可擦除语法内）。这是一处真实的收敛：
        一边是「语言多出来的那层在运行时被忽略」，另一边是「必须过编译」。
        代价是直接跑对运行时版本有要求，而编译产物更独立。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  bundler:
    code: |
      // 这里通常分两步，而且**两步可以是两个工具**：
      //   1. 类型检查：tsc --noEmit            // @note 只检查，不产出
      //   2. 转译与打包：交给打包器            // @note 快得多，但**不检查类型**

      // @note! 这就是「构建成功但类型是错的」的由来 ——
      // @note! 打包器只把类型擦掉，对不对它不管

      // @note 配置里有个开关要求代码能被**单文件转译**，
      // @note 开了它，这种「打包器擦类型 + 另跑检查」的分工才安全
    vs:
      javascript: |
        JavaScript 项目也可能要打包（浏览器场景），但没有类型这一层。
        这里多了一道**类型检查**，而且它可以与打包分开跑 ——
        这正是「构建通过、类型却报错」这种状态存在的原因，
        在那边不存在这个问题（因为没有东西可报）。
      python: |
        Python 交付源码，转译要么不做、要么靠额外工具；
        这里「转译」是常规工序（浏览器与旧运行时都不认标注），
        而且转译与检查是两件事、两个工具。
        从 Python 过来最容易漏掉的就是这一点：跑起来了不等于类型对。
      java: |
        那边编译与类型检查是**同一个动作** —— 编译器既检查又产出，
        不存在「检查过了但产物是坏的」这种组合。
        这里可以拆开，灵活（打包器快得多），但代价是
        保证「两步都跑过」成了人的责任，而不是工具链替你保证的事。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  linter-formatter:
    code: |
      // 检查：ESLint —— 新的扁平配置，配置文件是 eslint.config.js
      //   npx eslint .
      // @note! 旧的那套配置文件格式已经走完弃用流程、在新版本里被移除
      // @note 让检查器看懂类型，要额外接上类型感知的那一套

      // 格式化：Prettier，与检查器分开
      //   npx prettier --write .

      // @note 两者职责分明：格式化只管排版，检查只管规则 ——
      // @note 所以不会出现「格式问题被当成代码问题」的争论
      // @note 另有把两件事合成一个高速工具的方案，团队里也在用
    vs:
      javascript: |
        同一批工具、同一种配置格式，这里是同一套。
        多出来的是**让检查器看懂类型**的那一层：类型感知的规则要先把工程
        整体分析一遍才有结论。收益是能查出「类型层面也可疑」的写法，
        代价是检查变慢，所以大项目常把它放在单独的检查任务里。
      python: |
        两边都是「检查器 + 格式化器」两件套，也都在从多个工具
        向一个高速工具收拢。差别在配置形态：那边是配置文件加插件；
        这里的检查器新版改成了单文件扁平配置，插件以模块形式引入，
        配置就是一段代码 —— 好处是能算、能复用，
        代价是不再是一份纯数据的清单。
      java: |
        那边的静态检查靠第三方插件、与构建工具绑定，检查是构建的一部分；
        这里的检查器是独立的命令行工具，构建根本不关心它 ——
        所以「要不要在构建里卡检查」是团队自己决定的事，
        而不是构建工具替你安排的。
    equivalence:
      javascript: analogous
      python: analogous
      java: divergent

  type-checker:
    code: |
      // 类型检查器就是编译器，但可以只检查不产出：
      //   npx tsc --noEmit
      // 编辑器里给红线的也是同一套（语言服务跑的就是它）

      // @note! 关键分工：**打包器与运行时都不做类型检查** ——
      // @note! 打包器只擦类型；运行时直接跑源码时也只擦类型
      // @note! 所以「跑起来了」「构建成功了」都不等于类型正确，
      // @note! 检查必须作为独立的一步跑

      // @note 想让「只能用可擦除语法」成为硬要求，配置里有个开关可以开
    vs:
      javascript: |
        那边的类型检查是可选的（装了就检查、不装就没有）；
        这里它是项目的核心工具，但仍然**可以只检查不产出**。
        实际工作里这一点很有用：检查跑得比完整构建快，
        可以单独放进提交钩子或流水线的早期阶段。
      python: |
        两边都把类型检查当成**独立的一步**（那边是外部工具，
        这里是编译器加一个开关）。差别在**权威性**：
        这里的检查器就是语言的实现，规则与语言一一对应；
        那边的检查器是第三方实现，各家在推断能力与严格程度上
        有差异，换一个检查器可能报出不同的结果。
      java: |
        那边类型检查是编译的一个环节，通过即产出，
        不存在「只检查」这种模式；这里两种模式都有，
        而且**检查与产出用的是两套工具**（编译器与打包器）。
        这是最容易踩的一处：把打包成功当成检查通过。
        两边都有编辑器实时提示，但这里的提示与命令行是同一套实现，
        所以不会出现「编辑器说没事、命令行报错」。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  runtime-version:
    code: |
      // 两个层面，都不硬：
      //   1. 清单里的版本要求字段 —— 默认只是**建议**，不满足只警告
      //   2. 真正的版本切换靠外部工具（版本管理器或流水线镜像）
      // {
      //   "engines": { "node": ">=20" }
      // }

      // @note! 想让它变成硬失败，要另外开启强制选项
      // @note 仓库里常放一个版本说明文件，版本管理器据此自动切换 ——
      // @note 那是生态约定，不是官方机制
    vs:
      javascript: |
        完全同一套：同一个清单字段、同一批版本管理器、
        连「默认只是建议」这条也一样。类型那一层管不到运行时版本。
      python: |
        两边都是「声明归声明、实际归环境」：那边通常只声明需要某个版本以上，
        实际版本靠虚拟环境与流水线保证。差别在多包工程 ——
        这里的工作区共享同一套运行时要求，那边要每个包各自声明。
      java: |
        Java 有环境变量指向 JDK、还有编译参数约束目标版本，
        运行时不符时报错往往推迟到运行；这里的版本要求字段还要更弱一些
        （默认只警告）。两边都没有「代码说了算」的机制，
        但那边至少有编译期的一道约束，这里完全没有。
    equivalence:
      javascript: identical
      python: analogous
      java: divergent

  repl:
    code: |
      // 交互式环境是运行时自带的那个，但它**不认类型标注**：
      //   node                      // 进提示符
      //   const z: number = 3;      // @note! 语法错误：交互模式不做类型擦除
      //   const z = 3;              // @note 这样才行

      // @note 从标准输入喂进去的代码倒是可以带类型（要指明输入类型）
      // @note! 想交互式写带类型的代码，得另外装一个能跑它的运行时
    vs:
      javascript: |
        同一个交互式环境，差别只有一条：**它不认类型标注**。
        类型擦除那条路只对文件生效，交互模式里写标注会直接报语法错误。
        所以想交互式试这里写的代码，要么去掉标注，
        要么另装一个支持它的运行时。
      python: |
        两边的交互式环境处境不同：Python 的标注本身就是合法表达式，
        在交互模式里照写不误；这里的标注在交互模式里是**语法错误**。
        这正好说明类型那一层属于编译阶段 —— 交互模式没有那个阶段，
        所以多出来的语法无处安放。
      java: |
        那边有官方交互式环境，而且它认完整的语言语法；
        这里的交互式环境认的是**擦除之后**的代码，标注反而成了障碍。
        差别在交互环境与语言的关系：那边它是语言自己的实现，
        这边它是运行时提供的，不认识语言多出来的那一层。
    equivalence:
      javascript: analogous
      python: analogous
      java: analogous
