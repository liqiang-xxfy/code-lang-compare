  - featureId: basics-java/arithmetic
    equivalence: divergent
    code: |
      7 / 2;                      // @note! 3.5 —— 没有整数除法，与 Java 的 3 不同
      Math.trunc(7 / 2);          // 3 —— 要截断得自己调用
      Math.floor(-7 / 2);         // -4 —— 想模拟"向下取整"要用 floor
      -7 % 3;                     // @note! -1 —— 这条与 Java 一致

      2 ** 31 | 0;                // @note! -2147483648 —— 位运算会截成 32 位
