# 迁移陷阱 —— 带着 Python 的习惯写 Java 会踩的坑
# severity: 1 = 一般 / 2 = 经常踩 / 3 = 必踩

- id: pitfall-py2java-defaults-missing
  title: 以为参数能少传，结果编译不过
  symptom: 照抄 Python 的函数签名，调用处只传前两个参数，Java 直接编译报错「实际参数列表和形式参数列表长度不同」。
  cause: Java 没有默认参数语法，签名里的每个参数调用时都必须给全。
  fix: |
    用重载补默认值：让参数少的版本转调参数全的版本，默认值只写一处。
    可选参数再多就换成 Builder（`Config.builder().port(5432).build()`），
    它顺带补上了 Java 缺失的具名参数。
  severity: 3
  languages: [python, java]
  fromBaseline: true
  featureId: python2java/defaults
  tags: [函数, 签名]

- id: pitfall-py2java-kwargs-typed
  title: '`**kwargs` 没有对应物，被迫改成 Map'
  symptom: Python 里靠 `configure(**options)` 收集的散装配置，迁到 Java 后不知道该用什么类型接。
  cause: Java 没有关键字参数，也没有同类型的"任意具名参数"机制；`Map<String, Object>` 是唯一能装下不确定键的手段。
  fix: |
    短期用 `Map<String, Object>`，但要意识到这**丢掉了类型安全** ——
    Python 里静默吞掉拼错的键，Java 里会变成运行时 `ClassCastException`。
    长期方案是把配置项固化成 Builder 或 record，让编译期能拦住拼错的键。
  severity: 1
  languages: [python, java]
  fromBaseline: true
  featureId: python2java/variadic
  tags: [函数, 类型]

- id: pitfall-py2java-indentation-is-not-scope
  title: 以为缩进也决定了变量作用域
  symptom: 在 `if` 块里声明的变量，出了块还想用，Java 编译报错「找不到符号」。
  cause: Python 的块不产生作用域，Java 的局部变量是块级的 —— 缩进结构看起来一样，作用域规则相反。
  fix: |
    在 Java 里把「变量可见范围」按 `{}` 来读，而不是按缩进。
    迁移时最省事的做法：把 Python 里那些"在块内赋值、块外使用"的变量
    提到块的上一层声明。
  severity: 3
  languages: [python, java]
  fromBaseline: true
  featureId: basics-python/var-scope
  tags: [作用域]

- id: pitfall-py2java-none-vs-null
  featureId: concepts-python/null-value
  title: '`None` 迁成 `null` 之后，字符串拼接没炸但结果不对'
  symptom: Python 里 `f"{name}"` 遇到 `None` 会打印 "None"；Java 里 `"x" + null` 得到 "xnull"，看起来"能用"，于是错误被带到了下游。
  cause: 两种语言都把空值转成了一段文本而不是报错，但文本不同（"None" vs "null"），而且都不会提醒你这里根本不该为空。
  fix: |
    不要依赖字符串拼接暴露空值。在 Java 侧显式判空
    （`Objects.requireNonNull` 或 `Optional`），让"不该为空却为空"在最近的地方失败。
  severity: 2
  languages: [python, java]
  fromBaseline: true
  tags: [空值, 字符串]

- id: pitfall-py2java-boxing-equality
  featureId: concepts-python/numeric-type
  title: '`Integer` 的 `==` 有时对、有时不对'
  symptom: |
    `Integer a = 127; Integer b = 127;` 时 `a == b` 是 true；
    换成 128 就变成 false。同一段代码，只因为数值大小不同而行为不同。
  cause: |
    Java 的 `==` 比的是引用。`Integer` 是包装类，`-128..127` 这一段会被
    自动装箱缓存复用同一个对象，超出范围就各建一个 —— 于是「小数字对、
    大数字错」。而 Python 的 `int` 是值语义（只有 `is` 才有身份问题），
    所以「两个整数相等」这件事在 Python 里从来没有陷阱。
  fix: |
    包装类一律用 `.equals()` 比较，需要容忍 null 时用 `Objects.equals(a, b)`；
    数值计算优先用基本类型 `int` / `long`，只在必须进集合或泛型时才装箱。
  severity: 3
  languages: [python, java]
  fromBaseline: true
  tags: [相等, 数值]
