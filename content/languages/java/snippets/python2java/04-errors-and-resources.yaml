      // @note! 异常体系裂成两半：受检（除 RuntimeException 外）与非受检
      void load() throws java.io.IOException {     // @note 受检：必须声明，或当场捕获
          java.nio.file.Files.readString(java.nio.file.Path.of("a.txt"));
      }

      void parse(String s) {
          if (s.isEmpty()) throw new IllegalArgumentException("空输入");   // @note 非受检：不用声明
      }

      // @note Error（OutOfMemoryError 等）是 JVM 层面的，不该捕获 ——
      // 大致对应 Python 里 BaseException 与 Exception 的那条分界
  - featureId: python2java/exception-model
    equivalence: divergent
    code: |
      try {
          risky();
      } catch (java.io.IOException | java.nio.file.NoSuchFileException e) {   // @note 多重捕获
          fallback();
      } catch (RuntimeException e) {
          log(e);
          throw e;                       // 重新抛出，保留原始栈
      } finally {
          cleanup();                     // 一定会执行
      }

      // @note! 没有 else 子句：要"只捕获可能抛的那一句"，
      // 只能手动把其余语句移出 try 块 —— 用块的范围代替 else 的作用
