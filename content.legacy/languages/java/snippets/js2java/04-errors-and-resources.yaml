      try {
          risky();
      } catch (java.text.ParseException | java.lang.IllegalStateException e) {   // @note! 多重捕获
          fallback();
      } catch (RuntimeException e) {
          throw e;                                 // 重新抛出
      } finally {
          cleanup();
      }

      // @note! catch 必须写类型，不能写 catch (e)；分类从函数体移到了子句上
