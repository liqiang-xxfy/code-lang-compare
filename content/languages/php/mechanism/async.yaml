# php —— mechanism / async
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: async` 的那批：
# event-loop / callback / promise-future / async-await / cancellation。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 口径说明：这一组的五格讲的都是**同一件事的五个侧面** ——
# 「PHP 核心没有异步」。所以每一格都不能写成「PHP 的 Promise 是怎样的」，
# 而要写「这个位置在 PHP 里是空的，谁在填」。
#
# 三条要写准的：
# ① 核心只有底层的 `stream_select()`，**不是事件循环**；
# ② `Fiber`（8.1）只做「协作式挂起 / 恢复」，**不含调度器**，
#    官方 RFC 明说它是给库作者用的底层原语；
# ③ 生态那一层是**第三方**（ReactPHP / Amp / Revolt）或 **PECL 扩展**
#    （Event / Ev / Eio / parallel / Swoole），不是语言的一部分。
#
# **实跑范围的诚实说明**：本机是 Windows NTS 构建，
# Event / Ev / Eio / parallel / Swoole / APCu **都没装**。
# 所以下面标了「本机实测」的只有 `Fiber` 的行为与
# 「核心包里没有这些类」的否定结论；生态库的 API 是按各自文档写的，
# **没有在本机跑过**。

