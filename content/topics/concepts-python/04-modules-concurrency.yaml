id: concepts-python/04-modules-concurrency
topicId: concepts-python
title: 模块、并发与内存
order: 4
summary: 代码怎么分文件、内存谁来收、同时干几件事时到底谁在跑
features:
  - id: concepts-python/module-system
    title: 模块系统
    kind: concept
    summary: import 是会执行的语句，JS 的 import 是静态提升的绑定

  - id: concepts-python/memory
    title: 内存管理
    kind: concept
    summary: 引用计数让释放可预期，JS 的标记清除让「对象何时消失」完全不透明

  - id: concepts-python/concurrency-unit
    title: 并发单元
    kind: concept
    summary: 你有线程/进程/协程但被 GIL 限制，JS 只有一个线程跑回调、CPU 密集丢给 Worker

  - id: concepts-python/async-model
    title: 异步模型
    kind: concept
    summary: asyncio 需要显式启动事件循环；JS 的事件循环一直在跑，调用即执行
