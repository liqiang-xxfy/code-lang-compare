  - featureId: java2python/nullability
    equivalence: divergent
    code: |
      x = None                       # @note 任何名字都可能是 None ——
                                     # "基本类型不可能为空"那层保证没有了

      x is None                      # @note 判空用 is，不是 ==
      x == None                      # @note! 能跑但不该用：对象自定义了 __eq__ 就可能反直觉

      # @note! 判空别写 if not x：它把 0 / "" / [] 全归为假，
      # 与 Java 的 x == null 含义完全不同
      if not x:
          pass
      if x is None:                  # 要判"是不是空值"就写这个
          pass

      # @note 没有 Optional 的对应物，惯例是直接返回 None 并在文档里写明
  - featureId: java2python/types-exercise
    equivalence: analogous
    code: |
      def summarize(scores):
          if not scores:
              return None
          total = sum(scores)                    # @note 不用 long，也不会溢出
          avg = total / len(scores)              # @note! 这里不需要 (double) 强转 ——
                                                 # / 本来就是浮点除法，行为恰好与 Java 一致
          return f"总分 {total}，平均 {avg:.2f}"
      # @note! 但"恰好一致"是运气：换一处 / 想表达整除时就静默变成了小数
