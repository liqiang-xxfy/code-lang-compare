# 一个方向的来源与校对留痕。
#
# 为什么单独放一份：三个内容文件（pitfalls / glossary / roadmap）的顶层**是数组**，
# 没有文件级的位置放 review；把顶层改成 { review, items } 会打破沿用至今的旧契约。
# 所以留痕集中在每个方向一份的 meta.yaml 里（ADR-66），与 languages/<语言>/meta.yaml 同构。
#
# 归属（基准 / 目标）由**目录名**反查得到，不写在这里 —— 目录名已经是唯一真源。
#
# ⚠ 这一层**不接入校验规则**：R3 / R6 / R17 只管辖 languages/ 的对比框。
#   写在这里的 state 是如实标注，不是发布门槛 —— 但它也不该因此写虚。
#
# 升级 state 到 reviewed / verified 时，请一并补 reviewedBy 与 reviewedAt。

review:
  state: draft
  provenance:
    origin: llm
    model: claude-code-agent
    promptTemplateId: pairs-direction-v2
    generatedAt: '2026-10-04'
