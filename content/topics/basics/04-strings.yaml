id: basics/04-strings
topicId: basics
title: 字符串与模板
order: 4
summary: 字面量、插值、多行、常用方法

features:
  - id: basics/string-literal
    title: 字符串字面量
    kind: syntax
    summary: 引号的选择与差异
    body: |
      两边单引号与双引号都完全等价（无性能差异、无语义差异），团队风格统一即可。
      JS 用反引号 `` ` `` 表示模板字符串；Python 用三引号表示多行。这两者是各自独有的记号。

  - id: basics/template-string
    title: 模板字符串与插值
    kind: syntax
    summary: 反引号 vs f-string
    body: |
      JS：`` `Hello, ${name}!` ``，任意表达式都能放在 `${}` 里，且反引号天然支持换行。
      Python：`f"Hello, {name}!"`，写法更简洁，但**多行要靠三引号**（f-string 本身不提供多行能力）。
      注意 Python 的 `{}` 里不能写反斜杠转义，复杂表达式建议先算好再插值。

  - id: basics/string-methods
    title: 常用字符串方法
    kind: behavior
    summary: 方法命名与返回值语义的差异
    body: |
      这一格属于「知道就好，但不知道会卡住」类：
      JS 的 `trim` → Python 的 `strip`；JS 的 `includes` 返回布尔 → Python 的 `find` 返回下标（找不到返回 `-1`）。
      方法名在 Python 里全部小写（`toUpperCase` → `upper`、`padStart` → `zfill`），没有 camelCase。

  - id: basics/multiline-string
    title: 多行字符串
    kind: syntax
    summary: 两种写法与惯用拼接
    body: |
      JS 靠反引号直接换行；Python 靠三引号。
      拼接数组/列表时两边都是「分隔符在中间」：JS `arr.join('\n')`、Python `'\n'.join(list)`——
      **主宾语顺序相反**（JS 是数组调用 join，Python 是分隔符调用 join），这是最容易写错的一处。

  - id: basics/fstring-format
    title: 格式化输出
    kind: behavior
    summary: 数值格式化与占位符
    body: |
      JS 没有 printf 风格的**语言级**格式化：数值要靠 `toFixed()` / `padEnd()` 这类方法拼，
      货币 / 百分比 / 千分位则走内置的 `Intl.NumberFormat`。
      Python 的格式说明符直接写在 f-string 里（`f"{n:.2f}"`），表达力强得多，
      而且带「总宽度」概念（`:08.2f` 表示宽 8）—— Intl 只能控制整数位 / 小数位。
      `console.log("%s", x)` 的占位符是浏览器 / Node 的调试能力，不是语言特性，别搞混。

  - id: basics/string-index-slice
    title: 索引与切片
    kind: behavior
    summary: 负索引、越界与步长
    body: |
      JS 用 `charAt(pos)` 或 `str[pos]`，Python 用 `s[pos]`——
      但 Python 的 `s[pos]` 返回的是**长度为 1 的字符串**（Python 没有字符类型），
      JS 的 `str[pos]` 也是字符串，这一点一致。
      差异在越界和切片：JS 越界返回 `undefined`/空串（静默），Python 抛 `IndexError`；
      Python 的切片支持负索引和**步长**（`s[::-1]` 一行反转），JS 完全没有切片语法。

  - id: basics/string-regex
    title: 正则表达式
    kind: behavior
    summary: 字面量、命名分组与搜索结果形态
    body: |
      JS 有正则**字面量** `/pattern/flags`，Python 必须用 `re.compile()` 或字符串——
      这意味着 Python 里的反斜杠要写两遍，或者用 `r'...'` 原始字符串（正则场景几乎总要加 `r`）。
      两处易错差异：
      ① Python 的 `re.match` 只匹配**开头**（等价于 JS 的 `^`），想任意位置匹配要用 `re.search`；
      ② JS 的 `'a1'.match(/(\d)/)` 返回带 index/input 的数组或 null，
         Python 返回 `Match` 对象或 `None`，取值方式（`.group()` vs 数组下标）不同。
      命名分组两边都支持，但写法不同（JS `(?<name>...)`，Python `(?P<name>...)`）。

  - id: basics/string-concat
    title: 字符串拼接
    kind: syntax
    summary: + 与 join，以及性能取向
    body: |
      `+` 两边都支持，但 Python **不做隐式类型转换**：`'a' + 1` 直接抛 `TypeError`，
      而 JS 会给 `'a1'`。
      拼接大量字符串时，JS 用 `Array.join` 或模板字符串，Python 用 `''.join(list)`——
      后者的语义是「用分隔符连接序列」，看起来更绕但底层都是「一次性分配」。
      Python 里 `+` 在循环里反复拼接会退化成 O(n²)，这是常见的性能问题。

  - id: basics/string-raw-escape
    title: 转义与原始字符串
    kind: syntax
    summary: 反斜杠灾难与 raw 字符串
    body: |
      转义序列本身一致（`\n`、`\t`、`\\`）。
      差异在需要「反斜杠字面量」时的处理：Windows 路径、正则表达式这类场景里，
      JS 只能靠双写反斜杠，Python 有 `r'...'` 原始字符串，可读性明显更好。
      反过来，Python 里 `r'...'` 不能以奇数个反斜杠结尾，这是个小限制。
      另外两边的 Unicode 转义写法不同：JS 是 `\u{1F600}`，Python 是 `\U0001F600`。

