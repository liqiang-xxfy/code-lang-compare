- featureId: basics/if-else
  equivalence: analogous
  code: |
    if score >= 90 {
        grade = "A"
    } else if score >= 60 {      // @note! else 必须紧跟在 } 后面同一行，换行会编译错误
        grade = "B"
    } else {
        grade = "C"
    }

    // @note 条件不加括号（与 JS / Java 相反），且必须是 bool
    // @note if 还能带初始化语句
    if v, err := compute(); err == nil {
        _ = v
    }
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/ternary
  equivalence: absent
  body: |
    Go **没有三元运算符**，这是 Go 里少见的「表达力明显弱于 JS」的地方。
    官方立场是 if/else 已经够用，且三元表达式容易写出难以阅读的嵌套。

    实际项目里的两种应对：展开成 if/else，或者封装一个极小的辅助函数
    （因为 Go 的 if 是语句不是表达式，函数是唯一的「表达式化」手段）。
  code: |
    // @note! 没有 a ? b : c 这种写法
    var label string
    if score >= 60 {
        label = "及格"
    } else {
        label = "不及格"
    }

    // 或者封一个小函数，之后就能当表达式用
    func ternaryStr(c bool, a, b string) string {
        if c {
            return a
        }
        return b
    }
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/switch-match
  equivalence: divergent
  code: |
    switch day {
    case Mon:
        fmt.Println("周一")
    case Tue, Wed:              // @note 一个 case 可以列多个值
        fmt.Println("工作日")
    default:
        fmt.Println("其他")
    }

    // @note! Go 的 switch **默认不穿透**：不需要 break，也几乎不用 fallthrough
    //        这与 JS / Java 正好相反 —— 是控制流里少见地「Go 更安全」的一处

    // 还能写成无表达式的形式，直接罗列条件
    switch {
    case score >= 90:
        grade = "A"
    case score >= 60:
        grade = "B"
    }
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/for-loop
  equivalence: divergent
  code: |
    for i := 0; i < 10; i++ { }      // @note 唯一的循环关键字就是 for（三段式）
    for i := range 10 { }            // @note Go 1.22+ 支持 range over int

    for _, v := range list { }       // 遍历
    for { }                          // 无限循环（等价于 while true）

    // @note! Go 没有 while / do-while 关键字：所有循环都是 for 的变体
  review:
    state: draft
    provenance:
