# javascript —— model / modules
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: modules` 的那批：
# module-unit / export-import / default-vs-named / namespace-alias / module-resolution。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-modules-v1
    generatedAt: '2026-10-03'

boxes:
  module-unit:
    code: |
      // 一个文件就是一个模块
      const secret = 1;          // @note 模块作用域 —— 外部看不见
      export const shared = 2;   // @note 只有导出的才可见

      import.meta.url;           // @note 模块自己的元信息
      // @note! 没有 module.exports / require —— 那是另一套（CommonJS）
    baseline: |
      **一个文件就是一个模块**，文件里的顶层名字默认是模块私有的，只有 `export`
      出去的才可见。没有全局包装函数、没有 `module` 对象（那是旧的 CommonJS）。
      模块只在第一次被导入时执行一次，之后拿到的是同一份实例。
    vs:
      python: |
        两边都是「一个文件一个模块、顶层名字默认私有」，思路一致。区别在副作用：
        Python 的 import **会执行整个文件**，所以模块顶层的语句会跑；
        这里也一样，但导入是静态声明的、可以先被分析。
      java: |
        Java 的模块单位是**类**而不是文件（一个文件放几个类都行），
        命名空间靠 `package` 声明而不是目录位置。文件与模块在 Java 里不是一回事，
        在两边则是同一件事。
    equivalence:
      python: analogous
      java: divergent

  export-import:
    code: |
      // a.js
      export const x = 1;
      export function f() {}
      export { x as y };              // @note 导出时改名

      // b.js
      import { x, f } from './a.js';  // @note 必须写 ./，扩展名不能省
      import { x as renamed } from './a.js';

      // @note! import / export 只能在顶层 —— 不能写在 if 里
      // if (cond) { import { x } from './a.js'; }   // 语法错误
    baseline: |
      `export` 与 `import` 是**静态的**：只能写在模块顶层，路径必须是字面量。
      换来的是构建工具能提前分析依赖图、做摇树。命名导入要写清路径 ——
      相对路径必须带 `./`，扩展名也不能省（不带扩展名的是包名，会去 node_modules 找）。
    vs:
      python: |
        Python 的 `import` 是**运行时语句**，可以写在函数里、可以条件导入，
        模块名也可以拼出来 —— 代价是依赖图要跑起来才知道。这里（ESM）的
        导入导出是静态的，写在 `if` 里直接语法错误。
      java: |
        Java 的 `import` 只是**给类型起个短名的编译期声明**，不加载任何东西 ——
        类什么时候加载由 JVM 决定，删掉 import 改写成全限定名，程序行为一字不变。
        这里的 import 会真的把模块拉进来并执行一次。
    equivalence:
      python: divergent
      java: divergent

  default-vs-named:
    code: |
      // a.js
      export default function () {}   // @note 默认导出：一个模块只能有一个
      export const named = 1;

      // 导入侧：默认导出可以随便起名，具名导出的名字必须对上
      import anything from './a.js';
      import { named } from './a.js';
      import anything2, { named as n } from './a.js';

      // @note! 具名导入拿到的是**活绑定** —— 模块里改了，导入方也看得见
    baseline: |
      **两种导出**：默认导出（一个模块最多一个，导入方可以随意起名）与具名导出
      （名字必须对上，可以用 `as` 改）。具名导入拿到的是**活绑定**而不是快照 ——
      被导入模块里的变量后来变了，导入方读到的也是新值。
    vs:
      python: |
        Python 只有「具名」这一种：模块里的名字就是导出，没有默认导出。
        想要「一个模块一个主入口」的写法，惯例是把它命名为 `main` 之类。
        Python 也没有活绑定这回事，名字在导入时取到值，之后各是各的。
      java: |
        Java 压根没有「导出什么」这个动作：`public` 的成员谁都能用，
        `private` 的谁都不能用，没有中间层，也没有默认导出与具名导出之分。
        两边想在模块外部访问内部名字，靠的是可见性修饰符而不是导出清单。
    equivalence:
      python: divergent
      java: divergent

  namespace-alias:
    code: |
      import * as ns from './a.js';          // @note 整包挂到一个命名空间对象
      ns.named;

      import { veryLongName as short } from './a.js';   // @note 导入时改名
      import './polyfill.js';                // @note 只要副作用，不取任何名字

      // @note! import * 拿不到默认导出 —— 它在 ns.default 上
    baseline: |
      `import * as ns` 把整个模块挂成一个命名空间对象（默认导出在 `ns.default` 上），
      `as` 用来解决重名。`import './x.js'` 是「只为了副作用」的写法。
      与别的语言不同，这里的别名只影响**本地名字**，不会改变模块自己的导出名。
    vs:
      python: |
        Python 的 `import x as y` 与 `from x import y as z` 覆盖了同样两种需求，
        写法几乎一一对应。差别在 `import *`：Python 的 `from x import *` 会把名字
        直接摊进当前命名空间（还受 `__all__` 限制），这里的 `import * as ns`
        是收进一个对象里，不会污染当前作用域。
      java: |
        Java **没有别名机制** —— 类型名冲突时只能写全限定名
        （`java.util.Date` 与 `java.sql.Date` 同时用时必有一方要写全路径）。
        这里的 `as` 随手就能解决重名，Java 只能靠完整包名区分。
    equivalence:
      python: analogous
      java: divergent

  module-resolution:
    code: |
      import './sibling.js';           // @note 相对路径：必须带 ./ 或 ../
      import '/abs/path.js';           // @note 绝对路径（少见）
      import 'lodash';                 // @note 裸标识符 -> node_modules
      import '#internal';              // @note 子路径导入，由 package.json 的 imports 映射

      // @note! 扩展名不能省（Node 的 ESM 里 ./a 会被当成包名）
      // @note! index.js 的自动补全在 ESM 里**没有** —— 要显式写全
    baseline: |
      解析规则是**显式**的：带 `./` 的是相对路径、不带的是包名（去 `node_modules` 找），
      扩展名不能省，也不会自动补 `index.js`。包内部还可以用 `package.json` 的
      `exports` / `imports` 字段定义对外暴露哪些子路径。规则写在文件里，
      不需要额外的配置就能读懂。
    vs:
      python: |
        Python 靠**运行时的搜索路径**（`sys.path`）找模块：当前目录、安装目录、
        环境变量，逐个去找，同名模块看谁先被找到。这里（ESM）的解析是确定的、
        由路径本身与 `package.json` 决定，不依赖搜索顺序。
      java: |
        Java 靠 **classpath / module path** 搜索：包名对应目录结构，
        类加载器按路径顺序找第一个匹配的。它是「搜索」而不是「按路径定位」，
        因此会遇到「同名类谁先被加载」这类问题。
    equivalence:
      python: divergent
      java: divergent
