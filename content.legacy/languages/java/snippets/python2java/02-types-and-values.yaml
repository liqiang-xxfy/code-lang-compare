  - featureId: python2java/nullability
    equivalence: divergent
    code: |
      String x = null;                // @note 只有引用类型能为 null

      int n;                          // @note! 基本类型不能为 null：字段默认 0，局部必须赋值
      // int m = null;                // 编译错误

      Integer boxed = null;
      int unboxed = boxed;            // @note! NullPointerException —— 拆箱那一刻才炸

      List<Integer> xs = new ArrayList<>();   // @note 泛型只能装包装类型
      xs.add(null);
      xs.get(0) + 1;                  // @note! 这里才 NPE，报错位置离原因很远

      java.util.Optional.ofNullable(x).orElse("默认");
      // @note 官方推荐用它表达"可能没有"，但只能装引用类型
  - featureId: python2java/types-exercise
    equivalence: analogous
    code: |
      static String summarize(List<Integer> scores) {
          if (scores.isEmpty()) {
              return null;                          // @note 与 Python 的 None 对应
          }
          long total = 0;                           // @note! 先想位宽：int 可能不够
          for (int s : scores) total += s;

          double avg = (double) total / scores.size();   // @note! 不转 double 就是整数除法
          return String.format("总分 %d，平均 %.2f", total, avg);
      }
