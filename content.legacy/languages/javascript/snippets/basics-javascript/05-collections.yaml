# javascript —— basics/05-collections 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/array-create
    equivalence: identical
    code: |
      const literal = [1, 2, 3];
      const sized = new Array(3);            // @note! 单个数字参数是「长度」不是「元素」，得到 [empty × 3]
      const filled = Array.from({ length: 3 }, (_, i) => i);   // [0, 1, 2]
      const zeros = new Array(3).fill(0);    // @note 必须先 Array(n) 再 fill，否则填充同一个引用

      Array.isArray(literal);                // true
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      字面量都是方括号。批量生成靠 `Array.from` / `fill` / `new Array(n)` ——
      要当心 `new Array(3)` 的单个数字参数是**长度**不是元素（得到 `[empty × 3]`），
      而 `new Array(3).fill([])` 会让三个位置填进同一个引用。
  - featureId: basics-javascript/array-index
    equivalence: identical
    code: |
      const arr = [10, 20, 30];

      arr[0];        // 10
      arr[-1];       // undefined  —— @note! 不支持负索引，不会报错，静默拿到 undefined
      arr.at(-1);    // 30         —— @note at() 才支持负索引（ES2022）
      arr[99];       // undefined  —— @note! 越界读取不报错，这是大量线上 bug 的来源
      arr.length;    // 3
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      下标用 `arr[i]`，但**不支持负索引**：`arr[-1]` 静默给 `undefined`，
      想从末尾数要用 `arr.at(-1)`。越界读取同样是静默的 `undefined` ——
      这是很多线上 bug 的来源，错在下标上却一路跑到很远的地方才显形。
      长度是属性 `arr.length`。
  - featureId: basics-javascript/array-mutate
    equivalence: identical
    code: |
      const arr = [1, 2, 3];

      arr.push(4);           // 尾部追加，返回新长度
      arr.pop();             // 尾部弹出，返回被弹出的元素
      arr.unshift(0);        // 头部插入 —— @note 整表搬移，O(n)
      arr.shift();           // 头部移除

      arr.splice(1, 1);      // @note! 从下标 1 起删 1 个，返回被删元素组成的数组（原地修改）
      arr.splice(1, 0, 99);  // 从下标 1 起删 0 个、插入 99
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      尾部操作最常用：`push` 返回新长度、`pop` 返回被弹出的元素。
      头部操作 `unshift` / `shift` 是 **O(n)**（整表搬移），别放在循环里。
      `splice(起点, 删除个数, ...插入项)` 一个方法同时管删和插，原地修改并返回被删元素 ——
      它把「按位置删」和「按值删」两种意图压成了同一个 API。
  - featureId: basics-javascript/array-slice
    equivalence: identical
    code: |
      const arr = [0, 1, 2, 3, 4];

      arr.slice(1, 3);        // [1, 2]   —— @note 左闭右开，且是浅拷贝（原数组不变）
      arr.slice(-2);          // [3, 4]   —— @note 支持负索引
      arr.slice();            // [0,1,2,3,4] —— 常用作浅拷贝

      // @note! 没有步长语法。想隔一个取一个只能自己写循环或用 filter
      arr.filter((_, i) => i % 2 === 0);   // [0, 2, 4]
      [...arr].reverse();     // 反转要自己来，且必须复制后反转（reverse 是原地操作）
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `slice(a, b)` 是**左闭右开**的浅拷贝（原数组不变），支持负索引，
      不带参数时常用作复制：`arr.slice()`。
      没有步长语法 —— 想隔一个取一个只能自己写循环或 `filter`；
      反转也没有现成的，得先复制再 `reverse`（`reverse` 是原地操作，直接调会改掉原数组）。
  - featureId: basics-javascript/array-iterate
    equivalence: identical
    code: |
      const arr = ['a', 'b'];

      for (const v of arr) console.log(v);        // @note 值：'a' 'b'（for...of 遍历的是值）
      for (const k in arr) console.log(k);        // @note! 键：'0' '1' —— 字符串下标，不是值！
      arr.forEach((v, i) => console.log(i, v));   // 值 + 下标

      // @note! for...in 还会爬到原型链上的可枚举属性，遍历数组永远不要用它
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      这是 JS 自己就有的坑：`for...in` 遍历的是**键**（对数组是字符串下标 `'0'`、`'1'`），
      `for...of` 才是值；而且 `for...in` 还会爬到原型链上的可枚举属性 ——
      遍历数组永远不要用它。要同时拿下标与值，用 `forEach((v, i) => ...)`。
  - featureId: basics-javascript/array-map-filter
    equivalence: identical
    code: |
      const nums = [1, 2, 3, 4];

      nums.map((n) => n * 2);              // [2, 4, 6, 8]
      nums.filter((n) => n % 2 === 0);     // [2, 4]
      nums.reduce((acc, n) => acc + n, 0); // 10  —— @note 初值显式给，否则空数组会抛错
      nums.find((n) => n > 2);             // 3
      nums.some((n) => n > 3);             // true  —— 任一满足
      nums.every((n) => n > 0);            // true  —— 全部满足

      // @note 全是链式方法、立即求值：每一步都产出新数组，长链会创建多个中间数组
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 靠链式方法，而且**每一步都立即求值**：`map` / `filter` / `reduce` / `find` /
      `some` / `every` 都产出新数组，长链会创建多个中间数组。
      `reduce` 的初值要显式给，否则空数组会抛错。
  - featureId: basics-javascript/array-sort
    equivalence: identical
    code: |
      const nums = [10, 9, 1];

      nums.sort();                          // @note! [1, 10, 9] —— 默认按「字符串」比较，数字排序必须传比较函数
      nums.sort((a, b) => a - b);           // [1, 9, 10]
      nums.sort((a, b) => b - a);           // 降序

      // @note! sort() 原地修改并返回同一数组引用
      const copy = [...nums].sort();        // 想不改原数组，必须先复制

      const people = [{ age: 30 }, { age: 20 }];
      people.toSorted((a, b) => a.age - b.age);  // @note ES2023 的 toSorted 才返回新数组
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      **这是 JS 自己最容易静默出错的一格。** `sort()` 默认把元素转成字符串比较 ——
      `[10, 9, 1].sort()` 得到 `[1, 10, 9]`，数字排序必须传比较函数 `(a, b) => a - b`。
      而且 `sort()` **原地修改并返回同一个数组引用**（误以为它返回新数组，就会引入
      共享 bug），想不改原数组必须先复制；ES2023 的 `toSorted` 才返回新数组。
  - featureId: basics-javascript/array-search
    equivalence: identical
    code: |
      const arr = [1, 2, 3];

      arr.includes(2);          // true   —— 布尔
      arr.indexOf(2);           // 1      —— @note! 找不到返回 -1（真值），直接当布尔用会永远成立
      arr.find((n) => n > 2);   // 3      —— 元素，找不到返回 undefined
      arr.findIndex((n) => n > 2);  // 2   —— 下标，找不到返回 -1

      arr.lastIndexOf(3);       // 2
      // @note 所有查找都是 O(n) 线性扫描；要频繁查找得用 Set / Map
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      四个方法的返回值语义各不相同，混在一起容易记错：`includes` 给布尔、
      `indexOf` 给下标（**找不到返回 `-1`**，而 `-1` 是个真值，直接当布尔用会永远成立）、
      `find` 给元素（找不到给 `undefined`）、`findIndex` 给下标。
      都是 O(n) 线性扫描；要频繁查找得换成 `Set` / `Map`。
  - featureId: basics-javascript/array-unpack
    equivalence: identical
    code: |
      const a = [1, 2];
      const b = [3, 4];

      const merged = [...a, ...b];          // [1, 2, 3, 4]  —— @note 展开运算符
      const copy = [...a];
      const [first, ...rest] = merged;      // first=1, rest=[2,3,4]

      Math.max(...merged);                  // @note 同一符号在「调用传参」处也是展开

      const obj = { x: 1, y: 2 };
      const { x, ...others } = obj;         // @note 对象解构同样用 ...
    review:
      state: reviewed
      provenance:
        origin: llm
        model: claude-sonnet-4.5
        promptTemplateId: m1-snippet-v1
        generatedAt: '2026-10-01'
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
      notes: 校对逐条实跑验证：解构、展开、rest 行为与注释一致
    body: |
      JS 的 `...` 在「构造新数组」与「函数调用传参」两个位置含义不同，但写法相同；
      对象解构与对象展开也用同一个符号：`const { x, ...others } = obj`。
      `[first, ...rest]` 是 rest 解构，把剩余元素收成一个新数组。
