  - featureId: basics-java/type-inference
    equivalence: identical
    code: |
      int x = 1;                  // @note 变量有类型，写死在声明处
      var y = 1;                  // @note var 只是省略类型名，y 依然是 int
      // y = "一";                // 编译错误 —— 错误提前到编译期，不是运行时

      // @note var 不能用于字段、方法参数、没有初始化的声明
  - featureId: basics-java/type-checking
    equivalence: identical
    code: |
      Object v = 1;
      v instanceof Integer;       // @note true —— 认继承关系
      if (v instanceof Integer i) { i + 1; }   // @note 模式匹配：判定与绑定一步到位

      // @note! 泛型在运行期被擦除：v instanceof List<String> 编译不过
      // 只能写 v instanceof List<?>
  - featureId: basics-java/null-undefined
    equivalence: identical
    code: |
      String s = null;            // @note 只有引用类型能为 null
      int n;                      // @note 基本类型不可能为空：字段默认 0，局部必须赋值
      // int m = null;            // 编译错误

      s.length();                 // @note! NullPointerException，编译期一句话都不说

      Integer boxed = null;
      int unboxed = boxed;        // @note! 拆箱那一刻才炸

      java.util.Optional.ofNullable(s).orElse("默认");
  - featureId: basics-java/number-precision
    equivalence: identical
    code: |
      7 / 2;                      // @note 3 —— 整数除法，向零截断
      -7 / 2;                     // -3
      -7 % 3;                     // @note! -1 —— 取余符号跟着被除数走

      Math.floorDiv(-7, 2);       // -4 —— 要"向下取整"用这个
      Math.floorMod(-7, 3);       // 2 —— 必须与 floorDiv 成对使用

      Integer.MAX_VALUE + 1;      // @note! 溢出静默回绕，不报错也不升级类型
      1 / 0;                      // @note! ArithmeticException（整数除零才抛）
      1.0 / 0;                    // Infinity —— 浮点除零反而静默
  - featureId: basics-java/type-casting
    equivalence: identical
    code: |
      double d = 3;               // @note 宽化自动发生，不丢信息
      int i = (int) 3.9;          // @note 窄化必须写括号，直接截断（不是四舍五入）

      Integer.parseInt("3.7");    // @note! NumberFormatException —— 不接受小数写法
      Integer.parseInt("12px");   // @note! 同样抛：它是整串解析，不是解析到非法字符为止
      Integer.parseInt("ff", 16); // 255 —— 进制在这里给
      String.valueOf(255);        // "255"
