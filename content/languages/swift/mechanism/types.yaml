boxes:
  static-vs-dynamic:
    code: |
      let n = 1                    // @note 推断为 Int
      // n = "text"                // @note! 编译错误：类型在编译期定死了

      // 运行时仍然带着真实类型，可以问
      let x: Any = 42
      print(type(of: x))           // @note Int —— 这是值在运行时的类型

      // 取回具体类型要显式转型
      if let i = x as? Int {
        print(i + 1)               // @note 这里才拿回 Int 的能力
      }

      // 协议与泛型都是编译期检查的抽象
      func describe<T>(_ value: T) -> String { "\(type(of: value))" }
    vs:
      javascript: |
        JavaScript 的类型全在运行时，错了跑起来才知道；Swift 在编译期检查，
        类型不匹配根本编译不过。两边都能在运行时问到类型，但入口不同：
        JavaScript 随时可以 `typeof`，Swift 要么把值显式装进 `Any` 这类宽类型
        （再调 `type(of:)`），要么本来就是泛型值 —— 普通变量的类型编译期就钉死了。
        另外 Swift 的协议与泛型是编译期的抽象，JavaScript 里没有这一层。
      python: |
        Python 全程动态，类型错误靠运行暴露；Swift 在编译期检查，错了直接编译不过。
        两边都保留运行时类型信息（Python 的 `type()`、Swift 的 `type(of:)`），
        但 Swift 里「问类型」不常做 —— 编译器早已知道类型，
        只有遇到 `Any` 这种被抹掉类型的值才需要问。
        Python 里任何变量都可能装着别的类型，这种不确定性在 Swift 里是例外状态。
      java: |
        Swift 与 Java 都是静态类型，也都保留运行时类型信息
        （Java 用反射 / `getClass`，Swift 用 `type(of:)` 与 `Any`）。
        泛型上两边**不一样**：Java 的类型参数被擦除，运行时看不到；
        Swift 的泛型参数在运行时是**拿得到的**（泛型函数里能写 `T.self`），
        因为类型元数据会随调用传下去。
        实质差别在抽象形态：Java 靠类继承与接口，Swift 靠协议，
        而 Swift 的协议可以带默认实现 —— 「静态」的强度相当，可扩展的方式不同。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  type-annotation:
    code: |
      func area(r: Double) -> Double { 3.14 * r * r }   // @note 签名必须写类型

      let x = 1                 // @note 推断为 Int，之后类型不能再变
      var y: Int = 1            // @note 显式标注
      var z: Int                // @note 顶层变量拿到默认值 0

      let name: String? = nil   // @note 可空写进类型：String?

      struct Point {            // @note 字段必须写类型
        var x: Double
        var y: Double
      }
    vs:
      javascript: |
        JavaScript 没有任何类型标注；Swift 的标注是编译器的事实来源 ——
        函数签名、字段、全局变量都必须写，能省的只有**局部变量**
        （`let x = 1` 靠初值推断）。所以 Swift 的省略是局部例外、不是常态。
        另一处 JavaScript 没有的是可空标注：`String?` 把「可能为 nil」
        写进了类型，`String` 与 `String?` 在 Swift 里是两个不同的类型。
      python: |
        两边标注的写法几乎一样（名字后面 `: 类型`、返回值用 `->`），
        差别在谁把它当真：Python 的标注运行时不检查、写错代码照跑，
        Swift 的标注是编译器的输入，写错就编译不过。
        可空上更明显：Python 的 `Optional[int]` 只是给类型检查器看的提示，
        Swift 的 `Int?` 是编译器会强制执行的真类型 —— `nil` 赋给 `Int` 直接报错。
        另外 `let` / `var` 区分「之后能不能改」，Python 里没有对应写法。
      java: |
        位置相反：Java 写 `double area(double r)`（类型在前），
        Swift 写 `area(r: Double) -> Double`（名字在前、类型在后）。
        签名与字段类型两边都必须写，能省的范围也相似（局部变量靠推断）。
        差别在默认值：Java 的局部变量不初始化就没有值、用了直接编译报错，
        Swift 的 `var z: Int` 自动拿到 `0` —— 没写初值不是「未定义」，而是被填了默认值。
        可空性 Java 完全没有对应物，只能靠库里的 `Optional`。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  structural-nominal:
    code: |
      protocol Greeter {
        func greet() -> String
      }

      extension Greeter {          // @note 协议扩展：给遵守者一份默认实现
        func greet() -> String { "你好" }
      }

      struct Dog: Greeter {}       // @note 必须显式写 : Greeter，方法可省
      struct Cat: Greeter {
        func greet() -> String { "喵" }   // @note 也可以自己实现，覆盖默认的
      }

      func hello(_ g: Greeter) { print(g.greet()) }
      hello(Dog())                 // @note 用的就是扩展里的默认实现
    vs:
      javascript: |
        JavaScript 的鸭子类型在运行时，只要求对象上有那个方法；
        Swift 是**名义**的：类型必须显式写 `: Greeter`，光有同名方法不算数。
        代价是给一个改不了源码的类型补协议，只能在旁边写
        `extension 类型名: 协议名`，不能像 JavaScript 那样「形状对就能用」。
        好处是编译器知道每个类型遵守了哪些协议，跳转、补全、报错都有据可依。
      python: |
        Python 的鸭子类型在运行时，`Protocol` 提供可选的结构化标注；
        Swift 是**名义**类型，必须显式声明遵守关系，协议本身还能写进签名、
        当作一个真正的类型用。两者都能做「面向接口编程」，
        但 Swift 的接口是**具名**的 —— 想让类型满足协议，要么在定义处写 `: 协议`，
        要么用扩展补上，没有第三条路。这也是 protocol + extension 的出发点：
        方法可以后补，遵守关系仍然显式。
      java: |
        两边都是**名义**类型：Java 的类必须 `implements` 接口，有同名方法不算数；
        Swift 的 struct / class 必须写 `: 协议`，规则一致。
        差别在协议的形态：Java 8 起接口能有 `default` 方法，Swift 的协议扩展更宽 ——
        可以给协议补一批方法，甚至补上「所有遵守者共有」的实现，
        这是 Swift 里给类型加能力的主要手法。
        另外 Swift 的 struct 也能遵守协议，Java 里没有值类型这一说。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  type-narrowing:
    code: |
      enum Shape {
        case circle(radius: Double)
        case square(side: Double)
      }

      func area(_ s: Shape) -> Double {
        switch s {                 // @note 穷尽检查：漏一种就编译不过
        case .circle(let r): return 3.14 * r * r
        case .square(let side): return side * side
        }
      }

      let v: Any = "hi"
      if v is String { print("是字符串") }        // @note is 只判断，不改变 v 的类型
      if let s = v as? String { print(s.count) }  // @note as? 才真正绑成 String
    vs:
      javascript: |
        JavaScript 的 `typeof` / `instanceof` 判断完，类型只对读代码的人有意义；
        Swift 的 `switch` 配 enum 有**穷尽检查** —— 少写一种情况，编译器直接报错，
        这是 JavaScript 给不了的保证。另一处差别是 `is` 的语义：
        Swift 里 `is` 只回答「是不是」，不会把变量变成那个类型；
        想拿到那个类型的能力必须用 `as?` 重新绑定 —— 收窄是显式的、看得见的一步。
      python: |
        Python 用 `isinstance` 判断再分支，收窄靠类型检查器推断（运行时不改变行为）；
        Swift 的判断与绑定是**语言能力**：`as?` 把结果绑到新名字上，
        `switch` 配 enum 还会做穷尽检查。两边的「判断之后」也很像 ——
        Python 的 `match` / `case` 与 Swift 的 `switch` 都能按结构拆解，
        但 Python 不强制覆盖所有分支，Swift 在 enum 上强制：
        漏了一种情况，Python 会静默漏过去，Swift 编译不过。
      java: |
        Java 传统上是 `instanceof` 判断加显式强转（两步，中间那一转可能写错）；
        Java 16 起有 `instanceof` 模式匹配、21 起 switch 支持模式，
        形态上与 Swift 越来越像。核心差别是**强制性**：
        Java 的 switch 默认不穷尽（可以用 `default` 兜住），
        Swift 对 enum 的 switch 必须覆盖所有 case；
        Java 也有穷尽检查（switch 配 sealed 类型），但那是后加的能力，
        Swift 从设计之初就把 enum 当成「只有这几种情况」的建模工具。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  null-safety:
    code: |
      var a: String = "hi"
      // a = nil                  // @note! 编译错误：非可选类型不能是 nil

      var b: String? = nil       // @note 可空是类型的一部分，写 ? 才允许 nil
      print(b?.count)            // @note 可选链：为 nil 时得到 nil，不崩
      // print(b!.count)         // @note! 强制解包：为 nil 直接崩
      print(b ?? "默认")         // @note ?? 在 nil 时取右边

      if let s = b { print(s.count) }   // @note if let：解包成功才进分支

      func greet(_ name: String?) -> String {
        guard let name = name else { return "你好" }   // @note guard let：不满足就提前退出
        return "你好，\(name)"
      }
    vs:
      javascript: |
        JavaScript 里 `null` / `undefined` 能赋给任何变量，读属性就抛
        「Cannot read properties of null」；Swift 把「可能为空」变成类型的一部分 ——
        `String?` 与 `String` 是两个不同的类型，想用里面的值必须先解包。
        可选链与默认值两边都有（JavaScript 的 `?.` / `??`，Swift 的 `?.` / `??`），
        但 Swift 的检查是**编译器强制**的：漏写一个 `?.` 在 Swift 里根本编译不过，
        在 JavaScript 里要到运行时才炸。
      python: |
        Python 的 `None` 同样能赋给任何变量，`x.y` 到运行时才抛 AttributeError；
        Swift 把它提到编译期拦下。两边的可选写法还差一层语义：
        Python 的 `x or "默认"` 对空字符串、0、空列表都会取右边，
        Swift 的 `??` 只认 `nil` —— `0 ?? 5` 得到 0，而 `0 or 5` 得到 5。
        另外 Python 的 `Optional[int]` 只是给类型检查器的提示，
        Swift 的 `Int?` 是编译器会强制执行的真类型。
      java: |
        Java 的 `null` 能赋给任何引用类型，解引用就是 NPE，编译器不管；
        Swift 在编译期就要求把「可能为空」写进类型（`String?`），用之前必须先解包。
        Java 的对策是库层面的 `Optional`，但它只覆盖返回值，
        字段、参数、局部变量都用不上，套上之后写法还变重；
        Swift 的可空性是类型系统里的一等公民，字段和参数一样能标，
        `if let` / `guard let` 让解包成为日常写法，而不是一层包装。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  type-assertion:
    code: |
      class Animal {}
      class Dog: Animal { func bark() { print("汪") } }

      let dog = Dog()
      let a: Animal = dog            // @note 向上转型：编译期保证成立

      // let d = a as Dog            // @note! 编译错误：向下转型必须写 as? / as!
      let d1 = a as? Dog             // @note 向下转型：失败得 nil
      let d2 = a as! Dog             // @note! 向下转型：失败直接崩

      // 数值转换走构造器，不是 as
      let i = Int(3.9)               // @note 3，向零截断
      let n = Int("42")              // @note 42；解析失败得 nil，不抛异常
    vs:
      javascript: |
        JavaScript 没有「断言」这个概念 —— 值就是值，转换大多是隐式的。
        Swift 的转型全部显式，而且分成三种后果不同的写法：
        `as` 是向上转型、编译期就保证成立；`as?` 失败得到 `nil`，可以安全处理；
        `as!` 失败直接崩。这比 JavaScript 的「先跑起来再说」响得多 ——
        写 `as!` 就是在告诉编译器「崩了我负责」。
      python: |
        Python 的转换是运行时动作，失败就抛异常（`int("abc")` 抛 ValueError）；
        Swift 里转型与转换分得很清：`as?` / `as!` 只改类型的看法、不转换值，
        失败是 `nil` 或崩溃；真要换值必须调构造器
        （`Int(3.9)` 截断成 3、`Int("42")` 解析成 42，解析失败得 `nil` 而不抛）。
        所以 Python 里一个 `int(...)` 同时承担「转换」与「可能失败」两件事，
        Swift 把它们拆成了不同的语法。
      java: |
        方向相反：Java 的强转 `(Dog) a` 会**在运行时检查**，类型不对抛
        ClassCastException；Swift 的 `as!` 同样在运行时检查、失败崩溃，
        但多了一条 Java 没有的安全通道 `as?` —— 失败得到 `nil`，不中断程序。
        数值转换 Java 靠隐式加宽加显式窄化（`(int) 3.9`），
        Swift 一律走构造器（`Int(3.9)`）；解析字符串 Java 抛异常、Swift 返回 `nil`。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
