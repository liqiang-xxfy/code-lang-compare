- featureId: basics/array-map-filter
  equivalence: divergent
  code: |
    List<Integer> nums = List.of(1, 2, 3, 4);

    nums.stream().map(x -> x * 2).toList();          // [2, 4, 6, 8]
    nums.stream().filter(x -> x % 2 == 0).toList();  // [2, 4]
    nums.stream().reduce(0, Integer::sum);           // 10

    // @note! 与 JS 的关键差别：Java 必须 stream() → 中间操作 → **终结操作**（toList）。
    //        JS 的 map / filter 直接返回数组，少写 toList() 是新手最常见的错
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/array-sort
  equivalence: analogous
  code: |
    List<Integer> list = new ArrayList<>(List.of(3, 1, 2));
    Collections.sort(list);                 // @note! 原地排序（与 JS 的 sort 一样）
    list.sort(Comparator.reverseOrder());

    int[] arr = {3, 1, 2};
    Arrays.sort(arr);                       // 原地

    // @note! Java 的默认排序是**正确的自然序**；
    //        JS 的 sort() 默认按字符串比，[10, 9, 1] 会排成 [1, 10, 9] —— 那个坑这里没有
