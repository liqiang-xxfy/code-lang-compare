# dart —— mechanism / meta
#
# boxes 的 key 必须是 catalog/mechanism/features.yaml 里 `group: meta` 的那批：
# reflection / decorator-annotation / dynamic-eval / proxy-interception。
#
# 口径说明：这一组的主线是 **`dart:mirrors` 在 Flutter / AOT / Web 上一律不可用**
# （官方库表把它标成 Experimental 且 Native JIT only）——
# 这条直接解释了为什么 Dart 靠 build_runner 做编译期代码生成、
# 而不是靠运行期反射，也解释了为什么注解在这门语言里主要是给分析器和
# 代码生成器看的。**proxy-interception 要与 `Proxy` 划清界限**：
# `noSuchMethod` 只在成员**不存在**时触发，而且必须是动态调用，
# 它拦不住已经存在的成员 —— 这一点与 `Proxy` 相反。

review:
  state: draft

boxes:
  reflection:
    code: |
      import 'dart:mirrors';                 // @note! 只在 Dart VM（JIT）上有

      final m = reflectClass(User);
      m.declarations.forEach((k, v) => print(k));
      m.newInstance(Symbol(''), ['Ada', 30]);

      // @note! 平台限制，而且是硬限制：
      // @note!   Experimental + 只在 Native 的 JIT 上
      // @note!   Flutter / AOT 编译 / web 上**都没有**
      // @note! `dart compile exe` 官方明说不支持 dart:mirrors

      // @note 所以 Dart 的惯例是**不用运行期反射**，改用代码生成：
      // @note   装 build_runner，跑 `dart run build_runner build`
      // @note   产物是**源码文件**，之后照常编译 —— 与反射是两条路
    vs:
      javascript: |
        两边的可用性**差别很大**：JavaScript 的反射是运行时自带的、
        到处都是；Dart 的 `dart:mirrors` 只在虚拟机的即时编译模式下有，
        打包成原生程序或编译到 web 之后**完全不可用**。
        所以那边 `Reflect.ownKeys(obj)` 随手就写，
        这边要提前想清楚「这个功能上了线还能不能跑」。
        代价换来的是更小的产物体积与更快的启动。
      python: |
        Python 的反射是**日常工具**（`getattr` / `inspect` 到处在用），
        而且随处可用；Dart 的反射是一个**受限且不稳定的实验特性** ——
        官方直接说这个库不稳定、API 可能变，而且移动端与 web 上根本没有。
        所以两边的生态走向不同：那边大量库靠反射工作，
        这边大量库靠**编译期代码生成**（先跑一个生成器产出源码，再正常编译）。
      java: |
        两边都有反射，也都跑得出结果，但**能不能用是有条件的**：
        Java 的反射在标准库里、任何平台都有（只是原生镜像会受限）；
        Dart 的 `dart:mirrors` 在移动端、AOT 编译与 web 上一律没有。
        所以从 Java 过来最需要改的是**习惯**：
        那边「反射一下就好了」的场景，这边通常要改成代码生成，
        而且这一步是**构建流程的一环**，不是运行期的事。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  decorator-annotation:
    code: |
      class Todo {
        final String who;
        final String what;
        const Todo(this.who, this.what);     // @note! 自定义注解**必须有 const 构造**
      }

      @Todo('Ada', '补测试')
      void doSomething() { }

      // @note 内建的：@Deprecated（可带说明）、@override、@pragma(...)
      // @note package:meta 里的：@Target({...})、@visibleForTesting、@protected
      // @note! Dart 没有装饰器 —— 注解只是**挂在声明上的数据**，自己不做事

      // @note! 而且注解**默认不产生运行期反射**（见上一格：反射本身就不可用），
      // @note! 它们主要给两拨人看：分析器（给警告）与 build_runner（生成代码）
      // @note @override 是可选的，写了主要为了让分析器帮你查名字写错没有
    vs:
      javascript: |
        两边的名字容易混：JavaScript 的装饰器是**可执行的函数**，
        能在定义时改写类与方法（而且提案还在演进，写法变过）；
        Dart 的注解只是数据，谁都不会自动去读它。
        所以那边 `@foo` 可能真的改变了行为，这边 `@foo` 只是留了个记号 ——
        差别不在写法，在「挂了注解之后有没有事情发生」。
      python: |
        **这两个概念同名不同物，是最容易混的一对**：
        Python 的 `@decorator` 就是一个函数调用（`f = decorator(f)`），
        真的把对象换掉；Dart 的注解只是元数据，
        要有人读它才有效果。
        想在 Dart 里做「调用前后加行为」，得靠代码生成
        （构建期把包装代码写出来）或者手工包装，不能指望注解自己生效。
        两边共同点是都能给声明挂信息，区别在这层信息会不会被执行。
      java: |
        语法几乎一样（`@interface` ↔ 带 const 构造的类，`@Target` 同名），
        这一格最接近。差别在**默认能不能读到**：Java 的注解要运行期可读
        必须显式标 `@Retention(RUNTIME)`，然后靠反射读；
        Dart 这边**根本不该指望运行期读注解**（反射在移动端与 web 上不可用），
        注解的正确用法是喂给**构建期的代码生成器**。
        所以同一套语法，一边的落点是运行期反射，一边的落点是构建期生成。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  dynamic-eval:
    absent: true
    vs:
      javascript: |
        Dart **没有 `eval`**，也没有 `new Function` 这类把字符串变成代码的入口。
        官方库里没有任何求值工具，官方博客在讲 REPL 时也直说 Dart 没有 eval。
        要动态执行只能**接一个解释器**（自己带一个脚本引擎，或者走 isolate
        加上编译好的代码），代价与 `eval` 完全不是一个量级。
        所以那边一句 `eval(s)` 的事，在这边通常要改设计。
      python: |
        Dart **没有 `eval` / `exec`**，字符串不能当代码跑。
        与 Python 相比，这一条是直接的能力缺失 ——
        那边 `eval`、`exec`、`getattr` 三件套能做到的元编程，
        在这边要么改成构建期代码生成，要么干脆换个方案。
        代价换来的是：可以放心地认为「能跑的代码都是被编译过的」。
      java: |
        Java 与 Dart 都**没有内建的 eval**，这一点一致 ——
        两边都只能靠外部脚本引擎（Java 是 JSR-223，Dart 得自己接）。
        所以从 Java 过来不需要改认知：那边写不了的东西这边同样写不了，
        连替代方案的思路（引一个解释器）都一样。
        差别在于 Java 的脚本引擎生态更成熟一些。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  proxy-interception:
    code: |
      class Anything {
        @override
        dynamic noSuchMethod(Invocation invocation) {     // @note 成员不存在时才来这
          print('有人调了 ${invocation.memberName}');
          return '兜底';
        }
      }

      final a = Anything();
      (a as dynamic).whatever(1, 2);        // @note! 只有**动态调用**才走这条路

      // @note 实现了 noSuchMethod 的类，可以**不实现接口里的成员** ——
      // @note 调用会被转发到这里（做替身/伪造对象时常这么干）

      // @note! 但它拦不住**已经存在**的成员 —— 那不是「不存在」，不会触发
      // @note! 静态类型下调用不存在的方法仍然是编译错误，走不到运行期
    vs:
      javascript: |
        **两者看起来像，实际能拦的范围差很远**：
        JavaScript 的 `Proxy` 能拦住**所有**属性访问 ——
        包括已经存在的属性、`in` 判断、删除操作；
        Dart 的 `noSuchMethod` **只在成员不存在时**才被调用，
        已经有的方法它一概拦不到。
        所以那边「给任意对象套一层透明代理」在这边做不到，
        只能对缺失的成员做兜底。
      python: |
        Python 的 `__getattr__` 与 Dart 的 `noSuchMethod` 触发条件**很像**
        （都只在常规查找失败时调用），这一层可以对应；
        但 Python 还有 `__getattribute__`，它能拦下**每一次**属性访问 ——
        那个才与 `Proxy` 同级。
        Dart 没有后者，所以「无条件拦截」在这边写不出来。
        另一处是 Dart 的触发必须是动态调用，静态类型下仍是编译错误。
      java: |
        两边能做的是**同一件事**（拦下接口方法的调用），
        因为 Dart 在这一点上用的就是 JVM/原生那套动态派发，
        而不是一个通用的代理层。
        差别在写法与边界：Java 用 `Proxy.newProxyInstance` 生成一个新对象；
        Dart 是在类里重写 `noSuchMethod`，让**这个类自己**接住缺失的成员。
        两边共同的限制是字段访问拦不到 —— 那是 `Proxy` 才有的能力。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous
