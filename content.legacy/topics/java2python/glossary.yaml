# 速语词典 —— 从 Java 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 会拦第三门）

- term: 重载
  aliases: [overload]
  perLanguage:
    java: 编译期按参数列表选同名方法，是最常用的"默认参数"替代方案
    python: 不存在 —— 后定义的同名函数直接覆盖前一个，没有警告
  note: 从 Java 到 Python 时，靠重载堆出来的 API 必须重新设计签名，不能逐个搬。

- term: 接口
  aliases: [interface, protocol, abc]
  perLanguage:
    java: 名义式 —— 必须显式 implements，编译期检查是否满足契约
    python: 靠 Protocol（结构化，无需声明）或 ABC（名义式，需要继承）；前者不检查，只给工具看
  note: Java 的接口是强制的契约，Python 的 Protocol 更像"事后描出来的形状"。

- term: 泛型
  aliases: [generic, type parameter]
  perLanguage:
    java: 编译期检查，运行期擦除；`List<String>` 与 `List<Integer>` 运行时是同一个类
    python: 类型参数只存在于注解里，运行时不检查也不擦除（因为本来就不存在）
  note: 两边运行期都拿不到类型参数，但 Java 至少编译期会拦你。

- term: 包 / 模块
  aliases: [package, module, import]
  perLanguage:
    java: package 是命名空间，目录结构必须与包名一致；import 只影响书写
    python: module 是一个 .py 文件，package 是含 `__init__.py` 的目录；import 真的会执行模块代码
  note: 「导入会执行代码」是 Python 独有的一点，Java 的 import 纯粹是名字解析。

- term: final
  aliases: [final, const, immutable]
  perLanguage:
    java: 冻结绑定；对象内容可变，不可变要靠类型设计（List.of / record）
    python: 没有对应关键字，全大写命名只是约定；不可变靠选用不可变类型（tuple / frozenset）
  note: 两边都容易被误读成"内容不可变"，实际都只管绑定。

- term: 真值
  aliases: [truthiness, boolean conversion, falsy]
  perLanguage:
    java: 不存在这个概念 —— 条件位置只接受 boolean，空集合要显式写 isEmpty()
    python: '`None`、`0`、`""`、`[]`、`{}` 全是假值；自定义类可以用 `__bool__` / `__len__` 决定'
  note: 从 Java 到 Python，"判空"与"判真"合并成了一个写法，读代码的人必须先知道类型才能确定含义。

- term: 切片
  aliases: [slice, subList, subarray]
  perLanguage:
    java: 只有 subList —— 返回的是**视图**，改它会写回原列表；数组另有 copyOfRange（是真拷贝）
    python: '`xs[a:b]` 是语法，返回**新列表**（浅拷贝）；支持负索引、步长、切片赋值'
  note: 「取一段」这件事，一边给视图一边给拷贝，是迁移时最容易静默出错的地方之一。

- term: 迭代器
  aliases: [iterator, iterable, generator, stream]
  perLanguage:
    java: Iterable 可反复遍历，Stream 是一次性的 —— 两者是不同的类型，编译器分得清
    python: 列表可反复遍历，map / filter / 生成器返回迭代器只能遍历一次 —— 类型上不区分，靠人记
  note: Java 用类型把"可重复"与"一次性"分开了，Python 把两者都叫迭代器。

- term: 类型转换
  aliases: [cast, boxing, unboxing, widening]
  perLanguage:
    java: 基本类型之间有自动宽化与显式窄化；对象强转靠 (T)，错了运行时抛 ClassCastException
    python: 转换就是调用类型本身（int(x) / str(x)），没有隐式窄化；失败一律抛异常
  note: Java 那套"自动宽化、窄化才要写括号"的规则在 Python 里完全不存在，每个转换都要显式写出来。

- term: 注解
  aliases: [annotation, decorator, aspect]
  perLanguage:
    java: 元数据，自己不做事；要有注解处理器或 AOP 框架读到它才会产生行为
    python: 装饰器是可执行代码 —— `@dec` 就是 `f = dec(f)`，运行时真的包了一层
  note: 名字相近、机制相反。把装饰器当注解迁过去，最常见的后果是"写了却没生效"。
