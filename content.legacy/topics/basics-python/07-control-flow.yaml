id: basics-python/07-control-flow
topicId: basics-python
title: 控制流
order: 7
summary: 条件表达式语序相反、for 只会遍历、for-else 与 range 的惰性——从 Python 出发看这一层

features:
  - id: basics-python/if-else
    title: 条件分支
    kind: syntax
    summary: 缩进定块，elif 一个词，条件位置接受任意对象

  - id: basics-python/ternary
    title: 条件表达式
    kind: syntax
    summary: 结果写在前面，语序与多数语言相反

  - id: basics-python/switch-match
    title: 模式匹配
    kind: behavior
    summary: match 是结构化模式匹配，不是 switch 的替代品

  - id: basics-python/for-loop
    title: for 循环
    kind: behavior
    summary: 只有遍历形式，没有计数三段式

  - id: basics-python/while-loop
    title: while 循环
    kind: syntax
    summary: 没有 do-while，用 while True 加 break 代替

  - id: basics-python/loop-control
    title: 循环控制
    kind: behavior
    summary: break / continue 之外还有 for-else

  - id: basics-python/loop-index
    title: 带索引遍历
    kind: syntax
    summary: enumerate 是惰性的，还能指定起始下标

  - id: basics-python/range-iteration
    title: 区间与 range
    kind: behavior
    summary: 左闭右开、惰性，而且它不是列表

  - id: basics-python/exception-flow
    title: 异常处理
    kind: behavior
