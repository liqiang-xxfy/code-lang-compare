  - featureId: basics-java/arg-passing
    equivalence: identical
    code: |
      static void mutate(java.util.List<Integer> xs) { xs.add(4); }        // @note 看得见
      static void rebind(java.util.List<Integer> xs) { xs = java.util.List.of(9); }  // 看不见
      static void bump(int n) { n += 1; }                                  // @note! 永远看不见

      var xs = new java.util.ArrayList<>(java.util.List.of(1, 2, 3));
      mutate(xs);                    // @note xs 变成 [1, 2, 3, 4]
      rebind(xs);                    // @note xs 不变

      int k = 1;
      bump(k);                       // @note! k 还是 1 —— 基本类型是真的复制了一份

      // @note 口诀一致：改内容会传染，改绑定不会。
      // @note! 但基本类型的"改不动"来自**值复制**，不是来自"不可变" —— 原因不同，结论相同
      // @note 数组是可变的：mutate(int[]) 能改到调用方
