snippets:
  - featureId: concepts-java/class-inheritance
    equivalence: divergent
    code: |
      class Sub extends Base {          // @note! 只有单继承，没有接口这一层
      }
      // @note this 取决于调用方式，方法单独取出或当回调会丢 this
    body: |
      **class + 原型链** —— 单继承且没有接口；
      Java 里用接口补的那一块，在 JS 里要靠组合或 TS。

  - featureId: concepts-java/interface
    equivalence: divergent
    code: |
      // @note! 语言层面没有 interface，没有任何机制强制协议
      function render(x) { return x.toText(); }   // 运行到这一行才知道它有没有
    body: |
      **无语言级概念** —— 用接口描述协议、让编译器检查实现这一整套方式消失了；
      运行时拦住不完整对象的能力也没有等价物。

  - featureId: concepts-java/generics
    equivalence: divergent
    code: |
      function first(list) { return list[0]; }    // @note! 连类型标注都没有
      // @note 要泛型得用 TS，且同样运行时擦除（Java 也是擦除，这点相通）
    body: |
      **无（靠 TS）** —— Java 泛型运行期擦除这条心智可直接搬到 TS；
      JS 则是连编译期那一层都没有的版本。

  - featureId: concepts-java/error-handling
    equivalence: divergent
    code: |
      throw "出错了";                    // @note! 可抛任意值，Java 只能抛 Throwable 子类
      try { read(); } catch (e) {
        e.message                        // @note undefined —— 且没有受检异常
      }
    body: |
      **try/catch（无受检异常）** —— 任何函数都可能抛，签名上看不出来；
      「编译器强制你处理」这层保障整个消失。
