    equivalence: divergent
    code: |
      go doWork()                  // @note! 加一个 go 关键字就并发执行 —— 极便宜

      // @note! goroutine 初始栈只有几 KB，可以开几十万个；而且并行是真的（跑在多核上）
      // @note 官方格言：不要通过共享内存来通信，而要通过通信来共享内存
      ch := make(chan int)
      go func() { ch <- compute() }()
      result := <-ch               // @note 数据传过来之后，发送方就不再持有它

      // @note Go 的并发安全靠约定 + race detector，不是编译器强制（与 Rust 不同）
  - featureId: js2go/async-model
    equivalence: divergent
    code: |
      // @note! 没有 async/await，也没有 Promise
      ch := make(chan string)
      for _, u := range urls {
          go func(u string) { ch <- fetch(u) }(u)
      }
      for range urls {
          results = append(results, <-ch)      // 收够 N 个
      }

      var wg sync.WaitGroup                    // @note 对应 Promise.all
      wg.Add(1)
      go func() { defer wg.Done(); fetch() }()
      wg.Wait()

      select {                                 // @note 对应 Promise.race
      case r := <-ch1:
      case r := <-ch2:
      case <-time.After(time.Second):          // @note 超时分支，JS 里要另外包一层
      }

      // @note! goroutine 里 panic 会让**整个程序**崩，不像 Promise 那样变成 rejection
      // @note context.Context 是每个可能阻塞的函数都要带的第一个参数（对应 AbortController）
