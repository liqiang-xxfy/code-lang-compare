# typescript —— mechanism / concurrency
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: concurrency` 的那批：
# concurrency-unit / shared-state / lock-mutex / channel / atomicity。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）—— 包括**缩写**，
# 「JS」这类简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：TypeScript 在并发这一组里最要紧的一句话是**语言层是空的** ——
# 它只加类型，不加运行时构造；能并行的东西全部来自 ECMAScript 内建或宿主。
# 每格都从这一点出发，才不会把它写成「一门有并发原语的语言」。

review:
  state: draft

boxes:
  concurrency-unit:
    code: |
      // 语言层没有并发单元 —— TypeScript 只给已有的东西加类型
      const w = new Worker("./worker.js");        // @note 线程由宿主提供（浏览器 / Node）
      w.postMessage({ n: 42 });                   // @note 跨线程传的是副本，不是共享
      w.onmessage = (e: MessageEvent) => { console.info(e.data); };

      // 语言层唯一的「并发」：事件循环上的异步任务
      async function tick(): Promise<void> {
        await Promise.resolve();   // @note 只是让出到微任务队列，没有第二条线程
      }
    vs:
      javascript: |
        两边是同一件事：语言层没有并发单元，能并行的是宿主给的那种线程。
        TypeScript 加的只有类型 —— Worker 的类型来自 lib 配置（浏览器那份或运行时那份），
        传什么、收到什么，编译期就对得上。并发行为本身一处没变。
      python: |
        Python 把并发写进了语言与标准库：进程、线程、协程三套各有各的模块，
        `async def` 是语法。这里这三套都不存在 —— 线程由宿主提供，
        「协程」就是事件循环上的 Promise 任务，连语法都只是 `async` 一个修饰。
        根源在于分工：Python 的语言与标准库负责这件事，这里交给了运行环境。
      java: |
        Java 把线程写进了语言：`Thread`、`synchronized`、`java.util.concurrent`
        是一整套语言与标准库的设施。这里这一层是空的 —— 语言只加类型，
        并发原语要用宿主给的。所以 Java 里「开个线程」是一行构造，
        这里得先确认运行环境提供了什么。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  shared-state:
    code: |
      // 默认没有共享：每个执行流各拿各的副本
      // 唯一能真共享的是这块内存（ES2017 内建）
      const buf = new SharedArrayBuffer(16);
      const arr = new Int32Array(buf);

      arr[0] = 1;
      // @note! 两个线程同时读写同一个下标，先后顺序没有任何保证
      Atomics.add(arr, 0, 1);        // @note 要原子操作，才不会丢掉某一次加
    vs:
      javascript: |
        同一套东西：共享内存与原子操作都是语言内建，两边逐条一致。
        TypeScript 能加的是类型 —— 视图类型与缓冲区对得上，原子操作有完整签名。
        语言本身仍然不帮你防竞争：数据竞争在这里是运行期的问题，编译器不管。
      python: |
        Python 的多个线程共享整个解释器状态，靠全局锁让同一时刻只有一个线程
        执行字节码 —— 这挡掉了大部分竞争，代价是 CPU 密集的任务并行不起来。
        这里没有那层锁：内存一旦共享出去，两个线程就是真的同时读写，
        要用原子操作自己守住。真并行与「免于竞争」在这里不可兼得。
      java: |
        Java 有内存模型：共享变量在多线程下的可见性与重排规则都写进了语言规范，
        `volatile` / `synchronized` 是语言级的同步手段。这里没有等价的模型声明 ——
        能共享的内存只有那一块缓冲区，同步手段只有那一组原子操作。
        Java 里靠语言保证的事，在这里要靠自己用原子操作搭出来。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  lock-mutex:
    code: |
      // 语言里没有锁 —— 下面这两个都不是关键字，只是普通标识符
      // let m: Mutex = null;                    // @note! 没有这个类型
      // synchronized (obj) { }                  // @note! 没有这个语法

      // 要保护临界区只有两条路：
      // ① 用原子操作自己搭（比较并交换是常用的起点）
      Atomics.compareExchange(arr, 0, 0, 1);
      // ② 干脆不共享 —— 把数据留在一条线程里，靠消息传递代替
    vs:
      javascript: |
        和 JavaScript 一样：语言里没有锁，也没有可以写成关键字的那种构造。
        TypeScript 不会凭空造一个出来，它最多把第三方库的锁标上类型。
        所以「临界区怎么保护」在这里是设计问题，不是语法问题。
      python: |
        Python 的标准库给了锁（`threading.Lock` / `RLock` / `Semaphore`），
        哪怕全局锁已经挡掉了大部分竞争。这里标准库里没有锁 ——
        要用就自己用原子操作搭（比较并交换是常见的起点），或者借宿主的原语。
        差别在于「有现成的」与「得自己搭」。
      java: |
        Java 把锁写进了语言：`synchronized` 是关键字，`java.util.concurrent`
        里有一整套锁，内存模型还规定了锁的语义。这里一个都没有 ——
        语言层只有「不共享」这一条干净的路，要共享内存就得自己用原子操作搭同步。
        差别不只是有没有现成的库，而是**谁负责正确性**。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent

  channel:
    code: |
      // 语言层没有通道 —— 「消息传递」就是宿主的那个方法
      const w = new Worker("./worker.js");
      w.postMessage({ kind: "add", a: 1, b: 2 });      // @note 序列化过去，不是共享
      w.onmessage = (e: MessageEvent) => {
        console.info(e.data);                          // @note 收到的是副本
      };

      // 想「等一个回复」，得在消息之上再包一层 Promise
    vs:
      javascript: |
        消息传递两边是同一套：跨线程送一个对象、另一端收到副本。
        TypeScript 能加的是消息的形状 —— 用一个带判别字段的联合类型
        描述「有哪几种消息」，收发两端就对得上了。通道本身仍然是宿主的。
      python: |
        Python 的队列是标准库给的：进程之间有队列与管道，协程之间有异步队列，
        「放进去、取出来」连同步一起解决了。这里的消息传递只有宿主那一层 ——
        语言与标准库都不提供队列，「等一个回复」要自己在消息之上包一层。
      java: |
        Java 的阻塞队列是生态里的一等公民：放与取就带着等待，
        队列满或空的时候调用方自然被挡住。这里的消息只负责送 ——
        不等结果、也不排队。所以「送完等回音」与「排不下怎么办」
        这两件事，在这里都要自己再搭一层。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  atomicity:
    code: |
      // 语言层没有「原子性」这个概念 —— 连 i++ 都是读、改、写三步
      Atomics.add(arr, 0, 1);                  // @note 原子加，返回加之前的值
      Atomics.load(arr, 0);                    // @note 原子读
      Atomics.store(arr, 0, 5);                // @note 原子写

      // @note! Atomics.wait 会让人等，主线程上调用会直接抛错 ——
      // 它不能把事件循环停住
    vs:
      javascript: |
        同一套内建，语义逐条一致。TypeScript 加的是类型那一层：
        每个原子操作都有签名，等待类操作的返回值是个字面量联合
        （成功 / 不相等 / 超时），编译期就能看出可能要处理哪几种结果，
        漏掉一支会被指出来。
      python: |
        Python 没有把原子操作暴露到语言层 —— 有全局锁时用不上，
        真要并行时共享内存那套也不是语言级的。这里有一组明确的原子操作，
        但也仅此而已：没有内存序可以声明，官方也没有给出
        「哪些重排是允许的」这类规则。
      java: |
        Java 把这件事讲得最细：内存模型规定可见性与重排，
        `volatile` 建立先后关系，更新的 API 还能指定获取/释放语义。
        这里只有一组语义固定的原子操作，没有可供声明的内存序。
        所以「一条语句会不会被拆开、写什么时候对别的线程可见」，
        在这里没有语言层面的答案。
    equivalence:
      javascript: identical
      python: divergent
      java: divergent
