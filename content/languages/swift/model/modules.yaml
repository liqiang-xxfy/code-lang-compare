# swift —— model / modules
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/model/features.yaml 里 `group: modules` 的那批：
# module-unit / export-import / default-vs-named / namespace-alias /
# module-resolution。
#
# Swift 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Swift 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组的题眼是**「模块是编译单位，不是文件」** ——
# 一个 Swift 模块（target / framework）里的所有文件互相可见，
# 而模块边界同时也是**访问控制的边界**（`internal` 就是「模块内可见」）。
# 所以 Swift 里**没有导出清单**这回事：一个声明对外可不可见
# 由它的访问级别决定，与它写在哪个文件无关。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-modules-v1
    generatedAt: '2026-10-04'

boxes:
  module-unit:
    code: |
      // @note! Swift 的「模块」是**编译单位**（一个 target / framework），
      // @note! 不是一个文件 —— 一个模块里的所有源文件互相可见

      // 所以同一个模块里不需要 import 任何东西就能用别处的类型
      // （只要访问级别允许）

      // @note 模块边界的作用有两层：
      // @note   ① 访问控制：`internal` 的含义就是「这个模块内可见」
      // @note   ② 命名：import 进来的是「一整块名字空间」

      // 一个模块通常由包清单声明（SwiftPM）：
      //   targets: [ .target(name: "MyLib", dependencies: ["Other"]) ]
      // @note 在 SwiftPM 里「一个 target」就是「一个模块」

      // @note! 与别的语言不同：**没有 export 清单** ——
      // @note 声明对外可不可见由 `public` / `open` 决定，
      // @note 不需要（也不能）在一个地方集中列出「本模块导出什么」
    vs:
      javascript: |
        **两边「模块」的粒度完全不同**：JavaScript 的一个**文件**就是一个模块，
        文件边界就是可见性边界（不 export 就出不去）；
        Swift 的一个**编译单位（target）**才是模块，
        模块内所有文件互相可见，而文件本身不构成边界。
        所以那边「这个文件导出了什么」是可以逐文件回答的，
        这边要回答「这个模块对外开放什么」得看所有文件的访问级别。
        另一处是 Swift 有 `internal` 这个「模块内可见」的级别，
        而它正好对应 JavaScript 的「默认不导出」—— 两边都在做同一件事，
        只是一个按模块、一个按文件。
      python: |
        两边的模块单位不同：Python 的一个 `.py` 文件（或一个包）是模块，
        模块之间必须显式 `import`；Swift 的模块是**编译单位**，
        模块内跨文件不需要任何声明就能互相看见。
        所以 Python 里「这个文件用到的东西从哪来」靠 import 语句能推出来，
        Swift 里同一模块内的引用是「隐式可见」的 ——
        这也意味着重名在模块级要自己避免（没有命名空间这一层）。
        另一处是 Swift 有 `internal` 这个明确的模块内级别，
        Python 靠前导下划线的约定。
      java: |
        两边**结构上最像**：Java 的包对应目录、模块（JPMS）对应一组包；
        Swift 的模块是编译单位，模块内文件互相可见。
        差别在**边界与访问控制怎么挂钩**：Java 的可见性阶梯是
        私有/包私有/受保护/公开（包私有那一级最常用）；
        Swift 没有「包」这一层可见性，`internal` 直接就是
        「整个模块内可见」—— 也就是说 Swift 的分组比 Java 粗一档，
        想细分只能靠 fileprivate 或自己约定。
        共同点是两边都把「模块」当作可独立发布、可被依赖的单位。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  export-import:
    code: |
      // ① 在本模块内：什么都不用写，直接引用（只要访问级别允许）
      let local = Helper()

      // ② 用别的模块：`import` 它的名字
      import Foundation
      import MyLib

      // ③ 测试模块可以拿到 internal 的东西
      @testable import MyLib

      // @note! 「导出」不是语言动作 —— 一个声明对外可不可见
      // @note! 由**访问级别**决定：
      public struct Exported { }        // @note 这一句就是「导出」
      internal struct Hidden { }        // @note 模块内可见（默认值）
      private struct Local { }          // @note 连本文件的其他类型都看不到

      // @note 想让别的模块能**继承/重写**本模块的类，得用 open 而不是 public
      open class Base { open func f() { } }
      public class Sealed { public func g() { } }   // @note! 外部不能继承

      // @note! import 是**整块导入**：导进来的是「那个模块公开的所有名字」，
      // @note! 不能只导入其中一个名字（没有 `import { x }` 这种写法）
      // @note 也没有重命名导入 —— 撞名了得靠类型限定（`MyLib.Foo`）
    vs:
      javascript: |
        **两边把「导出」放在完全不同的位置**：JavaScript 用 `export`
        关键字逐条声明「这一项给外面看」，导入端还能挑（`import { x }`）
        并改名（`as`）；Swift 没有导出清单 ——
        「对外可见」是**声明处访问级别**的副产物（写 `public` 就是导出），
        而导入端只能**整块导入**，不能挑、不能改名。
        所以那边「只导入我要的那几个名字」在这边做不到，
        撞名了只能靠模块名限定（`MyLib.Foo`）。
        另一处是测试用的 `@testable import` 能拿到 internal，
        相当于给测试开后门，JavaScript 里没有对应机制。
      python: |
        两边的导入粒度差别很大：Python 的 `from x import y` 能挑名字、
        能改名（`as`）、能 `import *`（不推荐）；Swift 的 `import`
        一律是「把那个模块的**公开名字**全部引进来」，
        既不能挑也不能改名。
        另一处是「导出」的落点：Python 靠前导下划线的**约定**
        （`_x` 表示内部用，但拦不住）；Swift 靠访问级别，
        **编译器强制** —— 写 `internal` 就是真的出不了模块。
        所以一边是「大家说好别碰」，一边是「标准说这不是你的」。
      java: |
        两边**很接近**：都用 `import` 引入别的模块/包里的类型，
        都由声明处的可见性决定对外能不能用，都有测试可见性的后门
        （Java 靠同包或反射，Swift 靠 `@testable`）。
        差别在**导入的粒度**：Java 能 `import static`、能导入单个类型，
        而且同包内不需要 import；Swift 的 `import` 是整块导入，
        同模块内也不需要 import —— 这一层很像，
        但 Java 有「包」这一中间层，Swift 没有。
        另一处是 Swift 的 `public` 与 `open` 分开
        （`open` 才允许跨模块继承），Java 没有这个区分。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  default-vs-named:
    code: |
      // @note! Swift **没有「默认导出」这个概念** —— 名字就是名字
      // @note 也没有「具名导出」与「默认导出」两种形态可选
      // @note 一个类型叫 `User` 就是 `User`，导入之后仍然叫 `User`

      // @note 因此也没有「导入时改名」这个动作
      // （那边 `import { a as b }` 的写法在这里不存在）

      // @note! 想避免重名，Swift 的做法是**模块名限定**：
      let a = MyLib.User()
      let b = OtherLib.User()

      // 或者自己包一层类型当命名空间（惯用法）
      enum API {
        struct User { }
        static func fetch() { }
      }
      API.User()

      // @note 类型嵌套也能起同样的作用
      struct Outer { struct Inner { } }
    vs:
      javascript: |
        **这一格是直接的有无之分**：JavaScript 有默认导出与具名导出
        两种形态，而且导入时可以改名（`as`），
        所以同一个东西在不同文件里可能叫不同名字；
        Swift 里名字就是名字，没有默认那一档、也没有导入改名 ——
        避免重名靠**模块限定**或者自己用类型当命名空间。
        所以那边「改导出名不影响内部」这件事在这边不成立：
        Swift 改一个名字，所有写到它的地方都要改。
        另一处是嵌套类型（`Outer.Inner`）在 Swift 里是很常见的分组手法，
        JavaScript 的类也能嵌套但很少这么用（模块已经解决了分组问题）。
      python: |
        两边的分组与改名能力差得很远：Python 能 `import x as y`、
        `from x import y as z`，所以同一个东西在不同模块里
        可以有不同叫法；Swift **不能改名**，只能靠模块名限定。
        另一处是「默认导出」这个概念：Python 没有（但 `__all__`
        控制 `import *` 的行为），Swift 也没有 ——
        这一点两边一致。共同点是两边都用「类型当命名空间」
        作为分组手段（Python 的类属性、Swift 的嵌套类型或空枚举）。
      java: |
        两边都不能给导入的东西改名（Java 的类型名是身份的一部分），
        也都靠包名/模块名限定来避免冲突 —— 这一层很像。
        差别在**分组的层次**：Java 的包可以嵌套很深
        （`com.example.foo.bar`），命名靠目录结构；
        Swift 的模块是平的，再分组只能靠**类型嵌套**
        （`Outer.Inner`）或空枚举当命名空间 ——
        也就是说 Swift 的分组手段在类型系统里，而不在包结构里。
        另一处是 Java 的 `import` 能带通配符，Swift 不能。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  namespace-alias:
    code: |
      // @note! Swift **没有命名空间，也没有别名** —— 这一格基本是空的

      // 能做的只有两件事：
      // ① 用模块名限定（本身就很短，通常不需要别名）
      MyLib.User()

      // ② 用类型当命名空间（惯用法）
      enum Colors {
        static let primary = "#007AFF"
        static let secondary = "#5856D6"
      }
      Colors.primary

      // @note 类型别名能缩短**类型名**，但它不是命名空间别名
      typealias Handler = (Result<Data, Error>) -> Void

      // @note 想给一个长类型起短名用 typealias；
      // @note 想给模块起短名 —— 做不到，模块名就是模块名
    vs:
      javascript: |
        两边的差别是「有没有别名这一层」：JavaScript 的
        `import fs from 'fs'` 是**给模块起名**（而且默认导出能随便叫），
        所以模块名可以随写法变；Swift 的模块名是固定的，
        **不能起别名** —— 想缩短只能靠类型别名（`typealias`，
        那缩短的是类型不是模块）。
        另一处是两边都用「类型当命名空间」这个惯用法
        （JavaScript 用对象字面量或类静态成员，Swift 用空枚举），
        目的都是把散落的常量收进一个名字下。
      python: |
        两边的别名能力差得很远：Python 的 `import numpy as np` 是
        日常写法，模块可以随便改名；Swift **没有模块别名** ——
        模块名进来就是那个名字。所以 Python 里「名字太长就起个短名」
        这条习惯在这边行不通。
        另一处是类型别名：两边的目的相同（给长类型起短名），
        Python 靠赋值（`Handler = Callable[...]`，其实只是绑定），
        Swift 有正式的 `typealias` 关键字 —— 这一层可以对应。
      java: |
        两边都**没有模块/包的别名**（Java 的包名也是固定的），
        这一格处境相同 —— 想缩短只能靠导入单个类型
        （`import com.example.Foo;` 之后写 `Foo`）。
        Swift 甚至不能只导入一个类型，只能整块导入加模块限定，
        所以在「缩短名字」这件事上比 Java 更受限。
        另一处是两边的类型别名都很正式（Java 没有类型别名，
        Swift 有 `typealias`；Java 只能靠继承或包装来起短名）。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  module-resolution:
    code: |
      // @note! Swift **没有「按路径导入」这回事** —— `import` 后面跟的是
      // @note! **模块名**，不是文件路径。模块从哪来由构建系统解决。

      import Foundation
      import MyLib            // @note MyLib 是谁、在哪，由包清单决定

      // @note 本模块内的文件之间**不需要 import** ——
      // @note 它们本来就同属一个模块，直接互相引用

      // @note 模块的来源：
      // @note   ① 标准库与系统框架（Foundation / SwiftUI 这类）
      // @note   ② 包依赖 —— 在 Package.swift 里声明，SwiftPM 去取
      // @note   ③ 本包内的其他 target

      // @note 包清单里写依赖（概念示意）：
      //   dependencies: [ .package(url: "https://.../MyLib.git", from: "1.0.0") ]
      //   targets: [ .target(name: "App", dependencies: ["MyLib"]) ]

      // @note! 所以「模块解析」在 Swift 里是**构建系统的活**，
      // @note! 语言层面只有一个模块名 —— 没有相对路径、没有搜索目录、
      // @note! 也没有「找不到就往上找 node_modules」那种算法
    vs:
      javascript: |
        **两边的解析模型完全不同**：JavaScript 的 `import './util.js'`
        是**按路径**找文件，配上一整套解析算法（相对路径、包名、
        导出映射、向上找 node_modules）；Swift 的 `import MyLib`
        后面跟的是**模块名**，语言不负责找 —— 模块从哪来
        由包清单与构建系统决定。
        所以那边「这个 import 指向哪个文件」能算出来，
        这边只能算到「哪个模块」，具体文件由模块自己组织。
        另一处是 Swift 同模块内**不需要 import**，JavaScript 每个文件都要。
      python: |
        两边的导入单位不同：Python 的 `import` 后面是模块名，
        但**模块与文件/目录一一对应**，而且运行时有一条搜索路径
        （`sys.path`）可以改；Swift 的模块是编译单位，
        `import` 后面是模块名而这个名字与文件无关，
        解析在构建期完成、运行时不参与。
        另一处是 Python 同包内的模块仍要 import，
        Swift 同模块内什么都不用写 —— 这一条会明显改变代码的形状。
      java: |
        两边**最接近**：Java 的 `import com.example.Foo;` 也是
        在编译期解析、靠 classpath 找，运行时不参与；
        Swift 的 `import MyLib` 同样是编译期解析。
        差别在**粒度**：Java 导入的是**类型**（全限定名），
        同包内不用导入；Swift 导入的是**模块**，
        同模块内不用导入。也就是说 Java 的 import 能精确到类，
        Swift 只能到模块 —— 这也解释了为什么 Swift 里
        嵌套类型当命名空间那么常见。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous
