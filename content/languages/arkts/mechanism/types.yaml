# arkts —— mechanism / types
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: types` 的那批。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被检测成屏幕外的语言，泛指时写「另一门语言」。
#
# 口径说明：ArkTS 与语法相近的那门静态方言共享大量写法，本文件只写
# **能核实**的差别；拿不准的禁用项一律不罗列，改为可核实的概括。
# 读者是 JavaScript 开发者，写错比写少伤害大。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-types-v1
    generatedAt: '2026-10-03'

boxes:
  static-vs-dynamic:
    code: |
      let n: number = 1;              // @note 类型在编译期定死
      // n = "text";                  // @note! 编译错误：不做隐式类型变换

      // ArkTS 没有 any / unknown —— 没有「这一段先不检查」的逃生舱
      // let loose: any = 42;         // @note! 编译错误：any 被禁用

      // 标注只活在编译期：运行时的值是纯值，不带类型标注
      function len(s: string): number { return s.length }
      len("hi");                      // @note 参数类型在编译期就核对
      // len(42);                     // @note! 编译错误：参数类型不匹配
    vs:
      javascript: |
        JavaScript 的类型全在运行时：变量能装什么、能不能调某个方法，
        都要跑到那一行才知道。ArkTS 把这件事提到编译期 —— 类型不匹配、
        字段不存在、少传参数，出包前就被拦下。更关键的是它没有逃生舱：
        JavaScript 想放宽一段随时可以，ArkTS 里没有「先不检查」的写法，
        每个值都必须能在编译期推出一个类型。代价是灵活性 ——
        从动态世界拿到的数据，得先经过显式的检查或转换才能用。
      python: |
        Python 全程动态，类型错误要到运行时才暴露；ArkTS 在编译期检查，
        而且把「必须能静态推断出来」当成硬性要求，推断不出来的写法直接报错，
        也没有可以关掉检查的标注。差别不在谁的类型更丰富，
        而在**什么时候告诉你错了**：Python 要跑到那一行，ArkTS 在编译时就拒绝出包。
      java: |
        两边都是静态类型、都在编译期检查，这是最接近的一对。
        差别在逃逸路径：Java 有原生类型、装箱类型、反射这些可以绕过类型系统的口子，
        类型还会被擦除；ArkTS 刻意把这类写法堵住，在这一点上比 Java 更严。
        代价也一样 —— ArkTS 里想做 Java 用反射轻松完成的事，只能把类型信息另写一份。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  type-annotation:
    code: |
      function area(r: number): number {   // @note 参数与返回值都要写类型
        return 3.14 * r * r;
      }

      let x = 1;                    // @note 局部变量可以由初值推断出类型
      let y: number = 1;            // @note 也可以显式标注
      // let z;                     // @note! 编译错误：局部变量声明时就得有值

      interface Point { x: number; y: number }   // @note 描述形状，编译后消失

      class Circle {
        radius: number = 0;         // @note 字段要写类型，或由初值推断
        area(): number { return 3.14 * this.radius * this.radius }
      }
    vs:
      javascript: |
        JavaScript 没有类型标注这回事，参数与返回值都不写；ArkTS 里它们是签名的一部分，
        不写就是编译错误（局部变量有初值时可以省，别处基本都要写）。
        另一处差别是标注的性质：JavaScript 想描述一个对象的形状只能靠文档
        或运行时自检，ArkTS 的接口写在代码里、编译时就能核对 ——
        代价是编译后这些描述全部消失，运行时拿不到。
      python: |
        两边都把类型写在名字后面（`r: number` / `r: float`），也都可以只标注一部分。
        差别在谁在看：Python 的标注运行时不生效，写错了代码照跑，
        要靠额外的类型检查器另跑一遍才发现；ArkTS 的标注就是编译器的输入，
        写错或漏写都出不了包。
      java: |
        位置相反：Java 写 `float r`（类型在前），ArkTS 写 `r: number`（类型在后）。
        能省的范围也相反 —— ArkTS 的局部变量可以省（靠推断），Java 只有 `var` 能省。
        最大的差别是标注的存活期：Java 的类型运行时还在（反射读得到），
        ArkTS 的编译后全部抹掉，想靠类型做序列化、依赖注入只能另写一份信息。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  structural-nominal:
    code: |
      interface Quacker {
        quack(): string;
      }

      class Duck implements Quacker {     // @note 必须显式写 implements
        quack(): string { return "嘎" }
      }

      class Toy {
        quack(): string { return "吱" }   // @note! 方法一模一样也不行：没 implements 就不相容
      }

      function useIt(q: Quacker): string { return q.quack() }
      useIt(new Duck());                  // @note 通过
      // useIt(new Toy());                // @note! 编译错误：ArkTS 不看形状，只看声明
    vs:
      javascript: |
        JavaScript 是完全的运行时鸭子类型：调用那一刻对象上有这个方法就通过，
        没有任何声明。ArkTS 把判断依据换成**声明** —— 两个类就算方法签名一模一样，
        没写 `implements` 就是不相容，传进去直接编译失败。
        所以 JavaScript 里「顺手造个字面量对象冒充接口」的写法在 ArkTS 里行不通，
        必须先有一个实现了接口的类。好处是「谁实现了这个接口」搜得到，
        坏处是为外部数据临时描述一个形状变得很啰嗦。
      python: |
        Python 的类默认也按名字识别，但它保留了运行时鸭子类型，
        还提供 Protocol 这类结构化标注；ArkTS 没有这一路 —— 只认显式声明，
        `implements` 与 `extends` 之外没有别的相容方式。差别在什么时候发现不相容：
        Python 要等调用到那一行（或等类型检查器另跑一遍），ArkTS 在编译时就拒绝。
      java: |
        Java 与 ArkTS 在这里是同一套规则：类必须写 `implements` 才算实现了接口，
        有同名方法不算数 —— 都是名义类型，两边也都能靠搜索找到实现者。
        差别在接口的形态与运行时：Java 的接口可以有默认方法、继承关系更丰富，
        运行时还保留类型信息可供反射核对；ArkTS 的接口更窄，类型信息编译后不保留。
    equivalence:
      javascript: divergent
      python: divergent
      java: analogous

  type-narrowing:
    code: |
      function show(v: string | number): string {
        if (typeof v === "number") {
          return v.toFixed(2);         // @note 这里 v 收窄成 number
        }
        return v.toUpperCase();        // @note 这里 v 收窄成 string
      }

      class Animal { name: string = "" }
      class Cat extends Animal { meow(): string { return "喵" } }

      function speak(a: Animal): void {
        if (a instanceof Cat) {
          a.meow();                    // @note instanceof 之后收窄成 Cat
        }
      }
    vs:
      javascript: |
        JavaScript 里 `typeof` / `instanceof` 只是运行时的判断，判断完的类型不会「留下来」——
        引擎不会因此更了解这个变量。ArkTS 把同一个 `if` 变成编译器掌握的事实：
        分支里可以直接调用收窄后类型的方法，出了分支又恢复成联合类型。
        在 JavaScript 里，「刚判断过」这件事得靠人记住；
        在 ArkTS 里它由编译器替你记着，判断与使用之间那段路不用再自己保证。
      python: |
        Python 用 `isinstance` 判断再分支，收窄只对另跑的类型检查器有意义；
        ArkTS 的收窄是编译器内置的，`typeof`、`instanceof`、真值判断都能触发，
        分支内直接就能用收窄后的方法。差别在覆盖面：Python 的收窄靠类型检查器
        对代码的理解，写法复杂一点就可能推断不出来；ArkTS 的规则是语言的一部分，
        编辑器和命令行看到的结果一致。
      java: |
        Java 传统上是 `instanceof` 判断加显式强转（两步，中间那一转可能写错）；
        Java 16 起有模式匹配，形态上与 ArkTS 越来越像。
        另一处是判断手段：Java 用 `instanceof` 判断的是引用类型，基本类型得靠装箱绕一圈；
        ArkTS 的 `typeof` 直接作用在值上 —— `string | number` 这样的联合类型，
        一个 `typeof` 就把两支分开了，不需要先变成包装类型再去判断。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  null-safety:
    code: |
      let a: string = "hi";
      // a = null;                   // @note! 编译错误：string 类型不含 null

      let b: string | null = null;   // @note 可空必须显式写进类型
      // b.length;                   // @note! 编译错误：b 可能是 null
      let len: number | undefined = b?.length;   // @note 可选链：b 为 null 时整体得 undefined
      let text: string = b ?? "默认";            // @note 空值合并：只认 null / undefined

      function greet(who?: string): string {   // @note 可选参数相当于 string | undefined
        return "你好，" + (who ?? "访客");
      }
    vs:
      javascript: |
        JavaScript 里 `null` / `undefined` 能赋给任何变量，读属性就抛
        「Cannot read properties of null」。ArkTS 把空检查变成强制的：
        「可能为空」必须写进类型里，不写就不允许赋 null，写了就必须在使用前处理掉。
        可选链与空值合并两边都有、语义也一致，区别在于 JavaScript 里它们是可选的保险，
        ArkTS 里是编译器逼你写的必答题。
      python: |
        Python 的 `None` 同样能赋给任何变量，`x.y` 到运行时才抛 AttributeError；
        ArkTS 在编译期就要求把「可能为空」写进类型并强制处理。
        写法上还有一处语义差别：Python 的 `x or "默认"` 对空字符串、0、空列表都会取右边，
        ArkTS 的 `??` 只认 `null` / `undefined` —— `0 ?? 5` 得到 0，而 `0 or 5` 得到 5。
      java: |
        Java 的 `null` 能赋给任何引用类型，解引用就是 NPE，编译器不管；
        ArkTS 在编译期就要求把「可能为空」写进类型。差别在**强制性**：
        Java 的对策是库层面的 `Optional`，只覆盖返回值，字段、参数、局部变量都用不上；
        ArkTS 的可空性是类型系统里的一等公民，字段和参数一样能标、一样强制检查。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent

  type-assertion:
    code: |
      class Animal { name: string = "" }
      class Cat extends Animal { meow(): string { return "喵" } }

      let a: Animal = new Cat();
      let c: Cat = a as Cat;          // @note 向子类断言：编译器放行，运行时不核对

      let v: string | number = "hello";
      let s: string = v as string;     // @note 合法：类型上 v 也可能是 string
      let n: number = v as number;
      // n.toFixed(2);                 // @note! 运行时会炸：此刻 v 其实是字符串

      // 断言不转换任何东西，它只改变编译器对这个值的看法；
      // 而编译器只放行「类型上可能成立」的断言 ——
      // 两个毫不相干的类型之间，`as` 直接是编译错误。
      // 真想确认，只能自己写 typeof / instanceof 的运行时检查。
    vs:
      javascript: |
        JavaScript 里没有「断言」这回事：值就是值，没有一层类型声明需要被说服，
        也就没有「主动放弃检查」这个动作。ArkTS 的 `as` 是你向编译器下的保证 ——
        有时候你确实比它知道得多（刚取出来的值、刚校验过的数据），
        问题是编译器无法验证这个保证，断言之后它就不再看这个值了。
        代价落在这里：写错不会当场报错，错误推迟到运行时，
        而且报错的位置往往离出事的地方很远。
        编译器只守住一条底线：两个毫不相干的类型之间不许断言 ——
        所以 `as` 说的是「据我所知它可能是」，不是「转成什么都行」。
      python: |
        Python 的 `cast(T, x)` 与 ArkTS 的 `as T` 是同一类东西：都是给类型检查器下的指令，
        运行时是空操作，写错了没人拦。差别在默认姿态：Python 不加标注就是动态的，
        本来也没有检查可绕；ArkTS 默认检查，`as` 是一次主动放弃，
        所以它读起来更像危险信号，代码评审时值得多看一眼。
        另有一处小的差别：Python 的 `cast` 不挑对象，转成什么类型都放行；
        ArkTS 会挡住两个毫不相干的类型，把「随手一转」拦在编译期。
      java: |
        编译期两边同样严格：不相干的类型之间强转，Java 与 ArkTS 都直接报错。
        分岔在运行时 —— Java 的强转 `(Cat) x` **真的核对**，类型不对就抛 ClassCastException；
        ArkTS 的 `as` 不核对，所以它比 Java 的强转更不安全：
        Java 至少在那一刻告诉你错了，ArkTS 会让你带着一个错误的理解继续跑下去。
        想在 ArkTS 里得到 Java 式的保证，只能自己写 `instanceof` 检查再断言。
    equivalence:
      javascript: divergent
      python: analogous
      java: divergent
