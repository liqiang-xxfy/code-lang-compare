      import asyncio

      async def main():
          rs = await asyncio.gather(*[fetch(u) for u in urls])            # @note 对应 Promise.all
          settled = await asyncio.gather(*tasks, return_exceptions=True)  # 对应 allSettled
          first = await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)

      asyncio.run(main())          # @note! 事件循环要自己驱动，不像 JS 由运行时托管

      # @note! 循环里不能跑同步阻塞代码：一个 time.sleep(1) 会卡住所有协程
      await asyncio.to_thread(blocking_fn)      # 要跑阻塞代码得显式丢到线程里

      # @note gather 同样是"快速失败但不取消"：其余协程会继续跑完
      # @note Python 里没被接住的协程异常会在循环关闭时打印警告，容易误以为出了问题
