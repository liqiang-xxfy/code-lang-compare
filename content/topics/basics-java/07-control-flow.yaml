id: basics-java/07-control-flow
topicId: basics-java
title: 控制流
order: 7
summary: 条件只认 boolean、switch 会穿透、循环变量出块即失效——从 Java 出发看这一层

features:
  - id: basics-java/if-else
    title: 条件分支
    kind: syntax
    summary: 括号必需，条件必须是 boolean

  - id: basics-java/ternary
    title: 条件表达式
    kind: syntax
    summary: 条件在前，而且条件必须是 boolean

  - id: basics-java/switch-match
    title: switch 与模式匹配
    kind: behavior
    summary: 老 switch 会穿透，新的不会；Java 21 起才有结构化匹配

  - id: basics-java/for-loop
    title: for 循环
    kind: syntax
    summary: 三段式与增强 for 并存，循环变量出块即失效

  - id: basics-java/while-loop
    title: while 循环
    kind: syntax
    summary: 有 do-while，条件同样必须是 boolean

  - id: basics-java/loop-control
    title: 循环控制
    kind: behavior
    summary: 标签能一次跳出多层

  - id: basics-java/loop-index
    title: 带索引遍历
    kind: syntax
    summary: 没有 enumerate，下标要自己维护

  - id: basics-java/range-iteration
    title: 区间与 range
    kind: behavior
    summary: 没有 range 类型，只有流上的两个工厂方法

  - id: basics-java/exception-flow
    title: 异常处理
    kind: behavior
    summary: 受检异常、多重捕获、try-with-resources，没有 else
