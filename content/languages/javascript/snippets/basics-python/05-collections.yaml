  - featureId: basics-python/array-slice
    equivalence: analogous
    code: |
      const xs = [1, 2, 3, 4, 5];
      xs.slice(1, 3);      // [2, 3] —— 同样是左闭右开、浅拷贝
      xs.slice(-2);        // @note [4, 5] —— slice 支持负索引（与下标访问不同）
