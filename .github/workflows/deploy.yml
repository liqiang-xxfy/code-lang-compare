name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 两个变量必须一起给，且 PC_BASE_PATH **不带前导斜杠**
      # （Git Bash / MSYS 会把以 / 开头的环境变量改写成绝对路径，见 scripts/lib/env-paths.ts）
      - name: Build
        env:
          PC_BASE_PATH: ${{ github.event.repository.name }}
          PC_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
