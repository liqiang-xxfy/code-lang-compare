# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（javascript2swift），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: javascript2swift-1-types-and-values
  order: 1
  title: 类型与值语义
  durationHint: 2-3 小时
  todo:
    - 装 Xcode（macOS）或用 Swift Playgrounds / 命令行工具跑通一段代码
    - 写一段熟悉的 JS 逻辑用 Swift 重写，体会「处处显式转换」与「数组是值类型」
    - 理解 Optional 是枚举，试一次 if let / guard let / ?? 的解包
    - 对照本工具「语言机制」板块里 Swift 列的「值语义」「空安全」两格
  acceptance:
    - 能说清把数组传给函数时 JS 与 Swift 的行为差别
    - 能说清 Optional 是枚举这层含义，以及它与 JS 的 null 的差别
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: javascript2swift-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 过一遍字符串、数组、字典的常用操作，注意字符串不能用整数下标
    - 试一次整数溢出（用 &+ 对比默认行为），理解它会崩
    - 把 try / finally 的写法改成 do / catch / defer
    - 对照本工具「基础表达」板块里 Swift 列的写法差异
  acceptance:
    - 能独立写出变量、容器、控制流、函数定义，无语法错误
    - 知道哪些写法在 Swift 里会编译不过（字符串下标、隐式转换）
  resources:
    - label: The Swift Programming Language（官方书）
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: javascript2swift-3-structs-and-protocols
  order: 3
  title: 值类型、协议与扩展
  durationHint: 3-5 天
  todo:
    - 用 struct 建几个数据模型，体会自动生成的逐成员构造器
    - 用协议 + 扩展做复用，对比 JS 的 class 继承
    - 处理一次闭包捕获造成的循环引用（加 [weak self]）
    - 搞清 private / fileprivate / internal / public / open 的区别
  acceptance:
    - 能说清 struct 与 class 的取舍，以及为什么 Swift 默认用 struct
    - 能在需要共享状态时正确选择 class 并处理引用环
  resources:
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
    - label: Swift 官方文档 · 并发
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/

- id: javascript2swift-4-concurrency
  order: 4
  title: 并发：async / await 与 actor
  durationHint: 3-5 天
  todo:
    - 把一段 Promise 链改写成 async / await
    - 用 Task 与 TaskGroup 表达并发，体会结构化并发
    - 用 actor 保护共享状态，理解数据竞争在编译期就被拦
    - 试一次协作式取消：cancel() 之后不检查标志，任务照样跑完
  acceptance:
    - 能说清 Swift 的 actor 与 JS 事件循环在并发安全上的差别
    - 能写出正确响应的可取消任务
  resources:
    - label: Swift 官方文档 · 并发
      url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/

- id: javascript2swift-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 Swift Package Manager 管依赖，理解它与 npm 的差别
    - 用 XCTest 或 swift-testing 写测试，注意 assert / precondition 的三档语义
    - 处理一次跨模块的访问控制问题（open vs public）
    - 对照本工具「工程实践」板块里 Swift 列的工具链
  acceptance:
    - 能独立搭起一个带依赖、测试的 Swift Package
    - 能说清 Swift 的构建与依赖管理和 npm 生态的差别
  resources:
    - label: Swift 官方文档 · Package Manager
      url: https://www.swift.org/documentation/package-manager/
    - label: Swift 官方文档
      url: https://www.swift.org/documentation/
