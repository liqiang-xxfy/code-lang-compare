# feature 池 —— 工程实践板块的**知识点清单**，与基准无关，全站唯一。
#
# 板块定位（docs/完整项目架构.md §2.4）：**能落地** —— 换语言要换的那套工具，
# 但概念本身不变（依赖、构建、测试在哪门语言里都是这几件事，只是名字与命令不同）。
# 因此这是四板块里**分组差异最小**的一个：三个基准的章节划分基本一致，
# 差异体现在标题措辞与个别取舍（如 Java 没有打包器、Python 的虚拟环境是独立心智）。
#
# `group` 是**存放组**，即内容文件名：content/languages/<语言>/practice/<group>.yaml。

section: practice
title: 工程实践

features:
  # ── packages 包管理与依赖 ───────────────────────────────────────
  - id: package-manager
    group: packages
    title: 包管理器
    kind: concept
    summary: 这门语言的依赖从哪来，谁是官方那一个

  - id: dependency-declaration
    group: packages
    title: 依赖声明
    kind: syntax
    summary: 依赖写在哪个文件里，怎么写

  - id: version-constraint
    group: packages
    title: 版本约束
    kind: concept
    summary: 版本号的含义，以及允许升到哪一版

  - id: lockfile
    group: packages
    title: 锁定与可复现安装
    kind: behavior
    summary: 怎么保证别人的机器装出同一套依赖

  - id: environment-isolation
    group: packages
    title: 环境隔离
    kind: concept
    summary: 多个项目的依赖怎么互不干扰

  - id: publishing
    group: packages
    title: 发布与私有源
    kind: concept
    summary: 怎么把自己的包发出去，怎么用内部源

  # ── toolchain 构建与工具链 ──────────────────────────────────────
  - id: compile-run
    group: toolchain
    title: 编译与运行
    kind: syntax
    summary: 一段代码怎么变成能跑的东西

  - id: bundler
    group: toolchain
    title: 打包与转译
    kind: concept
    summary: 源码到产物之间还有几道工序

  - id: linter-formatter
    group: toolchain
    title: 检查与格式化
    kind: concept
    summary: 风格与常见错误交给工具，而不是评审

  - id: type-checker
    group: toolchain
    title: 类型检查工具
    kind: concept
    summary: 类型检查是编译器的一部分，还是另一个进程

  - id: runtime-version
    group: toolchain
    title: 运行时版本管理
    kind: behavior
    summary: 多个语言版本怎么共存与切换

  - id: repl
    group: toolchain
    title: 交互式环境
    kind: concept
    summary: 不进主流程地试一小段代码

  # ── testing 测试 ────────────────────────────────────────────────
  - id: test-framework
    group: testing
    title: 测试框架与组织
    kind: concept
    summary: 测试写在哪，怎么被找到与运行

  - id: assertions
    group: testing
    title: 断言
    kind: syntax
    summary: 判断「符合预期」的标准写法

  - id: mocking
    group: testing
    title: 测试替身
    kind: concept
    summary: 把外部依赖换掉，让测试只测一处

  - id: parameterized-tests
    group: testing
    title: 参数化测试
    kind: syntax
    summary: 同一段逻辑跑多组输入

  - id: coverage
    group: testing
    title: 覆盖率与 CI 集成
    kind: concept
    summary: 测了多少，以及在流水线上怎么跑
