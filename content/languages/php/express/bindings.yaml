# php —— express / bindings
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: bindings` 的那批：
# declaration / mutability / scope / hoisting / shadowing / naming-convention。
#
# PHP 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 PHP 与那个基准两门语言（R25）。
#
# 口径说明：这一组要写准的四件事 ——
# ① **没有声明关键字**（赋值即声明），但**名字有两套大小写规则**：
#    变量区分大小写，函数名/类名/关键字不区分；
# ② **没有块作用域**（只有函数级与全局），这是从三个基准过来最反直觉的一条；
# ③ **没有变量提升**，但「无条件定义的函数」可以在定义之前调用 —— 两者要分开说；
# ④ `$GLOBALS` 的限制是「不能整体赋值」，**逐元素写仍然可以**（别写成「只读」）。
#
# 本文件的事实全部在本机 PHP 8.5.11 上实跑确认过。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-bindings-v1
