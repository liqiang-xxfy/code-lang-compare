# javascript —— basics/03-operators 的实现
# 约定：@note 标注行为差异（@note! 表示高危陷阱）；equivalence 四态见 src/schemas
topic: basics-javascript
snippets:
  - featureId: basics-javascript/equality
    equivalence: identical
    code: |
      1 == "1";        // true    —— @note! 会做隐式类型转换
      1 === "1";       // false   —— 工程规范：一律用 ===

      "" == 0;         // true    —— @note! 空字符串等于 0
      null == undefined; // true
      NaN === NaN;     // false   —— @note! 唯一的自反不等，用 Number.isNaN()

      Object.is(NaN, NaN); // true
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      这是全站**最高频的迁移陷阱**。
      JS 的 `==` 会做隐式类型转换（`1 == "1"` 为 `true`、`"" == 0` 为 `true`），
      所以工程规范一律要求用 `===`（严格相等，不做任何转换）。
      另外 `NaN === NaN` 是 `false` —— 唯一的自反不等，判 NaN 要用 `Number.isNaN()`；
      `Object.is` 与 `===` 只差在 `NaN` 与 `-0` 这两处。
  - featureId: basics-javascript/arithmetic
    equivalence: identical
    code: |
      7 / 2;                // 3.5  —— @note 整数相除也是浮点
      7 % 2;                // 1
      -7 % 2;               // -1   —— @note! 结果符号跟被除数走

      Math.trunc(7 / 2);    // 3    —— 取整要显式调用
      Math.floor(-7 / 2);   // -4   —— @note 注意与截断的区别
      2 ** 10;              // 1024
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `/` 永远返回浮点（`7 / 2` 得 3.5），想取整必须显式调 `Math.trunc` / `Math.floor`，
      没有整除运算符。要当心**负数取模**：`-7 % 2` 得 `-1`，**结果符号跟被除数走** ——
      这个差异会静默产生错误结果，不会报错。`**` 是幂运算。
  - featureId: basics-javascript/logical-short-circuit
    equivalence: identical
    code: |
      // && 与 || 返回的是操作数本身，不是布尔值
      const a = "" || "default";     // "default"
      const b = "x" && "y";          // "y"

      // ?? 只在左值为 null / undefined 时兜底（0 和 "" 会保留）
      const c = null ?? "fallback";  // "fallback"
      const d = 0 ?? "fallback";     // 0 —— @note! 这正是 ?? 与 || 的关键差别

      obj?.method?.()                 // @note 可选链可安全调用
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      `&&` / `||` 返回的是**操作数本身**，不是布尔值 —— 所以 `"" || "default"` 得 `"default"`、
      `"x" && "y"` 得 `"y"`，短路求值靠的就是这个性质。
      `??` 是空值合并：只在左值为 `null` / `undefined` 时兜底，`0` 与 `""` 会保留下来，
      这正是它与 `||` 的关键差别。`?.` 还能安全调用方法：`obj?.method?.()`。
  - featureId: basics-javascript/truthiness
    equivalence: identical
    code: |
      // 假值只有 8 个：false, 0, -0, 0n, "", null, undefined, NaN
      Boolean("");     // false
      Boolean("0");    // true  —— @note 非空字符串恒为真

      Boolean([]);     // true  —— @note! 空数组是真值
      Boolean({});     // true  —— @note! 空对象也是真值
      Boolean(new Map()); // true
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      假值只有 8 个：`false`、`0`、`-0`、`0n`、`""`、`null`、`undefined`、`NaN`，
      其余全是真 —— **空数组 `[]`、空对象 `{}` 都是真值**。
      所以 `if (arr)` 判「非空」是错的，必须写 `arr.length > 0`。
      注意非空字符串恒为真：`Boolean("0")` 是 `true`。
  - featureId: basics-javascript/optional-chaining
    equivalence: identical
    code: |
      const city = user?.address?.city;    // @note 链路中任一环为 null / undefined → 整体 undefined
      const n = obj?.method?.();           // @note 也可安全调用方法
      const [first] = list ?? [];          // 解构时配合 ?? 兜底

      // 注意：?. 只短路「取值」，不吞掉异常。
      // 若 user.address 存在但 city 的 getter 抛错，仍然会抛。
    review:
      state: reviewed
      provenance:
        origin: manual
        license: CC-BY-4.0
      reviewedBy: 阿岩
      reviewedAt: '2026-10-01'
    body: |
      JS 的 `?.` 是语言级安全导航：链路中任一环为 `null` / `undefined` 就整体短路成 `undefined`，
      也可以安全调用方法。配合 `??` 还能给解构兜底：`const [first] = list ?? []`。
      注意它只短路「取值」，不吞异常 —— 若 `user.address` 存在但 `city` 的 getter 抛错，照样抛。
  - featureId: basics-javascript/bitwise
    equivalence: identical
    code: |
      5 & 3;           // 1
      5 | 3;           // 7
      5 ^ 3;           // 6
      ~5;              // -6   —— @note 按位取反（补码），不是「逻辑非」
      1 << 3;          // 8
      1 << 31;         // -2147483648   —— @note! 溢出到符号位
      -1 >>> 0;        // 4294967295    —— @note 无符号右移：把结果当无符号 32 位整数

      // @note! 所有位运算都先把操作数转成「32 位有符号整数」再算，
      //        位宽外的部分直接丢——所以大数做位运算会静默出错
      (2 ** 31) | 0;   // -2147483648

      // @note 常用技巧：`n | 0` 取整（有范围限制）、`n & 1` 判奇偶
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      运算符是标准的一套：`&` `|` `^` `~` `<<` `>>`，另有 `>>>`（无符号右移，
      把结果当无符号 32 位整数看，`-1 >>> 0` 得 `4294967295`）。
      要当心数值语义：所有位运算都**先把操作数转成 32 位有符号整数**再算，位宽外直接丢 ——
      `1 << 31` 溢出到符号位得 `-2147483648`、`(2 ** 31) | 0` 也是负数，
      大数做位运算会静默出错。常用技巧：`n | 0` 取整（有范围限制）、`n & 1` 判奇偶。
  - featureId: basics-javascript/comparison-operators
    equivalence: identical
    code: |
      '2' < 10;        // true   —— @note! 字符串被隐式转成数字
      '2' < '10';      // false  —— @note! 两边都是字符串时按 UTF-16 码元逐位比较，不是数值比较
      'a' < 'B';       // false  —— @note! 小写字母的码元大于大写
      [1] < [2];       // true   —— @note 数组先转成字符串再比，'1' < '2'

      null < 1;        // false  —— null 转成 0？不，这里走的是另一套规则，结果反直觉
      undefined < 1;   // false

      // @note! 跨类型比较先转数字：'2' < 10 为 true，但 '10' < '9' 也为 true（字符串间按字典序）
      // @note JS 里这类隐式转换不会报错，只会给出错误答案
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 的 `<` / `>` 会做隐式转换，规则还分两层：**跨类型时先转数字**（`'2' < 10` 为 true），
      而**两边都是字符串时按 UTF-16 码元逐位比较**（`'2' < '10'` 为 false、`'a' < 'B'` 为 false）。
      数组会先转成字符串再比（`[1] < [2]` 走 `'1' < '2'`）。
      `null < 1`、`undefined < 1` 又走另一套规则，结果同样反直觉。
      这类隐式转换不会报错，只会给出错误答案。
  - featureId: basics-javascript/increment-decrement
    equivalence: identical
    code: |
      let i = 0;

      i++;             // 返回旧值 0，然后 i 变成 1（后缀）
      ++i;             // i 先变成 2，返回新值 2（前缀）
      i--;             // 后缀减
      --i;             // 前缀减

      i += 1;          // 与 ++i 效果相同，但返回的是新值（它是赋值表达式）
      i -= 1;

      const arr = [1, 2];
      let k = 0;
      arr[k++];        // 1 —— @note! 「取值并前进」，一行做两件事

      // @note! i++ 返回旧值、++i 返回新值，写在一行里混用极易出差一错误；
      //        风格指南通常直接建议只用 += 1
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS 有 `i++` / `++i`，而且**前缀后缀影响表达式的值**：后缀返回旧值、前缀返回新值。
      写在一行里混用极易出差一错误，风格指南通常直接建议只用 `+= 1`。
      它还能当表达式用：`arr[k++]` 一行完成「取值并前进」。
  - featureId: basics-javascript/chained-comparison
    equivalence: identical
    code: |
      const x = 5;

      0 < x < 10;             // @note! 结果是 true，但原因不是「x 在区间内」
      // 实际执行顺序：(0 < x) => true，然后 true < 10 => 1 < 10 => true
      // 换成 x = -5 再看看：
      const y = -5;
      0 < y < 10;             // 仍然是 true ！因为 (0 < -5) => false => 0 < 10 => true

      x > 0 && x < 10;        // 正解：必须用逻辑与拆开

      // @note! 这个表达式不报错、结果恒为 true，是「看起来对、实际全错」的典型
      // @note! JS 没有链式比较：0 < x < 10 先算出布尔值再和 10 比，恒为 true
    review:
      state: draft
      provenance:
        origin: llm
        model: deepseek-v4.1-flash
        promptTemplateId: p8-note-rewrite-v1
        generatedAt: '2026-10-02'
    body: |
      JS **没有链式比较**：`0 < x < 10` 实际是 `(0 < x) < 10`——
      先算出布尔值，再让它参与数值比较（`true < 10` 为 true），
      于是**表达式恒为 true**，连 `x = -5` 的时候也一样。
      正解是 `x > 0 && x < 10`。它不报错、看起来也像那么回事，
      属于「看起来对、实际全错」的典型。
