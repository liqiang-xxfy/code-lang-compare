# cpp —— mechanism / async
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: async` 的那批：
# event-loop / callback / promise-future / async-await / cancellation。
#
# C++ 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 C++ 与那个基准两门语言（R25）—— 包括**缩写**。
#
# 口径说明：这一组要写准的一件大事是 **C++ 的「异步」不是一条路，是好几条平行的路**：
# ① 线程 + `std::future`（标准库给了 `std::async` / `promise` / `future`，
#    但 **future 没有 `then`**，没有链式组合 —— 实跑确认）；
# ② C++20 协程（`co_await`）—— 语言给了挂起机制，**不给调度器、也不给标准任务类型**；
# ③ 自己的事件循环 / 第三方库（Asio 那一类）。
# 取消是协作式的：`std::stop_source::request_stop()` 只设标志（实跑确认）。

