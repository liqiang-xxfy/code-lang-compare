# typescript —— express / strings
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: strings` 的那批：
# string-literals / string-common-ops。
#
# TypeScript 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 TypeScript 与那个基准两门语言（R25）。

review:
  state: draft

boxes:
  string-literals:
    code: |
      const a = 'text';                 // @note 单双引号完全等价
      const b = "text";
      const name = "Ada";
      const t = `你好，${name}`;         // @note 反引号：插值 + 可换行
      const esc = 'it\'s';              // @note 转义照旧
      const ch = "a";                   // @note! 没有字符类型：长度 1 的 string 就是它

      // 类型层多出来的一块：模板字面量类型 —— 把字符串的**形状**写进类型
      type Id = `id-${number}`;
      const ok: Id = "id-42";           // @note 通过
      // const bad: Id = "42";          // @note! 编译错误：不以 id- 开头
      type Getter<K extends string> = `get${Capitalize<K>}`;   // @note 类型里也能拼接
    vs:
      javascript: |
        字面量的写法与 JavaScript 逐字相同 —— 单双引号等价、反引号既能插值又能跨行、
        也没有字符类型，因为本来就是同一套运行时语法，TypeScript 一个字都没改。
        它多出来的是**类型层**的一块：同一个反引号还能拿来描述字符串的**形状**，
        `` `id-${number}` `` 读作「以 id- 开头、后面是数字的字符串」。
        这份描述不参与运行 —— 编译后连同上一条注释一起消失，
        只在你看代码的时候拦住错误。
      python: |
        Python 的 f-string 与这里的模板字符串对应，两边都没有字符类型这一点也一样。
        差别在两处：f-string 不能跨行（要跨行得换成三引号），反引号写多行是常态；
        更实质的是类型层 —— Python 的 `Literal["a", "b"]` 只能列出**几个具体取值**，
        表达不了「以 id- 开头、后面是数字」这种形状，而模板字面量类型可以，
        还能在类型里做拼接。Python 的字符串类型要么列出具体值、要么退化成 `str`。
      java: |
        Java 的双引号是 `String`、单引号是 `char`，两种类型不能混用；这里单双引号等价、
        也没有 `char` 类型。Java 没有插值语法，只能用 `+` 拼接（或文本块加 `formatted`），
        写起来更啰嗦。类型层两边都能限定取值范围，但手段不同：Java 靠枚举或注解，
        表达不了「字符串的一部分必须是数字」这种结构；这里的模板字面量类型能把形状
        直接写进类型 —— 代价是它只活在编译期，运行时拿不到。
    equivalence:
      javascript: analogous
      python: divergent
      java: divergent

  string-common-ops:
    code: |
      const s = "hello";
      s.length;                 // @note 5 —— 注意是 UTF-16 码元数，emoji 会算 2
      s.toUpperCase();          // @note 返回新串，s 没变
      s.includes("ell");        // @note true
      s.slice(1, 3);            // @note "el"
      s.split("");              // @note 拆成数组
      ["a", "b"].join("-");     // @note 拼回去
      s.replace("l", "L");      // @note! 只替换**第一处**
      s.replaceAll("l", "L");   // @note 全替换
      s.at(-1);                 // @note 支持负下标（slice 不支持）

      // 这里没有独立的字符串类型：所有标注都写 string
      const n: string = s.length.toString();
    vs:
      javascript: |
        这一格与 JavaScript **完全相同** —— 方法集、默认行为（`replace` 只换第一处、
        `length` 数的是 UTF-16 码元、负下标只有 `at()` 认）逐条一致，
        因为运行时本来就是同一个。TypeScript 在这里只做一件事：给这些方法补上类型签名，
        参数写错、把返回值当成别的类型用，编译期就报出来。
        它没加方法、没改语义，只把「用错了」从运行时提前到了编辑器里 ——
        `identical` 是如实标注。
      python: |
        Python 用内建函数与运算符：`len(s)`、`"ell" in s`、`s[1:3]`；
        这里对应 `s.length`、`s.includes(...)`、`s.slice(1, 3)`。
        最要命的一处默认值相反：Python 的 `str.replace` **默认全替换**，
        这里的 `replace` **只换第一处** —— 同一行代码在两边结果不同。
        另一处是下标规则：Python 的切片支持负数、越界不报错，
        这里负下标只有 `at()` 认。
      java: |
        Java 的 `length()` 是方法不是属性，`substring` 与这里的 `slice` 对应；
        最容易混的是 `replace` 这一对名字：Java 的 `replace` 全替换、
        `replaceAll` 收的是**正则**，这里正相反（`replace` 只看第一处、
        `replaceAll` 收的是字面量字符串）。循环里拼字符串 Java 要换 `StringBuilder`，
        这里直接 `+=` 也行。类型上 Java 有 `String` 与 `char` 之分、两者不能混用，
        这里的字符串只有 `string` 一种。
    equivalence:
      javascript: identical
      python: divergent
      java: analogous
