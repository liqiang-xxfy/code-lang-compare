# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（python2kotlin），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: python2kotlin-1-static-and-null
  order: 1
  title: 静态类型与空安全
  durationHint: 2-3 小时
  todo:
    - 装 JDK 与 Kotlin 命令行（或用 IntelliJ IDEA 建工程）
    - 写一段熟悉的 Python 逻辑用 Kotlin 重写，体会「处处要写类型、可能为空要标出来」
    - 理解名义类型：Kotlin 的 interface 必须 implements，不像 Python 的 Protocol
    - 对照本工具「语言机制」板块里 Kotlin 列的「静态 vs 动态」「空安全」两格
  acceptance:
    - '能说清 String 与 String? 的区别，以及 ?. / ?: / !! 的语义'
    - 知道为什么「一个变量先后装不同类型」在 Kotlin 里不行
  resources:
    - label: Kotlin 官方文档（中文）
      url: https://book.kotlincn.net/
    - label: Kotlin 官方文档（英文）
      url: https://kotlinlang.org/docs/home.html

- id: python2kotlin-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 把列表推导式改写成 filter / map 链，注意 List 与 Sequence 的求值差别
    - 把 *args / **kwargs 分别改写成 vararg 与显式 Map 参数
    - 把 match 改写成 when，体会不贯穿与能返回值
    - 对照本工具「基础表达」板块里 Kotlin 列的写法差异
  acceptance:
    - 能独立写出变量、容器、控制流、函数定义，无语法错误
    - 能说清 val 与「不可变」的关系（只锁引用）
  resources:
    - label: Kotlin 官方文档 · 基础语法
      url: https://kotlinlang.org/docs/basic-syntax.html

- id: python2kotlin-3-classes
  order: 3
  title: 类与对象模型
  durationHint: 3-5 天
  todo:
    - 写几个类，体会默认 final、要 open 才能继承
    - 用 companion object / object / 顶层函数替代 Python 的类属性与模块函数
    - 试试 data class 与解构，对比 Python 的 dataclass 与元组解包
    - 注意构造参数带不带 val / var 的区别
  acceptance:
    - 能说清 Kotlin 的默认 final 与 Python 默认开放的设计取舍
    - 能用 data class 替代 dataclass 的常见用法
  resources:
    - label: Kotlin 官方文档 · 类与对象
      url: https://kotlinlang.org/docs/classes.html

- id: python2kotlin-4-coroutines
  order: 4
  title: 协程与并发
  durationHint: 3-5 天
  todo:
    - 把一段 asyncio 代码改写成 suspend 函数加协程构建器
    - 验证「协程默认不并行」：在 runBlocking 里 launch 几个任务看顺序
    - 用 Dispatchers.Default 显式并行
    - 理解结构化并发：子协程失败会取消父作用域
  acceptance:
    - 能说清协程与 asyncio 的异同，尤其是结构化并发这一点
    - 知道什么时候要显式指定调度器
  resources:
    - label: Kotlin 官方文档 · 协程
      url: https://kotlinlang.org/docs/coroutines-guide.html

- id: python2kotlin-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 Gradle 管一个 Kotlin 工程，理解它与 pip / venv 的差别
    - 配 detekt 或 ktlint
    - 用 JUnit 写测试，注意类默认 final 对测试替身的影响
    - 对照本工具「工程实践」板块里 Kotlin 列的工具链
  acceptance:
    - 能独立搭起一个带依赖管理、lint、测试的 Kotlin 工程
    - 能说清 Gradle 的构建生命周期与 Python 工具链的差别
  resources:
    - label: Gradle 官方文档
      url: https://docs.gradle.org/current/userguide/userguide.html
    - label: Kotlin 官方文档
      url: https://kotlinlang.org/docs/home.html
