id: concepts-java/04-modules-concurrency
topicId: concepts-java
title: 模块、并发与内存
order: 4
summary: 代码怎么分文件、内存谁来收、同时干几件事时到底谁在跑
features:
  - id: concepts-java/module-system
    title: 模块系统
    kind: concept
    summary: 包加类两级；一个文件最多一个 public 类，且必须与文件名同名

  - id: concepts-java/memory
    title: 内存管理
    kind: concept
    summary: JVM 分代回收、旋钮很多；资源却要靠 try-with-resources 显式关

  - id: concepts-java/concurrency-unit
    title: 并发单元
    kind: concept
    summary: 线程真并行，代价是数据竞争要自己保证

  - id: concepts-java/async-model
    title: 异步模型
    kind: concept
    summary: 线程池加 CompletableFuture；阻塞会占住一个真实线程
