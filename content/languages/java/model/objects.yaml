# java —— model / objects
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: objects` 的那批。
# 这一组以 Java 为基准时排在「接口与抽象类」之后（见 catalog/model/java.yaml）——
# 先有契约再有实现，这是 Java 视角的顺序。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: model-objects-v1
    generatedAt: '2026-10-03'

boxes:
  class-declaration:
    code: |
      public class User {              // @note 类就是类型，编译期存在
        private String name;           // @note 字段必须声明
        public User(String name) { this.name = name; }
      }

      class Helper { }                 // @note 一个文件可以放多个类

      // @note 匿名类：只为覆写一两个方法而生
      Runnable r = new Runnable() { public void run() { } };

      // @note record：字段即全部状态，访问器与 equals 自动生成
      record Point(int x, int y) { }
    baseline: |
      类是**编译期的类型**，字段必须显式声明（运行时不会凭空长出新字段）。
      一个文件可以放多个类，但只有一个是 public。`record` 是近几年补上的
      数据类语法；匿名类用来一次性覆写接口。类是静态的 ——
      运行时不能像动态语言那样给一个对象加字段。
    vs:
      javascript: |
        JavaScript 的 `class` 只是语法糖、运行时只有对象与原型链，对象随时能
        加字段；Java 的类是类型，字段在编译期就定死。代价是灵活度，
        收益是所有字段访问都能被检查。
      python: |
        Python 的类是运行时对象、能动态创建、实例能随时长属性；
        Java 的类在编译期固定。两边对「类是什么」的回答根本不同：
        一个是类型声明，一个是普通对象。
    equivalence:
      javascript: divergent
      python: divergent

  constructor:
    code: |
      public class User {
        private final String name;
        private int age;

        public User(String name) { this(name, 0); }      // @note this(...) 串到另一个
        public User(String name, int age) {              // @note 构造函数可以重载
          this.name = name;
          this.age = age;
        }

        public static User guest() {                     // @note 静态工厂也是常规做法
          return new User("访客");
        }
      }

      // @note 初始化顺序：字段默认值 -> 字段初始化器 -> 构造器体
    baseline: |
      构造函数**可以重载**（同名不同参数表），也能用 `this(...)` 从一个构造器
      转到另一个，把校验集中在一处。字段有默认值（`0` / `false` / `null`），
      然后按「字段初始化器 → 构造器体」的顺序执行。`final` 字段必须在构造器里
      赋完值，编译器会检查。
    vs:
      javascript: |
        JavaScript 的 `constructor` 只有一个，多种构造要靠静态工厂；
        Java 两者都能用，而且重载由编译器帮你挑。另一处差别是 Java 的字段
        有默认值、且初始化顺序有明确规定，JavaScript 不写就是 undefined。
      python: |
        Python 的 `__init__` 只是初始化钩子（对象已经造好了），Java 的构造器
        是真正的「造对象」入口。两边都能写替代构造，只是 Python 靠命名不同的
        类方法、Java 靠重载。
    equivalence:
      javascript: divergent
      python: analogous

  fields-and-properties:
    code: |
      public class User {
        private String name;                       // @note 字段必须声明
        public static final int MAX = 100;         // @note 类级常量

        public String getName() { return name; }   // @note 访问器是**方法**
        public void setName(String v) { this.name = v; }
      }

      u.getName();                                 // @note! 括号不能省 —— 没有属性语法

      // @note record 会直接生成访问器，且名字就是字段名（不带 get 前缀）
      record Point(int x, int y) { }
      new Point(1, 2).x();                         // @note 不是 getX()
    baseline: |
      **没有属性（property）这种东西**：字段就是字段、getter 就是方法，
      调用点必须带括号。惯例是 `getName()` / `setName()`（record 例外，
      访问器就叫 `x()`）。字段必须声明，`static final` 是类级常量。
      这套「私有字段 + 公开访问器」的写法在 Java 里是刻意的设计，
      而不是省略了属性语法。
    vs:
      javascript: |
        JavaScript 用 `get` / `set` 定义属性，访问点看不出背后是方法；
        Java 一律是方法调用，带不带括号一眼能分辨。两边的字段可见性默认值
        也相反：Java 每个成员都要选，JavaScript 默认公开。
      python: |
        Python 用 `@property` 做到「像属性一样访问、背后跑方法」，
        Java 完全没有这个能力。反过来说 Java 的字段必须声明、
        访问范围由修饰符决定，Python 的实例属性随时可以出现。
    equivalence:
      javascript: divergent
      python: divergent

  methods-and-receiver:
    code: |
      public class Counter {
        private int n = 0;
        public void bump() { this.n++; }        // @note this 是隐式的，可省略
        public int get() { return n; }          // @note 不写 this 也指当前实例
      }

      var c = new Counter();
      Runnable r = c::bump;                     // @note 方法引用：绑定已确定
      r.run();                                  // @note 正常执行

      // @note! 静态方法里没有 this
      // @note 内部类访问外层实例要用 Outer.this
    baseline: |
      `this` **恒等于当前实例**，是隐式的（不用写进参数表，也可以省略不写）。
      方法取出来当方法引用传（`c::bump`）时接收者已经绑定好，不会丢。
      内部类里访问外层实例要写 `Outer.this`。静态方法没有 `this`。
    vs:
      javascript: |
        JavaScript 的 `this` 由调用方式决定，取出来单独调用就丢 —— 这是它独有的
        问题。Java 的 `this` 恒等于实例，与方法怎么被传递无关。
      python: |
        Python 的 `self` 是显式参数、在取属性时绑定；Java 的 `this` 隐式、
        同样不会丢。两者都是「接收者不会丢」的模型，只是写法一个显式一个隐式。
    equivalence:
      javascript: divergent
      python: analogous

  inheritance:
    code: |
      class Animal { String speak() { return "..."; } }
      class Dog extends Animal {                  // @note 单继承
        @Override String speak() { return super.speak() + " 汪"; }
      }

      // @note! 只能继承一个类 —— 多份能力走接口
      interface Swimmer { void swim(); }
      class Duck extends Animal implements Swimmer {
        public void swim() { }
      }

      // @note 所有类都继承 Object（equals / hashCode / toString 从这来）
      // @note 类默认 sealed 之前是「谁都能继承」，Java 17 起可以用 sealed 限制
    baseline: |
      **类只能单继承**，多份能力靠**实现多个接口**（接口带默认方法后也能给实现）。
      所有类都隐式继承 `Object`，所以 `equals` / `hashCode` / `toString` 一定有。
      Java 17 起还能用 `sealed` 明确限定「只有这几个类能继承我」。
    vs:
      javascript: |
        JavaScript 同样单继承，但没有接口这一层，多份能力只能靠混入原型或组合；
        Java 的接口是语言构造，能声明的能力有正规语法。
      python: |
        Python 支持多继承并用 MRO 裁决冲突，Java 用「单继承 + 多接口」达到
        类似效果。两边的取舍不同：Python 的规则更统一但更绕，
        Java 限制更多但一眼能看出一个类有几条来源。
    equivalence:
      javascript: divergent
      python: divergent

  access-control:
    code: |
      public class Account {
        private int balance;              // @note 只有本类能访问
        protected int limit;              // @note 本包 + 子类
        int internal;                     // @note 不写 = 包内可见
        public String owner;              // @note 谁都能访问

        private void audit() { }
      }

      // @note! 编译器强制，不是约定 —— 类外访问 private 直接编译错误
      // @note 反射能绕过（setAccessible），但那是刻意为之
    baseline: |
      四个层级由**编译器强制**：`private`（仅本类）、不写（包内）、`protected`
      （本包加子类）、`public`（谁都能访问）。每个成员都要选一个，
      默认（不写）是包内可见而不是公开 —— 反射可以绕过，但那需要刻意为之。
    vs:
      javascript: |
        JavaScript 默认全公开，只有写了 `#` 的才是真私有；Java 默认包内可见，
        每个成员都要显式表态。两边的 `#` 与 `private` 强度相当，
        但覆盖面与默认值正好相反。
      python: |
        Python 的「私有」只有下划线约定，语言不强制，双下划线也只是改名；
        Java 的修饰符全部由编译器执行。从 Python 换过来最容易误判的是
        「不写修饰符」—— 那在 Java 里是包内可见，不是公开。
    equivalence:
      javascript: analogous
      python: divergent
