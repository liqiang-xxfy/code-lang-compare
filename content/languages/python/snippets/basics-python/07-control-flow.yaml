  - featureId: basics-python/while-loop
    equivalence: identical
    code: |
      while running:
          tick()

      # @note 没有"至少执行一次"的循环结构，惯用替代是 while True + break：
      while True:
          line = read()
          if not line:
              break                # @note! 出口必须自己保证，漏一个 break 就是死循环
          handle(line)

      # @note while 也有 else 子句，语义与 for-else 相同：没被 break 打断时执行
  - featureId: basics-python/loop-control
    equivalence: identical
    code: |
      for item in items:
          if matches(item):
              found = item
              break
      else:
          found = None             # @note for-else：没被 break 打断才执行，表达"找过了没找到"
      # 它替代的是"额外维护一个标志位变量"的写法

      for x in xs:
          if skip(x):
              continue             # @note continue 不影响 else，只有 break 会跳过它
          handle(x)
  - featureId: basics-python/loop-index
    equivalence: identical
    code: |
      for i, x in enumerate(xs):        # @note 返回惰性迭代器，不会先建一个数组
          pass

      for i, x in enumerate(xs, start=1):   # @note 可以指定起始编号
          print(f"第 {i} 项：{x}")

      for x, y in zip(xs, ys):          # @note 并行遍历，在最短的序列处停
          pass
      for i, (x, y) in enumerate(zip(xs, ys)):
          pass

      zip(xs, ys, strict=True)          # 3.10+：长度不一致直接抛错，比静默截断安全
  - featureId: basics-python/range-iteration
    equivalence: identical
    code: |
      range(5)             # @note 0,1,2,3,4 —— 左闭右开
      range(2, 5)          # 2,3,4
      range(0, 10, 2)      # 0,2,4,6,8
      range(5, 0, -1)      # 5,4,3,2,1

      range(10 ** 9)       # @note 瞬间构造：惰性序列，不占内存
      list(range(10 ** 9)) # 这个才真的去建十亿个元素

      print(range(3))      # @note! 输出 range(0, 3)，不是 [0, 1, 2] —— 它不是列表
      3 in range(10)       # @note True，且是 O(1) 判断
  - featureId: basics-python/exception-flow
    equivalence: identical
    code: |
      try:
          risky()
      except ValueError as e:        # @note 必须点名类型才能精确捕获
          handle(e)
      except (KeyError, IndexError): # 多个类型可以合并成一个分支
          fallback()
      except Exception as e:         # @note! 兜底写 Exception，
          log(e)                     # 不要写空的 except: —— 那会连 Ctrl-C 一起吞掉
          raise                      # 重新抛出，保留原始栈

      else:
          succeeded()                # @note 没抛异常时执行：try 块里只放可能抛的那一句
      finally:
          cleanup()                  # 无论如何都执行

      raise NewError() from e        # @note 显式关联因果链；不想显示原文用 from None
      # @note! 只能抛异常对象：raise "出错了" 是 TypeError，自定义异常要继承 Exception
