  - featureId: basics-python/logical-short-circuit
    equivalence: analogous
    code: |
      // @note! 短路求值一样，但只返回 boolean —— Java 没有"返回操作数本身"这回事
      String s = null;
      // String r = s || "默认";        // 编译错误
      String r = (s != null) ? s : "默认";   // 只能写三元

      boolean ok = flag && check();   // @note 短路有效：flag 为 false 时 check() 不执行
      boolean any = flag || check();
  - featureId: basics-python/truthiness
    equivalence: absent
    code: |
      // @note! Java 完全没有真值转换，条件位置只接受 boolean
      java.util.List<String> items = java.util.List.of();
      // if (items) { }                    // 编译错误
      // if (!items) { }                   // 编译错误
      if (items.isEmpty()) { }             // 必须显式写出"空不空"
      if (items.size() == 0) { }

      // 也没有"或就取默认值"的写法：?? 与 or 的语义在这里都不存在
    body: |
      Java 没有真值转换：`if`、`while`、`&&` 的条件位置**只接受 `boolean`**，
      传别的类型是编译错误，不是运行时错误。

      所以 Python 里那些依赖真值的惯用法（`if items:`、`x or default`）
      在 Java 里没有对应形态，一律要显式写出来：`items.isEmpty()`、
      `x != null ? x : default`。

      代价是代码更长，好处是**读代码不再需要先知道变量类型**才能确定
      `if (x)` 在问什么 —— 这也正是 Python 那套惯用法最难读的地方。
  - featureId: basics-python/optional-chaining
    equivalence: absent
    code: |
      // @note! 没有 ?. 这种安全导航语法
      String host = null;
      if (cfg != null && cfg.db != null) {
          host = cfg.db.host;              // 只能逐层判空
      }

      // Java 8+ 的惯用替代是把"可能没有"编码进类型：
      java.util.Optional<Db> db = java.util.Optional.ofNullable(cfg).map(Cfg::db);
      String h = db.map(Db::host).orElse("localhost");

      // @note 但它只包引用类型，且 .get() 忘了判空一样抛 NoSuchElementException
    body: |
      Java 没有安全导航运算符，链式取值只能逐层判空 —— 这正是
      `Optional` 被引入的原因：把"可能没有"从"某个字段碰巧是 null"
      变成一个类型上的事实。

      实践中的分工是：**内部字段判空仍用 `!= null`**（`Optional` 用在字段上
      反而被认为是不良实践），**返回值边界**才用 `Optional` 表达"这次调用
      可能什么也没算出来"。
