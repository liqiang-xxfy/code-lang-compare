# javascript —— model / collections
#
# boxes 的 key 必须是 catalog/model/features.yaml 里 `group: collections` 的那批：
# list-array / map-dict / set / tuple-record / collection-mutability / slicing。
#
# 与 express/containers 的分工：那里讲「怎么用数组与对象」，
# 这里讲「怎么选、以及共享与改动时会发生什么」。

review:
  state: draft

boxes:
  list-array:
    code: |
      const xs = [1, "two", null];      // @note 元素类型不限、长度可变
      xs.push(3);
      const arr = new Array(3);         // @note! 三个空洞，不是三个 0
      Array.from({ length: 3 }, () => 0);   // @note 想要三个 0 得这样写

      xs.length = 1;                    // @note! 直接把数组截短
      // @note 没有定长数组，也没有「只能放一种类型」的数组
    baseline: |
      只有一种序列：`Array`。长度可变、元素类型不限、**可以是稀疏的**
      （越界赋值或 `new Array(n)` 都会留下空洞）。没有定长数组、
      没有类型受限的数组 —— 那些需求要么靠约定，要么靠 TypeScript 的类型层。
    vs:
      python: |
        Python 把序列分成 list（可变）与 tuple（不可变）两种，选哪个本身就是
        设计决策；这里只有 Array 一种。Python 没有稀疏数组这回事，
        越界直接 IndexError，这里会静默造出空洞。
      java: |
        Java 同时有定长数组与 `List` 两条线，还要在 `ArrayList` / `LinkedList`
        等实现里选；这里一个 `Array` 全包。倒过来看，Java 的类型参数
        保证了「这个列表里只有 String」，这里做不到。
    equivalence:
      python: analogous
      java: divergent

  map-dict:
    code: |
      const d = { a: 1 };              // @note 对象当字典：键只能是字符串
      const m = new Map();             // @note Map：键任意类型、有 size
      m.set(1, "数字键");               // @note 数字键在对象里会变成字符串 "1"

      {}.toString;                     // @note! 继承来的属性也在里面
      Object.create(null);             // @note 无原型的对象，当纯字典用更安全

      // @note! 对象的键顺序有约定（整数键优先），不该依赖
      [...m.keys()];                   // @note Map 严格按插入顺序
    baseline: |
      两种选择：**对象字面量**（键只能是字符串或 symbol、没有 `size`、
      带着原型链上继承来的属性、键顺序有整数优先的特殊规则）与
      **`Map`**（键任意类型、有 `size`、严格按插入顺序）。
      当字典用就该选 `Map` —— 用对象当字典时，原型链与键顺序这两个包袱迟早出问题。
    vs:
      python: |
        Python 只有一种 dict：键必须可哈希、有 `len()`、严格按插入序 ——
        它同时覆盖了这里的「对象」与「Map」两个角色，所以从这边过去要先想清楚
        「我到底要哪个」。Python 没有原型链，也就不存在「继承来的键」这回事。
      java: |
        Java 也是「一个概念多个实现」：要按插入序选 `LinkedHashMap`、
        要按 key 排序选 `TreeMap`、无所谓用 `HashMap`。这里两种选择、
        那边三种，共同点是都要求你为「顺序有没有保证」做个决定。
    equivalence:
      python: divergent
      java: analogous

  set:
    code: |
      const s = new Set([1, 2, 2]);    // @note 去重 -> {1, 2}
      s.add(3);
      s.has(2);                        // @note 成员判断是 O(1)
      s.size;
      [...s];                          // @note 转数组

      // @note! Set 用的是 SameValueZero：NaN 算相等，对象比引用
      new Set([NaN, NaN]).size;        // @note 1
      new Set([{}, {}]).size;          // @note! 2 —— 两个不同对象
    baseline: |
      `Set` 负责去重与成员判断，判等用的是 SameValueZero（`NaN` 与 `NaN` 算相等、
      对象比引用）。所以「两个内容相同的对象」在集合里是两条 ——
      想按内容去重只能先序列化成字符串。没有内建的不可变集合。
    vs:
      python: |
        Python 有 set（可变）与 frozenset（不可变、可当字典的键）两种，
        这里只有一种。判等规则也不同：Python 用 `__hash__` + `__eq__`，
        所以给自定义类型实现这两个方法就能按内容去重，这里做不到。
      java: |
        Java 有 `HashSet` / `LinkedHashSet`（保插入序）/ `TreeSet`（排序）三种，
        并且元素**必须正确实现 `hashCode` 与 `equals`**，否则行为不可预期 ——
        这一条是 Java 里最经典的坑之一。这里用引用判等，规则简单但没法定制。
    equivalence:
      python: divergent
      java: divergent

  tuple-record:
    code: |
      const point = [3, 4];            // @note 用数组当元组：靠约定记住"0 是 x"
      const user = { name: "Ada", age: 36 };   // @note 记录用对象

      const [x, y] = point;            // @note 解构读出来
      const { name } = user;           // @note 按名字取

      // @note! 没有「固定长度、固定字段」的类型 —— 数组可以是任意长度，
      //        对象可以有任意键，全靠约定
    baseline: |
      没有元组这种类型。**定长的小聚合用数组**（靠位置约定）、
      **带名字的用对象**（靠键约定），两者都不会被语言检查长度或字段。
      解构让读写都还算方便，但「这个数组到底是 [x, y] 还是 [lat, lng]」
      只有注释能回答。
    vs:
      python: |
        Python 有真元组（定长不可变），还有 `namedtuple` / `dataclass` 把
        「有名字的定长聚合」做成了类型；这里两者都只能靠约定。
        代价是 Python 那边要显式声明一个类型，收益是字段名由语言保证。
      java: |
        Java 的 `record` 是语言级的定长聚合：字段名、访问器、`equals`、
        `hashCode` 全部自动生成，编译器保证字段就那几个。这里用对象模拟时
        这些都靠人记，多一个字段少一个字段没有任何提示。
    equivalence:
      python: divergent
      java: divergent

  collection-mutability:
    code: |
      const xs = [1, 2, 3];
      Object.freeze(xs);               // @note! 只是**浅**冻结，而且只冻结这一层
      xs.push(4);                      // @note! 静默失败（严格模式下抛错）

      const nested = Object.freeze([[1]]);
      nested[0].push(2);               // @note! 照样成功 —— 内层没被冻结

      // @note 语言里没有不可变集合类型；要真不可变得用第三方库
      //       或者干脆靠约定：传出去的数组不修改
    baseline: |
      **没有内建的不可变集合**。`Object.freeze` 是浅冻结、而且失败时静默
      （非严格模式），指望它当不可变容器很容易翻车。所以「这个数组能不能改」
      在 JS 里是一句约定，不是类型能回答的问题 —— 需要真不可变时得上库，
      或者用「不改原数组、返回新数组」的写法（`map` / `filter` / 展开）。
    vs:
      python: |
        Python 把不可变做进了类型：tuple 与 frozenset 就是不可变的，
        而且**内层元素是否可变是另一回事**（元组里装列表照样能改内容）——
        这一点与这里的浅冻结一样，但至少外层由语言保证。
      java: |
        Java 的 `List.of(...)` / `Map.of(...)` 是真正不可变的，改它就抛异常；
        另有 `Collections.unmodifiableList` 这种「视图」写法。
        这里连类型都没有，只能靠约定与第三方库。
    equivalence:
      python: divergent
      java: divergent

  slicing:
    code: |
      const xs = [1, 2, 3, 4];
      const part = xs.slice(1, 3);     // @note [2, 3] —— 返回**副本**，改它不影响原数组
      part[0] = 99;                    // @note xs 还是 [1, 2, 3, 4]

      const obj = { a: { b: 1 } };
      const copy = { ...obj };         // @note! 浅拷贝：内层还是同一个对象
      copy.a.b = 2;                    // @note! obj.a.b 也变成 2

      const deep = structuredClone(obj);   // @note 真深拷贝（结构化克隆算法）
      xs.splice(1, 1);                 // @note! splice 是**改原数组**的那个
    baseline: |
      `slice` 与展开运算符都是**浅拷贝**：外层是新的，内层还是共享的引用 ——
      「我复制了一份再改」这个直觉在嵌套结构上会出错。要真深拷贝用
      `structuredClone`。另外 `slice`（复制）与 `splice`（原地删除/插入）
      只差一个字母，是常见的手滑点。
    vs:
      python: |
        Python 的切片 `xs[1:3]` 同样是浅拷贝，深浅的坑一模一样
        （copy 模块的 `deepcopy` 对应这里的 `structuredClone`）。
        差别在语法：Python 用切片表达式，这里用方法；Python 还能用切片赋值
        原地替换一段，这里没有对应写法。
      java: |
        Java 的 `subList(1, 3)` 是**视图**不是副本 —— 改子列表会改到原列表，
        而且把它存起来再改原列表会让它失效（抛 ConcurrentModificationException）。
        这里的 `slice` 返回副本，两边对「取一段」的默认预期正好相反。
    equivalence:
      python: analogous
      java: divergent
