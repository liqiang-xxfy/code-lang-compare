    code: |
      // @note! 没有"自由函数"：一切方法都必须挂在类（或接口）上
      class Greeter {
          static String greet(String name, String greeting) {
              return greeting + "，" + name;
          }
      }
      Greeter.greet("Ada", "你好");

      record Point(int x, int y) {
          int manhattan() { return Math.abs(x) + Math.abs(y); }   // @note 实例方法
      }

      // @note 返回类型写在签名里且必须写全（void 也要写），没有省略的余地
      // @note 方法可以有多个重载版本，靠参数类型区分
  - featureId: basics-python/default-params
    equivalence: absent
    code: |
      // @note! 没有默认参数，只能靠重载或可选类型
      static String greet(String name) { return greet(name, "你好"); }
      static String greet(String name, String greeting) { return greeting + "，" + name; }

      greet("Ada");
      greet("Ada", "Hi");

      // 参数一多，重载会组合爆炸。惯用替代是 Builder 或 record + 可选字段：
      record Options(boolean pretty, boolean strict) {
          static Options defaults() { return new Options(false, false); }
          Options withPretty() { return new Options(true, strict); }
      }

      // @note 与"默认值定义时求值一次"那类坑无缘 —— 因为这个特性根本不存在
    body: |
      Java 没有默认参数，两种替代各有代价：

      - **重载**：`greet(name)` 与 `greet(name, greeting)` 两个方法。
        参数少时够用，参数到四五个就会组合出十几个重载。
      - **Builder / record + wither 方法**：可读性好，但要多写一个类型，
        而且对象构造多了一层间接。

      与 Python 的默认参数相比，最大的差别是**默认值落在哪里**：
      这边没有"默认值"这个运行时概念，因此也不存在"默认值在定义时求值一次"
      那类共享可变对象的坑 —— 代价是每次要显式写出来。
  - featureId: basics-python/kwargs
    equivalence: absent
    code: |
      // @note! 完全没有关键字参数：调用处只有位置，名字完全不参与匹配
      render(text, true, false);      // 这两个布尔各是什么意思，必须翻签名

      // 唯一的缓解手段是传一个配置对象：
      render(text, new RenderOptions(true, false));
      // 或者用 Builder，让每个参数在调用处带上名字：
      RenderOptions.builder().pretty(true).build();

      // @note 没有 / 与 * 那样的强制具名机制，也没法"新增参数不破坏既有调用"
    body: |
      Java 没有关键字参数。调用处只按位置匹配，参数名在调用点完全不出现 ——
      所以 `f(a, b, true, false)` 这种调用必须翻签名才能读懂。

      惯用的缓解是**配置对象 + Builder**：把参数变成具名方法调用，
      读起来确实清楚了，但要多写一个类型，而且运行时不会校验"有没有漏设"。

      与 Python 相比还有一个连锁差异：Python 的 `*` 分隔符能让
      "新增一个关键字参数"成为向后兼容的改动；在这里要新增参数，
      要么加重载，要么改所有调用点。
  - featureId: basics-python/rest-params
