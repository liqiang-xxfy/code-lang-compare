- featureId: basics/optional-chaining
  equivalence: divergent
  code: |
    User user = maybeUser();
    String city = null;
    if (user != null && user.address != null) {
        city = user.address.city;      // @note! 必须逐层判空：没有 ?. 这种语法
    }

    // 现代写法：把判空链交给 Optional
    String city2 = Optional.ofNullable(user)
        .map(u -> u.address)
        .map(a -> a.city)
        .orElse("未知");

    // @note 比 JS 的 ?. 啰嗦，但「哪一步可能为空」被写进了类型里
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/bitwise
  equivalence: identical
  code: |
    5 & 3;      // 1
    5 | 3;      // 7
    5 ^ 3;      // 6
    ~5;         // -6            —— @note 按位取反（负数按补码表示）
    1 << 3;     // 8
    -8 >> 1;    // -4            —— @note 算术右移，保留符号位
    -8 >>> 1;   // 2147483644    —— @note 无符号右移，高位补 0

    // @note Java 的位运算与 JS 几乎一致（连 >>> 都有），
    //       差别主要在数值位宽：Java 是 32/64 位定点，JS 是 64 位浮点
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/comparison-operators
  equivalence: divergent
  code: |
    1 < 2;                  // true
    // "a" < "b";           // 编译错误：字符串不能用 < 比较
    "a".compareTo("b");     // -1   —— @note 字符串比较要用 compareTo
    "a".equals("a");        // 内容相等用 equals

    // @note! Java 没有跨类型隐式比较：数值与布尔不能比，引用类型不能与 < 比，
    //        一切类型不匹配都是编译错误
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/increment-decrement
  equivalence: analogous
  code: |
    int i = 0;
    i++;        // 后置：先用旧值，再自增
    ++i;        // 前置：先自增，再给值
    i--; --i;

    int a = 1;
    int b = a++;   // @note! b = 1，之后 a = 2
    int c = ++a;   // @note! a 先变 3，c = 3

    // @note Java 完整保留了「副作用 + 返回值」的混合语义（与 JS 一致）
    // @note 可读性差，实践里建议单独占一行写 i++;
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'

- featureId: basics/chained-comparison
  equivalence: divergent
  code: |
    int a = 1, b = 2, c = 3;
    // if (a < b < c) {}      // @note! 编译错误：boolean 不能和 int 比较

    if (a < b && b < c) {}     // 必须拆成两个条件

    // @note! 对比 JS：JS 里 1 < 2 < 3 会**静默成立**（先算 1<2 得 true，
    //        再 true<3 换算成 1<3 得 true），Java 则是直接编译错误 —— 更安全
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
