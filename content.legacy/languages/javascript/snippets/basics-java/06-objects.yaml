  - featureId: basics-java/object-equality
    equivalence: divergent
    code: |
      ({ a: 1 }) === ({ a: 1 });      // @note! false —— 比的是引用身份，与 Java 的 == 一致
      const x = { a: 1 }; x === x;    // true

      JSON.stringify({ a: 1 }) === JSON.stringify({ a: 2 - 1 });
      // @note! 能跑通但依赖键的顺序，换个顺序就 false —— 不可靠

      // @note 没有 equals 那种"类自己决定怎么比"的机制：
      // 要按内容比较得自己写递归比较，或者引入库
  - featureId: basics-java/object-json
    equivalence: divergent
    code: |
      JSON.stringify({ a: 1 });              // @note! 语言内置，不需要引依赖
