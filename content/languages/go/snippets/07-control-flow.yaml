- featureId: basics/range-iteration
  equivalence: divergent
  code: |
    for i := 0; i < 5; i++ { }        // @note Go 没有 0..5 这种区间表达式

    for i := range 5 { }               // @note Go 1.22+ 的 range over int：0..4

    for i := 0; i < 10; i += 2 { }     // 步长要自己控制

    // @note! Go 的 range 只用于遍历**既有集合**（或 1.22+ 的整数），
    //        没有「构造一个区间」的表达式 —— 这点与 Rust 的 0..5、Python 的 range(5) 都不同
