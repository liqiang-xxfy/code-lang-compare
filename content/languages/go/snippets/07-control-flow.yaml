- featureId: basics/exception-flow
  equivalence: divergent
  code: |
    f, err := os.Open("f")
    if err != nil {
        return err              // @note 错误靠返回值一层层传 —— 这是 Go 最标志性的风格
    }
    defer f.Close()             // @note defer 等价于 finally，而且更简洁

    // panic 只留给「程序无法继续」的情况
    defer func() {
        if r := recover(); r != nil {
            log.Println("恢复：", r)
        }
    }()

    // @note! 与 JS 的 try/catch 相比：错误是**普通返回值**，
    //        好处是控制流清晰，代价是 if err != nil 会反复出现（Go 代码里最多的三行）
  review:
    state: draft
    provenance:
      origin: llm
      model: workbuddy-agent
      promptTemplateId: p5-add-languages-v1
      generatedAt: '2026-10-01'
