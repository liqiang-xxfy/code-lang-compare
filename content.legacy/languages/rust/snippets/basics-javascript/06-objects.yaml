  - featureId: basics-javascript/object-default
    equivalence: analogous
    code: |
      let mut m: std::collections::HashMap<&str, i32> = std::collections::HashMap::new();

      m.get("a").copied().unwrap_or(0);        // @note 只读默认值
      m.entry("a").or_insert(0);               // @note! 取不到就插入（有副作用）
      *m.entry("count").or_insert(0) += 1;      // @note 计数器的经典写法

      // @note entry API 是 Rust 做「查不到就插入」的正统方式：
      //       它把「查」和「改」合成一次操作，只哈希一次
  - featureId: basics-javascript/object-merge
    equivalence: divergent
    code: |
      use std::collections::HashMap;
      let mut a = HashMap::from([("x", 1)]);
      let b = HashMap::from([("y", 2)]);

      a.extend(b.iter());                      // @note 后者覆盖前者

      let mut c = a.clone();                   // 冲突时求和
      for (k, v) in &b {
          *c.entry(*k).or_insert(0) += v;
      }

      // @note Rust 没有对象展开语法；合并靠 extend 或 entry 循环
  - featureId: basics-javascript/object-nested
    equivalence: divergent
    code: |
      #[derive(Clone)]
      struct Address { city: String }
      struct User { name: String, address: Address }

      let u = User {
          name: "Ada".into(),
          address: Address { city: "成都".into() },
      };

      let u2 = u;              // @note! 这是**移动**：u 之后不可再用
      let u3 = u2.clone();     // @note 想同时保留原值必须显式 clone

      // @note! Rust 里不存在「两个名字指向同一对象」的默认行为 ——
      //        要共享得显式用 Rc / Arc。这正是它没有「浅拷贝陷阱」的原因
  - featureId: basics-javascript/object-comprehension
    equivalence: analogous
    code: |
      use std::collections::{HashMap, HashSet};
      let names = vec!["a", "bb"];

      // @note Rust 把「推导式」实现成迭代器 + collect，能力等价
      let m: HashMap<&str, usize> = names.iter().map(|n| (*n, n.len())).collect();
      let set: HashSet<&str> = names.iter().copied().collect();

      // @note collect() 收集成什么类型，由变量标注（或函数签名）决定 —— 这是 Rust 的惯例
  - featureId: basics-javascript/object-equality
    equivalence: divergent
    code: |
      #[derive(PartialEq, Debug)]
      struct Point { x: i32, y: i32 }

      Point { x: 1, y: 2 } == Point { x: 1, y: 2 };   // true —— @note derive 生成值比较

      // 没有 derive PartialEq 的类型，== 直接编译错误
      #[derive(Debug)]
      struct NoEq(i32);
      // NoEq(1) == NoEq(1);     // 编译错误

      // @note! 与 JS 正好相反：Rust 要求在类型定义处**显式声明**
