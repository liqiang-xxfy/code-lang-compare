  - featureId: basics-python/array-mutate
    equivalence: divergent
    code: |
      // @note! 数组长度固定：增删只能换集合
      int[] a = {1, 2, 3};
      a[0] = 9;                    // 只能改，不能增删

      java.util.List<Integer> xs = new java.util.ArrayList<>(java.util.List.of(1, 2, 3));
      xs.add(4);                   // @note 尾部追加（均摊 O(1)）
      xs.add(0, 4);                // @note! 头部插入 O(n)
      xs.set(0, 9);                // 按**下标**改，对应 Python 的 xs[0] = 9
      xs.remove(1);                // @note! 按**下标**删 —— 想按值删要先装箱：xs.remove(Integer.valueOf(1))
      xs.removeAll(java.util.List.of(2, 3));   // 按值批量删

      // @note 删下标还是删值取决于参数是 int 还是对象，这是 Java 集合的经典歧义
  - featureId: basics-python/array-slice
    equivalence: absent
    code: |
      // @note! 没有切片语法，取子序列只能调方法
      java.util.List<Integer> xs = java.util.List.of(1, 2, 3, 4, 5);

      xs.subList(1, 3);                        // @note! 这是**视图**不是拷贝：改它会写回原列表
      new java.util.ArrayList<>(xs.subList(1, 3));   // 要拷贝得这样包一层

      java.util.Arrays.copyOfRange(new int[]{1, 2, 3, 4, 5}, 1, 3);
      // @note 数组有 copyOfRange，集合有 subList，两套 API、语义还不一致

      // @note! 没有步长，没有负索引，也没有"切片赋值"
    body: |
      Java 没有切片语法。取子序列靠 `subList`（集合）或 `Arrays.copyOfRange`（数组），
      而且两者有一个关键差别：**`subList` 返回的是原列表的视图**，
      对它的修改会写回原列表 —— 而 `copyOfRange` 是真的拷贝。

      从有切片语法的语言迁过来时，"取一段"的直觉是**拷贝**，
      于是 `subList` 的视图语义会静默地改到不该改的地方。

      另外两个缺失：没有步长（要隔项取只能自己循环），没有负索引
      （末尾只能写 `size() - 1`）。
