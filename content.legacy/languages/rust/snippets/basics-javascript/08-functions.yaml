  - featureId: basics-javascript/default-params
    equivalence: absent
    code: |
      fn greet(name: &str) -> String { format!("你好, {name}") }

      fn greet2(name: &str, greeting: Option<&str>) -> String {
          let g = greeting.unwrap_or("你好");
          format!("{g}, {name}")
      }

      greet2("Ada", None);
      greet2("Ada", Some("嗨"));
    body: |
      Rust **没有默认参数**，也**没有函数重载**（不像 Java 那样能靠重载模拟）。

      惯用替代有两条：

      - 用 `Option<T>` + `unwrap_or`，把「可选」写进类型
      - 参数多时用「配置结构体 + `Default` trait」，配合 `..Default::default()` 只写关心的字段
  - featureId: basics-javascript/kwargs
    equivalence: absent
    code: |
      struct GreetOptions<'a> {
          name: &'a str,
          greeting: &'a str,
      }

      fn greet(o: GreetOptions) -> String { format!("{}, {}", o.greeting, o.name) }

      greet(GreetOptions { name: "Ada", greeting: "嗨" });   // @note 调用处自带字段名
    body: |
      Rust **没有关键字参数**，但有一个比它更彻底的方案：**把参数收进结构体**。

      调用处写 `GreetOptions { name: "Ada", greeting: "嗨" }` —— 名字、顺序、
      必填/可选全部在类型里说清楚，而且编译器会检查漏填的字段。

      这也是 Rust 里「函数参数一多就用配置结构体」这一惯例的来源。
  - featureId: basics-javascript/rest-params
    equivalence: absent
    code: |
      fn sum(nums: &[i32]) -> i32 { nums.iter().sum() }

      sum(&[1, 2, 3]);

      // @note 宏可以变参，但那是另一套机制
      println!("{} {}", 1, 2);
    body: |
      Rust 的函数**不支持可变参数**，替代品是**切片**：`fn sum(nums: &[i32])`。

      唯一「看起来是变参」的东西是宏（`println!` 就是），但宏是编译期展开，
      不是函数 —— 所以它不能作为函数值传递。
  - featureId: basics-javascript/return-multiple
    equivalence: analogous
    code: |
      fn min_max(a: &[i32]) -> (i32, i32) {     // @note 用元组返回多个值
          (0, 1)
      }

      let (min, max) = min_max(&[1, 2]);        // @note 调用处直接解构

      // @note! 与 Go 的「原生多返回值」相比，Rust 本质仍是单返回值，
      //        只不过这个值的类型是元组 —— 所以不能像 Go 那样只取其中一个
  - featureId: basics-javascript/lambda-arrow
    equivalence: divergent
    code: |
      let f = |x: i32| x * 2;                   // @note 闭包用 |参数| 而不是 () => 
      let add = |a: i32, b: i32| a + b;

      let mut count = 0;
      let mut inc = || { count += 1; };          // @note! 闭包会**借用**外部变量
      inc();

      // @note! 与 JS 箭头函数的差别：
      //        ① 语法是 |x| 而不是 =>
      //        ② 捕获方式由编译器推断（Fn / FnMut / FnOnce 三个 trait）
      //        ③ 完全没有 this 的坑 —— Rust 没有 this
  - featureId: basics-javascript/function-callback
    equivalence: analogous
    code: |
      fn run<F: Fn(&str)>(cb: F) { cb("hi"); }     // @note 泛型约束接收函数

      run(|s| println!("{s}"));

      fn run2(cb: &dyn Fn(&str)) { cb("hi"); }      // @note 也可以走 trait 对象

      fn make() -> impl Fn(i32) -> i32 { |x| x + 1 }   // @note 返回闭包要写 impl Fn

      // @note! 与 JS 的「随手传函数」接近，但泛型 / trait 对象的选择会写在签名上，
      //        调用方也因此知道有没有额外开销
