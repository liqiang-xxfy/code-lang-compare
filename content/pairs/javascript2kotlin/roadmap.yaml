# 迁移学习路线 —— 按「基准 → 目标语言」分路径
# acceptance 是可勾选项（前端勾选状态存 localStorage）
#
# id 前缀就是这个方向的目录名（javascript2kotlin），后面接序号与短名 ——
# 它只在本文件内唯一，但带上方向前缀之后整份内容里也能一眼看出归属。

- id: javascript2kotlin-1-types-and-null
  order: 1
  title: 静态类型与空安全
  durationHint: 2-3 小时
  todo:
    - 装 JDK 与 Kotlin 命令行（或用 IntelliJ IDEA 建一个 Kotlin 工程）
    - 写一段你熟悉的 JS 逻辑用 Kotlin 重写，体会「可空性写进类型」
    - 重点体会 `==` 与 `===` 的含义与 JS 相反
    - 对照本工具「语言机制」板块里 Kotlin 列的「静态 vs 动态」「空安全」两格
  acceptance:
    - '能说清 Kotlin 的 String 与 String? 的区别，以及 ?. / ?: / !! 各自的语义'
    - 能一眼看出 `==` 在 Kotlin 与 JS 里指的是不同的事
  resources:
    - label: Kotlin 官方文档（中文）
      url: https://book.kotlincn.net/
    - label: Kotlin 官方文档（英文）
      url: https://kotlinlang.org/docs/home.html

- id: javascript2kotlin-2-basics
  order: 2
  title: 基础表达逐条对照
  durationHint: 1-2 天
  todo:
    - 过一遍 val / var、字符串模板、区间、when、for 的写法
    - 把 vararg 与 JS 的 rest 参数对照写一遍，注意它是数组
    - 用表达式体与块体各写几个函数，注意返回类型的规则
    - 对照本工具「基础表达」板块里 Kotlin 列的写法差异
  acceptance:
    - 能独立写出变量、容器、控制流、函数定义，无语法错误
    - 能说清 val 与「不可变」的关系（只锁引用）
  resources:
    - label: Kotlin 官方文档 · 基础语法
      url: https://kotlinlang.org/docs/basic-syntax.html

- id: javascript2kotlin-3-classes
  order: 3
  title: 类与对象模型
  durationHint: 3-5 天
  todo:
    - 写几个类，体会默认 final、要 open 才能继承
    - 用 companion object / object / 顶层函数替代 JS 的 static 与模块顶层
    - 搞清构造参数带不带 val / var 的区别（不带就不是属性）
    - 试试 data class 与解构，对比 JS 的对象字面量
  acceptance:
    - 能说清 Kotlin 的默认 final 与 JS 默认开放的设计取舍
    - 能用伴生对象与顶层函数组织静态逻辑，而不是硬找 static
  resources:
    - label: Kotlin 官方文档 · 类与对象
      url: https://kotlinlang.org/docs/classes.html

- id: javascript2kotlin-4-coroutines
  order: 4
  title: 协程与并发
  durationHint: 3-5 天
  todo:
    - 把一段 Promise 链改写成 suspend 函数加协程构建器
    - 验证「协程默认不并行」：在 runBlocking 里 launch 几个任务看执行顺序
    - 用 Dispatchers.Default 显式并行，感受它与继承调度器的差别
    - 理解结构化并发：子协程失败会取消父作用域
  acceptance:
    - 能说清协程与 Promise 的异同，尤其是结构化并发这一点
    - 知道什么时候要显式指定调度器，什么时候默认就够
  resources:
    - label: Kotlin 官方文档 · 协程
      url: https://kotlinlang.org/docs/coroutines-guide.html

- id: javascript2kotlin-5-engineering
  order: 5
  title: 工程化收口
  durationHint: 1 周
  todo:
    - 用 Gradle 管一个 Kotlin 工程，理解它与 npm 的差别
    - 配 detekt 或 ktlint，体会 Kotlin 社区的工具链
    - 用 JUnit 写测试，注意类默认 final 对测试替身的影响
    - 对照本工具「工程实践」板块里 Kotlin 列的工具链
  acceptance:
    - 能独立搭起一个带依赖管理、lint、测试的 Kotlin 工程
    - 能说清 Gradle 的构建生命周期与 npm scripts 的差别
  resources:
    - label: Gradle 官方文档
      url: https://docs.gradle.org/current/userguide/userguide.html
    - label: Kotlin 官方文档
      url: https://kotlinlang.org/docs/home.html
