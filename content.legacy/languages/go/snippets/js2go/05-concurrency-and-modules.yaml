      // @note 依赖下载到全局缓存，没有 node_modules 那种项目内目录
  - featureId: js2go/concurrency-exercise
    equivalence: analogous
    code: |
      type cache struct {
          mu sync.Mutex
          m  map[int]int
      }

      func (c *cache) get(k int) int {
          c.mu.Lock()
          defer c.mu.Unlock()                  // @note! 紧跟 Lock 写，作用域一眼可见
          if v, ok := c.m[k]; ok {
              return v
          }
          v := compute(k)
          c.m[k] = v
          return v
      }

      // @note! 三问的答案：
      // 1. 锁的写法就是上面这样；通道的写法是把缓存本身做成一个 goroutine，
      //    通过请求/响应通道访问它（"用一个 owner goroutine 串行化所有访问"）
      // 2. 分界大致是：高频短临界区用锁（开销小、直观）；
      //    有明确的数据流转、或者要表达"所有权转移"时用通道
      // 3. race detector 只报**实际发生过**的竞争 —— 没跑到的路径它看不出来，
      //    所以它不能替代设计上的正确性
      // @note! 不加锁直接并发写同一个 map 会 panic（concurrent map writes），
      // 而且编译器一句话都不说 —— JS 里同样这段代码不会坏，因为那边没有真并行
