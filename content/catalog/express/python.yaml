# Python 视角下的「基础表达」章节分组 —— **与 javascript.yaml 刻意不同**。
#
# 这份文件就是本架构的演示案例，三处差异都是有意的：
#   1. `hoisting` 被**取舍掉**了 —— Python 没有变量提升，以 Python 为参照系时
#      这一行根本不该出现（它只在 JS 基准下作为一个「对方有、我方没有」的行出现）
#   2. `equality` 从 JS 的「运算符与相等」章挪到了「值与类型」章 —— 同一个知识点，
#      两种语言的心智模型把它归在不同的地方
#   3. 章节名与分组都换了说法：变量与提升 / 运算符 / 控制流 → 名称与绑定 / 值与类型 / 流程与迭代
#
# 而这三处差异**没有让任何一格内容多写一遍** —— boxes 仍在
# content/languages/python/express/<group>.yaml 里，按存放组（group）而不是按章存放。

section: express
baseline: python

chapters:
  - id: names
    title: 名称、绑定与可变性
    summary: 赋值即绑定，名字与值的关系
    features: [declaration, mutability, scope, shadowing]

  - id: values
    title: 值与类型
    summary: 字面量、类型与相等判定
    features: [literals, type-inference, type-conversion, null-and-undefined, equality]

  - id: operators
    title: 运算符与重载
    summary: 算术、逻辑与自定义类型的运算符
    features: [arithmetic, logical, operator-overloading]

  - id: flow
    title: 流程与迭代
    summary: 分支、循环与可迭代对象
    features: [conditionals, loops, iteration-protocol, switch-and-match]

  - id: functions
    title: 函数与闭包
    summary: 定义、传参、返回与闭包
    features: [function-declaration, parameters, variadic, return-values, closures]

  - id: sequences
    title: 字符串与序列
    summary: 字符串操作、列表与字典
    features: [string-literals, string-common-ops, arrays, maps]
