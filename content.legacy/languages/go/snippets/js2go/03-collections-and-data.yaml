    code: |
      xs := []int{1, 2, 3}
      append(xs, 4)                // @note! 编译错误：返回值被丢弃
      xs = append(xs, 4)           // @note 必须接住 —— 容量不够时会分配新数组

      xs[0]                        // @note 越界 panic（不是 undefined）
      len(xs)
