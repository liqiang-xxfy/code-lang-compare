# 速语词典 —— 从 Java 出发最容易误解的术语
# 只讲这一个方向的两门语言（R5 会拦第三门）

- term: 重载
  aliases: [overload]
  perLanguage:
    java: 编译期按参数列表选同名方法，是最常用的"默认参数"替代方案
    python: 不存在 —— 后定义的同名函数直接覆盖前一个，没有警告
  note: 从 Java 到 Python 时，靠重载堆出来的 API 必须重新设计签名，不能逐个搬。

- term: 接口
  aliases: [interface, protocol, abc]
  perLanguage:
    java: 名义式 —— 必须显式 implements，编译期检查是否满足契约
    python: 靠 Protocol（结构化，无需声明）或 ABC（名义式，需要继承）；前者不检查，只给工具看
  note: Java 的接口是强制的契约，Python 的 Protocol 更像"事后描出来的形状"。

- term: 泛型
  aliases: [generic, type parameter]
  perLanguage:
    java: 编译期检查，运行期擦除；`List<String>` 与 `List<Integer>` 运行时是同一个类
    python: 类型参数只存在于注解里，运行时不检查也不擦除（因为本来就不存在）
  note: 两边运行期都拿不到类型参数，但 Java 至少编译期会拦你。

- term: 包 / 模块
  aliases: [package, module, import]
  perLanguage:
    java: package 是命名空间，目录结构必须与包名一致；import 只影响书写
    python: module 是一个 .py 文件，package 是含 `__init__.py` 的目录；import 真的会执行模块代码
  note: 「导入会执行代码」是 Python 独有的一点，Java 的 import 纯粹是名字解析。

- term: final
  aliases: [final, const, immutable]
  perLanguage:
    java: 冻结绑定；对象内容可变，不可变要靠类型设计（List.of / record）
    python: 没有对应关键字，全大写命名只是约定；不可变靠选用不可变类型（tuple / frozenset）
  note: 两边都容易被误读成"内容不可变"，实际都只管绑定。
