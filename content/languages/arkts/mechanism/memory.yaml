# arkts —— mechanism / memory
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/mechanism/features.yaml 里 `group: memory` 的那批：
# value-vs-reference / garbage-collection / ownership-borrow / lifetime / weak-reference。
#
# ArkTS 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 ArkTS 与那个基准两门语言（R25）—— 包括**缩写**，
# 「TS」这类简称同样会被检测成屏幕外的语言，泛指时写「语法相近的那门静态方言」。
#
# 口径说明：这一组有两处措辞必须按官方原文来 ——
# ① 分类用的是**「基本数据类型」与「引用类型」**，官方**没有**把它们叫「值类型」；
# ② GC 那一格可以放心写「不用引用计数」，因为官方文档**明说了**这一点，
#    连理由（引用计数会因循环引用而漏）都写了 —— 这是全组信息量最大的一处。
# 弱引用那一格没有官方依据（既不在禁用清单里，也没有可用说明），
# 只写「文档没给」，不要断言有或没有。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: mechanism-memory-v1
    generatedAt: '2026-10-03'

boxes:
  value-vs-reference:
    code: |
      // 基本数据类型（number、string 这类简单类型）：存取都是直接的，比较时直接比值
      let a: number = 1;
      let b: number = a;
      b = 2;                          // @note a 仍是 1
      console.info(`${a}`);

      // 引用类型（对象、数组、函数）：通过指针访问，改引用会影响原始数据
      let o1: Record<string, number> = { n: 1 };
      let o2: Record<string, number> = o1;
      o2.n = 9;                       // @note o1 那边也变成 9

      // ArkTS 没有让用户自定义「基本数据类型」的办法：
      // struct 只在 ArkUI 的自定义组件里使用，不是一种类型
    vs:
      javascript: |
        赋值语义两边是一样的：基本数据类型按值、对象按引用 —— 这一格没有差别。
        官方还把这套划分写进了文档（「存储和访问都是直接的」「通过指针访问」），
        所以在 JavaScript 里靠经验记的东西，这里可以查到出处。
        真正缺的是**自定义值语义**：想把一组数据定义成「赋值即复制」的类型
        做不到 —— 语言里只有内置的那几种基本数据类型，其余都是引用，
        要独立副本只能手动复制。
      python: |
        分界线的划法不同，这是最容易踩的一处。Python 看**可变性**
        （不可变的看不出共享、可变的共享），这里看**类型种类**
        （基本数据类型按值、其余按引用）。
        于是同一行赋值两边要按不同线索去判断，而且这里的对象和集合
        默认就是共享的，与那边的可变对象一致 —— 想断开共享得显式复制。
      java: |
        两边的划分方式最接近：都是「基本类型按值、对象按引用」，逐条对得上。
        两处差别值得记：一是**种类的多少** —— Java 的基本类型有一整套，
        「该用哪个」是天天要做的决定，这里的简单类型只有少数几种；
        二是**字符串落在哪一边**：Java 的字符串是对象，
        这里的 `string` 属于基本数据类型，同一个值在两边的分类不同。
    equivalence:
      javascript: identical
      python: divergent
      java: analogous

  garbage-collection:
    code: |
      class Node {
        next: Node | null = null;
      }

      function makeCycle(): void {
        const a = new Node();
        const b = new Node();
        a.next = b;
        b.next = a;             // @note 互相指着，成环
      }                         // @note 函数返回后两个节点都不可达 —— 环被一起收走

      // 官方明确说了：运行时用的是 **tracing GC**，不用引用计数，
      // 理由正是「引用计数会因循环引用而漏」—— 所以在这里，
      // 「互相引用的两个对象」根本不是需要处理的问题。

      // 分代：新对象进年轻代，活过一轮进老年代；堆另有一档默认上限，
      // 主线程与 worker 线程的上限不同，超了就是内存不足。
    vs:
      javascript: |
        两边的底层思路相同（可达性分析），也都不承诺回收时机。
        差别在**有没有说明**：这里的官方文档把设计选择写出来了 ——
        用 tracing 不用引用计数、为什么不用、分代怎么分、堆上限大概多少；
        在 JavaScript 那边这套东西基本是不解释的。
        所以同一件「什么时候被回收」的事，一边能查到理由，一边只能接受它是黑盒。
      python: |
        机制正好相反，这是这一格最值得记的。Python 以**引用计数**为主，
        环要靠分代收集器另外兜底；这里一开始就不用引用计数，
        官方给的理由就是环会让计数漏掉对象。
        于是「循环引用要不要专门处理」两边答案不同：那边需要知道有这回事，
        这边连想都不用想 —— tracing 的可达性分析本来就把整个环一起看。
      java: |
        两边都是可达性分析的 GC，都能回收循环引用，也都不承诺时机 ——
        这一格最接近。差别在**能调多少**：Java 能选收集器、能设堆上限，
        调优是运维的常规课题；这里官方文档给的是默认值与分代策略的说明，
        留给自己拧的旋钮少得多，遇到内存问题主要靠改写法而不是调参数。
    equivalence:
      javascript: analogous
      python: divergent
      java: analogous

  ownership-borrow:
    absent: true
    vs:
      javascript: |
        ArkTS **没有所有权与借用** —— 与 JavaScript 一样：
        一个对象可以被任意多个引用同时指着，谁改都合法，编译器不做别名追踪。
        能写出来的最接近的东西是编译期的只读标注，它挡的是属性写入，
        与「这块数据归谁」没有关系，运行期更没有任何检查。
        所以「谁负责保证这块数据不被别人改」在这里是设计约定，不是语言能表达的约束。
      python: |
        ArkTS **没有所有权与借用** —— 与 Python 一样，名字只是指向对象，
        可以被任意复制、任意共享，没有谁「拥有」它。
        差别在一处操作：Python 的 `del` 在这里没有对应物，
        而它本来也不等于释放对象 —— 两边都由 GC 决定生死。
        于是「引用会不会失效」这类问题在两边都不存在，
        「谁该负责」也就没有语言层面的答案。
      java: |
        ArkTS **没有所有权与借用** —— 与 Java 一样靠 GC，
        没有编译期的别名检查，也没有能表达「转移所有权」的语法。
        差别在**资源**这一侧：Java 把资源的释放写进了类型
        （实现指定接口的对象可以在专门的语法块里自动释放，编译器保证不漏）；
        这里没有这一层，资源的释放靠显式调用或约定的时机 ——
        内存归 GC、资源也归约定，两边都没有语言级的归属表达。
    equivalence:
      javascript: identical
      python: identical
      java: identical

  lifetime:
    absent: true
    vs:
      javascript: |
        ArkTS **没有引用生命周期这回事** —— 与 JavaScript 一样：
        只要还能顺着引用找到对象，它就不会被回收，引用不可能悬垂，
        所以「这个引用能不能活到那一步」不是编译器要问的问题，
        也没有任何标注可以写。
        这里能写出来的「有效期」都属于别的东西（组件、页面），
        不是引用的有效期 —— 两者不要混为一谈。
      python: |
        ArkTS **没有生命周期标注** —— 与 Python 一样，对象由 GC 保活，
        引用不会失效。两边也都没有把「资源什么时候释放」写进语法的办法：
        Python 至少还有能保证块结束时释放的语句，这里连那个都没有，
        资源的释放只能显式调用。
        所以「有效期」这个词在这里只剩一个意思：对象还要不要用。
      java: |
        ArkTS **没有生命周期标注** —— 与 Java 一样，GC 保证引用有效。
        Java 里最接近的关切是「对象会不会被提前回收」（弱引用配引用队列），
        这里官方文档没有给出对应的工具（见「弱引用」那一格）。
        资源那一侧也是：Java 有专门的语法块保证释放，这里没有 ——
        想不漏，只能靠代码约定与审查。
    equivalence:
      javascript: identical
      python: identical
      java: identical

  weak-reference:
    code: |
      // 循环引用在这里不是问题（见「垃圾回收」那一格：
      // tracing GC 会把不可达的环整块收走），
      // 所以「用弱引用打破循环」这个常见动机在这里不存在。

      // 而弱引用这套工具本身：官方文档**没有把它列为可用能力** ——
      // 既不在禁用清单里，也没有给出可用说明。
      // 需要「不阻止回收的元数据」时，只能自己在数据结构里记录、
      // 在合适的时机清理，而不是交给运行时。
    vs:
      javascript: |
        JavaScript 那一侧有整套工具（弱集合、弱引用、清理回调），
        用途有限但明确：缓存、观察者、不阻止回收的元数据。
        这里的官方文档没有给出对应的能力说明 —— 这一格能确定的是
        **动机消失了**：那边用弱引用最常见的场合是「不想让缓存拖住对象」，
        而这里如果只是担心循环引用，本来就不用担心。
      python: |
        Python 的弱引用是显式模块，而且在那边有明确的用武之地 ——
        以引用计数为主的方案里，环是必须专门处理的，
        弱引用是打断环的常用手段之一。
        这里的运行时不用引用计数，官方给的理由就是环会让计数漏掉对象，
        于是那边「用弱引用打断环」这个典型场景在这里不存在；
        至于弱引用本身，官方文档没有给出可用说明。
      java: |
        Java 把引用分成好几档（强、软、弱、虚）还配引用队列，
        缓存淘汰能让运行时替你决定，弱引用的典型用途是缓存与观察者。
        这里官方文档没有给出这一层 —— 缓存要自己做淘汰策略。
        相同的是两边都不靠引用计数：循环引用在两边都不是泄漏，
        也都不承诺回收时机，所以「回收时顺便做点事」在两边都不能当逻辑用。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
