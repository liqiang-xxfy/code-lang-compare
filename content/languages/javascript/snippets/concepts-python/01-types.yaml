snippets:
  - featureId: concepts-python/type-system
    equivalence: divergent
    code: |
      1 == "1"      // @note! true —— == 会做隐式转换，Python 里这是 False
      1 + "1"       // @note! 得 "11" —— 字符串拼接，不是抛 TypeError
      "3" * "2"     // @note 得 6 —— 字符串被当成数字
    body: |
      **动态 + 弱类型** —— 同样是运行时类型，但比较与算术都会隐式转换。

      最大的变化不是写法，而是**错误的形态**：同样的问题在这里常常是「结果不对
      但全程不报错」，得回头找是哪一步悄悄换了类型 —— 「看异常猜位置」的调试
      直觉会先失效一段时间。能收回一半的手段是 `===`（不做隐式转换）：
      语言不拦你，靠规范约定。

  - featureId: concepts-python/numeric-type
    equivalence: divergent
    code: |
      9007199254740993     // @note! 变成 ...992 —— 超出安全整数范围静默丢精度
      7 / 2                // 3.5 —— 真除法与 Python 一致
      // @note 没有整除运算符，7 // 2 要写 Math.floor(7 / 2)
    body: |
      **number（统一 float64）+ BigInt** —— 整数也是浮点，超范围静默丢精度，
      而且不报错。大整数与精确十进制在这里也有（`BigInt`、第三方 decimal 库），
      只是**都不是默认** —— 而默认行为才是迁移时最常踩的地方。

  - featureId: concepts-python/null-value
    equivalence: divergent
    code: |
      let x;
      x === null           // @note! false —— 只挡住 null，漏掉 undefined
      x == null            // @note 惯用写法：一次挡掉两种空值
    body: |
      **null + undefined** —— 两种空值，绝大多数判空其实两者都要挡，于是有一整套
      专门写法：`== null` 同时匹配两者、可选链 `?.`、空值合并 `??`。

      最容易写错的一格是把 `x is None` 直译成 `x === null`：它会漏掉所有
      `undefined`，而 `undefined` 出现的频率比 `null` 高得多（没传参、没赋值的
      变量、访问不存在的属性都是它）。顺带一提，`||` 兜底有和 `or` 同样的坑 ——
      `0`、`""`、`NaN` 都是假值，挡空值要用 `??`。

  - featureId: concepts-python/value-semantics
    equivalence: analogous
    code: |
      const a = { n: 1 };
      const b = a;
      b.n = 2;
      a.n                  // @note 2 —— 对象与 Python 的可变对象一样共享
      let s = "x";         // @note 原始值不可变，对应 Python 的不可变对象
    body: |
      **原始值按值、对象按引用** —— 与 Python 结论一致。对应关系是：JS 的**对象**
      等于 Python 的可变对象，JS 的**原始值**（number / string / boolean / null /
      undefined / symbol）等于 Python 的不可变对象。

      差别在补集：这里没有 `tuple` / `frozenset` 那种「不可变又复合」的类型 ——
      `Object.freeze` 只是浅的运行时冻结，也不是类型属性，于是「我需要一个能安全
      共享的集合类型」这个表达也一并失去。
