# rust —— express / strings
#
# 文件名是**存放组**（group），不是展示章。boxes 的 key 必须是
# catalog/express/features.yaml 里 `group: strings` 的那批。
#
# Rust 不是基准候选，**没有 baseline 字段**，三份 vs 必须写全（R22）；
# vs.<基准> 里只能出现 Rust 与那个基准两门语言（R25）。

review:
  state: draft
  provenance:
    origin: llm
    model: deepseek-v4.1-flash
    promptTemplateId: express-strings-v1
    generatedAt: '2026-10-03'

boxes:
  string-literals:
    code: |
      let borrowed = "hello";                 // @note &str —— 借用，不可变，指向程序里的一段常量
      let owned = String::from("hello");      // @note String —— 拥有所有权，可以增长
      let raw = r#"路径 C:\Users\ 不用转义"#;   // @note 原始字符串
      let bytes = b"abc";                     // @note 字节串，类型是 &[u8; 3]

      let name = "Ada";
      let msg = format!("你好，{}！", name);    // @note! 没有字符串插值，用 format! 宏
    vs:
      javascript: |
        JavaScript 只有一种字符串类型；Rust 有**两种**：`&str` 是借来的视图、
        `String` 是拥有所有权的可增长缓冲。函数参数通常收 `&str`（调用方传
        `&owned` 或字面量都行），要返回新字符串就用 `String`。
        另一个直接差别：JavaScript 有模板字符串 `` `${name}` ``，
        Rust **没有插值**，一律走 `format!` 宏。
      python: |
        Python 有 f-string，Rust 没有插值，只能用 `format!` 宏。
        Rust 还把字符串分成 `&str`（借用）与 `String`（拥有）两种类型，
        并区分 `"abc"`（UTF-8 文本）与 `b"abc"`（字节串）——
        Python 里 `str` 与 `bytes` 确实也是两种类型，这一点两边相通；
        差别在 Rust 的两种字符串类型是为了所有权，不是为了编码。
      java: |
        Java 的 `String` 与 Rust 的 `&str` 都是不可变的文本视图，
        但 Java 没有「借用」这层 —— `String` 是个普通对象，由 GC 管理，
        谁都能持有。Rust 的 `&str` 带生命周期，借用检查器会保证它指向的
        数据活得够久。可变的文本缓冲两边都有：Java 是 `StringBuilder`，
        Rust 是 `String`（`push_str` 就地增长）。
    equivalence:
      javascript: divergent
      python: analogous
      java: analogous

  string-common-ops:
    code: |
      let s = String::from("hello");
      let joined = s.clone() + " world";       // @note! + 会消耗左边，得先 clone
      let built = format!("{}-{}", a, b);      // @note 更常用的拼接方式

      let n = s.len();                          // @note! 字节数，不是字符数
      let chars = s.chars().count();            // @note 字符（码点）数
      let up = s.to_uppercase();                // @note 返回新 String，原地类型没有 toUpperCase

      // let c = s[0];                          // @note! 编译错误：不能用下标取字符
      let first = s.chars().next().unwrap();    // @note 要取字符走 chars()
      // let part = &s[0..1];                   // @note! 若切在字符中间会 panic

      for part in "a,b,c".split(',') { }        // @note 返回迭代器，不是数组
      let trimmed = "  hi  ".trim();
    vs:
      javascript: |
        JavaScript 的 `s[0]` 与 `s.length` 直接可用，且 `length` 是
        UTF-16 码元数；Rust **不能用下标取字符** —— `s.len()` 是字**节**数，
        取字符要 `s.chars().next()`，切片切在字符中间会 panic。
        这是因为 Rust 的字符串是 UTF-8 字节序列，索引会落到半个字符上，
        所以语言干脆禁止。拼接上 `+` 会消耗左边的值，通常改用 `format!`。
      python: |
        Python 的 `s[0]`、`len(s)`、`s.upper()` 都直接可用，`len` 数的是字符；
        Rust 的下标取字符**编译不过**，`s.len()` 数的是字节，
        字符数要 `s.chars().count()`。原因是编码策略不同：
        Python 的 `str` 是码点序列，Rust 的 `String` 是 UTF-8 字节。
        方法上 Rust 返回新 `String` 而不是原地修改，因为字符串本身不可变。
      java: |
        Java 的 `s.length()` 数的是 UTF-16 码元，`charAt(0)` 取的是一个码元 ——
        对 emoji 这类字符会得到半个代理对；Rust 直接禁止下标访问，
        逼你走 `chars()` 拿真正的码点，出错机会更少。
        拼接上 Java 的 `+` 编译期会优化成 `StringBuilder`，
        Rust 的 `+` 会**消耗左侧变量**，所以循环里累加要用 `push_str` 或 `format!`。
    equivalence:
      javascript: divergent
      python: divergent
      java: divergent
