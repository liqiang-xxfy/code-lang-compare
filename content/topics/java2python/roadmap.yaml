# 迁移学习路线 —— Java → Python

- id: java2py-1-mental-model
  order: 1
  title: 先接受「编译器不再兜底」
  durationHint: 2-3 小时
  todo:
    - 列出 Java 编译期能拦住、Python 只能在运行时发现的四类错误：类型不匹配、拼错参数名、返回类型不符、未初始化
    - 通读基础语法板块里变量那一章，把「块级作用域」这条直觉标记为必须丢掉
    - 明确写下哪些 Java 直觉要重写：== 与 equals、块作用域、final 的含义
  acceptance:
    - 能说出 Python 里 `is` 与 `==` 的分工，以及为什么不能拿 `is` 比值
    - 知道 Python 没有编译期检查，因此测试与类型标注的地位更高
  resources:
    - label: Python 官方教程（中文）
      url: https://docs.python.org/zh-cn/3/tutorial/

- id: java2py-2-functions
  order: 2
  title: 重写函数与参数这一层
  durationHint: 1-2 天
  todo:
    - 读《函数与参数传递》一章，把重载改写成默认参数、把具名构造改写成关键字参数
    - 亲手写一次可变默认参数的坑，确认自己记住了要拿 None 当哨兵
    - 练习用 `*args` / `**kwargs` 写一个转发函数
  acceptance:
    - 能一眼看出签名里 `def f(x=[])` 的问题
    - 能解释为什么拼错的关键字参数在 Python 里不报错
  resources:
    - label: PEP 8 风格指南
      url: https://peps.python.org/pep-0008/

- id: java2py-3-tooling
  order: 3
  title: 换一套工具链
  durationHint: 1 周
  todo:
    - 用 venv + pip 建好隔离环境，把 Maven 的依赖声明映射到 requirements 或 pyproject
    - 挑一个 Maven 项目改写成 Python，体会「没有编译步骤」带来的反馈速度变化
    - 把常用的静态检查（ruff / mypy）接进编辑器，用工具补回一部分编译期检查
  acceptance:
    - 能独立创建虚拟环境并锁定依赖版本
    - 能配置 mypy 并让它拦住一处类型错误
  resources:
    - label: Python 打包用户指南
      url: https://packaging.python.org/
