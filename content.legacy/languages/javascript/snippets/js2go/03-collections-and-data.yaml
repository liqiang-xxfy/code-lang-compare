      const m = new Map();
      m.set("a", 1);
      m.get("a");                  // 1
      m.get("z");                  // @note! undefined —— 与"值是 undefined"分不出来
      m.has("z");                  // @note 判存在要另查一次

      const o = {};
      o.z;                         // @note undefined

      (m.get("k") ?? m.set("k", []).get("k")).push("v");   // @note 累积要这样写
      m.set("k", (m.get("k") ?? 0) + 1);                   // 计数

