      function minMax(xs) {
        return [Math.min(...xs), Math.max(...xs)];   // @note 显式建数组
      }

      const [lo, hi] = minMax(xs);            // @note 解构接收
      const pair = minMax(xs);                // [1, 9]
      const [first, ...rest] = minMax(xs);

      // @note! 必须先构造一个容器再返回，不像 Python 的 return a, b 那样由逗号直接成元组
      // @note 数量不匹配时不会报错：多出来的解构变量是 undefined
