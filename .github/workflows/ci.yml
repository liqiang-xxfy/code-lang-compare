name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 内容契约与质量闸门：有 error 级问题就阻断，避免不合格内容进主干
      - run: npm run content:validate

      - run: npm run typecheck

      - run: npm test

      # 「新增语言 = 只加数据目录」这句承诺的可执行断言
      - run: npm run verify:ext

      # 「新增板块 = 只加 sections 声明 + 内容目录」这句承诺的可执行断言
      - run: npm run verify:sections

      # 内容编译产物能否生成（顺带覆盖 schema 与 @note 抽取）
      - run: npm run content:build

      # 完整构建：dirStyle、预渲染验收（空壳预渲染在这里失败）、404.html 只在
      # finalize-dist 里暴露 —— 不跑这一遍，本地不完整跑一次 build 就发现不了。
      # 不设 PC_SITE_URL 即跳过 sitemap，符合预期：它不入库，只在部署时产出。
      - run: npm run build
