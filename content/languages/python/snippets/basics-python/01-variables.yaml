snippets:
  - featureId: basics-python/var-declaration
    equivalence: identical
    code: |
      count = 0            # @note 赋值即声明，没有关键字
      name = "Ada"
      count = "now a string"   # @note 名字可以改绑到完全不同的类型上
    body: |
      Python 里**不存在"声明"这个动作**：`count = 0` 既是把名字 `count` 绑定到一个新对象上，
      也是这个词法的全部形式。没有类型标注语句（`x: int = 0` 是注解，解释器不强制），
      没有 `let` / `const` / `var`，也没有 Java 那种「先声明后赋值」的两步。

      从 Python 出发看别的语言，最容易低估的就是这一点：JS 与 Java 的
      「声明」同时在做两件事 —— 引入名字、并限制这个名字能不能被重新赋值和在哪里可见。
      Python 只有前者。
  - featureId: basics-python/var-scope
    equivalence: identical
    code: |
      for i in range(3):
          pass
      print(i)             # @note! 2 —— 块不产生作用域，循环变量留在函数作用域里

      if True:
          inside = 1
      print(inside)        # @note! 1
    body: |
      Python 的作用域单元只有**模块、函数、类**三种，`if` / `for` / `while` / `with`
      的缩进块**不构成作用域**。所以：

      ```python
      for i in range(3):
          pass
      print(i)   # 2 —— 循环变量在循环结束后依然存在
      ```

      这是从 Python 出发最容易「反向踩坑」的地方：JS 的 `let` 是块级的，
      Java 的局部变量也是块级的。同一段缩进结构在三门语言里的可见范围完全不同。
  - featureId: basics-python/hoisting
    equivalence: identical
    code: |
      print(v)             # @note! NameError —— 没有提升
      v = 1

      def bump():
          print(total)     # @note! UnboundLocalError：下面有赋值，于是整个函数里 total 都是局部的
          total = 1
    body: |
      Python 在执行函数体之前会先扫一遍**局部名字**（这让 `global` / `nonlocal` 有确定语义），
      但不会像 JS 的 `var` 那样把名字提前初始化为 `undefined`，
      也不会像 Java 那样给字段填默认值。访问一个还没绑定的名字一律是 `NameError`。

      值得记住的副作用：因为名字在**整个函数体内**都算局部，
      在函数末尾才赋值的名字，在函数开头读它是 `UnboundLocalError` 而不是读到外层的同名变量。
      这条规则是 Python 独有的，迁移时最容易被误诊成"作用域没生效"。
  - featureId: basics-python/const-immutability
    equivalence: identical
    code: |
      MAX_RETRY = 3        # @note 全大写只是约定，解释器不会阻止重新赋值
      MAX_RETRY = 5        # 合法，不报警

      POINT = (1, 2)       # @note 真正不可变靠类型：tuple / frozenset / str
      COLORS = ["red"]     # 可变，谁都能 append
    body: |
      Python **没有 `const`**。全大写命名（`MAX_RETRY`）只是社区约定，解释器不会阻止重新赋值。

      真正不可变的是**对象本身**：`int` / `str` / `tuple` / `frozenset` 不可变，
      `list` / `dict` / `set` 可变。所以 Python 的"常量"策略是：
      选一个不可变类型放进去（比如用 `tuple` 而不是 `list`），而不是给名字加一个修饰符。

      对照来看，JS 的 `const` 冻结的是**绑定**而不是对象（想冻结对象要 `Object.freeze`），
      Java 的 `final` 冻结绑定、字段内容仍可变 —— 三者都容易被误读成"内容不可变"。
  - featureId: basics-python/naming-convention
    equivalence: identical
    code: |
      max_retry_count = 3     # @note 变量 snake_case（PEP 8）
      class HttpClient: ...   # 类 PascalCase
      MAX_RETRY_COUNT = 3     # 常量 SCREAMING_SNAKE_CASE
      _internal = 1           # @note 前导下划线表示非公开，且有实际语义（from x import * 会跳过）
    body: |
      唯一一处「纯风格、无语义」的差异，但迁移时满屏的命名不一致会显著增加阅读阻力。
      Python 用 `snake_case`（PEP 8），JS / Java 用 `camelCase`；
      类名三者都是 `PascalCase`，常量三者都习惯 `SCREAMING_SNAKE_CASE`。

      唯一带语义的一条：Python 用前导下划线表示「非公开」（`_internal`），
      而 JS / Java 没有对应的语言级约定，只能靠文档。
  - featureId: basics-python/var-destructuring
    equivalence: identical
    code: |
      first, *rest = [1, 2, 3]      # @note 星号收集剩余项
      a, b = pair                   # 任意可迭代对象都能解包
      d = {"name": "Ada"}
      d["name"]                     # @note! 没有按键解构，只能显式取值
    body: |
      Python 的 `a, b = pair` 是对**任意可迭代对象**解包，并且支持星号收集剩余项：

      ```python
      first, *rest = [1, 2, 3]      # first=1, rest=[2, 3]
      ```

      这一层 Python 比 JS 强 —— JS 的数组解构必须显式标注剩余项 `[first, ...rest]`，
      而且只能作用在可迭代对象上（不能作用于普通对象）。

      反过来，Python **没有按键解构**：JS 的 `const { name } = user` 在 Python 里
      只能写 `user["name"]` 或 `user.get("name")`。想按名字取值就得显式查字典。
  - featureId: basics-python/var-multiple-assign
    equivalence: identical
    code: |
      a, b = 1, 2
      a, b = b, a          # @note 先构造右侧元组再解包，不需要临时变量

      x = y = []           # @note! 两个名字指向同一个列表，改一个另一个也变
    body: |
      Python 的 `a, b = b, a` 一行交换，语义是**先构造右侧元组、再逐项绑定**，
      因此不会出现中间态。JS 要用数组解构 `[a, b] = [b, a]` 才能达到同样效果，
      Java 则必须借助临时变量。

      另一个容易混淆的点是链式赋值：`a = b = 0` 在 Python 与 JS 里都合法，
      但都是「先把 0 绑定给 b，再把 b 的值绑定给 a」——
      当右侧是**可变对象**时（`a = b = []`），两个名字指向同一个对象，
      改其中一个另一个也会变。
  - featureId: basics-python/var-global-declaration
    equivalence: identical
    code: |
      counter = 0

      def bump():
          global counter   # @note! 不写这行就是创建一个局部变量，外面不变，且不报错
          counter += 1

      def outer():
          n = 0
          def inner():
              nonlocal n   # @note 改外层函数变量用 nonlocal
              n += 1
    body: |
      Python 的规则是：**函数体内只要有对某个名字的赋值，这个名字就整个函数内都是局部的**。
      所以「读取模块级变量」不需要任何声明，而「修改它」必须写 `global`；
      修改外层函数的变量要写 `nonlocal`。

      ```python
      counter = 0

      def bump():
          global counter
          counter += 1
      ```

      这条「必须声明意图」的设计能挡掉大量意外覆盖，但也意味着逐行翻译 JS 代码时，
      原本能跑的代码在 Python 里会静默变成「改了个局部变量，外面没变」——
      不报错，只是没生效。
  - featureId: basics-python/var-shadowing
    equivalence: identical
    code: |
      list = [1, 2]        # @note! 盖掉内置函数，之后本模块所有 list(...) 都会 TypeError
      id = 1               # @note! 同理

      name = "outer"
      if True:
          name = "inner"   # @note 这不是遮蔽：块没有作用域，改的就是同一个 name
    body: |
      Python 允许遮蔽任何外层名字，但因为**块不产生作用域**，在 `if` 里重复赋值
      并不是遮蔽 —— 它就是改同一个名字。

      真正的坑是**遮蔽内置名**：`list = [1, 2]`、`id = 1`、`str = "x"`
      会把内置函数盖掉，之后同一模块里所有 `list(...)` 都会报
      `TypeError: 'list' object is not callable`，而且报错位置和出错原因隔得很远。

      JS / Java 里同样能遮蔽，但影响范围通常限于当前块，
      不会像 Python 这样污染整个模块。
