# feature 池 —— 数据与抽象板块的**知识点清单**，与基准无关，全站唯一。
#
# 板块定位（docs/完整项目架构.md §2.4）：读完「基础表达」能看懂对方在写什么，
# 这一板块是**能照着改写** —— 模块怎么切、错误怎么传、容器怎么选、对象怎么组织。
#
# `group` 是**存放组**，即内容文件名：content/languages/<语言>/model/<group>.yaml。
# 章节分组见同目录下的 javascript.yaml / python.yaml / java.yaml。
#
# 池里的顺序不表达任何东西（展示顺序全在章节分组里），这里只求好读。

section: model
title: 数据与抽象

features:
  # ── modules 模块与导入 ──────────────────────────────────────────
  - id: module-unit
    group: modules
    title: 模块与文件边界
    kind: concept
    summary: 什么是一个模块，文件与模块是不是一回事

  - id: export-import
    group: modules
    title: 导出与导入
    kind: syntax
    summary: 一个名字怎么从别的模块取过来

  - id: default-vs-named
    group: modules
    title: 默认导出与具名导出
    kind: syntax
    summary: 导出的两种形态，以及导入时的名字绑定

  - id: namespace-alias
    group: modules
    title: 命名空间与别名
    kind: syntax
    summary: 怎么避免重名，怎么给模块起短名

  - id: module-resolution
    group: modules
    title: 模块解析与查找路径
    kind: behavior
    summary: 写下的路径最终落在哪个文件上

  # ── errors 错误处理 ─────────────────────────────────────────────
  - id: throw-raise
    group: errors
    title: 抛出错误
    kind: syntax
    summary: 怎么把一件坏事报告给调用方

  - id: try-catch
    group: errors
    title: 捕获与匹配
    kind: syntax
    summary: 在哪里接住，能不能按类型分支

  - id: finally-cleanup
    group: errors
    title: 清理与资源释放
    kind: behavior
    summary: 出了异常也要执行的那段收尾

  - id: error-types
    group: errors
    title: 错误类型体系
    kind: concept
    summary: 错误是有类型的对象，还是随便什么值

  - id: custom-error
    group: errors
    title: 自定义错误
    kind: syntax
    summary: 定义自己的错误类型并携带上下文

  - id: error-propagation
    group: errors
    title: 传播与包装
    kind: behavior
    summary: 不想处理时怎么往上传，怎么保留原因

  # ── collections 集合与容器 ──────────────────────────────────────
  - id: list-array
    group: collections
    title: 列表与数组
    kind: concept
    summary: 有序序列的形态、定长与否、增删代价

  - id: map-dict
    group: collections
    title: 映射与字典
    kind: concept
    summary: 键值集合，键的约束与遍历顺序

  - id: set
    group: collections
    title: 集合
    kind: concept
    summary: 去重与成员判定

  - id: tuple-record
    group: collections
    title: 元组与记录
    kind: concept
    summary: 表达「一组固定的东西」的轻量形态

  - id: collection-mutability
    group: collections
    title: 容器的可变性
    kind: behavior
    summary: 容器能不能改，改了谁会看见

  - id: slicing
    group: collections
    title: 切片与拷贝
    kind: behavior
    summary: 取一段是复制还是视图，深浅到什么程度

  # ── iteration 迭代与生成 ────────────────────────────────────────
  # 与 express/control-flow 的 `iteration-protocol` 分工：那里讲「怎么遍历一个已有对象」，
  # 这里讲「怎么造出一个可遍历的东西」。
  - id: generator-yield
    group: iteration
    title: 生成器与 yield
    kind: concept
    summary: 能暂停的函数，以及它产出的序列

  - id: comprehension
    group: iteration
    title: 推导式与批量构造
    kind: syntax
    summary: 从一个序列造出另一个序列的紧凑写法

  - id: lazy-evaluation
    group: iteration
    title: 惰性求值与流
    kind: concept
    summary: 算到用的时候才算，以及无限序列

  - id: destructuring
    group: iteration
    title: 解构与解包
    kind: syntax
    summary: 把一组值拆到几个名字里

  # ── objects 对象与类 ────────────────────────────────────────────
  - id: class-declaration
    group: objects
    title: 类与对象定义
    kind: syntax
    summary: 定义一个类型有几种写法

  - id: constructor
    group: objects
    title: 构造与初始化
    kind: syntax
    summary: 实例从哪来，初始化写在哪

  - id: fields-and-properties
    group: objects
    title: 字段与属性
    kind: syntax
    summary: 挂在实例上的数据怎么声明与访问

  - id: methods-and-receiver
    group: objects
    title: 方法与 this / self
    kind: behavior
    summary: 方法里的「当前对象」是怎么来的

  - id: inheritance
    group: objects
    title: 继承
    kind: concept
    summary: 单继承、多继承，以及继承之外的做法

  - id: access-control
    group: objects
    title: 可见性与封装
    kind: concept
    summary: 谁能看见这个成员，靠什么约束

  # ── abstraction 抽象与多态 ──────────────────────────────────────
  - id: interface
    group: abstraction
    title: 接口与协议
    kind: concept
    summary: 只描述「能做什么」而不给实现

  - id: abstract-class
    group: abstraction
    title: 抽象类
    kind: concept
    summary: 半成品的类，与接口的边界在哪

  - id: mixin-trait
    group: abstraction
    title: 混入与特征
    kind: concept
    summary: 把一份实现横向复用给多个类型

  - id: duck-typing
    group: abstraction
    title: 结构化类型与鸭子类型
    kind: concept
    summary: 类型是「名字」还是「形状」
